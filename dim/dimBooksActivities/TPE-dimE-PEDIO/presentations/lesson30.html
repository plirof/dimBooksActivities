    { type:"concept", text:"Η χρήση του διαδικτύου σε όλο τον κόσμο δημιούργησε νέες ανάγκες για τη διανομή των έργων — φωτογραφίες, βιβλία, μουσικά έργα. Εκατομμύρια έργα διατίθενται πια και σε ψηφιακή μορφή μέσω του διαδικτύου. Η ψηφιακή αναπαραγωγή των έργων έφερε τον διαχωρισμό του αντιγράφου από το πρωτότυπο, διευκολύνοντας την αναδιανομή τους. Έτσι, το 2001 στις Ηνωμένες Πολιτείες Αμερικής εμφανίστηκε η άδεια CC (Creative Commons), από τη μη κερδοσκοπική οργάνωση Creative Commons (https://creativecommons.org/)." },
    { type:"concept", text:"Η άδεια Creative Commons (CC) είναι ένα είδος άδειας που αφορά την ελεύθερη διακίνηση των έργων, ρυθμίζοντας τα δικαιώματα πνευματικής ιδιοκτησίας που δηλώνουν οι δημιουργοί. Ο δημιουργός ενός έργου έχει τη δυνατότητα, με σχετική δήλωσή του (εικονίδια CC πάνω στο έργο του, σε μορφή εικόνας), να ορίσει τα δικαιώματα που σχετίζονται με την εκμετάλλευση και την αναδιαμόρφωση του έργου του. Η άδεια CC προσφέρει στον δημιουργό μεγάλη ευελιξία ως προς τα δικαιώματα που θα παραχωρήσει, ενώ παράλληλα υπάρχει συγκεκριμένο νομικό πλαίσιο που προκύπτει από τη δήλωσή του για τους όρους εκμετάλλευσης." },
    { type:"list", title:"Χαρακτηριστικά των αδειών Creative Commons", items:["Προσφέρονται δωρεάν μέσω διαδικτύου","Δεν είναι αποκλειστικές","Επιτρέπουν την ανταλλαγή έργων μέσω του διαδικτύου","Η χρήση τους δεν προϋποθέτει την πλήρη παραίτηση του δικαιούχου από τα δικαιώματα εκμετάλλευσης του έργου του","Κάποιες κατηγορίες έργων που μπορούν να πάρουν άδεια CC: φωτογραφίες, βιβλία, μουσικά έργα"] },

var slideTexts = [
  "Ενότητα 5η: Ψηφιακός Πολίτης (Μαθήματα 28-30). Μάθημα 30ό: Οι άδειες χρήσης πνευματικών δικαιωμάτων CC (Creative Commons)",
  "Στο μάθημα αυτό θα μάθεις. Να αναγνωρίζω τις άδειες χρήσης μέσω του οργανισμού ελεύθερης διακίνησης πνευματικών δικαιωμάτων CC (Creative Commons)",
  "Η χρήση του διαδικτύου σε όλο τον κόσμο δημιούργησε νέες ανάγκες για τη διανομή των έργων — φωτογραφίες, βιβλία, μουσικά έργα. Εκατομμύρια έργα διατίθενται πια και σε ψηφιακή μορφή μέσω του διαδικτύου. Η ψηφιακή αναπαραγωγή των έργων έφερε τον διαχωρισμό του αντιγράφου από το πρωτότυπο, διευκολύνοντας την αναδιανομή τους. Έτσι, το 2001 στις Ηνωμένες Πολιτείες Αμερικής εμφανίστηκε η άδεια CC (Creative Commons), από τη μη κερδοσκοπική οργάνωση Creative Commons (https://creativecommons.org/).",
  "Η άδεια Creative Commons (CC) είναι ένα είδος άδειας που αφορά την ελεύθερη διακίνηση των έργων, ρυθμίζοντας τα δικαιώματα πνευματικής ιδιοκτησίας που δηλώνουν οι δημιουργοί. Ο δημιουργός ενός έργου έχει τη δυνατότητα, με σχετική δήλωσή του (εικονίδια CC πάνω στο έργο του, σε μορφή εικόνας), να ορίσει τα δικαιώματα που σχετίζονται με την εκμετάλλευση και την αναδιαμόρφωση του έργου του. Η άδεια CC προσφέρει στον δημιουργό μεγάλη ευελιξία ως προς τα δικαιώματα που θα παραχωρήσει, ενώ παράλληλα υπάρχει συγκεκριμένο νομικό πλαίσιο που προκύπτει από τη δήλωσή του για τους όρους εκμετάλλευσης.",
