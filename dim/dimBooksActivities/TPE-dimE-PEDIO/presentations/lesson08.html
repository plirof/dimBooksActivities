<!DOCTYPE html>
<!--
  slide_TTS_template.html — minimal template for a TPE-dim lesson presentation.

  Shared CSS + runtime JS live OUTSIDE this file (loaded at the bottom); each
  lesson file holds ONLY its own data (LESSON + slideTexts) plus this skeleton.

  To create lesson NN:

    1. Copy this file to  TPE-dimX-PEDIO/presentations/lessonNN.html
    2. Edit LESSON below (number, unit, slides[]).
       First slide MUST be type:"title", last slide MUST be type:"assessment".
    3. Keep slideTexts[] in sync with LESSON.slides — pregen.AppImage reads it.
       Entries mirror getSlideText() in tts/scripts/presentation.js:
         title       -> unit + ". " + title (+ ". " + sub if present)
         text        -> text
         steps       -> (title? title+". ":"") + steps.join(". ")
         list        -> (title? title+". ":"") + items.join(". ")
         concept     -> text
         practice    -> (title||"Συζητήστε") + ". " + items.join(". ")
         assessment  -> check + ". " + end   (✦/✧ stripped; ". Τέλος" if no end)
   4. Generate MP3s:
   **IMPORTANT: If updating an existing presentation, delete old MP3s first:**
   rm TPE-dimX-PEDIO/presentations/audio/lessonNN/*.mp3

   ./tts/pregen.AppImage TPE-dimX-PEDIO/presentations/lessonNN.html \
                                 TPE-dimX-PEDIO/presentations/audio/lessonNN
   5. Open lessonNN.html in a browser. URL params: ?speed=0.7  ?mode=manual

  Do NOT re-inline CSS or runtime JS here — edit tts/scripts/presentation.css
  or tts/scripts/presentation.js instead (changes apply to every lesson).
-->
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Παρουσίαση</title>
<link rel="stylesheet" href="../../tts/scripts/presentation.css">
</head>
<body>

<!-- ===== BEGIN EDIT THIS SECTION ===== -->
<script>
var LESSON = {
  number: 8,
  unit: "Ενότητα 1η: Αλγόριθμοι και Προγραμματισμός (Μαθήματα 1-11)",
  slides: [
    { type:"title", title:"Μάθημα 8ο: Υποπρογράμματα" },
    { type:"list", title:"Στόχοι μαθήματος", items:["Να δημιουργείς υποπρογράμματα","Να χρησιμοποιείς υποπρογράμματα ως νέες εντολές του προγράμματός σου","Να στρίβεις τους χαρακτήρες προς τα αριστερά και προς τα δεξιά","Να δημιουργείς μεταβλητές που αλλάζουν με γραμμή κύλισης"] },
    { type:"concept", text:"Στο Scratch μπορούμε να φτιάχνουμε νέες εντολές που ονομάζονται υποπρογράμματα. Κάθε υποπρόγραμμα ορίζεται με ένα όνομα και ένα σύνολο εντολών. Όταν θέλουμε να εκτελεστούν οι εντολές του υποπρογράμματος, χρησιμοποιούμε το όνομά του αντί να επαναλαμβάνουμε όλες τις εντολές του." },
    { type:"concept", text:"Τα υποπρογράμματα κάνουν τα προγράμματά μας μικρότερα και πιο ευανάγνωστα. Έτσι, μπορούμε να οργανώνουμε καλύτερα τον κώδικά μας και να βρίσκουμε πιο εύκολα τι κάνει κάθε μέρος του προγράμματος. Επιπλέον, αν θέλουμε να αλλάξουμε κάτι, το κάνουμε μόνο μία φορά μέσα στο υποπρόγραμμα και αυτό εφαρμόζεται παντού όπου το χρησιμοποιούμε." },
    { type:"list", title:"Βήματα για να δημιούργησεις τον χορευτικό χαρακτήρα", items:["Δημιούργησε ένα νέο έργο στο Scratch","Διάλεξε ένα υπόβαθρο που δείχνει μία σκηνή, π.χ. το διπλανό","Σβήσε τη γατούλα και φέρε έναν νέο χαρακτήρα από την κατηγορία «Χορός», π.χ. τον διπλανό","Δώσε στον χαρακτήρα σου ένα όνομα, π.χ. Αλεξία","Άλλαξε το μέγεθός του ώστε να χωράει πάνω στη σκηνή"] },
    { type:"concept", text:"Αλλάζοντας τις ενδυμασίες της Αλεξίας μέσα σε μία εντολή επανάληψης, αυτή μοιάζει σαν να χορεύει. Για να κάνεις πιο αργό τον ρυθμό εναλλαγής των ενδυμασιών θα χρησιμοποιήσεις μία εντολή «περίμενε...» μέσα στην επανάληψη." },
    { type:"concept", text:"Για να μπορέσεις να ελέγξεις τον ρυθμό της Αλεξίας θα δημιούργησεις μία νέα μεταβλητή στο έργο σου, την «Ρυθμός». Φτιάξε την εντολή «περίμενε» χρησιμοποιώντας τη νέα σου μεταβλητή και τον τελεστή της διαίρεσης από τους τελεστές, όπως: περιμένε (10 / Ρυθμός)." },
    { type:"concept", text:"Κάνε δεξί κλικ πάνω στη μεταβλητή «Ρυθμός» που εμφανίζεται πάνω στη σκηνή και επίλεξε να εμφανίζεται σαν μία γραμμή κύλισης. Με τον τρόπο αυτό μπορείς να αλλάζεις τον ρυθμό του χορού της Αλεξίας κινώντας τον μεταβολέα στη γραμμή κύλισης της μεταβλητής." },
    { type:"list", title:"Δημιουργία υποπρογράμματος", items:["Πήγαινε στην κατηγορία «Μπλοκ» και πάτησε πάνω στην «Κάντε ένα μπλοκ»","Δώσε όνομα εντολής, π.χ. «Χορός», και πάτα το κουμπί ΟΚ","Κάτω από κει θα βάλεις τις εντολές που θέλεις να εκτελούνται για τον χορό της Αλεξίας","Μπορείς να χρησιμοποιήσεις την εντολή «Χορός», που θα τη βρεις στην ομάδα εντολών «Μπλοκ», σε διάφορα σημεία του προγράμματός σου"] },
    { type:"assessment", check:"Μπορώ να δημιουργώ και να χρησιμοποιώ υποπρογράμματα και να αλλάζω μια μεταβλητή με τη γραμμή κύλισης", end:"Μπράβο! ✦ Τέλος ✦" }
  ]
};

// Static array read by pregen.AppImage. Keep in sync with LESSON.slides above.
var slideTexts = [
  "Ενότητα 1η: Αλγόριθμοι και Προγραμματισμός (Μαθήματα 1-11). Μάθημα 8ο: Υποπρογράμματα",
  "Στόχοι μαθήματος. Να δημιουργείς υποπρογράμματα. Να χρησιμοποιείς υποπρογράμματα ως νέες εντολές του προγράμματός σου. Να στρίβεις τους χαρακτήρες προς τα αριστερά και προς τα δεξιά. Να δημιουργείς μεταβλητές που αλλάζουν με γραμμή κύλισης",
  "Στο Scratch μπορούμε να φτιάχνουμε νέες εντολές που ονομάζονται υποπρογράμματα. Κάθε υποπρόγραμμα ορίζεται με ένα όνομα και ένα σύνολο εντολών. Όταν θέλουμε να εκτελεστούν οι εντολές του υποπρογράμματος, χρησιμοποιούμε το όνομά του αντί να επαναλαμβάνουμε όλες τις εντολές του.",
  "Τα υποπρογράμματα κάνουν τα προγράμματά μας μικρότερα και πιο ευανάγνωστα. Έτσι, μπορούμε να οργανώνουμε καλύτερα τον κώδικά μας και να βρίσκουμε πιο εύκολα τι κάνει κάθε μέρος του προγράμματος. Επιπλέον, αν θέλουμε να αλλάξουμε κάτι, το κάνουμε μόνο μία φορά μέσα στο υποπρόγραμμα και αυτό εφαρμόζεται παντού όπου το χρησιμοποιούμε.",
  "Βήματα για να δημιούργησεις τον χορευτικό χαρακτήρα. Δημιούργησε ένα νέο έργο στο Scratch. Διάλεξε ένα υπόβαθρο που δείχνει μία σκηνή, π.χ. το διπλανό. Σβήσε τη γατούλα και φέρε έναν νέο χαρακτήρα από την κατηγορία «Χορός», π.χ. τον διπλανό. Δώσε στον χαρακτήρα σου ένα όνομα, π.χ. Αλεξία. Άλλαξε το μέγεθός του ώστε να χωράει πάνω στη σκηνή",
  "Αλλάζοντας τις ενδυμασίες της Αλεξίας μέσα σε μία εντολή επανάληψης, αυτή μοιάζει σαν να χορεύει. Για να κάνεις πιο αργό τον ρυθμό εναλλαγής των ενδυμασιών θα χρησιμοποιήσεις μία εντολή «περίμενε...» μέσα στην επανάληψη.",
  "Για να μπορέσεις να ελέγξεις τον ρυθμό της Αλεξίας θα δημιούργησεις μία νέα μεταβλητή στο έργο σου, την «Ρυθμός». Φτιάξε την εντολή «περίμενε» χρησιμοποιώντας τη νέα σου μεταβλητή και τον τελεστή της διαίρεσης από τους τελεστές, όπως: περιμένε (10 / Ρυθμός).",
  "Κάνε δεξί κλικ πάνω στη μεταβλητή «Ρυθμός» που εμφανίζεται πάνω στη σκηνή και επίλεξε να εμφανίζεται σαν μία γραμμή κύλισης. Με τον τρόπο αυτό μπορείς να αλλάζεις τον ρυθμό του χορού της Αλεξίας κινώντας τον μεταβολέα στη γραμμή κύλισης της μεταβλητής.",
  "Δημιουργία υποπρογράμματος. Πήγαινε στην κατηγορία «Μπλοκ» και πάτησε πάνω στην «Κάντε ένα μπλοκ». Δώσε όνομα εντολής, π.χ. «Χορός», και πάτα το κουμπί ΟΚ. Κάτω από κει θα βάλεις τις εντολές που θέλεις να εκτελούνται για τον χορό της Αλεξίας. Μπορείς να χρησιμοποιήσεις την εντολή «Χορός», που θα τη βρεις στην ομάδα εντολών «Μπλοκ», σε διάφορα σημεία του προγράμματός σου",
  "Μπορώ να δημιουργώ και να χρησιμοποιώ υποπρογράμματα και να αλλάζω μια μεταβλητή με τη γραμμή κύλισης. Μπράβο! Τέλος"
];
</script>
<!-- ===== END EDIT SECTION ===== -->

<div id="slides"></div>
<div id="speedBadge"></div>
<div id="dots"></div>

<div id="controls">
  <button id="prevBtn" onclick="navigate(-1)">◀</button>
  <span id="counter"></span>
  <button id="nextBtn" onclick="navigate(1)">▶</button>
  <button id="playBtn" onclick="togglePlay()">⏸</button>
  <button id="muteBtn" onclick="toggleMute()">🔊</button>
</div>

<script src="../../tts/scripts/tts.js"></script>
<script src="../../tts/scripts/presentation.js"></script>
</body>
</html>
