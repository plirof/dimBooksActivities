var LESSON = {

  slides: [
    { type:"title", title:"Μάθημα 5ο: Μεταβλητές για πόντους και ζωές στο Scratch" },
    { type:"list", title:"Στο μάθημα αυτό θα μάθεις", items:["Να χρησιμοποιείς στο παιχνίδι σου πόντους και ζωές","Να δημιουργείς νέες μεταβλητές στο Scratch","Να βρίσκεις νέους ήχους στη βιβλιοθήκη ήχων"] },
    { type:"concept", text:"Σε αυτό το μάθημα θα δούμε πώς χρησιμοποιούνται οι μεταβλητές στον προγραμματισμό για να αποθηκεύουν και να αναπαριστούν δεδομένα, όπως οι πόντοι που κερδίζει ο παίκτης ή οι ζωές που χάνει. Οι μεταβλητές είναι σαν κουτάκια που αποθηκεύουν πληροφορίες: μία μεταβλητή έχει ένα όνομα, π.χ. «πόντοι», και αποθηκεύει μία τιμή. Καθώς παίζεις το παιχνίδι η τιμή των μεταβλητών μπορεί να αλλάζει, και αυτές οι αλλαγές κάνουν το παιχνίδι να εξελίσσεται με διαφορετικούς τρόπους κάθε φορά και να γίνεται πιο ενδιαφέρον." },
    { type:"steps", title:"Δημιουργώ τη μεταβλητή «πόντοι»", steps:["① Πήγαινε στην κατηγορία Μεταβλητές και πάτησε πάνω στη «Δημιουργία μεταβλητής»","② Δώσε στη μεταβλητή σου το όνομα «πόντοι» και πάτησε το κουμπί ΟΚ","③ Βεβαιώσου ότι το κουτάκι είναι μπλε και όχι άσπρο πριν από το όνομα, ώστε να εμφανίζεται πάνω στη σκηνή","④ Δώσε όποια τιμή θέλεις με την εντολή «όρισε πόντους σε…»: βάλε αριθμό στο κυκλάκι και κάνε κλικ στην εντολή"] },
