    { type:"title", title:"Μάθημα 20ό: Τεχνητή νοημοσύνη και μηχανική μάθηση" },
    { type:"list", title:"Στο μάθημα αυτό θα μάθεις", items:["Ότι τα συστήματα τεχνητής νοημοσύνης εκπαιδεύονται με μεγάλο όγκο δεδομένων για να παίρνουν αποφάσεις","Ότι τα συστήματα μηχανικής μάθησης στηρίζονται σε αλγορίθμους αναγνώρισης μοτίβων ή και σχέσεων στα δεδομένα"] },
    { type:"text", text:"Θυμάμαι ότι: με τον υπολογιστή επεξεργαζόμαστε εύκολα και γρήγορα πολλά δεδομένα για να λύσουμε προβλήματα." },
    { type:"list", title:"Παραδείγματα από την καθημερινή ζωή", items:["Ο Ήρωνας χρησιμοποιεί μία ψηφιακή υπηρεσία για να ακούει μουσική: η εφαρμογή τού προτείνει τραγούδια που του αρέσουν","Η μητέρα της Υπατίας αγοράζει βιβλία και άλλα αντικείμενα από μία ιστοσελίδα: όταν συνδέεται, λαμβάνει μηνύματα και διαφημίσεις για προϊόντα που την ενδιαφέρουν","Η οικογένεια του Ήρωνα βλέπει ταινίες σε ένα κανάλι ψηφιακής τηλεόρασης: το κανάλι τούς προτείνει ταινίες που τους αρέσουν"] },
    { type:"concept", text:"Σε καθένα από αυτά τα παραδείγματα οι εφαρμογές καταγράφουν δεδομένα για τις επιλογές των χρηστών: τι επιλέγουν, τι χρησιμοποιούν, εάν βαθμολογούν θετικά αυτό που χρησιμοποίησαν. Εκπαιδεύονται με βάση τα δεδομένα αυτά για να κάνουν προτάσεις. Οι εφαρμογές αυτές έχουν χαρακτηριστικά τεχνητής νοημοσύνης (Artificial Intelligence): μιμούνται την ανθρώπινη σκέψη. Συγκεντρώνουν μεγάλο όγκο δεδομένων, τα επεξεργάζονται και μαθαίνουν με βάση τα δεδομένα." },
    { type:"text", text:"Ήξερες ότι: υπάρχουν εφαρμογές ψηφιακού βοηθού (chatbot) στις οποίες μπορείς να κάνεις ερωτήσεις και να σου απαντάνε σαν να κάνεις συνομιλία με άνθρωπο; Το ελληνικό δημόσιο έχει τον ψηφιακό βοηθό mAigov που λειτουργεί με τεχνητή νοημοσύνη: μπορείς να πληκτρολογήσεις ή να πεις με ομιλία τις ερωτήσεις σου." },
    { type:"concept", text:"Ένας σημαντικός τομέας της τεχνητής νοημοσύνης είναι η μηχανική μάθηση, που λειτουργεί ως εξής: τροφοδοτούμε την εφαρμογή του υπολογιστή με μεγάλο όγκο δεδομένων, δείχνουμε στην εφαρμογή παραδείγματα από το τι θέλουμε να κάνει, και έτσι αυτή αναγνωρίζει τα κοινά τους στοιχεία και μαθαίνει να εφαρμόζει τη μέθοδο που πετυχαίνει τον στόχο μας." },
    { type:"text", text:"Παράδειγμα: θέλουμε να εκπαιδεύσουμε μία εφαρμογή για να αναγνωρίζει αν ένα ζώο είναι γάτα ή σκύλος. Τροφοδοτούμε την εφαρμογή με εκατό φωτογραφίες γατών και εκατό φωτογραφίες σκύλων, καταγράφοντας κάθε φωτογραφία τι δείχνει. Με τον τρόπο αυτό η εφαρμογή εντοπίζει τα κοινά στοιχεία ανάμεσα σε πολλές διαφορετικές φωτογραφίες γατών, π.χ. το μέγεθος των ματιών και την απόσταση των αφτιών, και ανάλογα για τους σκύλους. Σε κάθε νέα φωτογραφία, η εφαρμογή προσπαθεί να εντοπίσει αν υπάρχουν τα κοινά στοιχεία (τα μοτίβα) που είχαν οι προηγούμενες γάτες ή οι σκύλοι. Έτσι αποφασίζει αν πρόκειται για γάτα ή σκύλο και καταχωρίζει τη νέα φωτογραφία στα δεδομένα της: δηλαδή εκπαιδεύεται. Φαντάσου πόσο καλύτερες αποφάσεις θα έπαιρνε αν την τροφοδοτούσαμε με χιλιάδες φωτογραφίες." },
    { type:"steps", title:"Αλγόριθμος για την πρόταση ταινίας", steps:["① Συγκέντρωσε όλα τα έντυπα ψηφοφορίας","② Βρες ποια ταινία αρέσει στον νέο (τέταρτο) παίκτη","③ Ψάξε στις ψηφοφορίες των τριών παλιών παικτών και κράτησε τις ψηφοφορίες όσων τους άρεσε η ίδια ταινία με τον νέο παίκτη","④ Σύγκρινε στις ψηφοφορίες που κράτησες: ποια άλλη ταινία αρέσει στους περισσότερους; Αυτήν την ταινία να προτείνεις, γιατί μάλλον έχουν ίδιο γούστο με τον νέο παίκτη"] },
    { type:"practice", title:"Δοκίμασε", items:["Παιχνίδι σε ομάδες: τρεις παίκτες είναι παλιοί συνδρομητές ενός καναλιού με παιδικές ταινίες και έχουν ψηφίσει αν τους άρεσαν οι ταινίες, ο τέταρτος είναι νέος συνδρομητής, και οι υπόλοιποι είναι οι υπάλληλοι: συγκεντρώστε τις ψήφους, εφαρμόστε τον αλγόριθμο και προτείνετε στον νέο παίκτη ποια ταινία να δει","Συζητήστε: ο αλγόριθμος προτείνει ταινία με βάση τα δεδομένα — τι θα γινόταν αν οι παλιοί παίκτες ήταν πάρα πολλοί και είχαν ψηφίσει για πολλές ταινίες;","Χρησιμοποίησε την εφαρμογή autodraw: σχεδίασε ένα αντικείμενο, παρατήρησε τις προτάσεις στην πάνω γραμμή και διάλεξε αυτό που ταιριάζει — πώς καταφέρνει η εφαρμογή να προτείνει αυτό που προσπαθείς να σχεδιάσεις;"] },

  ]

  "Στο μάθημα αυτό θα μάθεις. Ότι τα συστήματα τεχνητής νοημοσύνης εκπαιδεύονται με μεγάλο όγκο δεδομένων για να παίρνουν αποφάσεις. Ότι τα συστήματα μηχανικής μάθησης στηρίζονται σε αλγορίθμους αναγνώρισης μοτίβων ή και σχέσεων στα δεδομένα",

  "Παράδειγμα: θέλουμε να εκπαιδεύσουμε μία εφαρμογή για να αναγνωρίζει αν ένα ζώο είναι γάτα ή σκύλος. Τροφοδοτούμε την εφαρμογή με εκατό φωτογραφίες γατών και εκατό φωτογραφίες σκύλων, καταγράφοντας κάθε φωτογραφία τι δείχνει. Με τον τρόπο αυτό η εφαρμογή εντοπίζει τα κοινά στοιχεία ανάμεσα σε πολλές διαφορετικές φωτογραφίες γατών, π.χ. το μέγεθος των ματιών και την απόσταση των αφτιών, και ανάλογα για τους σκύλους. Σε κάθε νέα φωτογραφία, η εφαρμογή προσπαθεί να εντοπίσει αν υπάρχουν τα κοινά στοιχεία (τα μοτίβα) που είχαν οι προηγούμενες γάτες ή οι σκύλοι. Έτσι αποφασίζει αν πρόκειται για γάτα ή σκύλο και καταχωρίζει τη νέα φωτογραφία στα δεδομένα της: δηλαδή εκπαιδεύεται. Φαντάσου πόσο καλύτερες αποφάσεις θα έπαιρνε αν την τροφοδοτούσαμε με χιλιάδες φωτογραφίες.",
  "Αλγόριθμος για την πρόταση ταινίας. ① Συγκέντρωσε όλα τα έντυπα ψηφοφορίας. ② Βρες ποια ταινία αρέσει στον νέο (τέταρτο) παίκτη. ③ Ψάξε στις ψηφοφορίες των τριών παλιών παικτών και κράτησε τις ψηφοφορίες όσων τους άρεσε η ίδια ταινία με τον νέο παίκτη. ④ Σύγκρινε στις ψηφοφορίες που κράτησες: ποια άλλη ταινία αρέσει στους περισσότερους; Αυτήν την ταινία να προτείνεις, γιατί μάλλον έχουν ίδιο γούστο με τον νέο παίκτη",
  "Δοκίμασε. Παιχνίδι σε ομάδες: τρεις παίκτες είναι παλιοί συνδρομητές ενός καναλιού με παιδικές ταινίες και έχουν ψηφίσει αν τους άρεσαν οι ταινίες, ο τέταρτος είναι νέος συνδρομητής, και οι υπόλοιποι είναι οι υπάλληλοι: συγκεντρώστε τις ψήφους, εφαρμόστε τον αλγόριθμο και προτείνετε στον νέο παίκτη ποια ταινία να δει. Συζητήστε: ο αλγόριθμος προτείνει ταινία με βάση τα δεδομένα — τι θα γινόταν αν οι παλιοί παίκτες ήταν πάρα πολλοί και είχαν ψηφίσει για πολλές ταινίες; Χρησιμοποίησε την εφαρμογή autodraw: σχεδίασε ένα αντικείμενο, παρατήρησε τις προτάσεις στην πάνω γραμμή και διάλεξε αυτό που ταιριάζει — πώς καταφέρνει η εφαρμογή να προτείνει αυτό που προσπαθείς να σχεδιάσεις;",
