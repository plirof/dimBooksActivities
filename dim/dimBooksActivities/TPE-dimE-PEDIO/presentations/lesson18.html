    { type:"list", title:"Στο μάθημα αυτό θα μάθεις", items:["Να κάνεις απλές αριθμητικές πράξεις με συναρτήσεις και τύπους στο υπολογιστικό φύλλο","Να αντιγράφεις δεδομένα και αριθμητικές πράξεις στο υπολογιστικό φύλλο","Να μορφοποιείς τα δεδομένα στο υπολογιστικό φύλλο"] },
    { type:"text", text:"Θυμάμαι ότι: η Υπατία και ο Ήρωνας εισάγουν δεδομένα στο υπολογιστικό φύλλο για να τα επεξεργαστούν. Σήμερα βοηθάνε τη δασκάλα της τάξης για την οργάνωση μίας σχολικής εκδρομής. Άνοιξε το υπολογιστικό φύλλο του προηγούμενου μαθήματος με τα δεδομένα για την επιλογή προορισμού της εκδρομής." },
    { type:"concept", text:"Με το υπολογιστικό φύλλο μπορείς εύκολα και γρήγορα να κάνεις υπολογισμούς. Για τον σκοπό αυτό υπάρχουν πολλές συναρτήσεις. Συνήθως, μία συνάρτηση κάνει πράξεις σε ένα κελί ή σε μία περιοχή κελιών. Παράδειγμα: η συνάρτηση =SUM(B2:B3) εφαρμόζει την πράξη άθροισμα στην περιοχή κελιών που βρίσκεται μέσα στην παρένθεση." },
    { type:"steps", title:"Υπολογίζω ένα άθροισμα", steps:["① Κάνω κλικ στο κελί όπου θα μπει το άθροισμα (π.χ. το B4)","② Κάνω κλικ στο εικονίδιο Σ","③ Εμφανίζεται η συνάρτηση: προτείνει μία γειτονική περιοχή κελιών με αριθμούς — την αποδέχομαι με Enter, αλλιώς επιλέγω με το ποντίκι άλλη περιοχή","④ Μετά το Enter, στο κελί B4 εμφανίζεται το αποτέλεσμα — στη γραμμή εισαγωγής, όταν ενεργό κελί είναι το B4, εμφανίζεται η συνάρτηση με την οποία υπολογίστηκε το αποτέλεσμα"] },

    { type:"concept", text:"Για να υπολογίσεις το κόστος της εκδρομής για κάθε παιδί, χρησιμοποιείς έναν τύπο για αριθμητικές πράξεις. Ξεκινάς στο ενεργό κελί γράφοντας πρώτα το σύμβολο = και μετά γράφεις την αριθμητική πράξη που θέλεις να υπολογιστεί. Σε έναν τύπο, αντί να πληκτρολογείς τον πρώτο ή τον δεύτερο αριθμό, είναι καλύτερο να κάνεις κλικ στο κελί που περιέχει τον αριθμό. Έτσι, αν μελλοντικά αλλάξεις τον αριθμό ενός κελιού, αυτόματα θα αλλάξει και το αποτέλεσμα του τύπου που τον χρησιμοποιεί. Τα σύμβολα των πράξεων είναι: + για πρόσθεση, − για αφαίρεση, * για πολλαπλασιασμό, / για διαίρεση." },

  "Παράδειγμα: πόσα χρήματα θα πληρώσει κάθε παιδί για το λεωφορείο; Απάντηση: 5 ευρώ. Τι θα γίνει όμως αν εφαρμοστεί έκπτωση και το λεωφορείο στοιχίσει 88 ευρώ; Μόλις γράψεις 88 στο κελί E2, το νέο αποτέλεσμα, 4 ευρώ, εμφανίζεται αυτόματα στο κελί E3 — γιατί κατά τη δημιουργία του τύπου χρησιμοποιήθηκε το κελί E2 και όχι ο αριθμός 110. Μόλις δημιούργησεις τον τύπο και πατήσεις Enter, εμφανίζεται το αποτέλεσμά του.",
  "Αντιγράφω αυτόματα έναν τύπο. ① Κάνω κλικ στο κελί D7 που έχει τον τύπο. ② Παρατηρώ ότι στην κάτω δεξιά γωνία του ενεργού κελιού εμφανίζεται μία τελεία — τοποθετώ εκεί τον δείκτη του ποντικιού, που παίρνει τη μορφή +. ③ Με τον δείκτη + κάνω κλικ και σύρω τον τύπο μέχρι το κελί D9. ④ Αντιγράφεται ο τύπος και όχι το αποτέλεσμα: στο κελί D8 θα γίνει η διαίρεση C8/B8 και στο D9 η διαίρεση C9/B9",
