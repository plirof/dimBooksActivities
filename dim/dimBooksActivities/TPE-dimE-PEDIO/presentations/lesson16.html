    { type:"concept", text:"Υπάρχουν πολλές ερωτήσεις που μπορούν να απαντηθούν με επεξεργασία δεδομένων. Π.χ. πόσοι κάτοικοι της χώρας χρησιμοποιούν το διαδίκτυο, σε ποιο μέρος γίνονται συχνά σεισμοί, σε ποιο μέρος βρέχει σπάνια, ποια προϊόντα αγοράζουν οι άνθρωποι για τα Χριστούγεννα, ποιον τρόπο επιλέγουμε για τη θέρμανση του σπιτιού. Τέτοιους πίνακες με δεδομένα δημοσιεύουν η Στατιστική Υπηρεσία, τα υπουργεία, η Ευρωπαϊκή Ένωση και άλλοι φορείς: για τις εκλογές, τον καιρό, τους σεισμούς, τις τιμές των προϊόντων, τις συνήθειες των κατοίκων, τις πωλήσεις, την κατανάλωση ενέργειας, τον τουρισμό και άλλα. Έτσι μπορούμε να συγκεντρώσουμε δημοσιευμένα δεδομένα από το διαδίκτυο, βιβλία και άλλες πηγές." },
