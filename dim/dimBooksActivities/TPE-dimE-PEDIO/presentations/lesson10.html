    { type:"text", text:"Ο Αντρέας είναι αθλητής του μπάσκετ. Συμμετέχει στην ομάδα μπάσκετ με αμαξίδιο και η ομάδα του έχει κερδίσει πολλούς τίτλους. Είναι πολύ εύστοχος στις βολές και οι φίλοι του ζητωκραυγάζουν κάθε φορά που πετυχαίνει καλάθι. Φτιάξε στο Scratch ένα νέο έργο στο οποίο να αναπαριστάς πώς κινείται ο Αντρέας στο γήπεδο και πώς ρίχνει βολές στο καλάθι." },

    { type:"concept", text:"Με τη βοήθεια της ανταλλαγής μηνυμάτων, τα αντικείμενα «επικοινωνούν» και «συνεργάζονται» μεταξύ τους. Μπορούμε, για παράδειγμα, να φτιάξουμε έναν διάλογο ανάμεσα σε δύο ήρωες: μόλις ο πρώτος τελειώσει να μιλάει, στέλνει ένα μήνυμα στον δεύτερο για να ξεκινήσει εκείνος, και όταν τελειώσει, στέλνει με τη σειρά του μήνυμα πίσω στον πρώτο. Έτσι οργανώνουμε καλύτερα τη σειρά με την οποία γίνονται τα πράγματα και πετυχαίνουμε την αλληλεπίδραση των αντικειμένων στο έργο μας." },

  "Στήνω το έργο. ① Θα χρειαστείς ένα νέο υπόβαθρο γηπέδου, μία κατάλληλη μορφή για τον Αντρέα, μία μπάλα του μπάσκετ και ένα οποιοδήποτε κουμπί — δώσε σωστά ονόματα στα αντικείμενά σου. ② Μείωσε το μέγεθος των αντικειμένων «Μπάλα» και «Καλάθι» και τοποθέτησέ τα σύροντάς τα ακριβώς πάνω από το καλάθι του υπόβαθρου. ③ Στις ιδιότητες των αντικειμένων κάνε κλικ πάνω στο δεύτερο σύμβολο για να εξαφανιστούν και τα δύο από τη σκηνή — τα αντικείμενα συνεχίζουν να υπάρχουν, απλώς δεν εμφανίζονται",
