<!DOCTYPE html>
<!--
  slide_TTS_template.html — minimal template for a TPE-dim lesson presentation.

  Shared CSS + runtime JS live OUTSIDE this file (loaded at the bottom); each
  lesson file holds ONLY its own data (LESSON + slideTexts) plus this skeleton.

  To create lesson NN:

    1. Copy this file to  TPE-dimX-PEDIO/presentations/lessonNN.html
    2. Edit LESSON below (number, unit, slides[]).
       First slide MUST be type:"title", last slide MUST be type:"assessment".
    3. Keep slideTexts[] in sync with LESSON.slides — pregen.AppImage reads it.
       Entries mirror getSlideText() in tts/scripts/presentation.js:
         title       -> unit + ". " + title (+ ". " + sub if present)
         text        -> text
         steps       -> (title? title+". ":"") + steps.join(". ")
         list        -> (title? title+". ":"") + items.join(". ")
         concept     -> text
         practice    -> (title||"Συζητήστε") + ". " + items.join(". ")
         assessment  -> check + ". " + end   (✦/✧ stripped; ". Τέλος" if no end)
   4. Generate MP3s:
   **IMPORTANT: If updating an existing presentation, delete old MP3s first:**
   rm TPE-dimX-PEDIO/presentations/audio/lessonNN/*.mp3

   ./tts/pregen.AppImage TPE-dimX-PEDIO/presentations/lessonNN.html \
                                 TPE-dimX-PEDIO/presentations/audio/lessonNN
   5. Open lessonNN.html in a browser. URL params: ?speed=0.7  ?mode=manual

  Do NOT re-inline CSS or runtime JS here — edit tts/scripts/presentation.css
  or tts/scripts/presentation.js instead (changes apply to every lesson).
-->
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Παρουσίαση</title>
<link rel="stylesheet" href="../../tts/scripts/presentation.css">
</head>
<body>

<!-- ===== BEGIN EDIT THIS SECTION ===== -->
<script>
var LESSON = {
  number: 13,
  unit: "Ενότητα 2η: Υπολογιστικά Συστήματα (Μαθήματα 12-15)",
  slides: [
    { type:"title", title:"Μάθημα 13ο: Υλικό υπολογιστή και χρήστες" },
    { type:"text", text:"Θυμάμαι ότι… Το υλικό του υπολογιστή περιλαμβάνει τον επεξεργαστή, τη μνήμη, τον δίσκο αποθήκευσης και τις περιφερειακές συσκευές για είσοδο και έξοδο (ποντίκι, πληκτρολόγιο, κάμερα, μικρόφωνο, ηχεία, οθόνη κ.ά.)." },
    { type:"list", title:"Βασικά εξαρτήματα υλικού", items:["Επεξεργαστής (Processor) - το «μυαλό» του υπολογιστή","Μνήμη (Memory) - αποθηκεύει οτιδήποτε χρησιμοποιεί ο επεξεργαστής","Δίσκος αποθήκευσης (Disk storage) - αποθηκεύει μόνιμα το λογισμικό και τα αρχεία"] },
    { type:"concept", text:"Ο επεξεργαστής είναι το πιο σημαντικό εξάρτημα, το «μυαλό» του υπολογιστή που κάνει την επεξεργασία δεδομένων: αριθμητικές πράξεις, συγκρίσεις, ταξινομήσεις κ.ά. Επίσης, ελέγχει τη συνεργασία όλων των εξαρτημάτων και συσκευών του υλικού." },
    { type:"concept", text:"Η μνήμη συνεργάζεται με τον επεξεργαστή, αποθηκεύει οτιδήποτε χρησιμοποιεί ο επεξεργαστής. Σβήνεται το περιεχόμενό της όταν τερματίζεται η λειτουργία του υπολογιστή." },
    { type:"concept", text:"Ο δίσκος αποθήκευσης αποθηκεύει με μόνιμο τρόπο το λογισμικό (software) και τα αρχεία που χρησιμοποιούμε. Είναι πιο αργός από τη μνήμη." },

    { type:"concept", text:"Σε έναν υπολογιστή μπορούμε να δημιουργήσουμε διαφορετικούς χρήστες. Μέσα από τις ρυθμίσεις του λειτουργικού συστήματος μπορούμε να προσθέσουμε ή να διαγράψουμε έναν χρήστη. Κάθε χρήστης συνδέεται στον υπολογιστή με το όνομα και τον κωδικό του." },
    { type:"concept", text:"Για την αποθήκευση στον δίσκο, για κάθε χρήστη δημιουργείται ένας φάκελος με το όνομά του, στον οποίο δικαίωμα πρόσβασης, δηλαδή δυνατότητα για χρήση, έχει μόνο ο ίδιος. Επίσης, υπάρχει ένας κοινόχρηστος φάκελος στον οποίο έχουν όλοι οι χρήστες δικαίωμα πρόσβασης." },
    { type:"practice", title:"Άσκηση", items:["Η Υπατία και ο Ήρωνας είναι δύο χρήστες του ίδιου υπολογιστή","Στον υπολογιστή υπάρχουν τρεις φάκελοι αρχείων: ΥΠΑΤΙΑ, ΗΡΩΝΑΣ και ΚΟΙΝΟΧΡΗΣΤΑ","Το αρχείο ΟΝΟΜΑΤΑ ΜΑΘΗΤΩΝ ΤΑΞΗΣ βρίσκεται μέσα στον φάκελο ΚΟΙΝΟΧΡΗΣΤΑ","Ποιος χρήστης έχει δικαίωμα να ανοίξει αυτό το αρχείο;"] },
    { type:"assessment", check:"Ποια είναι τα βασικά στοιχεία του υλικού του υπολογιστή και τον τρόπο λειτουργίας τους. Τι είναι τα δικαιώματα των χρηστών του υπολογιστή. Τον ρόλο του λειτουργικού συστήματος για τα δικαιώματα των χρηστών.", end:"Μπράβο! ✦ Τέλος ✦" }
  ]
};

// Static array read by pregen.AppImage. Keep in sync with LESSON.slides above.
var slideTexts = [
  "Ενότητα 2η: Υπολογιστικά Συστήματα (Μαθήματα 12-15). Μάθημα 13ο: Υλικό υπολογιστή και χρήστες",
  "Θυμάμαι ότι… Το υλικό του υπολογιστή περιλαμβάνει τον επεξεργαστή, τη μνήμη, τον δίσκο αποθήκευσης και τις περιφερειακές συσκευές για είσοδο και έξοδο: ποντίκι, πληκτρολόγιο, κάμερα, μικρόφωνο, ηχεία, οθόνη κ.ά.",
  "Βασικά εξαρτήματα υλικού. Επεξεργαστής - το «μυαλό» του υπολογιστή. Μνήμη - αποθηκεύει οτιδήποτε χρησιμοποιεί ο επεξεργαστής. Δίσκος αποθήκευσης - αποθηκεύει μόνιμα το λογισμικό και τα αρχεία.",
  "Ο επεξεργαστής είναι το πιο σημαντικό εξάρτημα, το «μυαλό» του υπολογιστή που κάνει την επεξεργασία δεδομένων: αριθμητικές πράξεις, συγκρίσεις, ταξινομήσεις κ.ά. Επίσης, ελέγχει τη συνεργασία όλων των εξαρτημάτων και συσκευών του υλικού.",
  "Η μνήμη συνεργάζεται με τον επεξεργαστή, αποθηκεύει οτιδήποτε χρησιμοποιεί ο επεξεργαστής. Σβήνεται το περιεχόμενό της όταν τερματίζεται η λειτουργία του υπολογιστή.",
  "Ο δίσκος αποθήκευσης αποθηκεύει με μόνιμο τρόπο το λογισμικό (software) και τα αρχεία που χρησιμοποιούμε. Είναι πιο αργός από τη μνήμη.",
  "Για να γίνει μία εργασία συνεργάζονται οι συσκευές και τα εξαρτήματα του υλικού. Κάθε φορά που ξεκινάμε να χρησιμοποιήσουμε μία εφαρμογή, ο υπολογιστής αναζητά την εφαρμογή στον δίσκο αποθήκευσης, μεταφέρει τις εντολές του προγράμματος στη μνήμη του και ο επεξεργαστής ακολουθεί τις εντολές.",
  "Θυμάμαι ότι… Ο άνθρωπος είναι ο χρήστης του υπολογιστή. Ο χρήστης του υπολογιστή έχει τη δυνατότητα να χρησιμοποιεί το υλικό του υπολογιστή, το λογισμικό και τα αρχεία του δίσκου αποθήκευσης.",
  "Σε έναν υπολογιστή μπορούμε να δημιουργήσουμε διαφορετικούς χρήστες. Μέσα από τις ρυθμίσεις του λειτουργικού συστήματος μπορούμε να προσθέσουμε ή να διαγράψουμε έναν χρήστη. Κάθε χρήστης συνδέεται στον υπολογιστή με το όνομα και τον κωδικό του.",
  "Για την αποθήκευση στον δίσκο, για κάθε χρήστη δημιουργείται ένας φάκελος με το όνομά του, στον οποίο δικαίωμα πρόσβασης, δηλαδή δυνατότητα για χρήση, έχει μόνο ο ίδιος. Επίσης, υπάρχει ένας κοινόχρηστος φάκελος στον οποίο έχουν όλοι οι χρήστες δικαίωμα πρόσβασης.",
  "Άσκηση. Η Υπατία και ο Ήρωνας είναι δύο χρήστες του ίδιου υπολογιστή. Στον υπολογιστή υπάρχουν τρεις φάκελοι αρχείων: ΥΠΑΤΙΑ, ΗΡΩΝΑΣ και ΚΟΙΝΟΧΡΗΣΤΑ. Το αρχείο ΟΝΟΜΑΤΑ ΜΑΘΗΤΩΝ ΤΑΞΗΣ βρίσκεται μέσα στον φάκελο ΚΟΙΝΟΧΡΗΣΤΑ. Ποιος χρήστης έχει δικαίωμα να ανοίξει αυτό το αρχείο;",

</script>
<!-- ===== END EDIT SECTION ===== -->

<div id="slides"></div>
<div id="speedBadge"></div>

<div id="controls">
  <button id="prevBtn" onclick="navigate(-1)">◀</button>
  <span id="counter"></span>
  <button id="nextBtn" onclick="navigate(1)">▶</button>
  <button id="playBtn" onclick="togglePlay()">⏸</button>
  <button id="muteBtn" onclick="toggleMute()">🔊</button>
</div>

<script src="../../tts/scripts/tts.js"></script>
<script src="../../tts/scripts/presentation.js"></script>
</body>
</html>
