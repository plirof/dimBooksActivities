<script>
var LESSON = {
  number: 7,
  unit: "Ενότητα 1η: Αλγόριθμοι και Προγραμματισμός (Μαθήματα 1-11)",
  slides: [
    { type:"title", title:"Μάθημα 7ο: Κερδίζω ή χάνω;" },
    { type:"list", title:"Στο μάθημα αυτό θα μάθεις", items:["Να ελέγχεις αν το παιχνίδι καταλήγει σε νίκη ή ήττα","Να δίνεις το κατάλληλο μήνυμα σε περίπτωση νίκης ή ήττας αντίστοιχα","Να δημιουργείς νέο υπόβαθρο στο Scratch","Να αλλάζεις το υπόβαθρο με προγραμματιστικό τρόπο"] },
    { type:"concept", text:"Ο προγραμματισμός γίνεται σε στάδια. Ξεκίνα τα προγράμματα των χαρακτήρων σου από κάτι απλό και πρόσθεσε σιγά σιγά εντολές μέχρι να φτάσεις στο τελικό πρόγραμμα. Πριν προσθέσεις νέες εντολές και πας σε επόμενο στάδιο, μην ξεχνάς να ελέγχεις το πρόγραμμά σου και να διορθώνεις τα λάθη που μπορεί να υπάρχουν." },
    { type:"concept", text:"Μπορείς να χρησιμοποιήσεις τεχνικές ελέγχου όπως το βήμα-βήμα, όπου εξετάζεις προσεκτικά κάθε εντολή για να καταλάβεις πού προκύπτει το σφάλμα. Επίσης δοκίμασε το παιχνίδι σου με διαφορετικά σενάρια, π.χ. δοκίμασε να κερδίσεις αλλά και να χάσεις, για να βεβαιωθείς ότι λειτουργεί σωστά σε όλες τις περιπτώσεις. Παίξε το παιχνίδι σου αρκετές φορές και, αν χρειαστεί, κάνε κάποιες αλλαγές για να το κάνεις ευκολότερο ή δυσκολότερο." },
    { type:"concept", text:"Το τελευταίο βήμα για την ολοκλήρωση του παιχνιδιού που έφτιαξες είναι να εμφανίζει το σήμα της νίκης ή της ήττας όταν τερματίζει, ανάλογα φυσικά με το αποτέλεσμα. Για να γίνει αυτό θα χρησιμοποιήσουμε το υπόβαθρο του παιχνιδιού. Πάτησε πάνω στο Υπόβαθρο που βρίσκεται κάτω από τη λέξη Σκηνή: θα παρατηρήσεις ότι η μεσαία καρτέλα έχει αλλάξει από «Ενδυμασίες» σε «Υπόβαθρα» — τα υπόβαθρα είναι οι ενδυμασίες της σκηνής." },
    { type:"steps", title:"Φτιάχνω τα υπόβαθρα", steps:["① Άλλαξε το όνομα του πρώτου υπόβαθρου σε «Βυθός», γράφοντας μέσα στο άσπρο κουτάκι με τίτλο «Ενδυμασία»","② Πάτησε δεξί κλικ και διπλασίασε το σκηνικό «Βυθός» — ονόμασε το νέο σκηνικό που δημιούργησες «Νίκη»","③ Πάτησε το εργαλείο κειμένου (γράμμα Τ), κάνε κλικ στον χώρο του υπόβαθρου και γράψε τη λέξη «Κέρδισες!»","④ Κάνε πάλι δεξί κλικ πάνω στο «Νίκη», διπλασίασέ το ξανά, ονόμασε το τρίτο σκηνικό «Ήττα» και άλλαξε το κείμενο σε «Έχασες!»"] },
    { type:"text", text:"Αν θέλεις, άλλαξε το χρώμα των γραμμάτων επιλέγοντας ένα άλλο χρώμα. Κάνε κλικ έξω από το πλαίσιο κειμένου και τράβηξέ το από μία από τις τέσσερις γωνίες για να μεγαλώσεις τα γράμματα στο μέγεθος που θέλεις να εμφανίζονται. Αφού δημιούργησες τα τρία υπόβαθρα, γύρνα πίσω στις μορφές πατώντας μία από αυτές, π.χ. τη μορφή της Έλλης, και μην ξεχάσεις να κάνεις κλικ στην καρτέλα «Κώδικας» για να γυρίσεις στα σενάρια της Έλλης." },
    { type:"steps", title:"Αλλάζω υπόβαθρο με εντολή", steps:["① Βρες στην κατηγορία Όψεις την εντολή «αλλαγή σκηνικού σε…» και φέρε τη μέσα στον χώρο του προγραμματισμού","② Η εντολή αυτή αλλάζει το υπόβαθρο της σκηνής: διάλεξε ένα υπόβαθρο από τη λίστα πατώντας το τριγωνάκι και κάνε κλικ πάνω στην εντολή για να τη δοκιμάσεις","③ Διάλεξε το σκηνικό «Βυθός» και βάλε την εντολή στην αρχή του προγράμματος της Έλλης, κάτω από την εντολή της πράσινης σημαίας","④ Δοκίμασε το πρόγραμμά σου πατώντας πάνω στην πράσινη σημαία"] },
    { type:"concept", text:"Χρησιμοποίησε μία εντολή επιλογής «Εάν… τότε… Αλλιώς» για να εμφανίζεις το σωστό υπόβαθρο στο παιχνίδι. Βάλε την εντολή επιλογής να εκτελείται μετά την εντολή επανάληψης στο πρόγραμμα της Έλλης." },
    { type:"concept", text:"Δες αυτές τις δύο επιλογές εντολών και αποφάσισε ποια πρέπει να χρησιμοποιήσεις. Οι δύο εντολές είναι ισοδύναμες, εκτός από την περίπτωση που η Έλλη αποκτήσει 10 πόντους και χάσει όλες της τις ζωές (ζωές = 0) την ίδια στιγμή, κάτι βέβαια αρκετά σπάνιο. Στην περίπτωση αυτή, αν επιλέξεις την εντολή 1, τότε ο παίκτης θα χάνει στο παιχνίδι, ενώ, αν επιλέξεις την εντολή 2, τότε θα κερδίζει." },
    { type:"practice", title:"Δοκίμασε", items:["Παίξε το παιχνίδι σου και δοκίμασε να εμφανιστεί τόσο το «Κέρδισες!» όσο και το «Έχασες!»","Δοκίμασε το σενάριο να κερδίσεις τους πόντους και να χάσεις τις ζωές την ίδια στιγμή — τι εμφανίζει το παιχνίδι σου;","Δες το βίντεο «Νίκη ή Ήττα» και απάντησε στις Ερωτήσεις σωστού/λάθους και στις Ερωτήσεις πολλαπλών επιλογών"] },
    { type:"assessment", check:"Μπορώ να ελέγχω αν το παιχνίδι μου καταλήγει σε νίκη ή ήττα, να γράφω κείμενο πάνω στο υπόβαθρο και να αλλάζω υπόβαθρο με προγραμματιστικό τρόπο", end:"Μπράβο! ✦ Τέλος ✦" }
  ]
};

// Static array read by pregen.AppImage. Keep in sync with LESSON.slides above.
var slideTexts = [
  "Ενότητα 1η: Αλγόριθμοι και Προγραμματισμός (Μαθήματα 1-11). Μάθημα 7ο: Κερδίζω ή χάνω;",
  "Στο μάθημα αυτό θα μάθεις. Να ελέγχεις αν το παιχνίδι καταλήγει σε νίκη ή ήττα. Να δίνεις το κατάλληλο μήνυμα σε περίπτωση νίκης ή ήττας αντίστοιχα. Να δημιουργείς νέο υπόβαθρο στο Scratch. Να αλλάζεις το υπόβαθρο με προγραμματιστικό τρόπο",
  "Ο προγραμματισμός γίνεται σε στάδια. Ξεκίνα τα προγράμματα των χαρακτήρων σου από κάτι απλό και πρόσθεσε σιγά σιγά εντολές μέχρι να φτάσεις στο τελικό πρόγραμμα. Πριν προσθέσεις νέες εντολές και πας σε επόμενο στάδιο, μην ξεχνάς να ελέγχεις το πρόγραμμά σου και να διορθώνεις τα λάθη που μπορεί να υπάρχουν.",
  "Μπορείς να χρησιμοποιήσεις τεχνικές ελέγχου όπως το βήμα-βήμα, όπου εξετάζεις προσεκτικά κάθε εντολή για να καταλάβεις πού προκύπτει το σφάλμα. Επίσης δοκίμασε το παιχνίδι σου με διαφορετικά σενάρια, π.χ. δοκίμασε να κερδίσεις αλλά και να χάσεις, για να βεβαιωθείς ότι λειτουργεί σωστά σε όλες τις περιπτώσεις. Παίξε το παιχνίδι σου αρκετές φορές και, αν χρειαστεί, κάνε κάποιες αλλαγές για να το κάνεις ευκολότερο ή δυσκολότερο.",
  "Το τελευταίο βήμα για την ολοκλήρωση του παιχνιδιού που έφτιαξες είναι να εμφανίζει το σήμα της νίκης ή της ήττας όταν τερματίζει, ανάλογα φυσικά με το αποτέλεσμα. Για να γίνει αυτό θα χρησιμοποιήσουμε το υπόβαθρο του παιχνιδιού. Πάτησε πάνω στο Υπόβαθρο που βρίσκεται κάτω από τη λέξη Σκηνή: θα παρατηρήσεις ότι η μεσαία καρτέλα έχει αλλάξει από «Ενδυμασίες» σε «Υπόβαθρα» — τα υπόβαθρα είναι οι ενδυμασίες της σκηνής.",
  "Φτιάχνω τα υπόβαθρα. ① Άλλαξε το όνομα του πρώτου υπόβαθρου σε «Βυθός», γράφοντας μέσα στο άσπρο κουτάκι με τίτλο «Ενδυμασία». ② Πάτησε δεξί κλικ και διπλασίασε το σκηνικό «Βυθός» — ονόμασε το νέο σκηνικό που δημιούργησες «Νίκη». ③ Πάτησε το εργαλείο κειμένου (γράμμα Τ), κάνε κλικ στον χώρο του υπόβαθρου και γράψε τη λέξη «Κέρδισες!». ④ Κάνε πάλι δεξί κλικ πάνω στο «Νίκη», διπλασίασέ το ξανά, ονόμασε το τρίτο σκηνικό «Ήττα» και άλλαξε το κείμενο σε «Έχασες!»",
  "Αν θέλεις, άλλαξε το χρώμα των γραμμάτων επιλέγοντας ένα άλλο χρώμα. Κάνε κλικ έξω από το πλαίσιο κειμένου και τράβηξέ το από μία από τις τέσσερις γωνίες για να μεγαλώσεις τα γράμματα στο μέγεθος που θέλεις να εμφανίζονται. Αφού δημιούργησες τα τρία υπόβαθρα, γύρνα πίσω στις μορφές πατώντας μία από αυτές, π.χ. τη μορφή της Έλλης, και μην ξεχάσεις να κάνεις κλικ στην καρτέλα «Κώδικας» για να γυρίσεις στα σενάρια της Έλλης.",
  "Αλλάζω υπόβαθρο με εντολή. ① Βρες στην κατηγορία Όψεις την εντολή «αλλαγή σκηνικού σε…» και φέρε τη μέσα στον χώρο του προγραμματισμού. ② Η εντολή αυτή αλλάζει το υπόβαθρο της σκηνής: διάλεξε ένα υπόβαθρο από τη λίστα πατώντας το τριγωνάκι και κάνε κλικ πάνω στην εντολή για να τη δοκιμάσεις. ③ Διάλεξε το σκηνικό «Βυθός» και βάλε την εντολή στην αρχή του προγράμματος της Έλλης, κάτω από την εντολή της πράσινης σημαίας. ④ Δοκίμασε το πρόγραμμά σου πατώντας πάνω στην πράσινη σημαία",
  "Χρησιμοποίησε μία εντολή επιλογής «Εάν… τότε… Αλλιώς» για να εμφανίζεις το σωστό υπόβαθρο στο παιχνίδι. Βάλε την εντολή επιλογής να εκτελείται μετά την εντολή επανάληψης στο πρόγραμμα της Έλλης.",
  "Δες αυτές τις δύο επιλογές εντολών και αποφάσισε ποια πρέπει να χρησιμοποιήσεις. Οι δύο εντολές είναι ισοδύναμες, εκτός από την περίπτωση που η Έλλη αποκτήσει 10 πόντους και χάσει όλες της τις ζωές (ζωές = 0) την ίδια στιγμή, κάτι βέβαια αρκετά σπάνιο. Στην περίπτωση αυτή, αν επιλέξεις την εντολή 1, τότε ο παίκτης θα χάνει στο παιχνίδι, ενώ, αν επιλέξεις την εντολή 2, τότε θα κερδίζει.",
  "Δοκίμασε. Παίξε το παιχνίδι σου και δοκίμασε να εμφανιστεί τόσο το «Κέρδισες!» όσο και το «Έχασες!». Δοκίμασε το σενάριο να κερδίσεις τους πόντους και να χάσεις τις ζωές την ίδια στιγμή — τι εμφανίζει το παιχνίδι σου; Δες το βίντεο «Νίκη ή Ήττα» και απάντησε στις Ερωτήσεις σωστού/λάθους και στις Ερωτήσεις πολλαπλών επιλογών",
  "Μπορώ να ελέγχω αν το παιχνίδι μου καταλήγει σε νίκη ή ήττα, να γράφω κείμενο πάνω στο υπόβαθρο και να αλλάζω υπόβαθρο με προγραμματιστικό τρόπο. Μπράβο! Τέλος"
];
</script>
