    { type:"list", title:"Στο μάθημα αυτό θα μάθεις", items:["Να ερμηνεύω τι είναι ενεργητικό και παθητικό ψηφιακό αποτύπωμα","Να διακρίνω τις κατηγορίες των ψευδών ειδήσεων (fake news) και τα χαρακτηριστικά τους","Να έρθω σε επαφή με τις έννοιες της ρητορικής του μίσους, του ψηφιακού χάσματος και του διαδικτύου των πραγμάτων"] },
