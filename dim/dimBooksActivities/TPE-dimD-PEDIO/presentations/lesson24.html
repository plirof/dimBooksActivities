    { type:"list", title:"Στο μάθημα αυτό θα μάθεις", items:["Να δημιουργώ μια παρουσίαση","Να επιτελώ βασικές λειτουργίες στην παρουσίαση","Να αντιγράφω εικόνα και κείμενο από το διαδίκτυο σε μια παρουσίαση"] },
    { type:"concept", text:"Οι παρουσιάσεις (presentations) είναι ένας τρόπος για να μοιραστείς πληροφορίες με άλλους, με σαφή και οργανωμένο τρόπο. Κάθε παρουσίαση αποτελείται από μια σειρά διαφανειών — είναι το αντίστοιχο με ένα βιβλίο, το οποίο περιέχει διάφορες σελίδες!" },
