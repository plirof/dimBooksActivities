var LESSON = {
  number: 30,
  unit: "Ενότητα 5: Ψηφιακές τεχνολογίες και κοινωνία",
  slides: [
    { type:"title", title:"Μάθημα 30ό: Κριτήρια αξιολόγησης πηγών στο διαδίκτυο" },
    { type:"list", title:"Στο μάθημα αυτό θα μάθεις", items:["Να απαριθμώ και να κατανοώ τα κριτήρια αξιολόγησης των διαδικτυακών πηγών","Να αξιολογώ διαδικτυακές πηγές με βάση τα κριτήρια αξιολόγησης (πατρότητα, επικαιρότητα, ακρίβεια, αντικειμενικότητα, αξιοπιστία)"] },
    { type:"concept", text:"Είναι σημαντικό να μπορώ να αξιολογώ τις ιστοσελίδες από τις οποίες συλλέγω πληροφορίες, και αυτό γίνεται με συγκεκριμένα κριτήρια (κανόνες). Όταν χρησιμοποιώ πληροφορίες από το διαδίκτυο, πρέπει να είμαι προσεκτικός και κυρίως να επιλέγω ποιες ιστοσελίδες μπορώ να χρησιμοποιήσω για να συλλέξω αξιόπιστες πληροφορίες. Στο σχολείο, για να δημιουργήσουμε σχολικές εργασίες, πρέπει να αναζητήσουμε χρήσιμο, επίκαιρο και αξιόπιστο υλικό. Ο σεβασμός στα πνευματικά δικαιώματα, ο έλεγχος περιεχομένου που δημιουργήθηκε για εμπορικούς σκοπούς και η διασταύρωση των πληροφοριών είναι απαραίτητες ψηφιακές δεξιότητες των πολιτών." },
    { type:"list", title:"Κριτήριο 1: Πατρότητα πηγής (Authority)", items:["Ορισμός: η πατρότητα αφορά τα στοιχεία του συγγραφέα (ταυτότητα) του άρθρου ή του πληροφοριακού υλικού της ιστοσελίδας — πρέπει επίσης να φαίνεται ο ιδιοκτήτης του διαδικτυακού τόπου","Τι ελέγχω: στοιχεία επικοινωνίας, κριτικές (θετικά ή αρνητικά σχόλια), βιβλιογραφία στο υλικό, συνδέσμους προς επιπλέον περιεχόμενο ή διευκρινίσεις, βιογραφικά στοιχεία του συγγραφέα","Παράδειγμα: η ιστοσελίδα πρέπει να φιλοξενείται σε γνωστό χώρο (εξυπηρετητή-server) — π.χ. η διεύθυνση του Υπουργείου Παιδείας https://www.minedu.gov.gr/ φιλοξενείται στο gov, δηλαδή σε αξιόπιστο κρατικό χώρο"] },
    { type:"list", title:"Κριτήριο 2: Επικαιρότητα (Recency)", items:["Ορισμός: η επικαιρότητα αφορά την ανάρτηση της ημερομηνίας δημοσίευσης της πληροφορίας και την ημερομηνία τελευταίας ενημέρωσης της ιστοσελίδας","Τι ελέγχω: αν φαίνεται σε σημείο της ιστοσελίδας η ημερομηνία δημιουργίας (ανάρτησης) του υλικού, και η ημερομηνία της τελευταίας ενημέρωσης","Προσοχή: το περιεχόμενο αλλάζει σταδιακά στην ιστοσελίδα — αυτό είναι πρόβλημα ειδικά για επιστήμες που έχουν συχνές αλλαγές ή ανακαλύψεις, όπως η Πληροφορική"] },
    { type:"list", title:"Κριτήριο 3: Ακρίβεια (Accuracy)", items:["Ορισμός: η ακρίβεια υποδηλώνει μια σαφή, λεπτομερή και κατανοητή πληροφορία, με την αντίστοιχη τεκμηρίωση (υποσημειώσεις, βιβλιογραφία) και την ανάλυση (βάθος) που χρειάζεται ανάλογα με το θέμα","Τι ελέγχω: την ανάλυση του θέματος σε σχέση με την ηλικία και το κοινό (παιδιά, φοιτητές, ενήλικες) και την τεκμηρίωση με συνδέσμους σε άλλες πηγές και βιβλιογραφία","Καλό είναι η πληροφορία να είναι κατάλληλα διαμορφωμένη ανάλογα με το κοινό στο οποίο απευθύνεται (π.χ. επιστήμονες, εκπαιδευτικοί, επαγγελματίες) — σύγχρονη, λεπτομερής, τεκμηριωμένη, σαφής και κατανοητή"] },

    { type:"list", title:"Κριτήριο 5: Αξιοπιστία (Credibility)", items:["Ορισμός: οι πληροφορίες της ιστοσελίδας πρέπει να είναι αντικειμενικές και αμερόληπτες — να μην επηρεάζονται από προσωπικά ή άλλα κριτήρια που κρύβουν άλλες επιδιώξεις","Τι ελέγχω: ορθογραφικά ή συντακτικά λάθη, τακτικές ενημερώσεις, τους λόγους δημιουργίας της ιστοσελίδας και εξηγήσεις για τον στόχο της πληροφορίας","Παράδειγμα: μια αξιόπιστη ιστοσελίδα δεν πρέπει να έχει ανώνυμες πληροφορίες (φαίνονται οι συγγραφείς) — ελέγχουμε και τα σχόλια των αναγνωστών (η έλλειψη κριτικής ή η αρνητική κριτική είναι σημεία που προσέχουμε)"] },
    { type:"list", title:"Νέες λέξεις", items:["Πατρότητα (Authority): ποιος είναι ο συγγραφέας και ο ιδιοκτήτης της ιστοσελίδας","Επικαιρότητα (Recency): πότε δημοσιεύτηκε και πότε ενημερώθηκε τελευταία φορά","Ακρίβεια (Accuracy): σαφής, λεπτομερής και τεκμηριωμένη πληροφορία","Αντικειμενικότητα (Objectivity): πολλαπλές πτυχές και φανεροί στόχοι","Αξιοπιστία (Credibility): αμερόληπτες πληροφορίες χωρίς κρυφές επιδιώξεις"] },
    { type:"practice", title:"Δοκίμασε", items:["Με την ομάδα σας και με βάση τα κριτήρια αξιολόγησης, αξιολογήστε (Χ) πέντε ιστοσελίδες που θα εντοπίσετε στο διαδίκτυο ή θα σας προτείνει ο εκπαιδευτικός Πληροφορικής","Οι ιστοσελίδες που θα αξιολογήσετε καλό είναι να αφορούν διάφορες κατηγορίες: κρατικές, ιδιωτικές, οργανισμούς, εκπαιδευτικά ιδρύματα και άλλα","Δες τον εννοιολογικό χάρτη «Κριτήρια αξιολόγησης διαδικτυακών πηγών» και το βίντεο «Κριτήρια αξιολόγησης διαδικτυακών πηγών»"] },

  "Κριτήριο 1: Πατρότητα πηγής (Authority). Ορισμός: η πατρότητα αφορά τα στοιχεία του συγγραφέα (ταυτότητα) του άρθρου ή του πληροφοριακού υλικού της ιστοσελίδας — πρέπει επίσης να φαίνεται ο ιδιοκτήτης του διαδικτυακού τόπου. Τι ελέγχω: στοιχεία επικοινωνίας, κριτικές (θετικά ή αρνητικά σχόλια), βιβλιογραφία στο υλικό, συνδέσμους προς επιπλέον περιεχόμενο ή διευκρινίσεις, βιογραφικά στοιχεία του συγγραφέα. Παράδειγμα: η ιστοσελίδα πρέπει να φιλοξενείται σε γνωστό χώρο (εξυπηρετητή-server) — π.χ. η διεύθυνση του Υπουργείου Παιδείας https://www.minedu.gov.gr/ φιλοξενείται στο gov, δηλαδή σε αξιόπιστο κρατικό χώρο",
