<script>
var LESSON = {
  number: 15,
  unit: "Ενότητα 2: Υπολογιστικά συστήματα – Ψηφιακές συσκευές – Δίκτυα",
  slides: [
    { type:"title", title:"Μάθημα 15ο: Προστατεύομαι από διαδικτυακές επιθέσεις" },
    { type:"list", title:"Στο μάθημα αυτό θα μάθεις", items:["Να διακρίνεις το κακόβουλο λογισμικό","Να αξιοποιείς τα προγράμματα προστασίας από τους ιούς","Να περιγράφεις τη σημασία του τείχους προστασίας σε σχέση με τη ροή δεδομένων"] },
    { type:"text", text:"Θυμάμαι ότι: το κακόβουλο λογισμικό ή ιός (virus) είναι εφαρμογή που δημιουργήθηκε με σκοπό να προκαλέσει ζημιά στον υπολογιστή ή να κλέψει προσωπικές πληροφορίες. Το λογισμικό προστασίας από ιούς (antivirus) είναι ένα είδος εφαρμογής που σχεδιάστηκε για να προστατεύει τους υπολογιστές και τις συσκευές από ιούς και άλλες απειλές ασφαλείας." },
    { type:"list", title:"Σημάδια προσβολής από κακόβουλο λογισμικό", items:["Απρόσμενη συμπεριφορά του υπολογιστή: είναι αργός, κολλάει ή συμβαίνουν πράγματα που δεν μπορείς να εξηγήσεις","Εμφάνιση διαφημίσεων ή αναδυόμενα παράθυρα (pop-ups) που εμφανίζονται ξαφνικά χωρίς λόγο","Εμφάνιση νέων εργαλείων ή μπάρας εργαλείων στον φυλλομετρητή σου χωρίς τη συγκατάθεσή σου","Αποστολή και λήψη πολλών αρχείων: ο υπολογιστής στέλνει ή λαμβάνει συνεχώς αρχεία — μπορεί να εγκαταστάθηκε χωρίς τη θέλησή σου κακόβουλο λογισμικό που εκτελεί δραστηριότητες χωρίς την έγκρισή σου","Αν παρατηρήσεις οποιοδήποτε από αυτά τα σημάδια, είναι σημαντικό να κάνεις έλεγχο του υπολογιστή σου για να ανιχνεύσεις και να απομακρύνεις το κακόβουλο λογισμικό"] },
    { type:"steps", title:"Κρατάω ασφαλή τον υπολογιστή μου", steps:["① Κατέβασε και εγκατάστησε λογισμικό προστασίας: επίλεξε δωρεάν λογισμικό προστασίας (βασική προστασία) ή προμηθεύσου ένα εμπορικό, και ακολούθησε τις οδηγίες εγκατάστασης","② Επίλεξε την τελευταία έκδοση του λογισμικού: μετά την εγκατάσταση βεβαιώσου ότι είναι ενημερωμένο — οι ενημερώσεις περιλαμβάνουν νέες προσθήκες και διορθώσεις","③ Ρύθμισε το λογισμικό για αυτόματους ελέγχους του υπολογιστή σε τακτικά διαστήματα, ώστε να εντοπίζονται και να αφαιρούνται πιθανοί ιοί","④ Πρόσεξε πού κάνεις κλικ, ειδικά σε ύποπτα συνημμένα αρχεία ή συνδέσμους σε email και μηνύματα — μην ανοίγεις κάτι που δεν είσαι σίγουρος ότι είναι ασφαλές","⑤ Δημιούργησε αντίγραφα ασφαλείας των σημαντικών σου αρχείων, για να είσαι προετοιμασμένος αν κάτι πάει στραβά"] },
    { type:"concept", text:"Τι είναι το τείχος προστασίας (firewall); Το τείχος προστασίας είναι ένα λογισμικό ή μια συσκευή που προστατεύει ένα δίκτυο ή έναν υπολογιστή από ανεπιθύμητη πρόσβαση από άλλους υπολογιστές ή δίκτυα στο διαδίκτυο. Λειτουργεί σαν ένα είδος φραγής ή φίλτρου που ελέγχει την εισερχόμενη και την εξερχόμενη κυκλοφορία δεδομένων. Συνολικά, το τείχος προστασίας είναι ένα σημαντικό μέσο για τη διατήρηση της ασφάλειας του δικτύου και των υπολογιστών: περιορίζει την πρόσβαση από μη εξουσιοδοτημένους χρήστες και προστατεύει τα δεδομένα από κακόβουλες επιθέσεις." },
    { type:"list", title:"Νέες λέξεις", items:["Κακόβουλο λογισμικό ή ιός (virus): εφαρμογή που προκαλεί ζημιά στον υπολογιστή ή κλέβει προσωπικές πληροφορίες","Λογισμικό προστασίας από ιούς (antivirus): εφαρμογή που προστατεύει υπολογιστές και συσκευές από ιούς και άλλες απειλές","Pop-ups: αναδυόμενα παράθυρα που εμφανίζονται ξαφνικά στην οθόνη","Τείχος προστασίας (firewall): λογισμικό ή συσκευή που ελέγχει την εισερχόμενη και εξερχόμενη κυκλοφορία δεδομένων","Αντίγραφα ασφαλείας (backups): αντίγραφα των σημαντικών αρχείων σου"] },
    { type:"practice", title:"Δημιούργησε σε ομάδα ένα σύντομο κείμενο (50-100 λέξεις)", items:["Ποια είναι κάποια συνηθισμένα σημάδια προσβολής από κακόβουλο λογισμικό στον υπολογιστή σου;","Τι συμβαίνει όταν ο υπολογιστής σου είναι προσβεβλημένος από ιό;","Ποιες ενέργειες θα κάνεις αν καταλάβεις ότι ο υπολογιστής σου έχει προσβληθεί από κακόβουλο λογισμικό;","Ποια μέτρα προστασίας μπορείς να λάβεις για να αποτρέψεις την προσβολή;","Πώς μπορείς να ελέγξεις τον υπολογιστή σου για ιούς και άλλα κακόβουλα προγράμματα;","Αναρτήστε τα κείμενα της ομάδας σας στο ιστολόγιο, στην εφημερίδα ή στην ιστοσελίδα της τάξης ή του σχολείου σας"] },
    { type:"assessment", check:"Μπορώ να διακρίνω το κακόβουλο λογισμικό από τα σημάδια του, να αξιοποιώ τα προγράμματα προστασίας από ιούς και να περιγράφω τη σημασία του τείχους προστασίας για τη ροή δεδομένων", end:"Μπράβο! ✦ Τέλος ✦" }
  ]
};

// Static array read by pregen.AppImage. Keep in sync with LESSON.slides above.
var slideTexts = [
  "Ενότητα 2: Υπολογιστικά συστήματα – Ψηφιακές συσκευές – Δίκτυα. Μάθημα 15ο: Προστατεύομαι από διαδικτυακές επιθέσεις",
  "Στο μάθημα αυτό θα μάθεις. Να διακρίνεις το κακόβουλο λογισμικό. Να αξιοποιείς τα προγράμματα προστασίας από τους ιούς. Να περιγράφεις τη σημασία του τείχους προστασίας σε σχέση με τη ροή δεδομένων",
  "Θυμάμαι ότι: το κακόβουλο λογισμικό ή ιός (virus) είναι εφαρμογή που δημιουργήθηκε με σκοπό να προκαλέσει ζημιά στον υπολογιστή ή να κλέψει προσωπικές πληροφορίες. Το λογισμικό προστασίας από ιούς (antivirus) είναι ένα είδος εφαρμογής που σχεδιάστηκε για να προστατεύει τους υπολογιστές και τις συσκευές από ιούς και άλλες απειλές ασφαλείας.",
  "Σημάδια προσβολής από κακόβουλο λογισμικό. Απρόσμενη συμπεριφορά του υπολογιστή: είναι αργός, κολλάει ή συμβαίνουν πράγματα που δεν μπορείς να εξηγήσεις. Εμφάνιση διαφημίσεων ή αναδυόμενα παράθυρα (pop-ups) που εμφανίζονται ξαφνικά χωρίς λόγο. Εμφάνιση νέων εργαλείων ή μπάρας εργαλείων στον φυλλομετρητή σου χωρίς τη συγκατάθεσή σου. Αποστολή και λήψη πολλών αρχείων: ο υπολογιστής στέλνει ή λαμβάνει συνεχώς αρχεία — μπορεί να εγκαταστάθηκε χωρίς τη θέλησή σου κακόβουλο λογισμικό που εκτελεί δραστηριότητες χωρίς την έγκρισή σου. Αν παρατηρήσεις οποιοδήποτε από αυτά τα σημάδια, είναι σημαντικό να κάνεις έλεγχο του υπολογιστή σου για να ανιχνεύσεις και να απομακρύνεις το κακόβουλο λογισμικό",
  "Κρατάω ασφαλή τον υπολογιστή μου. ① Κατέβασε και εγκατάστησε λογισμικό προστασίας: επίλεξε δωρεάν λογισμικό προστασίας (βασική προστασία) ή προμηθεύσου ένα εμπορικό, και ακολούθησε τις οδηγίες εγκατάστασης. ② Επίλεξε την τελευταία έκδοση του λογισμικού: μετά την εγκατάσταση βεβαιώσου ότι είναι ενημερωμένο — οι ενημερώσεις περιλαμβάνουν νέες προσθήκες και διορθώσεις. ③ Ρύθμισε το λογισμικό για αυτόματους ελέγχους του υπολογιστή σε τακτικά διαστήματα, ώστε να εντοπίζονται και να αφαιρούνται πιθανοί ιοί. ④ Πρόσεξε πού κάνεις κλικ, ειδικά σε ύποπτα συνημμένα αρχεία ή συνδέσμους σε email και μηνύματα — μην ανοίγεις κάτι που δεν είσαι σίγουρος ότι είναι ασφαλές. ⑤ Δημιούργησε αντίγραφα ασφαλείας των σημαντικών σου αρχείων, για να είσαι προετοιμασμένος αν κάτι πάει στραβά",
  "Τι είναι το τείχος προστασίας (firewall); Το τείχος προστασίας είναι ένα λογισμικό ή μια συσκευή που προστατεύει ένα δίκτυο ή έναν υπολογιστή από ανεπιθύμητη πρόσβαση από άλλους υπολογιστές ή δίκτυα στο διαδίκτυο. Λειτουργεί σαν ένα είδος φραγής ή φίλτρου που ελέγχει την εισερχόμενη και την εξερχόμενη κυκλοφορία δεδομένων. Συνολικά, το τείχος προστασίας είναι ένα σημαντικό μέσο για τη διατήρηση της ασφάλειας του δικτύου και των υπολογιστών: περιορίζει την πρόσβαση από μη εξουσιοδοτημένους χρήστες και προστατεύει τα δεδομένα από κακόβουλες επιθέσεις.",
  "Νέες λέξεις. Κακόβουλο λογισμικό ή ιός (virus): εφαρμογή που προκαλεί ζημιά στον υπολογιστή ή κλέβει προσωπικές πληροφορίες. Λογισμικό προστασίας από ιούς (antivirus): εφαρμογή που προστατεύει υπολογιστές και συσκευές από ιούς και άλλες απειλές. Pop-ups: αναδυόμενα παράθυρα που εμφανίζονται ξαφνικά στην οθόνη. Τείχος προστασίας (firewall): λογισμικό ή συσκευή που ελέγχει την εισερχόμενη και εξερχόμενη κυκλοφορία δεδομένων. Αντίγραφα ασφαλείας (backups): αντίγραφα των σημαντικών αρχείων σου",
  "Δημιούργησε σε ομάδα ένα σύντομο κείμενο (50-100 λέξεις). Ποια είναι κάποια συνηθισμένα σημάδια προσβολής από κακόβουλο λογισμικό στον υπολογιστή σου; Τι συμβαίνει όταν ο υπολογιστής σου είναι προσβεβλημένος από ιό; Ποιες ενέργειες θα κάνεις αν καταλάβεις ότι ο υπολογιστής σου έχει προσβληθεί από κακόβουλο λογισμικό; Ποια μέτρα προστασίας μπορείς να λάβεις για να αποτρέψεις την προσβολή; Πώς μπορείς να ελέγξεις τον υπολογιστή σου για ιούς και άλλα κακόβουλα προγράμματα; Αναρτήστε τα κείμενα της ομάδας σας στο ιστολόγιο, στην εφημερίδα ή στην ιστοσελίδα της τάξης ή του σχολείου σας",
  "Μπορώ να διακρίνω το κακόβουλο λογισμικό από τα σημάδια του, να αξιοποιώ τα προγράμματα προστασίας από ιούς και να περιγράφω τη σημασία του τείχους προστασίας για τη ροή δεδομένων. Μπράβο! Τέλος"
