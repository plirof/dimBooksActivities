    { type:"text", text:"Θυμάμαι ότι: στην εκπαιδευτική πλατφόρμα e-me έχω μάθει να στέλνω και να λαμβάνω ηλεκτρονικά μηνύματα. Στην καθημερινή σου ζωή έρχεσαι σε επαφή με ανθρώπους όπως τα μέλη της οικογένειάς σου, τους φίλους και τις φίλες ή τους συμμαθητές και τις συμμαθήτριές σου. Μπορείς να έχεις και ψηφιακές επαφές, δηλαδή ψηφιακούς φίλους μέσω μιας κοινωνικής εκπαιδευτικής πλατφόρμας όπως η e-me — τέτοιοι φίλοι μπορεί να είναι οι δάσκαλοι ή οι συμμαθητές και οι συμμαθήτριές σου." },
    { type:"concept", text:"Για να είσαι ασφαλής στις πλατφόρμες κοινωνικής δικτύωσης δεν πρέπει ποτέ να ζητάς να γίνεις φίλος ή φίλη, ή να δέχεσαι αιτήματα από άγνωστα άτομα! Στην e-me συνδέεσαι με τον μαθητικό λογαριασμό — όνομα χρήστη (username) και κωδικό (password) — που έχεις αποκτήσει στο ΠΣΔ. Για να σε βρουν οι συμμαθητές και οι συμμαθήτριές σου και να επικοινωνήσουν μαζί σου, πρέπει να έχεις συνδεθεί έστω μία φορά στην e-me." },
    { type:"steps", title:"Προσθέτω μέλος στις επαφές μου", steps:["① Ανοίγεις την εφαρμογή «Επαφές» από την αρχική σελίδα στην e-me, ή επιλέγεις «Επαφές» από το μενού","② Για να προσθέσεις μέλη από τη σελίδα των επαφών σου, επιλέγεις το εικονίδιο με τον φακό στα δεξιά","③ Στο πλαίσιο που εμφανίζεται πληκτρολογείς το ονοματεπώνυμο του μέλους που θέλεις να προσθέσεις","④ Επιλέγεις το μέλος της e-me που θέλεις να προσκαλέσεις και στέλνεις «Αίτημα σύνδεσης»","⑤ Για να προστεθεί στις επαφές σου, θα πρέπει το άλλο μέλος να αποδεχθεί το αίτημά σου!"] },
    { type:"list", title:"Διαχειρίζομαι τα αιτήματα σύνδεσης", items:["Ελέγχεις τις ειδοποιήσεις σου στην e-me (καμπανάκι), για να δεις αν έχεις λάβει αίτημα σύνδεσης από κάποιο μέλος","Από την αναδιπλούμενη λίστα διαλέγεις μία από τις τρεις επιλογές: αποδοχή — προσθέτεις το μέλος στις επαφές σου","Απόρριψη — δεν δέχεσαι το αίτημα σύνδεσης και δεν προσθέτεις το μέλος στις επαφές σου","Αποκλεισμός — σταματάς να δέχεσαι μηνύματα ή κλήσεις από μια επαφή σου"] },

    { type:"list", title:"Νέες λέξεις", items:["Επαφή: ο ψηφιακός φίλος σου στην πλατφόρμα e-me","Αίτημα σύνδεσης: η πρόσκληση για να γίνει κάποιος επαφή σου","Αποκλεισμός: σταματάς να δέχεσαι μηνύματα ή κλήσεις από μια επαφή","Συνομιλία: ανταλλαγή γραπτών μηνυμάτων με μία ή πολλές επαφές ταυτόχρονα"] },

// Static array read by pregen.AppImage. Keep in sync with LESSON.slides above.
var slideTexts = [
  "Ενότητα 4: Ψηφιακός γραμματισμός. Μάθημα 26ο: Διαχείριση επαφών και επικοινωνία μέσω εκπαιδευτικής πλατφόρμας",

  "Διαχειρίζομαι τα αιτήματα σύνδεσης. Ελέγχεις τις ειδοποιήσεις σου στην e-me (καμπανάκι), για να δεις αν έχεις λάβει αίτημα σύνδεσης από κάποιο μέλος. Από την αναδιπλούμενη λίστα διαλέγεις μία από τις τρεις επιλογές: αποδοχή — προσθέτεις το μέλος στις επαφές σου. Απόρριψη — δεν δέχεσαι το αίτημα σύνδεσης και δεν προσθέτεις το μέλος στις επαφές σου. Αποκλεισμός — σταματάς να δέχεσαι μηνύματα ή κλήσεις από μια επαφή σου",
  "Επικοινωνώ με γραπτά μηνύματα. ① Γνωρίζεις ότι μπορείς να στείλεις απλά μηνύματα κειμένου στις επαφές σου. ② Επίλεξε το εικονίδιο στο μέλος-επαφή σου που θέλεις να στείλεις μήνυμα κειμένου και γράψε το μήνυμά σου. ③ Αντίστοιχα, μπορείς να δεις τα αδιάβαστα μηνύματά σου ή να μεταφερθείς στη σελίδα προβολής όλων των μηνυμάτων. ④ Με μια συνομιλία μπορείς να στείλεις γραπτά μηνύματα σε πολλές επαφές ταυτόχρονα. ⑤ Σε μια συνομιλία μπορείς να επιλέξεις παύση ειδοποιήσεων, διαγραφή ιστορικού συνομιλίας ή και να αποχωρήσεις από μια ομαδική συνομιλία",
  "Νέες λέξεις. Επαφή: ο ψηφιακός φίλος σου στην πλατφόρμα e-me. Αίτημα σύνδεσης: η πρόσκληση για να γίνει κάποιος επαφή σου. Αποκλεισμός: σταματάς να δέχεσαι μηνύματα ή κλήσεις από μια επαφή. Συνομιλία: ανταλλαγή γραπτών μηνυμάτων με μία ή πολλές επαφές ταυτόχρονα",
  "Δοκίμασε. Συνδέσου στην e-me και αναζήτησε τρεις συμμαθητές και συμμαθήτριές σου, και πρόσθεσέ τους στις επαφές σου — συνάντησες δυσκολίες; Συζήτησε τις εμπειρίες σου στην τάξη. Στείλε ένα γραπτό μήνυμα σε μια επαφή σου στην e-me. Αντίστοιχα, διάβασε τα μηνύματα που σου έχουν στείλει οι επαφές σου. Ξεκινήστε στην ομάδα σας μια συνομιλία: ανταλλάξτε μηνύματα με τις επαφές σας και στο τέλος αποχωρήστε από τη συνομιλία",
