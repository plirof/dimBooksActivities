<!DOCTYPE html>
<!--
  slide_TTS_template.html — minimal template for a TPE-dim lesson presentation.

  Shared CSS + runtime JS live OUTSIDE this file (loaded at the bottom); each
  lesson file holds ONLY its own data (LESSON + slideTexts) plus this skeleton.

  To create lesson NN:

    1. Copy this file to  TPE-dimX-PEDIO/presentations/lessonNN.html
    2. Edit LESSON below (number, unit, slides[]).
       First slide MUST be type:"title", last slide MUST be type:"assessment".
    3. Keep slideTexts[] in sync with LESSON.slides — pregen.AppImage reads it.
       Entries mirror getSlideText() in tts/scripts/presentation.js:
         title       -> unit + ". " + title (+ ". " + sub if present)
         text        -> text
         steps       -> (title? title+". ":"") + steps.join(". ")
         list        -> (title? title+". ":"") + items.join(". ")
         concept     -> text
         practice    -> (title||"Συζητήστε") + ". " + items.join(". ")
         assessment  -> check + ". " + end   (✦/✧ stripped; ". Τέλος" if no end)
   4. Generate MP3s:
   **IMPORTANT: If updating an existing presentation, delete old MP3s first:**
   rm TPE-dimX-PEDIO/presentations/audio/lessonNN/*.mp3

   ./tts/pregen.AppImage TPE-dimX-PEDIO/presentations/lessonNN.html \
                                 TPE-dimX-PEDIO/presentations/audio/lessonNN
   5. Open lessonNN.html in a browser. URL params: ?speed=0.7  ?mode=manual

  Do NOT re-inline CSS or runtime JS here — edit tts/scripts/presentation.css
  or tts/scripts/presentation.js instead (changes apply to every lesson).
-->
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Παρουσίαση</title>
<link rel="stylesheet" href="../../tts/scripts/presentation.css">
</head>
<body>

<!-- ===== BEGIN EDIT THIS SECTION ===== -->
<script>
var LESSON = {
  number: 8,
  unit: "Ενότητα 1: Αλγοριθμική – Προγραμματισμός – Ρομποτική",
  slides: [
    { type:"title", title:"Μάθημα 8ο: Οδήγηση σε πίστα" },
    { type:"list", title:"Στόχοι μαθήματος", items:["Να οδηγείς το ρομπότ εδάφους δίνοντάς του τις σωστές εντολές","Να κάνεις το ρομπότ να στρίβει σε ορθή γωνία"] },
    { type:"concept", text:"Για να ξεκινήσεις αυτή τη δραστηριότητα πρέπει πρώτα να φτιάξεις μία πίστα πάνω στην οποία κινείται το ρομπότ. Μπορείς να σχεδιάσεις μία πίστα με μαύρο μαρκαδόρο πάνω σε άσπρο χαρτί μεγέθους Α4. Φρόντισε ώστε τα ανοίγματα ανάμεσα στις μαύρες γραμμές να είναι τουλάχιστον 10 εκατοστά ώστε να χωράει το ρομπότ να περάσει ανάμεσα από τις μαύρες γραμμές." },
    { type:"list", title:"Βήματα για το βασικό πρόγραμμα", items:["Άνοιξε την ιστοσελίδα προγραμματισμού του ρομπότ Έντισον edblocksapp.com","Φτιάξε έναν απλό κώδικα για να προγραμματίσεις το ρομπότ σου","Δοκίμασε το πρόγραμμά σου στην πίστα"] },
    { type:"concept", text:"Όπως θα παρατηρείς, το ρομπότ δεν τρέχει στην πίστα σωστά. Το χρονικό διάστημα 1 δευτερόλεπτο που χρησιμοποιούν και οι τρεις εντολές είναι πολύ μεγάλο για την κίνηση που πρέπει να κάνει το ρομπότ." },
    { type:"concept", text:"Υπολόγισε τον αριθμό των δευτερολέπτων ώστε το ρομπότ να τρέχει σωστά στην πίστα, δηλαδή να φτάνει από την αρχική θέση στην τελική. Οι αριθμοί που θα χρησιμοποιήσεις πρέπει να είναι δεκαδικοί και μικρότεροι του 1. Θα χρειαστεί να κάνεις αρκετές δοκιμές μέχρι να το πετύχεις." },
    { type:"list", title:"Δοκιμή και διόρθωση", items:["Ξεκίνα αλλάζοντας πρώτα τον χρόνο για την πρώτη εντολή (προχώρα μπροστά)","Στη συνέχεια για τη δεύτερη εντολή (στρίψε δεξιά) και, τέλος, για την τρίτη εντολή (προχώρα μπροστά)","Πειραματίσου με τους χρόνους για να πετύχεις σωστή κίνηση"] },
    { type:"concept", text:"Τοποθέτησε το ρομπότ στην άλλη πλευρά της πίστας και επανάλαβε τη διαδικασία. Τώρα το ρομπότ πρέπει να στρίβει αριστερά και όχι δεξιά, όπως πριν." },
    { type:"concept", text:"Παρατήρησε ότι και στις δύο περιπτώσεις το ρομπότ πρέπει να στρίβει σε ορθή γωνία σε σχέση με τον άξονα που κινείται, τη μία φορά όμως δεξιόστροφα και την άλλη αριστερόστροφα. Δεν είναι απαραίτητο όμως ότι οι χρόνοι της αριστερής και της δεξιάς στροφής που βρήκες είναι ακριβώς οι ίδιοι." },
    { type:"assessment", check:"Μπορώ να οδηγώ το ρομπότ και να το στρίβω σε ορθή γωνία", end:"Μπράβο! ✦ Τέλος ✦" }
  ]
};

// Static array read by pregen.AppImage. Keep in sync with LESSON.slides above.
var slideTexts = [
  "Ενότητα 1: Αλγοριθμική – Προγραμματισμός – Ρομποτική. Μάθημα 8ο: Οδήγηση σε πίστα",
  "Στόχοι μαθήματος. Να οδηγείς το ρομπότ εδάφους δίνοντάς του τις σωστές εντολές. Να κάνεις το ρομπότ να στρίβει σε ορθή γωνία",
  "Για να ξεκινήσεις αυτή τη δραστηριότητα πρέπει πρώτα να φτιάξεις μία πίστα πάνω στην οποία κινείται το ρομπότ. Μπορείς να σχεδιάσεις μία πίστα με μαύρο μαρκαδόρο πάνω σε άσπρο χαρτί μεγέθους Α4. Φρόντισε ώστε τα ανοίγματα ανάμεσα στις μαύρες γραμμές να είναι τουλάχιστον 10 εκατοστά ώστε να χωράει το ρομπότ να περάσει ανάμεσα από τις μαύρες γραμμές.",
  "Βήματα για το βασικό πρόγραμμα. Άνοιξε την ιστοσελίδα προγραμματισμού του ρομπότ Έντισον edblocksapp.com. Φτιάξε έναν απλό κώδικα για να προγραμματίσεις το ρομπότ σου. Δοκίμασε το πρόγραμμά σου στην πίστα",
  "Όπως θα παρατηρείς, το ρομπότ δεν τρέχει στην πίστα σωστά. Το χρονικό διάστημα 1 δευτερόλεπτο που χρησιμοποιούν και οι τρεις εντολές είναι πολύ μεγάλο για την κίνηση που πρέπει να κάνει το ρομπότ.",
  "Υπολόγισε τον αριθμό των δευτερολέπτων ώστε το ρομπότ να τρέχει σωστά στην πίστα, δηλαδή να φτάνει από την αρχική θέση στην τελική. Οι αριθμοί που θα χρησιμοποιήσεις πρέπει να είναι δεκαδικοί και μικρότεροι του 1. Θα χρειαστεί να κάνεις αρκετές δοκιμές μέχρι να το πετύχεις.",
  "Δοκιμή και διόρθωση. Ξεκίνα αλλάζοντας πρώτα τον χρόνο για την πρώτη εντολή (προχώρα μπροστά). Στη συνέχεια για τη δεύτερη εντολή (στρίψε δεξιά) και, τέλος, για την τρίτη εντολή (προχώρα μπροστά). Πειραματίσου με τους χρόνους για να πετύχεις σωστή κίνηση",
  "Τοποθέτησε το ρομπότ στην άλλη πλευρά της πίστας και επανάλαβε τη διαδικασία. Τώρα το ρομπότ πρέπει να στρίβει αριστερά και όχι δεξιά, όπως πριν.",
  "Παρατήρησε ότι και στις δύο περιπτώσεις το ρομπότ πρέπει να στρίβει σε ορθή γωνία σε σχέση με τον άξονα που κινείται, τη μία φορά όμως δεξιόστροφα και την άλλη αριστερόστροφα. Δεν είναι απαραίτητο όμως ότι οι χρόνοι της αριστερής και της δεξιάς στροφής που βρήκες είναι ακριβώς οι ίδιοι.",
  "Μπορώ να οδηγώ το ρομπότ και να το στρίβω σε ορθή γωνία. Μπράβο! Τέλος"
];
</script>
<!-- ===== END EDIT SECTION ===== -->

<div id="slides"></div>
<div id="speedBadge"></div>
<div id="dots"></div>

<div id="controls">
  <button id="prevBtn" onclick="navigate(-1)">◀</button>
  <span id="counter"></span>
  <button id="nextBtn" onclick="navigate(1)">▶</button>
  <button id="playBtn" onclick="togglePlay()">⏸</button>
  <button id="muteBtn" onclick="toggleMute()">🔊</button>
</div>

<script src="../../tts/scripts/tts.js"></script>
<script src="../../tts/scripts/presentation.js"></script>
</body>
</html>
