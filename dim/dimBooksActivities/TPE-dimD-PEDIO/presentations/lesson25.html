var LESSON = {

    { type:"list", title:"Στο μάθημα αυτό θα μάθεις", items:["Να χειρίζομαι τις βασικές δυνατότητες ενός επεξεργαστή κειμένου (μορφοποιήσεις, αρίθμηση)","Να αντιγράφω εικόνα και κείμενο από το διαδίκτυο σε ένα έγγραφο"] },
    { type:"text", text:"Θυμάμαι ότι: για να γράψω στον υπολογιστή κείμενο χρησιμοποιώ μια εφαρμογή επεξεργασίας κειμένου." },
    { type:"concept", text:"Ήξερες ότι: η μορφοποίηση κειμένου είναι η χρήση εργαλείων για την αλλαγή της εμφάνισης του κειμένου; Όταν μορφοποιείς ένα κείμενο, μπορείς να αλλάξεις τη γραμματοσειρά, το μέγεθος και το χρώμα των γραμμάτων, τη στοίχιση των λέξεων και πολλά άλλα. Η ορθή εμφάνιση του γραπτού κειμένου (μορφοποίηση) σε βοηθάει να διαβάζεις πιο εύκολα το κείμενο και να καταλαβαίνεις καλύτερα τις πληροφορίες που σου δίνει!" },
    { type:"steps", title:"Επιλέγω κείμενο", steps:["① Τοποθετείς τον δείκτη του ποντικιού στην αρχή του κειμένου που θέλεις να επιλέξεις","② Κρατάς πατημένο το αριστερό πλήκτρο του ποντικιού και σέρνεις το ποντίκι μέχρι το σημείο που επιθυμείς","③ Στη συνέχεια πατάς το κατάλληλο κουμπί και εφαρμόζεις τη μορφοποίηση που θέλεις","④ Εναλλακτικά, μπορείς να επιλέξεις ένα κουμπί μορφοποίησης πριν ξεκινήσεις να πληκτρολογείς — σκέψου τα κουμπιά σαν διακόπτη φωτός: τον πατάς και έχεις φως, τον ξαναπατάς και σβήνει!","Γρήγορες επιλογές: λέξη = διπλό κλικ πάνω της, παράγραφος = τριπλό κλικ, γραμμή = δείκτη αριστερά της και κλικ όταν εμφανιστεί βέλος"] },

    { type:"concept", text:"Λίστες: όταν πρέπει να αριθμήσεις τα βήματα που πρέπει να ακολουθήσεις για κάτι, όπως το βούρτσισμα δοντιών, χρησιμοποιείς μια αριθμημένη λίστα. Όταν η σειρά των ενεργειών δεν είναι σημαντική, χρησιμοποιείς μια λίστα με κουκκίδες, όπως μια λίστα προετοιμασίας για ένα πάρτι. Και στις δύο περιπτώσεις επιλέγεις το κείμενο για να εφαρμόσεις τη λίστα και πατάς το αντίστοιχο κουμπί. Επίσης: αν κατά λάθος κάνεις κάποια ενέργεια που δεν τη θέλεις, π.χ. αλλαγή μεγέθους γραμμάτων, μπορείς να την αναιρέσεις πατώντας το κουμπί «Αναίρεση»! Και πάντα αποθηκεύεις τις εργασίες σου: κουμπί αποθήκευσης ή «Αρχείο → Αποθήκευση»." },

  "Δοκίμασε. Δημιούργησε νέο κείμενο: πληκτρολόγησε «Η πρώτη μου μορφοποίηση κειμένου» και τα ονοματεπώνυμά σας. Κάνε τη λέξη «μου» έντονη (Β), υπογράμμισε τα ονόματά σας (U) και γράψε πλάγια τα επίθετά σας (I). Αποθήκευσε!. Από το διαδίκτυο εντόπισε ένα απόσπασμα που σε ενδιαφέρει, αντιγράψτε το και επικολλήστε το στο έγγραφό σας. Στοίχισέ το με τις τέσσερις επιλογές διαδοχικά. Αλλάξτε το κείμενο: μέγεθος 14, γραμματοσειρά Comic Sans MS, κόκκινο χρώμα γραμμάτων, κίτρινη επισήμανση στις δύο πρώτες λέξεις — και στο τέλος αναιρέστε την τελευταία σας ενέργεια. Πληκτρολογήστε μια αριθμημένη λίστα με τα σημερινά σας μαθήματα και μια λίστα με κουκκίδες με ψώνια από το σουπερμάρκετ. Βρείτε μια εικόνα στο διαδίκτυο, αντιγράψτε την και επικολλήστε την. Άνοιξε από το Φωτόδεντρο το «Ο κειμενογράφος μου»",
