    { type:"concept", text:"Οι κανόνες (κώδικες) συμπεριφοράς στο διαδίκτυο (Netiquette) είναι ένα σύνολο από διαδικασίες που ορίζουν τη συμπεριφορά που όλοι μαζί πρέπει να συμφωνήσουμε — να αποδεχθούμε — στο διαδίκτυο, κατά την ηλεκτρονική μας επικοινωνία και συνεργασία. Θυμάμαι ότι: οι κανόνες καλής συμπεριφοράς στο διαδίκτυο δεν διαφέρουν από την πραγματική ζωή. Ωστόσο, πολλές φορές μπερδεύω την πραγματική με την ψηφιακή ζωή στο διαδίκτυο." },
