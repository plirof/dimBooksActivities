    { type:"text", text:"Θυμάμαι ότι: για να δω πληροφορίες στο διαδίκτυο χρησιμοποιώ τους φυλλομετρητές (browsers)." },

    { type:"concept", text:"Όταν διαβάζεις ένα βιβλίο, χρησιμοποιείς σελιδοδείκτη για να μη χάσεις τη σελίδα που σταμάτησες. Οι «σελιδοδείκτες» στους φυλλομετρητές (bookmarks) είναι σαν μια λίστα με τους αγαπημένους σου ιστότοπους: σε βοηθούν να αποθηκεύσεις τη διεύθυνση ενός ιστότοπου, ώστε να τον βρίσκεις εύκολα την επόμενη φορά. Συχνά, αντί για «σελιδοδείκτες», χρησιμοποιούμε τον όρο «αγαπημένα» (favourites). Οι σελιδοδείκτες εμφανίζονται στη γραμμή σελιδοδεικτών του φυλλομετρητή: τους επισκέπτεσαι κάνοντας κλικ πάνω τους, και μπορείς να εμφανίζεις ή να εξαφανίζεις τη γραμμή από το μενού του φυλλομετρητή." },

  "Προσθέτω έναν σελιδοδείκτη. ① Κάνω κλικ στο αστέρι, στη γραμμή διευθύνσεων του φυλλομετρητή. ② Όταν πατήσω το αστέρι, αυτό αλλάζει χρώμα. ③ Ανοίγει ένα παράθυρο, όπου, αν θέλω, μπορώ να επεξεργαστώ τον σελιδοδείκτη, π.χ. να του αλλάξω το όνομα. ④ Μπορώ επίσης να διαγράψω έναν σελιδοδείκτη όταν δεν τον χρειάζομαι πια",
  "Οι φυλλομετρητές σου επιτρέπουν να ανοίγεις συνδέσμους σε μια νέα καρτέλα (tab): για να ανοίξεις έναν σύνδεσμο σε νέα καρτέλα, κάνεις δεξί κλικ στον σύνδεσμο και επιλέγεις «άνοιγμα σε νέα καρτέλα». Οι νέες σελίδες που ανοίγεις παραμένουν στο ίδιο παράθυρο του φυλλομετρητή, αντί να γεμίζουν την οθόνη με πολλά παράθυρα. Οι σύγχρονοι φυλλομετρητές επιτρέπουν να ανοίγεις μεγάλο αριθμό καρτελών σε ένα μόνο παράθυρο.",
