<!DOCTYPE html>
<!--
  slide_TTS_template.html — minimal template for a TPE-dim lesson presentation.

  Shared CSS + runtime JS live OUTSIDE this file (loaded at the bottom); each
  lesson file holds ONLY its own data (LESSON + slideTexts) plus this skeleton.

  To create lesson NN:

    1. Copy this file to  TPE-dimX-PEDIO/presentations/lessonNN.html
    2. Edit LESSON below (number, unit, slides[]).
       First slide MUST be type:"title", last slide MUST be type:"assessment".
    3. Keep slideTexts[] in sync with LESSON.slides — pregen.AppImage reads it.
       Entries mirror getSlideText() in tts/scripts/presentation.js:
         title       -> unit + ". " + title (+ ". " + sub if present)
         text        -> text
         steps       -> (title? title+". ":"") + steps.join(". ")
         list        -> (title? title+". ":"") + items.join(". ")
         concept     -> text
         practice    -> (title||"Συζητήστε") + ". " + items.join(". ")
         assessment  -> check + ". " + end   (✦/✧ stripped; ". Τέλος" if no end)
   4. Generate MP3s:
   **IMPORTANT: If updating an existing presentation, delete old MP3s first:**
   rm TPE-dimX-PEDIO/presentations/audio/lessonNN/*.mp3

   ./tts/pregen.AppImage TPE-dimX-PEDIO/presentations/lessonNN.html \
                                 TPE-dimX-PEDIO/presentations/audio/lessonNN
   5. Open lessonNN.html in a browser. URL params: ?speed=0.7  ?mode=manual

  Do NOT re-inline CSS or runtime JS here — edit tts/scripts/presentation.css
  or tts/scripts/presentation.js instead (changes apply to every lesson).
-->
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Παρουσίαση</title>
<link rel="stylesheet" href="../../tts/scripts/presentation.css">
</head>
<body>

<!-- ===== BEGIN EDIT THIS SECTION ===== -->
<script>
var LESSON = {
  number: 13,
  unit: "Ενότητα 2: Υπολογιστικά συστήματα – Ψηφιακές συσκευές – Δίκτυα",
  slides: [
    { type:"title", title:"Μάθημα 13ο: Οι εφαρμογές του υπολογιστή" },
    { type:"text", text:"Θυμάμαι ότι… Το λογισμικό του υπολογιστή περιλαμβάνει εφαρμογές: (α) για να κάνουμε τις εργασίες μας, και (β) για να ελέγχει ο υπολογιστής τη λειτουργία του." },
    { type:"concept", text:"Το λογισμικό του υπολογιστή περιλαμβάνει πάρα πολλές εφαρμογές. Χωρίζονται σε κατηγορίες ανάλογα με τον σκοπό για τον οποίο χρησιμοποιούνται. Το λογισμικό που παρέχεται δωρεάν ονομάζεται ελεύθερο λογισμικό, ενώ το λογισμικό που πωλείται ονομάζεται εμπορικό λογισμικό." },
    { type:"list", title:"Κατηγορίες εφαρμογών", items:["Προγραμματισμός - ScratchJr, Scratch, MakeCode του Micro:bit","Φυλλομετρητές - Firefox, Chrome, Edge","Επεξεργασία κειμένου - Writer, Word","Παρουσιάσεις - Impress, PowerPoint","Υπολογιστικά φύλλα - Calc, Excel","Ζωγραφική και επεξεργασία εικόνας"] },
    { type:"text", text:"Οι εφαρμογές για επεξεργασία κειμένου, παρουσιάσεις και υπολογιστικά φύλλα ονομάζονται εφαρμογές γραφείου, πωλούνται ή διατίθενται δωρεάν και υπάρχουν σε πολλούς υπολογιστές." },
    { type:"concept", text:"Το πρώτο λογισμικό που ενεργοποιείται όταν ανοίγουμε τον υπολογιστή είναι το λειτουργικό σύστημα (operating system). Μερικά γνωστά λειτουργικά συστήματα είναι τα Linux, Windows, MAC OS και για ταμπλέτες και έξυπνα κινητά τηλέφωνα τα Android και iOS." },
    { type:"list", title:"Λειτουργίες του λειτουργικού συστήματος", items:["Δείχνει την επιφάνεια εργασίας και τα εικονίδια του υπολογιστή","Ελέγχει τη συνεργασία όλων των εφαρμογών και συσκευών"] },
    { type:"concept", text:"Ένας υπολογιστής χωρίς λειτουργικό σύστημα δεν μπορεί να κάνει καμία εργασία. Μπορούμε να χρησιμοποιήσουμε την εφαρμογή «Ρυθμίσεις» του λειτουργικού συστήματος για να ρυθμίσουμε τις συσκευές του υπολογιστή." },
    { type:"list", title:"Ρυθμίσεις εξατομίκευσης", items:["Εικόνα φόντου της επιφάνειας εργασίας","Θέματα, χρώματα και γραμματοσειρές","Πώς εμφανίζεται η γραμμή εργασιών και το μενού «Έναρξη»","Εικόνα για προφύλαξη της οθόνης"] },
    { type:"concept", text:"Η ανάλυση της οθόνης δείχνει πόσα εικονοστοιχεία έχει, δηλαδή σε πόσες στήλες x γραμμές χωρίζεται η οθόνη. Όσο περισσότερα τα εικονοστοιχεία τόσο περισσότερες λεπτομέρειες της εικόνας φαίνονται στην οθόνη." },
    { type:"practice", title:"Άσκηση", items:["Χρησιμοποιήστε τον υπολογιστή του εργαστηρίου","Αλλάξτε τα χρώματα και την εικόνα φόντου του περιβάλλοντος εργασίας","Αλλάξτε τη φωτεινότητα της οθόνης","Βρείτε την ανάλυση οθόνης του υπολογιστή","Αλλάξτε την ανάλυση της οθόνης και παρατηρήστε τη διαφορά"] },
    { type:"assessment", check:"Μπορώ να ομαδοποιώ τις εφαρμογές σε κατηγορίες σύμφωνα με τη χρησιμότητά τους. Μπορώ να εξηγώ τι κάνει το λειτουργικό σύστημα. Μπορώ να ρυθμίζω την οθόνη και το περιβάλλον εργασίας του υπολογιστή.", end:"Μπράβο! ✦ Τέλος ✦" }
  ]
};

// Static array read by pregen.AppImage. Keep in sync with LESSON.slides above.
var slideTexts = [
  "Ενότητα 2: Υπολογιστικά συστήματα – Ψηφιακές συσκευές – Δίκτυα. Μάθημα 13ο: Οι εφαρμογές του υπολογιστή",
  "Θυμάμαι ότι… Το λογισμικό του υπολογιστή περιλαμβάνει εφαρμογές: για να κάνουμε τις εργασίες μας, και για να ελέγχει ο υπολογιστής τη λειτουργία του.",
  "Το λογισμικό του υπολογιστή περιλαμβάνει πάρα πολλές εφαρμογές. Χωρίζονται σε κατηγορίες ανάλογα με τον σκοπό για τον οποίο χρησιμοποιούνται. Το λογισμικό που παρέχεται δωρεάν ονομάζεται ελεύθερο λογισμικό, ενώ το λογισμικό που πωλείται ονομάζεται εμπορικό λογισμικό.",
  "Κατηγορίες εφαρμογών. Προγραμματισμός - ScratchJr, Scratch, MakeCode του Micro:bit. Φυλλομετρητές - Firefox, Chrome, Edge. Επεξεργασία κειμένου - Writer, Word. Παρουσιάσεις - Impress, PowerPoint. Υπολογιστικά φύλλα - Calc, Excel. Ζωγραφική και επεξεργασία εικόνας.",
  "Οι εφαρμογές για επεξεργασία κειμένου, παρουσιάσεις και υπολογιστικά φύλλα ονομάζονται εφαρμογές γραφείου, πωλούνται ή διατίθενται δωρεάν και υπάρχουν σε πολλούς υπολογιστές.",
  "Το πρώτο λογισμικό που ενεργοποιείται όταν ανοίγουμε τον υπολογιστή είναι το λειτουργικό σύστημα. Μερικά γνωστά λειτουργικά συστήματα είναι τα Linux, Windows, MAC OS και για ταμπλέτες και έξυπνα κινητά τηλέφωνα τα Android και iOS.",
  "Λειτουργίες του λειτουργικού συστήματος. Δείχνει την επιφάνεια εργασίας και τα εικονίδια του υπολογιστή. Ελέγχει τη συνεργασία όλων των εφαρμογών και συσκευών.",
  "Ένας υπολογιστής χωρίς λειτουργικό σύστημα δεν μπορεί να κάνει καμία εργασία. Μπορούμε να χρησιμοποιήσουμε την εφαρμογή «Ρυθμίσεις» του λειτουργικού συστήματος για να ρυθμίσουμε τις συσκευές του υπολογιστή.",
  "Ρυθμίσεις εξατομίκευσης. Εικόνα φόντου της επιφάνειας εργασίας. Θέματα, χρώματα και γραμματοσειρές. Πώς εμφανίζεται η γραμμή εργασιών και το μενού «Έναρξη». Εικόνα για προφύλαξη της οθόνης.",
  "Η ανάλυση της οθόνης δείχνει πόσα εικονοστοιχεία έχει, δηλαδή σε πόσες στήλες x γραμμές χωρίζεται η οθόνη. Όσο περισσότερα τα εικονοστοιχεία τόσο περισσότερες λεπτομέρειες της εικόνας φαίνονται στην οθόνη.",
  "Άσκηση. Χρησιμοποιήστε τον υπολογιστή του εργαστηρίου. Αλλάξτε τα χρώματα και την εικόνα φόντου του περιβάλλοντος εργασίας. Αλλάξτε τη φωτεινότητα της οθόνης. Βρείτε την ανάλυση οθόνης του υπολογιστή. Αλλάξτε την ανάλυση της οθόνης και παρατηρήστε τη διαφορά.",
  "Μπορώ να ομαδοποιώ τις εφαρμογές σε κατηγορίες σύμφωνα με τη χρησιμότητά τους. Μπορώ να εξηγώ τι κάνει το λειτουργικό σύστημα. Μπορώ να ρυθμίζω την οθόνη και το περιβάλλον εργασίας του υπολογιστή. Μπράβο! Τέλος"
];
</script>
<!-- ===== END EDIT SECTION ===== -->

<div id="slides"></div>
<div id="speedBadge"></div>
<div id="dots"></div>

<div id="controls">
  <button id="prevBtn" onclick="navigate(-1)">◀</button>
  <span id="counter"></span>
  <button id="nextBtn" onclick="navigate(1)">▶</button>
  <button id="playBtn" onclick="togglePlay()">⏸</button>
  <button id="muteBtn" onclick="toggleMute()">🔊</button>
</div>

<script src="../../tts/scripts/tts.js"></script>
<script src="../../tts/scripts/presentation.js"></script>
</body>
</html>
