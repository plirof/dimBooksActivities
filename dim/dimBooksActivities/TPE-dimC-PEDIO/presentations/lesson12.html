<!DOCTYPE html>
<!--
  slide_TTS_template.html — minimal template for a TPE-dim lesson presentation.

  Shared CSS + runtime JS live OUTSIDE this file (loaded at the bottom); each
  lesson file holds ONLY its own data (LESSON + slideTexts) plus this skeleton.

  To create lesson NN:

    1. Copy this file to  TPE-dimX-PEDIO/presentations/lessonNN.html
    2. Edit LESSON below (number, unit, slides[]).
       First slide MUST be type:"title", last slide MUST be type:"assessment".
    3. Keep slideTexts[] in sync with LESSON.slides — pregen.AppImage reads it.
       Entries mirror getSlideText() in tts/scripts/presentation.js:
         title       -> unit + ". " + title (+ ". " + sub if present)
         text        -> text
         steps       -> (title? title+". ":"") + steps.join(". ")
         list        -> (title? title+". ":"") + items.join(". ")
         concept     -> text
         practice    -> (title||"Συζητήστε") + ". " + items.join(". ")
         assessment  -> check + ". " + end   (✦/✧ stripped; ". Τέλος" if no end)
   4. Generate MP3s:
   **IMPORTANT: If updating an existing presentation, delete old MP3s first:**
   rm TPE-dimX-PEDIO/presentations/audio/lessonNN/*.mp3

   ./tts/pregen.AppImage TPE-dimX-PEDIO/presentations/lessonNN.html \
                                 TPE-dimX-PEDIO/presentations/audio/lessonNN
   5. Open lessonNN.html in a browser. URL params: ?speed=0.7  ?mode=manual

  Do NOT re-inline CSS or runtime JS here — edit tts/scripts/presentation.css
  or tts/scripts/presentation.js instead (changes apply to every lesson).
-->
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Παρουσίαση</title>
<link rel="stylesheet" href="../../tts/scripts/presentation.css">
</head>
<body>

<!-- ===== BEGIN EDIT THIS SECTION ===== -->
<script>
var LESSON = {
  number: 12,
  unit: "Ενότητα 2: Υπολογιστικά συστήματα – Ψηφιακές συσκευές – Δίκτυα",
  slides: [
    { type:"title", title:"Μάθημα 12ο: Η δικτύωση υπολογιστών και ψηφιακών συσκευών" },
    { type:"concept", text:"Όταν οι ηλεκτρονικοί υπολογιστές συνδέονται μεταξύ τους, δημιουργείται ένα δίκτυο υπολογιστών. Το διαδίκτυο είναι ένα διεθνές δίκτυο με συνδεδεμένους υπολογιστές από όλο τον κόσμο." },
    { type:"concept", text:"Η σύνδεση υπολογιστών μεταξύ τους και με άλλες συσκευές γίνεται με καλώδιο, δηλαδή ενσύρματα, ή χωρίς καλώδιο, δηλαδή ασύρματα." },
    { type:"concept", text:"Για να συνδεθούν οι υπολογιστές και άλλες ψηφιακές συσκευές που βρίσκονται σε απόσταση, χρησιμοποιούμε καλώδιο, ενσύρματη σύνδεση. Χαρακτηριστικά παραδείγματα είναι τα τηλεφωνικά δίκτυα και τα δίκτυα υπολογιστών." },
    { type:"concept", text:"Δύο υπολογιστές συνδέονται κατευθείαν με καλώδιο. Για να συνδέσουμε παραπάνω από δύο υπολογιστές, είναι απαραίτητη μια επιπλέον συσκευή διακλαδωτή, που επιτρέπει τη διασύνδεση των υπολογιστών μεταξύ τους." },
    { type:"concept", text:"Η σύνδεση μεταξύ υπολογιστών ή άλλων συσκευών μπορεί να γίνει και χωρίς τη χρήση καλωδίου, ασύρματη σύνδεση, χρησιμοποιώντας τεχνολογίες ασύρματης επικοινωνίας όπως το Wi-Fi και το Bluetooth." },
    { type:"list", title:"Τεχνολογίες ασύρματης σύνδεσης", items:["Bluetooth: για σύνδεση κοντινών συσκευών","Wi-Fi: για σύνδεση στο διαδίκτυο","5G: για γρήγορη ασύρματη σύνδεση"] },
    { type:"concept", text:"Τα δίκτυα υπολογιστών είναι σαν μια «μαγική γέφυρα» που συνδέει τους υπολογιστές. Ας δούμε μερικά από τα οφέλη που παρέχουν." },
    { type:"list", title:"Οφέλη των δικτύων υπολογιστών", items:["Επικοινωνία με φίλους που βρίσκονται σε άλλον χώρο","Ανταλλαγή αρχείων εύκολα και γρήγορα","Εκτύπωση από απόσταση","Αναπαραγωγή ταινίας ή μουσικής από απόσταση"] },
    { type:"concept", text:"Χρησιμοποιώντας την τεχνολογία Bluetooth, μπορούμε να στείλουμε αρχεία όπως φωτογραφίες, βίντεο, μουσική κ.λπ. μεταξύ του κινητού τηλεφώνου και του φορητού υπολογιστή." },
    { type:"concept", text:"Τα δίκτυα Wi-Fi επιτρέπουν στις συσκευές να συνδεθούν στο διαδίκτυο χωρίς καλώδια. Μπορούμε να συνδέσουμε τον φορητό υπολογιστή, το έξυπνο κινητό, την ταμπλέτα σε ένα ασύρματο δίκτυο Wi-Fi." },
    { type:"practice", title:"Συζητήστε", items:["Τι διαφορά υπάρχει μεταξύ ενσύρματης και ασύρματης σύνδεσης;","Ποια οφέλη προσφέρουν τα δίκτυα υπολογιστών;","Ποια τεχνολογίες ασύρματης σύνδεσης γνωρίζετε;"] },
    { type:"assessment", check:"Μπορώ να περιγράφω τους τρόπους σύνδεσης υπολογιστών σε δίκτυο και τα οφέλη των δικτύων", end:"Μπράβο! ✦ Τέλος ✦" }
  ]
};

// Static array read by pregen.AppImage. Keep in sync with LESSON.slides above.
var slideTexts = [
  "Ενότητα 2: Υπολογιστικά συστήματα – Ψηφιακές συσκευές – Δίκτυα. Μάθημα 12ο: Η δικτύωση υπολογιστών και ψηφιακών συσκευών",
  "Όταν οι ηλεκτρονικοί υπολογιστές συνδέονται μεταξύ τους, δημιουργείται ένα δίκτυο υπολογιστών. Το διαδίκτυο είναι ένα διεθνές δίκτυο με συνδεδεμένους υπολογιστές από όλο τον κόσμο.",
  "Η σύνδεση υπολογιστών μεταξύ τους και με άλλες συσκευές γίνεται με καλώδιο, δηλαδή ενσύρματα, ή χωρίς καλώδιο, δηλαδή ασύρματα.",
  "Για να συνδεθούν οι υπολογιστές και άλλες ψηφιακές συσκευές που βρίσκονται σε απόσταση, χρησιμοποιούμε καλώδιο, ενσύρματη σύνδεση. Χαρακτηριστικά παραδείγματα είναι τα τηλεφωνικά δίκτυα και τα δίκτυα υπολογιστών.",
  "Δύο υπολογιστές συνδέονται κατευθείαν με καλώδιο. Για να συνδέσουμε παραπάνω από δύο υπολογιστές, είναι απαραίτητη μια επιπλέον συσκευή διακλαδωτή, που επιτρέπει τη διασύνδεση των υπολογιστών μεταξύ τους.",
  "Η σύνδεση μεταξύ υπολογιστών ή άλλων συσκευών μπορεί να γίνει και χωρίς τη χρήση καλωδίου, ασύρματη σύνδεση, χρησιμοποιώντας τεχνολογίες ασύρματης επικοινωνίας όπως το Wi-Fi και το Bluetooth.",
  "Τεχνολογίες ασύρματης σύνδεσης. Bluetooth: για σύνδεση κοντινών συσκευών. Wi-Fi: για σύνδεση στο διαδίκτυο. 5G: για γρήγορη ασύρματη σύνδεση",
  "Τα δίκτυα υπολογιστών είναι σαν μια «μαγική γέφυρα» που συνδέει τους υπολογιστές. Ας δούμε μερικά από τα οφέλη που παρέχουν.",
  "Οφέλη των δικτύων υπολογιστών. Επικοινωνία με φίλους που βρίσκονται σε άλλον χώρο. Ανταλλαγή αρχείων εύκολα και γρήγορα. Εκτύπωση από απόσταση. Αναπαραγωγή ταινίας ή μουσικής από απόσταση",
  "Χρησιμοποιώντας την τεχνολογία Bluetooth, μπορούμε να στείλουμε αρχεία όπως φωτογραφίες, βίντεο, μουσική κ.λπ. μεταξύ του κινητού τηλεφώνου και του φορητού υπολογιστή.",
  "Τα δίκτυα Wi-Fi επιτρέπουν στις συσκευές να συνδεθούν στο διαδίκτυο χωρίς καλώδια. Μπορούμε να συνδέσουμε τον φορητό υπολογιστή, το έξυπνο κινητό, την ταμπλέτα σε ένα ασύρματο δίκτυο Wi-Fi.",
  "Συζητήστε. Τι διαφορά υπάρχει μεταξύ ενσύρματης και ασύρματης σύνδεσης; Ποια οφέλη προσφέρουν τα δίκτυα υπολογιστών; Ποια τεχνολογίες ασύρματης σύνδεσης γνωρίζετε;",
  "Μπορώ να περιγράφω τους τρόπους σύνδεσης υπολογιστών σε δίκτυο και τα οφέλη των δικτύων. Μπράβο! Τέλος"
];
</script>
<!-- ===== END EDIT SECTION ===== -->

<div id="slides"></div>
<div id="speedBadge"></div>
<div id="dots"></div>

<div id="controls">
  <button id="prevBtn" onclick="navigate(-1)">◀</button>
  <span id="counter"></span>
  <button id="nextBtn" onclick="navigate(1)">▶</button>
  <button id="playBtn" onclick="togglePlay()">⏸</button>
  <button id="muteBtn" onclick="toggleMute()">🔊</button>
</div>

<script src="../../tts/scripts/tts.js"></script>
<script src="../../tts/scripts/presentation.js"></script>
</body>
</html>
