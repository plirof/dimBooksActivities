<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Χάρτης Θησαυρού!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(135deg,#2193b0 0%,#6dd5ed 100%);font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;display:flex;align-items:center;justify-content:center;padding:10px}
.container{max-width:700px;width:100%;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);padding:30px;text-align:center}
h1{color:#4a4a4a;font-size:1.8em;margin-bottom:5px}
h2{color:#7f8c8d;font-size:1.1em;font-weight:normal;margin-bottom:15px}
.instructions{background:#e8f8ff;border-radius:15px;padding:15px;margin-bottom:20px;color:#555;font-size:0.95em;line-height:1.5}
.grid-container{display:flex;justify-content:center;margin:20px 0}
.grid{display:grid;gap:3px;background:#ddd;padding:3px;border-radius:12px;box-shadow:inset 0 2px 5px rgba(0,0,0,0.1)}
.cell{width:55px;height:55px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.5em;transition:all 0.3s;position:relative}
.cell.normal{background:#e8f8ff}
.cell.obstacle{background:#5d4037}
.cell.robot{background:#81c784;box-shadow:0 0 10px rgba(76,175,80,0.5)}
.cell.treasure{background:#fff9c4}
.cell.trail{background:#c8e6c9}
.cell.start{background:#bbdefb}
.controls{display:flex;flex-direction:column;align-items:center;gap:5px;margin:20px 0}
.controls-row{display:flex;gap:5px}
.dir-btn{width:80px;height:50px;border:none;border-radius:12px;font-size:0.85em;font-weight:bold;cursor:pointer;transition:all 0.2s;box-shadow:0 3px 8px rgba(0,0,0,0.15);color:#fff}
.dir-btn:active{transform:scale(0.95)}
.dir-btn.n{background:linear-gradient(135deg,#2196f3,#1976d2)}
.dir-btn.s{background:linear-gradient(135deg,#f44336,#d32f2f)}
.dir-btn.e{background:linear-gradient(135deg,#4caf50,#388e3c)}
.dir-btn.w{background:linear-gradient(135deg,#ff9800,#f57c00)}
.dir-btn:disabled{background:#bbb!important;cursor:not-allowed}
.info-bar{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin:15px 0}
.info-item{background:#f0f4ff;border-radius:12px;padding:10px 20px;font-size:1em;color:#555}
.info-item span{font-weight:bold;color:#2193b0}
.btn{background:linear-gradient(135deg,#2193b0,#6dd5ed);color:#fff;border:none;padding:12px 30px;border-radius:15px;font-size:1.1em;cursor:pointer;transition:all 0.3s;box-shadow:0 5px 15px rgba(33,147,176,0.3);margin:5px}
.btn:hover{transform:translateY(-2px)}
.result-box{padding:20px;border-radius:15px;margin:15px 0;animation:popIn 0.5s ease}
.result-box.success{background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff}
.result-box.fail{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff}
.start-screen .emoji{font-size:3em;margin:10px 0}
.path-display{margin:10px 0;font-size:0.95em;color:#7f8c8d;min-height:20px}
@keyframes popIn{0%{transform:scale(0.5);opacity:0}50%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
@media(max-width:500px){.cell{width:40px;height:40px;font-size:1.2em}.dir-btn{width:65px;height:42px;font-size:0.75em}.container{padding:15px}}
</style>
<link rel="stylesheet" href="fonts/emoji-font.css">
</head>
<body>
<div class="container" id="app"></div>
<script>
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

const params=new URLSearchParams(window.location.search);
const dataFile=params.get('data');
let gameData=null;
let robotPos={row:0,col:0};
let moves=0;
let path=[];
let gameOver=false;

if(!dataFile){document.getElementById('app').innerHTML='<h1>Δεν βρέθηκαν δεδομένα</h1><p>Πρόσθεσε ?data=archivo.json στο URL</p>';}

function loadGame(){
fetch(dataFile).then(r=>r.json()).then(d=>{gameData=d;showStart();}).catch(()=>{document.getElementById('app').innerHTML='<h1>Σφάλμα φόρτωσης</h1>';});
}

function showStart(){
const app=document.getElementById('app');
app.innerHTML='<div class="start-screen"><div class="emoji">🗺️</div><h1>'+esc(gameData.title)+'</h1><h2>'+esc(gameData.subtitle)+'</h2><div class="instructions">'+esc(gameData.instructions)+'</div><br><button class="btn" onclick="startGame()">Ξεκίνα! 🚀</button></div>';
}

function startGame(){
robotPos={row:gameData.start.row,col:gameData.start.col};
moves=0;
path=[{row:robotPos.row,col:robotPos.col}];
gameOver=false;
renderGame();
}

function isObstacle(r,c){
return gameData.obstacles.some(o=>o.row===r&&o.col===c);
}

function isTrail(r,c){
return path.some((p,i)=>i<path.length-1&&p.row===r&&p.col===c);
}

function renderGame(){
const app=document.getElementById('app');
const sz=gameData.gridSize;
let gridHtml='';
for(let r=0;r<sz;r++){
for(let c=0;c<sz;c++){
let cls='normal';
let content='';
if(isObstacle(r,c)){cls='obstacle';content='🧱';}
else if(r===robotPos.row&&c===robotPos.col){cls='robot';content='🤖';}
else if(r===gameData.treasure.row&&c===gameData.treasure.col){cls='treasure';content='💎';}
else if(r===gameData.start.row&&c===gameData.start.col&&!(r===robotPos.row&&c===robotPos.col)){cls='start';}
else if(isTrail(r,c)){cls='trail';}
gridHtml+='<div class="cell '+cls+'">'+content+'</div>';
}
}
const pathStr=path.map(p=>'('+p.row+','+p.col+')').join(' → ');
const remaining=gameData.maxMoves-moves;
const canN=!gameOver&&robotPos.row>0&&!isObstacle(robotPos.row-1,robotPos.col);
const canS=!gameOver&&robotPos.row<sz-1&&!isObstacle(robotPos.row+1,robotPos.col);
const canE=!gameOver&&robotPos.col<sz-1&&!isObstacle(robotPos.row,robotPos.col+1);
const canW=!gameOver&&robotPos.col>0&&!isObstacle(robotPos.row,robotPos.col-1);
let resultHtml='';
if(gameOver){
if(robotPos.row===gameData.treasure.row&&robotPos.col===gameData.treasure.col){
resultHtml='<div class="result-box success">🎉 Βρήκες τον θησαυρό σε '+moves+' κινήσεις!</div>';
}else{
resultHtml='<div class="result-box fail">😭 Έτρεξες τις κινήσεις! Δοκίμασε ξανά!</div>';
}
}
app.innerHTML='<h1>'+esc(gameData.title)+'</h1><h2>'+esc(gameData.subtitle)+'</h2><div class="info-bar"><div class="info-item">Κινήσεις: <span>'+moves+'/'+gameData.maxMoves+'</span></div><div class="info-item">Απομένουν: <span>'+remaining+'</span></div></div><div class="grid-container"><div class="grid" style="grid-template-columns:repeat('+sz+',1fr)">'+gridHtml+'</div></div><div class="controls"><div class="controls-row"><button class="dir-btn n" onclick="move(-1,0)" '+(canN?'':'disabled')+'>'+esc(gameData.compassLabels.N)+'</button></div><div class="controls-row"><button class="dir-btn w" onclick="move(0,-1)" '+(canW?'':'disabled')+'>'+esc(gameData.compassLabels.W)+'</button><button class="dir-btn e" onclick="move(0,1)" '+(canE?'':'disabled')+'>'+esc(gameData.compassLabels.E)+'</button></div><div class="controls-row"><button class="dir-btn s" onclick="move(1,0)" '+(canS?'':'disabled')+'>'+esc(gameData.compassLabels.S)+'</button></div></div><div class="path-display">Μονοπάτι: '+pathStr+'</div>'+resultHtml+'<br><button class="btn" onclick="startGame()">Ξανάρχιση 🔄</button><button class="btn" onclick="showStart()">Αρχική 🏠</button>';
}

function move(dr,dc){
if(gameOver)return;
const nr=robotPos.row+dr;
const nc=robotPos.col+dc;
const sz=gameData.gridSize;
if(nr<0||nr>=sz||nc<0||nc>=sz)return;
if(isObstacle(nr,nc))return;
robotPos.row=nr;
robotPos.col=nc;
moves++;
path.push({row:nr,col:nc});
if(nr===gameData.treasure.row&&nc===gameData.treasure.col){
gameOver=true;
}else if(moves>=gameData.maxMoves){
gameOver=true;
}
renderGame();
}

if(dataFile)loadGame();
</script>
</body>
</html>
