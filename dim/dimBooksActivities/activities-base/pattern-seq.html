<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ακολουθίες</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(135deg,#ff9a9e 0%,#fad0c4 50%,#fbc2eb 100%);font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;display:flex;align-items:center;justify-content:center;padding:10px}
.container{max-width:700px;width:100%;background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.15);padding:30px;text-align:center}
h1{color:#e91e63;font-size:1.8rem;margin-bottom:5px}
h2{color:#7b1fa2;font-size:1.1rem;margin-bottom:20px;font-weight:400}
.start-btn,.restart-btn{background:linear-gradient(135deg,#e91e63,#9c27b0);color:#fff;border:none;padding:14px 40px;border-radius:30px;font-size:1.2rem;cursor:pointer;box-shadow:0 5px 15px rgba(233,30,99,.3);transition:transform .2s,box-shadow .2s}
.start-btn:hover,.restart-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(233,30,99,.4)}
.seq-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:25px 0}
.seq-item{width:65px;height:65px;display:flex;align-items:center;justify-content:center;border-radius:15px;font-size:1.6rem;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.1);border:3px solid #e0e0e0;background:#fff}
.seq-item.question{border-color:#e91e63;background:linear-gradient(135deg,#fce4ec,#f8bbd0);color:#e91e63;font-size:2rem;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.options-row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:20px 0}
.opt-btn{min-width:65px;height:65px;border-radius:15px;font-size:1.6rem;font-weight:700;border:3px solid #e0e0e0;background:#fff;cursor:pointer;transition:all .2s;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.opt-btn:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.15)}
.opt-btn.correct{border-color:#4caf50;background:#e8f5e9;animation:popCorrect .4s}
.opt-btn.wrong{border-color:#f44336;background:#ffebee;animation:shake .4s}
@keyframes popCorrect{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.info-bar{display:flex;justify-content:space-between;margin-bottom:15px;font-size:.95rem;color:#666}
.score-display{font-size:1.2rem;font-weight:700;color:#9c27b0;margin-top:10px}
.feedback{font-size:1.1rem;font-weight:600;margin:10px 0;min-height:30px}
.feedback.ok{color:#4caf50}
.feedback.fail{color:#f44336}
.hidden{display:none}
.end-score{font-size:3rem;color:#e91e63;font-weight:700;margin:15px 0}
.progress{height:8px;background:#eee;border-radius:4px;margin:15px 0;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#e91e63,#9c27b0);border-radius:4px;transition:width .3s}
</style>
<link rel="stylesheet" href="fonts/emoji-font.css">
</head>
<body>
<div class="container">
<div id="error" class="hidden" style="color:#f44336;font-size:1.1rem;padding:30px"></div>
<div id="startScreen">
<h1 id="gameTitle">Ακολουθίες</h1>
<h2 id="gameSubtitle">Βρες τι ακολουθεί!</h2>
<button class="start-btn" onclick="startGame()">▶ Έναρξη</button>
</div>
<div id="gameScreen" class="hidden">
<div class="info-bar">
<span id="roundInfo"></span>
<span id="scoreInfo"></span>
</div>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="feedback" id="feedback"></div>
<div class="seq-row" id="seqRow"></div>
<div class="options-row" id="optionsRow"></div>
</div>
<div id="endScreen" class="hidden">
<h1>Τέλος Παιχνιδιού!</h1>
<div class="end-score" id="endScore"></div>
<p id="endMsg" style="font-size:1.1rem;color:#666;margin-bottom:20px"></p>
<button class="restart-btn" onclick="restartGame()">🔄 Ξανά!</button>
</div>
</div>
<script>
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
const params=new URLSearchParams(window.location.search);
const dataFile=params.get('data');
let gameData=null,currentIndex=0,score=0,answered=false;
if(!dataFile){document.getElementById('error').textContent='Δεν βρέθηκε αρχείο δεδομένων. Χρησιμοποίησε ?data=file.json';document.getElementById('error').classList.remove('hidden');document.getElementById('startScreen').classList.add('hidden')}else{fetch(dataFile).then(r=>{if(!r.ok)throw new Error();return r.json()}).then(d=>{gameData=d;document.getElementById('gameTitle').textContent=esc(d.title||'Ακολουθίες');document.getElementById('gameSubtitle').textContent=esc(d.subtitle||'')}).catch(()=>{document.getElementById('error').textContent='Σφάλμα φόρτωσης δεδομένων: '+esc(dataFile);document.getElementById('error').classList.remove('hidden');document.getElementById('startScreen').classList.add('hidden')})}
function startGame(){currentIndex=0;score=0;document.getElementById('startScreen').classList.add('hidden');document.getElementById('endScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');showRound()}
function showRound(){answered=false;const seq=gameData.sequences[currentIndex];const total=gameData.sequences.length;document.getElementById('roundInfo').textContent='Γύρος '+(currentIndex+1)+'/'+total;document.getElementById('scoreInfo').textContent='Σκορ: '+score;document.getElementById('progressBar').style.width=((currentIndex)/total*100)+'%';document.getElementById('feedback').textContent='';document.getElementById('feedback').className='feedback';const seqRow=document.getElementById('seqRow');seqRow.innerHTML='';seq.items.forEach((item,i)=>{const div=document.createElement('div');div.className='seq-item'+(item==='?'?' question':'');div.textContent=item;seqRow.appendChild(div)});const optRow=document.getElementById('optionsRow');optRow.innerHTML='';seq.options.forEach((opt,i)=>{const btn=document.createElement('button');btn.className='opt-btn';btn.textContent=opt;btn.onclick=()=>pickOption(i,btn);optRow.appendChild(btn)})}
function pickOption(idx,btn){if(answered)return;answered=true;const seq=gameData.sequences[currentIndex];const allBtns=document.querySelectorAll('.opt-btn');if(idx===seq.correctIndex){btn.classList.add('correct');document.getElementById('feedback').textContent='Σωστό! 🎉';document.getElementById('feedback').className='feedback ok';score++;document.getElementById('scoreInfo').textContent='Σκορ: '+score}else{btn.classList.add('wrong');allBtns[seq.correctIndex].classList.add('correct');document.getElementById('feedback').textContent='Λάθος! Η σωστή απάντηση ήταν: '+seq.options[seq.correctIndex];document.getElementById('feedback').className='feedback fail'}setTimeout(()=>{currentIndex++;if(currentIndex>=gameData.sequences.length){endGame()}else{showRound()}},1500)}
function endGame(){document.getElementById('gameScreen').classList.add('hidden');document.getElementById('endScreen').classList.remove('hidden');const total=gameData.sequences.length;document.getElementById('endScore').textContent=score+' / '+total;const pct=score/total;if(pct>=.8)document.getElementById('endMsg').textContent='Εξαιρετικά! Είσαι πραγματικόςmaster των ακολουθιών! 🌟';else if(pct>=.5)document.getElementById('endMsg').textContent='Μπράβο! Καλή προσπάθεια! 😊';else document.getElementById('endMsg').textContent='Μην απογοητεύεσαι! Δοκίμασε ξανά! 💪'}
function restartGame(){document.getElementById('endScreen').classList.add('hidden');document.getElementById('startScreen').classList.remove('hidden')}
</script>
</body>
</html>
