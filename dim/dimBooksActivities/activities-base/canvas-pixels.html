<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Art</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#89f7fe 0%,#66a6ff 100%);min-height:100vh;padding:20px}
.container{background:#fff;border-radius:20px;padding:25px;max-width:700px;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
h1{color:#333;text-align:center;margin-bottom:5px;font-size:1.5em}
h2{color:#666;text-align:center;font-size:.95em;margin-bottom:20px;font-weight:400}
.game-layout{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.canvas-area{flex-shrink:0}
.pixel-grid{display:inline-grid;gap:1px;background:#ccc;border:2px solid #999;border-radius:4px;padding:1px}
.pixel{width:30px;height:30px;background:#fff;cursor:pointer;border-radius:2px;transition:background .1s}
.pixel:hover{outline:2px solid #66a6ff;z-index:1}
.sidebar{flex:1;min-width:150px;max-width:200px}
.palette{margin-bottom:15px}
.palette h3{margin-bottom:8px;color:#555;font-size:.9em}
.palette-colors{display:flex;flex-wrap:wrap;gap:6px}
.palette-color{width:36px;height:36px;border-radius:8px;cursor:pointer;border:3px solid transparent;transition:all .15s}
.palette-color:hover{transform:scale(1.1)}
.palette-color.active{border-color:#333;transform:scale(1.15)}
.tools{margin-bottom:15px}
.tools h3{margin-bottom:8px;color:#555;font-size:.9em}
.tool-btn{padding:8px 14px;margin:0 4px 4px 0;border:2px solid #e0e0e0;background:#fff;border-radius:8px;cursor:pointer;font-size:.85em;transition:all .15s}
.tool-btn:hover{border-color:#66a6ff}
.tool-btn.active{border-color:#66a6ff;background:#e3f2fd}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.action-btn{padding:10px 20px;border:none;border-radius:10px;cursor:pointer;font-size:.9em;font-weight:600;transition:all .15s}
.action-btn:hover{transform:scale(1.05)}
.action-btn.check{background:#4CAF50;color:#fff}
.action-btn.clear{background:#f44336;color:#fff}
.action-btn.show{background:#66a6ff;color:#fff}
.result-msg{text-align:center;margin-top:15px;padding:12px;border-radius:10px;font-size:1.1em;font-weight:600;display:none}
.result-msg.win{background:#e8f5e9;color:#2e7d32}
.result-msg.wrong{background:#fff3e0;color:#e65100}
.error{color:#f44336;text-align:center;padding:40px;font-size:1.2em}
</style>
</head>
<body>
<div class="container" id="app"><div class="error">Φόρτωση...</div></div>
<script>
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

const params=new URLSearchParams(window.location.search);
const dataFile=params.get('data');
const app=document.getElementById('app');

if(!dataFile){app.innerHTML='<div class="error">Δεν βρέθηκε το αρχείο δεδομένων.</div>';throw new Error('No data')}

fetch(dataFile).then(r=>{if(!r.ok)throw new Error('Δεν βρέθηκε: '+dataFile);return r.json()}).then(data=>{
const rows=data.rows||8;
const cols=data.cols||8;
const palette=data.palette||['#FFFFFF','#000000','#FF0000','#00FF00','#0000FF','#FFFF00','#FFA500','#800080'];
const solution=data.solution||null;
let selectedColor=palette[1];
let currentTool='paint';
let grid=Array.from({length:rows},()=>Array(cols).fill(0));

function render(){
app.innerHTML=`
<h1>${esc(data.title)}</h1>
<h2>${esc(data.subtitle||'Χρωμάτισε τα pixels!')}</h2>
<div class="game-layout">
<div class="canvas-area">
<div class="pixel-grid" id="pixelGrid" style="grid-template-columns:repeat(${cols},30px)">
${Array.from({length:rows},(_,r)=>Array.from({length:cols},(_,c)=>`<div class="pixel" data-r="${r}" data-c="${c}"></div>`).join('')).join('')}
</div>
<div class="buttons">
${solution?'<button class="action-btn check" onclick="checkSolution()">✓ Έλεγχος</button>':''}
<button class="action-btn clear" onclick="clearGrid()">✕ Καθαρισμός</button>
${solution?'<button class="action-btn show" onclick="showSolution()">👁 Λύση</button>':''}
</div>
<div class="result-msg" id="result"></div>
</div>
<div class="sidebar">
<div class="palette"><h3>Χρώματα</h3>
<div class="palette-colors" id="paletteArea">
${palette.map((c,i)=>`<div class="palette-color ${c===selectedColor?'active':''}" style="background:${c}" data-color="${c}" data-idx="${i}" onclick="selectColor('${c}',${i})"></div>`).join('')}
</div></div>
<div class="tools"><h3>Εργαλεία</h3>
<button class="tool-btn active" id="toolPaint" onclick="setTool('paint')">🖌 Μολύβι</button>
<button class="tool-btn" id="toolEraser" onclick="setTool('eraser')">◻ Γόμα</button>
</div>
</div>
</div>
`;
setupEvents()
}

function setupEvents(){
const gridEl=document.getElementById('pixelGrid');
let painting=false;
gridEl.addEventListener('mousedown',e=>{
const px=e.target.closest('.pixel');if(!px)return;
painting=true;paint(px)
});
gridEl.addEventListener('mouseover',e=>{
if(!painting)return;
const px=e.target.closest('.pixel');if(px)paint(px)
});
document.addEventListener('mouseup',()=>painting=false);
gridEl.addEventListener('touchstart',e=>{e.preventDefault();const px=e.target.closest('.pixel');if(px)paint(px)},{passive:false});
gridEl.addEventListener('touchmove',e=>{
e.preventDefault();
const touch=e.touches[0];
const el=document.elementFromPoint(touch.clientX,touch.clientY);
if(el&&el.classList.contains('pixel'))paint(el)
},{passive:false})
}

function paint(px){
const r=parseInt(px.dataset.r);
const c=parseInt(px.dataset.c);
if(currentTool==='eraser'){
grid[r][c]=0;
px.style.background='#fff'
}else{
const idx=palette.indexOf(selectedColor);
grid[r][c]=idx;
px.style.background=selectedColor
}
}

window.selectColor=function(color,idx){
selectedColor=color;
currentTool='paint';
document.querySelectorAll('.palette-color').forEach(c=>c.classList.remove('active'));
document.querySelector(`.palette-color[data-idx="${idx}"]`).classList.add('active');
document.getElementById('toolPaint').classList.add('active');
document.getElementById('toolEraser').classList.remove('active')
};

window.setTool=function(tool){
currentTool=tool;
document.getElementById('toolPaint').classList.toggle('active',tool==='paint');
document.getElementById('toolEraser').classList.toggle('active',tool==='eraser')
};

window.clearGrid=function(){
grid=Array.from({length:rows},()=>Array(cols).fill(0));
document.querySelectorAll('.pixel').forEach(px=>px.style.background='#fff');
document.getElementById('result').style.display='none'
};

window.showSolution=function(){
if(!solution)return;
document.querySelectorAll('.pixel').forEach(px=>{
const r=parseInt(px.dataset.r);
const c=parseInt(px.dataset.c);
const idx=(solution[r]&&solution[r][c]!==undefined)?solution[r][c]:0;
px.style.background=palette[idx]||'#fff'
})
};

window.checkSolution=function(){
if(!solution)return;
let correct=0,total=rows*cols;
document.querySelectorAll('.pixel').forEach(px=>{
const r=parseInt(px.dataset.r);
const c=parseInt(px.dataset.c);
const expected=(solution[r]&&solution[r][c]!==undefined)?solution[r][c]:0;
const actual=grid[r][c];
if(actual===expected)correct++
});
const pct=Math.round((correct/total)*100);
const el=document.getElementById('result');
if(pct>=90){
el.className='result-msg win';
el.textContent='Μπράβο! Τέλεια δουλειά! ('+pct+'%)'
}else{
el.className='result-msg wrong';
el.textContent='Έχεις '+pct+'% σωστά. Συνέχισε!'
}
el.style.display='block'
};

render()
}).catch(err=>{app.innerHTML='<div class="error">Σφάλμα: '+esc(err.message)+'</div>'});
</script>
</body>
</html>
