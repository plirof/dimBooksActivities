<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Χρώμα ή Λέξη;</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#e91e63 0%,#9c27b0 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.container{background:#fff;border-radius:20px;padding:30px;max-width:700px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
h1{color:#333;text-align:center;margin-bottom:5px;font-size:1.5em}
h2{color:#666;text-align:center;font-size:.95em;margin-bottom:15px;font-weight:400}
.game-header{display:flex;justify-content:space-between;padding:10px 15px;background:#f8f9fa;border-radius:10px;margin-bottom:10px}
.stat{font-size:.9em;color:#555}.stat span{font-weight:700;color:#e91e63;font-size:1.1em}
.progress{background:#e0e0e0;border-radius:10px;height:12px;margin-bottom:20px;overflow:hidden}
.progress-bar{background:linear-gradient(90deg,#e91e63,#9c27b0);height:100%;border-radius:10px;transition:width .4s}
.timer-bar{height:8px;background:#eee;border-radius:4px;margin-bottom:15px;overflow:hidden}
.timer-fill{height:100%;background:linear-gradient(90deg,#4CAF50,#ff9800,#f44336);border-radius:4px;transition:width 1s linear}
.word-display{text-align:center;padding:30px 20px;margin:20px 0;border-radius:16px;background:#f8f9fa}
.word-display .word{font-size:3em;font-weight:800;letter-spacing:3px;text-transform:uppercase}
.color-buttons{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px 0}
.color-btn{padding:12px 24px;border:3px solid transparent;border-radius:12px;color:#fff;font-size:1.05em;font-weight:600;cursor:pointer;transition:all .2s;min-width:110px;text-align:center}
.color-btn:hover{transform:scale(1.08);box-shadow:0 4px 15px rgba(0,0,0,.2)}
.color-btn.correct-pick{border-color:#4CAF50;box-shadow:0 0 20px rgba(76,175,80,.5)}
.color-btn.wrong-pick{border-color:#f44336;box-shadow:0 0 20px rgba(244,67,54,.5)}
.start-screen,.end-screen{text-align:center;padding:30px 20px}
.start-screen h2,.end-screen h2{color:#333;margin-bottom:10px}
.start-screen p{color:#666;margin-bottom:15px;line-height:1.5}
.start-btn,.restart-btn{padding:12px 40px;background:linear-gradient(135deg,#e91e63,#9c27b0);color:#fff;border:none;border-radius:12px;font-size:1.1em;cursor:pointer;font-weight:600}
.start-btn:hover,.restart-btn:hover{transform:scale(1.05)}
.final-score{font-size:3em;color:#e91e63;font-weight:700}
.message{color:#666;margin:10px 0 20px;font-size:1.1em}
.feedback{text-align:center;padding:10px;border-radius:8px;font-size:1.1em;font-weight:600;margin:10px 0}
.feedback.correct-fb{background:#e8f5e9;color:#2e7d32}
.feedback.wrong-fb{background:#ffebee;color:#c62828}
.error{color:#f44336;text-align:center;padding:40px;font-size:1.2em}
</style>
<link rel="stylesheet" href="fonts/emoji-font.css">
</head>
<body>
<div class="container" id="app"><div class="error">Φόρτωση...</div></div>
<script>
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

const params=new URLSearchParams(window.location.search);
const dataFile=params.get('data');
const app=document.getElementById('app');

if(!dataFile){app.innerHTML='<div class="error">Δεν βρέθηκε το αρχείο δεδομένων.</div>';throw new Error('No data')}

fetch(dataFile).then(r=>{if(!r.ok)throw new Error('Δεν βρέθηκε: '+dataFile);return r.json()}).then(data=>{
const colors=data.colors||[];
const duration=data.duration||30;
const totalRounds=data.rounds||15;
let currentRound=0,score=0,timeLeft=duration,gameRunning=false,timerInterval=null;

function showStart(){
app.innerHTML=`
<h1>${esc(data.title)}</h1>
<div class="start-screen">
<h2>${esc(data.subtitle||'')}</h2>
<p>${esc(data.instructions||'')}</p>
<p>Γύροι: ${totalRounds} | Χρόνος: ${duration}s</p>
<button class="start-btn" onclick="startGame()">▶ Ξεκίνα!</button>
</div>`
}

window.startGame=function(){
currentRound=0;score=0;timeLeft=duration;gameRunning=true;
timerInterval=setInterval(()=>{
if(!gameRunning)return;
timeLeft--;
const timerEl=document.getElementById('timer');if(timerEl)timerEl.textContent=timeLeft;
const fillEl=document.getElementById('timerFill');if(fillEl)fillEl.style.width=((timeLeft/duration)*100)+'%';
if(timeLeft<=0){gameRunning=false;clearInterval(timerInterval);showEnd()}
},1000);
nextRound()
};

function nextRound(){
if(currentRound>=totalRounds){gameRunning=false;clearInterval(timerInterval);showEnd();return}
const wordIdx=Math.floor(Math.random()*colors.length);
let inkIdx;
do{inkIdx=Math.floor(Math.random()*colors.length)}while(inkIdx===wordIdx);
const wordColor=colors[wordIdx];
const inkColor=colors[inkIdx];
const correctInkIdx=inkIdx;
const options=[inkIdx];
while(options.length<Math.min(4,colors.length)){
const ri=Math.floor(Math.random()*colors.length);
if(!options.includes(ri))options.push(ri)
}
const shuffled=options.sort(()=>Math.random()-.5);
currentRound++;
const pct=(currentRound/totalRounds)*100;
app.innerHTML=`
<h1>${esc(data.title)}</h1>
<h2>${esc(data.subtitle||'')}</h2>
<div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>
<div class="game-header">
<div class="stat">Σκορ: <span>${score}</span></div>
<div class="stat">Γύρος: <span>${currentRound}/${totalRounds}</span></div>
<div class="stat">Χρόνος: <span id="timer">${timeLeft}</span>s</div>
</div>
<div style="height:8px;background:#eee;border-radius:4px;margin-bottom:15px;overflow:hidden"><div id="timerFill" style="height:100%;background:linear-gradient(90deg,#4CAF50,#ff9800,#f44336);border-radius:4px;width:100%;transition:width 1s linear"></div></div>
<div class="word-display">
<div class="word" style="color:${inkColor.hex}">${esc(wordColor.name)}</div>
</div>
<div class="color-buttons" id="colorBtns">
${shuffled.map(idx=>`<button class="color-btn" style="background:${colors[idx].hex}" data-idx="${idx}" onclick="pickColor(this,${idx},${correctInkIdx})">${esc(colors[idx].name)}</button>`).join('')}
</div>
<div id="feedback"></div>
`
}

window.pickColor=function(el,picked,correct){
if(!gameRunning)return;
const btns=document.querySelectorAll('.color-btn');
btns.forEach(b=>b.onclick=null);
if(picked===correct){
score++;
el.classList.add('correct-pick');
const fb=document.getElementById('feedback');
fb.innerHTML='<div class="feedback correct-fb">✓ Σωστό!</div>'
}else{
el.classList.add('wrong-pick');
const correctBtn=document.querySelector(`.color-btn[data-idx="${correct}"]`);
if(correctBtn)correctBtn.classList.add('correct-pick');
const fb=document.getElementById('feedback');
fb.innerHTML='<div class="feedback wrong-fb">✗ Λάθος! Το σωστό ήταν: '+esc(colors[correct].name)+'</div>'
}
setTimeout(()=>{if(gameRunning)nextRound()},1200)
};

function showEnd(){
const pct=Math.round((score/totalRounds)*100);
let msg=pct>=90?'Εξαιρετικά! Τέλεια συγκέντρωση!':pct>=70?'Μπράβο! Πολύ καλά!':pct>=50?'Καλά! Προσπάθησε περισσότερο!':'Δοκίμασε ξανά!';
app.innerHTML=`
<h1>${esc(data.title)}</h1>
<div class="end-screen" style="display:block">
<h2>Αποτέλεσμα</h2>
<div class="final-score">${score}/${totalRounds}</div>
<div class="message">${msg} (${pct}%)</div>
<button class="restart-btn" onclick="location.reload()">Ξαναδοκίμασε!</button>
</div>`
}

showStart()
}).catch(err=>{app.innerHTML='<div class="error">Σφάλμα: '+esc(err.message)+'</div>'});
</script>
</body>
</html>
