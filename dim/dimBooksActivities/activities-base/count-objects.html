<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Μέτρησε!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#43a047 0%,#00695c 100%);font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;padding:10px}
.container{max-width:700px;width:100%;background:#fff;border-radius:20px;padding:30px;box-shadow:0 10px 40px rgba(0,0,0,.25);text-align:center}
h1{color:#1b5e20;font-size:1.8rem;margin-bottom:5px}
h2{color:#2e7d32;font-size:1.1rem;margin-bottom:20px;font-weight:400}
.start-btn,.restart-btn{background:linear-gradient(135deg,#2e7d32,#1b5e20);color:#fff;border:none;padding:14px 40px;border-radius:50px;font-size:1.2rem;cursor:pointer;transition:transform .2s;margin-top:15px}
.start-btn:hover,.restart-btn:hover{transform:scale(1.05)}
.score-bar{display:flex;justify-content:space-between;margin-bottom:10px;font-size:.95rem;color:#2e7d32;font-weight:600}
.game-area{position:relative;width:100%;height:280px;background:#e8f5e9;border-radius:15px;margin:10px 0;overflow:hidden}
.game-area .emoji{position:absolute;font-size:2.5rem;user-select:none;line-height:1}
.options-area{margin-top:15px}
.options-area button{display:inline-block;margin:5px;padding:12px 22px;border:2px solid #2e7d32;border-radius:25px;background:#fff;color:#1b5e20;font-size:1.2rem;cursor:pointer;transition:all .2s;min-width:50px;font-weight:700}
.options-area button:hover{background:#2e7d32;color:#fff}
.options-area button.correct{background:#4CAF50;color:#fff;border-color:#4CAF50}
.options-area button.wrong{background:#f44336;color:#fff;border-color:#f44336}
.options-area button:disabled{cursor:not-allowed;opacity:.7}
.feedback{margin-top:10px;font-size:1.1rem;font-weight:600;min-height:1.5em}
.end-screen h1{font-size:1.6rem;margin-bottom:10px}
.end-screen .final-score{font-size:2.5rem;color:#1b5e20;font-weight:700;margin:10px 0}
.end-screen .stars{font-size:2rem;margin:10px 0}
.hidden{display:none!important}
</style>
<link rel="stylesheet" href="fonts/emoji-font.css">
</head>
<body>
<div class="container" id="app"></div>
<script>
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
const params=new URLSearchParams(window.location.search);
const dataFile=params.get('data');
const app=document.getElementById('app');
let gameData,score,roundNum,totalRounds,answered;

if(!dataFile){
app.innerHTML='<h1>Μέτρησε!</h1><p style="color:#2e7d32">Δεν βρέθηκε αρχείο δεδομένων.</p>';
}else{
fetch(dataFile).then(r=>r.json()).then(d=>{gameData=d;showStart()}).catch(()=>{app.innerHTML='<h1>Σφάλμα</h1><p style="color:#f44336">Δεν ήταν δυνατή η φόρτωση των δεδομένων.</p>'});
}

function showStart(){
score=0;roundNum=0;totalRounds=gameData.rounds.length;answered=false;
app.innerHTML='<div><h1>'+esc(gameData.title)+'</h1><h2>'+esc(gameData.subtitle)+'</h2><p style="color:#2e7d32;margin:10px 0">'+esc(gameData.instructions)+'</p><div style="font-size:3rem;margin:20px 0">🔢</div><button class="start-btn" id="startBtn">Ξεκίνα!</button></div>';
document.getElementById('startBtn').onclick=showGame;
}

function showGame(){
roundNum++;
if(roundNum>totalRounds){showEnd();return}
answered=false;
const round=gameData.rounds[roundNum-1];
app.innerHTML='<div><h1>'+esc(gameData.title)+'</h1><div class="score-bar"><span>Γύρος: '+roundNum+' / '+totalRounds+'</span><span>Σκορ: '+score+'</span></div><p style="color:#2e7d32;font-weight:600;margin-bottom:5px">'+esc(gameData.subtitle)+'</p><div class="game-area" id="gameArea"></div><div class="options-area" id="optionsArea"></div><div class="feedback" id="feedback"></div></div>';
scatterEmojis(round.emoji,round.count);
renderOptions(round.options,round.count);
}

function scatterEmojis(emoji,count){
const area=document.getElementById('gameArea');
const w=area.offsetWidth||640;
const h=area.offsetHeight||280;
const placed=[];
for(let i=0;i<count;i++){
const el=document.createElement('span');
el.className='emoji';
el.textContent=emoji;
let x,y,tries=0;
do{
x=Math.random()*(w-50)+5;
y=Math.random()*(h-50)+5;
tries++;
}while(tries<30&&placed.some(function(p){return Math.abs(p.x-x)<35&&Math.abs(p.y-y)<35}));
placed.push({x,y});
el.style.left=x+'px';
el.style.top=y+'px';
area.appendChild(el);
}
}

function renderOptions(options,correct){
const area=document.getElementById('optionsArea');
area.innerHTML='';
const shuffled=options.slice().sort(function(){return Math.random()-0.5});
shuffled.forEach(function(opt){
const btn=document.createElement('button');
btn.textContent=opt;
btn.onclick=function(){handleAnswer(opt,correct,btn,area)};
area.appendChild(btn);
});
}

function handleAnswer(chosen,correct,btn,area){
if(answered)return;
answered=true;
const btns=area.querySelectorAll('button');
btns.forEach(function(b){b.disabled=true});
if(chosen===correct){
btn.classList.add('correct');
score++;
document.getElementById('feedback').innerHTML='<span style="color:#4CAF50">&#10004; Σωστό! '+correct+' αντικείμενα!</span>';
}else{
btn.classList.add('wrong');
btns.forEach(function(b){if(parseInt(b.textContent)===correct)b.classList.add('correct')});
document.getElementById('feedback').innerHTML='<span style="color:#f44336">&#10008; Ήταν '+correct+'!</span>';
}
setTimeout(showGame,1500);
}

function showEnd(){
const pct=Math.round(score/totalRounds*100);
let stars='';
if(pct>=90)stars='⭐⭐⭐';else if(pct>=60)stars='⭐⭐';else if(pct>=30)stars='⭐';
app.innerHTML='<div class="end-screen"><h1>'+esc(gameData.title)+'</h1><div class="stars">'+stars+'</div><div class="final-score">'+score+' / '+totalRounds+'</div><p style="color:#2e7d32;font-size:1.1rem;margin-bottom:15px">'+(pct>=80?'Εξαιρετικά!':pct>=50?'Μπράβο!':'Συνέχισε!')+'</p><button class="restart-btn" id="restartBtn">Ξαναπαιξε!</button></div>';
document.getElementById('restartBtn').onclick=showStart;
}
</script>
</body>
</html>
