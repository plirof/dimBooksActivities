<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Τροχός Γνώσεων</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;padding:10px}
.container{max-width:700px;width:100%;background:#fff;border-radius:20px;padding:30px;box-shadow:0 10px 40px rgba(0,0,0,.25);text-align:center}
h1{color:#4a148c;font-size:1.8rem;margin-bottom:5px}
h2{color:#7b1fa2;font-size:1.1rem;margin-bottom:20px;font-weight:400}
.start-btn,.restart-btn{background:linear-gradient(135deg,#7b1fa2,#4a148c);color:#fff;border:none;padding:14px 40px;border-radius:50px;font-size:1.2rem;cursor:pointer;transition:transform .2s;margin-top:15px}
.start-btn:hover,.restart-btn:hover{transform:scale(1.05)}
.wheel-wrap{position:relative;display:inline-block;margin:15px auto}
canvas{display:block}
.pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:30px solid #f44336;z-index:2;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.spin-btn{background:linear-gradient(135deg,#ff6f00,#ff8f00);color:#fff;border:none;padding:12px 35px;border-radius:50px;font-size:1.1rem;cursor:pointer;margin-top:15px;transition:transform .2s}
.spin-btn:hover{transform:scale(1.05)}
.spin-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.question-area{margin-top:20px;padding:15px;background:#f3e5f5;border-radius:15px;display:none}
.question-area p{font-size:1.1rem;color:#4a148c;margin-bottom:12px;font-weight:600}
.options button{display:inline-block;margin:5px;padding:10px 20px;border:2px solid #7b1fa2;border-radius:25px;background:#fff;color:#4a148c;font-size:1rem;cursor:pointer;transition:all .2s}
.options button:hover{background:#7b1fa2;color:#fff}
.options button.correct{background:#4CAF50;color:#fff;border-color:#4CAF50}
.options button.wrong{background:#f44336;color:#fff;border-color:#f44336}
.score-bar{display:flex;justify-content:space-between;margin-bottom:10px;font-size:.95rem;color:#7b1fa2;font-weight:600}
.end-screen h1{font-size:1.6rem;margin-bottom:10px}
.end-screen .final-score{font-size:2.5rem;color:#4a148c;font-weight:700;margin:10px 0}
.end-screen .stars{font-size:2rem;margin:10px 0}
.feedback{margin-top:10px;font-size:1.1rem;font-weight:600;min-height:1.5em}
.hidden{display:none!important}
</style>
<link rel="stylesheet" href="fonts/emoji-font.css">
</head>
<body>
<div class="container" id="app"></div>
<script>
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
const params=new URLSearchParams(window.location.search);
const dataFile=params.get('data');
const app=document.getElementById('app');
let gameData,score,roundNum,totalRounds,segments,isSpinning,currentAngle;

if(!dataFile){
app.innerHTML='<h1>Τροχός Γνώσεων</h1><p style="color:#7b1fa2">Δεν βρέθηκε αρχείο δεδομένων.</p>';
}else{
fetch(dataFile).then(r=>r.json()).then(d=>{gameData=d;showStart()}).catch(()=>{app.innerHTML='<h1>Σφάλμα</h1><p style="color:#f44336">Δεν ήταν δυνατή η φόρτωση των δεδομένων.</p>'});
}

function showStart(){
score=0;roundNum=0;totalRounds=gameData.rounds||gameData.segments.length;
segments=gameData.segments;isSpinning=false;currentAngle=0;
app.innerHTML='<div><h1>'+esc(gameData.title)+'</h1><h2>'+esc(gameData.subtitle)+'</h2><div style="font-size:3rem;margin:20px 0">🎡</div><button class="start-btn" id="startBtn">Ξεκίνα!</button></div>';
document.getElementById('startBtn').onclick=showGame;
}

function showGame(){
roundNum++;
if(roundNum>totalRounds){showEnd();return}
app.innerHTML='<div><h1>'+esc(gameData.title)+'</h1><div class="score-bar"><span>Γύρος: '+roundNum+' / '+totalRounds+'</span><span>Σκορ: '+score+'</span></div><div class="wheel-wrap"><div class="pointer"></div><canvas id="wheelCanvas" width="280" height="280"></canvas></div><div><button class="spin-btn" id="spinBtn">Γύρισε!</button></div><div class="question-area" id="questionArea"><p id="questionText"></p><div class="options" id="optionsDiv"></div><div class="feedback" id="feedback"></div></div></div>';
drawWheel();
document.getElementById('spinBtn').onclick=spinWheel;
}

function drawWheel(){
const canvas=document.getElementById('wheelCanvas');
if(!canvas)return;
const ctx=canvas.getContext('2d');
const cx=140,cy=140,r=130;
const n=segments.length;
const arc=2*Math.PI/n;
ctx.clearRect(0,0,280,280);
for(let i=0;i<n;i++){
const startAngle=currentAngle+i*arc;
ctx.beginPath();
ctx.moveTo(cx,cy);
ctx.arc(cx,cy,r,startAngle,startAngle+arc);
ctx.closePath();
ctx.fillStyle=segments[i].color;
ctx.fill();
ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
ctx.save();
ctx.translate(cx,cy);
ctx.rotate(startAngle+arc/2);
ctx.fillStyle='#fff';
ctx.font='bold 13px Segoe UI';
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.fillText(segments[i].label,r*0.6,0);
ctx.restore();
}
ctx.beginPath();ctx.arc(cx,cy,18,0,2*Math.PI);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#ddd';ctx.lineWidth=1;ctx.stroke();
}

function spinWheel(){
if(isSpinning)return;
isSpinning=true;
const spinBtn=document.getElementById('spinBtn');
spinBtn.disabled=true;
const segIndex=Math.floor(Math.random()*segments.length);
const n=segments.length;
const arc=2*Math.PI/n;
const targetAngle=2*Math.PI*(5+Math.random()*3)-(segIndex*arc+arc/2);
const startAngle=currentAngle;
const totalSpin=targetAngle-startAngle;
const duration=4000;
const startTime=performance.now();
function animate(now){
const elapsed=now-startTime;
const t=Math.min(elapsed/duration,1);
const ease=1-Math.pow(1-t,3);
currentAngle=startAngle+totalSpin*ease;
drawWheel();
if(t<1){requestAnimationFrame(animate)}
else{currentAngle=currentAngle%(2*Math.PI);drawWheel();isSpinning=false;showQuestion(segIndex)}
}
requestAnimationFrame(animate);
}

function showQuestion(segIdx){
const seg=segments[segIdx];
const q=seg.questions[Math.floor(Math.random()*seg.questions.length)];
const qa=document.getElementById('questionArea');
qa.style.display='block';
document.getElementById('questionText').textContent=q.q;
const od=document.getElementById('optionsDiv');
od.innerHTML='';
q.options.forEach(function(opt,i){
const btn=document.createElement('button');
btn.textContent=opt;
btn.onclick=function(){handleAnswer(i,q.correct,btn,od)};
od.appendChild(btn);
});
document.getElementById('feedback').textContent='';
}

function handleAnswer(chosen,correct,btn,od){
const btns=od.querySelectorAll('button');
btns.forEach(function(b){b.onclick=null;b.style.pointerEvents='none'});
if(chosen===correct){
btn.classList.add('correct');
score++;
document.getElementById('feedback').innerHTML='<span style="color:#4CAF50">&#10004; Σωστό!</span>';
}else{
btn.classList.add('wrong');
btns[correct].classList.add('correct');
document.getElementById('feedback').innerHTML='<span style="color:#f44336">&#10008; Λάθος!</span>';
}
setTimeout(showGame,1500);
}

function showEnd(){
const pct=Math.round(score/totalRounds*100);
let stars='';
if(pct>=90)stars='⭐⭐⭐';else if(pct>=60)stars='⭐⭐';else if(pct>=30)stars='⭐';
app.innerHTML='<div class="end-screen"><h1>'+esc(gameData.title)+'</h1><div class="stars">'+stars+'</div><div class="final-score">'+score+' / '+totalRounds+'</div><p style="color:#7b1fa2;font-size:1.1rem;margin-bottom:15px">'+(pct>=80?'Εξαιρετικά!':pct>=50?'Μπράβο!':'Συνέχισε!')+'</p><button class="restart-btn" id="restartBtn">Ξαναπαιξε!</button></div>';
document.getElementById('restartBtn').onclick=showStart;
}
</script>
</body>
</html>
