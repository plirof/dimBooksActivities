<!DOCTYPE html>
<html lang="el">
<head>
<!--
Versions/Changes:
v002a 260516 - Made collectin stars more visible

-->	
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcade Παιχνίδι</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#0d47a1 0%,#1565c0 50%,#26c6da 100%);min-height:100vh;padding:15px;display:flex;align-items:flex-start;justify-content:center}
.container{background:#fff;border-radius:20px;padding:20px;max-width:680px;width:100%;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative}
h1{color:#0d47a1;text-align:center;font-size:1.3em;margin-bottom:2px}
.subtitle{text-align:center;color:#666;font-size:.9em;margin-bottom:10px}
.game-header{display:flex;justify-content:space-between;align-items:center;padding:8px 15px;background:#e3f2fd;border-radius:10px;margin-bottom:10px;flex-wrap:wrap;gap:5px}
.stat{font-size:.9em;color:#555}.stat span{font-weight:700;font-size:1.1em}
.stat .score-val{color:#ff9800}
.stat .lives-val{color:#e53935}
.stat .level-val{color:#0d47a1}
.canvas-wrap{display:flex;justify-content:center;margin-bottom:10px}
canvas{border-radius:12px;border:2px solid #90caf9;display:block;max-width:100%;background:#e3f2fd}
.controls-row{display:flex;justify-content:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.ctrl-btn{width:52px;height:52px;border-radius:14px;border:2px solid #90caf9;background:#e3f2fd;font-size:1.4em;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:background .15s}
.ctrl-btn:active,.ctrl-btn:hover{background:#bbdefb}
.slider-area{background:#f5f5f5;border-radius:10px;padding:10px 15px;margin-bottom:10px}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.slider-row:last-child{margin-bottom:0}
.slider-row label{font-size:.85em;color:#555;min-width:110px}
.slider-row input[type=range]{flex:1;accent-color:#0d47a1}
.slider-row .slider-val{font-weight:700;color:#0d47a1;min-width:28px;text-align:right}
.condition-box{background:#263238;color:#80cbc4;border-radius:10px;padding:14px 18px;margin-bottom:10px;font-family:'Courier New',Courier,monospace;font-size:.95em;line-height:1.7;white-space:pre-wrap}
.condition-box .kw{color:#ff9800;font-weight:700}
.condition-box .var{color:#80cbc4}
.condition-box .op{color:#ef5350}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:20px;padding:30px 25px;max-width:420px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal h2{font-size:1.4em;color:#0d47a1;margin-bottom:8px}
.modal .emoji-big{font-size:3em;margin:10px 0}
.modal .final-score{font-size:2.6em;color:#ff9800;font-weight:700;margin:8px 0}
.modal .message{color:#666;margin:8px 0 18px;font-size:1em;line-height:1.5}
.modal .level-msg{color:#0d47a1;font-weight:600;margin:8px 0}
.btn{padding:12px 40px;background:linear-gradient(135deg,#0d47a1,#1565c0);color:#fff;border:none;border-radius:12px;font-size:1.05em;cursor:pointer;font-weight:600;transition:transform .1s}
.btn:hover{transform:scale(1.05)}
.btn-win{background:linear-gradient(135deg,#2e7d32,#66bb6a)}
.btn-lose{background:linear-gradient(135deg,#c62828,#ef5350)}
.error{color:#f44336;text-align:center;padding:40px;font-size:1.2em}
@media(max-width:500px){
  .container{padding:12px;border-radius:14px}
  h1{font-size:1.1em}
  .ctrl-btn{width:44px;height:44px;font-size:1.2em}
  .game-header{padding:6px 10px}
}
</style>
<link rel="stylesheet" href="fonts/emoji-font.css">
</head>
<body>
<div class="container" id="app"><div class="error">Φόρτωση...</div></div>

<div class="modal-overlay" id="startModal">
<div class="modal" id="startModalContent"></div>
</div>

<div class="modal-overlay" id="endModal">
<div class="modal" id="endModalContent"></div>
</div>

<script>
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

const params=new URLSearchParams(window.location.search);
const dataFile=params.get('data');
const app=document.getElementById('app');

if(!dataFile){app.innerHTML='<div class="error">Δεν βρέθηκε το αρχείο δεδομένων.</div>';throw new Error('No data')}

fetch(dataFile).then(r=>{if(!r.ok)throw new Error('Δεν βρέθηκε: '+dataFile);return r.json()}).then(cfg=>{

const DEF={title:'Arcade',subtitle:'',winScore:10,maxLives:3,initialStars:4,initialPuffers:1,maxPuffers:2,pufferSpeed:1.5,canvasW:600,canvasH:400,hasSliders:false,sliderMin:3,sliderMax:20,hasLevels:false,levelThemes:[['#0d47a1','#1565c0','#26c6da']],hasConditionBox:false,conditionText:''};
Object.keys(DEF).forEach(k=>{if(cfg[k]===undefined)cfg[k]=DEF[k]});

let winScore=cfg.winScore;
let maxLives=cfg.maxLives;
let score=0, lives=maxLives, gameRunning=false;
let diver, stars, puffers, animId=null;
let keysDown={};
let level=0;
let canvas, ctx;
let touchInterval={};

function buildUI(){
  let html=`<h1>${esc(cfg.title)}</h1>`;
  html+=`<div class="subtitle">${esc(cfg.subtitle)}</div>`;

  if(cfg.hasSliders){
    html+=`<div class="slider-area" id="sliderArea">`;
    html+=`<div class="slider-row"><label>Πόντοι νίκης:</label><input type="range" id="sliderScore" min="${cfg.sliderMin}" max="${cfg.sliderMax}" value="${winScore}"><span class="slider-val" id="sliderScoreVal">${winScore}</span></div>`;
    html+=`<div class="slider-row"><label>Ζωές:</label><input type="range" id="sliderLives" min="1" max="8" value="${maxLives}"><span class="slider-val" id="sliderLivesVal">${maxLives}</span></div>`;
    html+=`</div>`;
  }

  if(cfg.hasConditionBox){
    let cond=cfg.conditionText||'Επανάλαβε μέχρι πόντοι = WIN Ή ζωές = 0';
    cond=cond.replace(/(Επανάλαβε|μέχρι|Ή|ΚΑΙ)/g,'<span class="kw">$1</span>');
    cond=cond.replace(/(πόντοι|ζωές)/g,'<span class="var">$1</span>');
    cond=cond.replace(/(=|&gt;=|&lt;=|≠|&gt;|&lt;)/g,'<span class="op">$1</span>');
    html+=`<div class="condition-box">${cond}</div>`;
  }

  html+=`<div class="game-header" id="hud">`;
  html+=`<div class="stat">Πόντοι: <span class="score-val" id="hudScore">${score}</span>/${winScore}</div>`;
  html+=`<div class="stat">Ζωές: <span class="lives-val" id="hudLives">${'❤️'.repeat(lives)}</span></div>`;
  if(cfg.hasLevels) html+=`<div class="stat">Επίπεδο: <span class="level-val" id="hudLevel">${level+1}/3</span></div>`;
  html+=`</div>`;

  html+=`<div class="canvas-wrap"><canvas id="gameCanvas" width="${cfg.canvasW}" height="${cfg.canvasH}"></canvas></div>`;

  html+=`<div class="controls-row" id="touchControls">`;
  html+=`<button class="ctrl-btn" data-dir="left">◀</button>`;
  html+=`<button class="ctrl-btn" data-dir="up">▲</button>`;
  html+=`<button class="ctrl-btn" data-dir="down">▼</button>`;
  html+=`<button class="ctrl-btn" data-dir="right">▶</button>`;
  html+=`</div>`;

  app.innerHTML=html;
  canvas=document.getElementById('gameCanvas');
  ctx=canvas.getContext('2d');

  if(cfg.hasSliders){
    const ss=document.getElementById('sliderScore');
    const sl=document.getElementById('sliderLives');
    ss.addEventListener('input',()=>{
      winScore=parseInt(ss.value);
      document.getElementById('sliderScoreVal').textContent=winScore;
      document.getElementById('hudScore').innerHTML=`${score}/${winScore}`;
    });
    sl.addEventListener('input',()=>{
      maxLives=parseInt(sl.value);
      document.getElementById('sliderLivesVal').textContent=maxLives;
    });
  }
}

function getLevelBg(){
  if(!cfg.hasLevels)return['#e3f2fd','#bbdefb','#90caf9'];
  const themes=cfg.levelThemes||DEF.levelThemes;
  return themes[level%themes.length];
}

function drawBackground(){
  const cols=getLevelBg();
  const g=ctx.createLinearGradient(0,0,0,canvas.height);
  g.addColorStop(0,cols[0]);
  g.addColorStop(0.5,cols[1]);
  g.addColorStop(1,cols[2]);
  ctx.fillStyle=g;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for(let i=0;i<8;i++){
    let bx=((Date.now()/20+i*97)%canvas.width);
    let by=canvas.height-20-i*6;
    ctx.fillStyle='rgba(255,255,255,0.12)';
    ctx.beginPath();
    ctx.ellipse(bx,by,30+Math.sin(Date.now()/1000+i)*10,8,0,0,Math.PI*2);
    ctx.fill();
  }
}

function drawDiver(){
  const d=diver;
  ctx.save();
  ctx.translate(d.x,d.y);

  ctx.fillStyle='#ffcc80';
  ctx.beginPath();
  ctx.ellipse(0,8,12,18,0,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#e65100';
  ctx.lineWidth=1.5;
  ctx.stroke();

  ctx.fillStyle='#ffe0b2';
  ctx.beginPath();
  ctx.arc(0,-16,10,0,Math.PI*2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle='#0d47a1';
  ctx.beginPath();
  ctx.arc(4,-17,3,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.arc(5,-18,1,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle='#4fc3f7';
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(-14,5);
  ctx.lineTo(-26,-2+Math.sin(Date.now()/200)*3);
  ctx.lineTo(-20,10);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(14,5);
  ctx.lineTo(26,-2+Math.sin(Date.now()/200)*3);
  ctx.lineTo(20,10);
  ctx.stroke();

  ctx.strokeStyle='#42a5f5';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(-4,26);
  ctx.lineTo(-6,34+Math.sin(Date.now()/300)*3);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(4,26);
  ctx.lineTo(6,34+Math.sin(Date.now()/300)*3);
  ctx.stroke();

  ctx.restore();
}

function starPath(cx,cy,outerR,innerR,points){
  ctx.beginPath();
  for(let i=0;i<points*2;i++){
    const r=i%2===0?outerR:innerR;
    const a=Math.PI/2*-1+Math.PI/points*i;
    const x=cx+Math.cos(a)*r;
    const y=cy+Math.sin(a)*r;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.closePath();
}

function drawStar(s){
  ctx.save();
  ctx.translate(s.x,s.y);
  const pulse=1+0.12*Math.sin(Date.now()/300+s.seed);
  ctx.scale(pulse,pulse);
  ctx.shadowColor='rgba(255,255,255,0.9)';
  ctx.shadowBlur=14;
  starPath(0,0,16,7,5);
  ctx.fillStyle='#FFD700';
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='#E65100';
  ctx.lineWidth=2;
  starPath(0,0,16,7,5);
  ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.ellipse(-3,-5,5,3,-0.3,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawPuffer(p){
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.font='26px serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.scale(p.dir>0?1:-1,1);
  ctx.fillText('🐡',0,0);
  ctx.restore();
}

function initEntities(){
  const cw=canvas.width, ch=canvas.height;
  diver={x:cw/2,y:ch/2,speed:3.5};

  stars=[];
  for(let i=0;i<cfg.initialStars;i++) spawnStar();

  puffers=[];
  const numP=cfg.hasLevels? cfg.initialPuffers+level : cfg.initialPuffers;
  for(let i=0;i<numP;i++) spawnPuffer();
}

function spawnStar(){
  const margin=30;
  let sx, sy, tries=0;
  do{
    sx=margin+Math.random()*(canvas.width-margin*2);
    sy=margin+Math.random()*(canvas.height-margin*2);
    tries++;
  }while(tries<20 && diver && dist(sx,sy,diver.x,diver.y)<50);
  stars.push({x:sx,y:sy,seed:Math.random()*100});
}

function spawnPuffer(){
  const fromLeft=Math.random()>0.5;
  const py=30+Math.random()*(canvas.height-60);
  const spd=(cfg.hasLevels? cfg.pufferSpeed+level*0.5 : cfg.pufferSpeed)*(0.8+Math.random()*0.4);
  puffers.push({x:fromLeft?-20:canvas.width+20,y:py,speed:spd,dir:fromLeft?1:-1,vy:(Math.random()-0.5)*0.6});
}

function dist(x1,y1,x2,y2){const dx=x1-x2,dy=y1-y2;return Math.sqrt(dx*dx+dy*dy)}

function update(){
  if(!gameRunning)return;
  const spd=diver.speed;
  if(keysDown['ArrowLeft']||keysDown['left']) diver.x-=spd;
  if(keysDown['ArrowRight']||keysDown['right']) diver.x+=spd;
  if(keysDown['ArrowUp']||keysDown['up']) diver.y-=spd;
  if(keysDown['ArrowDown']||keysDown['down']) diver.y+=spd;

  diver.x=Math.max(16,Math.min(canvas.width-16,diver.x));
  diver.y=Math.max(22,Math.min(canvas.height-36,diver.y));

  for(let i=stars.length-1;i>=0;i--){
    if(dist(diver.x,diver.y,stars[i].x,stars[i].y)<26){
      stars.splice(i,1);
      score++;
      updateHUD();
      if(score>=winScore){endGame(true);return}
      spawnStar();
    }
  }

  for(let i=puffers.length-1;i>=0;i--){
    const p=puffers[i];
    p.x+=p.speed*p.dir;
    p.y+=p.vy;
    if(p.y<15||p.y>canvas.height-15) p.vy*=-1;
    p.y=Math.max(15,Math.min(canvas.height-15,p.y));
    if((p.dir>0&&p.x>canvas.width+30)||(p.dir<0&&p.x<-30)){
      puffers.splice(i,1);
      spawnPuffer();
      continue;
    }
    if(dist(diver.x,diver.y,p.x,p.y)<24){
      lives--;
      updateHUD();
      if(lives<=0){endGame(false);return}
      puffers.splice(i,1);
      spawnPuffer();
      diver.x=canvas.width/2;
      diver.y=canvas.height/2;
    }
  }
}

function draw(){
  drawBackground();
  stars.forEach(s=>drawStar(s));
  puffers.forEach(p=>drawPuffer(p));
  drawDiver();
}

function gameLoop(){
  if(!gameRunning)return;
  update();
  draw();
  animId=requestAnimationFrame(gameLoop);
}

function updateHUD(){
  const hs=document.getElementById('hudScore');
  const hl=document.getElementById('hudLives');
  if(hs) hs.textContent=`${score}/${winScore}`;
  if(hl) hl.innerHTML=lives>0?'❤️'.repeat(lives):'💔';
}

function showStartModal(){
  const m=document.getElementById('startModal');
  const c=document.getElementById('startModalContent');
  c.innerHTML=`
    <h2>${esc(cfg.title)}</h2>
    <div class="emoji-big">🤿⭐🐡</div>
    <div class="message">${esc(cfg.subtitle)}<br>Μάζεψε ${winScore} ⭐ αστερίες!<br>Απόφυγε τα 🐡!</div>
    <button class="btn" onclick="window._startGame()">▶ Ξεκίνα!</button>
  `;
  m.classList.add('active');
}

function hideStartModal(){
  document.getElementById('startModal').classList.remove('active');
}

function showEndModal(won){
  const m=document.getElementById('endModal');
  const c=document.getElementById('endModalContent');
  const emoji=won?'🎉':'😢';
  const title=won?'Νίκη! Μπράβο!':'Ήττα! Δοκίμασε ξανά!';
  let extra='';
  if(cfg.hasLevels){
    extra=`<div class="level-msg">Έφτασες επίπεδο ${level+1}/3</div>`;
  }
  c.innerHTML=`
    <h2>${title}</h2>
    <div class="emoji-big">${emoji}</div>
    <div class="final-score">${score}</div>
    <div class="message">Πόντοι: ${score}/${winScore} — Ζωές: ${Math.max(0,lives)}${extra?'<br>':''}${extra}</div>
    <button class="btn ${won?'btn-win':'btn-lose'}" onclick="window._restartGame()">🔄 Παίξε ξανά!</button>
  `;
  m.classList.add('active');
}

function hideEndModal(){
  document.getElementById('endModal').classList.remove('active');
}

function checkLevelAdvance(){
  if(!cfg.hasLevels||level>=2)return false;
  if(score>=winScore*((level+1)/3)){
    level++;
    const maxP=cfg.hasLevels? Math.min(cfg.maxPuffers,cfg.initialPuffers+level) : cfg.maxPuffers;
    while(puffers.length<maxP) spawnPuffer();
    updateHUD();
    return true;
  }
  return false;
}

window._startGame=function(){
  if(cfg.hasSliders){
    winScore=parseInt(document.getElementById('sliderScore').value)||cfg.winScore;
    maxLives=parseInt(document.getElementById('sliderLives').value)||cfg.maxLives;
  }
  score=0;lives=maxLives;level=0;gameRunning=true;
  hideStartModal();
  buildUI();
  initEntities();
  setupTouchControls();
  gameLoop();
};

window._restartGame=function(){
  gameRunning=false;
  if(animId)cancelAnimationFrame(animId);
  hideEndModal();
  showStartModal();
};

function endGame(won){
  gameRunning=false;
  if(animId)cancelAnimationFrame(animId);
  showEndModal(won);
}

function setupTouchControls(){
  const btns=document.querySelectorAll('.ctrl-btn');
  btns.forEach(btn=>{
    const dir=btn.dataset.dir;

    function startDir(e){
      e.preventDefault();
      keysDown[dir]=true;
    }
    function stopDir(e){
      e.preventDefault();
      keysDown[dir]=false;
    }

    btn.addEventListener('mousedown',startDir);
    btn.addEventListener('mouseup',stopDir);
    btn.addEventListener('mouseleave',stopDir);
    btn.addEventListener('touchstart',startDir,{passive:false});
    btn.addEventListener('touchend',stopDir,{passive:false});
    btn.addEventListener('touchcancel',stopDir,{passive:false});
  });
}

document.addEventListener('keydown',e=>{
  keysDown[e.key]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup',e=>{keysDown[e.key]=false});

const origUpdate=update;
const _update=update;

buildUI();
showStartModal();

}).catch(err=>{app.innerHTML='<div class="error">Σφάλμα: '+esc(err.message)+'</div>'});
</script>
</body>
</html>
