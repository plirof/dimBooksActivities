<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Μπάσκετ Κουίζ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{width:100%;height:100%;position:relative;background:#333}

.scene{width:100%;height:100%;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#1a1a2e 0%,#16213e 40%,#c8956c 42%,#b8844e 100%)}
.court{position:absolute;bottom:0;width:100%;height:58%;
  background:linear-gradient(90deg,#c8956c 0px,#d4a574 20px,#c8956c 40px,#d4a574 60px,#c8956c 80px,#d4a574 100px);
  background-size:120px 100%}
.court-lines{position:absolute;bottom:0;width:100%;height:58%;z-index:1;pointer-events:none}
.three-point-line{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:70%;height:50%;border:2px solid rgba(255,255,255,0.2);
  border-bottom:none;border-radius:50% 50% 0 0}
.free-throw{position:absolute;bottom:25%;left:50%;transform:translateX(-50%);
  width:40%;height:30%;border:2px solid rgba(255,255,255,0.15);
  border-radius:50%}
.center-circle{position:absolute;bottom:52%;left:50%;transform:translateX(-50%);
  width:16%;padding-bottom:8%;border:2px solid rgba(255,255,255,0.15);border-radius:50%}

.scoreboard{position:absolute;top:0;left:0;right:0;
  background:rgba(0,0,0,0.7);color:#fff;padding:8px 14px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:13px;z-index:15}
.scoreboard .goals{color:#FFD700;font-weight:700;font-size:17px}

.hoop-wrap{position:absolute;top:4%;left:50%;transform:translateX(-50%);width:92%;max-width:560px}
.hoop-inner{position:relative;width:100%;padding-bottom:38%;height:0}

.backboard{position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:50%;height:95%;
  background:linear-gradient(180deg,rgba(255,255,255,0.15),rgba(255,255,255,0.08));
  border:3px solid rgba(255,255,255,0.5);border-radius:4px;
  box-shadow:0 0 12px rgba(0,0,0,0.3)}
.backboard-square{position:absolute;top:25%;left:50%;transform:translateX(-50%);
  width:50%;height:40%;border:2px solid rgba(255,255,255,0.3)}

.rim{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:14%;height:12px;
  border:4px solid #ff6600;border-top:none;border-radius:0 0 50% 50%;
  z-index:5;box-shadow:0 2px 6px rgba(0,0,0,0.3)}
.rim.celebrate{box-shadow:0 0 15px rgba(255,215,0,0.6),0 0 30px rgba(255,215,0,0.3);transition:box-shadow .3s}

.basket-net{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);
  width:12%;height:24px;
  background:
    repeating-linear-gradient(90deg,transparent,transparent 9px,rgba(255,255,255,0.22) 9px,rgba(255,255,255,0.22) 10px),
    repeating-linear-gradient(0deg,transparent,transparent 7px,rgba(255,255,255,0.22) 7px,rgba(255,255,255,0.22) 8px);
  clip-path:polygon(5% 0%,95% 0%,80% 100%,20% 100%);
  pointer-events:none;z-index:4}
.basket-net.ripple{animation:netPulse .4s ease-out}
@keyframes netPulse{0%{transform:translateX(-50%) scaleY(1)}30%{transform:translateX(-50%) scaleY(1.3)}100%{transform:translateX(-50%) scaleY(1)}}

.defender{position:absolute;bottom:-220px;left:50%;width:78px;height:114px;z-index:6;
  transform:translateX(-50%);transition:left .4s ease-out,top .4s ease-out}
.defender-body{width:100%;height:100%;transition:transform .4s ease-out;transform-origin:bottom center}
.defender-head{width:33px;height:33px;background:linear-gradient(180deg,#e8c282,#deb887);border-radius:50%;margin:0 auto;border:1px solid #c9a06c}
.defender-jersey{width:63px;height:36px;background:linear-gradient(180deg,#1565c0,#0d47a1);border-radius:4px;margin:1px auto 0;position:relative}
.defender-arm{position:absolute;width:15px;height:33px;background:linear-gradient(180deg,#deb887,#c9a06c);top:2px;border-radius:3px;transition:transform .3s ease-out;transform-origin:top center}
.defender-arm.l{left:-14px;transform:rotate(-15deg)}.defender-arm.r{right:-14px;transform:rotate(15deg)}
.defender-body.block .defender-arm.l{transform:rotate(-120deg)}
.defender-body.block .defender-arm.r{transform:rotate(120deg)}
.defender-shorts{width:42px;height:11px;background:#fff;margin:0 auto}
.defender-legs{display:flex;justify-content:center;gap:4px;margin-top:1px}
.defender-leg{width:15px;height:17px;background:#deb887;border-radius:2px 2px 0 0}
.defender-shoe{width:21px;height:8px;background:#fff;border-radius:1px 5px 4px 1px;margin-top:-1px;margin-left:-3px}

.defender-body.dl{transform:translateX(-120px) rotate(-25deg) scaleX(1.2)}
.defender-body.dr{transform:translateX(120px) rotate(25deg) scaleX(1.2)}
.defender-body.dlu{transform:translateX(-112px) translateY(-24px) rotate(-30deg) scaleX(1.2)}
.defender-body.dru{transform:translateX(112px) translateY(-24px) rotate(30deg) scaleX(1.2)}
.defender-body.dld{transform:translateX(-98px) translateY(12px) rotate(-18deg) scaleX(1.1)}
.defender-body.drd{transform:translateX(98px) translateY(12px) rotate(18deg) scaleX(1.1)}

.zone{position:absolute;display:flex;align-items:center;justify-content:center;
  text-align:center;background:rgba(255,140,0,0.12);border:2px dashed rgba(255,200,50,0.5);
  border-radius:6px;color:#fff;font-weight:600;font-size:11px;line-height:1.15;
  cursor:pointer;z-index:4;touch-action:manipulation;
  text-shadow:1px 1px 2px rgba(0,0,0,0.8);padding:3px;overflow-wrap:break-word;
  transition:background .12s}
.zone:active{background:rgba(255,140,0,0.35)}
.zone.off{pointer-events:none;opacity:.3}
.zone.ok{border-color:#4CAF50;background:rgba(76,175,80,0.4);border-style:solid}
.zone.no{border-color:#f44336;background:rgba(244,67,54,0.3);border-style:solid}

.ball{position:absolute;width:36px;height:36px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#ff8c00,#cc6600);
  border:2px solid #993300;box-shadow:2px 2px 4px rgba(0,0,0,0.3);
  z-index:8;left:calc(50% - 18px);top:58%}
.ball-lines{position:absolute;top:50%;left:0;width:100%;height:2px;background:rgba(0,0,0,0.25);transform:translateY(-50%)}
.ball-vline{position:absolute;left:50%;top:0;width:2px;height:100%;background:rgba(0,0,0,0.25);transform:translateX(-50%)}
.ball.fly{transition:left .5s ease-in,top .5s ease-in}
.ball.gone{display:none}
.ball.miss{transition:left .5s ease-in,top .5s ease-in}

.result{position:absolute;top:35%;left:50%;
  transform:translate(-50%,-50%) scale(0);font-size:40px;font-weight:900;
  z-index:20;pointer-events:none;opacity:0;
  text-shadow:2px 2px 8px rgba(0,0,0,0.6);transition:transform .25s ease-out,opacity .25s}
.result.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.result.goal{color:#FFD700}.result.saved{color:#FF5252}

.qarea{position:absolute;top:69%;left:50%;transform:translateX(-50%);
  width:92%;max-width:520px;z-index:12;text-align:center;
  background:rgba(0,0,0,0.6);color:#fff;padding:10px 14px;border-radius:10px}
.qarea .qt{font-size:14px;line-height:1.3;margin-bottom:6px}
.qarea .ctrls{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qarea .fb{font-size:12px;flex:1;display:none;text-align:left}
.qarea .fb.ok{color:#8BC34A;display:block}
.qarea .fb.no{color:#FF5252;display:block}
.nbtn{display:none;padding:7px 18px;background:linear-gradient(135deg,#ff6600,#ff3300);
  color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer;
  touch-action:manipulation;white-space:nowrap}
.nbtn:active{opacity:.85}

.loading,.error-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:#fff;font-size:1.1em;text-align:center;text-shadow:1px 1px 4px rgba(0,0,0,0.5)}

.final{position:absolute;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.88);display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:#fff;z-index:50;text-align:center;padding:20px}
.final h2{font-size:1.5em;margin-bottom:6px}
.final .bs{font-size:3em;font-weight:900;color:#FFD700;margin:6px 0}
.final .fm{font-size:1em;margin-bottom:14px;color:#ccc}
.rbtn{padding:11px 32px;background:linear-gradient(135deg,#ff6600,#ff3300);
  color:#fff;border:none;border-radius:12px;font-size:1.1em;cursor:pointer;touch-action:manipulation}

.spot{position:absolute;width:6px;height:6px;border-radius:50%;
  background:rgba(255,255,255,0.5);left:calc(50% - 3px);top:56%;z-index:2}

@keyframes swish{
  0%{transform:translateX(-50%) scaleY(1)}
  25%{transform:translateX(-50%) scaleY(1.4)}
  50%{transform:translateX(-50%) scaleY(0.8)}
  75%{transform:translateX(-50%) scaleY(1.1)}
  100%{transform:translateX(-50%) scaleY(1)}
}
.basket-net.swish{animation:swish .5s ease-out}

@media(min-width:500px){
  .hoop-wrap{width:72%}.hoop-inner{padding-bottom:34%}
  .zone{font-size:13px}
  .qarea .qt{font-size:16px}
  .ball{width:42px;height:42px;left:calc(50% - 21px)}
  .result{font-size:54px}
  .scoreboard{font-size:15px}.scoreboard .goals{font-size:20px}
  .defender{width:93px;height:135px}
  .defender-head{width:39px;height:39px}.defender-jersey{width:75px;height:45px}
  .defender-arm{width:18px;height:39px}.defender-arm.l{left:-16px}.defender-arm.r{right:-16px}
  .defender-shorts{width:51px;height:12px}
  .defender-leg{width:18px;height:20px}.defender-shoe{width:24px;height:9px;margin-left:-3px}
  .defender-body.dl{transform:translateX(-165px) rotate(-25deg) scaleX(1.2)}
  .defender-body.dr{transform:translateX(165px) rotate(25deg) scaleX(1.2)}
  .defender-body.dlu{transform:translateX(-150px) translateY(-30px) rotate(-30deg) scaleX(1.2)}
  .defender-body.dru{transform:translateX(150px) translateY(-30px) rotate(30deg) scaleX(1.2)}
  .defender-body.dld{transform:translateX(-135px) translateY(15px) rotate(-18deg) scaleX(1.1)}
  .defender-body.drd{transform:translateX(135px) translateY(15px) rotate(18deg) scaleX(1.1)}
}
@media(max-height:480px){
  .hoop-wrap{top:3%}.hoop-inner{padding-bottom:30%}
  .scoreboard{padding:4px 8px;font-size:11px}.scoreboard .goals{font-size:14px}
  .qarea{top:64%;padding:6px 10px}.qarea .qt{font-size:11px}
  .result{font-size:30px}
  .scene{background:linear-gradient(180deg,#1a1a2e 0%,#16213e 35%,#c8956c 37%,#b8844e 100%)}
  .court{height:63%}
  .defender{width:63px;height:90px}.defender-head{width:27px;height:27px}.defender-jersey{width:51px;height:30px}
  .defender-arm{width:12px;height:27px}.defender-arm.l{left:-11px}.defender-arm.r{right:-11px}
  .defender-leg{width:12px;height:14px}.defender-shoe{width:17px;height:6px}
}
</style>
<link rel="stylesheet" href="fonts/emoji-font.css">
</head>
<body>
<div id="app"><div class="loading">Φόρτωση...</div></div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

var params=new URLSearchParams(window.location.search);
var dataFile=params.get('data');
var app=document.getElementById('app');

if(!dataFile){
  app.innerHTML='<div class="error-msg">Δεν βρέθηκε αρχείο δεδομένων.<br>?data=αρχείο.json</div>';
  throw new Error('No data');
}

fetch(dataFile).then(function(r){if(!r.ok)throw new Error('Δεν βρέθηκε: '+dataFile);return r.json()}).then(function(data){

var questions=data.questions.slice();
for(var i=questions.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=questions[i];questions[i]=questions[j];questions[j]=t}

var cur=0,score=0,answered=false;

var Z={
  2:[{t:'8%',l:'3%',w:'45%',h:'80%',d:'dl'},{t:'8%',l:'52%',w:'45%',h:'80%',d:'dr'}],
  3:[{t:'5%',l:'2%',w:'30%',h:'85%',d:'dl'},{t:'5%',l:'35%',w:'30%',h:'85%',d:'dr'},{t:'5%',l:'68%',w:'30%',h:'85%',d:'dr'}],
  4:[{t:'5%',l:'3%',w:'45%',h:'42%',d:'dlu'},{t:'5%',l:'52%',w:'45%',h:'42%',d:'dru'},{t:'53%',l:'3%',w:'45%',h:'42%',d:'dld'},{t:'53%',l:'52%',w:'45%',h:'42%',d:'drd'}],
  5:[{t:'5%',l:'2%',w:'30%',h:'42%',d:'dlu'},{t:'5%',l:'35%',w:'30%',h:'42%',d:'dru'},{t:'5%',l:'68%',w:'30%',h:'42%',d:'dru'},{t:'53%',l:'8%',w:'38%',h:'42%',d:'dld'},{t:'53%',l:'52%',w:'38%',h:'42%',d:'drd'}],
  6:[{t:'5%',l:'2%',w:'30%',h:'42%',d:'dlu'},{t:'5%',l:'35%',w:'30%',h:'42%',d:'dru'},{t:'5%',l:'68%',w:'30%',h:'42%',d:'dru'},{t:'53%',l:'2%',w:'30%',h:'42%',d:'dld'},{t:'53%',l:'35%',w:'30%',h:'42%',d:'drd'},{t:'53%',l:'68%',w:'30%',h:'42%',d:'drd'}]
};

var OPP={dl:'dr',dr:'dl',dlu:'drd',dru:'dld',dld:'dru',drd:'dlu'};

function render(){
  answered=false;
  var q=questions[cur];
  var isTF=q.type==='tf';
  var zHTML='',correctDive='';

  if(isTF){
    var cv=(q.answer!==undefined?q.answer:q.correct).toString();
    var items=[{label:'✓ ΑΛΗΘΕΙΑ',val:'true'},{label:'✗ ΨΕΜΑΤΑ',val:'false'}];
    items.sort(function(){return Math.random()-.5});
    var zp=Z[2];
    for(var i=0;i<2;i++){
      var ok=items[i].val===cv;
      if(ok)correctDive=zp[i].d;
      zHTML+='<div class="zone" data-ok="'+ok+'" data-dive="'+zp[i].d+'" style="top:'+zp[i].t+';left:'+zp[i].l+';width:'+zp[i].w+';height:'+zp[i].h+'" onclick="pick(this)">'+items[i].label+'</div>';
    }
  }else{
    var opts=q.options.map(function(o,idx){return{text:o,i:idx}});
    opts.sort(function(){return Math.random()-.5});
    var n=Math.min(opts.length,6);
    var zp=Z[n]||Z[4];
    var pi=[];for(var k=0;k<zp.length;k++)pi.push(k);
    pi.sort(function(){return Math.random()-.5});
    for(var i=0;i<n;i++){
      var ok=opts[i].i===q.correctIndex;
      if(ok)correctDive=zp[pi[i]].d;
      zHTML+='<div class="zone" data-ok="'+ok+'" data-dive="'+zp[pi[i]].d+'" style="top:'+zp[pi[i]].t+';left:'+zp[pi[i]].l+';width:'+zp[pi[i]].w+';height:'+zp[pi[i]].h+'" onclick="pick(this)">'+esc(opts[i].text)+'</div>';
    }
  }

  app.innerHTML=
    '<div class="scene" id="scene">'+
      '<div class="court"></div>'+
      '<div class="court-lines"><div class="three-point-line"></div><div class="free-throw"></div><div class="center-circle"></div></div>'+
      '<div class="scoreboard"><span>Βολή '+(cur+1)+'/'+questions.length+'</span><span class="goals">ΤΡΙΠΟΝΤΑ: '+score+'</span></div>'+
      '<div class="hoop-wrap"><div class="hoop-inner">'+
        '<div class="backboard" id="bb"><div class="backboard-square"></div></div>'+
        '<div class="rim" id="rim"></div>'+
        '<div class="basket-net" id="bnet"></div>'+
        zHTML+
        '<div class="defender" id="def"><div class="defender-body" id="defb">'+
          '<div class="defender-head"></div>'+
          '<div class="defender-jersey"><div class="defender-arm l"></div><div class="defender-arm r"></div></div>'+
          '<div class="defender-shorts"></div>'+
          '<div class="defender-legs"><div class="defender-leg"><div class="defender-shoe"></div></div><div class="defender-leg"><div class="defender-shoe"></div></div></div>'+
        '</div></div>'+
      '</div></div>'+
      '<div class="spot"></div>'+
      '<div class="ball" id="ball"><div class="ball-lines"></div><div class="ball-vline"></div></div>'+
      '<div class="result" id="res"></div>'+
    '</div>'+
    '<div class="qarea">'+
      '<div class="qt">'+esc(q.text)+'</div>'+
      '<div class="ctrls"><div class="fb" id="fb"></div>'+
      '<button class="nbtn" id="nbtn">'+(cur<questions.length-1?'Επόμενη Βολή →':'Αποτέλεσμα')+'</button></div>'+
    '</div>';

  app.dataset.cd=correctDive;
  document.getElementById('nbtn').onclick=function(){cur++;cur<questions.length?render():showFinal()};
}

window.pick=function(el){
  if(answered)return;
  answered=true;
  var q=questions[cur];
  var isOk=el.dataset.ok==='true';
  var zoneDive=el.dataset.dive;
  var correctDive=app.dataset.cd;

  var ball=document.getElementById('ball');
  var defb=document.getElementById('defb');
  var defWrap=document.getElementById('def');
  var bnet=document.getElementById('bnet');
  var res=document.getElementById('res');
  var fb=document.getElementById('fb');
  var rim=document.getElementById('rim');

  var sceneR=document.getElementById('scene').getBoundingClientRect();
  var zoneR=el.getBoundingClientRect();

  var tx=zoneR.left+zoneR.width/2-sceneR.left-ball.offsetWidth/2;
  var ty=zoneR.top+zoneR.height/2-sceneR.top-ball.offsetHeight/2;

  var zones=document.querySelectorAll('.zone');
  for(var i=0;i<zones.length;i++)zones[i].classList.add('off');

  if(isOk){
    var sceneRect2=document.getElementById('scene').getBoundingClientRect();
    var rimRect=rim.getBoundingClientRect();
    var ballRect=ball.getBoundingClientRect();
    var sx=ballRect.left-sceneRect2.left;
    var sy=ballRect.top-sceneRect2.top;
    var ex=rimRect.left+rimRect.width/2-sceneRect2.left-ball.offsetWidth/2;
    var ey=rimRect.top-sceneRect2.top+rimRect.height/2-ball.offsetHeight/2;
    var cpx=(sx+ex)/2+(Math.random()>.5?20:-20);
    var cpy=Math.min(sy,ey)-sceneRect2.height*0.3;
    var arcDur=700,arcStart=null;
    function arcAnim(ts){
      if(!arcStart)arcStart=ts;
      var prog=Math.min((ts-arcStart)/arcDur,1);
      var t=prog;
      var x=(1-t)*(1-t)*sx+2*(1-t)*t*cpx+t*t*ex;
      var y=(1-t)*(1-t)*sy+2*(1-t)*t*cpy+t*t*ey;
      var rot=prog*720;
      var sc=prog>0.8?1-(prog-0.8)/0.2*0.5:1;
      ball.style.left=x+'px';
      ball.style.top=y+'px';
      ball.style.transform='rotate('+rot+'deg) scale('+sc+')';
      if(prog>0.88)ball.style.zIndex='3';
      if(prog<1){requestAnimationFrame(arcAnim)}
      else{ball.classList.add('gone')}
    }
    requestAnimationFrame(arcAnim);
    setTimeout(function(){defb.classList.add(OPP[correctDive])},80);
    setTimeout(function(){
      res.textContent='3 Πόντοι!';
      res.className='result goal show';
      bnet.classList.add('swish');
      rim.classList.add('celebrate');
      fb.textContent=q.explanation||'Σωστό! Μπράβο!';
      fb.className='fb ok';
      el.classList.remove('off');
      el.classList.add('ok');
      document.getElementById('nbtn').style.display='inline-block';
    },750);
    score++;
  }else{
    var ballRect2=ball.getBoundingClientRect();
    var bx=ballRect2.left-sceneR.left;
    var by=ballRect2.top-sceneR.top;
    var interceptX=bx+(tx-bx)*0.6;
    var interceptY=by+(ty-by)*0.6;
    var defRect2=defWrap.getBoundingClientRect();
    var defCenterX=defRect2.left+defRect2.width/2-sceneR.left;
    var defTopY=defRect2.top-sceneR.top;
    var jumpX=(interceptX+ball.offsetWidth/2)-defCenterX;
    var jumpY=interceptY-defTopY;

    ball.classList.add('fly');
    void ball.offsetWidth;
    ball.style.left=interceptX+'px';
    ball.style.top=interceptY+'px';

    setTimeout(function(){
      defb.classList.add('block');
      defb.style.transform='translateX('+jumpX+'px) translateY('+jumpY+'px)';
    },80);

    setTimeout(function(){
      ball.classList.add('gone');
      defb.style.transform='';
      defb.classList.remove('block');
      var missType=Math.random()>.5;
      res.textContent=missType?'ΜΠΛΟΚ!':'ΑΠΟΤΥΧΙΑ!';
      res.className='result saved show';
      fb.textContent=q.explanation||'Δεν είναι σωστό.';
      fb.className='fb no';
      el.classList.remove('off');
      el.classList.add('no');
      var cz=document.querySelector('.zone[data-ok="true"]');
      if(cz){cz.classList.remove('off');cz.classList.add('ok')}
      document.getElementById('nbtn').style.display='inline-block';
    },600);
  }
};

function showFinal(){
  var pct=Math.round(score/questions.length*100);
  var msg=pct>=90?'Εξαιρετικά! Είσαι παίκτης!':pct>=70?'Μπράβο! Καλή ευστοχία!':pct>=50?'Καλά! Μπορείς καλύτερα!':'Δοκίμασε ξανά!';
  app.innerHTML='<div class="final"><h2>Τέλος Αγώνα!</h2><div class="bs">'+score+' / '+questions.length+'</div><div class="fm">'+msg+'</div><button class="rbtn" onclick="location.reload()">Ξαναδοκίμασε!</button></div>';
}

render();

}).catch(function(err){
  app.innerHTML='<div class="error-msg">Σφάλμα: '+esc(err.message)+'</div>';
});
</script>
</body>
</html>
