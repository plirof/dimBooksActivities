<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Σπάσε τα Μπαλόνια!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(135deg,#43e97b 0%,#38f9d7 50%,#4facfe 100%);font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;display:flex;align-items:center;justify-content:center;padding:10px}
.container{max-width:700px;width:100%;background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.15);padding:20px;text-align:center;position:relative;overflow:hidden}
h1{color:#e91e63;font-size:1.8rem;margin-bottom:5px}
h2{color:#7b1fa2;font-size:1.1rem;margin-bottom:10px;font-weight:400}
.start-btn,.restart-btn{background:linear-gradient(135deg,#e91e63,#ff5722);color:#fff;border:none;padding:14px 40px;border-radius:30px;font-size:1.2rem;cursor:pointer;box-shadow:0 5px 15px rgba(233,30,99,.3);transition:transform .2s,box-shadow .2s}
.start-btn:hover,.restart-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(233,30,99,.4)}
.game-area{position:relative;width:100%;height:400px;background:linear-gradient(180deg,#e3f2fd,#bbdefb);border-radius:15px;overflow:hidden;margin:10px 0}
.balloon{position:absolute;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.8rem;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);padding:5px;text-align:center;transition:opacity .2s;user-select:none;z-index:2;min-width:80px}
.balloon::after{content:'';position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);width:2px;height:20px;background:rgba(0,0,0,.2)}
.balloon.popped{animation:pop .3s forwards;pointer-events:none}
@keyframes pop{0%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.5}100%{transform:scale(0);opacity:0}}
.info-bar{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:.95rem;color:#666}
.timer-bar{height:8px;background:#eee;border-radius:4px;margin:8px 0;overflow:hidden}
.timer-fill{height:100%;background:linear-gradient(90deg,#4caf50,#ff9800,#f44336);border-radius:4px;transition:width .1s linear}
.lives{display:flex;gap:4px;font-size:1.2rem}
.score-big{font-size:2.5rem;color:#e91e63;font-weight:700;margin:10px 0}
.hidden{display:none}
.instruction{background:#fff3e0;padding:10px;border-radius:10px;color:#e65100;font-weight:600;margin:10px 0;font-size:.95rem}
.end-score{font-size:3rem;color:#e91e63;font-weight:700;margin:10px 0}
</style>
<link rel="stylesheet" href="fonts/emoji-font.css">
</head>
<body>
<div class="container">
<div id="error" class="hidden" style="color:#f44336;font-size:1.1rem;padding:30px"></div>
<div id="startScreen">
<h1 id="gameTitle">Σπάσε τα Μπαλόνια!</h1>
<h2 id="gameSubtitle">Μόνο τα σωστά!</h2>
<div class="instruction" id="instrBox"></div>
<button class="start-btn" onclick="startGame()">▶ Έναρξη</button>
</div>
<div id="gameScreen" class="hidden">
<div class="info-bar"><span id="scoreInfo">Σκορ: 0</span><span class="lives" id="livesInfo"></span></div>
<div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:100%"></div></div>
<div class="game-area" id="gameArea"></div>
</div>
<div id="endScreen" class="hidden">
<h1>Τέλος!</h1>
<div class="end-score" id="endScore"></div>
<p id="endMsg" style="font-size:1.1rem;color:#666;margin-bottom:20px"></p>
<button class="restart-btn" onclick="restartGame()">🔄 Ξανά!</button>
</div>
</div>
<script>
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
const params=new URLSearchParams(window.location.search);
const dataFile=params.get('data');
let gameData=null,score=0,lives=0,timeLeft=0,gameRunning=false,spawnTimer=null,tickTimer=null;
if(!dataFile){document.getElementById('error').textContent='Δεν βρέθηκε αρχείο δεδομένων. Χρησιμοποίησε ?data=file.json';document.getElementById('error').classList.remove('hidden');document.getElementById('startScreen').classList.add('hidden')}else{fetch(dataFile).then(r=>{if(!r.ok)throw new Error();return r.json()}).then(d=>{gameData=d;document.getElementById('gameTitle').textContent=esc(d.title||'Σπάσε τα Μπαλόνια!');document.getElementById('gameSubtitle').textContent=esc(d.subtitle||'');document.getElementById('instrBox').textContent=d.instruction||'Σπάσε τα σωστά!'}).catch(()=>{document.getElementById('error').textContent='Σφάλμα φόρτωσης δεδομένων: '+esc(dataFile);document.getElementById('error').classList.remove('hidden');document.getElementById('startScreen').classList.add('hidden')})}
function startGame(){score=0;lives=gameData.lives||3;timeLeft=gameData.duration||30;gameRunning=true;document.getElementById('startScreen').classList.add('hidden');document.getElementById('endScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');document.getElementById('gameArea').innerHTML='';updateUI();spawnTimer=setInterval(spawnBalloon,gameData.spawnInterval||1500);tickTimer=setInterval(()=>{timeLeft-=0.1;document.getElementById('timerFill').style.width=(timeLeft/(gameData.duration||30)*100)+'%';if(timeLeft<=0){endGame()}},100)}
function spawnBalloon(){if(!gameRunning)return;const area=document.getElementById('gameArea');const bData=gameData.balloons[Math.floor(Math.random()*gameData.balloons.length)];const el=document.createElement('div');el.className='balloon';el.style.backgroundColor=bData.color;el.style.left=(10+Math.random()*70)+'%';el.style.bottom='-80px';el.style.width=(70+Math.random()*30)+'px';el.style.height=(80+Math.random()*30)+'px';el.style.fontSize=bData.text.length>10?'.65rem':'.8rem';el.textContent=bData.text;el.dataset.correct=bData.correct;el.onclick=()=>popBalloon(el);area.appendChild(el);animateBalloon(el)}
function animateBalloon(el){const speed=(gameData.speed||1.2);let bottom=-80;const areaH=document.getElementById('gameArea').offsetHeight;function move(){if(!gameRunning||!el.parentNode)return;bottom+=speed;el.style.bottom=bottom+'px';if(bottom>areaH+20){if(el.dataset.correct==='true'){lives--;updateUI();if(lives<=0)endGame()}el.remove();return}requestAnimationFrame(move)}requestAnimationFrame(move)}
function popBalloon(el){if(!gameRunning)return;if(el.classList.contains('popped'))return;if(el.dataset.correct==='true'){score++;el.classList.add('popped');el.style.backgroundColor='#4caf50'}else{lives--;el.classList.add('popped');el.style.backgroundColor='#f44336'}updateUI();if(lives<=0){endGame()}setTimeout(()=>{if(el.parentNode)el.remove()},300)}
function updateUI(){document.getElementById('scoreInfo').textContent='Σκορ: '+score;let h='';for(let i=0;i<(gameData.lives||3);i++){h+=i<lives?'❤️':'🖤'}document.getElementById('livesInfo').innerHTML=h}
function endGame(){gameRunning=false;clearInterval(spawnTimer);clearInterval(tickTimer);document.getElementById('gameScreen').classList.add('hidden');document.getElementById('endScreen').classList.remove('hidden');document.getElementById('endScore').textContent=score;const total=gameData.balloons.filter(b=>b.correct).length;if(score>=total*0.8)document.getElementById('endMsg').textContent='Εξαιρετικά! Τα ξέρεις όλα! 🌟';else if(score>=total*0.5)document.getElementById('endMsg').textContent='Καλή προσπάθεια! 😊';else document.getElementById('endMsg').textContent='Δοκίμασε ξανά! 💪'}
function restartGame(){document.getElementById('endScreen').classList.add('hidden');document.getElementById('startScreen').classList.remove('hidden')}
</script>
</body>
</html>
