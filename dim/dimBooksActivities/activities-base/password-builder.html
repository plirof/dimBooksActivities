<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Φτιάξε Δυνατό Κωδικό!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(135deg,#11998e 0%,#38ef7d 100%);font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;display:flex;align-items:center;justify-content:center;padding:10px}
.container{max-width:700px;width:100%;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);padding:30px;text-align:center}
h1{color:#4a4a4a;font-size:1.8em;margin-bottom:5px}
h2{color:#7f8c8d;font-size:1.1em;font-weight:normal;margin-bottom:15px}
.instructions{background:#f0faf5;border-radius:15px;padding:15px;margin-bottom:20px;color:#555;font-size:0.95em;line-height:1.5}
.input-area{position:relative;margin:20px auto;max-width:400px}
.input-area input{width:100%;padding:15px 50px 15px 15px;border:3px solid #ddd;border-radius:15px;font-size:1.2em;outline:none;transition:border-color 0.3s}
.input-area input:focus{border-color:#11998e}
.toggle-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:1.4em;cursor:pointer;color:#999}
.rules{margin:20px 0;text-align:left;max-width:400px;margin-left:auto;margin-right:auto}
.rule{padding:10px 15px;margin:8px 0;border-radius:12px;font-size:1em;transition:all 0.3s;display:flex;align-items:center;gap:10px}
.rule.fail{background:#fdecea;color:#c0392b}
.rule.pass{background:#e8f8f0;color:#27ae60}
.rule .icon{font-size:1.2em;width:25px;text-align:center}
.meter{margin:20px auto;max-width:400px;height:20px;background:#ecf0f1;border-radius:10px;overflow:hidden}
.meter-fill{height:100%;border-radius:10px;transition:all 0.5s ease;width:0}
.meter-fill.weak{background:linear-gradient(90deg,#e74c3c,#e67e22);width:33%}
.meter-fill.medium{background:linear-gradient(90deg,#e67e22,#f1c40f);width:66%}
.meter-fill.strong{background:linear-gradient(90deg,#27ae60,#2ecc71);width:100%}
.meter-label{font-size:1.1em;margin-top:8px;font-weight:bold;color:#555}
.examples{margin:20px 0;text-align:left;max-width:400px;margin-left:auto;margin-right:auto}
.examples h3{color:#555;margin-bottom:10px;font-size:1em;text-align:center}
.example{padding:10px 15px;margin:6px 0;background:#f8f9fa;border-radius:12px;cursor:pointer;transition:all 0.3s;border:2px solid transparent}
.example:hover{border-color:#11998e;background:#f0faf5}
.example .pw{font-family:monospace;font-weight:bold;color:#2c3e50}
.example .str{font-size:0.9em;margin-top:4px}
.example .fb{font-size:0.85em;color:#7f8c8d;margin-top:2px}
.btn{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;border:none;padding:12px 30px;border-radius:15px;font-size:1.1em;cursor:pointer;transition:all 0.3s;box-shadow:0 5px 15px rgba(17,153,142,0.3);margin-top:15px}
.btn:hover{transform:translateY(-2px)}
.success-box{background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff;padding:20px;border-radius:15px;margin:20px 0;animation:popIn 0.5s ease}
.start-screen .emoji{font-size:3em;margin:10px 0}
@keyframes popIn{0%{transform:scale(0.5);opacity:0}50%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
@media(max-width:500px){.container{padding:15px}.input-area input{font-size:1em}}
</style>
<link rel="stylesheet" href="fonts/emoji-font.css">
</head>
<body>
<div class="container" id="app"></div>
<script>
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

const params=new URLSearchParams(window.location.search);
const dataFile=params.get('data');
let gameData=null;
let showPwd=false;

if(!dataFile){document.getElementById('app').innerHTML='<h1>Δεν βρέθηκαν δεδομένα</h1><p>Πρόσθεσε ?data=archivo.json στο URL</p>';}

function loadGame(){
fetch(dataFile).then(r=>r.json()).then(d=>{gameData=d;showStart();}).catch(()=>{document.getElementById('app').innerHTML='<h1>Σφάλμα φόρτωσης</h1>';});
}

function showStart(){
const app=document.getElementById('app');
app.innerHTML='<div class="start-screen"><div class="emoji">🔐</div><h1>'+esc(gameData.title)+'</h1><h2>'+esc(gameData.subtitle)+'</h2><div class="instructions">'+esc(gameData.instructions)+'</div><br><button class="btn" onclick="showGame()">Ξεκίνα! 🚀</button></div>';
}

function checkRule(rule,pwd){
switch(rule.type){
case 'minLength':return pwd.length>=rule.value;
case 'hasUpper':return /[A-ZΑ-Ω]/.test(pwd);
case 'hasLower':return /[a-zα-ωά-ώ]/.test(pwd);
case 'hasDigit':return /[0-9]/.test(pwd);
case 'hasSymbol':return /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(pwd);
default:return false;
}
}

function getStrength(results){
const passed=results.filter(r=>r).length;
if(passed>=results.length)return 'strong';
if(passed>=Math.ceil(results.length/2))return 'medium';
return 'weak';
}

function getStrengthLabel(strength){
if(strength==='strong')return '💪 Δυνατός';
if(strength==='medium')return '😐 Μέτριος';
return '😰 Αδύναμος';
}

function showGame(){
showPwd=false;
renderGame('');
}

function renderGame(pwd){
const results=gameData.rules.map(r=>checkRule(r,pwd));
const strength=getStrength(results);
const allPass=results.every(r=>r);
let rulesHtml='';
gameData.rules.forEach((r,i)=>{
const pass=results[i];
rulesHtml+='<div class="rule '+(pass?'pass':'fail')+'"><span class="icon">'+(pass?'✅':'❌')+'</span><span>'+esc(r.text)+'</span></div>';
});
let examplesHtml='<h3>💡 Πατήστε για να δοκιμάσετε:</h3>';
gameData.examples.forEach(ex=>{
examplesHtml+='<div class="example" onclick="tryExample(\''+esc(ex.password).replace(/'/g,"\\'")+'\')"><div class="pw">'+esc(ex.password)+'</div><div class="str">'+esc(ex.strength)+'</div><div class="fb">'+esc(ex.feedback)+'</div></div>';
});
const app=document.getElementById('app');
app.innerHTML='<h1>'+esc(gameData.title)+'</h1><h2>'+esc(gameData.subtitle)+'</h2><div class="instructions">'+esc(gameData.instructions)+'</div><div class="input-area"><input type="'+(showPwd?'text':'password')+'" id="pwdInput" placeholder="Γράψε τον κωδικό σου εδώ..." value="'+esc(pwd)+'" oninput="onInput(this.value)" /><button class="toggle-btn" onclick="toggleShow()">'+(showPwd?'🙈':'👁️')+'</button></div><div class="meter"><div class="meter-fill '+strength+'"></div></div><div class="meter-label">'+getStrengthLabel(strength)+'</div><div class="rules">'+rulesHtml+'</div>'+(allPass?'<div class="success-box">🎉 Τέλεια! Ο κωδικός σου είναι πολύ δυνατός!</div>':'')+'<div class="examples">'+examplesHtml+'</div><br><button class="btn" onclick="showStart()">Αρχική 🏠</button>';
document.getElementById('pwdInput').focus();
const len=pwd.length;
document.getElementById('pwdInput').setSelectionRange(len,len);
}

function onInput(val){renderGame(val);}

function toggleShow(){
showPwd=!showPwd;
const inp=document.getElementById('pwdInput');
if(inp)renderGame(inp.value);
}

function tryExample(pwd){showPwd=true;renderGame(pwd);}

if(dataFile)loadGame();
</script>
</body>
</html>
