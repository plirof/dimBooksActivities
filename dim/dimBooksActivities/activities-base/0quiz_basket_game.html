<!DOCTYPE html>
<html lang="el">
<head>
<!--
v005b 260518 - adjusted player positions
v005a 260517 - arena scoreboard, countdown timer, opponent scoring

-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Basket Game Κουίζ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{width:100%;height:100%;position:relative;background:#1a1a2e}

.scene{width:100%;height:100%;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#1a1a2e 0%,#16213e 28%,#c8956c 30%,#b8844e 100%)}

.court{position:absolute;bottom:0;width:100%;height:70%;
  background:repeating-linear-gradient(90deg,#c8956c 0px,#d4a574 20px,#c8956c 40px,#d4a574 60px,#c8956c 80px,#d4a574 100px);
  background-size:120px 100%}

.court-lines{position:absolute;bottom:0;width:100%;height:70%;z-index:1;pointer-events:none}
.paint{position:absolute;top:0;left:50%;transform:translateX(-50%);width:28%;height:24%;
  border:2px solid rgba(255,255,255,0.25);background:rgba(0,0,0,0.04)}
.tp-left,.tp-right{position:absolute;top:0;width:2px;height:30%;background:rgba(255,255,255,0.2)}
.tp-left{left:5%}.tp-right{right:5%}
.tp-arc{position:absolute;top:0;left:5%;width:90%;height:58%;
  border:2px solid rgba(255,255,255,0.2);border-top:none;border-radius:0 0 50% 50%}
.ft-circle{position:absolute;top:23%;left:50%;transform:translateX(-50%);
  width:18%;padding-bottom:9%;border:2px solid rgba(255,255,255,0.2);border-radius:50%;
  clip-path:inset(50% 0 0 0)}
.hc-line{position:absolute;bottom:0;left:0;width:100%;height:2px;background:rgba(255,255,255,0.2)}
.center-circ{position:absolute;bottom:-5%;left:50%;transform:translateX(-50%);
  width:14%;padding-bottom:7%;border:2px solid rgba(255,255,255,0.15);border-radius:50%;
  clip-path:inset(50% 0 0 0)}

.basket-wrap{position:absolute;top:6%;left:50%;transform:translateX(-50%);text-align:center;z-index:5}
.bb{width:90px;height:55px;
  background:linear-gradient(180deg,rgba(255,255,255,0.15),rgba(255,255,255,0.08));
  border:3px solid rgba(255,255,255,0.5);border-radius:4px;margin:0 auto;position:relative}
.bb-sq{position:absolute;top:28%;left:50%;transform:translateX(-50%);
  width:45%;height:40%;border:2px solid rgba(255,255,255,0.3)}
.rim{width:46px;height:14px;border:4px solid #ff6600;border-top:none;
  border-radius:0 0 50% 50%;margin:0 auto;position:relative;
  z-index:6;box-shadow:0 2px 6px rgba(0,0,0,0.3)}
.rim.glow{box-shadow:0 0 15px rgba(255,215,0,0.6),0 0 30px rgba(255,215,0,0.3);transition:box-shadow .3s}
.rim.shake{animation:rimShake .4s ease-out}
@keyframes rimShake{0%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}100%{transform:translateX(0)}}
.net{width:40px;height:20px;margin:-2px auto 0;
  background:repeating-linear-gradient(90deg,transparent,transparent 8px,rgba(255,255,255,0.22) 8px,rgba(255,255,255,0.22) 9px),
    repeating-linear-gradient(0deg,transparent,transparent 6px,rgba(255,255,255,0.22) 6px,rgba(255,255,255,0.22) 7px);
  clip-path:polygon(5% 0%,95% 0%,80% 100%,20% 100%);pointer-events:none;z-index:4}
.net.swish{animation:swish .5s ease-out}
@keyframes swish{0%{transform:scaleY(1)}25%{transform:scaleY(1.4)}50%{transform:scaleY(0.8)}75%{transform:scaleY(1.1)}100%{transform:scaleY(1)}}

.scoreboard{
  position:absolute;top:0;left:0;
  background:linear-gradient(180deg,#0d0d0d,#1a1a1a,#222);
  border:3px solid #FFD700;border-left:none;
  border-radius:0 0 14px 0;
  color:#fff;padding:6px 10px 6px 6px;
  display:flex;align-items:center;gap:6px;
  z-index:3;
  box-shadow:0 4px 30px rgba(0,0,0,0.8),0 0 50px rgba(255,215,0,0.1),inset 0 1px 0 rgba(255,215,0,0.15);
  max-width:52%;justify-content:center
}
.sb-team{text-align:center;min-width:42px}
.sb-team-name{font-size:7px;opacity:.6;text-transform:uppercase;letter-spacing:1px;margin-bottom:1px}
.sb-team-score{font-size:26px;font-weight:900;color:#FFD700;line-height:1;
  text-shadow:0 0 10px rgba(255,215,0,0.4),0 1px 2px rgba(0,0,0,0.5)}
.sb-center{text-align:center;padding:0 4px;min-width:48px}
.sb-timer{font-size:20px;font-weight:700;color:#ff4444;font-family:'Courier New',Courier,monospace;
  text-shadow:0 0 8px rgba(255,60,60,0.5);line-height:1;letter-spacing:1px}
.sb-timer.low{animation:timerPulse .5s infinite}
@keyframes timerPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(1.08)}}
.sb-qtr{font-size:7px;opacity:.45;margin-top:2px;text-transform:uppercase;letter-spacing:1px}
.sb-divider{width:2px;height:32px;background:linear-gradient(180deg,rgba(255,215,0,0.1),rgba(255,215,0,0.35),rgba(255,215,0,0.1));border-radius:1px}

.opp-notify{
  position:absolute;top:45%;left:50%;transform:translate(-50%,-50%) scale(0);
  background:linear-gradient(135deg,rgba(180,0,0,0.95),rgba(100,0,0,0.97));
  color:#fff;padding:16px 30px;border-radius:16px;
  font-size:18px;font-weight:800;z-index:30;pointer-events:none;
  opacity:0;transition:transform .35s cubic-bezier(.17,.67,.29,1.4),opacity .3s;
  text-align:center;border:2px solid rgba(255,80,80,0.6);
  box-shadow:0 0 40px rgba(255,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.1);
  text-shadow:1px 1px 3px rgba(0,0,0,0.5);
  line-height:1.4
}
.opp-notify.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.opp-notify .opp-pts{font-size:30px;color:#ff6666;display:block;margin-top:6px;
  text-shadow:0 0 10px rgba(255,100,100,0.5)}

.player{position:absolute;width:36px;height:48px;z-index:10;
  transform:translate(-50%,-50%);transition:transform .3s}
.p-body{position:relative;width:100%;height:100%}
.p-head{position:absolute;top:2px;left:50%;transform:translateX(-50%);
  width:13px;height:13px;border-radius:50%;
  background:linear-gradient(180deg,#ffcc80,#ffb74d);border:1.5px solid #e65100}
.p-torso{position:absolute;top:14px;left:50%;transform:translateX(-50%);
  width:15px;height:12px;border-radius:2px;
  display:flex;align-items:center;justify-content:center;
  font-size:7px;font-weight:bold;color:#fff;line-height:1}
.player.off .p-torso{background:linear-gradient(180deg,#ffcc00,#cc9900);border:1px solid #ffdd33}
.player.off .p-arm-l,.player.off .p-arm-r{background:linear-gradient(180deg,#ffcc00,#cc9900)}
.player.def .p-torso{background:linear-gradient(180deg,#cc3333,#881111);border:1px solid #ff5555}
.player.def .p-arm-l,.player.def .p-arm-r{background:linear-gradient(180deg,#cc3333,#881111)}
.p-arm-l,.p-arm-r{position:absolute;top:14px;width:6px;height:14px;border-radius:2px;
  transform-origin:top center;transition:transform .25s ease-out}
.p-arm-l{left:3px;transform:rotate(15deg)}
.p-arm-r{right:3px;transform:rotate(-15deg)}
.p-legs{position:absolute;top:25px;left:50%;transform:translateX(-50%);width:15px;height:17px}
.p-leg-l,.p-leg-r{position:absolute;top:0;width:7px;height:17px;border-radius:2px;
  transform-origin:top center;background:linear-gradient(180deg,#5d4037,#4e342e)}
.p-leg-l{left:0}.p-leg-r{right:0}
.player.ready{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 4px rgba(255,255,0,0.4))}50%{filter:drop-shadow(0 0 12px rgba(255,255,0,0.8))}}
.player.ball-marker .p-arm-r::after{content:'';position:absolute;bottom:-3px;left:50%;
  transform:translateX(-50%);width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#ff8c00,#cc6600);border:1px solid #993300;z-index:2}
.player.shooting .p-arm-l{transform:rotate(-155deg)}
.player.shooting .p-arm-r{transform:rotate(155deg)}

.ball{position:absolute;width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#ff8c00,#cc6600);
  border:2px solid #993300;box-shadow:2px 2px 4px rgba(0,0,0,0.3);
  z-index:12;transform:translate(-50%,-50%)}
.ball-lines{position:absolute;top:50%;left:0;width:100%;height:2px;background:rgba(0,0,0,0.25);transform:translateY(-50%)}
.ball-vline{position:absolute;left:50%;top:0;width:2px;height:100%;background:rgba(0,0,0,0.25);transform:translateX(-50%)}
.ball.gone{display:none}

.ans-zone{position:absolute;transform:translate(-50%,0);
  width:26%;max-width:180px;min-width:70px;
  padding:8px 6px;background:rgba(255,140,0,0.2);
  border:2px dashed rgba(255,200,50,0.6);border-radius:6px;
  color:#fff;font-weight:600;font-size:11px;line-height:1.2;
  cursor:pointer;text-align:center;overflow-wrap:break-word;
  text-shadow:1px 1px 2px rgba(0,0,0,0.8);touch-action:manipulation;
  z-index:14;transition:background .12s,border-color .12s}
.ans-zone:active{background:rgba(255,140,0,0.5)}
.ans-zone.off{pointer-events:none;opacity:.3}
.ans-zone.ok{border-color:#4CAF50;background:rgba(76,175,80,0.45);border-style:solid}
.ans-zone.no{border-color:#f44336;background:rgba(244,67,54,0.35);border-style:solid}

.result{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) scale(0);
  font-size:42px;font-weight:900;z-index:25;pointer-events:none;opacity:0;
  text-shadow:2px 2px 8px rgba(0,0,0,0.6);transition:transform .25s ease-out,opacity .25s}
.result.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.result.goal{color:#FFD700}
.result.miss{color:#FF5252}

.qarea{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:94%;max-width:540px;z-index:15;text-align:center;
  background:rgba(0,0,0,0.65);color:#fff;padding:10px 14px;border-radius:10px 10px 0 0}
.qarea .qnum{font-size:10px;opacity:.45;margin-bottom:3px}
.qarea .qt{font-size:14px;line-height:1.3;margin-bottom:6px}
.qarea .ctrls{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qarea .fb{font-size:12px;flex:1;display:none;text-align:left}
.qarea .fb.ok{color:#8BC34A;display:block}
.qarea .fb.no{color:#FF5252;display:block}
.nbtn{display:none;padding:7px 18px;background:linear-gradient(135deg,#ff6600,#ff3300);
  color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer;
  touch-action:manipulation;white-space:nowrap}
.nbtn:active{opacity:.85}

.loading,.error-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:#fff;font-size:1.1em;text-align:center;text-shadow:1px 1px 4px rgba(0,0,0,0.5)}

.final{position:absolute;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.88);display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:#fff;z-index:50;text-align:center;padding:20px}
.final h2{font-size:1.5em;margin-bottom:6px}
.final .bs{font-size:3em;font-weight:900;color:#FFD700;margin:6px 0}
.final .fm{font-size:1em;margin-bottom:14px;color:#ccc}
.rbtn{padding:11px 32px;background:linear-gradient(135deg,#ff6600,#ff3300);
  color:#fff;border:none;border-radius:12px;font-size:1.1em;cursor:pointer;touch-action:manipulation}

@media(min-width:500px){
  .player{width:44px;height:60px}
  .p-head{width:16px;height:16px;top:2px}
  .p-torso{width:19px;height:15px;top:17px;font-size:9px}
  .p-arm-l,.p-arm-r{width:7px;height:17px;top:17px}
  .p-arm-l{left:4px}.p-arm-r{right:4px}
  .p-legs{width:19px;height:20px;top:31px}
  .p-leg-l,.p-leg-r{width:8px;height:20px}
  .player.ball-marker .p-arm-r::after{width:11px;height:11px}
  .ball{width:36px;height:36px}
  .ans-zone{font-size:13px;padding:9px 10px;max-width:220px}
  .scoreboard{padding:10px 24px 12px 10px;gap:16px;border-radius:0 0 18px 0}
  .sb-team-score{font-size:46px}
  .sb-timer{font-size:32px}
  .sb-team-name{font-size:10px}
  .sb-team{min-width:70px}
  .sb-center{min-width:70px;padding:0 8px}
  .sb-divider{height:54px}
  .qarea .qt{font-size:16px}.result{font-size:56px}
  .basket-wrap{top:5%}
  .bb{width:110px;height:65px}
  .rim{width:54px;height:16px}
  .net{width:48px;height:24px}
  .opp-notify{font-size:22px;padding:20px 40px}
  .opp-notify .opp-pts{font-size:36px}
}
@media(max-height:500px){
  .player{width:28px;height:38px}
  .p-head{width:10px;height:10px;top:1px;border-width:1px}
  .p-torso{width:12px;height:10px;top:10px;font-size:5px}
  .p-arm-l,.p-arm-r{width:5px;height:11px;top:10px}
  .p-arm-l{left:2px}.p-arm-r{right:2px}
  .p-legs{width:12px;height:14px;top:19px}
  .p-leg-l,.p-leg-r{width:5px;height:14px}
  .player.ball-marker .p-arm-r::after{width:7px;height:7px}
  .ball{width:24px;height:24px}
  .scoreboard{padding:3px 6px 3px 3px;gap:4px;max-width:42%;border-width:2px;border-radius:0 0 10px 0}
  .sb-team-score{font-size:20px}
  .sb-timer{font-size:14px;letter-spacing:0}
  .sb-team{min-width:32px}
  .sb-center{min-width:36px;padding:0 2px}
  .sb-divider{height:24px}
  .sb-team-name{font-size:6px;letter-spacing:.5px}
  .qarea{padding:6px 10px}.qarea .qt{font-size:11px}
  .ans-zone{font-size:9px;padding:5px 4px;min-width:55px}
  .result{font-size:28px}
  .scene{background:linear-gradient(180deg,#1a1a2e 0%,#16213e 22%,#c8956c 24%,#b8844e 100%)}
  .bb{width:70px;height:40px}.rim{width:36px;height:10px}.net{width:32px;height:14px}
  .opp-notify{font-size:13px;padding:10px 16px}
  .opp-notify .opp-pts{font-size:20px}
}
</style>
</head>
<body>
<div id="app"><div class="loading">Φόρτωση...</div></div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

var params=new URLSearchParams(window.location.search);
var dataFile=params.get('data');
var app=document.getElementById('app');

if(!dataFile){
  app.innerHTML='<div class="error-msg">Δεν βρέθηκε αρχείο δεδομένων.<br>?data=αρχείο.json</div>';
  throw new Error('No data');
}

fetch(dataFile).then(function(r){if(!r.ok)throw new Error('Δεν βρέθηκε: '+dataFile);return r.json()}).then(function(data){

var questions=data.questions.slice();
if(!questions.length){app.innerHTML='<div class="error-msg">Δεν βρέθηκαν ερωτήσεις.</div>';return}

var SLOTS=['o5','o2','o3','o4'];
var POINTS={o5:2,o2:3,o3:3,o4:2};

var POS={
  o1:{t:74,l:50}, o2:{t:42,l:3}, o3:{t:42,l:96},
  o4:{t:60,l:78}, o5:{t:44,l:38},
  d1:{t:69,l:50}, d2:{t:37,l:15}, d3:{t:37,l:88},
  d4:{t:53,l:76}, d5:{t:39,l:45}
};

var ANS={
  o5:{t:50,l:44}, o2:{t:46,l:12},
  o3:{t:46,l:84}, o4:{t:63,l:74}
};

var cur=0,playerScore=90,opponentScore=90,correctCount=0,answered=false;
var totalTime=questions.length*10;
var timeLeft=totalTime;
var gameOver=false;

function fmtTime(s){
  s=Math.max(0,s);
  var m=Math.floor(s/60);
  var ss=s%60;
  return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;
}

function updateTimerDisplay(){
  var el=document.getElementById('sb-timer');
  if(el){
    el.textContent=fmtTime(timeLeft);
    if(timeLeft<=30)el.classList.add('low');
    else el.classList.remove('low');
  }
}

function updateScoreDisplay(){
  var ps=document.getElementById('sb-pscore');
  var os=document.getElementById('sb-oscore');
  if(ps)ps.textContent=playerScore;
  if(os)os.textContent=opponentScore;
}

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function buildPlayers(activeSlots){
  var h='',keys=['o1','o2','o3','o4','o5','d1','d2','d3','d4','d5'];
  for(var i=0;i<keys.length;i++){
    var k=keys[i],p=POS[k];
    var isO=k[0]==='o';
    var cls=isO?'off':'def';
    var rdy=activeSlots.indexOf(k)>=0?' ready':'';
    var bm=k==='o1'?' ball-marker':'';
    var num=k[1];
    h+='<div class="player '+cls+rdy+bm+'" id="p_'+k+'" style="top:'+p.t+'%;left:'+p.l+'%">'+
      '<div class="p-body"><div class="p-head"></div>'+
      '<div class="p-torso">'+num+'</div>'+
      '<div class="p-arm-l"></div><div class="p-arm-r"></div>'+
      '<div class="p-legs"><div class="p-leg-l"></div><div class="p-leg-r"></div></div>'+
      '</div></div>';
  }
  return h;
}

function prepItems(q){
  var isTF=q.type==='tf';
  var items;
  if(isTF){
    var cv=(q.answer!==undefined?q.answer:q.correct).toString();
    items=[{label:'\u2713 \u0391\u039B\u0397\u0398\u0395\u0399\u0391',val:'true'},{label:'\u2717 \u03A8\u0395\u039C\u0391\u03A4\u0391',val:'false'}];
    items.sort(function(){return Math.random()-.5});
    for(var i=0;i<items.length;i++) items[i].ok=items[i].val===cv;
  }else{
    var opts=q.options.slice(0,4);
    items=opts.map(function(o,idx){return{text:o,i:idx}});
    items.sort(function(){return Math.random()-.5});
    for(var i=0;i<items.length;i++) items[i].ok=items[i].i===q.correctIndex;
  }
  return items;
}

function buildAnswers(items){
  var n=items.length;
  var si=shuffle([0,1,2,3]).slice(0,n);
  var activeSlots=[];
  var h='';
  for(var i=0;i<n;i++){
    var slot=SLOTS[si[i]];
    activeSlots.push(slot);
    var ap=ANS[slot];
    var isTF=items[i].label!==undefined;
    var disp=isTF?items[i].label:esc(items[i].text);
    h+='<div class="ans-zone" data-ok="'+items[i].ok+'" data-shooter="'+slot+'" style="top:'+ap.t+'%;left:'+ap.l+'%" onclick="pick(this)">'+disp+'</div>';
  }
  return {html:h,slots:activeSlots};
}

function render(){
  if(gameOver)return;
  answered=false;
  var q=questions[cur];
  var items=prepItems(q);
  var ans=buildAnswers(items);

  app.innerHTML=
    '<div class="scene" id="scene">'+
      '<div class="court"></div>'+
      '<div class="court-lines">'+
        '<div class="paint"></div>'+
        '<div class="tp-left"></div><div class="tp-right"></div>'+
        '<div class="tp-arc"></div>'+
        '<div class="ft-circle"></div>'+
        '<div class="hc-line"></div>'+
        '<div class="center-circ"></div>'+
      '</div>'+
      '<div class="basket-wrap" id="bwrap">'+
        '<div class="bb"><div class="bb-sq"></div></div>'+
        '<div class="rim" id="rim"></div>'+
        '<div class="net" id="net"></div>'+
      '</div>'+
      '<div class="scoreboard" id="scoreboard">'+
        '<div class="sb-team">'+
          '<div class="sb-team-name">\u039F\u03BC\u03AC\u03B4\u03B1 \u039C\u03B1\u03C2</div>'+
          '<div class="sb-team-score" id="sb-pscore">'+playerScore+'</div>'+
        '</div>'+
        '<div class="sb-divider"></div>'+
        '<div class="sb-center">'+
          '<div class="sb-timer'+(timeLeft<=30?' low':'')+'" id="sb-timer">'+fmtTime(timeLeft)+'</div>'+
          '<div class="sb-qtr">\u0395\u03C1\u03CE\u03C4. '+(cur+1)+'/'+questions.length+'</div>'+
        '</div>'+
        '<div class="sb-divider"></div>'+
        '<div class="sb-team">'+
          '<div class="sb-team-name">\u0391\u03BD\u03C4\u03AF\u03C0\u03B1\u03BB\u03BF\u03C2</div>'+
          '<div class="sb-team-score" id="sb-oscore">'+opponentScore+'</div>'+
        '</div>'+
      '</div>'+
      buildPlayers(ans.slots)+
      ans.html+
      '<div class="ball" id="ball" style="top:'+POS.o1.t+'%;left:'+POS.o1.l+'%">'+
        '<div class="ball-lines"></div><div class="ball-vline"></div>'+
      '</div>'+
      '<div class="result" id="res"></div>'+
      '<div class="opp-notify" id="opp-notify"></div>'+
    '</div>'+
    '<div class="qarea">'+
      '<div class="qnum">\u0395\u03C1\u03CE\u03C4\u03B7\u03C3\u03B7 '+(cur+1)+'/'+questions.length+'</div>'+
      '<div class="qt">'+esc(q.text)+'</div>'+
      '<div class="ctrls">'+
        '<div class="fb" id="fb"></div>'+
        '<button class="nbtn" id="nbtn">'+(cur<questions.length-1?'\u0395\u03C0\u03CC\u03BC\u03B5\u03BD\u03B7 \u0395\u03C1\u03CE\u03C4\u03B7\u03C3\u03B7 \u2192':'\u0391\u03C0\u03BF\u03C4\u03AD\u03BB\u03B5\u03C3\u03BC\u03B1')+'</button>'+
      '</div>'+
    '</div>';

  document.getElementById('nbtn').onclick=function(){
    cur++;
    if(cur<questions.length&&!gameOver) render();
    else showFinal();
  };
}

function showOpponentScored(){
  opponentScore+=2;
  updateScoreDisplay();
  var oppN=document.getElementById('opp-notify');
  if(oppN){
    oppN.innerHTML='\u039F \u0391\u039D\u03A4\u0399\u03A0\u0391\u039B\u039F\u03A3 \u03A3\u039A\u039F\u03A1\u0391\u03A1\u0395!<br><span class="opp-pts">+2 \u03A0\u039F\u039D\u03A4\u039F\u0399</span>';
    oppN.classList.add('show');
  }
  setTimeout(function(){
    if(oppN)oppN.classList.remove('show');
    if(!gameOver){
      document.getElementById('nbtn').style.display='inline-block';
    }
  },1800);
}

window.pick=function(el){
  if(answered||gameOver)return;
  answered=true;

  timeLeft=Math.max(0,timeLeft-10);
  updateTimerDisplay();

  var q=questions[cur];
  var s=el.dataset.shooter;
  var pts=POINTS[s];
  var isOk=el.dataset.ok==='true';

  var ball=document.getElementById('ball');
  var scene=document.getElementById('scene');
  var res=document.getElementById('res');
  var fb=document.getElementById('fb');
  var netEl=document.getElementById('net');
  var rimEl=document.getElementById('rim');
  var shooterEl=document.getElementById('p_'+s);
  var defEl=document.getElementById('p_d'+s[1]);
  var sceneR=scene.getBoundingClientRect();

  var zones=document.querySelectorAll('.ans-zone');
  for(var i=0;i<zones.length;i++) zones[i].classList.add('off');

  var players=document.querySelectorAll('.player.ready');
  for(var i=0;i<players.length;i++) players[i].classList.remove('ready');

  var o1El=document.getElementById('p_o1');
  o1El.classList.remove('ball-marker');

  var ballR=ball.getBoundingClientRect();
  var curX=ballR.left+ballR.width/2-sceneR.left;
  var curY=ballR.top+ballR.height/2-sceneR.top;

  ball.style.transition='none';
  ball.style.left=curX+'px';
  ball.style.top=curY+'px';
  ball.style.transform='translate(-50%,-50%)';

  var sR=shooterEl.getBoundingClientRect();
  var tgtX=sR.left+sR.width/2-sceneR.left;
  var tgtY=sR.top+sR.height/2-sceneR.top;

  void ball.offsetWidth;
  ball.style.transition='left .4s ease-out,top .4s ease-out';
  ball.style.left=tgtX+'px';
  ball.style.top=tgtY+'px';

  setTimeout(function(){
    if(gameOver)return;
    var rimR=rimEl.getBoundingClientRect();
    var ex=rimR.left+rimR.width/2-sceneR.left;
    var ey=rimR.top+rimR.height/2-sceneR.top;

    ball.style.transition='none';
    shooterEl.classList.add('shooting');

    if(isOk){
      var cpx=(tgtX+ex)/2;
      var cpy=Math.min(tgtY,ey)-sceneR.height*0.18;
      var dur=600,st=null;
      function arc(ts){
        if(!st)st=ts;
        var p=Math.min((ts-st)/dur,1);
        var x=(1-p)*(1-p)*tgtX+2*(1-p)*p*cpx+p*p*ex;
        var y=(1-p)*(1-p)*tgtY+2*(1-p)*p*cpy+p*p*ey;
        var rot=p*720;
        var sc=p>0.85?1-(p-0.85)/0.15*0.6:1;
        ball.style.left=x+'px';
        ball.style.top=y+'px';
        ball.style.transform='translate(-50%,-50%) rotate('+rot+'deg) scale('+sc+')';
        if(p>0.88) ball.style.zIndex='4';
        if(p<1) requestAnimationFrame(arc);
        else{ball.classList.add('gone');shooterEl.classList.remove('shooting')}
      }
      requestAnimationFrame(arc);

      setTimeout(function(){
        playerScore+=pts;
        updateScoreDisplay();
        res.textContent='+'+pts+' \u03A0\u03CC\u03BD\u03C4\u03BF\u03B9! ('+s.toUpperCase()+')';
        res.className='result goal show';
        netEl.classList.add('swish');
        rimEl.classList.add('glow');
        fb.textContent=q.explanation||'\u03A3\u03C9\u03C3\u03C4\u03CC! \u039C\u03C0\u03C1\u03AC\u03B2\u03BF!';
        fb.className='fb ok';
        el.classList.remove('off');
        el.classList.add('ok');
        correctCount++;
        setTimeout(showOpponentScored,900);
      },650);
    }else{
      var defR=defEl.getBoundingClientRect();
      var dx=(sR.left-defR.left)*0.5;
      var dy=(sR.top-defR.top)*0.4;
      defEl.style.transition='transform .3s ease-out';
      defEl.style.transform='translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px)) scale(1.2)';
      defEl.style.zIndex='18';

      var cpxM=(tgtX+ex)/2;
      var cpyM=Math.min(tgtY,ey)-sceneR.height*0.16;
      var durA=500,stA=null;
      function arcMiss(ts){
        if(!stA)stA=ts;
        var p=Math.min((ts-stA)/durA,1);
        var x=(1-p)*(1-p)*tgtX+2*(1-p)*p*cpxM+p*p*ex;
        var y=(1-p)*(1-p)*tgtY+2*(1-p)*p*cpyM+p*p*ey;
        ball.style.left=x+'px';
        ball.style.top=y+'px';
        ball.style.transform='translate(-50%,-50%) rotate('+p*540+'deg)';
        if(p<1) requestAnimationFrame(arcMiss);
        else{
          rimEl.classList.add('shake');
          var bounceDir=Math.random()>.5?1:-1;
          var bounceX=ex+bounceDir*60;
          var bounceY=ey+30;
          var durB=350,stB=null;
          function bounceA(ts2){
            if(!stB)stB=ts2;
            var p2=Math.min((ts2-stB)/durB,1);
            var ease=1-Math.pow(1-p2,3);
            var bx=ex+(bounceX-ex)*ease;
            var by=ey+(bounceY-ey)*ease-Math.sin(p2*Math.PI)*40;
            ball.style.left=bx+'px';
            ball.style.top=by+'px';
            ball.style.transform='translate(-50%,-50%) rotate('+(540+p2*360)+'deg) scale(1)';
            if(p2<1) requestAnimationFrame(bounceA);
            else{
              var durF=300,stF=null;
              function fallA(ts3){
                if(!stF)stF=ts3;
                var p3=Math.min((ts3-stF)/durF,1);
                var fy=by+p3*60;
                ball.style.top=fy+'px';
                ball.style.transform='translate(-50%,-50%) rotate('+(900+p3*300)+'deg) scale(1)';
                if(p3<1) requestAnimationFrame(fallA);
                else{ball.classList.add('gone');shooterEl.classList.remove('shooting')}
              }
              requestAnimationFrame(fallA);
            }
          }
          requestAnimationFrame(bounceA);

          setTimeout(function(){
            res.textContent='\u0391\u03A0\u039F\u03A4\u03A5\u03A7\u0399\u0391! ('+s.toUpperCase()+')';
            res.className='result miss show';
            fb.textContent=q.explanation||'\u0394\u03B5\u03BD \u03B5\u03AF\u03BD\u03B1\u03B9 \u03C3\u03C9\u03C3\u03C4\u03CC.';
            fb.className='fb no';
            el.classList.remove('off');
            el.classList.add('no');
            var cz=document.querySelector('.ans-zone[data-ok="true"]');
            if(cz){cz.classList.remove('off');cz.classList.add('ok')}
            setTimeout(showOpponentScored,900);
          },650);
        }
      }
      requestAnimationFrame(arcMiss);
    }
  },450);
};

function showFinal(){
  gameOver=true;
  var diff=playerScore-opponentScore;
  var msg=diff>10?'\u0395\u03BE\u03B1\u03B9\u03C1\u03B5\u03C4\u03B9\u03BA\u03AC! \u0394\u03B9\u03B1\u03C6\u03BF\u03C1\u03AC '+diff+' \u03C0\u03CC\u03BD\u03C4\u03C9\u03BD!':
    diff>0?'\u039D\u0399\u039A\u0397! \u039A\u03AD\u03C1\u03B4\u03B9\u03C3\u03B5\u03C2 \u03BC\u03B5 '+diff+' \u03C0\u03CC\u03BD\u03C4\u03BF\u03C5\u03C2!':
    diff===0?'\u0399\u03A3\u039F\u03A0\u0391\u039B\u0399\u0391! \u03A4\u03B9 \u03B1\u03B3\u03CE\u03BD\u03B1\u03C2!':
    '\u0389\u03C4\u03C4\u03B1 \u03BC\u03B5 '+Math.abs(diff)+' \u03C0\u03CC\u03BD\u03C4\u03BF\u03C5\u03C2. \u0394\u03BF\u03BA\u03AF\u03BC\u03B1\u03C3\u03B5 \u03BE\u03B1\u03BD\u03AC!';
  var pct=questions.length>0?Math.round(correctCount/questions.length*100):0;
  app.innerHTML='<div class="final"><h2>\u03A4\u03AD\u03BB\u03BF\u03C2 \u0391\u03B3\u03CE\u03BD\u03B1!</h2>'+
    '<div class="bs">'+playerScore+' \u2013 '+opponentScore+'</div>'+
    '<div class="fm">'+correctCount+'/'+questions.length+' \u03B5\u03CD\u03C3\u03C4\u03BF\u03C7\u03B1 \u03C3\u03BF\u03C5\u03C4 ('+pct+'%) | '+msg+'</div>'+
    '<button class="rbtn" onclick="location.reload()">\u039E\u03B1\u03BD\u03B1\u03B4\u03BF\u03BA\u03AF\u03BC\u03B1\u03C3\u03B5!</button></div>';
}

render();

}).catch(function(err){
  app.innerHTML='<div class="error-msg">\u03A3\u03C6\u03AC\u03BB\u03BC\u03B1: '+esc(err.message)+'</div>';
});
</script>
</body>
</html>
