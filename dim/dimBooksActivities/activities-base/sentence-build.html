<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Φτιάξε την Πρόταση!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(135deg,#ffecd2 0%,#fcb69f 50%,#ff9a9e 100%);font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;display:flex;align-items:center;justify-content:center;padding:10px}
.container{max-width:700px;width:100%;background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.15);padding:30px;text-align:center}
h1{color:#ff6f00;font-size:1.8rem;margin-bottom:5px}
h2{color:#e65100;font-size:1.1rem;margin-bottom:20px;font-weight:400}
.start-btn,.restart-btn{background:linear-gradient(135deg,#ff6f00,#f44336);color:#fff;border:none;padding:14px 40px;border-radius:30px;font-size:1.2rem;cursor:pointer;box-shadow:0 5px 15px rgba(255,111,0,.3);transition:transform .2s,box-shadow .2s}
.start-btn:hover,.restart-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(255,111,0,.4)}
.info-bar{display:flex;justify-content:space-between;margin-bottom:10px;font-size:.95rem;color:#666}
.answer-row{min-height:55px;background:#fff8e1;border:2px dashed #ffb74d;border-radius:15px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:10px 0;transition:all .3s}
.answer-row.complete{border-color:#4caf50;background:#e8f5e9}
.answer-row.wrong{animation:shake .4s;border-color:#f44336;background:#ffebee}
.words-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:15px 0}
.word-btn{padding:10px 18px;border-radius:12px;font-size:1rem;font-weight:600;border:2px solid #ff6f00;background:#fff;cursor:pointer;transition:all .2s;box-shadow:0 3px 8px rgba(0,0,0,.1);color:#333}
.word-btn:hover{transform:translateY(-2px);box-shadow:0 5px 12px rgba(0,0,0,.15)}
.word-btn.used{opacity:.3;pointer-events:none;transform:scale(.9)}
.ans-word{padding:10px 18px;border-radius:12px;font-size:1rem;font-weight:600;border:2px solid #4caf50;background:#e8f5e9;cursor:pointer;transition:all .2s;color:#333}
.ans-word:hover{background:#ffcdd2;border-color:#f44336}
.hint-btn{background:linear-gradient(135deg,#ffb74d,#ff9800);color:#fff;border:none;padding:8px 20px;border-radius:20px;font-size:.9rem;cursor:pointer;margin:8px;box-shadow:0 3px 10px rgba(255,152,0,.3);transition:transform .2s}
.hint-btn:hover{transform:translateY(-2px)}
.hint-text{color:#e65100;font-style:italic;margin:5px 0;font-size:.9rem}
.feedback{font-size:1.1rem;font-weight:600;margin:8px 0;min-height:28px}
.feedback.ok{color:#4caf50}
.feedback.fail{color:#f44336}
.hidden{display:none}
.progress{height:8px;background:#eee;border-radius:4px;margin:10px 0;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#ff6f00,#f44336);border-radius:4px;transition:width .3s}
.end-score{font-size:3rem;color:#ff6f00;font-weight:700;margin:15px 0}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
<link rel="stylesheet" href="fonts/emoji-font.css">
</head>
<body>
<div class="container">
<div id="error" class="hidden" style="color:#f44336;font-size:1.1rem;padding:30px"></div>
<div id="startScreen">
<h1 id="gameTitle">Φτιάξε την Πρόταση!</h1>
<h2 id="gameSubtitle">Βάλε τις λέξεις στη σωστή σειρά</h2>
<p style="color:#666;margin-bottom:20px">Πάτα τις λέξεις με τη σωστή σειρά για να φτιάξεις την πρόταση.<br>Πάτα μια λέξη στην απάντηση για να την ξαναβάλεις.</p>
<button class="start-btn" onclick="startGame()">▶ Έναρξη</button>
</div>
<div id="gameScreen" class="hidden">
<div class="info-bar"><span id="roundInfo"></span><span id="scoreInfo"></span></div>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="feedback" id="feedback"></div>
<div class="answer-row" id="answerRow"></div>
<div class="words-row" id="wordsRow"></div>
<div><button class="hint-btn" id="hintBtn" onclick="showHint()">💡 Βοήθεια</button><span class="hint-text hidden" id="hintText"></span></div>
</div>
<div id="endScreen" class="hidden">
<h1>Τέλος!</h1>
<div class="end-score" id="endScore"></div>
<p id="endMsg" style="font-size:1.1rem;color:#666;margin-bottom:20px"></p>
<button class="restart-btn" onclick="restartGame()">🔄 Ξανά!</button>
</div>
</div>
<script>
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
const params=new URLSearchParams(window.location.search);
const dataFile=params.get('data');
let gameData=null,currentRound=0,score=0,selected=[],shuffled=[],hintShown=false;
if(!dataFile){document.getElementById('error').textContent='Δεν βρέθηκε αρχείο δεδομένων. Χρησιμοποίησε ?data=file.json';document.getElementById('error').classList.remove('hidden');document.getElementById('startScreen').classList.add('hidden')}else{fetch(dataFile).then(r=>{if(!r.ok)throw new Error();return r.json()}).then(d=>{gameData=d;document.getElementById('gameTitle').textContent=esc(d.title||'Φτιάξε την Πρόταση!');document.getElementById('gameSubtitle').textContent=esc(d.subtitle||'')}).catch(()=>{document.getElementById('error').textContent='Σφάλμα φόρτωσης δεδομένων: '+esc(dataFile);document.getElementById('error').classList.remove('hidden');document.getElementById('startScreen').classList.add('hidden')})}
function shuffle(a){const arr=[...a];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function startGame(){currentRound=0;score=0;document.getElementById('startScreen').classList.add('hidden');document.getElementById('endScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');showRound()}
function showRound(){selected=[];hintShown=false;const sent=gameData.sentences[currentRound];const total=gameData.sentences.length;document.getElementById('roundInfo').textContent='Πρόταση '+(currentRound+1)+'/'+total;document.getElementById('scoreInfo').textContent='Σκορ: '+score;document.getElementById('progressBar').style.width=(currentRound/total*100)+'%';document.getElementById('feedback').textContent='';document.getElementById('feedback').className='feedback';document.getElementById('hintText').classList.add('hidden');document.getElementById('hintText').textContent='';document.getElementById('answerRow').classList.remove('complete','wrong');shuffled=shuffle(sent.words.map((w,i)=>({word:w,origIndex:i})));renderWords();renderAnswer()}
function renderWords(){const row=document.getElementById('wordsRow');row.innerHTML='';shuffled.forEach((item,i)=>{const btn=document.createElement('button');btn.className='word-btn';if(selected.find(s=>s.shuffledIndex===i))btn.classList.add('used');btn.textContent=item.word;btn.onclick=()=>selectWord(i);row.appendChild(btn)})}
function renderAnswer(){const row=document.getElementById('answerRow');row.innerHTML='';if(selected.length===0){row.innerHTML='<span style="color:#bbb">Κάνε κλικ στις λέξεις με τη σωστή σειρά...</span>';return}selected.forEach((s,idx)=>{const span=document.createElement('span');span.className='ans-word';span.textContent=s.word;span.onclick=()=>undoWord(idx);row.appendChild(span)})}
function selectWord(shuffledIdx){if(selected.find(s=>s.shuffledIndex===shuffledIdx))return;const item=shuffled[shuffledIdx];selected.push({word:item.word,origIndex:item.origIndex,shuffledIndex:shuffledIdx});renderWords();renderAnswer();const sent=gameData.sentences[currentRound];if(selected.length===sent.words.length){checkSentence()}}
function undoWord(ansIdx){const removed=selected.splice(ansIdx,1);renderWords();renderAnswer();document.getElementById('answerRow').classList.remove('complete','wrong')}
function checkSentence(){const sent=gameData.sentences[currentRound];const correct=sent.words.join(' ');const attempt=selected.map(s=>s.word).join(' ');const row=document.getElementById('answerRow');if(attempt===correct){row.classList.add('complete');document.getElementById('feedback').textContent='Σωστό! 🎉';document.getElementById('feedback').className='feedback ok';score++;setTimeout(()=>{currentRound++;if(currentRound>=gameData.sentences.length){endGame()}else{showRound()}},1200)}else{row.classList.add('wrong');document.getElementById('feedback').textContent='Λάθος σειρά! Δοκίμασε ξανά!';document.getElementById('feedback').className='feedback fail';setTimeout(()=>{selected=[];row.classList.remove('wrong');renderWords();renderAnswer()},1000)}}
function showHint(){if(hintShown)return;hintShown=true;const sent=gameData.sentences[currentRound];document.getElementById('hintText').textContent='💡 Υπόδειξη: '+esc(sent.hint||'');document.getElementById('hintText').classList.remove('hidden')}
function endGame(){document.getElementById('gameScreen').classList.add('hidden');document.getElementById('endScreen').classList.remove('hidden');const total=gameData.sentences.length;document.getElementById('endScore').textContent=score+' / '+total;const pct=score/total;if(pct>=.8)document.getElementById('endMsg').textContent='Εξαιρετικά! Μιλάς σαν επαγγελματίας! 🌟';else if(pct>=.5)document.getElementById('endMsg').textContent='Καλή προσπάθεια! 😊';else document.getElementById('endMsg').textContent='Δοκίμασε ξανά! 💪'}
function restartGame(){document.getElementById('endScreen').classList.add('hidden');document.getElementById('startScreen').classList.remove('hidden')}
</script>
</body>
</html>
