<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Βρες το Διαφορετικό!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f57c00 0%,#e65100 100%);font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;padding:10px}
.container{max-width:700px;width:100%;background:#fff;border-radius:20px;padding:30px;box-shadow:0 10px 40px rgba(0,0,0,.25);text-align:center}
h1{color:#e65100;font-size:1.8rem;margin-bottom:5px}
h2{color:#f57c00;font-size:1.1rem;margin-bottom:20px;font-weight:400}
.start-btn,.restart-btn{background:linear-gradient(135deg,#f57c00,#e65100);color:#fff;border:none;padding:14px 40px;border-radius:50px;font-size:1.2rem;cursor:pointer;transition:transform .2s;margin-top:15px}
.start-btn:hover,.restart-btn:hover{transform:scale(1.05)}
.score-bar{display:flex;justify-content:space-between;margin-bottom:10px;font-size:.95rem;color:#e65100;font-weight:600}
.grid{display:inline-grid;gap:8px;margin:15px auto;padding:12px;background:#fff3e0;border-radius:15px}
.grid-cell{width:60px;height:60px;display:flex;align-items:center;justify-content:center;font-size:2rem;border-radius:10px;cursor:pointer;transition:all .15s ease;background:#fff;user-select:none;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.grid-cell:hover{transform:scale(1.1);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.grid-cell.correct{background:#c8e6c9;box-shadow:0 0 15px rgba(76,175,80,.5);transform:scale(1.15)}
.grid-cell.wrong{background:#ffcdd2;box-shadow:0 0 15px rgba(244,67,54,.5)}
.timer-bar{width:100%;height:8px;background:#ffe0b2;border-radius:4px;margin:10px 0;overflow:hidden}
.timer-fill{height:100%;background:linear-gradient(90deg,#4CAF50,#FF9800,#f44336);border-radius:4px;transition:width .1s linear}
.feedback{margin-top:10px;font-size:1.1rem;font-weight:600;min-height:1.5em}
.end-screen h1{font-size:1.6rem;margin-bottom:10px}
.end-screen .final-score{font-size:2.5rem;color:#e65100;font-weight:700;margin:10px 0}
.end-screen .stars{font-size:2rem;margin:10px 0}
.hidden{display:none!important}
</style>
<link rel="stylesheet" href="fonts/emoji-font.css">
</head>
<body>
<div class="container" id="app"></div>
<script>
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
const params=new URLSearchParams(window.location.search);
const dataFile=params.get('data');
const app=document.getElementById('app');
let gameData,score,roundNum,totalRounds,roundTimer,timerInterval,timeLeft,answered;

if(!dataFile){
app.innerHTML='<h1>Βρες το Διαφορετικό!</h1><p style="color:#f57c00">Δεν βρέθηκε αρχείο δεδομένων.</p>';
}else{
fetch(dataFile).then(r=>r.json()).then(d=>{gameData=d;showStart()}).catch(()=>{app.innerHTML='<h1>Σφάλμα</h1><p style="color:#f44336">Δεν ήταν δυνατή η φόρτωση των δεδομένων.</p>'});
}

function showStart(){
score=0;roundNum=0;totalRounds=gameData.rounds.length;answered=false;
app.innerHTML='<div><h1>'+esc(gameData.title)+'</h1><h2>'+esc(gameData.subtitle)+'</h2><p style="color:#e65100;margin:10px 0">'+esc(gameData.instructions)+'</p><div style="font-size:3rem;margin:20px 0">🔍</div><button class="start-btn" id="startBtn">Ξεκίνα!</button></div>';
document.getElementById('startBtn').onclick=showGame;
}

function showGame(){
roundNum++;
if(roundNum>totalRounds){showEnd();return}
answered=false;
const round=gameData.rounds[roundNum-1];
const gs=round.gridSize;
const total=gs*gs;
const diffPos=Math.floor(Math.random()*total);
const maxTime=5+gs*2;
timeLeft=maxTime;

app.innerHTML='<div><h1>'+esc(gameData.title)+'</h1><div class="score-bar"><span>Γύρος: '+roundNum+' / '+totalRounds+'</span><span>Σκορ: '+score+'</span></div><div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:100%"></div></div><div class="grid" style="grid-template-columns:repeat('+gs+',60px)" id="grid"></div><div class="feedback" id="feedback"></div></div>';

const grid=document.getElementById('grid');
for(let i=0;i<total;i++){
const cell=document.createElement('div');
cell.className='grid-cell';
if(i===diffPos){
cell.textContent=round.different;
cell.onclick=function(){handleCorrect(cell,round,grid)};
}else{
cell.textContent=round.same;
cell.onclick=function(){handleWrong(cell,round,grid)};
}
grid.appendChild(cell);
}

timerInterval=setInterval(function(){
timeLeft-=0.1;
const pct=Math.max(0,timeLeft/maxTime*100);
const fill=document.getElementById('timerFill');
if(fill)fill.style.width=pct+'%';
if(timeLeft<=0){
clearInterval(timerInterval);
if(!answered){answered=true;handleTimeout(round,grid)}
}
},100);
}

function handleCorrect(cell,round,grid){
if(answered)return;
answered=true;
clearInterval(timerInterval);
cell.classList.add('correct');
score++;
disableGrid(grid);
document.getElementById('feedback').innerHTML='<span style="color:#4CAF50">&#10004; Μπράβο! Το βρήκες!</span>';
setTimeout(showGame,1200);
}

function handleWrong(cell,round,grid){
if(answered)return;
answered=true;
clearInterval(timerInterval);
cell.classList.add('wrong');
disableGrid(grid);
const cells=grid.querySelectorAll('.grid-cell');
const total=cells.length;
const diffPos=findDiffPos(round,cells);
if(diffPos>=0)cells[diffPos].classList.add('correct');
document.getElementById('feedback').innerHTML='<span style="color:#f44336">&#10008; Αυτό δεν ήταν! Ήταν το '+round.different+'</span>';
setTimeout(showGame,1500);
}

function handleTimeout(round,grid){
disableGrid(grid);
const cells=grid.querySelectorAll('.grid-cell');
const diffPos=findDiffPos(round,cells);
if(diffPos>=0)cells[diffPos].classList.add('correct');
document.getElementById('feedback').innerHTML='<span style="color:#f44336">&#9200; Έφυγε ο χρόνος!</span>';
setTimeout(showGame,1500);
}

function findDiffPos(round,cells){
for(let i=0;i<cells.length;i++){
if(cells[i].textContent===round.different)return i;
}
return -1;
}

function disableGrid(grid){
const cells=grid.querySelectorAll('.grid-cell');
cells.forEach(function(c){c.onclick=null;c.style.pointerEvents='none'});
}

function showEnd(){
const pct=Math.round(score/totalRounds*100);
let stars='';
if(pct>=90)stars='⭐⭐⭐';else if(pct>=60)stars='⭐⭐';else if(pct>=30)stars='⭐';
app.innerHTML='<div class="end-screen"><h1>'+esc(gameData.title)+'</h1><div class="stars">'+stars+'</div><div class="final-score">'+score+' / '+totalRounds+'</div><p style="color:#e65100;font-size:1.1rem;margin-bottom:15px">'+(pct>=80?'Εξαιρετικά!':pct>=50?'Μπράβο!':'Συνέχισε!')+'</p><button class="restart-btn" id="restartBtn">Ξαναπαιξε!</button></div>';
document.getElementById('restartBtn').onclick=showStart;
}
</script>
</body>
</html>
