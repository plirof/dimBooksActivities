    { type:"text", text:"Θυμάμαι ότι: η Υπατία και ο Ήρωνας έχουν δημιούργησει μία εργασία για τις καιρικές συνθήκες της Ευρώπης. Έχουν συγκεντρώσει και αναλύουν δεδομένα στο υπολογιστικό φύλλο, τα οποία προέρχονται από τον δικτυακό τόπο «Ο καιρός στην Ευρώπη». Άνοιξε το αρχείο «Μετεωρολογικές μετρήσεις» που αποθηκεύσαμε στο προηγούμενο μάθημα: στη στήλη F καταγράφονται για κάθε πόλη τα καιρικά φαινόμενα που επικρατούν, π.χ. ΑΡΚΕΤΑ ΣΥΝΝΕΦΑ, ΟΜΙΧΛΗ, ΒΡΟΧΗ και άλλα." },

    { type:"list", title:"Παραδείγματα φίλτρων", items:["Με το φίλτρο «ΒΡΟΧΗ» στη στήλη F θα εμφανιστούν μόνο οι γραμμές με τις πόλεις στις οποίες καταγράφεται ΒΡΟΧΗ","Με το φίλτρο «ΒΡΟΧΗ, ΨΙΧΑΛΕΣ» στη στήλη F θα εμφανιστούν οι γραμμές με τις πόλεις που έχουν ΒΡΟΧΗ, καθώς και οι γραμμές με τις πόλεις που έχουν ΨΙΧΑΛΕΣ","Με ένα φίλτρο μπορώ να διαλέξω μία ή περισσότερες τιμές μαζί"] },
    { type:"steps", title:"Ενεργοποιώ το αυτόματο φίλτρο", steps:["① Κάνω κλικ σε ένα κελί της πρώτης γραμμής των δεδομένων — π.χ. στο κελί F1. Συνήθως η πρώτη γραμμή περιέχει τις επικεφαλίδες των στηλών","② Από το μενού «Δεδομένα» επιλέγω «Αυτόματο φίλτρο»","③ Παρατηρώ ότι στο δεξί μέρος των κελιών της πρώτης γραμμής εμφανίζεται ένα βελάκι"] },

    { type:"practice", title:"Βάλε σε κύκλο τη σωστή απάντηση", items:["Με τη χρήση φίλτρου επιλέγουμε: α) να γίνουν αριθμητικές πράξεις στα δεδομένα, β) να αλλάξει η σειρά των γραμμών των δεδομένων σύμφωνα με κριτήριο της επιλογής μας, γ) να εμφανίζονται μόνο οι γραμμές που έχουν τη συγκεκριμένη τιμή ή τιμές της επιλογής μας","Άνοιξε το αρχείο σου και δοκίμασε τα φίλτρα: εντόπισε ποιες πόλεις έχουν ΒΡΟΧΗ και ποιες έχουν είτε ΒΡΟΧΗ είτε ΨΙΧΑΛΕΣ","Δες το βίντεο «Φίλτρα δεδομένων»"] },

  "Θυμάμαι ότι: η Υπατία και ο Ήρωνας έχουν δημιούργησει μία εργασία για τις καιρικές συνθήκες της Ευρώπης. Έχουν συγκεντρώσει και αναλύουν δεδομένα στο υπολογιστικό φύλλο, τα οποία προέρχονται από τον δικτυακό τόπο «Ο καιρός στην Ευρώπη». Άνοιξε το αρχείο «Μετεωρολογικές μετρήσεις» που αποθηκεύσαμε στο προηγούμενο μάθημα: στη στήλη F καταγράφονται για κάθε πόλη τα καιρικά φαινόμενα που επικρατούν, π.χ. ΑΡΚΕΤΑ ΣΥΝΝΕΦΑ, ΟΜΙΧΛΗ, ΒΡΟΧΗ και άλλα.",
