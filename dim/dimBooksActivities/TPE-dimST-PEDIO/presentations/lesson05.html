    { type:"text", text:"Σε αυτό το μάθημα θα φτιάξεις ένα κομπιουτεράκι που κάνει τις τέσσερις αριθμητικές πράξεις. Δημιούργησε ένα νέο έργο στο Scratch. Αν θέλεις, μπορείς να σβήσεις τη γατούλα και να φέρεις στο έργο σου έναν άλλο χαρακτήρα. Δώσε όνομα στον νέο σου χαρακτήρα στον χώρο των αντικειμένων, π.χ. Άκης — Ψηφιακός Βοηθός. Θα προγραμματίσεις τον Άκη να κάνει τις τέσσερις αριθμητικές πράξεις για οποιουσδήποτε δύο αριθμούς του δίνεις." },
    { type:"steps", title:"Οι μεταβλητές και το κυρίως πρόγραμμα", steps:["① Φτιάξε πρώτα τρεις νέες μεταβλητές: «αριθμός 1», «αριθμός 2» και «αποτέλεσμα» — φρόντισε και οι τρεις να έχουν τικ για να εμφανίζονται στη σκηνή","② Φτιάξε το πρόγραμμα του Άκη: ρωτάει τους δύο αριθμούς και, με την τελευταία εντολή «ρώτησε…», ζητά να γράψεις το σύμβολο της πράξης που θέλεις, δηλαδή ένα από τα +, -, *, /","③ Δώσε αρχική τιμή στη μεταβλητή «αποτέλεσμα» στην αρχή του προγράμματος του Άκη"] },
