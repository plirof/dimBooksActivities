<script>
var LESSON = {
  number: 7,
  unit: "Ενότητα 1: Αλγοριθμική – Προγραμματισμός – Ρομποτική",
  slides: [
    { type:"title", title:"Μάθημα 7ο: Επίπεδα δυσκολίας, ηχητικά και γραφικά εφέ" },
    { type:"list", title:"Στο μάθημα αυτό θα μάθεις", items:["Να χρησιμοποιείς επίπεδα δυσκολίας στο παιχνίδι","Να χρησιμοποιείς εμφωλευμένες εντολές επανάληψης","Να χρησιμοποιείς ήχους, συνομιλία και γραφικά για να κάνεις το παιχνίδι σου πιο φιλικό στους παίκτες του"] },
    { type:"concept", text:"Ας δούμε τώρα πώς μπορούμε να κάνουμε το παιχνίδι μας λίγο πιο δύσκολο. Ένας τρόπος με τον οποίο μπορεί να γίνει δυσκολότερο είναι να μεγαλώσουμε το διάστημα στο οποίο βρίσκεται ο μυστικός αριθμός, π.χ. αντί να βρίσκεται ανάμεσα στο 1 και στο 10, θα μπορούσε να βρίσκεται ανάμεσα στο 1 και στο 20. Αν το διάστημα είναι μεγαλύτερο, τότε ο παίκτης μπορεί να χρειαστεί περισσότερες προσπάθειες για να μαντέψει τον αριθμό, άρα το παιχνίδι γίνεται δυσκολότερο." },
    { type:"steps", title:"Επίπεδα δυσκολίας", steps:["① Δημιούργησε μία νέα μεταβλητή και ονόμασέ την «επίπεδο»","② Το παιχνίδι θέλουμε να έχει τρία επίπεδα δυσκολίας, ξεκινώντας από το επίπεδο 1 που είναι το ευκολότερο και φτάνοντας στο 3 που είναι το δυσκολότερο","③ Φτιάξε μία νέα εντολή επανάληψης «επανάλαβε ώσπου»: θέλουμε το παιχνίδι να σταματάει όταν το επίπεδο ξεπεράσει το 3, δηλαδή γίνει > 3","④ Όρισε το επίπεδο να είναι 1 ακριβώς πριν από την εντολή επανάληψης και να αυξάνεται κατά 1 μέσα στην εντολή επανάληψης"] },
    { type:"concept", text:"Θέλουμε: στο επίπεδο 1 ο μυστικός αριθμός να είναι από το 1 μέχρι το 10 = 1 × 10, στο επίπεδο 2 από το 1 μέχρι το 20 = 2 × 10, και στο επίπεδο 3 από το 1 μέχρι το 30 = 3 × 10." },
    { type:"steps", title:"Ο μυστικός αριθμός ανά επίπεδο", steps:["① Φτιάξε μία αριθμητική πράξη πολλαπλασιασμού μεταξύ της μεταβλητής «επίπεδο» και του αριθμού 10","② Χρησιμοποίησέ τη στο δεύτερο κυκλάκι της εντολής «επίλεξε τυχαίο αριθμό», που γίνεται: επίλεξε τυχαίο αριθμό 1 έως (επίπεδο × 10)","③ Άλλαξε και το περιεχόμενο της εντολής «ρώτησε…» με τον ίδιο πολλαπλασιασμό, ώστε ο παίκτης ή η παίκτρια να ενημερώνεται για το διάστημα στον οποίο βρίσκεται ο αριθμός","④ Βάλε όλο το πρόγραμμα του παιχνιδιού σου μέσα στην εντολή «επανάλαβε ώσπου» και δοκίμασε να παίξεις κάνοντας κλικ πάνω του"] },
    { type:"concept", text:"Παρατήρησε ότι στο πρόγραμμα αυτό υπάρχουν δύο εντολές επανάληψης «επανάλαβε ώσπου…» και η δεύτερη βρίσκεται μέσα στην πρώτη και όχι μετά την πρώτη. Στην περίπτωση αυτή λέμε ότι η δεύτερη είναι εμφωλευμένη στην πρώτη. Οι εμφωλευμένες εντολές χρησιμοποιούνται συχνά στον προγραμματισμό και είναι πάρα πολύ χρήσιμες." },
    { type:"concept", text:"Τώρα που έφτιαξες τον βασικό κώδικα του παιχνιδιού, ήρθε η ώρα να βάλεις και μερικά εφέ για να το κάνεις πιο ευχάριστο και πιο εντυπωσιακό. Υπάρχουν εντολές που μπορείς να προσθέσεις στην αρχή του παιχνιδιού σου, και μερικές που μπορείς να προσθέσεις πριν από το τέλος της πρώτης εντολής επανάληψης, δηλαδή εκεί ακριβώς όπου αλλάζει το επίπεδο του παιχνιδιού." },
    { type:"text", text:"Η αλλαγή της ενδυμασίας του χαρακτήρα και το παίξιμο του ήχου γίνονται κάθε φορά που αλλάζει το επίπεδο του παιχνιδιού, ώστε ο παίκτης ή η παίκτρια να καταλαβαίνει άμεσα την αλλαγή επιπέδου. Επιπλέον, οι εντολές εξόδου τύπου «πες …» του προσφέρουν την απαραίτητη καθοδήγηση: έτσι ο χαρακτήρας μοιάζει με πραγματικό συμπαίκτη στο παιχνίδι." },
    { type:"concept", text:"Όταν δημιουργείς ένα πρόγραμμα, εκτός από το να λειτουργεί σωστά, πρέπει να φροντίζεις ώστε να είναι και εύκολο στη χρήση από ανθρώπους που δεν γνωρίζουν πώς έχει φτιαχτεί. Για τον λόγο αυτό, είναι καλό να παρέχεις οδηγίες και να προσθέτεις στοιχεία, όπως οι ήχοι, που βελτιώνουν την αλληλεπίδραση με το πρόγραμμα." },
    { type:"steps", title:"Τελευταίες πινελιές", steps:["① Τοποθέτησε το συμβάν της πράσινης σημαίας στην κορυφή του προγράμματός σου","② Ακριβώς μετά την εντολή της πράσινης σημαίας βάλε την εντολή που μηδενίζει τις προσπάθειες του παίκτη στην αρχή του παιχνιδιού","③ Δοκίμασε να παίξεις το παιχνίδι κάνοντας κλικ πάνω στο πρόγραμμά σου — το πρόγραμμα που έφτιαξες είναι δύσκολο και μεγάλο, μπράβο σου!"] },
    { type:"practice", title:"Δοκίμασε", items:["Παίξε το παιχνίδι σου και δοκίμασε να φτάσεις στο επίπεδο 3, παρατηρώντας τα εφέ της αλλαγής επιπέδου","Δες το βίντεο «Επίπεδα δυσκολίας, ηχητικά και γραφικά εφέ»","Παίξε το παιχνίδι «Ο υπολογιστής μαντεύει τον αριθμό»"] },
    { type:"assessment", check:"Μπορώ να χρησιμοποιώ επίπεδα δυσκολίας, εμφωλευμένες εντολές επανάληψης και ήχους, συνομιλία και γραφικά για να κάνω το παιχνίδι μου πιο φιλικό στους παίκτες του", end:"Μπράβο! ✦ Τέλος ✦" }
  ]
};

// Static array read by pregen.AppImage. Keep in sync with LESSON.slides above.
var slideTexts = [
  "Ενότητα 1: Αλγοριθμική – Προγραμματισμός – Ρομποτική. Μάθημα 7ο: Επίπεδα δυσκολίας, ηχητικά και γραφικά εφέ",
  "Στο μάθημα αυτό θα μάθεις. Να χρησιμοποιείς επίπεδα δυσκολίας στο παιχνίδι. Να χρησιμοποιείς εμφωλευμένες εντολές επανάληψης. Να χρησιμοποιείς ήχους, συνομιλία και γραφικά για να κάνεις το παιχνίδι σου πιο φιλικό στους παίκτες του",
  "Ας δούμε τώρα πώς μπορούμε να κάνουμε το παιχνίδι μας λίγο πιο δύσκολο. Ένας τρόπος με τον οποίο μπορεί να γίνει δυσκολότερο είναι να μεγαλώσουμε το διάστημα στο οποίο βρίσκεται ο μυστικός αριθμός, π.χ. αντί να βρίσκεται ανάμεσα στο 1 και στο 10, θα μπορούσε να βρίσκεται ανάμεσα στο 1 και στο 20. Αν το διάστημα είναι μεγαλύτερο, τότε ο παίκτης μπορεί να χρειαστεί περισσότερες προσπάθειες για να μαντέψει τον αριθμό, άρα το παιχνίδι γίνεται δυσκολότερο.",
  "Επίπεδα δυσκολίας. ① Δημιούργησε μία νέα μεταβλητή και ονόμασέ την «επίπεδο». ② Το παιχνίδι θέλουμε να έχει τρία επίπεδα δυσκολίας, ξεκινώντας από το επίπεδο 1 που είναι το ευκολότερο και φτάνοντας στο 3 που είναι το δυσκολότερο. ③ Φτιάξε μία νέα εντολή επανάληψης «επανάλαβε ώσπου»: θέλουμε το παιχνίδι να σταματάει όταν το επίπεδο ξεπεράσει το 3, δηλαδή γίνει > 3. ④ Όρισε το επίπεδο να είναι 1 ακριβώς πριν από την εντολή επανάληψης και να αυξάνεται κατά 1 μέσα στην εντολή επανάληψης",
  "Θέλουμε: στο επίπεδο 1 ο μυστικός αριθμός να είναι από το 1 μέχρι το 10 = 1 × 10, στο επίπεδο 2 από το 1 μέχρι το 20 = 2 × 10, και στο επίπεδο 3 από το 1 μέχρι το 30 = 3 × 10.",
  "Ο μυστικός αριθμός ανά επίπεδο. ① Φτιάξε μία αριθμητική πράξη πολλαπλασιασμού μεταξύ της μεταβλητής «επίπεδο» και του αριθμού 10. ② Χρησιμοποίησέ τη στο δεύτερο κυκλάκι της εντολής «επίλεξε τυχαίο αριθμό», που γίνεται: επίλεξε τυχαίο αριθμό 1 έως (επίπεδο × 10). ③ Άλλαξε και το περιεχόμενο της εντολής «ρώτησε…» με τον ίδιο πολλαπλασιασμό, ώστε ο παίκτης ή η παίκτρια να ενημερώνεται για το διάστημα στον οποίο βρίσκεται ο αριθμός. ④ Βάλε όλο το πρόγραμμα του παιχνιδιού σου μέσα στην εντολή «επανάλαβε ώσπου» και δοκίμασε να παίξεις κάνοντας κλικ πάνω του",
  "Παρατήρησε ότι στο πρόγραμμα αυτό υπάρχουν δύο εντολές επανάληψης «επανάλαβε ώσπου…» και η δεύτερη βρίσκεται μέσα στην πρώτη και όχι μετά την πρώτη. Στην περίπτωση αυτή λέμε ότι η δεύτερη είναι εμφωλευμένη στην πρώτη. Οι εμφωλευμένες εντολές χρησιμοποιούνται συχνά στον προγραμματισμό και είναι πάρα πολύ χρήσιμες.",
  "Τώρα που έφτιαξες τον βασικό κώδικα του παιχνιδιού, ήρθε η ώρα να βάλεις και μερικά εφέ για να το κάνεις πιο ευχάριστο και πιο εντυπωσιακό. Υπάρχουν εντολές που μπορείς να προσθέσεις στην αρχή του παιχνιδιού σου, και μερικές που μπορείς να προσθέσεις πριν από το τέλος της πρώτης εντολής επανάληψης, δηλαδή εκεί ακριβώς όπου αλλάζει το επίπεδο του παιχνιδιού.",
  "Η αλλαγή της ενδυμασίας του χαρακτήρα και το παίξιμο του ήχου γίνονται κάθε φορά που αλλάζει το επίπεδο του παιχνιδιού, ώστε ο παίκτης ή η παίκτρια να καταλαβαίνει άμεσα την αλλαγή επιπέδου. Επιπλέον, οι εντολές εξόδου τύπου «πες …» του προσφέρουν την απαραίτητη καθοδήγηση: έτσι ο χαρακτήρας μοιάζει με πραγματικό συμπαίκτη στο παιχνίδι.",
  "Όταν δημιουργείς ένα πρόγραμμα, εκτός από το να λειτουργεί σωστά, πρέπει να φροντίζεις ώστε να είναι και εύκολο στη χρήση από ανθρώπους που δεν γνωρίζουν πώς έχει φτιαχτεί. Για τον λόγο αυτό, είναι καλό να παρέχεις οδηγίες και να προσθέτεις στοιχεία, όπως οι ήχοι, που βελτιώνουν την αλληλεπίδραση με το πρόγραμμα.",
  "Τελευταίες πινελιές. ① Τοποθέτησε το συμβάν της πράσινης σημαίας στην κορυφή του προγράμματός σου. ② Ακριβώς μετά την εντολή της πράσινης σημαίας βάλε την εντολή που μηδενίζει τις προσπάθειες του παίκτη στην αρχή του παιχνιδιού. ③ Δοκίμασε να παίξεις το παιχνίδι κάνοντας κλικ πάνω στο πρόγραμμά σου — το πρόγραμμα που έφτιαξες είναι δύσκολο και μεγάλο, μπράβο σου!",
  "Δοκίμασε. Παίξε το παιχνίδι σου και δοκίμασε να φτάσεις στο επίπεδο 3, παρατηρώντας τα εφέ της αλλαγής επιπέδου. Δες το βίντεο «Επίπεδα δυσκολίας, ηχητικά και γραφικά εφέ». Παίξε το παιχνίδι «Ο υπολογιστής μαντεύει τον αριθμό»",
  "Μπορώ να χρησιμοποιώ επίπεδα δυσκολίας, εμφωλευμένες εντολές επανάληψης και ήχους, συνομιλία και γραφικά για να κάνω το παιχνίδι μου πιο φιλικό στους παίκτες του. Μπράβο! Τέλος"
];
</script>
