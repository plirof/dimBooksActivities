<!DOCTYPE html>
<!--
  slide_TTS_template.html — minimal template for a TPE-dim lesson presentation.

  Shared CSS + runtime JS live OUTSIDE this file (loaded at the bottom); each
  lesson file holds ONLY its own data (LESSON + slideTexts) plus this skeleton.

  To create lesson NN:

    1. Copy this file to  TPE-dimX-PEDIO/presentations/lessonNN.html
    2. Edit LESSON below (number, unit, slides[]).
       First slide MUST be type:"title", last slide MUST be type:"assessment".
    3. Keep slideTexts[] in sync with LESSON.slides — pregen.AppImage reads it.
       Entries mirror getSlideText() in tts/scripts/presentation.js:
         title       -> unit + ". " + title (+ ". " + sub if present)
         text        -> text
         steps       -> (title? title+". ":"") + steps.join(". ")
         list        -> (title? title+". ":"") + items.join(". ")
         concept     -> text
         practice    -> (title||"Συζητήστε") + ". " + items.join(". ")
         assessment  -> check + ". " + end   (✦/✧ stripped; ". Τέλος" if no end)
   4. Generate MP3s:
   **IMPORTANT: If updating an existing presentation, delete old MP3s first:**
   rm TPE-dimX-PEDIO/presentations/audio/lessonNN/*.mp3

   ./tts/pregen.AppImage TPE-dimX-PEDIO/presentations/lessonNN.html \
                                 TPE-dimX-PEDIO/presentations/audio/lessonNN
   5. Open lessonNN.html in a browser. URL params: ?speed=0.7  ?mode=manual

  Do NOT re-inline CSS or runtime JS here — edit tts/scripts/presentation.css
  or tts/scripts/presentation.js instead (changes apply to every lesson).
-->
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Παρουσίαση</title>
<link rel="stylesheet" href="../../tts/scripts/presentation.css">
</head>
<body>

<!-- ===== BEGIN EDIT THIS SECTION ===== -->
<script>
var LESSON = {
  number: 8,
  unit: "Ενότητα 1: Αλγοριθμική – Προγραμματισμός – Ρομποτική",
  slides: [
    { type:"title", title:"Μάθημα 8ο: Αισθητήρες φωτός – Μέρα ή νύχτα" },
    { type:"list", title:"Στόχοι μαθήματος", items:["Τι είναι οι αισθητήρες και πώς χρησιμοποιούνται από τα ρομπότ και τους μικροελεγκτές","Πώς μπορείς να χρησιμοποιήσεις τον αισθητήρα φωτός του micro:bit","Να δίνω παραδείγματα χρήσης των αισθητήρων στην καθημερινή μου ζωή","Να φτιάχνω ένα πρόγραμμα που μου δείχνει αν είναι μέρα ή νύχτα"] },
    { type:"concept", text:"Τα ρομπότ και οι μικροελεγκτές, όπως το micro:bit, είναι εξοπλισμένα με αισθητήρες. Οι αισθητήρες είναι μικρές ενσωματωμένες συσκευές που μπορούν να «αισθάνονται» τι συμβαίνει στο περιβάλλον γύρω τους και να μεταφέρουν αυτή την πληροφορία στο ρομπότ ή στον μικροελεγκτή, ώστε να την επεξεργαστεί και να αντιδράσει ανάλογα." },
    { type:"list", title:"Τύποι αισθητήρων", items:["Αισθητήρες φωτός που ανιχνεύουν το φως","Αισθητήρες ήχου που ανιχνεύουν τον ήχο","Αισθητήρες θερμοκρασίας που ανιχνεύουν τη θερμοκρασία","Αισθητήρες απόστασης που ανιχνεύουν αντικείμενα και πόσο κοντά βρίσκονται","Αισθητήρες χρώματος που μπορούν να αναγνωρίσουν χρώματα"] },
    { type:"concept", text:"Τέτοιοι αισθητήρες χρησιμοποιούνται ευρέως και στην καθημερινή μας ζωή, όπως στους αυτόματους διακόπτες φώτων που ενεργοποιούνται όταν ανιχνεύσουν κίνηση, ή στα κινητά τηλέφωνα που ρυθμίζουν αυτόματα τη φωτεινότητα της οθόνης ανάλογα με το φως του περιβάλλοντος." },
    { type:"concept", text:"Οι φωτοδίοδοι του micro:bit δεν λειτουργούν μόνο ως έξοδος για το micro:bit αλλά και ως είσοδος, μετρώντας την ποσότητα του φωτός που πέφτει πάνω τους, είναι δηλαδή και αισθητήρες φωτός. Με τη βοήθεια των αισθητήρων αυτών, η συμπεριφορά του micro:bit μπορεί να προσαρμόζεται ανάλογα με το πόσο σκοτεινός ή φωτεινός είναι ο χώρος στον οποίο βρίσκεται." },
    { type:"list", title:"Βήματα για να δημιούργησεις το πρόγραμμα", items:["Επισκέψου την makecode.microbit.org και δημιούργησε ένα νέο έργο","Πέταξε την εντολή «κατά την έναρξη» και φέρε την εντολή «για πάντα»","Βρες την εντολή «εμφάνισε αριθμό» και βάλε τη μεταβλητή «επίπεδο φωτισμού» μέσα στο κυκλάκι","Δες το αποτέλεσμα στον προσομοιωτή αλλάζοντας το επίπεδο φωτός"] },
    { type:"concept", text:"Θα χρειαστείς μία εντολή επιλογής «εάν… αλλιώς» την οποία θα βρεις στην κατηγορία εντολών Λογική, έτσι ώστε ο μικροελεγκτής σου να αποφασίζει πότε πρέπει να βγάλει μήνυμα νύχτας ή μέρας. Βάλε την εντολή επιλογής μέσα στην εντολή επανάληψης «για πάντα»." },
    { type:"concept", text:"Βάλε τη μεταβλητή «επίπεδο φωτισμού» στο πρώτο κυκλάκι και στο δεύτερο γράψε την τιμή 100. Αυτό σημαίνει ότι, όταν ο αισθητήρας φωτός μετρήσει φως μικρότερο από 100 μονάδες, το micro:bit θα αλλάξει τη συμπεριφορά του. Για τιμές < 100 έχουμε σκοτάδι δηλαδή νύχτα, ενώ για τιμές >= 100 έχουμε φως, δηλαδή μέρα." },
    { type:"practice", title:"Δοκίμασε το πρόγραμμά σου", items:["Δοκίμασε το πρόγραμμά σου στον προσομοιωτή αλλάζοντας το επίπεδο φωτός","Κατέβασε το πρόγραμμά σου στο micro:bit","Μετακινήσου σε διάφορα σημεία της αίθουσας για να το δεις να αλλάζει εικονίδιο","Μπορείς ακόμα να σβήσεις τα φώτα στο δωμάτιο ή να δημιούργησεις σκιά με το χέρι σου"] },
    { type:"assessment", check:"Μπορώ να χρησιμοποιώ τον αισθητήρα φωτός του micro:bit και να φτιάχνω πρόγραμμα που μου δείχνει αν είναι μέρα ή νύχτα", end:"Μπράβο! ✦ Τέλος ✦" }
  ]
};

// Static array read by pregen.AppImage. Keep in sync with LESSON.slides above.
var slideTexts = [
  "Ενότητα 1: Αλγοριθμική – Προγραμματισμός – Ρομποτική. Μάθημα 8ο: Αισθητήρες φωτός – Μέρα ή νύχτα",
  "Στόχοι μαθήματος. Τι είναι οι αισθητήρες και πώς χρησιμοποιούνται από τα ρομπότ και τους μικροελεγκτές. Πώς μπορείς να χρησιμοποιήσεις τον αισθητήρα φωτός του micro:bit. Να δίνω παραδείγματα χρήσης των αισθητήρων στην καθημερινή μου ζωή. Να φτιάχνω ένα πρόγραμμα που μου δείχνει αν είναι μέρα ή νύχτα",
  "Τα ρομπότ και οι μικροελεγκτές, όπως το micro:bit, είναι εξοπλισμένα με αισθητήρες. Οι αισθητήρες είναι μικρές ενσωματωμένες συσκευές που μπορούν να «αισθάνονται» τι συμβαίνει στο περιβάλλον γύρω τους και να μεταφέρουν αυτή την πληροφορία στο ρομπότ ή στον μικροελεγκτή, ώστε να την επεξεργαστεί και να αντιδράσει ανάλογα.",
  "Τύποι αισθητήρων. Αισθητήρες φωτός που ανιχνεύουν το φως. Αισθητήρες ήχου που ανιχνεύουν τον ήχο. Αισθητήρες θερμοκρασίας που ανιχνεύουν τη θερμοκρασία. Αισθητήρες απόστασης που ανιχνεύουν αντικείμενα και πόσο κοντά βρίσκονται. Αισθητήρες χρώματος που μπορούν να αναγνωρίσουν χρώματα",
  "Τέτοιοι αισθητήρες χρησιμοποιούνται ευρέως και στην καθημερινή μας ζωή, όπως στους αυτόματους διακόπτες φώτων που ενεργοποιούνται όταν ανιχνεύσουν κίνηση, ή στα κινητά τηλέφωνα που ρυθμίζουν αυτόματα τη φωτεινότητα της οθόνης ανάλογα με το φως του περιβάλλοντος.",
  "Οι φωτοδίοδοι του micro:bit δεν λειτουργούν μόνο ως έξοδος για το micro:bit αλλά και ως είσοδος, μετρώντας την ποσότητα του φωτός που πέφτει πάνω τους, είναι δηλαδή και αισθητήρες φωτός. Με τη βοήθεια των αισθητήρων αυτών, η συμπεριφορά του micro:bit μπορεί να προσαρμόζεται ανάλογα με το πόσο σκοτεινός ή φωτεινός είναι ο χώρος στον οποίο βρίσκεται.",
  "Βήματα για να δημιούργησεις το πρόγραμμα. Επισκέψου την makecode.microbit.org και δημιούργησε ένα νέο έργο. Πέταξε την εντολή «κατά την έναρξη» και φέρε την εντολή «για πάντα». Βρες την εντολή «εμφάνισε αριθμό» και βάλε τη μεταβλητή «επίπεδο φωτισμού» μέσα στο κυκλάκι. Δες το αποτέλεσμα στον προσομοιωτή αλλάζοντας το επίπεδο φωτός",
  "Θα χρειαστείς μία εντολή επιλογής «εάν… αλλιώς» την οποία θα βρεις στην κατηγορία εντολών Λογική, έτσι ώστε ο μικροελεγκτής σου να αποφασίζει πότε πρέπει να βγάλει μήνυμα νύχτας ή μέρας. Βάλε την εντολή επιλογής μέσα στην εντολή επανάληψης «για πάντα».",
  "Βάλε τη μεταβλητή «επίπεδο φωτισμού» στο πρώτο κυκλάκι και στο δεύτερο γράψε την τιμή 100. Αυτό σημαίνει ότι, όταν ο αισθητήρας φωτός μετρήσει φως μικρότερο από 100 μονάδες, το micro:bit θα αλλάξει τη συμπεριφορά του. Για τιμές < 100 έχουμε σκοτάδι δηλαδή νύχτα, ενώ για τιμές >= 100 έχουμε φως, δηλαδή μέρα.",
  "Δοκίμασε το πρόγραμμά σου. Δοκίμασε το πρόγραμμά σου στον προσομοιωτή αλλάζοντας το επίπεδο φωτός. Κατέβασε το πρόγραμμά σου στο micro:bit. Μετακινήσου σε διάφορα σημεία της αίθουσας για να το δεις να αλλάζει εικονίδιο. Μπορείς ακόμα να σβήσεις τα φώτα στο δωμάτιο ή να δημιούργησεις σκιά με το χέρι σου",
  "Μπορώ να χρησιμοποιώ τον αισθητήρα φωτός του micro:bit και να φτιάχνω πρόγραμμα που μου δείχνει αν είναι μέρα ή νύχτα. Μπράβο! Τέλος"
];
</script>
<!-- ===== END EDIT SECTION ===== -->

<div id="slides"></div>
<div id="speedBadge"></div>
<div id="dots"></div>

<div id="controls">
  <button id="prevBtn" onclick="navigate(-1)">◀</button>
  <span id="counter"></span>
  <button id="nextBtn" onclick="navigate(1)">▶</button>
  <button id="playBtn" onclick="togglePlay()">⏸</button>
  <button id="muteBtn" onclick="toggleMute()">🔊</button>
</div>

<script src="../../tts/scripts/tts.js"></script>
<script src="../../tts/scripts/presentation.js"></script>
</body>
</html>
