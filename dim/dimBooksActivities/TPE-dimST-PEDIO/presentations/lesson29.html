    { type:"title", title:"Μάθημα 29ο: Προσωπικά δεδομένα και ΓΚΠΔ/GDPR – Δυσλειτουργικές διαδικτυακές συμπεριφορές" },
    { type:"list", title:"Στο μάθημα αυτό θα μάθεις", items:["Να γνωρίζεις τα προσωπικά δεδομένα και τα βασικά χαρακτηριστικά του Γενικού Κανονισμού για την Προστασία Δεδομένων (ΓΚΠΔ/GDPR) της Ευρωπαϊκής Ένωσης","Να προσδιορίζεις τις δυσλειτουργικές διαδικτυακές συμπεριφορές (εξάρτηση στο διαδίκτυο, διαδικτυακός εκφοβισμός και άλλα) και τρόπους αντιμετώπισης"] },
    { type:"concept", text:"Προσωπικά δεδομένα είναι οι πληροφορίες που αναφέρονται σε σένα, όπως το όνομά σου, η διεύθυνσή σου, ο αριθμός του τηλεφώνου σου, ο αριθμός ταυτότητας, τα δεδομένα της υγείας σου και άλλα που μπορούν να σε αναγνωρίσουν. Η προστασία τους είναι σημαντική για την ιδιωτικότητά σου." },
    { type:"concept", text:"Η χρήση του διαδικτύου συνδέεται στενά με τα προσωπικά δεδομένα και την ασφάλειά μας. Καθώς δημιουργείς λογαριασμούς, στέλνεις μηνύματα ή ανεβάζεις φωτογραφίες, ίσως μοιράζεσαι πληροφορίες που μπορούν να χρησιμοποιηθούν χωρίς την άδειά σου. Κακόβουλοι χρήστες μπορεί να προσπαθήσουν να σε εξαπατήσουν ή να αποκτήσουν πρόσβαση στα δεδομένα σου. Γι' αυτό είναι σημαντικό να είσαι προσεκτικός με ό,τι κοινοποιείς και να προστατεύεις την ιδιωτικότητά σου στα διαδικτυακά περιβάλλοντα." },
