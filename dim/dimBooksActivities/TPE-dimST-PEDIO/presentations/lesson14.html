    { type:"title", title:"Μάθημα 14ο: Διασύνδεση συσκευών στο διαδίκτυο: Πάροχοι και πρωτόκολλα" },
    { type:"list", title:"Στο μάθημα αυτό θα μάθεις", items:["Να αναγνωρίζεις ότι η διασύνδεση των συσκευών στο διαδίκτυο επιτυγχάνεται μέσω διαφορετικών παρόχων","Να διακρίνεις τα χαρακτηριστικά σύνδεσης στο διαδίκτυο (πάροχος, ταχύτητα, μονάδες μέτρησης)","Να περιγράφεις την έννοια και τη συμβολή των πρωτοκόλλων επικοινωνίας στη δικτύωση υπολογιστικών συσκευών","Να περιγράφεις με απλό τρόπο τη φυσική διεύθυνση μίας συσκευής σε δίκτυο υπολογιστών (IP, MAC address)"] },
    { type:"text", text:"Θυμάμαι ότι: σε ένα δίκτυο μπορεί να υπάρχει σύνδεση περισσότερων συσκευών και υπολογιστών. Τα δεδομένα κυκλοφορούν μέσα στο δίκτυο και γι’ αυτό χρειάζονται κάποιοι κανόνες επικοινωνίας." },
    { type:"concept", text:"Ο πάροχος είναι η εταιρεία που παρέχει τις υπηρεσίες και την υποδομή για να συνδεθώ στο διαδίκτυο. Απλά, είναι ο «δρόμος» μέσω του οποίου μπορώ να φτάσω στο διαδίκτυο. Η διασύνδεση των συσκευών στο διαδίκτυο επιτυγχάνεται μέσω διαφορετικών παρόχων: οι πάροχοι μου προσφέρουν την υποδομή και τις υπηρεσίες που επιτρέπουν στις συσκευές να συνδεθούν στο διαδίκτυο." },
    { type:"list", title:"Ποιοι είναι οι πάροχοι;", items:["Εταιρείες τηλεπικοινωνιών με πάροχους καλωδιακής σύνδεσης","Πάροχοι DSL","Πάροχοι οπτικής ίνας","Πάροχοι ασύρματων δικτύων, όπως οι πάροχοι κινητής τηλεφωνίας","Μέσω αυτών των παρόχων οι συσκευές μου συνδέονται στο διαδίκτυο για να αποκτήσω πρόσβαση σε διάφορες υπηρεσίες και πληροφορίες"] },
    { type:"list", title:"Μονάδες μέτρησης που χρησιμοποιεί ένας πάροχος", items:["Ταχύτητα: μετριέται συνήθως σε Mbps (megabits ανά δευτερόλεπτο) ή Gbps (gigabits ανά δευτερόλεπτο) και αναφέρεται στην ταχύτητα μεταφοράς δεδομένων που δίνεται από τον πάροχο","Χωρητικότητα: ορισμένοι πάροχοι επιβάλλουν περιορισμούς στον όγκο δεδομένων που μεταφέρεις κάθε μήνα — η μέτρηση γίνεται συνήθως σε GB (gigabytes) ή TB (terabytes)","Χρόνος ανταπόκρισης: ο χρόνος που χρειάζονται τα δεδομένα για να πάνε από τη συσκευή σου στον διακομιστή και πίσω — μετριέται συνήθως σε milliseconds (χιλιοστά του δευτερολέπτου)","Αυτές οι μονάδες βοηθούν τους χρήστες να κατανοήσουν τις υπηρεσίες και τους περιορισμούς που προσφέρει ο πάροχος διαδικτύου"] },
    { type:"concept", text:"Τι είναι ένα πρωτόκολλο επικοινωνίας; Τα πρωτόκολλα επικοινωνίας είναι όπως η γλώσσα που μιλούν οι υπολογιστές σε ένα δίκτυο. Βοηθούν τις συσκευές να επικοινωνήσουν με αξιοπιστία και ασφάλεια, καθιστώντας τη δικτύωση υπολογιστικών συσκευών δυνατή και αποτελεσματική." },
