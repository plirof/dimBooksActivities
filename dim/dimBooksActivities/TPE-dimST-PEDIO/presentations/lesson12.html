<!DOCTYPE html>
<!--
  slide_TTS_template.html — minimal template for a TPE-dim lesson presentation.

  Shared CSS + runtime JS live OUTSIDE this file (loaded at the bottom); each
  lesson file holds ONLY its own data (LESSON + slideTexts) plus this skeleton.

  To create lesson NN:

    1. Copy this file to  TPE-dimX-PEDIO/presentations/lessonNN.html
    2. Edit LESSON below (number, unit, slides[]).
       First slide MUST be type:"title", last slide MUST be type:"assessment".
    3. Keep slideTexts[] in sync with LESSON.slides — pregen.AppImage reads it.
       Entries mirror getSlideText() in tts/scripts/presentation.js:
         title       -> unit + ". " + title (+ ". " + sub if present)
         text        -> text
         steps       -> (title? title+". ":"") + steps.join(". ")
         list        -> (title? title+". ":"") + items.join(". ")
         concept     -> text
         practice    -> (title||"Συζητήστε") + ". " + items.join(". ")
         assessment  -> check + ". " + end   (✦/✧ stripped; ". Τέλος" if no end)
   4. Generate MP3s:
   **IMPORTANT: If updating an existing presentation, delete old MP3s first:**
   rm TPE-dimX-PEDIO/presentations/audio/lessonNN/*.mp3

   ./tts/pregen.AppImage TPE-dimX-PEDIO/presentations/lessonNN.html \
                                 TPE-dimX-PEDIO/presentations/audio/lessonNN
   5. Open lessonNN.html in a browser. URL params: ?speed=0.7  ?mode=manual

  Do NOT re-inline CSS or runtime JS here — edit tts/scripts/presentation.css
  or tts/scripts/presentation.js instead (changes apply to every lesson).
-->
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Παρουσίαση</title>
<link rel="stylesheet" href="../../tts/scripts/presentation.css">
</head>
<body>

<!-- ===== BEGIN EDIT THIS SECTION ===== -->
<script>
var LESSON = {
  number: 12,
  unit: "Ενότητα 2: Υπολογιστικά συστήματα – Ψηφιακές συσκευές – Δίκτυα",
  slides: [
    { type:"title", title:"Μάθημα 12ο: Το υλικό του υπολογιστή και τα χαρακτηριστικά του" },
    { type:"concept", text:"Η απόδοση του υπολογιστή εξαρτάται κυρίως από την ταχύτητα του επεξεργαστή και το μέγεθος της μνήμης. Επίσης, από το μέγεθος και το είδος του δίσκου αποθήκευσης." },
    { type:"concept", text:"Ο επεξεργαστής είναι το πιο σημαντικό εξάρτημα που κάνει την επεξεργασία δεδομένων. Η ταχύτητά του, η οποία μετριέται σε GHz, επηρεάζει σημαντικά την απόδοση του υπολογιστή." },
    { type:"concept", text:"Η μνήμη αποθηκεύει οτιδήποτε χρησιμοποιεί ο επεξεργαστής. Σβήνεται το περιεχόμενό της όταν τερματίζεται η λειτουργία του υπολογιστή. Η χωρητικότητά της, που μετριέται σε GB, επηρεάζει σημαντικά την απόδοση." },

    { type:"practice", title:"Συζητήστε", items:["Ποια εξαρτήματα επηρεάζουν περισσότερο την απόδοση του υπολογιστή;","Ποια είναι η διαφορά μεταξύ HDD και SSD;","Πώς μπορούμε να δούμε τα τεχνικά χαρακτηριστικά του υπολογιστή;"] },
    { type:"assessment", check:"Μπορώ να περιγράφω τα βασικά στοιχεία του υλικού του υπολογιστή και τα χαρακτηριστικά τους", end:"Μπράβο! ✦ Τέλος ✦" }
  ]

// Static array read by pregen.AppImage. Keep in sync with LESSON.slides above.
var slideTexts = [
  "Ενότητα 2: Υπολογιστικά συστήματα – Ψηφιακές συσκευές – Δίκτυα. Μάθημα 12ο: Το υλικό του υπολογιστή και τα χαρακτηριστικά του",
  "Η απόδοση του υπολογιστή εξαρτάται κυρίως από την ταχύτητα του επεξεργαστή και το μέγεθος της μνήμης. Επίσης, από το μέγεθος και το είδος του δίσκου αποθήκευσης.",
  "Ο επεξεργαστής είναι το πιο σημαντικό εξάρτημα που κάνει την επεξεργασία δεδομένων. Η ταχύτητά του, η οποία μετριέται σε GHz, επηρεάζει σημαντικά την απόδοση του υπολογιστή.",
  "Η μνήμη αποθηκεύει οτιδήποτε χρησιμοποιεί ο επεξεργαστής. Σβήνεται το περιεχόμενό της όταν τερματίζεται η λειτουργία του υπολογιστή. Η χωρητικότητά της, που μετριέται σε GB, επηρεάζει σημαντικά την απόδοση.",
  "Ο δίσκος αποθήκευσης αποθηκεύει με μόνιμο τρόπο το λογισμικό και τα αρχεία που χρησιμοποιούμε. Η τεχνολογία SSD είναι ταχύτερη από την τεχνολογία HDD και επηρεάζει την απόδοση του υπολογιστή.",
  "Στον υπολογιστή γραφείου υπάρχει μία μεγάλη πλακέτα, η μητρική πλακέτα, πάνω στην οποία τοποθετούνται όλα τα εσωτερικά εξαρτήματα και υπάρχουν οι θύρες σύνδεσης.",
  "Σημαντικά χαρακτηριστικά της οθόνης είναι το μέγεθος, που μετριέται σε ίντσες, η ανάλυση, που αφορά τα pixel, και ο ρυθμός ανανέωσης, που μετριέται σε Hz. Η λειτουργία της ελέγχεται από την κάρτα γραφικών.",
  "Η ανάλυση της κάμερας επηρεάζει την ποιότητα των φωτογραφιών και των βίντεο. Μετριέται σε pixel. Μπορεί να είναι ενσωματωμένη ή να συνδέεται εξωτερικά σε μία θύρα του υπολογιστή.",
  "Για τους υπολογιστές με μπαταρία, η αυτονομία της μπαταρίας και η ταχύτητα φόρτισης είναι σημαντικά. Το βάρος και η διάρκεια της μπαταρίας έχουν σημασία για φορητές συσκευές.",
  "Μπορούμε εύκολα να δούμε τα τεχνικά χαρακτηριστικά του υπολογιστή μας μέσω του λειτουργικού συστήματος, χρησιμοποιώντας την εφαρμογή «Ρυθμίσεις» ή «Κέντρο ελέγχου».",
  "Βασικά εξαρτήματα και μονάδες μέτρησης. Επεξεργαστής: GHz. Μνήμη και δίσκος αποθήκευσης: GB ή TB. Ανάλυση οθόνης: pixel (π.χ. 1920 x 1080). Ρυθμός ανανέωσης οθόνης: Hz. Ανάλυση κάμερας: pixel (Mp)",

</script>
<!-- ===== END EDIT SECTION ===== -->

<div id="slides"></div>
<div id="speedBadge"></div>
<div id="dots"></div>

<div id="controls">
  <button id="prevBtn" onclick="navigate(-1)">◀</button>
  <span id="counter"></span>
  <button id="nextBtn" onclick="navigate(1)">▶</button>
  <button id="playBtn" onclick="togglePlay()">⏸</button>
  <button id="muteBtn" onclick="toggleMute()">🔊</button>
</div>

<script src="../../tts/scripts/tts.js"></script>
<script src="../../tts/scripts/presentation.js"></script>
</body>
</html>
