var LESSON = {
  number: 21,
  unit: "Ενότητα 4: Ψηφιακός γραμματισμός",
  slides: [
    { type:"title", title:"Μάθημα 21ο: Εντοπισμός περιεχομένου στο διαδίκτυο με εναλλακτικούς τρόπους" },
    { type:"list", title:"Στο μάθημα αυτό θα μάθεις", items:["Να εντοπίζεις περιεχόμενο στο διαδίκτυο με εναλλακτικούς τρόπους"] },
    { type:"text", text:"Θυμάμαι ότι: χρησιμοποιώ μηχανές αναζήτησης για να βρω ψηφιακό περιεχόμενο σε ποικίλες μορφές (κείμενο, εικόνα, βίντεο και άλλα). Οι αναζητήσεις που βασίζονται σε κείμενο είναι ο πιο δημοφιλής τρόπος αναζήτησης περιεχομένου στο διαδίκτυο. Ωστόσο, υπάρχουν διαθέσιμες περισσότερες επιλογές αναζήτησης." },
    { type:"concept", text:"Ήξερες ότι: μπορείς να χρησιμοποιήσεις εναλλακτικές μεθόδους αναζήτησης, όπως η αναγνώριση εικόνας, η φωνητική αναζήτηση και η σάρωση κωδικών QR, για την εύρεση περιεχομένου εκτός της παραδοσιακής αναζήτησης κειμένου; Ο Ήρωνας και η Υπατία ψάχνοντας στον υπολογιστή τους βρήκαν μια παλιά φωτογραφία και χρησιμοποίησαν τη λειτουργία αντίστροφης αναζήτησης εικόνων στη μηχανή αναζήτησης, για να βρουν περισσότερες πληροφορίες." },
    { type:"steps", title:"Αντίστροφη αναζήτηση εικόνας: τρεις τρόποι", steps:["① Μεταφόρτωση εικόνας: πατάς την επιλογή «Ανεβάστε ένα αρχείο», επιλέγεις μια εικόνα και κάνεις κλικ στο κουμπί «Άνοιγμα» — ή πατάς το κουμπί «Αναζήτηση» και κάνεις διπλό κλικ στην εικόνα","② Μεταφορά και απόθεση: βρίσκεις στον υπολογιστή σου την εικόνα που θέλεις να αναζητήσεις και τη σύρεις στο πλαίσιο αναζήτησης","③ Αναζήτηση με URL: πηγαίνετε στον ιστότοπο που περιέχει την εικόνα, κάνεις δεξί κλικ στην εικόνα και επιλέγεις «Αντιγραφή διεύθυνσης εικόνας» — μετά στο πλαίσιο κειμένου της μηχανής αναζήτησης επικολλάς το URL στην επιλογή «Επικόλληση συνδέσμου εικόνας» ή «Επικόλληση εικόνας» και πατάς «Αναζήτηση»"] },

    { type:"concept", text:"Σε μια μηχανή αναζήτησης μπορείς να κάνεις «Αναζήτηση μέσω της χρήσης φωνητικών εντολών». Για να πραγματοποιηθεί η φωνητική αναζήτηση, στο σχετικό μήνυμα πρέπει να επιλέξεις να επιτραπεί η χρήση του μικροφώνου της συσκευής σου. Στη συνέχεια πατάς το κουμπί του μικροφώνου και λες το θέμα που θέλεις να αναζητήσεις. Η μηχανή αναζήτησης καταγράφει το ερώτημά σου τη στιγμή που μιλάς και σου επιστρέφει σχετικά αποτελέσματα. Τα αποτελέσματα μπορεί να διαφέρουν ανάλογα με τη μηχανή αναζήτησης." },
    { type:"text", text:"Παράδειγμα: η Υπατία και ο Ήρωνας θέλησαν να βρουν περισσότερες πληροφορίες για τον Κώστα Τσικλητήρα. Μέσω της φωνητικής αναζήτησης ρώτησαν τη μηχανή αναζήτησης να τους βρει περισσότερες πληροφορίες. Μπορείς να ρωτήσεις π.χ. «σε ποια πόλη γεννήθηκε ο Μέγας Αλέξανδρος;»." },
    { type:"concept", text:"Σίγουρα έχεις δει σε αφίσες ή βιβλία εκείνα τα τετράγωνα με τις μαύρες κουκκίδες. Ονομάζονται QR Codes (Κώδικες Γρήγορης Απόκρισης) και διαφέρουν από τα γραμμωτά barcodes που έχουν τα προϊόντα στο σούπερ μάρκετ. Σαρώνοντας τον κώδικα με το κινητό ή το tablet, ανοίγεις αμέσως ιστοσελίδες, βίντεο ή ήχους. Ουσιαστικά, το QR Code είναι μια ψηφιακή γέφυρα που ενώνει το χαρτί με το διαδίκτυο. Θα βρεις QR Codes σε πολλά σχολικά βιβλία για πρόσβαση σε ψηφιακό υλικό — και μπορείς να τα χρησιμοποιήσεις κι εσύ στις εργασίες σου, εμπλουτίζοντάς τες με βίντεο και ήχους που δεν χωρούν στο χαρτί! Για να δημιούργησεις το δικό σου QR code, μπορείς να επισκεφτείς τον ιστότοπο goqr.me." },
    { type:"list", title:"Νέες λέξεις", items:["Αντίστροφη αναζήτηση εικόνας: αναζήτηση με μια εικόνα αντί για λέξεις, για να βρεις την αρχή της","Φωνητική αναζήτηση: αναζήτηση μιλώντας στη μηχανή αναζήτησης","QR Code (Κώδικας Γρήγορης Απόκρισης): τετράγωνος κώδικας με μαύρες κουκκίδες που, όταν σαρωθεί, ανοίγει ιστοσελίδες, βίντεο ή ήχους","Barcode: το γραμμωτό κωδικό των προϊόντων του σούπερ μάρκετ","URL: η διεύθυνση μιας εικόνας ή ιστοσελίδας στο διαδίκτυο"] },
    { type:"practice", title:"Δοκίμασε", items:["Βρες μια εικόνα στον υπολογιστή σου και κάνε «Αναζήτηση μέσω εικόνας» με και τις τρεις διαφορετικές επιλογές","Αναζήτησε φωνητικά ένα θέμα που σε ενδιαφέρει και έλεγξε αν τα αποτελέσματα ταιριάζουν","Χρησιμοποιώντας μια έξυπνη φορητή συσκευή, εντόπισε ένα QR Code σε έναν εκπαιδευτικό ιστότοπο και προσπάθησε να διαβάσεις το περιεχόμενό του","Συζήτησε στην τάξη: σε βοήθησε η αναζήτηση με εικόνα και η φωνητική αναζήτηση; Πώς; Νομίζεις ότι τα QR Codes θα σε βοηθήσουν στις μελλοντικές σου αναζητήσεις;","Δες το βίντεο «Εναλλακτική διαδικτυακή αναζήτηση»"] },

  "Νέες λέξεις. Αντίστροφη αναζήτηση εικόνας: αναζήτηση με μια εικόνα αντί για λέξεις, για να βρεις την αρχή της. Φωνητική αναζήτηση: αναζήτηση μιλώντας στη μηχανή αναζήτησης. QR Code (Κώδικας Γρήγορης Απόκρισης): τετράγωνος κώδικας με μαύρες κουκκίδες που, όταν σαρωθεί, ανοίγει ιστοσελίδες, βίντεο ή ήχους. Barcode: το γραμμωτό κωδικό των προϊόντων του σούπερ μάρκετ. URL: η διεύθυνση μιας εικόνας ή ιστοσελίδας στο διαδίκτυο",
