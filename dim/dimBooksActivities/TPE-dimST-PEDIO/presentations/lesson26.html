    { type:"text", text:"Θυμάμαι ότι: μπορώ να συμμετέχω σε μάθημα σύγχρονης τηλεκπαίδευσης χρησιμοποιώντας μια υπηρεσία σύγχρονης εξ αποστάσεως εκπαίδευσης. Κατά τη συμμετοχή σου σε ένα μάθημα σύγχρονης τηλεκπαίδευσης μπορείς να αξιοποιείς προηγμένα εργαλεία της πλατφόρμας, όπως διαμοιρασμός περιεχομένου, επισημείωση και ασπροπίνακας." },
    { type:"concept", text:"Τηλεκπαίδευση είναι η διδασκαλία που γίνεται από απόσταση, με τη χρήση υπολογιστή ή tablet και σύνδεσης στο διαδίκτυο. Μέσα από εφαρμογές, όπως το Webex ή το e-me, μπορούμε να βλέπουμε και να ακούμε τον δάσκαλο και τους συμμαθητές μας, σαν να είμαστε στην τάξη! Ήξερες ότι: εκτός από το μάθημα, η τηλεκπαίδευση χρησιμοποιείται για συνεργασία σε εργασίες, για σεμινάρια, ακόμα και για συναντήσεις ομάδων; Οι εικόνες και τα εικονίδια του μαθήματός μας προέρχονται από το περιβάλλον του Webex — σε άλλες εφαρμογές τηλεκπαίδευσης η εμφάνιση και τα εργαλεία ενδέχεται να διαφέρουν." },

    { type:"concept", text:"Κατά τον διαμοιρασμό περιεχομένου μπορείς να κάνεις χρήση επισημειώσεων (annotations) στα αρχεία που μοιράζεσαι, προκειμένου να βοηθήσεις την υπόλοιπη τάξη να καταλάβει καλύτερα αυτό που παρουσιάζεις ή και να τους προκαλέσεις περισσότερο ενδιαφέρον. Έχεις στη διάθεσή σου μια εργαλειοθήκη που περιέχει ποικίλα εργαλεία για τη δημιουργία επισημειώσεων, όπως προσθήκη κειμένου, σχημάτων και άλλα." },

  ]
