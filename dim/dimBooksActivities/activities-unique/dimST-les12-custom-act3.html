<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Σύμβουλος Αγοράς: Ανάγκες → Υπολογιστής</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{color:#fff;text-align:center;margin-bottom:6px;font-size:1.5em;text-shadow:0 2px 4px rgba(0,0,0,.3)}
.subtitle{color:rgba(255,255,255,.85);text-align:center;margin-bottom:20px;font-size:.92em}
.container{background:#fff;border-radius:18px;padding:24px;max-width:760px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.2);margin-bottom:16px}
h2{color:#764ba2;font-size:1.1em;margin-bottom:14px}
.needs-grid{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.need-btn{padding:14px 18px;border:3px solid #e0e0e0;border-radius:14px;background:#fff;cursor:pointer;font-family:inherit;font-size:.9em;transition:all .25s;text-align:center;min-width:130px;user-select:none}
.need-btn:hover{border-color:#667eea;transform:translateY(-2px)}
.need-btn.selected{border-color:#764ba2;background:linear-gradient(135deg,#667eea20,#764ba220);box-shadow:0 0 0 2px #764ba240}
.need-icon{font-size:1.6em;display:block;margin-bottom:4px}
.need-label{font-weight:600;color:#444}
.recommend-btn{display:block;margin:0 auto 20px;padding:12px 32px;border:none;border-radius:12px;background:linear-gradient(135deg,#667eba,#764ba2);color:#fff;font-size:1em;cursor:pointer;font-family:inherit;font-weight:600;transition:all .2s}
.recommend-btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(118,75,162,.4)}
.result-card{display:none;background:linear-gradient(135deg,#f8f9ff,#f0f0ff);border-radius:18px;padding:24px;border:2px solid #d0d0ff;position:relative;overflow:hidden}
.result-card.show{display:block;animation:slideUp .4s}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.result-title{font-size:1.2em;font-weight:700;color:#764ba2;text-align:center;margin-bottom:16px}
.specs-grid{display:grid;grid-template-columns:1fr 1fr;grid-gap:12px;margin-bottom:16px}
.spec-item{background:#fff;border-radius:12px;padding:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.spec-icon{font-size:1.8em;margin-bottom:4px}
.spec-label{font-size:.75em;color:#888;font-weight:600;text-transform:uppercase;margin-bottom:4px}
.spec-value{font-size:1em;font-weight:700;color:#333}
.spec-detail{font-size:.8em;color:#764ba2;margin-top:2px}
.price-tag{text-align:center;font-size:1.3em;font-weight:700;color:#e74c3c;margin:12px 0}
.explanation{background:#fff;border-radius:12px;padding:14px;font-size:.85em;color:#555;line-height:1.6}
.explanation strong{color:#764ba2}
.tips{margin-top:14px;background:#fffbe6;border-radius:12px;padding:14px;font-size:.85em;color:#856404;line-height:1.6}
.tips strong{color:#664d03}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .needs-grid > * { margin: 6px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>

<h1>🖥️ Σύμβουλος Αγοράς Υπολογιστή</h1>
<p class="subtitle">Διάλεξε τις ανάγκες σου και βρες τον ιδανικό υπολογιστή!</p>

<div class="container">
  <h2>🎯 Τι χρειάζεσαι; (Επίλεξε ένα ή περισσότερα)</h2>
  <div class="needs-grid" id="needsGrid">
    <div class="need-btn" data-need="gaming" onclick="toggleNeed(this)">
      <span class="need-icon">🎮</span>
      <span class="need-label">Για παιχνίδια</span>
    </div>
    <div class="need-btn" data-need="work" onclick="toggleNeed(this)">
      <span class="need-icon">💼</span>
      <span class="need-label">Για εργασία</span>
    </div>
    <div class="need-btn" data-need="video" onclick="toggleNeed(this)">
      <span class="need-icon">🎬</span>
      <span class="need-label">Για video</span>
    </div>
    <div class="need-btn" data-need="cheap" onclick="toggleNeed(this)">
      <span class="need-icon">💰</span>
      <span class="need-label">Φθηνός</span>
    </div>
    <div class="need-btn" data-need="portable" onclick="toggleNeed(this)">
      <span class="need-icon">🎒</span>
      <span class="need-label">Φορητός</span>
    </div>
  </div>

  <button class="recommend-btn" onclick="recommend()">🔍 Βρες μου τον καλύτερο!</button>

  <div class="result-card" id="resultCard">
    <div class="result-title" id="resultTitle"></div>
    <div class="specs-grid" id="specsGrid"></div>
    <div class="price-tag" id="priceTag"></div>
    <div class="explanation" id="explanation"></div>
    <div class="tips" id="tipsBox"></div>
  </div>
</div>

<script>
var selectedNeeds=[];

function toggleNeed(el){
  var need=el.getAttribute('data-need');
  var idx=selectedNeeds.indexOf(need);
  if(idx===-1){
    selectedNeeds.push(need);
    el.classList.add('selected');
  } else {
    selectedNeeds.splice(idx,1);
    el.classList.remove('selected');
  }
}

var configs={
  gaming:{
    name:'🎮 Gaming Τερματικό',
    type:'Σταθμός Εργασίας',
    cpu:{icon:'⚙️',label:'Επεξεργαστής',value:'Intel Core i7-13700K',detail:'16 πυρήνες, 5.4GHz'},
    ram:{icon:'🧠',label:'Μνήμη RAM',value:'32 GB DDR5',detail:'Γρήγορη μνήμη για πολλά παιχνίδια'},
    storage:{icon:'💾',label:'Αποθήκευση',value:'1 TB NVMe SSD',detail:'Αστραπιαία φόρτωση'},
    gpu:{icon:'🎨',label:'Κάρτα Γραφικών',value:'NVIDIA RTX 4070',detail:'Ray tracing, 12GB VRAM'},
    screen:{icon:'🖥️',label:'Οθόνη',value:'27" 1440p 165Hz',detail:'Λεία, γρήγορη ανανέωση'},
    price:'~1.400€',
    explain:'Ο επεξεργαστής <strong>i7</strong> με 16 πυρήνες τρέχει βαριά παιχνίδια. Τα <strong>32GB RAM</strong> αφήνουν πολλές εφαρμογές ανοιχτές. Η κάρτα <strong>RTX 4070</strong> δίνει εκπληκτικά γραφικά. Το <strong>NVMe SSD</strong> φορτώνει τα παιχνίδια σε δευτερόλεπτα!',
    tip:'💡 Η κάρτα γραφικών (GPU) είναι το πιο σημαντικό κομμάτι για παιχνίδια. Επεξεργάζεται όλα τα γραφικά!'
  },
  work:{
    name:'💼 Επαγγελματικό Σύστημα',
    type:'Desktop',
    cpu:{icon:'⚙️',label:'Επεξεργαστής',value:'Intel Core i5-13400',detail:'10 πυρήνες, αποδοτικός'},
    ram:{icon:'🧠',label:'Μνήμη RAM',value:'16 GB DDR4',detail:'Αρκετή για πολλά προγράμματα'},
    storage:{icon:'💾',label:'Αποθήκευση',value:'512 GB SSD',detail:'Γρήγορη πρόσβαση σε αρχεία'},
    gpu:{icon:'🎨',label:'Κάρτα Γραφικών',value:'Ενσωματωμένη',detail:'Ικανοποιητική για εργασία'},
    screen:{icon:'🖥️',label:'Οθόνη',value:'24" 1080p IPS',detail:'Καθαρή εικόνα, καλά χρώματα'},
    price:'~650€',
    explain:'Ο <strong>i5</strong> είναι ισχυρός και αποδοτικός για γραφείο. Τα <strong>16GB RAM</strong> επαρκούν για εγγράμματα, φύλλα εργασίας, περιήγηση. Το <strong>SSD</strong> κάνει τον υπολογιστή γρήγορο.',
    tip:'💡 Η μνήμη RAM αποφασίζει πόσα προγράμματα μπορείς να έχεις ανοιχτά ταυτόχρονα χωρίς να κολλάει!'
  },
  video:{
    name:'🎬 Σταθμός Βίντεο',
    type:'Σταθμός Εργασίας',
    cpu:{icon:'⚙️',label:'Επεξεργαστής',value:'AMD Ryzen 9 7900X',detail:'12 πυρήνες, εξαιρετικός για rendering'},
    ram:{icon:'🧠',label:'Μνήμη RAM',value:'64 GB DDR5',detail:'Μεγάλη μνήμη για βίντεο'},
    storage:{icon:'💾',label:'Αποθήκευση',value:'2 TB NVMe SSD + 4TB HDD',detail:'Χώρος για πολλά βίντεο'},
    gpu:{icon:'🎨',label:'Κάρτα Γραφικών',value:'NVIDIA RTX 4060 Ti',detail:'Γρήγορο encoding βίντεο'},
    screen:{icon:'🖥️',label:'Οθόνη',value:'32" 4K IPS',detail:'Ακριβής χρώματα, μεγάλη ανάλυση'},
    price:'~1.800€',
    explain:'Ο <strong>Ryzen 9</strong> με 12 πυρήνες κάνει γρήγορο rendering. Τα <strong>64GB RAM</strong> χειρίζονται μεγάλα αρχεία βίντεο. Ο <strong>2TB SSD + 4TB HDD</strong> δίνουν ταχύτητα και χώρο. Η <strong>4K οθόνη</strong> δείχνει κάθε λεπτομέρεια.',
    tip:'💡 Το HDD (σκληρός δίσκος) αποθηκεύει πολλά αρχεία φθηνά, ενώ το SSD είναι πολύ πιο γρήγορο!'
  },
  cheap:{
    name:'💰 Οικονομικό Σύστημα',
    type:'Desktop',
    cpu:{icon:'⚙️',label:'Επεξεργαστής',value:'Intel Core i3-12100',detail:'4 πυρήνες, καλός για βασική χρήση'},
    ram:{icon:'🧠',label:'Μνήμη RAM',value:'8 GB DDR4',detail:'Βασική μνήμη, αρκετή για απλές εργασίες'},
    storage:{icon:'💾',label:'Αποθήκευση',value:'256 GB SSD',detail:'Γρήγορο, μικρός χώρος'},
    gpu:{icon:'🎨',label:'Κάρτα Γραφικών',value:'Ενσωματωμένη',detail:'Για βασικές εργασίες'},
    screen:{icon:'🖥️',label:'Οθόνη',value:'21.5" 1080p',detail:'Απλή, λειτουργική'},
    price:'~350€',
    explain:'Ο <strong>i3</strong> είναι οικονομικός και καλύπτει βασικές ανάγκες. Τα <strong>8GB RAM</strong> αρκούν για περιήγηση και απλά προγράμματα. Το <strong>256GB SSD</strong> κάνει τον υπολογιστή ευκίνητο.',
    tip:'💡 Ο επεξεργαστής (CPU) είναι ο "εγκέφαλος" του υπολογιστή. Όσο πιο δυνατός, τόσο πιο γρήγορα υπολογίζει!'
  },
  portable:{
    name:'🎒 Φορητός Υπολογιστής',
    type:'Laptop',
    cpu:{icon:'⚙️',label:'Επεξεργαστής',value:'Intel Core i5-1335U',detail:'Χαμηλής κατανάλωσης, για laptop'},
    ram:{icon:'🧠',label:'Μνήμη RAM',value:'16 GB DDR4',detail:'Καλή μνήμη, multitasking'},
    storage:{icon:'💾',label:'Αποθήκευση',value:'512 GB SSD',detail:'Γρήγορος και ήσυχος'},
    gpu:{icon:'🎨',label:'Κάρτα Γραφικών',value:'Intel Iris Xe',detail:'Καλά γραφικά για laptop'},
    screen:{icon:'🖥️',label:'Οθόνη',value:'15.6" 1080p IPS',detail:'Ελαφριά, καλή ανάλυση'},
    price:'~700€',
    explain:'Ο <strong>i5 U-series</strong> είναι σχεδιασμένος για φορητούς: χαμηλή κατανάλωση, μεγάλη αυτονομία. Τα <strong>16GB RAM</strong> τρέχουν πολλές εφαρμογές. Είναι <strong>ελαφρύ</strong> και εύκολο να το μεταφέρεις.',
    tip:'💡 Στα laptop, η μπαταρία και το βάρος είναι σημαντικά! Οι φορητοί είναι πιο αδύνατοι από σταθερούς ίδιας τιμής.'
  }
};

function recommend(){
  if(selectedNeeds.length===0){
    alert('Επίλεξε τουλάχιστον μία ανάγκη!');
    return;
  }

  var hasGaming=selectedNeeds.indexOf('gaming')!==-1;
  var hasWork=selectedNeeds.indexOf('work')!==-1;
  var hasVideo=selectedNeeds.indexOf('video')!==-1;
  var hasCheap=selectedNeeds.indexOf('cheap')!==-1;
  var hasPortable=selectedNeeds.indexOf('portable')!==-1;

  var configKey='work';
  if(hasGaming && hasCheap) configKey='gaming';
  else if(hasGaming) configKey='gaming';
  else if(hasVideo) configKey='video';
  else if(hasPortable) configKey='portable';
  else if(hasCheap) configKey='cheap';
  else if(hasWork) configKey='work';

  if(hasCheap && hasGaming) configKey='gaming';
  if(hasPortable && !hasGaming && !hasVideo) configKey='portable';

  var cfg=configs[configKey];

  document.getElementById('resultTitle').textContent=cfg.name;

  var grid=document.getElementById('specsGrid');
  var specKeys=['cpu','ram','storage','gpu','screen'];
  var html='';
  specKeys.forEach(function(k){
    var s=cfg[k];
    html+='<div class="spec-item"><div class="spec-icon">'+s.icon+'</div><div class="spec-label">'+s.label+'</div><div class="spec-value">'+s.value+'</div><div class="spec-detail">'+s.detail+'</div></div>';
  });
  grid.innerHTML=html;

  document.getElementById('priceTag').textContent='Τιμή: '+cfg.price;
  document.getElementById('explanation').innerHTML='<strong>📝 Γιατί αυτή η επιλογή:</strong><br>'+cfg.explain;
  document.getElementById('tipsBox').innerHTML='<strong>📚 Τι μαθαίνουμε:</strong><br>'+cfg.tip;

  var card=document.getElementById('resultCard');
  card.classList.remove('show');
  setTimeout(function(){card.classList.add('show')},50);
}
</script>
</body>
</html>
