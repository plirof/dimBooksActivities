<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Βρες λάθη κειμένου | Δ' Μάθημα 22</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);
  padding:16px;
  display:flex;flex-direction:column;align-items:center;
}
h1{
  color:#fff;font-size:1.8rem;text-align:center;
  text-shadow:2px 2px 6px rgba(0,0,0,.3);margin:10px 0 6px;
}
.subtitle{color:#fffde7;font-size:1.05rem;text-align:center;margin-bottom:12px;text-shadow:1px 1px 3px rgba(0,0,0,.25);}
.container{
  background:#fff;border-radius:20px;
  box-shadow:0 10px 40px rgba(0,0,0,.22);
  max-width:800px;width:100%;padding:28px 24px 32px;
  margin-bottom:24px;
}
.score-bar{
  display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(90deg,#e0f7fa,#e8f5e9);
  border-radius:14px;padding:12px 20px;margin-bottom:20px;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.08);
}
.score-bar .emoji{font-size:1.5rem;}
.score-bar .score-text{font-size:1.1rem;font-weight:700;color:#37474f;}
.sentence-card{
  background:#fafafa;border-radius:16px;
  border:2px solid #e0e0e0;padding:18px 20px;margin-bottom:18px;
  transition:border-color .3s;
}
.sentence-card.corrected{border-color:#66bb6a;background:#e8f5e9;}
.sentence-card .num-badge{
  display:inline-block;background:#7c4dff;color:#fff;
  border-radius:50%;width:30px;height:30px;text-align:center;
  line-height:30px;font-weight:700;font-size:.95rem;margin-bottom:10px;
}
.sentence-text{
  font-size:1.25rem;line-height:1.7;color:#263238;
  padding:10px 14px;background:#fff;border-radius:10px;
  border:1px solid #e0e0e0;margin-bottom:8px;
  letter-spacing:.5px;
}
.sentence-text.wrong-words{
  background:#fff3e0;border-color:#ffcc80;
}
.error-types{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.error-btn{
  padding:8px 16px;border-radius:12px;border:2px solid #bdbdbd;
  background:#fff;font-size:.95rem;cursor:pointer;
  transition:all .2s;font-weight:600;color:#455a64;
  user-select:none;
}
.error-btn:hover{background:#e3f2fd;border-color:#42a5f5;}
.error-btn.selected{background:#bbdefb;border-color:#1e88e5;color:#1565c0;}
.error-btn.correct{background:#a5d6a7;border-color:#43a047;color:#2e7d32;cursor:default;}
.error-btn.wrong{background:#ef9a9a;border-color:#e53935;color:#b71c1c;cursor:default;}
.error-btn.missed{background:#ffe082;border-color:#ffa000;color:#e65100;cursor:default;}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
.check-btn{
  padding:10px 22px;border-radius:14px;border:none;
  background:linear-gradient(135deg,#42a5f5,#1976d2);
  color:#fff;font-size:1rem;font-weight:700;cursor:pointer;
  box-shadow:0 4px 12px rgba(25,118,210,.35);
  transition:transform .15s,box-shadow .15s;
}
.check-btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(25,118,210,.45);}
.check-btn:disabled{background:#bdbdbd;cursor:default;transform:none;box-shadow:none;}
.fix-btn{
  padding:10px 22px;border-radius:14px;border:none;
  background:linear-gradient(135deg,#66bb6a,#2e7d32);
  color:#fff;font-size:1rem;font-weight:700;cursor:pointer;
  box-shadow:0 4px 12px rgba(46,125,50,.35);
  transition:transform .15s,box-shadow .15s;
}
.fix-btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(46,125,50,.45);}
.corrected-text{
  margin-top:10px;padding:12px 16px;background:#e8f5e9;
  border-radius:10px;border:1px solid #a5d6a7;
  font-size:1.15rem;color:#2e7d32;font-weight:600;
  display:none;
}
.corrected-text.visible{display:block;animation:fadeIn .4s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
.results{
  text-align:center;padding:20px;border-radius:16px;
  background:linear-gradient(135deg,#fff9c4,#fff59d);
  box-shadow:0 4px 14px rgba(0,0,0,.1);margin-top:10px;display:none;
}
.results.visible{display:block;animation:fadeIn .5s ease;}
.results .big-emoji{font-size:3rem;}
.results .msg{font-size:1.2rem;font-weight:700;color:#e65100;margin:8px 0;}
.restart-btn{
  padding:12px 30px;border-radius:14px;border:none;
  background:linear-gradient(135deg,#ff7043,#d84315);
  color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;
  box-shadow:0 4px 12px rgba(216,67,21,.35);margin-top:12px;
  transition:transform .15s;
}
.restart-btn:hover{transform:translateY(-2px);}
.feedback-emoji{
  font-size:1.3rem;margin-left:6px;display:inline-block;
  animation:pop .3s ease;
}
@keyframes pop{0%{transform:scale(0);}70%{transform:scale(1.3);}100%{transform:scale(1);}}
@media(max-width:600px){
  h1{font-size:1.35rem;}
  .container{padding:18px 14px 24px;}
  .sentence-text{font-size:1.05rem;}
  .error-btn{padding:6px 12px;font-size:.85rem;}
  .check-btn,.fix-btn{padding:8px 16px;font-size:.9rem;}
}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .error-types > * { margin: 4px; }
  .actions > * { margin: 5px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>

<h1>🔍 Βρες λάθη κειμένου! ✏️</h1>
<p class="subtitle">Μπορείς να βρεις τι λείπει από κάθε πρόταση; 🤔</p>

<div class="container">
  <div class="score-bar">
    <span class="emoji">🏆</span>
    <span class="score-text" id="scoreDisplay">Βρέθηκαν: 0 / 0 λάθη</span>
    <span class="emoji">⭐</span>
  </div>
  <div id="sentencesContainer"></div>
  <div class="results" id="results"></div>
</div>

<script>
var data = [
  {
    broken: "ημαριαπαιζειστην αυλη",
    fixed: "Η Μαρία παίζει στην αυλή.",
    errors: ["Λείπει τόνος","Λείπει κενό","Λείπει τελεία"],
    hint: "Η Μαρία παίζει στην αυλή."
  },
  {
    broken: "ο γαννης τρωει μηλο",
    fixed: "Ο Γιάννης τρώει μήλο.",
    errors: ["Λείπει τόνος","Λείπει τελεία"],
    hint: "Ο Γιάννης τρώει μήλο."
  },
  {
    broken: "το σχολειοείναι μεγαλο",
    fixed: "Το σχολείο είναι μεγάλο.",
    errors: ["Λείπει τόνος","Λείπει κενό","Λείπει τελεία"],
    hint: "Το σχολείο είναι μεγάλο."
  },
  {
    broken: "εναμεγαλοδεντροβγαινει",
    fixed: "Ένα μεγάλο δέντρο βγαίνει.",
    errors: ["Λείπει τόνος","Λείπει κενό","Λείπει τελεία"],
    hint: "Ένα μεγάλο δέντρο βγαίνει."
  },
  {
    broken: "ηγατιναπηδάειψηλα",
    fixed: "Η γάτινα πηδάει ψηλά.",
    errors: ["Λείπει τόνος","Λείπει κενό","Λείπει τελεία"],
    hint: "Η γάτινα πηδάει ψηλά."
  },
  {
    broken: "μικροαλογακιτρέχει",
    fixed: "Μικρό αλογάκι τρέχει.",
    errors: ["Λείπει τόνος","Λείπει κενό","Λείπει τελεία"],
    hint: "Μικρό αλογάκι τρέχει."
  }
];

var allErrorTypes = ["Λείπει τόνος","Λείπει κενό","Λείπει τελεία"];
var totalErrors = 0;
var foundErrors = 0;
var checked = [];

function init() {
  totalErrors = 0;
  foundErrors = 0;
  checked = [];
  data.forEach(function(s){ totalErrors += s.errors.length; });
  document.getElementById("scoreDisplay").textContent = "Βρέθηκαν: 0 / " + totalErrors + " λάθη";
  document.getElementById("results").classList.remove("visible");
  var container = document.getElementById("sentencesContainer");
  container.textContent = "";
  data.forEach(function(s, i) {
    checked.push(false);
    var card = document.createElement("div");
    card.className = "sentence-card";
    card.id = "card-" + i;

    var badge = document.createElement("span");
    badge.className = "num-badge";
    badge.textContent = (i + 1);

    var txt = document.createElement("div");
    txt.className = "sentence-text wrong-words";
    txt.textContent = s.broken;

    var label = document.createElement("div");
    label.style.cssText = "font-size:.9rem;color:#78909c;margin-bottom:4px;font-weight:600;";
    label.textContent = "👉 Τι λείπει;";

    var eTypes = document.createElement("div");
    eTypes.className = "error-types";
    allErrorTypes.forEach(function(et) {
      var btn = document.createElement("button");
      btn.className = "error-btn";
      btn.textContent = et;
      btn.setAttribute("data-sentence", i);
      btn.setAttribute("data-error", et);
      btn.addEventListener("click", function() {
        toggleError(btn, i, et);
      });
      eTypes.appendChild(btn);
    });

    var actions = document.createElement("div");
    actions.className = "actions";

    var checkBtn = document.createElement("button");
    checkBtn.className = "check-btn";
    checkBtn.id = "check-" + i;
    checkBtn.textContent = "✔ Έλεγχος";
    checkBtn.addEventListener("click", function(){ checkSentence(i); });

    var fixBtn = document.createElement("button");
    fixBtn.className = "fix-btn";
    fixBtn.id = "fix-" + i;
    fixBtn.textContent = "📝 Διόρθωση";
    fixBtn.style.display = "none";
    fixBtn.addEventListener("click", function(){ showFix(i); });

    actions.appendChild(checkBtn);
    actions.appendChild(fixBtn);

    var correctedDiv = document.createElement("div");
    correctedDiv.className = "corrected-text";
    correctedDiv.id = "corrected-" + i;
    correctedDiv.textContent = "✅ " + s.fixed;

    card.appendChild(badge);
    card.appendChild(txt);
    card.appendChild(label);
    card.appendChild(eTypes);
    card.appendChild(actions);
    card.appendChild(correctedDiv);
    container.appendChild(card);
  });
}

function toggleError(btn, idx, errType) {
  if (checked[idx]) return;
  if (btn.classList.contains("selected")) {
    btn.classList.remove("selected");
  } else {
    btn.classList.add("selected");
  }
}

function checkSentence(idx) {
  if (checked[idx]) return;
  checked[idx] = true;
  var s = data[idx];
  var btns = document.querySelectorAll('.error-btn[data-sentence="' + idx + '"]');
  var sentenceCorrectErrors = 0;

  btns.forEach(function(btn) {
    var err = btn.getAttribute("data-error");
    var isSelected = btn.classList.contains("selected");
    var isActual = s.errors.indexOf(err) !== -1;

    btn.classList.remove("selected");
    if (isSelected && isActual) {
      btn.classList.add("correct");
      sentenceCorrectErrors++;
      foundErrors++;
    } else if (isSelected && !isActual) {
      btn.classList.add("wrong");
    } else if (!isSelected && isActual) {
      btn.classList.add("missed");
    }
  });

  document.getElementById("scoreDisplay").textContent = "Βρέθηκαν: " + foundErrors + " / " + totalErrors + " λάθη";

  var checkBtn = document.getElementById("check-" + idx);
  checkBtn.disabled = true;

  var fixBtn = document.getElementById("fix-" + idx);
  fixBtn.style.display = "inline-block";

  if (sentenceCorrectErrors === s.errors.length) {
    checkBtn.textContent = "🎉 Τέλεια!";
  } else {
    checkBtn.textContent = "😉 Ξαναδοκίμασε!";
  }

  var allDone = checked.every(function(c){ return c; });
  if (allDone) {
    showResults();
  }
}

function showFix(idx) {
  var div = document.getElementById("corrected-" + idx);
  div.classList.add("visible");
  document.getElementById("card-" + idx).classList.add("corrected");
}

function showResults() {
  var pct = foundErrors / totalErrors;
  var emoji, msg;
  if (pct === 1) { emoji = "🏆🌟🎉"; msg = "Τέλεια! Τα βρήκες όλα! Είσαι εκπληκτικός/η!"; }
  else if (pct >= 0.7) { emoji = "😊👏⭐"; msg = "Μπράβο! Πολύ καλά τα πήγες!"; }
  else if (pct >= 0.4) { emoji = "🙂💪"; msg = "Καλή προσπάθεια! Δοκίμασε ξανά!"; }
  else { emoji = "🤗📚"; msg = "Μην αγχώνεσαι! Προσπάθησε ξανά!"; }

  var res = document.getElementById("results");
  res.textContent = "";
  var bigE = document.createElement("div");
  bigE.className = "big-emoji";
  bigE.textContent = emoji;
  var m = document.createElement("div");
  m.className = "msg";
  m.textContent = msg;
  var sc = document.createElement("div");
  sc.style.cssText = "font-size:1.1rem;color:#37474f;font-weight:600;";
  sc.textContent = "Βρέθηκαν " + foundErrors + " από " + totalErrors + " λάθη";
  var restBtn = document.createElement("button");
  restBtn.className = "restart-btn";
  restBtn.textContent = "🔄 Ξανά!";
  restBtn.addEventListener("click", init);

  res.appendChild(bigE);
  res.appendChild(m);
  res.appendChild(sc);
  res.appendChild(restBtn);
  res.classList.add("visible");
}

init();
</script>
</body>
</html>
