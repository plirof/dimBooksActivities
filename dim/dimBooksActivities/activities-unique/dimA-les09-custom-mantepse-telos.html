<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Μάντεψε Πού θα Πάει! 🔮</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #b8c6db 0%, #f5f7fa 100%);
    padding: 12px; color: #333;
  }
  .app-container { max-width: 520px; margin: 0 auto; }
  .header {
    text-align: center; padding: 16px 14px 10px;
    background: linear-gradient(135deg, #4568dc, #b06ab3);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(69,104,220,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.3rem; margin-bottom: 2px; }
  .header p { font-size: .95rem; opacity: .95; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 8px 16px;
    margin-bottom: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.1rem; font-weight: 700; color: #4568dc; }
  .round { font-size: .9rem; color: #888; }
  .hint {
    text-align: center; font-size: .92rem; font-weight: 700; color: #4527a0;
    background: #fff; border-radius: 14px; padding: 8px 12px;
    margin-bottom: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .prog-row {
    display: flex; justify-content: center; flex-wrap: wrap;
    background: #fff; border-radius: 16px;
    padding: 10px; margin-bottom: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
  }
  .pcard {
    display: flex; flex-direction: column; align-items: center;
    background: #ede7f6; border: 2px solid #7e57c2;
    border-radius: 10px; padding: 4px 10px;
    margin: 3px;
  }
  .pcard .pc-icon { font-size: 1.4rem; }
  .pcard .pc-label { font-size: .62rem; font-weight: 700; color: #4527a0; }
  .grid-wrap { display: flex; justify-content: center; margin-bottom: 12px; }
  .grid {
    display: inline-grid;
    grid-gap: 4px;
    background: #4527a0;
    padding: 5px;
    border-radius: 10px;
  }
  .cell {
    width: 56px; height: 56px;
    background: #f3e5f5;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem;
    position: relative;
    user-select: none; -webkit-user-select: none;
    transition: background .2s;
  }
  .cell.startcell { background: #fff9c4; }
  .cell.candidate {
    background: #e1bee7;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .cell.candidate:active { transform: scale(.92); }
  .cell.candidate .qmark { font-size: 1.9rem; color: #6a1b9a; }
  .cell.picked { border: 3px solid #4568dc; }
  .cell.picked-good { background: #c8e6c9; border: 3px solid #43a047; }
  .cell.picked-bad { background: #ffcdd2; border: 3px solid #e53935; }
  .cell.true-end { background: #c8e6c9; }
  .bugwrap {
    position: relative;
    display: inline-block;
    transition: transform .4s;
  }
  .bugwrap .nose {
    position: absolute; top: -8px; left: 50%;
    margin-left: -5px;
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-bottom: 8px solid #d63031;
  }
  @media (max-width: 440px) {
    .cell { width: 44px; height: 44px; font-size: 1.1rem; }
    .cell.candidate .qmark { font-size: 1.5rem; }
  }
  .feedback {
    text-align: center; padding: 12px; border-radius: 14px;
    font-size: 1rem; font-weight: 700; margin-bottom: 10px; display: none;
  }
  .feedback.correct { display: block; background: #d4edda; color: #155724; }
  .feedback.wrong { display: block; background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1); padding: 40px 24px;
    text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #4568dc, #b06ab3);
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 36px; font-size: 1.2rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(69,104,220,.35);
    transition: transform .15s;
  }
  .btn-restart:hover { transform: scale(1.05); }
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🔮 Μάντεψε Πού θα Πάει!</h1>
    <p>Πού θα καταλήξει η πασχαλίτσα με αυτό το πρόγραμμα;</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/4</span>
  </div>
  <div id="gameArea">
    <div class="hint">👉 Πάτα το ❓ τετράγωνο που θα βρει στο τέλος η πασχαλίτσα!</div>
    <div class="prog-row" id="progRow"></div>
    <div class="grid-wrap"><div class="grid" id="grid"></div></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var CMD = { f: '⬆️', b: '⬇️', tl: '↩️', tr: '↪️' };
  var CMD_LABEL = { f: 'Μπροστά', b: 'Πίσω', tl: 'Αριστερά', tr: 'Δεξιά' };
  var VEC = [ [-1,0], [0,1], [1,0], [0,-1] ];
  var DEG = [0, 90, 180, 270];
  var ROWS = 4, COLS = 4;
  var STEP_MS = 600;
  var levels = [
    { start: [3,0], ori: 0, prog: ['f','f','tr','f'], end: [1,1], cands: [[1,1],[1,0],[0,0]] },
    { start: [1,0], ori: 1, prog: ['f','tl','f'], end: [0,1], cands: [[0,1],[1,2],[2,1]] },
    { start: [3,3], ori: 3, prog: ['f','tr','f','f'], end: [1,2], cands: [[1,2],[3,1],[3,0]] },
    { start: [1,1], ori: 2, prog: ['b','tr','f'], end: [2,0], cands: [[2,0],[0,1],[2,1]] }
  ];

  var currentLevel = 0, score = 0, simulating = false;

  function startGame() {
    currentLevel = 0; score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    loadLevel();
  }

  function loadLevel() {
    if (currentLevel >= levels.length) { showResult(); return; }
    simulating = false;
    var lv = levels[currentLevel];
    document.getElementById('roundDisplay').textContent = (currentLevel + 1) + '/' + levels.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';

    var pr = document.getElementById('progRow');
    pr.innerHTML = '';
    for (var i = 0; i < lv.prog.length; i++) {
      var p = document.createElement('div');
      p.className = 'pcard';
      p.innerHTML = '<span class="pc-icon">' + CMD[lv.prog[i]] + '</span>' +
                    '<span class="pc-label">' + CMD_LABEL[lv.prog[i]] + '</span>';
      pr.appendChild(p);
    }
    renderGrid();
  }

  function renderGrid() {
    var lv = levels[currentLevel];
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = 'repeat(' + COLS + ', 56px)';
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var cell = document.createElement('div');
        cell.className = 'cell';
        cell.setAttribute('data-r', r);
        cell.setAttribute('data-c', c);
        if (r === lv.start[0] && c === lv.start[1]) {
          cell.classList.add('startcell');
        }
        for (var k = 0; k < lv.cands.length; k++) {
          if (lv.cands[k][0] === r && lv.cands[k][1] === c) {
            cell.classList.add('candidate');
            break;
          }
        }
        if (cell.classList.contains('candidate')) {
          cell.innerHTML = '<span class="qmark">❓</span>';
          cell.onclick = (function(rr, cc) {
            return function() { pickCell(rr, cc); };
          })(r, c);
        }
        grid.appendChild(cell);
      }
    }
    placeBug(lv.start[0], lv.start[1], lv.ori);
  }

  function cellAt(r, c) {
    var cells = document.querySelectorAll('.cell');
    for (var i = 0; i < cells.length; i++) {
      if (parseInt(cells[i].getAttribute('data-r')) === r &&
          parseInt(cells[i].getAttribute('data-c')) === c) return cells[i];
    }
    return null;
  }

  function placeBug(r, c, ori) {
    var cell = cellAt(r, c);
    var wrap = document.createElement('span');
    wrap.className = 'bugwrap';
    wrap.id = 'theBug';
    wrap.innerHTML = '<span class="nose"></span>🐞';
    wrap.style.transform = 'rotate(' + DEG[ori] + 'deg)';
    cell.appendChild(wrap);
  }

  function moveBug(nr, nc, ori) {
    var bug = document.getElementById('theBug');
    var parent = bug.parentNode;
    parent.removeChild(bug);
    bug.style.transform = 'rotate(' + DEG[ori] + 'deg)';
    cellAt(nr, nc).appendChild(bug);
  }

  function rotateBug(ori) {
    document.getElementById('theBug').style.transform = 'rotate(' + DEG[ori] + 'deg)';
  }

  function setFeedback(type, text) {
    var fb = document.getElementById('feedback');
    fb.className = 'feedback ' + type;
    fb.style.display = '';
    fb.textContent = text;
  }

  function pickCell(r, c) {
    if (simulating) return;
    simulating = true;
    var lv = levels[currentLevel];
    var pickedCell = cellAt(r, c);
    pickedCell.innerHTML = '';
    pickedCell.classList.add('picked');

    var pos = { r: lv.start[0], c: lv.start[1] };
    var ori = lv.ori;
    var i = 0;

    var timer = setInterval(function() {
      var cmd = lv.prog[i];
      if (cmd === 'tl') {
        ori = (ori + 3) % 4;
        rotateBug(ori);
      } else if (cmd === 'tr') {
        ori = (ori + 1) % 4;
        rotateBug(ori);
      } else {
        var v = VEC[ori];
        var dr = v[0], dc = v[1];
        if (cmd === 'b') { dr = -dr; dc = -dc; }
        pos = { r: pos.r + dr, c: pos.c + dc };
        moveBug(pos.r, pos.c, ori);
      }
      i++;
      if (i >= lv.prog.length) {
        clearInterval(timer);
        setTimeout(function() { reveal(r, c, pos); }, 450);
      }
    }, STEP_MS);
  }

  function reveal(pr, pc, truePos) {
    var lv = levels[currentLevel];
    var trueCell = cellAt(truePos.r, truePos.c);
    var bug = document.getElementById('theBug');
    if (trueCell.getAttribute('data-r') !== String(pr) ||
        trueCell.getAttribute('data-c') !== String(pc)) {
      var parent = bug.parentNode;
      parent.removeChild(bug);
      trueCell.appendChild(bug);
    } else {
      trueCell.innerHTML = '';
      trueCell.appendChild(bug);
    }

    var pickedCell = cellAt(pr, pc);
    var correct = (pr === truePos.r && pc === truePos.c);
    if (correct) {
      pickedCell.classList.add('picked-good');
      pickedCell.innerHTML = '';
      pickedCell.appendChild(bug);
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      setFeedback('correct', '✅ Μπράβο! Μάντεψες σωστά! Η στροφή γυρνάει, δεν κάνει βήμα!');
    } else {
      pickedCell.classList.add('picked-bad');
      pickedCell.innerHTML = '❌';
      trueCell.classList.add('true-end');
      setFeedback('wrong', '❌ Ωχ! Η πασχαλίτσα κατέληξε στο πράσινο τετράγωνο! Δες ξανά τις στροφές.');
    }
    setTimeout(function() {
      currentLevel++;
      loadLevel();
    }, 2400);
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var total = levels.length;
    var emoji, title, msg;
    if (score === total) { emoji = '🏆'; title = 'Τέλεια!'; msg = 'Διαβάζεις προγράμματα σαν προγραμματιστής!'; }
    else if (score >= 3) { emoji = '🎉'; title = 'Μπράβο!'; msg = 'Καταλαβαίνεις τις στροφές του ρομπότ!'; }
    else if (score >= 2) { emoji = '👍'; title = 'Ωραία!'; msg = 'Καλή προσπάθεια! Δοκίμασε ξανά!'; }
    else { emoji = '💪'; title = 'Καλή αρχή!'; msg = 'Η στροφή γυρνάει τη πασχαλίτσα στη θέση της!'; }
    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultMsg').textContent = 'Βρήκες ' + score + ' από ' + total + ' σωστά! ' + msg;
  }

  startGame();
</script>
</body>
</html>
