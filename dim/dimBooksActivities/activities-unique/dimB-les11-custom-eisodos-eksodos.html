<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Είσοδος - Επεξεργασία - Έξοδος 🔄</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
    padding: 12px;
    color: #333;
    touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(102,126,234,.4);
    margin-bottom: 14px;
  }
  .header h1 { font-size: 1.4rem; }
  .header p { font-size: .9rem; opacity: .9; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #764ba2; }
  .round { font-size: 1rem; color: #888; }

  .machine-card {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 24px 20px; margin-bottom: 18px;
    text-align: center;
  }
  .machine-emoji { font-size: 4.5rem; margin-bottom: 6px; }
  .machine-name { font-size: 1.3rem; font-weight: 700; color: #2d3436; margin-bottom: 4px; }
  .machine-desc {
    font-size: .95rem; color: #888; margin-bottom: 16px;
    background: #f8f9ff; border-radius: 12px; padding: 10px;
    line-height: 1.4;
  }

  .flow-container {
    display: flex; flex-direction: column; gap: 10px;
    margin-bottom: 16px;
  }
  .flow-row {
    display: flex; align-items: center; gap: 10px;
    background: #f8f9ff; border-radius: 14px;
    padding: 8px 14px;
    border: 3px solid transparent;
    transition: all .3s ease;
  }
  .flow-row.active-slot {
    border-color: #764ba2;
    background: #f3e5f5;
    box-shadow: 0 0 0 4px rgba(118,75,162,.25), 0 4px 12px rgba(118,75,162,.2);
    animation: pulse-slot 1.5s ease-in-out infinite;
  }
  .flow-row.filled-slot {
    background: #e8f5e9;
    border-color: #28a745;
  }
  @keyframes pulse-slot {
    0%,100% { box-shadow: 0 0 0 4px rgba(118,75,162,.25), 0 4px 12px rgba(118,75,162,.2); }
    50% { box-shadow: 0 0 0 8px rgba(118,75,162,.15), 0 4px 16px rgba(118,75,162,.3); }
  }
  .flow-step-label {
    font-size: .85rem; font-weight: 700; min-width: 100px;
    padding: 6px 10px; border-radius: 10px; text-align: center;
    color: #fff; flex-shrink: 0;
  }
  .label-input { background: #11998e; }
  .label-process { background: #f5576c; }
  .label-output { background: #667eea; }
  .flow-step-desc {
    font-size: 1rem; font-weight: 600; color: #2d3436;
  }
  .flow-step-emoji { font-size: 1.5rem; }

  .choices-area {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; margin-bottom: 14px;
  }
  .choice-chip {
    background: #fff; border: 3px solid #e0e0e0;
    border-radius: 16px; padding: 12px 16px;
    cursor: pointer; transition: all .2s ease;
    user-select: none; -webkit-tap-highlight-color: transparent;
    font-size: 1rem; font-weight: 600; text-align: center;
    min-width: 80px;
  }
  .choice-chip:active { transform: scale(.93); }
  .choice-chip .chip-emoji { font-size: 1.6rem; display: block; margin-bottom: 2px; }
  .choice-chip.selected {
    border-color: #764ba2; background: #ede7f6;
    box-shadow: 0 2px 10px rgba(118,75,162,.2);
  }
  .choice-chip.correct {
    border-color: #28a745; background: #d4edda;
    animation: pop .4s ease;
  }
  .choice-chip.wrong {
    border-color: #dc3545; background: #f8d7da;
    animation: shake .4s ease;
  }
  .choice-chip.disabled { pointer-events: none; opacity: .6; }
  .choice-chip.hidden-choice { display: none; }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .step-badge {
    display: inline-block;
    background: #764ba2; color: #fff;
    border-radius: 50%; width: 34px; height: 34px;
    line-height: 34px; text-align: center;
    font-weight: 700; font-size: .9rem;
    margin-bottom: 10px;
  }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; margin-bottom: 14px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.yay { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
  .feedback.nay { background: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }

  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
    border: none; border-radius: 16px; padding: 14px 36px;
    font-size: 1.2rem; font-weight: 700; cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(102,126,234,.35);
    transition: transform .15s;
  }
  .btn-restart:active { transform: scale(.95); }

  @media (max-width: 480px) {
    body { padding: 8px; }
    .header h1 { font-size: 1.15rem; }
    .machine-emoji { font-size: 3.5rem; }
    .flow-step-label { font-size: .75rem; min-width: 75px; padding: 4px 8px; }
    .choice-chip { font-size: .9rem; padding: 10px 12px; min-width: 65px; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .flow-container > * + * { margin-top: 10px; }
  .flow-row > * + * { margin-left: 10px; }
  .choices-area > * { margin: 5px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>🔄 Είσοδος → Επεξεργασία → Έξοδος</h1>
    <p>Πώς λειτουργούν τα μηχανήματα;</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/6</span>
  </div>

  <div id="gameArea">
    <div class="machine-card">
      <div class="machine-emoji" id="machineEmoji">🥤</div>
      <div class="machine-name" id="machineName">Μηχάνημα Χυμού</div>
      <div class="machine-desc" id="machineDesc">Βάζουμε φρούτα και βγάζει φρέσκο χυμό!</div>
    </div>

    <div class="flow-container" id="flowContainer">
      <div class="flow-row" id="flowRow0">
        <span class="flow-step-label label-input">📥 Είσοδος</span>
        <span class="flow-step-emoji" id="inputEmoji">❓</span>
        <span class="flow-step-desc" id="inputDesc">Τι βάζουμε;</span>
      </div>
      <div class="flow-row" id="flowRow1">
        <span class="flow-step-label label-process">⚙️ Επεξεργασία</span>
        <span class="flow-step-emoji" id="processEmoji">❓</span>
        <span class="flow-step-desc" id="processDesc">Τι κάνει;</span>
      </div>
      <div class="flow-row" id="flowRow2">
        <span class="flow-step-label label-output">📤 Έξοδος</span>
        <span class="flow-step-emoji" id="outputEmoji">❓</span>
        <span class="flow-step-desc" id="outputDesc">Τι βγάζει;</span>
      </div>
    </div>

    <div class="step-badge" id="stepBadge">1/3</div>

    <div class="choices-area" id="choicesArea"></div>

    <div class="feedback" id="feedback"></div>
  </div>

  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>

<script>
  var machines = [
    {
      emoji: '🥤', name: 'Μηχάνημα Χυμού',
      desc: 'Βάζουμε φρούτα και βγάζει φρέσκο χυμό!',
      input: { emoji: '🍊', text: 'Φρούτα' },
      process: { emoji: '🔄', text: 'Στύβει τα φρούτα' },
      output: { emoji: '🧃', text: 'Φρέσκος χυμός' }
    },
    {
      emoji: '🧺', name: 'Πλυντήριο',
      desc: 'Βάζουμε βρώμικα ρούχα και βγαίνουν καθαρά!',
      input: { emoji: '👕', text: 'Βρώμικα ρούχα' },
      process: { emoji: '🔄', text: 'Πλένει με νερό & σαπούνι' },
      output: { emoji: '✨', text: 'Καθαρά ρούχα' }
    },
    {
      emoji: '🍞', name: 'Φρυγανιέρα',
      desc: 'Βάζουμε ψωμί και βγαίνει ζεστό!',
      input: { emoji: '🍞', text: 'Φρέσκο ψωμί' },
      process: { emoji: '🔥', text: 'Ζεσταίνει το ψωμί' },
      output: { emoji: '🍞', text: 'Ζεστή φρυγανιά' }
    },
    {
      emoji: '💻', name: 'Υπολογιστής',
      desc: 'Βάζουμε δεδομένα, τα επεξεργάζεται και βγάζει πληροφορίες!',
      input: { emoji: '⌨️', text: 'Δεδομένα (κείμενα, αριθμοί)' },
      process: { emoji: '🧠', text: 'Τα υπολογίζει & τα αλλάζει' },
      output: { emoji: '📺', text: 'Πληροφορίες (αποτελέσματα)' }
    },
    {
      emoji: '📸', name: 'Φωτογραφική Μηχανή',
      desc: 'Τραβάμε φωτογραφία και τη βλέπουμε στην οθόνη!',
      input: { emoji: '🌅', text: 'Το τοπίο μπροστά μας' },
      process: { emoji: '⚡', text: 'Το καταγράφει ψηφιακά' },
      output: { emoji: '🖼️', text: 'Ψηφιακή φωτογραφία' }
    },
    {
      emoji: '☕', name: 'Καφετιέρα',
      desc: 'Βάζουμε νερό και καφέ και βγαίνει ζεστός καφές!',
      input: { emoji: '💧', text: 'Νερό & καφές' },
      process: { emoji: '☕', text: 'Ζεσταίνει & ανακατεύει' },
      output: { emoji: '☕', text: 'Ζεστός καφές' }
    }
  ];

  var current = 0;
  var score = 0;
  var totalCorrectThisRound = 0;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function startGame() {
    shuffle(machines);
    current = 0;
    score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
    showMachine();
  }

  var machine; // current machine
  var step = 0; // 0=input, 1=process, 2=output
  var parts = [];

  function showMachine() {
    if (current >= machines.length) {
      showResult();
      return;
    }
    machine = machines[current];
    step = 0;
    totalCorrectThisRound = 0;

    document.getElementById('machineEmoji').textContent = machine.emoji;
    document.getElementById('machineName').textContent = machine.name;
    document.getElementById('machineDesc').textContent = machine.desc;
    document.getElementById('roundDisplay').textContent = (current + 1) + '/' + machines.length;

    document.getElementById('inputEmoji').textContent = '❓';
    document.getElementById('inputDesc').textContent = 'Τι βάζουμε;';
    document.getElementById('processEmoji').textContent = '❓';
    document.getElementById('processDesc').textContent = 'Τι κάνει;';
    document.getElementById('outputEmoji').textContent = '❓';
    document.getElementById('outputDesc').textContent = 'Τι βγάζει;';

    for (var i = 0; i < 3; i++) {
      var row = document.getElementById('flowRow' + i);
      row.classList.remove('active-slot', 'filled-slot');
    }

    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';

    parts = [
      { label: 'Είσοδος', data: machine.input },
      { label: 'Επεξεργασία', data: machine.process },
      { label: 'Έξοδος', data: machine.output }
    ];

    buildChoices();
  }

  function buildChoices() {
    var area = document.getElementById('choicesArea');
    area.innerHTML = '';

    for (var i = 0; i < 3; i++) {
      var row = document.getElementById('flowRow' + i);
      row.classList.remove('active-slot', 'filled-slot');
      if (i < step) row.classList.add('filled-slot');
    }
    document.getElementById('flowRow' + step).classList.add('active-slot');

    var currentPart = parts[step];
    var stepNum = step + 1;
    document.getElementById('stepBadge').textContent = stepNum + '/3';

    var options = [
      currentPart.data,
      getRandomDistractor(step),
      getRandomDistractor(step)
    ];

    shuffle(options);

    for (var i = 0; i < options.length; i++) {
      (function(opt) {
        var chip = document.createElement('div');
        chip.className = 'choice-chip';
        chip.innerHTML = '<span class="chip-emoji">' + opt.emoji + '</span>' + opt.text;
        chip.addEventListener('click', function() {
          checkChoice(this, opt, currentPart);
        });
        area.appendChild(chip);
      })(options[i]);
    }
  }

  function getRandomDistractor(exceptStep) {
    var distractors = [
      { emoji: '⚽', text: 'Μπάλα' },
      { emoji: '📚', text: 'Βιβλία' },
      { emoji: '🎵', text: 'Μουσική' },
      { emoji: '✏️', text: 'Μολύβι' },
      { emoji: '🧸', text: 'Αρκουδάκι' },
      { emoji: '🎨', text: 'Χρώματα' },
      { emoji: '🌊', text: 'Νερό' },
      { emoji: '🏠', text: 'Σπίτι' },
      { emoji: '🌳', text: 'Δέντρο' },
      { emoji: '🚗', text: 'Αυτοκίνητο' }
    ];
    var idx = Math.floor(Math.random() * distractors.length);
    return distractors[idx];
  }

  function checkChoice(el, chosen, correctPart) {
    var chips = document.querySelectorAll('.choice-chip');
    for (var i = 0; i < chips.length; i++) chips[i].classList.add('disabled');

    var correct = (chosen.text === correctPart.data.text && chosen.emoji === correctPart.data.emoji);
    var fb = document.getElementById('feedback');

    if (correct) {
      el.classList.add('correct');
      totalCorrectThisRound++;

      if (step === 0) {
        document.getElementById('inputEmoji').textContent = machine.input.emoji;
        document.getElementById('inputDesc').textContent = machine.input.text;
      } else if (step === 1) {
        document.getElementById('processEmoji').textContent = machine.process.emoji;
        document.getElementById('processDesc').textContent = machine.process.text;
      } else if (step === 2) {
        document.getElementById('outputEmoji').textContent = machine.output.emoji;
        document.getElementById('outputDesc').textContent = machine.output.text;
      }

      step++;
      fb.className = 'feedback show yay';
      fb.textContent = '✅ Μπράβο! Συνέχισε!';

      setTimeout(function() {
        if (step >= 3) {
          score++;
          document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
          fb.textContent = '🎉 Τέλεια! Ξέρεις πώς λειτουργεί το ' + machine.name + '!';
          setTimeout(function() {
            current++;
            showMachine();
          }, 1200);
        } else {
          buildChoices();
        }
        fb.className = 'feedback';
        fb.style.display = 'none';
      }, 1000);
    } else {
      el.classList.add('wrong');
      fb.className = 'feedback show nay';
      fb.textContent = '❌ Ωχ! Αυτό δεν ταιριάζει. Προσπάθησε ξανά!';
      setTimeout(function() {
        for (var i = 0; i < chips.length; i++) chips[i].classList.remove('disabled');
        el.classList.remove('wrong');
        fb.className = 'feedback';
        fb.style.display = 'none';
      }, 1200);
    }
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var total = machines.length;
    var pct = score / total;
    var emoji, title, msg;
    if (pct === 1) {
      emoji = '🏆'; title = 'Τέλεια!';
      msg = 'Ξέρεις πώς λειτουργούν όλα τα μηχανήματα! Είσαι σούπερ!';
    } else if (pct >= 0.75) {
      emoji = '🎉'; title = 'Μπράβο!';
      msg = 'Τα πήγες πολύ καλά!';
    } else if (pct >= 0.5) {
      emoji = '👍'; title = 'Ωραία!';
      msg = 'Καλή προσπάθεια! Δοκίμασε ξανά!';
    } else {
      emoji = '💪'; title = 'Καλή αρχή!';
      msg = 'Προσπάθησε ξανά! Θα γίνεις ειδικός!';
    }
    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultMsg').textContent = 'Βρήκες ' + score + ' από ' + total + ' μηχανήματα σωστά! ' + msg;
  }

  startGame();
</script>
</body>
</html>
