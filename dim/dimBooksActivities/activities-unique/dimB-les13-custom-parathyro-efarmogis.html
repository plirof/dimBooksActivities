<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Παράθυρο Εφαρμογής 🪟</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #f093fb, #f5576c);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(245,87,108,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; }
  .header p { font-size: .9rem; opacity: .9; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #f5576c; }
  .round { font-size: 1rem; color: #888; }
  .window-visual {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 0; margin-bottom: 18px; overflow: hidden;
  }
  .win-titlebar {
    background: linear-gradient(135deg, #667eea, #764ba2);
    padding: 14px 18px; color: #fff; display: flex;
    justify-content: space-between; align-items: center;
  }
  .win-titlebar .win-title { font-size: 1rem; font-weight: 700; }
  .win-buttons { display: flex; gap: 8px; }
  .win-btn {
    width: 32px; height: 32px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.3); background: rgba(255,255,255,.1);
    display: flex; align-items: center; justify-content: center;
    font-size: .9rem; cursor: pointer; transition: background .2s;
  }
  .win-btn:active { background: rgba(255,255,255,.3); }
  .win-body {
    padding: 24px 20px; min-height: 120px; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .win-body .wb-emoji { font-size: 3.5rem; margin-bottom: 6px; }
  .win-body .wb-text { font-size: 1rem; color: #666; }

  .question-area {
    background: #fff9db; border: 2px dashed #f0c040; border-radius: 16px;
    padding: 16px; margin-bottom: 14px; text-align: center;
    font-size: 1.1rem; font-weight: 600; color: #6b5900;
  }

  .choices-grid { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 12px; margin-bottom: 14px; }
  .choice-card {
    background: #fff; border: 3px solid #e0e0e0; border-radius: 18px;
    padding: 18px 10px; text-align: center; cursor: pointer;
    transition: all .2s ease; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .choice-card:active { transform: scale(.95); }
  .choice-card .c-emoji { font-size: 2.5rem; margin-bottom: 4px; }
  .choice-card .c-name { font-size: .95rem; font-weight: 700; color: #2d3436; }
  .choice-card.correct { border-color: #28a745; background: #d4edda; animation: pop .4s ease; }
  .choice-card.wrong { border-color: #dc3545; background: #f8d7da; animation: shake .4s ease; }
  .choice-card.disabled { pointer-events: none; opacity: .7; }
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .feedback{text-align:center;padding:14px;border-radius:16px;font-size:1.1rem;font-weight:700;margin-bottom:12px;display:none}
  .feedback.show{display:block}
  .feedback.yay{background:#d4edda;color:#155724}
  .feedback.nay{background:#f8d7da;color:#721c24}
  .result-screen{background:#fff;border-radius:24px;box-shadow:0 8px 28px rgba(0,0,0,.1);padding:40px 24px;text-align:center;display:none}
  .result-screen .big-emoji{font-size:5rem;margin-bottom:12px}
  .result-screen h2{font-size:1.6rem;color:#2d3436;margin-bottom:8px}
  .result-screen p{font-size:1.1rem;color:#666;margin-bottom:20px}
  .btn-restart{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:16px;padding:14px 36px;font-size:1.2rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(102,126,234,.35)}
  .btn-restart:active{transform:scale(.95)}
  @media(max-width:480px){body{padding:8px}.header h1{font-size:1.2rem}}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .win-buttons > * + * { margin-left: 8px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🪟 Παράθυρο Εφαρμογής</h1>
    <p>Μάθε τα μέρη του παραθύρου!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/6</span>
  </div>
  <div id="gameArea">
    <div class="window-visual">
      <div class="win-titlebar">
        <span class="win-title" id="winTitle">Ζωγραφική</span>
        <div class="win-buttons">
          <span class="win-btn" id="btnMin">➖</span>
          <span class="win-btn" id="btnMax">⬜</span>
          <span class="win-btn" id="btnClose">❌</span>
        </div>
      </div>
      <div class="win-body">
        <div class="wb-emoji" id="wbEmoji">🎨</div>
        <div class="wb-text" id="wbText">Εδώ ζωγραφίζω!</div>
      </div>
    </div>

    <div class="question-area" id="questionText">
      ❓ Τι γράφει η μπλε μπάρα στο πάνω μέρος;
    </div>

    <div class="choices-grid" id="choicesGrid"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg"></p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var qs = [
    {
      title:'Ζωγραφική', wbEmoji:'🎨', wbText:'Εδώ ζωγραφίζω!',
      q:'Τι γράφει η μπλε μπάρα στο πάνω μέρος;',
      ans:0,
      choices:[{emoji:'📌',name:'Γραμμή Τίτλου'},{emoji:'📋',name:'Γραμμή Εργασιών'},{emoji:'📄',name:'Φάκελος'},{emoji:'🖱️',name:'Ποντίκι'}]
    },
    {
      title:'Ζωγραφική', wbEmoji:'🗂️', wbText:'Εδώ βλέπω τα αρχεία μου!',
      q:'Με τι σύρω το παράθυρο για να το μετακινήσω;',
      ans:0,
      choices:[{emoji:'📌',name:'Γραμμή Τίτλου'},{emoji:'⬜',name:'Κουμπί Μεγιστοποίησης'},{emoji:'❌',name:'Κουμπί Κλεισίματος'},{emoji:'➖',name:'Κουμπί Ελαχιστοποίησης'}]
    },
    {
      title:'Ζωγραφική', wbEmoji:'⬜', wbText:'Εδώ δουλεύω!',
      q:'Ποιο κουμπί κάνει το παράθυρο να γεμίσει όλη την οθόνη;',
      ans:1,
      choices:[{emoji:'📌',name:'Γραμμή Τίτλου'},{emoji:'⬜',name:'Κουμπί Μεγιστοποίησης'},{emoji:'❌',name:'Κουμπί Κλεισίματος'},{emoji:'➖',name:'Κουμπί Ελαχιστοποίησης'}]
    },
    {
      title:'Ζωγραφική', wbEmoji:'➖', wbText:'Εδώ δουλεύω!',
      q:'Ποιο κουμπί κρύβει το παράθυρο στη γραμμή εργασιών;',
      ans:3,
      choices:[{emoji:'⬜',name:'Κουμπί Μεγιστοποίησης'},{emoji:'📌',name:'Γραμμή Τίτλου'},{emoji:'❌',name:'Κουμπί Κλεισίματος'},{emoji:'➖',name:'Κουμπί Ελαχιστοποίησης'}]
    },
    {
      title:'Ζωγραφική', wbEmoji:'❌', wbText:'Εδώ δουλεύω!',
      q:'Ποιο κουμπί κλείνει τελείως το παράθυρο;',
      ans:2,
      choices:[{emoji:'➖',name:'Κουμπί Ελαχιστοποίησης'},{emoji:'⬜',name:'Κουμπί Μεγιστοποίησης'},{emoji:'❌',name:'Κουμπί Κλεισίματος'},{emoji:'📌',name:'Γραμμή Τίτλου'}]
    },
    {
      title:'Ζωγραφική', wbEmoji:'🖱️', wbText:'Εδώ δουλεύω!',
      q:'Τι κάνω στις γωνίες του παραθύρου για να το μεγαλώσω;',
      ans:0,
      choices:[{emoji:'✋',name:'Σύρω (drag)'},{emoji:'👆',name:'Κάνω κλικ'},{emoji:'👌',name:'Κάνω διπλό κλικ'},{emoji:'✌️',name:'Πατάω δύο δάχτυλα'}]
    }
  ];
  var cur=0,score=0;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function startGame(){
    shuffle(qs);cur=0;score=0;
    document.getElementById('scoreDisplay').textContent='⭐ 0';
    document.getElementById('gameArea').style.display='block';
    document.getElementById('resultScreen').style.display='none';
    showQ();
  }
  function showQ(){
    if(cur>=qs.length){showResult();return;}
    var q=qs[cur];
    document.getElementById('winTitle').textContent=q.title;
    document.getElementById('wbEmoji').textContent=q.wbEmoji;
    document.getElementById('wbText').textContent=q.wbText;
    document.getElementById('questionText').textContent=q.q;
    document.getElementById('roundDisplay').textContent=(cur+1)+'/'+qs.length;
    document.getElementById('feedback').className='feedback';document.getElementById('feedback').style.display='none';
    var g=document.getElementById('choicesGrid');g.innerHTML='';
    for(var i=0;i<q.choices.length;i++){
      (function(idx){
        var c=document.createElement('div');c.className='choice-card';
        c.setAttribute('data-idx',idx);
        c.innerHTML='<div class="c-emoji">'+q.choices[idx].emoji+'</div><div class="c-name">'+q.choices[idx].name+'</div>';
        c.addEventListener('click',function(){choose(this,q);});
        g.appendChild(c);
      })(i);
    }
  }
  function choose(el,q){
    var cards=document.querySelectorAll('.choice-card');
    for(var i=0;i<cards.length;i++)cards[i].classList.add('disabled');
    var chosen=parseInt(el.getAttribute('data-idx'));
    var correct=(chosen===q.ans);
    var fb=document.getElementById('feedback');
    if(correct){
      score++;document.getElementById('scoreDisplay').textContent='⭐ '+score;
      el.classList.add('correct');
      fb.className='feedback show yay';
      fb.textContent='✅ Μπράβο! Σωστά!';
    } else {
      el.classList.add('wrong');
      cards[q.ans].classList.add('correct');
      fb.className='feedback show nay';
      fb.textContent='❌ Ωχ! Η σωστή απάντηση είναι: '+q.choices[q.ans].name+'!';
    }
    setTimeout(function(){cur++;showQ();},1600);
  }
  function showResult(){
    document.getElementById('gameArea').style.display='none';
    document.getElementById('resultScreen').style.display='block';
    var total=qs.length,pct=score/total;
    var e,t,m;
    if(pct===1){e='🏆';t='Τέλεια!';m='Γνωρίζεις όλα τα μέρη του παραθύρου! Είσαι σούπερ!';}
    else if(pct>=0.75){e='🎉';t='Μπράβο!';m='Τα πήγες πολύ καλά!';}
    else if(pct>=0.5){e='👍';t='Ωραία!';m='Καλή προσπάθεια! Δοκίμασε ξανά!';}
    else{e='💪';t='Καλή αρχή!';m='Προσπάθησε ξανά! Θα γίνεις ειδικός!';}
    document.getElementById('resultEmoji').textContent=e;
    document.getElementById('resultTitle').textContent=t;
    document.getElementById('resultMsg').textContent='Βρήκες '+score+' από '+total+' σωστά! '+m;
  }
  startGame();
</script>
</body>
</html>
