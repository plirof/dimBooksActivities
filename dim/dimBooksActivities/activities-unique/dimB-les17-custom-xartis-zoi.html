<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Χτίσε τον Χάρτη των Ζώων 🐾</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #43e97b, #38f9d7);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(67,233,123,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; text-shadow: 1px 1px 2px rgba(0,0,0,.2); }
  .header p { font-size: .9rem; opacity: .95; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #43e97b; }
  .round { font-size: 1rem; color: #888; }
  .puzzle-title {
    text-align: center; font-size: 1rem; font-weight: 700;
    color: #2d3436; margin-bottom: 12px; background: #fff;
    border-radius: 14px; padding: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .tree-area {
    background: #fff; border-radius: 20px; padding: 18px 12px;
    margin-bottom: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.08);
    min-height: 160px;
  }
  .tree-row {
    display: flex; justify-content: center; gap: 12px; margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .tree-node {
    padding: 10px 16px; border-radius: 14px; font-weight: 700;
    font-size: .95rem; background: #e8f4fd; border: 3px solid #74b9ff;
    color: #2d3436; text-align: center; min-width: 60px;
  }
  .tree-node.root { background: #ffeaa7; border-color: #fdcb6e; font-size: 1.1rem; }
  .tree-node.link { background: #dfe6e9; border-color: #b2bec3; font-size: .85rem; color: #636e72; }
  .tree-node.blank {
    background: #fff; border: 3px dashed #bbb; color: #bbb;
    min-width: 100px; cursor: default; font-size: .95rem;
  }
  .tree-node.blank.filled {
    background: #d4edda; border-color: #28a745; color: #155724;
    border-style: solid; cursor: default; animation: pop .3s ease;
  }
  .tree-node.blank.wrong {
    background: #f8d7da; border-color: #dc3545; color: #721c24;
    animation: shake .4s ease;
  }
  .arrow-row { text-align: center; font-size: 1.3rem; color: #74b9ff; line-height: 1; margin-bottom: 4px; }
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .bank-area {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
    margin-bottom: 14px;
  }
  .bank-word {
    padding: 12px 20px; border-radius: 14px; font-weight: 700;
    font-size: 1rem; background: #fff; border: 3px solid #74b9ff;
    color: #2d3436; cursor: pointer; transition: all .2s ease;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .bank-word:active { transform: scale(.95); }
  .bank-word.used { opacity: .3; pointer-events: none; border-color: #ccc; }
  .feedback{text-align:center;padding:14px;border-radius:16px;font-size:1.1rem;font-weight:700;margin-bottom:12px;display:none}
  .feedback.show{display:block}
  .feedback.yay{background:#d4edda;color:#155724;border:2px solid #c3e6cb}
  .feedback.nay{background:#f8d7da;color:#721c24;border:2px solid #f5c6cb}
  .result-screen{background:#fff;border-radius:24px;box-shadow:0 8px 28px rgba(0,0,0,.1);padding:40px 24px;text-align:center;display:none}
  .result-screen .big-emoji{font-size:5rem;margin-bottom:12px}
  .result-screen h2{font-size:1.6rem;color:#2d3436;margin-bottom:8px}
  .result-screen p{font-size:1.1rem;color:#666;margin-bottom:20px}
  .btn-restart{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#fff;border:none;border-radius:16px;padding:14px 36px;font-size:1.2rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(67,233,123,.35)}
  .btn-restart:active{transform:scale(.95)}
  @media(max-width:480px){body{padding:8px}.header h1{font-size:1.2rem}.tree-node{font-size:.85rem;padding:8px 12px}}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .tree-row > * { margin: 6px; }
  .bank-area > * { margin: 5px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🐾 Χτίσε τον Χάρτη των Ζώων</h1>
    <p>Βάλε τις λέξεις στη σωστή θέση!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/4</span>
  </div>
  <div class="puzzle-title" id="puzzleTitle">Ζώα — Κατοικίδια και Δάσος</div>
  <div id="gameArea">
    <div class="tree-area" id="treeArea"></div>
    <div class="bank-area" id="bankArea"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg"></p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var puzzles = [
    {
      title:'Ζώα — χωρίζονται σε δύο κατηγορίες',
      rows:[
        [{text:'Ζώα', cls:'root'}],
        ['arr'],
        [{text:'χωρίζονται σε', cls:'link'}],
        ['arr2'],
        [{text:'?', cls:'blank'},{text:'?', cls:'blank'}]
      ],
      answers:['Κατοικίδια','Ζώα του Δάσους']
    },
    {
      title:'Κατοικίδια — όπως...',
      rows:[
        [{text:'Κατοικίδια', cls:'root'}],
        ['arr'],
        [{text:'όπως', cls:'link'}],
        ['arr2'],
        [{text:'?', cls:'blank'},{text:'?', cls:'blank'}]
      ],
      answers:['Σκύλος','Γάτα']
    },
    {
      title:'Ζώα του Δάσους — όπως...',
      rows:[
        [{text:'Ζώα του Δάσους', cls:'root'}],
        ['arr'],
        [{text:'όπως', cls:'link'}],
        ['arr2'],
        [{text:'?', cls:'blank'},{text:'?', cls:'blank'}]
      ],
      answers:['Αλεπού','Ελάφι']
    },
    {
      title:'Ένωσε όλες τις γνώσεις!',
      rows:[
        [{text:'Ζώα', cls:'root'}],
        ['arr'],
        [{text:'χωρίζονται σε', cls:'link'}],
        ['arr2'],
        [{text:'Κατοικίδια', cls:'filled'},{text:'Ζώα του Δάσους', cls:'filled'}],
        ['arr2_2'],
        [{text:'?', cls:'blank'},{text:'?', cls:'blank'},{text:'?', cls:'blank'},{text:'?', cls:'blank'}]
      ],
      answers:['Σκύλος','Γάτα','Αλεπού','Ελάφι']
    }
  ];
  var cur=0,score=0;
  var blankOrder=[],blankIdx=0;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function startGame(){
    shuffle(puzzles);cur=0;score=0;
    document.getElementById('scoreDisplay').textContent='⭐ 0';
    document.getElementById('gameArea').style.display='block';
    document.getElementById('resultScreen').style.display='none';
    showPuzzle();
  }
  function showPuzzle(){
    if(cur>=puzzles.length){showResult();return;}
    var p=puzzles[cur];
    document.getElementById('puzzleTitle').textContent='🧩 '+p.title;
    document.getElementById('roundDisplay').textContent=(cur+1)+'/'+puzzles.length;
    document.getElementById('feedback').className='feedback';document.getElementById('feedback').style.display='none';
    blankOrder=[];blankIdx=0;
    for(var r=0;r<p.rows.length;r++){
      var row=p.rows[r];
      if(typeof row[0]==='string')continue;
      for(var c=0;c<row.length;c++){
        if(row[c].cls==='blank')blankOrder.push({r:r,c:c});
      }
    }
    render(p);
  }
  function render(p){
    var tree=document.getElementById('treeArea');tree.innerHTML='';
    for(var r=0;r<p.rows.length;r++){
      var row=p.rows[r];
      if(typeof row[0]==='string'){
        var arrDiv=document.createElement('div');arrDiv.className='arrow-row';
        if(row[0]==='arr')arrDiv.textContent='⬇';
        else if(row[0]==='arr2')arrDiv.textContent='↙       ↘';
        else if(row[0]==='arr2_2')arrDiv.textContent='↙   ↘   ↙   ↘';
        tree.appendChild(arrDiv);
        continue;
      }
      var rowDiv=document.createElement('div');rowDiv.className='tree-row';
      for(var c=0;c<row.length;c++){
        var cell=document.createElement('div');
        cell.className='tree-node';
        if(row[c].cls==='blank'){
          cell.classList.add('blank');
          cell.textContent='❓';
          cell.setAttribute('data-blank-idx',blankOrder.findIndex(function(b){return b.r===r&&b.c===c}));
        } else if(row[c].cls==='filled'||row[c].cls==='root'||row[c].cls==='link'){
          cell.classList.add(row[c].cls);
          cell.textContent=row[c].text;
        } else {
          cell.classList.add(row[c].cls||'');
          cell.textContent=row[c].text;
        }
        rowDiv.appendChild(cell);
      }
      tree.appendChild(rowDiv);
    }
    var bank=document.getElementById('bankArea');bank.innerHTML='';
    var usedCount=0;
    for(var i=0;i<p.answers.length;i++){
      (function(idx){
        var w=document.createElement('div');w.className='bank-word';
        w.textContent=p.answers[idx];
        var isUsed=false;
        for(var j=0;j<blankIdx;j++){if(blankOrder[j]&&blankOrder[j]._val===p.answers[idx]){isUsed=true;break;}}
        if(isUsed){w.classList.add('used');usedCount++;}
        w.addEventListener('click',function(){pickWord(this,p);});
        bank.appendChild(w);
      })(i);
    }
  }
  function pickWord(el,p){
    if(el.classList.contains('used'))return;
    if(blankIdx>=blankOrder.length)return;
    var blank=blankOrder[blankIdx];
    blank._val=el.textContent;
    blankIdx++;
    el.classList.add('used');
    updateTree(p);
    if(blankIdx===blankOrder.length){
      checkAnswers(p);
    }
  }
  function updateTree(p){
    var nodes=document.querySelectorAll('.tree-node.blank');
    for(var i=0;i<nodes.length;i++){
      var idx=parseInt(nodes[i].getAttribute('data-blank-idx'));
      var blank=blankOrder[idx];
      if(blank&&blank._val){
        nodes[i].textContent=blank._val;
        nodes[i].classList.add('filled');
      } else {
        nodes[i].textContent='❓';
        nodes[i].classList.remove('filled');
      }
    }
    var bank=document.getElementById('bankArea');
    var words=bank.querySelectorAll('.bank-word');
    for(var i=0;i<words.length;i++){
      words[i].classList.remove('used');
      for(var j=0;j<blankIdx;j++){
        if(blankOrder[j]._val===words[i].textContent){words[i].classList.add('used');break;}
      }
    }
  }
  function checkAnswers(p){
    var correct=true;
    var given=[];
    for(var i=0;i<blankOrder.length;i++){given.push(blankOrder[i]._val);}
    given.sort();
    var expected=p.answers.slice().sort();
    for(var i=0;i<given.length;i++){if(given[i]!==expected[i]){correct=false;break;}}
    var fb=document.getElementById('feedback');
    if(correct){
      score++;document.getElementById('scoreDisplay').textContent='⭐ '+score;
      fb.className='feedback show yay';
      fb.textContent='✅ Μπράβο! Έφτιαξες τον χάρτη!';
      setTimeout(function(){cur++;showPuzzle();},1500);
    } else {
      fb.className='feedback show nay';
      fb.textContent='❌ Ωχ! Η θέση δεν είναι σωστή. Δοκίμασε ξανά!';
      blankIdx=0;
      setTimeout(function(){
        showPuzzle();
      },1800);
    }
  }
  function showResult(){
    document.getElementById('gameArea').style.display='none';
    document.getElementById('resultScreen').style.display='block';
    var total=puzzles.length,pct=score/total;
    var e,t,m;
    if(pct===1){e='🏆';t='Τέλεια!';m='Ξέρεις να φτιάχνεις εννοιολογικούς χάρτες! Είσαι σούπερ!';}
    else if(pct>=0.75){e='🎉';t='Μπράβο!';m='Τα πήγες πολύ καλά με τους χάρτες!';}
    else if(pct>=0.5){e='👍';t='Ωραία!';m='Καλή προσπάθεια! Συνέχισε!';}
    else{e='💪';t='Καλή αρχή!';m='Προσπάθησε ξανά!';}
    document.getElementById('resultEmoji').textContent=e;
    document.getElementById('resultTitle').textContent=t;
    document.getElementById('resultMsg').textContent='Βρήκες '+score+' από '+total+' σωστά! '+m;
  }
  startGame();
</script>
</body>
</html>
