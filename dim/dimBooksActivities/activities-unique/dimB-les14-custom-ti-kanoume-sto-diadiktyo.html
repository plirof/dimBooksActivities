<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Τι κάνουμε στο διαδίκτυο; 🌐</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(17,153,142,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; }
  .header p { font-size: .9rem; opacity: .9; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #11998e; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fff9db; border: 2px dashed #f0c040; border-radius: 16px;
    padding: 14px; margin-bottom: 14px; text-align: center;
    font-size: 1rem; line-height: 1.5; color: #6b5900;
  }
  .service-card {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 24px 20px; margin-bottom: 18px; text-align: center;
  }
  .service-emoji { font-size: 4rem; margin-bottom: 8px; }
  .service-name { font-size: 1.3rem; font-weight: 700; color: #2d3436; margin-bottom: 6px; }
  .service-desc { font-size: 1rem; color: #666; line-height: 1.5; }
  .match-area {
    display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px;
  }
  .match-row {
    display: flex; align-items: center; gap: 10px;
    background: #f8f9ff; border-radius: 14px; padding: 12px 14px;
  }
  .match-label {
    font-size: .85rem; font-weight: 700; min-width: 80px;
    padding: 6px 10px; border-radius: 10px; text-align: center;
    color: #fff; flex-shrink: 0;
  }
  .label-what { background: #11998e; }
  .label-example { background: #764ba2; }
  .match-emoji { font-size: 1.5rem; }
  .match-text { font-size: 1rem; font-weight: 600; color: #2d3436; }
  .choices-area { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 14px; }
  .choice-chip {
    background: #fff; border: 3px solid #e0e0e0; border-radius: 16px;
    padding: 12px 16px; cursor: pointer; transition: all .2s ease;
    user-select: none; -webkit-tap-highlight-color: transparent;
    font-size: 1rem; font-weight: 600; text-align: center; min-width: 80px;
  }
  .choice-chip:active { transform: scale(.93); }
  .choice-chip .chip-emoji { font-size: 1.6rem; display: block; margin-bottom: 2px; }
  .choice-chip.correct { border-color: #28a745; background: #d4edda; animation: pop .4s ease; }
  .choice-chip.wrong { border-color: #dc3545; background: #f8d7da; animation: shake .4s ease; }
  .choice-chip.disabled { pointer-events: none; opacity: .6; }
  .choice-chip.reveal { border-color: #28a745; background: #d4edda; }
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .step-badge{display:inline-block;background:#11998e;color:#fff;border-radius:50%;width:34px;height:34px;line-height:34px;text-align:center;font-weight:700;font-size:.9rem;margin-bottom:10px}
  .feedback{text-align:center;padding:14px;border-radius:16px;font-size:1.1rem;font-weight:700;margin-bottom:14px;display:none}
  .feedback.show{display:block}
  .feedback.yay{background:#d4edda;color:#155724;border:2px solid #c3e6cb}
  .feedback.nay{background:#f8d7da;color:#721c24;border:2px solid #f5c6cb}
  .result-screen{background:#fff;border-radius:24px;box-shadow:0 8px 28px rgba(0,0,0,.1);padding:40px 24px;text-align:center;display:none}
  .result-screen .big-emoji{font-size:5rem;margin-bottom:12px}
  .result-screen h2{font-size:1.6rem;color:#2d3436;margin-bottom:8px}
  .result-screen p{font-size:1.1rem;color:#666;margin-bottom:20px}
  .btn-restart{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;border:none;border-radius:16px;padding:14px 36px;font-size:1.2rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(17,153,142,.35)}
  .btn-restart:active{transform:scale(.95)}
  @media(max-width:480px){body{padding:8px}.header h1{font-size:1.2rem}.service-emoji{font-size:3rem}}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .match-area > * + * { margin-top: 10px; }
  .match-row > * + * { margin-left: 10px; }
  .choices-area > * { margin: 5px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🌐 Τι κάνουμε στο διαδίκτυο;</h1>
    <p>Μάθε τις υπηρεσίες του διαδικτύου!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/3</span>
  </div>
  <div class="instructions">
    Το <strong>διαδίκτυο</strong> (internet) είναι ένα μεγάλο δίκτυο υπολογιστών.<br>
    Ο <strong>παγκόσμιος ιστός</strong> (Web) είναι μέσα στο διαδίκτυο.
  </div>
  <div id="gameArea">
    <div class="service-card">
      <div class="service-emoji" id="svcEmoji">🌐</div>
      <div class="service-name" id="svcName">Παγκόσμιος Ιστός (Web)</div>
      <div class="service-desc" id="svcDesc">Βρίσκω πληροφορίες και ιστοσελίδες</div>
    </div>

    <div class="match-area" id="matchArea">
      <div class="match-row"><span class="match-label label-what">🔍 Τι είναι</span><span class="match-emoji" id="matchWhatEmoji">❓</span><span class="match-text" id="matchWhatText">;;;</span></div>
      <div class="match-row"><span class="match-label label-example">💡 Παράδειγμα</span><span class="match-emoji" id="matchExampleEmoji">❓</span><span class="match-text" id="matchExampleText">;;;</span></div>
    </div>

    <div class="step-badge" id="stepBadge">1/2</div>
    <div class="choices-area" id="choicesArea"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg"></p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var services = [
    {
      emoji:'🌐', name:'Παγκόσμιος Ιστός (Web)', desc:'Βρίσκω πληροφορίες, βλέπω ιστοσελίδες, παίζω διαδραστικά παιχνίδια',
      what: { emoji:'🌐', text:'Υπηρεσία του διαδικτύου με ιστοσελίδες' },
      example: { emoji:'🔍', text:'Ψάχνω στο Google για πληροφορίες' }
    },
    {
      emoji:'📹', name:'Βιντεοκλήση', desc:'Μιλάω και βλέπω τους φίλους μου από μακριά!',
      what: { emoji:'📹', text:'Τηλεδιάσκεψη με φωνή και εικόνα' },
      example: { emoji:'👋', text:'Μιλάω με τον μπαμπά που λείπει ταξίδι' }
    },
    {
      emoji:'📧', name:'Ηλεκτρονικό Ταχυδρομείο (email)', desc:'Στέλνω μηνύματα με αρχεία σε φίλους!',
      what: { emoji:'📧', text:'Ψηφιακά μηνύματα με αρχεία' },
      example: { emoji:'📎', text:'Στέλνω τη ζωγραφιά μου στη γιαγιά' }
    },
    {
      emoji:'💬', name:'Συνομιλία (Chat)', desc:'Μιλάω με κείμενο με τους φίλους μου!',
      what: { emoji:'💬', text:'Γραπτή συνομιλία σε ομάδα ή έναν φίλο' },
      example: { emoji:'👋', text:'Στέλνω "Γεια!" στην παρέα μου' }
    }
  ];
  var cur=0,score=0,step=0,parts=[];
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function startGame(){
    shuffle(services);cur=0;score=0;
    document.getElementById('scoreDisplay').textContent='⭐ 0';
    document.getElementById('gameArea').style.display='block';
    document.getElementById('resultScreen').style.display='none';
    showSvc();
  }
  function showSvc(){
    if(cur>=services.length){showResult();return;}
    var s=services[cur];step=0;
    document.getElementById('svcEmoji').textContent=s.emoji;
    document.getElementById('svcName').textContent=s.name;
    document.getElementById('svcDesc').textContent=s.desc;
    document.getElementById('roundDisplay').textContent=(cur+1)+'/'+services.length;
    document.getElementById('matchWhatEmoji').textContent='❓';document.getElementById('matchWhatText').textContent=';;;';
    document.getElementById('matchExampleEmoji').textContent='❓';document.getElementById('matchExampleText').textContent=';;;';
    document.getElementById('feedback').className='feedback';document.getElementById('feedback').style.display='none';
    parts=[{label:'Τι είναι',data:s.what},{label:'Παράδειγμα',data:s.example}];
    buildChoices();
  }
  function buildChoices(){
    var area=document.getElementById('choicesArea');area.innerHTML='';
    var currentPart=parts[step];
    document.getElementById('stepBadge').textContent=(step+1)+'/2';
    var distractors=[
      {emoji:'🎵',text:'Ακούω μουσική'},{emoji:'📷',text:'Βγάζω φωτογραφία'},{emoji:'✏️',text:'Γράφω στο τετράδιο'},
      {emoji:'🏀',text:'Παίζω μπάλα'},{emoji:'📚',text:'Διαβάζω βιβλίο'},{emoji:'🧮',text:'Κάνω αριθμητική'},
      {emoji:'🚲',text:'Κάνω ποδήλατο'},{emoji:'🎨',text:'Ζωγραφίζω σε χαρτί'}
    ];
    var opts=[currentPart.data,distractors[Math.floor(Math.random()*distractors.length)],distractors[Math.floor(Math.random()*distractors.length)]];
    shuffle(opts);
    for(var i=0;i<opts.length;i++){
      (function(opt){
        var chip=document.createElement('div');chip.className='choice-chip';
        chip.innerHTML='<span class="chip-emoji">'+opt.emoji+'</span>'+opt.text;
        chip.addEventListener('click',function(){check(this,opt,currentPart);});
        area.appendChild(chip);
      })(opts[i]);
    }
  }
  function check(el,chosen,correctPart){
    var chips=document.querySelectorAll('.choice-chip');
    for(var i=0;i<chips.length;i++)chips[i].classList.add('disabled');
    var correct=(chosen.text===correctPart.data.text&&chosen.emoji===correctPart.data.emoji);
    var fb=document.getElementById('feedback');
    if(correct){
      el.classList.add('correct');
      if(step===0){document.getElementById('matchWhatEmoji').textContent=services[cur].what.emoji;document.getElementById('matchWhatText').textContent=services[cur].what.text;}
      else if(step===1){document.getElementById('matchExampleEmoji').textContent=services[cur].example.emoji;document.getElementById('matchExampleText').textContent=services[cur].example.text;}
      step++;
      fb.className='feedback show yay';fb.textContent='✅ Μπράβο!';
      setTimeout(function(){
        if(step>=2){score++;document.getElementById('scoreDisplay').textContent='⭐ '+score;fb.textContent='🎉 Τέλεια! Ξέρεις το '+services[cur].name+'!';setTimeout(function(){cur++;showSvc();},1200);}
        else{buildChoices();}
        fb.className='feedback';fb.style.display='none';
      },1000);
    } else {
      el.classList.add('wrong');
      fb.className='feedback show nay';fb.textContent='❌ Ωχ! Αυτό δεν ταιριάζει. Προσπάθησε ξανά!';
      setTimeout(function(){
        for(var i=0;i<chips.length;i++)chips[i].classList.remove('disabled');
        el.classList.remove('wrong');fb.className='feedback';fb.style.display='none';
      },1200);
    }
  }
  function showResult(){
    document.getElementById('gameArea').style.display='none';
    document.getElementById('resultScreen').style.display='block';
    var total=services.length,pct=score/total;
    var e,t,m;
    if(pct===1){e='🏆';t='Τέλεια!';m='Γνωρίζεις όλες τις υπηρεσίες του διαδικτύου! Είσαι σούπερ!';}
    else if(pct>=0.75){e='🎉';t='Μπράβο!';m='Τα πήγες πολύ καλά!';}
    else if(pct>=0.5){e='👍';t='Ωραία!';m='Καλή προσπάθεια! Δοκίμασε ξανά!';}
    else{e='💪';t='Καλή αρχή!';m='Προσπάθησε ξανά! Θα γίνεις ειδικός!';}
    document.getElementById('resultEmoji').textContent=e;
    document.getElementById('resultTitle').textContent=t;
    document.getElementById('resultMsg').textContent='Βρήκες '+score+' από '+total+' υπηρεσίες σωστά! '+m;
  }
  startGame();
</script>
</body>
</html>
