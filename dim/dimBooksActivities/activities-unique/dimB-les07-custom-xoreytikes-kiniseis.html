<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Χορευτικές Κινήσεις 💃</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #a18cd1, #fbc2eb);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(161,140,209,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; }
  .header p { font-size: .9rem; opacity: .85; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #a18cd1; }
  .level { font-size: 1rem; color: #888; }
  .instruction {
    background: #fff; border-radius: 20px; padding: 16px 18px;
    margin-bottom: 14px; text-align: center; font-size: 1rem;
    font-weight: 700; color: #2d3436;
    box-shadow: 0 4px 14px rgba(0,0,0,.08); line-height: 1.5;
  }
  .dance-floor {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 24px 16px; margin-bottom: 14px;
    text-align: center;
  }
  .dancer-area { font-size: 5rem; margin-bottom: 6px; }
  .dancer-area .dancer-main { display: inline-block; transition: all .3s; }
  .dancer-area .dancer-main.spin-right { transform: rotate(20deg); }
  .dancer-area .dancer-main.spin-left { transform: rotate(-20deg); }
  .dancer-area .dancer-main.jump-up { transform: translateY(-20px); }
  .dancer-area .dancer-main.move-right { transform: translateX(30px); }
  .dancer-area .dancer-main.move-left { transform: translateX(-30px); }
  .dancer-area .dancer-main.wave { animation: wave .6s ease; }
  @keyframes wave {
    0%{transform:rotate(0deg)}25%{transform:rotate(15deg)}50%{transform:rotate(-15deg)}75%{transform:rotate(10deg)}100%{transform:rotate(0deg)}
  }
  .dance-status { font-size: .9rem; color: #888; margin-bottom: 8px; }
  .pattern-builder {
    background: #fff; border-radius: 20px;
    box-shadow: 0 4px 14px rgba(0,0,0,.08);
    padding: 16px; margin-bottom: 14px;
  }
  .pattern-builder h3 { font-size: .9rem; color: #888; margin-bottom: 8px; text-align: center; }
  .cmd-pool {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 12px;
  }
  .cmd-btn {
    background: #fff3e0; border: 2px solid #ffcc80; border-radius: 12px;
    padding: 8px 14px; font-size: 1rem; font-weight: 600; color: #e65100;
    cursor: pointer; transition: all .15s; font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .cmd-btn:active { transform: scale(.93); }
  .cmd-btn.used { opacity: .3; pointer-events: none; }
  .cmd-btn.selected-btn { border-color: #a18cd1; background: #ede7f6; color: #512da8; }
  .pattern-slots {
    display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
    min-height: 50px; padding: 8px;
    background: #fafafa; border-radius: 12px; border: 2px dashed #ddd;
  }
  .pattern-slot {
    background: #e8f5e9; border: 2px solid #a5d6a7;
    border-radius: 10px; padding: 6px 12px;
    font-size: 1rem; font-weight: 600; color: #2e7d32;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .pattern-slot .del-btn {
    cursor: pointer; color: #d32f2f; font-size: .9rem; margin-left: 2px;
  }
  .pattern-slot.empty-slot {
    background: transparent; border: 2px dashed #ddd; color: #ccc;
  }
  .repeat-row {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin: 10px 0;
  }
  .repeat-row label { font-size: .95rem; font-weight: 600; color: #888; }
  .repeat-row .r-btn {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid #e8e8e8; background: #fff;
    font-size: 1.1rem; font-weight: 700; cursor: pointer;
    transition: all .15s; font-family: inherit;
    -webkit-tap-highlight-color: transparent; color: #a18cd1;
  }
  .repeat-row .r-btn:active { transform: scale(.9); }
  .repeat-row .r-btn.active { border-color: #a18cd1; background: #ede7f6; }
  .repeat-row .r-val { font-size: 1.6rem; font-weight: 700; color: #a18cd1; min-width: 30px; text-align: center; }
  .btn-dance-it {
    background: linear-gradient(135deg, #a18cd1, #fbc2eb); color: #fff;
    border: none; border-radius: 16px; padding: 10px 28px;
    font-size: 1.1rem; font-weight: 700; cursor: pointer;
    font-family: inherit; display: block; margin: 8px auto 0;
    box-shadow: 0 4px 14px rgba(161,140,209,.35); transition: transform .15s;
  }
  .btn-dance-it:active { transform: scale(.95); }
  .btn-dance-it:disabled { opacity: .5; pointer-events: none; }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; display: none;
  }
  .feedback.show { display: block; }
  .feedback.yay { background: #d4edda; color: #155724; }
  .feedback.nay { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #a18cd1, #fbc2eb); color: #fff;
    border: none; border-radius: 16px; padding: 14px 36px;
    font-size: 1.2rem; font-weight: 700; cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(161,140,209,.35); transition: transform .15s;
  }
  .btn-restart:active { transform: scale(.95); }
  @media (max-width:480px) {
    body { padding: 8px; }
    .header h1 { font-size: 1.2rem; }
    .dancer-area { font-size: 4rem; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .cmd-pool > * { margin: 4px; }
  .pattern-slots > * { margin: 3px; }
  .pattern-slot > * + * { margin-left: 4px; }
  .repeat-row > * + * { margin-left: 12px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>💃 Χορευτικές Κινήσεις</h1>
    <p>Φτιάξε ένα μοτίβο χορού για τον χαρακτήρα σου!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="level" id="levelDisplay">1/6</span>
  </div>
  <div id="gameArea">
    <div class="instruction">🎵 Διάλεξε κινήσεις και βάλες τες σε σειρά! Μετά πάτα «Χόρεψε!»</div>
    <div class="dance-floor">
      <div class="dancer-area"><span class="dancer-main" id="dancerChar">💃</span></div>
      <div class="dance-status" id="danceStatus">✨ Χόρεψε!</div>
    </div>
    <div class="pattern-builder">
      <h3>🧱 Το μοτίβο κίνησης:</h3>
      <div class="pattern-slots" id="patternSlots"></div>
      <div class="repeat-row">
        <label>🔁 Επανάλαβε:</label>
        <button class="r-btn" data-r="1">1</button>
        <button class="r-btn active" data-r="2">2</button>
        <button class="r-btn" data-r="3">3</button>
        <button class="r-btn" data-r="4">4</button>
      </div>
      <button class="btn-dance-it" id="btnDance" onclick="doDance()">🎵 Χόρεψε!</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var allMoves = [
    { emoji: '➡️', name: 'Δεξιά', cls: 'move-right' },
    { emoji: '⬅️', name: 'Αριστερά', cls: 'move-left' },
    { emoji: '⬆️', name: 'Πήδα', cls: 'jump-up' },
    { emoji: '🔄', name: 'Στρίψε δεξιά', cls: 'spin-right' },
    { emoji: '🔄', name: 'Στρίψε αριστερά', cls: 'spin-left' },
    { emoji: '👋', name: 'Κύμα', cls: 'wave' }
  ];
  var levels = [
    { moves: ['⬆️','⬆️','⬆️'], repeatTarget: 2 },
    { moves: ['➡️','⬅️','➡️','⬅️'], repeatTarget: 2 },
    { moves: ['⬆️','👋','⬆️','👋'], repeatTarget: 2 },
    { moves: ['🔄','⬆️','🔄'], repeatTarget: 3 },
    { moves: ['➡️','⬆️','⬅️','⬆️'], repeatTarget: 2 },
    { moves: ['👋','🔄','⬆️','👋'], repeatTarget: 2 }
  ];
  var cur=0, score=0, chosenRepeat=2;
  var placedMoves=[];

  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function startGame(){shuffle(levels);cur=0;score=0;
    document.getElementById('scoreDisplay').textContent='⭐ 0';
    document.getElementById('gameArea').style.display='block';
    document.getElementById('resultScreen').style.display='none';
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    document.getElementById('dancerChar').textContent='💃';
    setupControls();loadLevel();}
  function setupControls(){
    var btns=document.querySelectorAll('.r-btn');
    for(var i=0;i<btns.length;i++){
      (function(b){b.addEventListener('click',function(){
        for(var j=0;j<btns.length;j++)btns[j].classList.remove('active');
        b.classList.add('active');chosenRepeat=parseInt(b.getAttribute('data-r'));
      });})(btns[i]);
    }
  }
  function findMove(emoji){
    for(var i=0;i<allMoves.length;i++) if(allMoves[i].emoji===emoji) return allMoves[i];
    return null;
  }
  function loadLevel(){
    if(cur>=levels.length){showResult();return;}
    var lv=levels[cur];
    document.getElementById('levelDisplay').textContent=(cur+1)+'/'+levels.length;
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    document.getElementById('btnDance').disabled=false;
    document.getElementById('dancerChar').textContent='💃';
    document.getElementById('danceStatus').textContent='✨ Χόρεψε!';
    placedMoves=lv.moves.slice();
    renderSlots();
    renderCmdPool();
  }
  function renderSlots(){
    var slots=document.getElementById('patternSlots');
    slots.innerHTML='';
    for(var i=0;i<placedMoves.length;i++){
      var span=document.createElement('span');
      span.className='pattern-slot';
      var move=findMove(placedMoves[i]);
      span.innerHTML=(move?move.emoji:placedMoves[i])+' <span class="del-btn" data-idx="'+i+'">✕</span>';
      span.querySelector('.del-btn').addEventListener('click',function(e){
        var idx=parseInt(e.target.getAttribute('data-idx'));
        placedMoves.splice(idx,1);
        renderSlots();renderCmdPool();
        document.getElementById('feedback').className='feedback';
        document.getElementById('feedback').style.display='none';
      });
      slots.appendChild(span);
    }
    if(placedMoves.length===0){
      slots.innerHTML='<span class="pattern-slot empty-slot">➕ Βάλε κινήσεις εδώ</span>';
    }
  }
  function renderCmdPool(){
    var pool=document.getElementById('cmdPool');
    if(!pool){pool=document.createElement('div');pool.className='cmd-pool';pool.id='cmdPool';
      var pb=document.querySelector('.pattern-builder');
      pb.insertBefore(pool, document.getElementById('patternSlots'));
    }
    pool.innerHTML='<div style="font-size:.85rem;color:#aaa;margin-bottom:4px;width:100%;">Διάλεξε κίνηση:</div>';
    for(var i=0;i<allMoves.length;i++){
      (function(idx){
        var btn=document.createElement('button');
        btn.className='cmd-btn';
        btn.textContent=allMoves[idx].emoji+' '+allMoves[idx].name;
        btn.addEventListener('click',function(){
          placedMoves.push(allMoves[idx].emoji);
          renderSlots();renderCmdPool();
          document.getElementById('feedback').className='feedback';
          document.getElementById('feedback').style.display='none';
        });
        pool.appendChild(btn);
      })(i);
    }
  }
  function doDance(){
    var lv=levels[cur]; var fb=document.getElementById('feedback');
    document.getElementById('btnDance').disabled=true;
    var correctMoves=true;
    if(placedMoves.length!==lv.moves.length){correctMoves=false;}
    else{for(var i=0;i<lv.moves.length;i++){if(placedMoves[i]!==lv.moves[i]){correctMoves=false;break;}}}
    var correctRepeat=(chosenRepeat===lv.repeatTarget);
    if(correctMoves && correctRepeat){
      score++; document.getElementById('scoreDisplay').textContent='⭐ '+score;
      fb.className='feedback show yay';
      fb.textContent='✅ Μπράβο! Σωστό μοτίβο χορού! Χόρεψες υπέροχα!';
      var dc=document.getElementById('dancerChar');
      dc.textContent='💃';
      dc.className='dancer-main';
      void dc.offsetWidth;
      dc.className='dancer-main wave';
      document.getElementById('danceStatus').textContent='🎉 Υπέροχος χορός!';
      setTimeout(function(){cur++;loadLevel();},1800);
    }else{
      var msg='❌ ';
      if(!correctMoves) msg+='Λάθος κινήσεις! ';
      if(!correctRepeat) msg+='Θέλει '+lv.repeatTarget+' επαναλήψεις (όχι '+chosenRepeat+')!';
      fb.className='feedback show nay';
      fb.textContent=msg;
      setTimeout(function(){fb.className='feedback';fb.style.display='none';
        document.getElementById('btnDance').disabled=false;},1500);
    }
  }
  function showResult(){
    document.getElementById('gameArea').style.display='none';
    document.getElementById('resultScreen').style.display='block';
    var total=levels.length; var pct=score/total;
    var emoji,title,msg;
    if(pct===1){emoji='🏆';title='Τέλεια!';msg='Έφτιαξες όλους τους χορούς! Είσαι αστέρι!';}
    else if(pct>=0.75){emoji='🎉';title='Μπράβο!';msg='Χόρεψες σχεδόν όλους τους χορούς!';}
    else if(pct>=0.5){emoji='👍';title='Ωραία!';msg='Καλή προσπάθεια! Συνέχισε να χορεύεις!';}
    else{emoji='💪';title='Καλή αρχή!';msg='Προσπάθησε ξανά! Θα γίνεις σούπερ χορευτής!';}
    document.getElementById('resultEmoji').textContent=emoji;
    document.getElementById('resultTitle').textContent=title;
    document.getElementById('resultMsg').textContent='Βρήκες '+score+' από '+total+' σωστά! '+msg;
  }
  startGame();
</script>
</body>
</html>
