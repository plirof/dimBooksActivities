<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Περιήγηση: Καρτέλες & Σελιδοδείκτες | Μάθημα 20</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#4facfe 0%,#00f2fe 50%,#43e97b 100%);
  padding:12px;display:flex;flex-direction:column;align-items:center;
}
h1{color:#fff;font-size:1.6rem;text-align:center;text-shadow:2px 2px 6px rgba(0,0,0,.3);margin:8px 0 4px;}
.subtitle{color:#fffde7;font-size:.95rem;text-align:center;margin-bottom:12px;text-shadow:1px 1px 3px rgba(0,0,0,.2);}
.container{
  background:#fff;border-radius:20px;
  box-shadow:0 10px 40px rgba(0,0,0,.22);
  max-width:800px;width:100%;padding:16px;overflow:hidden;
}
.tasks-bar{
  background:linear-gradient(90deg,#e3f2fd,#bbdefb);border-radius:12px;
  padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.tasks-bar .tasks-title{font-weight:700;color:#1565c0;font-size:.9rem;}
.task-check{display:flex;align-items:center;gap:4px;font-size:.8rem;color:#555;}
.task-check .chk{
  width:22px;height:22px;border-radius:6px;border:2px solid #aaa;
  display:flex;align-items:center;justify-content:center;font-size:.8rem;background:#fff;
}
.task-check .chk.done{background:#1976d2;color:#fff;border-color:#1976d2;}
.browser{
  border-radius:12px;overflow:hidden;border:2px solid #ddd;
  background:#f5f5f5;
}
.tab-bar{
  display:flex;align-items:flex-end;background:#e0e0e0;padding:4px 4px 0;gap:2px;overflow-x:auto;
}
.tab{
  padding:8px 14px;background:#ddd;border-radius:8px 8px 0 0;
  cursor:pointer;font-size:.8rem;font-weight:600;color:#666;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
  transition:background .15s;max-width:160px;overflow:hidden;
}
.tab.active{background:#fff;color:#333;font-weight:700;}
.tab .tab-close{
  font-size:.7rem;opacity:.5;cursor:pointer;margin-left:4px;
  padding:2px 4px;border-radius:4px;
}
.tab .tab-close:hover{opacity:1;background:rgba(0,0,0,.1);}
.tab-add{
  padding:8px 12px;background:#e0e0e0;border-radius:8px 8px 0 0;
  cursor:pointer;font-size:1rem;font-weight:700;color:#666;
  transition:background .15s;
}
.tab-add:hover{background:#d0d0d0;}
.chrome-bar{
  display:flex;align-items:center;gap:6px;padding:8px 10px;background:#fff;
  border-bottom:2px solid #eee;
}
.nav-btn{
  width:32px;height:32px;border-radius:8px;border:none;
  background:#f5f5f5;font-size:1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.nav-btn:hover{background:#e0e0e0;}
.nav-btn:disabled{opacity:.3;cursor:not-allowed;}
.address-bar{
  flex:1;padding:8px 12px;border-radius:20px;border:2px solid #ddd;
  font-size:.85rem;outline:none;background:#fafafa;
}
.address-bar:focus{border-color:#4facfe;box-shadow:0 0 8px rgba(79,172,254,.25);}
.star-btn{
  width:32px;height:32px;border-radius:8px;border:none;
  background:none;font-size:1.2rem;cursor:pointer;
  transition:transform .2s;
}
.star-btn:hover{transform:scale(1.2);}
.star-btn.bookmarked{animation:starPop .3s ease;}
@keyframes starPop{
  0%{transform:scale(1);}
  50%{transform:scale(1.4);}
  100%{transform:scale(1);}
}
.refresh-btn{
  width:32px;height:32px;border-radius:8px;border:none;
  background:#f5f5f5;font-size:1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.refresh-btn:hover{background:#e0e0e0;}
.refresh-btn.spinning .refresh-icon{animation:spin .6s linear;}
@keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}
.bookmarks-bar{
  display:flex;gap:6px;padding:6px 10px;background:#fafafa;
  border-bottom:2px solid #eee;flex-wrap:wrap;min-height:32px;align-items:center;
}
.bookmark-chip{
  padding:4px 10px;border-radius:8px;background:#e3f2fd;
  font-size:.75rem;font-weight:600;color:#1565c0;cursor:pointer;
  display:flex;align-items:center;gap:4px;transition:background .15s;
}
.bookmark-chip:hover{background:#bbdefb;}
.bookmarks-empty{font-size:.75rem;color:#bbb;}
.page-content{
  min-height:320px;background:#fff;padding:20px;
  overflow-y:auto;max-height:400px;
}
.page-welcome{text-align:center;padding:40px 20px;}
.page-welcome h2{color:#1565c0;margin-bottom:10px;font-size:1.3rem;}
.page-welcome p{color:#666;font-size:.95rem;line-height:1.6;}
.page-website h2{margin-bottom:12px;font-size:1.2rem;}
.page-website p{color:#555;line-height:1.7;font-size:.9rem;margin-bottom:10px;}
.page-website .site-header{
  padding:16px;border-radius:12px;margin-bottom:14px;color:#fff;text-align:center;
}
.site-photodentro .site-header{background:linear-gradient(135deg,#1565c0,#42a5f5);}
.site-ebooks .site-header{background:linear-gradient(135deg,#2e7d32,#66bb6a);}
.site-eme .site-header{background:linear-gradient(135deg,#6a1b9a,#ab47bc);}
.page-website .feature-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  grid-gap:8px;margin-top:10px;
}
.page-website .feature-card{
  padding:12px;border-radius:10px;background:#f5f5f5;text-align:center;font-size:.8rem;
}
.page-website .feature-card .fc-icon{font-size:1.5rem;margin-bottom:4px;}
.new-tab-input{
  padding:12px;border-radius:10px;border:2px solid #ddd;font-size:.9rem;outline:none;
  text-align:center;
}
.new-tab-input:focus{border-color:#4facfe;}
.page-not-found{text-align:center;padding:40px;color:#999;}
.congrats{
  text-align:center;padding:12px;border-radius:12px;
  background:linear-gradient(135deg,#1976d2,#42a5f5);color:#fff;
  font-weight:700;display:none;margin-top:10px;
}
@media(max-width:500px){
  .tab{padding:6px 10px;font-size:.75rem;max-width:100px;}
  .page-content{padding:14px;min-height:260px;}
}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .tasks-bar > * { margin: 5px; }
  .task-check > * + * { margin-left: 4px; }
  .tab-bar > * + * { margin-left: 2px; }
  .tab > * + * { margin-left: 6px; }
  .chrome-bar > * + * { margin-left: 6px; }
  .bookmarks-bar > * { margin: 3px; }
  .bookmark-chip > * + * { margin-left: 4px; }
  .g61f8_0 > * { margin: 4px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<h1>🌐 Καρτέλες & Σελιδοδείκτες</h1>
<p class="subtitle">Μάθε να χρησιμοποιείς τον περιηγητή!</p>
<div class="container">

<div class="tasks-bar">
  <div class="tasks-title">✅ Εργασίες:</div>
  <div class="task-check"><div class="chk" id="chk1">1</div><span>2 καρτέλες</span></div>
  <div class="task-check"><div class="chk" id="chk2">2</div><span>Σελιδοδείκτης</span></div>
  <div class="task-check"><div class="chk" id="chk3">3</div><span>Κουμπί Πίσω</span></div>
</div>

<div class="browser">
  <div class="tab-bar" id="tabBar"></div>
  <div class="chrome-bar">
    <button class="nav-btn" id="btnBack" onclick="goBack()" disabled>◀</button>
    <button class="nav-btn" id="btnFwd" onclick="goForward()" disabled>▶</button>
    <button class="refresh-btn" id="btnRefresh" onclick="refreshPage()">🔄</button>
    <input type="text" class="address-bar" id="addressBar" placeholder="🔍 Γράψε URL..." onkeydown="if(event.key==='Enter')navigateTo(this.value)">
    <button class="star-btn" id="starBtn" onclick="toggleBookmark()">☆</button>
  </div>
  <div class="bookmarks-bar" id="bookmarksBar">
    <span class="bookmarks-empty">Δεν υπάρχουν σελιδοδείκτες</span>
  </div>
  <div class="page-content" id="pageContent"></div>
</div>

<div class="congrats" id="congrats">🎉 Μπράβο! Ολοκλήρωσες όλες τις εργασίες!</div>

</div>

<script>
var tasks = {tabs:false, bookmark:false, back:false};
var tabs = [];
var activeTabId = null;
var tabIdCounter = 0;
var bookmarks = [];

var websites = {
  'photodentro.edu.gr': {
    title: 'Φωτόδεντρο',
    cls: 'site-photodentro',
    header: '🌳 Φωτόδεντρο - Εκπαιδευτική Πύλη',
    desc: 'Το Φωτόδεντρο είναι η Εθνική Πύλη Εκπαιδευτικού Περιεχομένου. Εδώ θα βρεις εκπαιδευτικό υλικό για όλα τα μαθήματα!',
    features: [
      {icon:'📚',label:'Βιβλία'},
      {icon:'🎮',label:'Παιχνίδια'},
      {icon:'🎬',label:'Βίντεο'},
      {icon:'📝',label:'Ασκήσεις'}
    ]
  },
  'ebooks.edu.gr': {
    title: 'Ψηφιακά Βιβλία',
    cls: 'site-ebooks',
    header: '📖 Ψηφιακά Σχολικά Βιβλία',
    desc: 'Εδώ θα βρεις όλα τα ψηφιακά σχολικά βιβλία. Διάβασε τα βιβλία σου στο ίντερνετ!',
    features: [
      {icon:'📕',label:'Δημοτικό'},
      {icon:'📗',label:'Γυμνάσιο'},
      {icon:'📘',label:'Λύκειο'},
      {icon:'📙',label:'Εργαστήρια'}
    ]
  },
  'e-me.edu.gr': {
    title: 'e-me',
    cls: 'site-eme',
    header: '🎓 e-me - Εκπαιδευτική Κοινότητα',
    desc: 'Η πλατφόρμα e-me είναι ο χώρος συνεργασίας μαθητών και εκπαιδευτικών. Δημιούργησε ομάδες και μοιράσου εργασίες!',
    features: [
      {icon:'👥',label:'Ομάδες'},
      {icon:'💬',label:'Συζητήσεις'},
      {icon:'📤',label:'Ανάρτηση'},
      {icon:'📊',label:'Αξιολόγηση'}
    ]
  }
};

function createTab(url){
  var id = ++tabIdCounter;
  var tab = {
    id: id,
    url: url || '',
    title: url ? (websites[url] ? websites[url].title : url) : 'Νέα καρτέλα',
    history: [url || ''],
    historyIdx: 0
  };
  tabs.push(tab);
  activeTabId = id;
  renderTabs();
  renderPage();
  checkTasks();
}

function closeTab(id){
  if(tabs.length <= 1) return;
  var idx = tabs.findIndex(function(t){return t.id===id;});
  if(idx<0) return;
  tabs.splice(idx,1);
  if(activeTabId === id){
    activeTabId = tabs[Math.min(idx, tabs.length-1)].id;
  }
  renderTabs();
  renderPage();
  checkTasks();
}

function switchTab(id){
  activeTabId = id;
  renderTabs();
  renderPage();
}

function getActiveTab(){
  return tabs.find(function(t){return t.id===activeTabId;});
}

function navigateTo(url){
  url = url.trim().toLowerCase();
  if(!url) return;
  var tab = getActiveTab();
  if(!tab) return;
  tab.url = url;
  tab.title = websites[url] ? websites[url].title : url;
  tab.history = tab.history.slice(0, tab.historyIdx+1);
  tab.history.push(url);
  tab.historyIdx = tab.history.length-1;
  document.getElementById('addressBar').value = url;
  renderTabs();
  renderPage();
  checkTasks();
}

function goBack(){
  var tab = getActiveTab();
  if(!tab || tab.historyIdx <= 0) return;
  tab.historyIdx--;
  tab.url = tab.history[tab.historyIdx];
  tab.title = websites[tab.url] ? websites[tab.url].title : tab.url;
  document.getElementById('addressBar').value = tab.url;
  renderTabs();
  renderPage();
  if(!tasks.back){
    tasks.back = true;
    updateTasks();
  }
}

function goForward(){
  var tab = getActiveTab();
  if(!tab || tab.historyIdx >= tab.history.length-1) return;
  tab.historyIdx++;
  tab.url = tab.history[tab.historyIdx];
  tab.title = websites[tab.url] ? websites[tab.url].title : tab.url;
  document.getElementById('addressBar').value = tab.url;
  renderTabs();
  renderPage();
}

function refreshPage(){
  var btn = document.getElementById('btnRefresh');
  btn.classList.add('spinning');
  setTimeout(function(){btn.classList.remove('spinning');},600);
  renderPage();
}

function toggleBookmark(){
  var tab = getActiveTab();
  if(!tab || !tab.url) return;
  var idx = bookmarks.indexOf(tab.url);
  if(idx>=0){
    bookmarks.splice(idx,1);
  } else {
    bookmarks.push(tab.url);
    if(!tasks.bookmark){
      tasks.bookmark = true;
      updateTasks();
    }
  }
  renderBookmarks();
  updateStar();
}

function updateStar(){
  var tab = getActiveTab();
  var btn = document.getElementById('starBtn');
  var isBookmarked = tab && tab.url && bookmarks.indexOf(tab.url)>=0;
  btn.textContent = isBookmarked ? '★' : '☆';
  if(isBookmarked){
    btn.classList.add('bookmarked');
    setTimeout(function(){btn.classList.remove('bookmarked');},300);
  }
}

function renderBookmarks(){
  var bar = document.getElementById('bookmarksBar');
  if(bookmarks.length===0){
    bar.innerHTML = '<span class="bookmarks-empty">Δεν υπάρχουν σελιδοδείκτες</span>';
    return;
  }
  bar.innerHTML = '';
  bookmarks.forEach(function(url){
    var chip = document.createElement('div');
    chip.className = 'bookmark-chip';
    var site = websites[url];
    chip.textContent = '⭐ ' + (site ? site.title : url);
    chip.addEventListener('click', function(){
      navigateTo(url);
    });
    bar.appendChild(chip);
  });
}

function renderTabs(){
  var bar = document.getElementById('tabBar');
  bar.innerHTML = '';
  tabs.forEach(function(tab){
    var div = document.createElement('div');
    div.className = 'tab' + (tab.id===activeTabId?' active':'');
    var titleSpan = document.createElement('span');
    titleSpan.textContent = tab.title;
    titleSpan.style.overflow = 'hidden';
    titleSpan.style.textOverflow = 'ellipsis';
    div.appendChild(titleSpan);
    if(tabs.length > 1){
      var close = document.createElement('span');
      close.className = 'tab-close';
      close.textContent = '✕';
      close.addEventListener('click', function(e){
        e.stopPropagation();
        closeTab(tab.id);
      });
      div.appendChild(close);
    }
    div.addEventListener('click', function(){switchTab(tab.id);});
    bar.appendChild(div);
  });
  var addBtn = document.createElement('div');
  addBtn.className = 'tab-add';
  addBtn.textContent = '+';
  addBtn.addEventListener('click', function(){createTab('');});
  bar.appendChild(addBtn);

  var tab = getActiveTab();
  document.getElementById('addressBar').value = tab ? tab.url : '';
  document.getElementById('btnBack').disabled = !tab || tab.historyIdx <= 0;
  document.getElementById('btnFwd').disabled = !tab || tab.historyIdx >= tab.history.length-1;
  updateStar();
}

function renderPage(){
  var content = document.getElementById('pageContent');
  var tab = getActiveTab();
  if(!tab || !tab.url){
    content.innerHTML = '<div class="page-welcome"><h2>🌐 Νέα Καρτέλα</h2>'+
      '<p>Γράψε ένα URL στη γραμμή διευθύνσεων για να επισκεφτείς μια σελίδα!</p>'+
      '<p style="margin-top:14px;font-weight:600;color:#1565c0;">Δοκίμασε αυτά:</p>'+
      '<div class="g61f8_0" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px;">'+
      '<button class="nav-btn" style="width:auto;padding:8px 14px;font-size:.85rem;border-radius:10px;background:#e3f2fd;color:#1565c0;" onclick="navigateTo(\'photodentro.edu.gr\')">🌳 Φωτόδεντρο</button>'+
      '<button class="nav-btn" style="width:auto;padding:8px 14px;font-size:.85rem;border-radius:10px;background:#e8f5e9;color:#2e7d32;" onclick="navigateTo(\'ebooks.edu.gr\')">📖 Ψηφιακά Βιβλία</button>'+
      '<button class="nav-btn" style="width:auto;padding:8px 14px;font-size:.85rem;border-radius:10px;background:#f3e5f5;color:#6a1b9a;" onclick="navigateTo(\'e-me.edu.gr\')">🎓 e-me</button>'+
      '</div></div>';
    return;
  }
  var site = websites[tab.url];
  if(site){
    var html = '<div class="page-website '+site.cls+'">';
    html += '<div class="site-header"><h2>'+site.header+'</h2></div>';
    html += '<p>'+site.desc+'</p>';
    html += '<div class="feature-grid">';
    site.features.forEach(function(f){
      html += '<div class="feature-card"><div class="fc-icon">'+f.icon+'</div><div>'+f.label+'</div></div>';
    });
    html += '</div></div>';
    content.innerHTML = html;
  } else {
    content.innerHTML = '<div class="page-not-found"><h2>🔍 Η σελίδα δεν βρέθηκε</h2><p>Δοκίμασε: photodentro.edu.gr, ebooks.edu.gr, e-me.edu.gr</p></div>';
  }
}

function updateTasks(){
  var keys = ['tabs','bookmark','back'];
  for(var i=0;i<keys.length;i++){
    if(tasks[keys[i]]){
      var el = document.getElementById('chk'+(i+1));
      el.classList.add('done');
      el.textContent = '✓';
    }
  }
  if(tasks.tabs && tasks.bookmark && tasks.back){
    document.getElementById('congrats').style.display = 'block';
  }
}

function checkTasks(){
  var openTabs = tabs.filter(function(t){return t.url && t.url !== '';});
  if(openTabs.length >= 2 && !tasks.tabs){
    tasks.tabs = true;
    updateTasks();
  }
}

createTab('photodentro.edu.gr');
</script>
</body>
</html>
