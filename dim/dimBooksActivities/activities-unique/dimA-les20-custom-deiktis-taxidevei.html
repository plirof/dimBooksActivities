<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ο δείκτης ταξιδεύει 🖱️</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #e8f5e9, #c8e6c9, #a5d6a7);
    padding: 12px; color: #333;
  }
  .app-container { max-width: 520px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 14px;
    background: linear-gradient(135deg, #43a047, #2e7d32);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(46,125,50,.35); margin-bottom: 16px;
  }
  .header h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .header p { font-size: 1rem; opacity: .9; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #2e7d32; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fff9db; border: 2px dashed #f0c040;
    border-radius: 16px; padding: 14px 16px; margin-bottom: 16px;
    font-size: 1.1rem; text-align: center; color: #6b5900; line-height: 1.5;
  }
  .scene {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 24px; margin-bottom: 16px; min-height: 300px;
    position: relative; overflow: hidden;
  }
  .scene-bg {
    position: absolute; top:0;right:0;bottom:0;left:0;
    background: linear-gradient(180deg, #e3f2fd, #bbdefb 40%, #e8f5e9);
    border-radius: 24px;
  }
  .target-area {
    position: relative; z-index: 2;
    display: flex; flex-wrap: wrap; gap: 14px;
    justify-content: center; align-items: center;
    min-height: 260px; padding: 16px;
  }
  .target-btn {
    background: #fff; border: 3px solid #90caf9;
    border-radius: 20px; padding: 18px 24px;
    font-size: 1.1rem; font-weight: 700; cursor: pointer;
    transition: all .2s; font-family: inherit;
    user-select: none; -webkit-tap-highlight-color: transparent;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    min-width: 120px;
    box-shadow: 0 4px 12px rgba(0,0,0,.06);
  }
  .target-btn .tb-emoji { font-size: 2.5rem; }
  .target-btn:active { transform: scale(.95); }
  .target-btn:disabled { opacity: .3; transform: none !important; cursor: default; }
  .target-btn.miss { border-color: #e53935; background: #ffebee; }
  .target-btn.hit { border-color: #43a047; background: #e8f5e9; }
  .cursor-indicator {
    position: absolute; z-index: 10;
    font-size: 2.5rem; pointer-events: none;
    transition: all .3s cubic-bezier(.34,1.56,.64,1);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.2));
  }
  .cursor-indicator.hidden { display: none; }
  .cursor-hint {
    text-align: center; font-size: 1rem; color: #888;
    margin-bottom: 12px; min-height: 30px;
    position: relative; z-index: 5;
  }
  .cursor-hint .ch-icon { font-size: 2rem; display: inline-block; }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; display: none; margin-top: 12px;
  }
  .feedback.show { display: block; }
  .feedback.true { background: #d4edda; color: #155724; }
  .feedback.false { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #43a047, #2e7d32);
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 36px; font-size: 1.2rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(46,125,50,.35);
    transition: transform .15s;
  }
  .btn-restart:active { transform: scale(.95); }
  @media (max-width:480px) {
    .header h1 { font-size: 1.2rem; }
    .target-btn { padding: 14px 18px; min-width: 100px; }
    .target-btn .tb-emoji { font-size: 2rem; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .target-area > * { margin: 7px; }
  .target-btn > * + * { margin-top: 8px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🖱️ Ο δείκτης ταξιδεύει</h1>
    <p>Πάτα τον σωστό στόχο!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">Γύρος 1/6</span>
  </div>
  <div class="instructions" id="instructions">
    👆 Κοίτα ποιος δείκτης είναι. Πάτησε το κουμπί που ταιριάζει!
  </div>
  <div id="gameArea">
    <div class="cursor-hint" id="cursorHint">
      <span class="ch-icon" id="chIcon">👆</span>
      <span id="chText">Βρες τον στόχο!</span>
    </div>
    <div class="scene">
      <div class="scene-bg"></div>
      <span class="cursor-indicator hidden" id="cursorIndicator">👆</span>
      <div class="target-area" id="targetArea"></div>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🏆</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Οδήγησες τον δείκτη παντού!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var rounds = [
    { icon: '👆', label: 'Βέλος — για να πατάω κουμπιά', targetIdx: 0 },
    { icon: '✋', label: 'Χέρι — για να ανοίγω συνδέσμους', targetIdx: 1 },
    { icon: '📝', label: 'Κείμενο — για να γράφω', targetIdx: 2 },
    { icon: '⏳', label: 'Αμμοδείκτης — περιμένω', targetIdx: 3 },
    { icon: '✋', label: 'Χέρι — για να ανοίξω ιστοσελίδα', targetIdx: 1 },
    { icon: '👆', label: 'Βέλος — για να επιλέξω εικονίδιο', targetIdx: 0 }
  ];

  var targets = [
    { emoji: '🔘', name: 'Κουμπί' },
    { emoji: '🔗', name: 'Σύνδεσμος' },
    { emoji: '✏️', name: 'Πλαίσιο κειμένου' },
    { emoji: '🔄', name: 'Φόρτωση' }
  ];

  var current = 0, score = 0;

  function shuffle(a) {
    for (var i = a.length-1; i > 0; i--) {
      var j = Math.floor(Math.random()*(i+1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function startGame() {
    current = 0; score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    showRound();
  }

  function showRound() {
    if (current >= rounds.length) { showResult(); return; }
    var r = rounds[current];
    document.getElementById('roundDisplay').textContent = 'Γύρος ' + (current+1) + '/' + rounds.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';

    document.getElementById('chIcon').textContent = r.icon;
    document.getElementById('chText').textContent = r.icon + ' ' + r.label;

    var ci = document.getElementById('cursorIndicator');
    ci.textContent = r.icon;
    ci.classList.remove('hidden');
    ci.style.left = '10px';
    ci.style.top = '10px';
    setTimeout(function() {
      ci.style.left = '80%';
      ci.style.top = '20px';
    }, 100);
    setTimeout(function() {
      ci.style.left = '50%';
      ci.style.top = '60%';
    }, 400);

    var ta = document.getElementById('targetArea');
    ta.innerHTML = '';
    var shuffledTargets = targets.slice();
    shuffle(shuffledTargets);
    for (var i = 0; i < shuffledTargets.length; i++) {
      var btn = document.createElement('div');
      btn.className = 'target-btn';
      btn.setAttribute('data-idx', i);
      var origIdx = targets.indexOf(shuffledTargets[i]);
      btn.setAttribute('data-orig', origIdx);
      btn.innerHTML = '<span class="tb-emoji">' + shuffledTargets[i].emoji + '</span>' + shuffledTargets[i].name;
      btn.addEventListener('click', function() { pick(this); });
      ta.appendChild(btn);
    }
  }

  function pick(el) {
    var r = rounds[current];
    var clickedIdx = parseInt(el.getAttribute('data-orig'));
    var btns = document.querySelectorAll('.target-btn');
    for (var i = 0; i < btns.length; i++) btns[i].style.pointerEvents = 'none';
    var fb = document.getElementById('feedback');
    if (clickedIdx === r.targetIdx) {
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      el.classList.add('hit');
      fb.className = 'feedback show true';
      fb.textContent = '✅ Μπράβο! ' + r.label.split(' — ')[0] + ' για ' + r.label.split(' — ')[1] + '!';
      setTimeout(function() { current++; showRound(); }, 1200);
    } else {
      el.classList.add('miss');
      for (var i = 0; i < btns.length; i++) {
        if (parseInt(btns[i].getAttribute('data-orig')) === r.targetIdx) {
          btns[i].classList.add('hit');
        }
      }
      fb.className = 'feedback show false';
      fb.textContent = '❌ Ο δείκτης ' + r.label.split(' — ')[0] + ' πατάει ' + targets[r.targetIdx].name + '!';
      setTimeout(function() { current++; showRound(); }, 1600);
    }
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var t = rounds.length;
    var e, ti, m;
    if (score === t) { e = '🏆'; ti = 'Τέλεια!'; m = 'Ξέρεις όλους τους δείκτες!' }
    else if (score >= 4) { e = '🎉'; ti = 'Μπράβο!'; m = 'Τα πήγες πολύ καλά!' }
    else if (score >= 3) { e = '👍'; ti = 'Ωραία!'; m = 'Δοκίμασε ξανά!' }
    else { e = '💪'; ti = 'Καλή αρχή!'; m = 'Κάθε δείκτης έχει διαφορετική δουλειά!' }
    document.getElementById('resultEmoji').textContent = e;
    document.getElementById('resultTitle').textContent = ti;
    document.getElementById('resultMsg').textContent = 'Βρήκες ' + score + ' από ' + t + ' σωστά! ' + m;
  }

  startGame();
</script>
</body>
</html>
