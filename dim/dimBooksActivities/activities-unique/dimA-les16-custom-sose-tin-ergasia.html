<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Σώσε τη δουλειά σου! 📁</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #fff3e0, #ffe0b2, #ffcc80);
    padding: 12px; color: #333;
  }
  .app-container { max-width: 520px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 14px;
    background: linear-gradient(135deg, #ff9800, #f57c00);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(245,124,0,.35); margin-bottom: 16px;
  }
  .header h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .header p { font-size: 1rem; opacity: .9; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #e65100; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fff9db; border: 2px dashed #f0c040;
    border-radius: 16px; padding: 14px 16px; margin-bottom: 16px;
    font-size: 1.1rem; text-align: center; color: #6b5900; line-height: 1.5;
  }
  .files-area {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 20px; margin-bottom: 16px; min-height: 200px;
  }
  .file-row {
    display: flex; align-items: center; gap: 14px;
    background: #fafafa; border: 2px solid #e0e0e0;
    border-radius: 16px; padding: 12px 16px; margin-bottom: 10px;
    transition: all .2s;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .file-row:active { transform: scale(.97); }
  .file-row .fr-emoji { font-size: 2.5rem; }
  .file-row .fr-name { font-size: 1.1rem; font-weight: 600; color: #333; flex: 1; }
  .file-row.placed { border-color: #43a047; background: #e8f5e9; opacity: .7; }
  .file-row.placed .fr-emoji { opacity: .5; }
  .folders-area {
    display: grid; grid-template-columns: 1fr 1fr; grid-gap: 12px;
  }
  .folder-box {
    background: #fff; border: 3px solid #e0e0e0;
    border-radius: 20px; padding: 16px 10px;
    text-align: center; cursor: pointer;
    transition: all .2s;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .folder-box:active { transform: scale(.95); }
  .folder-box .fb-emoji { font-size: 3rem; display: block; margin-bottom: 6px; }
  .folder-box .fb-name { font-size: 1rem; font-weight: 600; color: #333; }
  .folder-box.highlight { border-color: #43a047; box-shadow: 0 0 0 3px rgba(67,160,71,.25); }
  .folder-box.wrong-highlight { border-color: #e53935; box-shadow: 0 0 0 3px rgba(229,57,53,.25); }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; display: none; margin-top: 12px;
  }
  .feedback.show { display: block; }
  .feedback.true { background: #d4edda; color: #155724; }
  .feedback.false { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #ff9800, #f57c00);
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 36px; font-size: 1.2rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(245,124,0,.35);
    transition: transform .15s;
  }
  .btn-restart:hover { transform: scale(1.05); }
  @media (max-width:480px) {
    .header h1 { font-size: 1.2rem; }
    .file-row .fr-emoji { font-size: 2rem; }
    .folder-box .fb-emoji { font-size: 2.4rem; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .file-row > * + * { margin-left: 14px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>📁 Σώσε τη δουλειά σου!</h1>
    <p>Βάλε κάθε αρχείο στον σωστό φάκελο</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">Αρχεία 0/0</span>
  </div>
  <div class="instructions">
    👆 Πάτησε ένα αρχείο και μετά πάτησε τον σωστό φάκελο για να το αποθηκεύσεις!
  </div>
  <div id="gameArea">
    <div class="files-area" id="filesArea"></div>
    <div class="folders-area" id="foldersArea"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🏆</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τακτοποίησες όλα τα αρχεία!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var levels = [
    {
      folders: [
        { emoji: '📷', name: 'Φωτογραφίες' },
        { emoji: '🎨', name: 'Ζωγραφιές' }
      ],
      files: [
        { emoji: '🖼️', name: 'Ηλίας στη θάλασσα', folder: 0 },
        { emoji: '🌈', name: 'Ουράνιο τόξο', folder: 1 },
        { emoji: '🌸', name: 'Λουλούδι στον κήπο', folder: 0 },
        { emoji: '🐱', name: 'Η γατούλα μου', folder: 1 }
      ]
    },
    {
      folders: [
        { emoji: '📖', name: 'Ιστορίες' },
        { emoji: '🎵', name: 'Τραγούδια' }
      ],
      files: [
        { emoji: '📝', name: 'Το παραμύθι μου', folder: 0 },
        { emoji: '🎶', name: 'Το αγαπημένο μου', folder: 1 },
        { emoji: '📜', name: 'Ο μύθος του Ήλιου', folder: 0 },
        { emoji: '🎤', name: 'Τραγούδι για γάτες', folder: 1 }
      ]
    }
  ];

  var currentLevel = 0;
  var selectedFile = null;
  var placed = 0;
  var total = 0;
  var score = 0;

  function startGame() {
    currentLevel = 0; score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    loadLevel();
  }

  function loadLevel() {
    if (currentLevel >= levels.length) { showResult(); return; }
    var lv = levels[currentLevel];
    total = lv.files.length;
    placed = 0;
    selectedFile = null;
    document.getElementById('roundDisplay').textContent = 'Επίπεδο ' + (currentLevel+1) + '/' + levels.length;
    var fa = document.getElementById('filesArea');
    fa.innerHTML = '';
    for (var i = 0; i < lv.files.length; i++) {
      var f = lv.files[i];
      var row = document.createElement('div');
      row.className = 'file-row';
      row.setAttribute('data-idx', i);
      row.innerHTML = '<span class="fr-emoji">' + f.emoji + '</span><span class="fr-name">' + f.name + '</span>';
      row.addEventListener('click', function() { selectFile(this); });
      fa.appendChild(row);
    }
    var fo = document.getElementById('foldersArea');
    fo.innerHTML = '';
    for (var i = 0; i < lv.folders.length; i++) {
      var fol = lv.folders[i];
      var box = document.createElement('div');
      box.className = 'folder-box';
      box.setAttribute('data-idx', i);
      box.innerHTML = '<span class="fb-emoji">' + fol.emoji + '</span><span class="fb-name">' + fol.name + '</span>';
      box.addEventListener('click', function() { placeFile(this); });
      fo.appendChild(box);
    }
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
  }

  function selectFile(el) {
    if (el.classList.contains('placed')) return;
    if (selectedFile) selectedFile.style.borderColor = '#e0e0e0';
    selectedFile = el;
    el.style.borderColor = '#43a047';
    el.style.borderWidth = '3px';
  }

  function placeFile(el) {
    if (!selectedFile) return;
    var lv = levels[currentLevel];
    var idx = parseInt(selectedFile.getAttribute('data-idx'));
    var f = lv.files[idx];
    var folIdx = parseInt(el.getAttribute('data-idx'));
    if (folIdx === f.folder) {
      selectedFile.classList.add('placed');
      selectedFile.style.borderColor = '#43a047';
      el.classList.add('highlight');
      setTimeout(function() { el.classList.remove('highlight'); }, 500);
      placed++;
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      var fb = document.getElementById('feedback');
      fb.className = 'feedback show true';
      fb.textContent = '✅ Μπράβο! Το ' + f.name + ' αποθηκεύτηκε σωστά!';
      setTimeout(function() { fb.style.display = 'none'; }, 800);
      selectedFile = null;
      if (placed >= total) {
        setTimeout(function() { currentLevel++; loadLevel(); }, 1000);
      }
    } else {
      el.classList.add('wrong-highlight');
      setTimeout(function() { el.classList.remove('wrong-highlight'); }, 500);
      var fb = document.getElementById('feedback');
      fb.className = 'feedback show false';
      fb.textContent = '❌ Αυτό το αρχείο δεν ταιριάζει εδώ! Δοκίμασε άλλο φάκελο!';
      setTimeout(function() { fb.style.display = 'none'; }, 1000);
    }
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var t = levels.length;
    var e, ti, m;
    if (score >= 8) { e = '🏆'; ti = 'Τέλεια!'; m = 'Είσαι master στην αποθήκευση!' }
    else if (score >= 6) { e = '🎉'; ti = 'Μπράβο!'; m = 'Τα περισσότερα αρχεία είναι στη θέση τους!' }
    else if (score >= 4) { e = '👍'; ti = 'Ωραία!'; m = 'Δοκίμασε ξανά!' }
    else { e = '💪'; ti = 'Καλή αρχή!'; m = 'Κάθε αρχείο έχει τον δικό του φάκελο!' }
    document.getElementById('resultEmoji').textContent = e;
    document.getElementById('resultTitle').textContent = ti;
    document.getElementById('resultMsg').textContent = 'Αποθήκευσες ' + score + ' από 8 αρχεία! ' + m;
  }

  startGame();
</script>
</body>
</html>
