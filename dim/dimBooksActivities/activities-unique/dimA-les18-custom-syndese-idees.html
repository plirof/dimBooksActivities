<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Σύνδεσε τις ιδέες! 🔗</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #e0f2f1, #b2dfdb, #80cbc4);
    padding: 12px; color: #333;
  }
  .app-container { max-width: 520px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 14px;
    background: linear-gradient(135deg, #00897b, #00695c);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(0,105,92,.35); margin-bottom: 16px;
  }
  .header h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .header p { font-size: 1rem; opacity: .9; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #00695c; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fff9db; border: 2px dashed #f0c040;
    border-radius: 16px; padding: 14px 16px; margin-bottom: 16px;
    font-size: 1.1rem; text-align: center; color: #6b5900; line-height: 1.5;
  }
  .game-board {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 24px; margin-bottom: 16px;
    position: relative;
  }
  .pairs-area {
    display: flex; flex-direction: column; gap: 16px;
  }
  .pair-row {
    display: flex; align-items: center; gap: 12px;
    justify-content: center;
  }
  .idea-card {
    background: #fff; border: 3px solid #b2dfdb;
    border-radius: 16px; padding: 12px 18px;
    font-size: 1rem; font-weight: 600;
    text-align: center; flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    user-select: none; -webkit-tap-highlight-color: transparent;
    transition: all .2s;
    min-height: 60px;
  }
  .idea-card.left { border-color: #26a69a; background: #e0f2f1; }
  .idea-card.right { border-color: #00897b; background: #e0f2f1; }
  .idea-card .ic-emoji { font-size: 1.5rem; }
  .idea-card.selected {
    border-color: #ff6f00; box-shadow: 0 0 0 3px rgba(255,111,0,.25);
    transform: scale(1.03);
  }
  .idea-card.matched {
    border-color: #43a047; background: #e8f5e9;
    opacity: .7; pointer-events: none;
  }
  .idea-card.matched-other {
    border-color: #43a047; background: #e8f5e9;
    opacity: .7; pointer-events: none;
  }
  .connector-icon {
    font-size: 1.5rem; color: #b0bec5;
    transition: color .3s;
    flex-shrink: 0;
  }
  .connector-icon.active { color: #43a047; }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; display: none; margin-top: 12px;
  }
  .feedback.show { display: block; }
  .feedback.true { background: #d4edda; color: #155724; }
  .feedback.false { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #00897b, #00695c);
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 36px; font-size: 1.2rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(0,105,92,.35);
    transition: transform .15s;
  }
  .btn-restart:hover { transform: scale(1.05); }
  @media (max-width:480px) {
    .header h1 { font-size: 1.2rem; }
    .idea-card { font-size: .9rem; padding: 10px 12px; min-height: 50px; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .pairs-area > * + * { margin-top: 16px; }
  .pair-row > * + * { margin-left: 12px; }
  .idea-card > * + * { margin-left: 8px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🔗 Σύνδεσε τις ιδέες!</h1>
    <p>Βρες ποιες λέξεις ταιριάζουν μαζί</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">Γύρος 1/3</span>
  </div>
  <div class="instructions">
    👆 Πάτησε μια λέξη από αριστερά και μετά τη λέξη που ταιριάζει από δεξιά!
  </div>
  <div id="gameArea">
    <div class="game-board">
      <div class="pairs-area" id="pairsArea"></div>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🏆</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Συνέδεσες όλες τις ιδέες!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var levels = [
    {
      pairs: [
        { left: '🌞 Ηλιος', right: '☀️ Ζέστη', icon: '🔥' },
        { left: '🌧️ Βροχή', right: '☂️ Ομπρέλα', icon: '🌂' },
        { left: '❄️ Χιόνι', right: '⛄ Χιονάνθρωπος', icon: '⛄' },
        { left: '🌊 Θάλασσα', right: '🐟 Ψάρι', icon: '🐠' }
      ]
    },
    {
      pairs: [
        { left: '📚 Βιβλίο', right: '📖 Διάβασμα', icon: '📖' },
        { left: '✏️ Μολύβι', right: '📝 Γράψιμο', icon: '✍️' },
        { left: '🎨 Χρώμα', right: '🖼️ Ζωγραφιά', icon: '🖌️' },
        { left: '🎵 Μουσική', right: '🎤 Τραγούδι', icon: '🎶' }
      ]
    },
    {
      pairs: [
        { left: '🐶 Σκύλος', right: '🦴 Κόκκαλο', icon: '🦴' },
        { left: '🐱 Γάτα', right: '🥛 Γάλα', icon: '🥛' },
        { left: '🐴 Άλογο', right: '🌿 Χορτάρι', icon: '🌿' },
        { left: '🐘 Ελέφαντας', right: '🍌 Μπανάνα', icon: '🍌' }
      ]
    }
  ];

  var currentLevel = 0;
  var matched = 0;
  var score = 0;
  var selectedLeft = null;
  var shuffledRight = [];

  function startGame() {
    currentLevel = 0; score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    loadLevel();
  }

  function shuffle(a) {
    for (var i = a.length-1; i > 0; i--) {
      var j = Math.floor(Math.random()*(i+1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function loadLevel() {
    if (currentLevel >= levels.length) { showResult(); return; }
    var lv = levels[currentLevel];
    matched = 0;
    selectedLeft = null;
    document.getElementById('roundDisplay').textContent = 'Γύρος ' + (currentLevel+1) + '/' + levels.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';

    shuffledRight = lv.pairs.slice();
    shuffle(shuffledRight);

    var pa = document.getElementById('pairsArea');
    pa.innerHTML = '';

    for (var i = 0; i < lv.pairs.length; i++) {
      var row = document.createElement('div');
      row.className = 'pair-row';

      var leftCard = document.createElement('div');
      leftCard.className = 'idea-card left';
      leftCard.innerHTML = lv.pairs[i].left;
      leftCard.setAttribute('data-pair', i);
      leftCard.setAttribute('data-side', 'left');
      leftCard.addEventListener('click', function() { selectLeft(this); });

      var conn = document.createElement('div');
      conn.className = 'connector-icon';
      conn.id = 'connector' + i;
      conn.textContent = lv.pairs[i].icon;

      var rightCard = document.createElement('div');
      rightCard.className = 'idea-card right';
      rightCard.innerHTML = shuffledRight[i].right;
      rightCard.setAttribute('data-shuffled', i);
      rightCard.setAttribute('data-side', 'right');
      rightCard.addEventListener('click', function() { selectRight(this); });

      row.appendChild(leftCard);
      row.appendChild(conn);
      row.appendChild(rightCard);
      pa.appendChild(row);
    }
  }

  function selectLeft(el) {
    if (el.classList.contains('matched')) return;
    if (selectedLeft) selectedLeft.classList.remove('selected');
    selectedLeft = el;
    el.classList.add('selected');
  }

  function selectRight(el) {
    if (el.classList.contains('matched-other')) return;
    if (!selectedLeft) {
      var fb = document.getElementById('feedback');
      fb.className = 'feedback show false';
      fb.textContent = '👆 Πάτησε πρώτα μια λέξη από αριστερά!';
      setTimeout(function() { fb.style.display = 'none'; }, 1000);
      return;
    }
    var lv = levels[currentLevel];
    var pairIdx = parseInt(selectedLeft.getAttribute('data-pair'));
    var shuffledIdx = parseInt(el.getAttribute('data-shuffled'));
    var actualPairIdx = lv.pairs.indexOf(shuffledRight[shuffledIdx]);

    if (pairIdx === actualPairIdx) {
      selectedLeft.classList.add('matched');
      el.classList.add('matched-other');
      document.getElementById('connector' + pairIdx).classList.add('active');
      matched++;
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      var fb = document.getElementById('feedback');
      fb.className = 'feedback show true';
      fb.textContent = '✅ Μπράβο! Αυτές οι ιδέες ταιριάζουν!';
      setTimeout(function() { fb.style.display = 'none'; }, 800);
      selectedLeft = null;
      if (matched >= lv.pairs.length) {
        setTimeout(function() { currentLevel++; loadLevel(); }, 1000);
      }
    } else {
      var fb = document.getElementById('feedback');
      fb.className = 'feedback show false';
      fb.textContent = '❌ Δεν ταιριάζουν! Δοκίμασε άλλο ζευγάρι!';
      setTimeout(function() { fb.style.display = 'none'; }, 1000);
    }
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var t = levels.length * 4;
    var e, ti, m;
    if (score === t) { e = '🏆'; ti = 'Τέλεια!'; m = 'Συνέδεσες όλες τις ιδέες σωστά!' }
    else if (score >= t-3) { e = '🎉'; ti = 'Μπράβο!'; m = 'Σχεδόν όλες οι συνδέσεις σωστές!' }
    else if (score >= t/2) { e = '👍'; ti = 'Ωραία!'; m = 'Δοκίμασε ξανά!' }
    else { e = '💪'; ti = 'Καλή προσπάθεια!'; m = 'Κάθε ιδέα έχει μια άλλη που ταιριάζει!' }
    document.getElementById('resultEmoji').textContent = e;
    document.getElementById('resultTitle').textContent = ti;
    document.getElementById('resultMsg').textContent = 'Συνέδεσες ' + score + ' από ' + t + ' ζευγάρια! ' + m;
  }

  startGame();
</script>
</body>
</html>
