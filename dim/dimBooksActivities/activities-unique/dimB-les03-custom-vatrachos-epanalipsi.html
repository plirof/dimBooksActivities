<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Βατραχάκι Επανάληψη 🐸</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #a8edea 0%, #379634 100%);
    padding: 12px;
    color: #333;
    touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(17,153,142,.4);
    margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; }
  .header p { font-size: .9rem; opacity: .85; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #11998e; }
  .level { font-size: 1rem; color: #888; }
  .pond-area {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 20px; margin-bottom: 14px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .pond-scene {
    display: flex; justify-content: center; align-items: flex-end;
    gap: 8px; min-height: 120px; padding: 10px 0;
  }
  .lily-pad {
    width: 60px; height: 60px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #7ddf7d, #2e7d32);
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem; color: #fff; font-weight: 700;
    border: 3px solid #1b5e20;
    transition: all .3s;
    flex-shrink: 0;
    position: relative;
  }
  .lily-pad .pad-label {
    font-size: .7rem; position: absolute; bottom: -18px;
    color: #1b5e20; font-weight: 700;
  }
  .lily-pad.visited { background: radial-gradient(circle at 35% 35%, #ffd54f, #f9a825); border-color: #e65100; }
  .lily-pad.goal {
    background: radial-gradient(circle at 35% 35%, #fff3c4, #ffb300);
    border-color: #bf360c;
    box-shadow: 0 0 16px rgba(255,143,0,.65);
  }
  .frog-char {
    font-size: 3.5rem; line-height: 1;
    transition: all .5s ease;
    margin-bottom: 8px;
  }
  .frog-char.jumping {
    animation: frog-jump .6s ease-in-out;
  }
  @keyframes frog-jump {
    0% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-30px) scale(1.1); }
    60% { transform: translateY(-15px) scale(.95); }
    100% { transform: translateY(0) scale(1); }
  }
  .repeat-control {
    background: #fff; border-radius: 20px;
    box-shadow: 0 4px 14px rgba(0,0,0,.08);
    padding: 16px; margin-bottom: 14px;
    text-align: center;
  }
  .repeat-control label {
    font-size: 1rem; font-weight: 700; color: #555;
    display: block; margin-bottom: 10px;
  }
  .slider-container {
    display: flex; align-items: center; gap: 12px;
    justify-content: center;
  }
  .slider-container input[type=range] {
    width: 200px; height: 8px;
    -webkit-appearance: none; appearance: none;
    background: linear-gradient(90deg, #11998e, #38ef7d);
    border-radius: 4px; outline: none;
  }
  .slider-container input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 36px; height: 36px;
    border-radius: 50%; background: #11998e;
    border: 3px solid #fff; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .slider-value {
    font-size: 1.8rem; font-weight: 700;
    color: #11998e; min-width: 40px;
  }
  .btn-go {
    background: linear-gradient(135deg, #11998e, #38ef7d);
    color: #fff; border: none; border-radius: 20px;
    padding: 12px 36px; font-size: 1.2rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(17,153,142,.35);
    transition: transform .15s;
    margin-top: 10px;
  }
  .btn-go:active { transform: scale(.95); }
  .btn-go:disabled { opacity: .5; pointer-events: none; }
  .program-block {
    background: #fff; border-radius: 16px; padding: 12px 16px;
    margin-bottom: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,.08);
    text-align: center;
  }
  .program-block h3 { font-size: .95rem; color: #888; margin-bottom: 6px; }
  .code-visual {
    display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap;
    justify-content: center;
  }
  .code-cmd {
    background: #e8f5e9; border: 2px solid #a5d6a7;
    border-radius: 10px; padding: 6px 12px;
    font-size: .9rem; font-weight: 600; color: #2e7d32;
  }
  .code-repeat {
    background: #e3f2fd; border: 2px solid #90caf9;
    border-radius: 12px; padding: 8px 14px;
    font-size: .9rem; font-weight: 700; color: #1565c0;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .code-repeat .cr-num {
    background: #1976d2; color: #fff; border-radius: 50%;
    width: 28px; height: 28px; display: inline-flex;
    align-items: center; justify-content: center;
  }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; margin-bottom: 12px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.yay { background: #d4edda; color: #155724; }
  .feedback.nay { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #11998e, #38ef7d); color: #fff;
    border: none; border-radius: 16px; padding: 14px 36px;
    font-size: 1.2rem; font-weight: 700; cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(17,153,142,.35);
    transition: transform .15s;
  }
  .btn-restart:active { transform: scale(.95); }
  @media (max-width: 480px) {
    body { padding: 8px; }
    .header h1 { font-size: 1.2rem; }
    .lily-pad { width: 48px; height: 48px; font-size: 1.5rem; }
    .frog-char { font-size: 2.8rem; }
    .slider-container input[type=range] { width: 150px; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .pond-scene > * + * { margin-left: 8px; }
  .slider-container > * + * { margin-left: 12px; }
  .code-visual > * { margin: 3px; }
  .code-repeat > * + * { margin-left: 4px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>🐸 Βατραχάκι Επανάληψη</h1>
    <p>Ρύθμισε τις επαναλήψεις για να φτάσει το βατραχάκι στη μέλισσα! 🐝</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="level" id="levelDisplay">1/6</span>
  </div>

  <div id="gameArea">
    <div class="pond-area">
      <div class="frog-char" id="frogChar">🐸</div>
      <div class="pond-scene" id="pondScene"></div>
    </div>

    <div class="program-block">
      <h3>📋 Το πρόγραμμα — Στόχος: φτάσε το βατραχάκι στη μέλισσα 🐝</h3>
      <div class="code-visual">
        <span class="code-repeat">🔁 Επανάλαβε <span class="cr-num" id="crNum">3</span></span>
        <span class="code-cmd">➡️ Πήδα μπροστά</span>
      </div>
    </div>

    <div class="repeat-control">
      <label>🎯 Πόσες φορές να επαναλάβει το «Πήδα μπροστά»;</label>
      <div class="slider-container">
        <input type="range" id="repeatSlider" min="1" max="8" value="3">
        <span class="slider-value" id="sliderVal">3</span>
      </div>
      <button class="btn-go" id="btnGo" onclick="runFrog()">🐸 Πήδα!</button>
    </div>

    <div class="feedback" id="feedback"></div>
  </div>

  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>

<script>
  var levels = [
    { target: 3, max: 6 },
    { target: 4, max: 7 },
    { target: 2, max: 5 },
    { target: 5, max: 8 },
    { target: 6, max: 8 },
    { target: 1, max: 4 }
  ];

  var currentLevel = 0;
  var score = 0;
  var running = false;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function startGame() {
    shuffle(levels);
    currentLevel = 0;
    score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
    running = false;
    setupSlider();
    loadLevel();
  }

  function setupSlider() {
    var slider = document.getElementById('repeatSlider');
    slider.oninput = function() {
      document.getElementById('sliderVal').textContent = slider.value;
      document.getElementById('crNum').textContent = slider.value;
    };
  }

  function loadLevel() {
    if (currentLevel >= levels.length) {
      showResult();
      return;
    }
    var lv = levels[currentLevel];
    document.getElementById('levelDisplay').textContent = (currentLevel + 1) + '/' + levels.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('btnGo').disabled = false;
    document.getElementById('repeatSlider').disabled = false;
    running = false;

    var scene = document.getElementById('pondScene');
    scene.innerHTML = '';
    var totalPads = lv.max;
    for (var i = 0; i < totalPads; i++) {
      var pad = document.createElement('div');
      pad.className = 'lily-pad' + (i === lv.target - 1 ? ' goal' : '');
      pad.id = 'pad-' + i;
      pad.textContent = (i === lv.target - 1) ? '🐝' : '🌿';
      pad.innerHTML += '<span class="pad-label">' + (i + 1) + '</span>';
      scene.appendChild(pad);
    }

    document.getElementById('frogChar').textContent = '🐸';
    var slider = document.getElementById('repeatSlider');
    slider.value = 3;
    document.getElementById('sliderVal').textContent = 3;
    document.getElementById('crNum').textContent = 3;
  }

  function clearPads() {
    var lv = levels[currentLevel];
    for (var i = 0; i < lv.max; i++) {
      var pad = document.getElementById('pad-' + i);
      if (pad) pad.classList.remove('visited');
    }
  }

  function runFrog() {
    if (running) return;
    var lv = levels[currentLevel];
    var sliderVal = parseInt(document.getElementById('repeatSlider').value);
    var fb = document.getElementById('feedback');
    running = true;
    document.getElementById('btnGo').disabled = true;
    document.getElementById('repeatSlider').disabled = true;

    clearPads();
    var frog = document.getElementById('frogChar');
    frog.textContent = '🐸';

    var correct = (sliderVal === lv.target);
    var steps = correct ? lv.target : sliderVal;
    var step = 0;

    function doStep() {
      if (step >= steps) {
        frog.textContent = '🐸';
        if (correct) {
          score++;
          document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
          fb.className = 'feedback show yay';
          fb.textContent = '✅ Μπράβο! ' + sliderVal + ' φορές είναι σωστά! Το βατραχάκι έφτασε στη μέλισσα! 🐝';
        } else {
          fb.className = 'feedback show nay';
          fb.textContent = '❌ Χρειαζόταν ' + lv.target + ' φορές! Εσύ διάλεξες ' + sliderVal + '!';
          setTimeout(function() {
            fb.className = 'feedback';
            fb.style.display = 'none';
            document.getElementById('btnGo').disabled = false;
            document.getElementById('repeatSlider').disabled = false;
            running = false;
            frog.textContent = '🐸';
            clearPads();
          }, 1500);
          return;
        }
        setTimeout(function() {
          currentLevel++;
          loadLevel();
        }, 1800);
        return;
      }

      if (step < lv.max) {
        var pad = document.getElementById('pad-' + step);
        if (pad) pad.classList.add('visited');
      }

      frog.classList.remove('jumping');
      void frog.offsetWidth;
      frog.classList.add('jumping');
      frog.textContent = '🐸';

      step++;
      setTimeout(doStep, 400);
    }

    setTimeout(doStep, 300);
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var total = levels.length;
    var pct = score / total;
    var emoji, title, msg;
    if (pct === 1) {
      emoji = '🏆'; title = 'Τέλεια!';
      msg = 'Το βατραχάκι σε ευχαριστεί! Είσαι σούπερ προγραμματιστής!';
    } else if (pct >= 0.75) {
      emoji = '🎉'; title = 'Μπράβο!';
      msg = 'Τα πήγες πολύ καλά με το βατραχάκι!';
    } else if (pct >= 0.5) {
      emoji = '👍'; title = 'Ωραία!';
      msg = 'Καλή προσπάθεια! Δοκίμασε ξανά!';
    } else {
      emoji = '💪'; title = 'Καλή αρχή!';
      msg = 'Προσπάθησε ξανά! Θα τα καταφέρεις!';
    }
    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultMsg').textContent = 'Βρήκες ' + score + ' από ' + total + ' σωστά! ' + msg;
  }

  startGame();
</script>
</body>
</html>
