<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Κατηγοριοποίηση Εφαρμογών</title>
<style>
@font-face {
    font-family: 'EmojiFont';
    src: local('Noto Color Emoji'),local('Segoe UI Emoji'),local('Apple Color Emoji'),local('Twemoji Mozilla'),url('../fonts/NotoColorEmoji.ttf') format('truetype');
    unicode-range: U+200D, U+2190-21FF, U+2300-23FF, U+25A0-25FF, U+2600-27BF, U+2900-297F, U+2B00-2BFF, U+FE0F, U+1F000-1FFFF;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#fce7f3,#f0abfc);min-height:100vh;padding:15px;display:flex;justify-content:center;align-items:flex-start}
.container{background:#fff;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.15);max-width:780px;width:100%;overflow:hidden}
.header{background:linear-gradient(135deg,#be185d,#f0abfc);color:#fff;padding:18px 24px;text-align:center}
.header h1{font-size:1.4em}
.header p{font-size:.9em;opacity:.9;margin-top:4px}
.area{padding:20px}
.info-box{background:#fce7f3;border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:.88em;color:#86198f;text-align:center;line-height:1.5}
.app-display{background:#f8fafc;border-radius:16px;padding:16px;margin-bottom:14px;text-align:center}
.app-icon{font-size:4em;margin-bottom:8px}
.app-name{font-size:1.1em;font-weight:700;color:#475569}
.categories-area{background:#fff7ed;border-radius:12px;padding:14px;margin-bottom:14px}
.categories-label{font-weight:700;color:#c2410c;margin-bottom:10px;font-size:.95em;text-align:center}
.category-options{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.category-btn{background:#fff;border:2px solid #fdba74;border-radius:10px;padding:12px 18px;font-size:.9em;font-weight:700;color:#9a3412;cursor:pointer;transition:all .2s}
.category-btn:hover{transform:scale(1.05);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.category-btn.selected{border-color:#be185d;background:#fce7f3}
.category-btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
.btn-check{background:linear-gradient(135deg,#16a34a,#4ade80);color:#fff;border:none;border-radius:50px;padding:12px 30px;font-size:1em;font-weight:700;cursor:pointer;display:block;margin:10px auto;transition:all .2s}
.btn-check:hover{transform:scale(1.05);box-shadow:0 4px 15px rgba(22,163,74,.4)}
.feedback{text-align:center;font-size:1.15em;font-weight:700;margin-top:12px;min-height:36px}
.feedback.ok{color:#16a34a}
.feedback.fail{color:#dc2626}
.score-display{text-align:center;font-size:1.1em;font-weight:700;color:#be185d;margin-bottom:12px}
.progress-dots{text-align:center;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dot{width:12px;height:12px;border-radius:50%;background:#e2e8f0;transition:all .3s}
.dot.done-ok{background:#4ade80}
.dot.done-wrong{background:#f87171}
.dot.current{background:#be185d;transform:scale(1.3)}
@media(max-width:550px){.app-icon{font-size:3em}.category-btn{padding:10px 14px;font-size:.8em}}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .category-options > * { margin: 5px; }
  .progress-dots > * { margin: 3px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>📱 Κατηγοριοποίηση Εφαρμογών</h1>
<p>Βρες τη σωστή κατηγορία για κάθε εφαρμογή!</p>
</div>
<div class="area">
<div class="info-box">💡 Οι εφαρμογές χωρίζονται σε κατηγορίες ανάλογα με τη χρήση τους! Παιχνίδια, Ζωγραφική, Υπολογιστικά φύλλα, κ.λπ.</div>

<div class="score-display" id="scoreDisplay">Βαθμολογία: 0 / 6</div>

<div class="progress-dots" id="progressDots"></div>

<div class="app-display">
<div class="app-icon" id="appIcon">🎮</div>
<div class="app-name" id="appName">Super Mario</div>
</div>

<div class="categories-area">
<div class="categories-label">🎯 Κατηγορίες:</div>
<div class="category-options" id="categoryOptions">
<button class="category-btn" data-category="games" onclick="selectCategory(this)">🎮 Παιχνίδια</button>
<button class="category-btn" data-category="painting" onclick="selectCategory(this)">🎨 Ζωγραφική</button>
<button class="category-btn" data-category="browser" onclick="selectCategory(this)">🌐 Φυλλομετρητής</button>
<button class="category-btn" data-category="coding" onclick="selectCategory(this)">💻 Προγραμματισμός</button>
<button class="category-btn" data-category="spreadsheet" onclick="selectCategory(this)">📊 Υπολογιστικό φύλλο</button>
<button class="category-btn" data-category="word" onclick="selectCategory(this)">📝 Επεξεργασία κειμένου</button>
</div>
</div>

<button class="btn-check" id="checkBtn" onclick="checkAnswer()" disabled>✅ Έλεγχος</button>
<div class="feedback" id="feedback"></div>
</div>
</div>
<script>
var currentIndex=0;
var score=0;
var selectedCategory=null;

var apps=[
{
  icon:'🎮',
  name:'Super Mario',
  category:'games',
  desc:'Παιχνίδι με χαρακτήρες'
},
{
  icon:'🖌️',
  name:'TuxPaint',
  category:'painting',
  desc:'Ψηφιακή ζωγραφική'
},
{
  icon:'🌐',
  name:'Chrome',
  category:'browser',
  desc:'Πλοήγηση στο διαδίκτυο'
},
{
  icon:'💻',
  name:'Scratch',
  category:'coding',
  desc:'Δημιουργία προγραμμάτων'
},
{
  icon:'📊',
  name:'Excel',
  category:'spreadsheet',
  desc:'Πίνακες και πράξεις'
},
{
  icon:'📝',
  name:'Word',
  category:'word',
  desc:'Σύνταξη κειμένου'
}
];

function buildDots(){
  var container=document.getElementById('progressDots');
  container.innerHTML='';
  for(var i=0;i<apps.length;i++){
    var dot=document.createElement('div');
    dot.className='dot';
    dot.id='dot-'+i;
    container.appendChild(dot);
  }
}

function initChallenge(){
  var app=apps[currentIndex];
  document.getElementById('appIcon').textContent=app.icon;
  document.getElementById('appName').textContent=app.name;
  
  var buttons=document.querySelectorAll('.category-btn');
  for(var i=0;i<buttons.length;i++){
    buttons[i].classList.remove('selected');
    buttons[i].disabled=false;
  }
  
  selectedCategory=null;
  document.getElementById('checkBtn').disabled=true;
  updateDots();
}

function selectCategory(btn){
  var buttons=document.querySelectorAll('.category-btn');
  for(var i=0;i<buttons.length;i++){
    buttons[i].classList.remove('selected');
  }
  btn.classList.add('selected');
  selectedCategory=btn.dataset.category;
  document.getElementById('checkBtn').disabled=false;
}

function checkAnswer(){
  if(!selectedCategory){
    showFeedback('❌ Διάλεξε πρώτα μια κατηγορία!',false);
    return;
  }
  
  var app=apps[currentIndex];
  var isCorrect=selectedCategory===app.category;
  
  if(isCorrect){
    score++;
    var dot=document.getElementById('dot-'+currentIndex);
    dot.classList.remove('current');
    dot.classList.add('done-ok');
    showFeedback('✅ Σωστά! '+app.name+' ανήκει στην κατηγορία '+app.desc+'!',true);
    
    currentIndex++;
    
    if(currentIndex>=apps.length){
      showFinalResult();
    }else{
      setTimeout(function(){
        document.getElementById('feedback').textContent='';
        document.getElementById('feedback').className='feedback';
        initChallenge();
      },1500);
    }
  }else{
    var dot=document.getElementById('dot-'+currentIndex);
    dot.classList.remove('current');
    dot.classList.add('done-wrong');
    showFeedback('❌ Λάθος! '+app.name+' ανήκει στην κατηγορία '+app.desc+'!',false);
    
    setTimeout(function(){
      document.getElementById('feedback').textContent='';
      document.getElementById('feedback').className='feedback';
      dot.classList.remove('done-wrong');
      dot.classList.add('current');
      var buttons=document.querySelectorAll('.category-btn');
      for(var i=0;i<buttons.length;i++){
        buttons[i].classList.remove('selected');
        buttons[i].disabled=false;
      }
      selectedCategory=null;
      document.getElementById('checkBtn').disabled=true;
    },2000);
  }
  
  updateScore();
}

function updateDots(){
  var dots=document.querySelectorAll('.dot');
  for(var i=0;i<dots.length;i++){
    dots[i].classList.remove('current');
  }
  document.getElementById('dot-'+currentIndex).classList.add('current');
}

function updateScore(){
  document.getElementById('scoreDisplay').textContent='Βαθμολογία: '+score+' / '+apps.length;
}

function showFinalResult(){
  document.getElementById('appIcon').textContent='🏆';
  document.getElementById('appName').textContent='Ολοκληρώθηκε!';
  
  var buttons=document.querySelectorAll('.category-btn');
  for(var i=0;i<buttons.length;i++){
    buttons[i].disabled=true;
  }
  
  document.getElementById('checkBtn').style.display='none';
  
  if(score===apps.length){
    showFeedback('🏆 Τέλεια! Γνώριζες όλες τις κατηγορίες!',true);
  }else if(score>=4){
    showFeedback('👍 Καλά! '+score+'/'+apps.length+' σωστά!',true);
  }else{
    showFeedback('📚 '+score+'/'+apps.length+' σωστά. Θυμήσου τις κατηγορίες!',false);
  }
}

function showFeedback(msg,isOk){
  var el=document.getElementById('feedback');
  el.textContent=msg;
  el.className='feedback '+(isOk?'ok':'fail');
}

buildDots();
initChallenge();
</script>
</body>
</html>
