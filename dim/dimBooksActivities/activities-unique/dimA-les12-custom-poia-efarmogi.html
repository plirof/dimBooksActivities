<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ποια Εφαρμογή Να Ανοίξω; 🎯</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
    padding: 12px; color: #333;
  }
  .app-container { max-width: 520px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 14px;
    background: linear-gradient(135deg, #f093fb, #f5576c);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(245,87,108,.4); margin-bottom: 16px;
  }
  .header h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .header p { font-size: 1rem; opacity: .9; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #f5576c; }
  .round { font-size: 1rem; color: #888; }
  .scene-card {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 28px 20px; text-align: center; margin-bottom: 20px;
  }
  .scene-emoji { font-size: 4rem; margin-bottom: 8px; }
  .scene-text {
    font-size: 1.4rem; font-weight: 700; color: #2d3436;
    line-height: 1.5;
  }
  .app-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr; grid-gap: 10px;
  }
  .app-card {
    background: #fff; border: 3px solid #e0e0e0; border-radius: 18px;
    padding: 20px 10px; text-align: center; cursor: pointer;
    transition: all .2s ease;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .app-card:hover:not(.disabled) {
    border-color: #f5576c; transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(245,87,108,.15);
  }
  .app-card:active:not(.disabled) { transform: scale(.95); }
  .app-card .a-emoji { font-size: 3rem; margin-bottom: 6px; }
  .app-card .a-name { font-size: 1rem; font-weight: 700; color: #333; }
  .app-card.correct { border-color: #28a745; background: #d4edda; animation: pop .3s ease; }
  .app-card.wrong { border-color: #dc3545; background: #f8d7da; animation: shake .35s ease; }
  .app-card.disabled { pointer-events: none; opacity: .6; }
  .app-card.reveal { border-color: #28a745; background: #d4edda; opacity: 1; }
  @keyframes pop { 0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}60%{transform:translateX(5px)} }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; display: none;
  }
  .feedback.show { display: block; margin-bottom: 12px; }
  .feedback.true { background: #d4edda; color: #155724; }
  .feedback.false { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #f093fb, #f5576c);
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 36px; font-size: 1.2rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(245,87,108,.35);
    transition: transform .15s;
  }
  .btn-restart:hover { transform: scale(1.05); }
  @media (max-width:480px) {
    .header h1 { font-size: 1.2rem; }
    .scene-emoji { font-size: 3rem; }
    .scene-text { font-size: 1.1rem; }
    .app-card .a-emoji { font-size: 2.5rem; }
    .app-grid { grid-gap: 6px; }
  }
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🎯 Ποια Εφαρμογή Να Ανοίξω;</h1>
    <p>Διάλεξε το σωστό εικονίδιο!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">Ερώτηση 1/6</span>
  </div>
  <div id="gameArea">
    <div class="scene-card" id="sceneCard">
      <div class="scene-emoji" id="sceneEmoji">🎨</div>
      <div class="scene-text" id="sceneText">Θέλω να ζωγραφίσω ένα λουλούδι!</div>
    </div>
    <div class="app-grid" id="appGrid"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var questions = [
    { emoji: '🎨', text: 'Θέλω να ζωγραφίσω ένα λουλούδι!', answer: 0,
      apps: [{emoji:'🎨',name:'Ζωγραφική'},{emoji:'✍️',name:'Κείμενο'},{emoji:'🌐',name:'Πληροφορίες'}] },
    { emoji: '✍️', text: 'Θέλω να γράψω μια ιστορία για τον σκύλο μου!', answer: 1,
      apps: [{emoji:'🎨',name:'Ζωγραφική'},{emoji:'✍️',name:'Κείμενο'},{emoji:'🌐',name:'Πληροφορίες'}] },
    { emoji: '🌐', text: 'Θέλω να μάθω για τα ζώα του δάσους!', answer: 2,
      apps: [{emoji:'🎨',name:'Ζωγραφική'},{emoji:'✍️',name:'Κείμενο'},{emoji:'🌐',name:'Πληροφορίες'}] },
    { emoji: '🎨', text: 'Θέλω να ζωγραφίσω τη θάλασσα!', answer: 0,
      apps: [{emoji:'🎨',name:'Ζωγραφική'},{emoji:'🌐',name:'Πληροφορίες'},{emoji:'✍️',name:'Κείμενο'}] },
    { emoji: '✍️', text: 'Θέλω να γράψω τα γράμματα Α Β Γ!', answer: 2,
      apps: [{emoji:'🎨',name:'Ζωγραφική'},{emoji:'🌐',name:'Πληροφορίες'},{emoji:'✍️',name:'Κείμενο'}] },
    { emoji: '🌐', text: 'Θέλω να δω μια φωτογραφία από ελέφαντα!', answer: 1,
      apps: [{emoji:'✍️',name:'Κείμενο'},{emoji:'🌐',name:'Πληροφορίες'},{emoji:'🎨',name:'Ζωγραφική'}] }
  ];
  var current = 0; var score = 0;
  function startGame() {
    current = 0; score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    showQ();
  }
  function showQ() {
    if (current >= questions.length) { showResult(); return; }
    var q = questions[current];
    document.getElementById('sceneEmoji').textContent = q.emoji;
    document.getElementById('sceneText').textContent = q.text;
    document.getElementById('roundDisplay').textContent = 'Ερώτηση ' + (current+1) + '/' + questions.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
    var grid = document.getElementById('appGrid');
    grid.innerHTML = '';
    for (var i = 0; i < q.apps.length; i++) {
      var card = document.createElement('div');
      card.className = 'app-card';
      card.setAttribute('data-idx', i);
      card.innerHTML = '<div class="a-emoji">' + q.apps[i].emoji + '</div><div class="a-name">' + q.apps[i].name + '</div>';
      card.addEventListener('click', pick);
      grid.appendChild(card);
    }
  }
  function pick(el) {
    var q = questions[current];
    var idx = parseInt(el.getAttribute('data-idx'));
    var correct = (idx === q.answer);
    var cards = document.querySelectorAll('.app-card');
    for (var i = 0; i < cards.length; i++) cards[i].classList.add('disabled');
    var fb = document.getElementById('feedback');
    if (correct) {
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      el.classList.add('correct');
      fb.className = 'feedback show true';
      fb.textContent = '✅ Μπράβο! ' + q.apps[q.answer].name + ' είναι η σωστή εφαρμογή!';
      setTimeout(function() { current++; showQ(); }, 1000);
    } else {
      el.classList.add('wrong');
      cards[q.answer].classList.add('reveal');
      fb.className = 'feedback show false';
      fb.textContent = '❌ Ωχ! ' + q.apps[q.answer].name + ' θα σε βοηθούσε!';
      setTimeout(function() { current++; showQ(); }, 1500);
    }
  }
  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var t = questions.length;
    var e,ti,m;
    if (score===t){e='🏆';ti='Τέλεια!';m='Ξέρεις ποια εφαρμογή να ανοίγεις!'}
    else if(score>=4){e='🎉';ti='Μπράβο!';m='Τα πήγες πολύ καλά!'}
    else if(score>=3){e='👍';ti='Ωραία!';m='Δοκίμασε ξανά!'}
    else {e='💪';ti='Καλή αρχή!';m='Μην σταματάς!'}
    document.getElementById('resultEmoji').textContent = e;
    document.getElementById('resultTitle').textContent = ti;
    document.getElementById('resultMsg').textContent = 'Βρήκες '+score+' από '+t+' σωστά! '+m;
  }
  startGame();
</script>
</body>
</html>
