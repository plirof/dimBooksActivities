<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ασφαλή Μηνύματα 🛡️</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #d81b60, #e91e63);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(216,27,96,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; text-shadow: 1px 1px 2px rgba(0,0,0,.2); }
  .header p { font-size: .9rem; opacity: .95; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #d81b60; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fce4ec; border: 2px dashed #e91e63; border-radius: 16px;
    padding: 14px; margin-bottom: 14px; text-align: center;
    font-size: 1rem; color: #880e4f;
  }
  .scenario { background:#fff; border-radius:24px; padding:20px; margin-bottom:14px; box-shadow:0 4px 14px rgba(0,0,0,.08); text-align:center; }
  .scenario .sc-emoji { font-size: 4rem; margin-bottom:8px; }
  .scenario .sc-text { font-size: 1.1rem; font-weight:700; color:#2d3436; }
  .btn-row {
    display: flex; gap: 14px; justify-content: center; margin-bottom: 14px;
  }
  .btn-action {
    flex: 1; max-width: 180px; padding: 16px; border: none; border-radius: 16px;
    font-size: 1.3rem; font-weight: 700; cursor: pointer; transition: all .15s;
    font-family: inherit; box-shadow: 0 4px 12px rgba(0,0,0,.12);
  }
  .btn-action:active { transform: scale(.92); }
  .btn-safe { background: #c8e6c9; color: #2e7d32; }
  .btn-unsafe { background: #ffcdd2; color: #c62828; }
  .btn-action.disabled { pointer-events: none; opacity: .5; }
  .btn-safe.selected { background: #4caf50; color: #fff; animation: pop .3s ease; }
  .btn-unsafe.selected { background: #f44336; color: #fff; animation: pop .3s ease; }
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
  .feedback { text-align:center; padding:14px; border-radius:16px; font-size:1.1rem; font-weight:700; margin-bottom:12px; display:none; }
  .feedback.show { display:block; }
  .feedback.yay { background:#d4edda; color:#155724; }
  .feedback.nay { background:#f8d7da; color:#721c24; }
  .result-screen { background:#fff; border-radius:24px; box-shadow:0 8px 28px rgba(0,0,0,.1); padding:40px 24px; text-align:center; display:none; }
  .result-screen .big-emoji{font-size:5rem;margin-bottom:12px}
  .result-screen h2{font-size:1.6rem;color:#2d3436;margin-bottom:8px}
  .result-screen p{font-size:1.1rem;color:#666;margin-bottom:20px}
  .btn-restart{background:linear-gradient(135deg,#d81b60,#e91e63);color:#fff;border:none;border-radius:16px;padding:14px 36px;font-size:1.2rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(216,27,96,.35)}
  .btn-restart:active{transform:scale(.95)}
  @media(max-width:480px){body{padding:8px}.header h1{font-size:1.2rem}.scenario .sc-emoji{font-size:3rem}}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .btn-row > * + * { margin-left: 14px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🛡️ Ασφαλή Μηνύματα</h1>
    <p>Τι είναι ασφαλές να κάνεις;</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/8</span>
  </div>
  <div class="instructions">📱 Διάβασε κάθε κατάσταση. Είναι ασφαλές ✅ ή μήπως όχι ❌;</div>
  <div id="gameArea">
    <div class="scenario">
      <div class="sc-emoji" id="scEmoji">👋</div>
      <div class="sc-text" id="scText">Χαιρετάω έναν φίλο μου με ένα μήνυμα</div>
    </div>
    <div class="btn-row">
      <button class="btn-action btn-safe" id="btnSafe">✅ Ασφαλές</button>
      <button class="btn-action btn-unsafe" id="btnUnsafe">❌ Επικίνδυνο</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg"></p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var scenarios = [
    {e:'👋', t:'Χαιρετάω έναν φίλο μου με ένα μήνυμα', ans:true},
    {e:'❓', t:'Ανοίγω μήνυμα από άγνωστο άτομο', ans:false},
    {e:'👤', t:'Στέλνω το όνομα και τη διεύθυνσή μου σε ξένο', ans:false},
    {e:'📸', t:'Στέλνω μια φωτογραφία από το πάρτι στον φίλο μου', ans:true},
    {e:'🔗', t:'Πατάω σε ύποπτο σύνδεσμο που μου έστειλε άγνωστος', ans:false},
    {e:'🗣️', t:'Λέω στη μαμά μου αν δω κάτι περίεργο στο διαδίκτυο', ans:true},
    {e:'❤️', t:'Στέλνω μια καρδιά στον συμμαθητή μου για να τον ενθαρρύνω', ans:true},
    {e:'📋', t:'Δίνω τον κωδικό μου σε έναν φίλο', ans:false}
  ];
  var cur=0,score=0;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function startGame(){
    shuffle(scenarios);cur=0;score=0;
    document.getElementById('scoreDisplay').textContent='⭐ 0';
    document.getElementById('gameArea').style.display='block';
    document.getElementById('resultScreen').style.display='none';
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    loadScenario();
  }
  function loadScenario(){
    if(cur>=scenarios.length){showResult();return;}
    var s=scenarios[cur];
    document.getElementById('roundDisplay').textContent=(cur+1)+'/'+scenarios.length;
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    document.getElementById('scEmoji').textContent=s.e;
    document.getElementById('scText').textContent=s.t;
    var bs=document.getElementById('btnSafe');bs.className='btn-action btn-safe';bs.disabled=false;
    var bu=document.getElementById('btnUnsafe');bu.className='btn-action btn-unsafe';bu.disabled=false;
  }
  function choose(ans){
    var s=scenarios[cur];var fb=document.getElementById('feedback');
    var bs=document.getElementById('btnSafe');var bu=document.getElementById('btnUnsafe');
    bs.disabled=true;bu.disabled=true;
    if(ans===s.ans){
      score++;document.getElementById('scoreDisplay').textContent='⭐ '+score;
      if(ans){bs.className='btn-action btn-safe selected';}else{bu.className='btn-action btn-unsafe selected';}
      fb.className='feedback show yay';fb.textContent='✅ Μπράβο! Σωστά!';
    }else{
      if(ans){bs.className='btn-action btn-safe wrong';}else{bu.className='btn-action btn-unsafe wrong';}
      if(s.ans){bs.className='btn-action btn-safe selected';}else{bu.className='btn-action btn-unsafe selected';}
      fb.className='feedback show nay';fb.textContent='❌ '+(s.ans?'Αυτό είναι ασφαλές ✅':'Αυτό δεν είναι ασφαλές ❌')+'!';
    }
    setTimeout(function(){cur++;loadScenario();},1500);
  }
  function showResult(){
    document.getElementById('gameArea').style.display='none';
    document.getElementById('resultScreen').style.display='block';
    var total=scenarios.length,pct=score/total;
    var e,t,m;
    if(pct===1){e='🏆';t='Τέλεια!';m='Γνωρίζεις πώς να είσαι ασφαλής στα μηνύματα! Συνέχισε έτσι!';}
    else if(pct>=0.75){e='🎉';t='Μπράβο!';m='Τα πήγες πολύ καλά!';}
    else if(pct>=0.5){e='👍';t='Ωραία!';m='Καλή προσπάθεια!';}
    else{e='💪';t='Καλή αρχή!';m='Προσπάθησε ξανά να μάθεις για την ασφάλεια!';}
    document.getElementById('resultEmoji').textContent=e;
    document.getElementById('resultTitle').textContent=t;
    document.getElementById('resultMsg').textContent='Βρήκες '+score+' από '+total+' σωστά! '+m;
  }
  startGame();
</script>
</body>
</html>
