<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>0 ή 1; 💡</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    padding: 12px;
    color: #333;
    touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #ffd700, #ffaa00);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(255,170,0,.4);
    margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; text-shadow: 1px 1px 2px rgba(0,0,0,.2); }
  .header p { font-size: .95rem; opacity: .95; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #ffaa00; }
  .round { font-size: 1rem; color: #888; }
  .scene-card {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 28px 20px; margin-bottom: 18px;
    text-align: center;
    transition: background .5s ease;
  }
  .bulb-area {
    font-size: 6rem; margin-bottom: 10px;
    min-height: 120px; display: flex;
    align-items: center; justify-content: center;
  }
  .bulb-switch-area {
    display: flex; justify-content: center; gap: 20px;
    align-items: center; margin-bottom: 10px;
  }
  .switch-img {
    font-size: 3.5rem; transition: transform .3s ease;
  }
  .switch-img.off { transform: rotate(0deg); }
  .switch-img.on { transform: rotate(15deg); }
  .scene-label {
    font-size: 1.2rem; font-weight: 700; color: #2d3436;
    margin-bottom: 4px;
  }
  .hint-text {
    font-size: 1rem; color: #888;
    background: #f0f4ff; border-radius: 12px;
    padding: 10px; margin-bottom: 14px;
    line-height: 1.4;
  }
  .btn-group { display: flex; gap: 16px; justify-content: center; }
  .btn-bit {
    border: none; border-radius: 50%;
    width: 90px; height: 90px;
    font-size: 2.5rem; font-weight: 900;
    cursor: pointer; transition: transform .15s, box-shadow .2s;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(0,0,0,.12);
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .btn-zero {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
  }
  .btn-zero:active { transform: scale(.9); }
  .btn-one {
    background: linear-gradient(135deg, #f093fb, #f5576c);
    color: #fff;
  }
  .btn-one:active { transform: scale(.9); }
  .btn-bit:disabled { opacity: .4; pointer-events: none; }
  .btn-bit.wrong { opacity: .6; filter: grayscale(.8); }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; margin: 14px 0;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.yay { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
  .feedback.nay { background: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #ffd700, #ffaa00); color: #fff;
    border: none; border-radius: 16px; padding: 14px 36px;
    font-size: 1.2rem; font-weight: 700; cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(255,170,0,.35);
    transition: transform .15s;
  }
  .btn-restart:active { transform: scale(.95); }
  @media (max-width: 480px) {
    body { padding: 8px; }
    .header h1 { font-size: 1.2rem; }
    .bulb-area { font-size: 5rem; min-height: 100px; }
    .btn-bit { width: 75px; height: 75px; font-size: 2rem; }
    .hint-text { font-size: .9rem; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .bulb-switch-area > * + * { margin-left: 20px; }
  .btn-group > * + * { margin-left: 16px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>💡 0 ή 1;</h1>
    <p>Το ρεύμα περνάει ή όχι;</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/8</span>
  </div>

  <div id="gameArea">
    <div class="scene-card" id="sceneCard">
      <div class="bulb-area" id="bulbDisplay">💡</div>
      <div class="bulb-switch-area">
        <span class="switch-img" id="switchDisplay">🔌</span>
      </div>
      <div class="scene-label" id="sceneLabel">Ο διακόπτης είναι ανοιχτός</div>
      <div class="hint-text" id="hintText">
        💡 Ανοιχτός διακόπτης = περνάει ρεύμα = <strong>1</strong><br>
        🔌 Κλειστός διακόπτης = δεν περνάει ρεύμα = <strong>0</strong>
      </div>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="btn-group">
      <button class="btn-bit btn-zero" id="btn0" onclick="chooseBit(0)">0</button>
      <button class="btn-bit btn-one" id="btn1" onclick="chooseBit(1)">1</button>
    </div>
  </div>

  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>

<script>
  var rounds = [
    { label: 'Ο διακόπτης είναι ανοιχτός', bulb: '💡', switchEmoji: '🔛', ans: 1 },
    { label: 'Ο διακόπτης είναι κλειστός', bulb: '⚪', switchEmoji: '🔌', ans: 0 },
    { label: 'Το ρεύμα περνάει!', bulb: '💡', switchEmoji: '🔛', ans: 1 },
    { label: 'Το ρεύμα ΔΕΝ περνάει', bulb: '⚪', switchEmoji: '🔌', ans: 0 },
    { label: 'Η λάμπα είναι αναμμένη', bulb: '💡', switchEmoji: '🔛', ans: 1 },
    { label: 'Η λάμπα είναι σβηστή', bulb: '⚪', switchEmoji: '🔌', ans: 0 },
    { label: 'Πατάμε τον διακόπτη — ανοίγει!', bulb: '💡', switchEmoji: '🔛', ans: 1 },
    { label: 'Πατάμε τον διακόπτη — κλείνει!', bulb: '⚪', switchEmoji: '🔌', ans: 0 }
  ];

  var currentIndex = 0;
  var score = 0;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function startGame() {
    shuffle(rounds);
    currentIndex = 0;
    score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('btn0').disabled = false;
    document.getElementById('btn1').disabled = false;
    showRound();
  }

  function showRound() {
    if (currentIndex >= rounds.length) {
      showResult();
      return;
    }
    var r = rounds[currentIndex];
    document.getElementById('bulbDisplay').textContent = r.bulb;
    document.getElementById('switchDisplay').textContent = r.switchEmoji;
    document.getElementById('sceneLabel').textContent = r.label;
    document.getElementById('roundDisplay').textContent = (currentIndex + 1) + '/' + rounds.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('btn0').disabled = false;
    document.getElementById('btn0').className = 'btn-bit btn-zero';
    document.getElementById('btn1').disabled = false;
    document.getElementById('btn1').className = 'btn-bit btn-one';
  }

  function chooseBit(bit) {
    var r = rounds[currentIndex];
    var correct = (bit === r.ans);

    document.getElementById('btn0').disabled = true;
    document.getElementById('btn1').disabled = true;

    if (!correct) {
      var wrongBtn = (bit === 0) ? 'btn0' : 'btn1';
      document.getElementById(wrongBtn).classList.add('wrong');
    }

    var fb = document.getElementById('feedback');

    if (correct) {
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      fb.className = 'feedback show yay';
      fb.textContent = '✅ Μπράβο! Περνάει ρεύμα → ' + r.ans + ' !';
    } else {
      fb.className = 'feedback show nay';
      fb.textContent = '❌ Ωχ! Θυμήσου: ρεύμα = 1, χωρίς ρεύμα = 0. Η σωστή απάντηση είναι ' + r.ans + '!';
    }

    setTimeout(function() {
      currentIndex++;
      showRound();
    }, 1600);
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var total = rounds.length;
    var pct = score / total;
    var emoji, title, msg;
    if (pct === 1) {
      emoji = '🏆'; title = 'Τέλεια!';
      msg = 'Έμαθες τέλεια το 0 και το 1! Είσαι προγραμματιστής!';
    } else if (pct >= 0.75) {
      emoji = '🎉'; title = 'Μπράβο!';
      msg = 'Τα πήγες πολύ καλά!';
    } else if (pct >= 0.5) {
      emoji = '👍'; title = 'Ωραία!';
      msg = 'Καλή προσπάθεια! Δοκίμασε ξανά!';
    } else {
      emoji = '💪'; title = 'Καλή αρχή!';
      msg = 'Προσπάθησε ξανά! Θα τα πας καλύτερα!';
    }
    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultMsg').textContent = 'Βρήκες ' + score + ' από ' + total + ' σωστά! ' + msg;
  }

  startGame();
</script>
</body>
</html>
