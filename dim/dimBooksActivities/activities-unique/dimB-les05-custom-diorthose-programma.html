<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Διόρθωσε το Πρόγραμμα 🐭</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
    padding: 12px;
    color: #333;
    touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #f093fb, #f5576c);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(245,87,108,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; }
  .header p { font-size: .9rem; opacity: .85; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #f5576c; }
  .level { font-size: 1rem; color: #888; }
  .story-banner {
    background: #fff; border-radius: 20px; padding: 14px 18px;
    margin-bottom: 14px; text-align: center; font-size: 1rem;
    font-weight: 700; color: #2d3436;
    box-shadow: 0 4px 14px rgba(0,0,0,.08); line-height: 1.5;
  }
  .goal-banner {
    background: #fff8e1; border: 2px dashed #ffb300; border-radius: 16px;
    padding: 10px 16px; margin-bottom: 14px; text-align: center;
    font-size: 1rem; font-weight: 700; color: #b26a00; line-height: 1.5;
  }
  .program-show {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 20px; margin-bottom: 14px; text-align: center;
  }
  .program-show .ps-label {
    font-size: .85rem; color: #888; font-weight: 600; margin-bottom: 8px;
  }
  .code-visual {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .code-repeat {
    background: #fce4ec; border: 3px solid #f48fb1;
    border-radius: 14px; padding: 8px 18px;
    font-size: 1.1rem; font-weight: 700; color: #c2185b;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .code-repeat .cr-num {
    background: #f5576c; color: #fff; border-radius: 50%;
    width: 32px; height: 32px; display: inline-flex;
    align-items: center; justify-content: center;
  }
  .code-cmds {
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
    margin-top: 6px;
  }
  .code-cmd {
    background: #e8f5e9; border: 2px solid #a5d6a7;
    border-radius: 10px; padding: 6px 12px;
    font-size: 1rem; font-weight: 600; color: #2e7d32;
  }
  .code-cmd.wrong-cmd { border-color: #f5576c; background: #fce4ec; color: #c2185b; text-decoration: line-through; }
  .options-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px;
  }
  .opt-card {
    background: #fff; border: 3px solid #e8e8e8;
    border-radius: 18px; padding: 16px 10px;
    text-align: center; cursor: pointer;
    transition: all .2s; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .opt-card:active { transform: scale(.95); }
  .opt-card .opt-code {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .opt-card .opt-repeat {
    background: #fce4ec; border: 2px solid #f48fb1;
    border-radius: 10px; padding: 4px 12px;
    font-size: .95rem; font-weight: 700; color: #c2185b;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .opt-card .opt-repeat .or-num {
    background: #f5576c; color: #fff; border-radius: 50%;
    width: 24px; height: 24px; display: inline-flex;
    align-items: center; justify-content: center; font-size: .8rem;
  }
  .opt-card .opt-cmds {
    display: flex; gap: 4px; flex-wrap: wrap; justify-content: center;
  }
  .opt-card .opt-cmd {
    background: #e8f5e9; border: 1px solid #a5d6a7;
    border-radius: 8px; padding: 4px 8px;
    font-size: .85rem; font-weight: 600; color: #2e7d32;
  }
  .opt-card .opt-label { font-size: .85rem; color: #888; margin-top: 6px; font-weight: 600; }
  .opt-card.correct { border-color: #28a745; background: #d4edda; animation: pop .4s ease; }
  .opt-card.wrong { border-color: #dc3545; background: #f8d7da; animation: shake .4s ease; }
  .opt-card.disabled { pointer-events: none; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; display: none;
  }
  .feedback.show { display: block; }
  .feedback.yay { background: #d4edda; color: #155724; }
  .feedback.nay { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff;
    border: none; border-radius: 16px; padding: 14px 36px;
    font-size: 1.2rem; font-weight: 700; cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(245,87,108,.35); transition: transform .15s;
  }
  .btn-restart:active { transform: scale(.95); }
  @media (max-width:480px) {
    body { padding: 8px; }
    .header h1 { font-size: 1.2rem; }
  }
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🐭 Διόρθωσε το Πρόγραμμα</h1>
    <p>Βοήθησε τον Κοντορεβιθούλη να γυρίσει σπίτι!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="level" id="levelDisplay">1/8</span>
  </div>
  <div id="gameArea">
    <div class="story-banner">🐭 Ο Κοντορεβιθούλης άφησε ψίχουλα στο δάσος! Βρες το σωστό πρόγραμμα για να γυρίσει σπίτι!</div>
    <div class="program-show">
      <div class="ps-label">⚠️ Κάτι έχει λάθος εδώ:</div>
      <div class="code-visual" id="wrongProgram"></div>
    </div>
    <div class="goal-banner" id="goalBanner"></div>
    <div class="options-grid" id="optionsGrid"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var levels = [
    { goal: '🏠 Στόχος: 9 βήματα ➡️!', wrong: { repeat: 2, cmds: ['➡️','➡️','➡️'] }, options: [
      { repeat: 3, cmds: ['➡️','➡️','➡️'] }, { repeat: 2, cmds: ['➡️','➡️'] }, { repeat: 4, cmds: ['➡️','➡️','➡️'] }, { repeat: 2, cmds: ['➡️','➡️','➡️','➡️'] }
    ], answer: 0 },
    { goal: '🏠 Στόχος: γύρνα ακριβώς πίσω στην αρχή!', wrong: { repeat: 3, cmds: ['➡️'] }, options: [
      { repeat: 3, cmds: ['➡️','⬅️'] }, { repeat: 4, cmds: ['➡️'] }, { repeat: 3, cmds: ['⬅️','⬅️'] }, { repeat: 2, cmds: ['➡️','⬅️','➡️'] }
    ], answer: 0 },
    { goal: '🏠 Στόχος: 5 βήματα ➡️!', wrong: { repeat: 3, cmds: ['➡️'] }, options: [
      { repeat: 5, cmds: ['➡️'] }, { repeat: 3, cmds: ['➡️'] }, { repeat: 4, cmds: ['➡️'] }, { repeat: 6, cmds: ['➡️'] }
    ], answer: 0 },
    { goal: '🏠 Στόχος: 4 βήματα ➡️ και 4 βήματα ⬆️!', wrong: { repeat: 2, cmds: ['➡️','⬆️'] }, options: [
      { repeat: 4, cmds: ['➡️','⬆️'] }, { repeat: 2, cmds: ['➡️','⬆️'] }, { repeat: 3, cmds: ['➡️','⬆️'] }, { repeat: 5, cmds: ['➡️','⬆️'] }
    ], answer: 0 },
    { goal: '🏠 Στόχος: 9 βήματα ⬅️!', wrong: { repeat: 3, cmds: ['⬅️','⬅️'] }, options: [
      { repeat: 3, cmds: ['⬅️','⬅️','⬅️'] }, { repeat: 3, cmds: ['⬅️','⬅️'] }, { repeat: 4, cmds: ['⬅️','⬅️'] }, { repeat: 2, cmds: ['⬅️','⬅️','⬅️'] }
    ], answer: 0 },
    { goal: '🏠 Στόχος: 6 βήματα ➡️!', wrong: { repeat: 6, cmds: ['➡️','➡️'] }, options: [
      { repeat: 3, cmds: ['➡️','➡️'] }, { repeat: 6, cmds: ['➡️','➡️'] }, { repeat: 4, cmds: ['➡️','➡️'] }, { repeat: 2, cmds: ['➡️','➡️'] }
    ], answer: 0 },
    { goal: '🏠 Στόχος: 9 βήματα ⬆️!', wrong: { repeat: 1, cmds: ['⬆️','⬆️','⬆️'] }, options: [
      { repeat: 3, cmds: ['⬆️','⬆️','⬆️'] }, { repeat: 1, cmds: ['⬆️','⬆️','⬆️'] }, { repeat: 2, cmds: ['⬆️','⬆️','⬆️'] }, { repeat: 4, cmds: ['⬆️','⬆️','⬆️'] }
    ], answer: 0 },
    { goal: '🏠 Στόχος: γύρνα ακριβώς πίσω στην αρχή!', wrong: { repeat: 3, cmds: ['➡️','⬅️','➡️'] }, options: [
      { repeat: 3, cmds: ['➡️','⬅️'] }, { repeat: 3, cmds: ['➡️','⬅️','➡️'] }, { repeat: 4, cmds: ['➡️'] }, { repeat: 2, cmds: ['⬅️','⬅️'] }
    ], answer: 0 }
  ];
  var cur = 0, score = 0, curOpts = [], curAns = 0;
  function shuffle(a) { for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a; }
  function startGame() { shuffle(levels); cur=0; score=0;
    document.getElementById('scoreDisplay').textContent='⭐ 0';
    document.getElementById('gameArea').style.display='block';
    document.getElementById('resultScreen').style.display='none';
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none'; loadLevel(); }
  function renderProg(prog, container) {
    var r = '<div class="code-repeat">🔁 Επανάλαβε <span class="cr-num">'+prog.repeat+'</span></div><div class="code-cmds">';
    for(var i=0;i<prog.cmds.length;i++) r+= '<span class="code-cmd">' + prog.cmds[i] + '</span>';
    r+= '</div>'; container.innerHTML = r;
  }
  function loadLevel() {
    if(cur>=levels.length){showResult();return;}
    var lv=levels[cur];
    document.getElementById('levelDisplay').textContent=(cur+1)+'/'+levels.length;
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    document.getElementById('goalBanner').textContent=lv.goal;
    renderProg(lv.wrong, document.getElementById('wrongProgram'));
    curOpts=[]; for(var j=0;j<lv.options.length;j++) curOpts.push(lv.options[j]);
    shuffle(curOpts);
    curAns=curOpts.indexOf(lv.options[lv.answer]);
    var grid=document.getElementById('optionsGrid'); grid.innerHTML='';
    for(var j=0;j<curOpts.length;j++){
      (function(idx){
        var card=document.createElement('div'); card.className='opt-card';
        var cmdsHtml='';
        for(var k=0;k<curOpts[idx].cmds.length;k++) cmdsHtml+='<span class="opt-cmd">'+curOpts[idx].cmds[k]+'</span>';
        card.innerHTML='<div class="opt-code"><div class="opt-repeat">🔁 <span class="or-num">'+curOpts[idx].repeat+'</span></div><div class="opt-cmds">'+cmdsHtml+'</div></div><div class="opt-label">Επιλογή '+(idx+1)+'</div>';
        card.addEventListener('click',function(){choose(idx);});
        grid.appendChild(card);
      })(j);
    }
  }
  function choose(idx){
    var fb=document.getElementById('feedback');
    var cards=document.querySelectorAll('.opt-card');
    for(var i=0;i<cards.length;i++) cards[i].classList.add('disabled');
    if(idx===curAns){score++;
      document.getElementById('scoreDisplay').textContent='⭐ '+score;
      cards[idx].classList.add('correct');
      fb.className='feedback show yay';
      fb.textContent='✅ Μπράβο! Διόρθωσες το πρόγραμμα! Ο Κοντορεβιθούλης γύρισε σπίτι!';
    }else{
      cards[idx].classList.add('wrong'); cards[curAns].classList.add('correct');
      fb.className='feedback show nay';
      fb.textContent='❌ Λάθος! Η σωστή επιλογή είναι η '+(curAns+1)+'!';
    }
    setTimeout(function(){cur++;loadLevel();},1800);
  }
  function showResult(){
    document.getElementById('gameArea').style.display='none';
    document.getElementById('resultScreen').style.display='block';
    var total=levels.length; var pct=score/total;
    var emoji,title,msg;
    if(pct===1){emoji='🏆';title='Τέλεια!';msg='Διόρθωσες όλα τα προγράμματα! Είσαι σούπερ προγραμματιστής!';}
    else if(pct>=0.75){emoji='🎉';title='Μπράβο!';msg='Σχεδόν όλα σωστά! Τα πήγες πολύ καλά!';}
    else if(pct>=0.5){emoji='👍';title='Ωραία!';msg='Καλή προσπάθεια! Δοκίμασε ξανά!';}
    else{emoji='💪';title='Καλή αρχή!';msg='Προσπάθησε ξανά! Θα γίνεις σούπερ!';}
    document.getElementById('resultEmoji').textContent=emoji;
    document.getElementById('resultTitle').textContent=title;
    document.getElementById('resultMsg').textContent='Βρήκες '+score+' από '+total+' σωστά! '+msg;
  }
  startGame();
</script>
</body>
</html>
