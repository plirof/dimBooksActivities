<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Πριν & Μετά — Διαχείριση Αρχείων</title>
<style>
@font-face {
    font-family: 'EmojiFont';
    src: local('Noto Color Emoji'),local('Segoe UI Emoji'),local('Apple Color Emoji'),local('Twemoji Mozilla'),url('../fonts/NotoColorEmoji.ttf') format('truetype');
    unicode-range: U+200D, U+2190-21FF, U+2300-23FF, U+25A0-25FF, U+2600-27BF, U+2900-297F, U+2B00-2BFF, U+FE0F, U+1F000-1FFFF;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#f0fdf4,#86efac);min-height:100vh;padding:15px;display:flex;justify-content:center;align-items:flex-start}
.container{background:#fff;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.15);max-width:820px;width:100%;overflow:hidden}
.header{background:linear-gradient(135deg,#065f46,#10b981);color:#fff;padding:18px 24px;text-align:center}
.header h1{font-size:1.3em}
.header p{font-size:.85em;opacity:.9;margin-top:4px}
.area{padding:16px;display:flex;flex-direction:column;gap:12px}
.info{background:#ecfdf5;border-radius:12px;border-left:4px solid #10b981;padding:10px 14px;font-size:.85em;color:#064e3b;line-height:1.5}
.info b{color:#065f46}
.progress{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.pr-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7em;font-weight:700;border:2px solid #d1d5db;color:#9ca3af;background:#fff}
.pr-dot.done{border-color:#10b981;background:#d1fae5;color:#065f46}
.pr-dot.wrong{border-color:#ef4444;background:#fee2e2;color:#b91c1c}
.pr-dot.active{border-color:#065f46;background:#065f46;color:#fff}
.before-after{display:flex;gap:14px;align-items:stretch}
.ba-col{flex:1;background:#f8fafc;border:2px solid #e2e8f0;border-radius:14px;padding:12px;min-height:220px}
.ba-col h4{text-align:center;font-size:.82em;padding:6px;border-radius:8px;margin-bottom:8px}
.ba-before h4{background:#fee2e2;color:#991b1b}
.ba-after h4{background:#d1fae5;color:#065f46}
.ba-arrow{display:flex;align-items:center;justify-content:center;font-size:2em;color:#10b981;flex-shrink:0;padding:0 4px}
.ba-item{padding:6px 10px;border-radius:8px;font-size:.8em;margin:3px 0;display:flex;align-items:center;gap:4px;background:#fff;border:1px solid #e2e8f0}
.ba-item .ico{font-size:1.1em}
.ba-item .nm{font-weight:600;color:#334155}
.ba-item .detail{font-size:.75em;color:#94a3b8;margin-left:auto}
.ba-item .del{text-decoration:line-through;color:#ef4444;opacity:.6}
.ba-item .new{background:#d1fae5;font-weight:700}
.ba-empty{color:#d1d5db;text-align:center;padding:20px;font-size:.85em}
.question{text-align:center;padding:12px;font-weight:700;color:#065f46;font-size:1em}
.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.opt-btn{padding:10px 20px;border:2px solid #d1d5db;border-radius:12px;background:#fff;cursor:pointer;font-size:.85em;font-weight:600;transition:all .2s;color:#334155}
.opt-btn:hover{transform:translateY(-2px);border-color:#10b981;background:#ecfdf5}
.opt-btn.selected{border-color:#10b981;background:#d1fae5;color:#065f46}
.opt-btn.correct{border-color:#16a34a;background:#dcfce7;color:#166534}
.opt-btn.wrong{border-color:#ef4444;background:#fee2e2;color:#b91c1c}
.controls{display:flex;justify-content:center;gap:12px}
.btn{padding:10px 26px;border:none;border-radius:50px;font-size:.9em;font-weight:700;cursor:pointer;transition:all .2s}
.btn-check{background:linear-gradient(135deg,#065f46,#10b981);color:#fff}
.btn-check:hover{transform:scale(1.05);box-shadow:0 4px 15px rgba(6,95,70,.35)}
.btn-check:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-reset{background:#f0f0f0;color:#555}
.btn-reset:hover{background:#e0e0e0}
.feedback{text-align:center;font-size:1em;font-weight:700;min-height:28px}
.feedback.ok{color:#16a34a}
.feedback.fail{color:#dc2626}
@media(max-width:550px){.before-after{flex-direction:column}.ba-arrow{transform:rotate(90deg)}}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .area > * + * { margin-top: 12px; }
  .progress > * { margin: 3px; }
  .before-after > * + * { margin-left: 14px; }
  .ba-item > * + * { margin-left: 4px; }
  .opts > * { margin: 4px; }
  .controls > * + * { margin-left: 12px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🔄 Πριν & Μετά — Διαχείριση Αρχείων</h1>
<p>Δες την αλλαγή και βρες ποια ενέργεια έγινε!</p>
</div>
<div class="area">
<div class="info">💡 Στη διαχείριση αρχείων μπορούμε να: <b>Αντιγράψουμε</b> (copy-paste), <b>Μετακινήσουμε</b> (cut-paste), <b>Διαγράψουμε</b>, <b>Μετονομάσουμε</b>, ή <b>Δημιουργήσουμε</b> νέο φάκελο/αρχείο. Παρατήρησε προσεκτικά την αλλαγή!</div>
<div class="progress" id="progressDots"></div>
<div id="gameArea">
<div class="before-after" id="baDisplay"></div>
<div class="question" id="questionText"></div>
<div class="opts" id="options"></div>
</div>
<div class="feedback" id="feedback"></div>
<div class="controls">
<button class="btn btn-check" id="checkBtn" onclick="submitAnswer()" disabled>✅ Έλεγχος</button>
<button class="btn btn-reset" id="nextBtn" onclick="nextPuzzle()" style="display:none">⏭ Επόμενο</button>
<button class="btn btn-reset" onclick="resetGame()">🔄 Αρχή</button>
</div>
</div>
</div>
<script>
var puzzles=[
{b4:{items:[{ico:'📁',nm:'Έγγραφα'},{ico:'📄',nm:'Εργασία.txt'},{ico:'📄',nm:'Σημειώσεις.txt'}]},af:{items:[{ico:'📁',nm:'Έγγραφα'},{ico:'📄',nm:'Εργασία.txt'}]},q:'Τι έγινε στο αρχείο «Σημειώσεις.txt»;',opts:['Αντιγραφή','Μετακίνηση','Διαγραφή','Μετονομασία'],correct:2},
{b4:{items:[{ico:'📁',nm:'Εικόνες'},{ico:'🖼️',nm:'Ηλιοβασίλεμα.png'}]},af:{items:[{ico:'📁',nm:'Εικόνες'},{ico:'🖼️',nm:'Sunset.png'}]},q:'Τι συνέβη στο αρχείο;',opts:['Διαγράφηκε','Αντιγράφηκε','Μετονομάστηκε','Δημιουργήθηκε νέο'],correct:2},
{b4:{items:[{ico:'📁',nm:'Σχολείο'},{ico:'📄',nm:'Μαθηματικά.txt'},{ico:'📄',nm:'Γλώσσα.txt'}]},af:{items:[{ico:'📁',nm:'Σχολείο'},{ico:'📄',nm:'Μαθηματικά.txt'},{ico:'📄',nm:'Γλώσσα.txt'},{ico:'📄',nm:'Ιστορία.txt'}]},q:'Τι έγινε;',opts:['Αντιγραφή','Δημιουργία νέου αρχείου','Μετακίνηση','Διαγραφή'],correct:1},
{b4:{items:[{ico:'📁',nm:'Μουσική'},{ico:'🎵',nm:'Τραγούδι.mp3'}]},af:{items:[{ico:'📁',nm:'Μουσική'},{ico:'🎵',nm:'Το Αγαπημένο μου.mp3'}]},q:'Τι συνέβη στο αρχείο;',opts:['Διαγράφηκε','Αντιγράφηκε','Μετονομάστηκε','Δημιουργήθηκε νέο'],correct:2},
{b4:{items:[{ico:'📁',nm:'Εικόνες'},{ico:'🖼️',nm:'Δεινόσαυρος.png'}]},af:{items:[{ico:'📁',nm:'Backup'},{ico:'🖼️',nm:'Δεινόσαυρος.png'},{ico:'📁',nm:'Εικόνες'}]},q:'Τι έγινε με το αρχείο Δεινόσαυρος.png;',opts:['Διαγράφηκε','Αντιγράφηκε στον Backup','Μετακινήθηκε στον Backup','Μετονομάστηκε'],correct:1},
{b4:{items:[{ico:'🖼️',nm:'Σχέδιο.png'},{ico:'📁',nm:'Εξαγωγές'}]},af:{items:[{ico:'🖼️',nm:'Σχέδιο.png'},{ico:'🖼️',nm:'Σχέδιο.jpg'},{ico:'📁',nm:'Εξαγωγές'}]},q:'Τι έγινε στο αρχείο Σχέδιο;',opts:['Διαγράφηκε','Μετατράπηκε σε .jpg','Μετακινήθηκε','Μετονομάστηκε'],correct:1},
{b4:{items:[{ico:'📁',nm:'Λήψεις'},{ico:'📦',nm:'Πρόγραμμα.exe'}]},af:{items:[{ico:'📁',nm:'Λήψεις'}]},q:'Τι έπαθε το Πρόγραμμα.exe;',opts:['Αντιγράφηκε','Διαγράφηκε','Μετακινήθηκε','Μετονομάστηκε'],correct:1},
{b4:{items:[{ico:'📁',nm:'Projects'},{ico:'📄',nm:'Ιδέα.txt'},{ico:'📄',nm:'Σχέδιο.txt'}]},af:{items:[{ico:'📁',nm:'Projects'},{ico:'📄',nm:'Ιδέα.txt'},{ico:'📄',nm:'Σχέδιο.txt'},{ico:'📄',nm:'Ιδέα - Αντιγραφή.txt'}]},q:'Τι έγινε;',opts:['Διαγραφή','Μετακίνηση','Αντιγραφή','Μετονομασία'],correct:2}
];

var currentPuzzle=0;
var results=[];
var selectedAnswer=null;
var answered=false;

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

var puzzleOrder=[];

function renderProgress(){
var container=document.getElementById('progressDots');
container.innerHTML='';
for(var i=0;i<puzzles.length;i++){
var dot=document.createElement('div');
dot.className='pr-dot';
dot.textContent=i+1;
if(results[i]!==undefined)dot.classList.add(results[i]?'done':'wrong');
if(i===currentPuzzle)dot.classList.add('active');
container.appendChild(dot);
}
}

function renderPuzzle(){
renderProgress();
var p=puzzles[puzzleOrder[currentPuzzle]];
selectedAnswer=null;
answered=false;
document.getElementById('feedback').textContent='';
document.getElementById('feedback').className='feedback';
document.getElementById('checkBtn').disabled=true;
document.getElementById('nextBtn').style.display='none';
var ba=document.getElementById('baDisplay');
ba.innerHTML='<div class="ba-col ba-before"><h4>🔴 Πριν</h4>'+renderItems(p.b4)+'</div>';
ba.innerHTML+='<div class="ba-arrow">➡️</div>';
ba.innerHTML+='<div class="ba-col ba-after"><h4>🟢 Μετά</h4>'+renderItems(p.af)+'</div>';
document.getElementById('questionText').textContent=p.q;
var optsDiv=document.getElementById('options');
optsDiv.innerHTML='';
for(var i=0;i<p.opts.length;i++){
(function(idx){
var btn=document.createElement('div');
btn.className='opt-btn';
btn.textContent=p.opts[idx];
btn.onclick=function(){selectOption(this,idx);};
optsDiv.appendChild(btn);
})(i);
}
}

function renderItems(state){
var html='';
if(!state.items||state.items.length===0){html+='<div class="ba-empty">(άδειο)</div>';return html;}
for(var i=0;i<state.items.length;i++){
var item=state.items[i];
html+='<div class="ba-item"><span class="ico">'+item.ico+'</span><span class="nm">'+item.nm+'</span></div>';
}
return html;
}

function selectOption(el,idx){
if(answered)return;
var btns=document.querySelectorAll('.opt-btn');
for(var i=0;i<btns.length;i++)btns[i].classList.remove('selected');
el.classList.add('selected');
selectedAnswer=idx;
document.getElementById('checkBtn').disabled=false;
}

function submitAnswer(){
if(selectedAnswer===null||answered)return;
var p=puzzles[puzzleOrder[currentPuzzle]];
answered=true;
var btns=document.querySelectorAll('.opt-btn');
for(var i=0;i<btns.length;i++)btns[i].classList.remove('selected');
if(selectedAnswer===p.correct){
btns[selectedAnswer].classList.add('correct');
results[currentPuzzle]=true;
showFeedback('✅ Σωστά! '+p.opts[p.correct],true);
}else{
btns[selectedAnswer].classList.add('wrong');
btns[p.correct].classList.add('correct');
results[currentPuzzle]=false;
showFeedback('❌ Λάθος! Η σωστή ενέργεια ήταν: '+p.opts[p.correct],false);
}
renderProgress();
document.getElementById('checkBtn').disabled=true;
document.getElementById('nextBtn').style.display='inline-block';
}

function nextPuzzle(){
if(currentPuzzle>=puzzles.length-1){
showFinal();
return;
}
currentPuzzle++;
renderPuzzle();
}

function showFinal(){
var correct=0;
for(var i=0;i<results.length;i++)if(results[i])correct++;
var pct=Math.round(correct/results.length*100);
var msg='';
if(pct===100)msg='🏆 Τέλεια! '+correct+'/'+results.length+'! Γνωρίζεις άριστα τις ενέργειες διαχείρισης αρχείων!';
else if(pct>=60)msg='👏 Μπράβο! '+correct+'/'+results.length+' σωστά! Συνέχισε να εξασκείσαι!';
else msg='💪 '+correct+'/'+results.length+' σωστά. Δοκίμασε ξανά για να μάθεις!';
document.getElementById('gameArea').innerHTML='<div style="text-align:center;padding:30px;font-size:1.15em;font-weight:700;color:#065f46">'+msg+'</div>';
document.getElementById('nextBtn').style.display='none';
}

function showFeedback(msg,isOk){
var el=document.getElementById('feedback');
el.textContent=msg;
el.className='feedback '+(isOk?'ok':'fail');
}

function resetGame(){
currentPuzzle=0;
results=[];
puzzleOrder=[];
for(var i=0;i<puzzles.length;i++)puzzleOrder.push(i);
shuffle(puzzleOrder);
renderPuzzle();
document.getElementById('nextBtn').style.display='inline-block';
}

resetGame();
</script>
</body>
</html>
