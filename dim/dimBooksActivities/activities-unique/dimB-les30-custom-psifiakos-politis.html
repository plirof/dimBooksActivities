<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ψηφιακός Πολίτης 🌐</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #e8eaf6 0%, #c5cae9 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #283593, #5c6bc0);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(40,53,147,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; text-shadow: 1px 1px 2px rgba(0,0,0,.2); }
  .header p { font-size: .9rem; opacity: .95; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #283593; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #e8eaf6; border: 2px dashed #5c6bc0; border-radius: 16px;
    padding: 14px; margin-bottom: 14px; text-align: center;
    font-size: 1rem; color: #1a237e;
  }
  .citizen-badge {
    background: #fff; border-radius: 24px; padding: 16px;
    margin-bottom: 14px; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.08);
  }
  .cb-icon { font-size: 4rem; margin-bottom: 4px; }
  .cb-text { font-size: .95rem; font-weight: 700; color: #283593; }
  .scenario {
    background: #fff; border-radius: 20px; padding: 20px;
    margin-bottom: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.08);
    text-align: center;
  }
  .sc-emoji { font-size: 4rem; margin-bottom: 8px; }
  .sc-text { font-size: 1.1rem; font-weight: 700; color: #2d3436; }
  .btn-row {
    display: flex; gap: 14px; justify-content: center; margin-bottom: 14px;
  }
  .btn-action {
    flex: 1; max-width: 180px; padding: 16px; border: none; border-radius: 16px;
    font-size: 1.3rem; font-weight: 700; cursor: pointer; transition: all .15s;
    font-family: inherit; box-shadow: 0 4px 12px rgba(0,0,0,.12);
  }
  .btn-action:active { transform: scale(.92); }
  .btn-good { background: #c8e6c9; color: #2e7d32; }
  .btn-bad { background: #ffcdd2; color: #c62828; }
  .btn-action.disabled { pointer-events: none; opacity: .5; }
  .btn-good.selected { background: #4caf50; color: #fff; animation: pop .3s ease; }
  .btn-bad.selected { background: #f44336; color: #fff; animation: pop .3s ease; }
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
  .feedback { text-align:center; padding:14px; border-radius:16px; font-size:1.1rem; font-weight:700; margin-bottom:12px; display:none; }
  .feedback.show { display:block; }
  .feedback.yay { background:#d4edda; color:#155724; }
  .feedback.nay { background:#f8d7da; color:#721c24; }
  .result-screen { background:#fff; border-radius:24px; box-shadow:0 8px 28px rgba(0,0,0,.1); padding:40px 24px; text-align:center; display:none; }
  .result-screen .big-emoji{font-size:5rem;margin-bottom:12px}
  .result-screen h2{font-size:1.6rem;color:#2d3436;margin-bottom:8px}
  .result-screen p{font-size:1.1rem;color:#666;margin-bottom:20px}
  .btn-restart{background:linear-gradient(135deg,#283593,#5c6bc0);color:#fff;border:none;border-radius:16px;padding:14px 36px;font-size:1.2rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(40,53,147,.35)}
  .btn-restart:active{transform:scale(.95)}
  @media(max-width:480px){body{padding:8px}.header h1{font-size:1.2rem}.cb-icon{font-size:3rem}.sc-emoji{font-size:3rem}}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .btn-row > * + * { margin-left: 14px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🌐 Ψηφιακός Πολίτης</h1>
    <p>Τι κάνει ένας καλός ψηφιακός πολίτης;</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/10</span>
  </div>
  <div class="instructions">🧐 Διάβασε κάθε πράξη. Θα την έκανε ένας καλός ψηφιακός πολίτης;</div>
  <div id="gameArea">
    <div class="citizen-badge">
      <div class="cb-icon">🌐</div>
      <div class="cb-text">Ψηφιακός Πολίτης</div>
    </div>
    <div class="scenario">
      <div class="sc-emoji" id="scEmoji">🤝</div>
      <div class="sc-text" id="scText">Σέβομαι τους άλλους στο διαδίκτυο</div>
    </div>
    <div class="btn-row">
      <button class="btn-action btn-good" id="btnGood">✅ Ναι</button>
      <button class="btn-action btn-bad" id="btnBad">❌ Όχι</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg"></p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var items = [
    {e:'🤝', t:'Σέβομαι τους άλλους στο διαδίκτυο', good:true},
    {e:'🔒', t:'Κρατάω τα προσωπικά μου δεδομένα μυστικά', good:true},
    {e:'⏰', t:'Ελέγχω τον χρόνο που είμαι στο διαδίκτυο', good:true},
    {e:'🌍', t:'Όλοι έχουν δικαίωμα να συμμετέχουν στο διαδίκτυο', good:true},
    {e:'📢', t:'Κοινοποιώ τη διεύθυνση και το τηλέφωνό μου', good:false},
    {e:'😤', t:'Γράφω άσχημα σχόλια για συμμαθητές μου', good:false},
    {e:'🔓', t:'Δίνω τον κωδικό μου σε φίλους', good:false},
    {e:'📱', t:'Μένω όλη μέρα στο τάμπλετ χωρίς διάλειμμα', good:false},
    {e:'💬', t:'Μιλάω ευγενικά στα διαδικτυακά μηνύματα', good:true},
    {e:'📚', t:'Βοηθάω συμμαθητές που δεν έχουν πρόσβαση στην τεχνολογία', good:true}
  ];
  var cur=0,score=0;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function startGame(){
    shuffle(items);cur=0;score=0;
    document.getElementById('scoreDisplay').textContent='⭐ 0';
    document.getElementById('gameArea').style.display='block';
    document.getElementById('resultScreen').style.display='none';
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    loadItem();
  }
  function loadItem(){
    if(cur>=items.length){showResult();return;}
    var i=items[cur];
    document.getElementById('roundDisplay').textContent=(cur+1)+'/'+items.length;
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    document.getElementById('scEmoji').textContent=i.e;
    document.getElementById('scText').textContent=i.t;
    var bg=document.getElementById('btnGood');bg.className='btn-action btn-good';bg.disabled=false;
    var bb=document.getElementById('btnBad');bb.className='btn-action btn-bad';bb.disabled=false;
  }
  function choose(isGood){
    var i=items[cur];var fb=document.getElementById('feedback');
    var bg=document.getElementById('btnGood');var bb=document.getElementById('btnBad');
    bg.disabled=true;bb.disabled=true;
    if(isGood===i.good){
      score++;document.getElementById('scoreDisplay').textContent='⭐ '+score;
      if(isGood){bg.className='btn-action btn-good selected';}else{bb.className='btn-action btn-bad selected';}
      fb.className='feedback show yay';fb.textContent='✅ Μπράβο! Σωστά!';
    }else{
      if(isGood){bg.className='btn-action btn-good wrong';}else{bb.className='btn-action btn-bad wrong';}
      if(i.good){bg.className='btn-action btn-good selected';}else{bb.className='btn-action btn-bad selected';}
      fb.className='feedback show nay';fb.textContent='❌ '+(i.good?'Αυτό είναι σωστό για έναν ψηφιακό πολίτη ✅':'Αυτό δεν το κάνει ένας καλός ψηφιακός πολίτης ❌');
    }
    setTimeout(function(){cur++;loadItem();},1500);
  }
  function showResult(){
    document.getElementById('gameArea').style.display='none';
    document.getElementById('resultScreen').style.display='block';
    var total=items.length,pct=score/total;
    var e,t,m;
    if(pct===1){e='🏆';t='Τέλεια!';m='Είσαι ένας υπέροχος ψηφιακός πολίτης! Μπράβο!';}
    else if(pct>=0.75){e='🎉';t='Μπράβο!';m='Τα πήγες πολύ καλά ως ψηφιακός πολίτης!';}
    else if(pct>=0.5){e='👍';t='Ωραία!';m='Καλή προσπάθεια! Συνέχισε να μαθαίνεις!';}
    else{e='💪';t='Καλή αρχή!';m='Προσπάθησε ξανά να γίνεις σωστός ψηφιακός πολίτης!';}
    document.getElementById('resultEmoji').textContent=e;
    document.getElementById('resultTitle').textContent=t;
    document.getElementById('resultMsg').textContent='Βρήκες '+score+' από '+total+' σωστά! '+m;
  }
  startGame();
</script>
</body>
</html>
