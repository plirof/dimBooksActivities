<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Φίλτρα Δεδομένων | Μάθημα 19</title>
<style>
@font-face{font-family:'EmojiFont';src:local('Noto Color Emoji'),local('Segoe UI Emoji'),local('Apple Color Emoji'),local('Twemoji Mozilla'),url('../fonts/NotoColorEmoji.ttf') format('truetype');unicode-range:U+200D,U+2190-21FF,U+2300-23FF,U+25A0-25FF,U+2600-27BF,U+2900-297F,U+2B00-2BFF,U+FE0F,U+1F000-1FFFF;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e293b);padding:10px;display:flex;flex-direction:column;align-items:center}
h1{color:#e0e7ff;font-size:1.1rem;text-align:center;margin:4px 0 2px}
.subtitle{color:#94a3b8;font-size:.72rem;text-align:center;margin-bottom:8px}
.main{max-width:800px;width:100%}
.score-bar{display:flex;gap:8px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.sc{background:#1e293b;border-radius:8px;padding:4px 10px;color:#fbbf24;font-size:.75rem;font-weight:700;border:1px solid #334155}
.sc .sl{color:#64748b}
.card{background:#0f172a;border-radius:16px;border:2px solid #334155;padding:14px;margin-bottom:10px}
.card-title{color:#fbbf24;font-size:.8rem;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.task-box{background:#1e293b;border-radius:10px;padding:10px;margin-bottom:8px;border-left:3px solid #6366f1}
.task-box .t-icon{font-size:1.1rem;display:block;margin-bottom:2px}
.task-box .t-text{color:#e2e8f0;font-size:.7rem;line-height:1.4}
.filter-bar{display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding:8px;background:#0f172a;border-radius:10px;border:1px solid #334155;margin-bottom:8px}
.filter-bar .fb-label{color:#94a3b8;font-size:.62rem;font-weight:600;margin-right:4px}
.filter-btn{padding:4px 10px;border:1px solid #475569;border-radius:6px;background:#1e293b;color:#94a3b8;font-size:.6rem;cursor:pointer;transition:all .2s}
.filter-btn:hover{border-color:#6366f1}
.filter-btn.active{background:#6366f1;color:#fff;border-color:#6366f1}
.filter-btn.clear{background:#ef444411;color:#f87171;border-color:#ef4444}
.filter-count{font-size:.6rem;color:#64748b;margin-left:auto}
.data-table-wrap{overflow-x:auto;border-radius:10px;border:1px solid #334155;margin-bottom:8px}
.data-table{width:100%;border-collapse:collapse;font-size:.62rem}
.data-table th{background:#1e293b;padding:4px 6px;border:1px solid #334155;color:#fbbf24;font-weight:700;text-align:center}
.data-table td{padding:3px 6px;border:1px solid #1e293b;color:#e2e8f0;text-align:center}
.data-table tr:nth-child(even) td{background:#0f172a44}
.vis-indicator{display:flex;gap:6px;align-items:center;padding:4px 8px;background:#0f172a;border-radius:8px;font-size:.6rem;color:#64748b;margin-bottom:6px;flex-wrap:wrap}
.vis-indicator .vis-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.vis-indicator .vis-dot.green{background:#22c55e}
.vis-indicator .vis-dot.yellow{background:#f59e0b}
.vis-indicator .vis-dot.gray{background:#475569}
.q-area{margin-top:6px;display:flex;flex-direction:column;gap:6px}
.q-row{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#1e293b;border-radius:8px;flex-wrap:wrap}
.q-row .q-text{color:#e2e8f0;font-size:.64rem;flex:1;min-width:120px}
.q-row .q-opts{display:flex;gap:3px}
.q-row .q-btn{padding:3px 8px;border:1px solid #475569;border-radius:6px;background:#0f172a;color:#94a3b8;font-size:.56rem;cursor:pointer}
.q-row .q-btn.selected{background:#6366f1;color:#fff;border-color:#6366f1}
.q-row .q-btn.correct{background:#22c55e11;color:#4ade80;border-color:#22c55e}
.q-row .q-btn.wrong{background:#ef444422;color:#f87171;border-color:#ef4444}
.nav-btns{display:flex;gap:6px;justify-content:center;margin-top:6px}
.nav-btn{padding:6px 14px;border:none;border-radius:8px;font-size:.72rem;font-weight:700;cursor:pointer;transition:all .2s}
.nav-btn:hover{transform:translateY(-1px)}
.nav-prev{background:#334155;color:#e2e8f0}
.nav-next{background:#6366f1;color:#fff}
.btn-check{padding:8px 20px;border:none;border-radius:10px;background:linear-gradient(135deg,#22c55e,#4ade80);color:#064e3b;font-size:.75rem;font-weight:700;cursor:pointer;margin-top:4px}
.btn-check:disabled{opacity:.4;cursor:default}
.feedback{text-align:center;font-size:.8rem;font-weight:700;min-height:20px;margin-top:4px}
.feedback.ok{color:#4ade80}
.feedback.fail{color:#f87171}
.hint-box{font-size:.65rem;color:#64748b;background:#0f172a;border-radius:8px;padding:8px;line-height:1.4;margin-top:6px}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .score-bar > * { margin: 4px; }
  .card-title > * + * { margin-left: 6px; }
  .filter-bar > * { margin: 2px; }
  .vis-indicator > * { margin: 3px; }
  .q-area > * + * { margin-top: 6px; }
  .q-row > * { margin: 3px; }
  .q-row .q-opts > * + * { margin-left: 3px; }
  .nav-btns > * + * { margin-left: 6px; }
}
/* iron61-gap-fallback:end */
</style>

var pts=0;

function render(){

activeFilter=null;

h+='<div class="filter-bar">';

function getFilteredData(){
var ds=datasets[current];
if(!activeFilter)return ds.data;
var col=ds.filterCol;
if(col===0){
if(activeFilter==='Νότια Ευρώπη')return ds.data.filter(function(r){return ['Αθήνα','Ρώμη','Μαδρίτη','Βιέννη'].indexOf(r[0])>=0;});
if(activeFilter==='Βόρεια Ευρώπη')return ds.data.filter(function(r){return ['Παρίσι','Λονδίνο','Βερολίνο','Όσλο'].indexOf(r[0])>=0;});
}
if(col===4)return ds.data.filter(function(r){return r[4]===activeFilter;});
if(col===1){
if(activeFilter==='≥25°C')return ds.data.filter(function(r){return parseInt(r[1])>=25;});
if(activeFilter==='<25°C')return ds.data.filter(function(r){return parseInt(r[1])<25;});
}
if(col===2){
if(activeFilter==='≥15 km/h')return ds.data.filter(function(r){return parseInt(r[2])>=15;});
if(activeFilter==='<15 km/h')return ds.data.filter(function(r){return parseInt(r[2])<15;});
}
if(col===3){
if(activeFilter==='≥60%')return ds.data.filter(function(r){return parseInt(r[3])>=60;});
if(activeFilter==='<60%')return ds.data.filter(function(r){return parseInt(r[3])<60;});
}
return ds.data;
}
function navButtons(){
var h='<div class="nav-btns">';
h+='<button class="nav-btn nav-prev" onclick="prevDs()"'+(current===0?' disabled':'')+'>◀ Προηγούμενο</button>';
h+='<button class="nav-btn nav-next" onclick="nextDs()"'+(current===datasets.length-1?' disabled':'')+'>Επόμενο ▶</button>';
h+='</div>';
return h;
}
function applyFilter(fIdx){
if(checked)return;
var ds=datasets[current];
activeFilter=ds.filterValues[fIdx];
render();
}
function clearFilter(){
if(checked)return;
activeFilter=null;
render();
}
function selectQ(qIdx,optIdx){
if(checked)return;
selectedQs[qIdx]=optIdx;
var ds=datasets[current];
for(var o=0;o<ds.questions[qIdx].opts.length;o++){
var el=document.getElementById('qbtn_'+qIdx+'_'+o);
if(el)el.classList.toggle('selected',o===optIdx);
}
var fb=document.getElementById('feedback');
if(fb){fb.textContent='';fb.className='feedback';}
}
function checkQ(){
var ds=datasets[current];
var allAnswered=true;
for(var q=0;q<ds.questions.length;q++){if(selectedQs[q]===undefined){allAnswered=false;break;}}
if(!allAnswered){
var fb=document.getElementById('feedback');
fb.textContent='⚠️ Απάντησε σε όλες τις ερωτήσεις!';
fb.className='feedback fail';
return;
}
var allCorrect=true;
for(var q2=0;q2<ds.questions.length;q2++){
var correct=ds.questions[q2].correct;
var btn=document.getElementById('qbtn_'+q2+'_'+selectedQs[q2]);
if(btn){btn.classList.remove('selected');btn.classList.add(selectedQs[q2]===correct?'correct':'wrong');btn.style.pointerEvents='none';}
var correctBtn=document.getElementById('qbtn_'+q2+'_'+correct);
if(correctBtn)correctBtn.classList.add('correct');
if(selectedQs[q2]!==correct)allCorrect=false;
}
checked=true;
document.getElementById('checkBtn').disabled=true;
var fb2=document.getElementById('feedback');
if(allCorrect){
pts+=10;
document.getElementById('pts').textContent=pts;
fb2.textContent='🎉 Μπράβο! Όλες οι απαντήσεις σωστές!';
fb2.className='feedback ok';
}else{
fb2.textContent='⚠️ Κάποιες απαντήσεις είναι λάθος. Τα πράσινα είναι σωστά.';
fb2.className='feedback fail';
}
}
function prevDs(){if(current>0){current--;render();}}
function nextDs(){if(current<datasets.length-1){current++;render();}}
render();
</script>
</body>
</html>
