<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>e-me - Συνδέσεις, Μηνύματα, Ανακοινώσεις</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#4facfe 0%,#00f2fe 100%);min-height:100vh;display:flex;justify-content:center;padding:20px;}
.container{background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.2);max-width:800px;width:100%;padding:25px;}
h1{text-align:center;color:#2980b9;font-size:1.4rem;margin-bottom:5px;}
.subtitle{text-align:center;color:#888;font-size:.85rem;margin-bottom:12px;}
.progress-bar{background:#e0e0e0;border-radius:10px;height:22px;margin-bottom:12px;overflow:hidden;position:relative;}
.progress-fill{background:linear-gradient(90deg,#43e97b,#38f9d7);height:100%;border-radius:10px;transition:width .5s;}
.progress-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:.72rem;font-weight:bold;color:#333;}
.tasks-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px;justify-content:center;}
.task-badge{padding:5px 12px;border-radius:20px;font-size:.75rem;font-weight:bold;}
.task-badge.pending{background:#ffe0b2;color:#e65100;}
.task-badge.done{background:#c8e6c9;color:#2e7d32;}
.tabs{display:flex;gap:4px;margin-bottom:15px;}
.tab{flex:1;padding:10px;border:none;border-radius:12px 12px 0 0;cursor:pointer;font-size:.9rem;font-weight:bold;background:#e0e0e0;color:#666;transition:all .2s;}
.tab.active{background:#2980b9;color:#fff;box-shadow:0 -3px 10px rgba(41,128,185,.3);}
.tab-content{display:none;min-height:300px;}
.tab-content.active{display:block;}
.search-bar{width:100%;padding:10px 15px;border:2px solid #e0e0e0;border-radius:12px;font-size:.9rem;margin-bottom:12px;outline:none;transition:border-color .2s;}
.search-bar:focus{border-color:#2980b9;}
.user-card{display:flex;align-items:center;gap:12px;padding:12px;background:#f8f9fa;border-radius:12px;margin-bottom:8px;transition:all .2s;}
.user-card:hover{background:#e8f4fd;}
.user-avatar{font-size:2rem;width:45px;height:45px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.1);}
.user-info{flex:1;}
.user-name{font-weight:bold;color:#2c3e50;font-size:.95rem;}
.user-status{font-size:.75rem;color:#888;}
.btn{padding:8px 16px;border:none;border-radius:10px;cursor:pointer;font-size:.8rem;font-weight:bold;transition:all .2s;}
.btn:hover{transform:translateY(-2px);box-shadow:0 3px 10px rgba(0,0,0,.15);}
.btn-connect{background:linear-gradient(135deg,#2980b9,#3498db);color:#fff;}
.btn-connected{background:#c8e6c9;color:#2e7d32;cursor:default;}
.btn-msg{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#333;}
.msg-sidebar{width:160px;border-right:2px solid #e0e0e0;padding-right:10px;overflow-y:auto;max-height:350px;}
.msg-main{flex:1;display:flex;flex-direction:column;}
.msg-contact{padding:8px;border-radius:8px;cursor:pointer;font-size:.85rem;margin-bottom:4px;transition:all .2s;text-align:center;}
.msg-contact:hover{background:#e8f4fd;}
.msg-contact.active{background:#2980b9;color:#fff;}
.msg-chat{flex:1;overflow-y:auto;max-height:230px;padding:8px;border:2px solid #e0e0e0;border-radius:10px;margin-bottom:8px;background:#fafafa;}
.msg-bubble{margin-bottom:8px;max-width:80%;}
.msg-bubble.them{margin-right:auto;}
.msg-bubble.me{margin-left:auto;text-align:right;}
.msg-bubble .sender{font-size:.7rem;color:#888;margin-bottom:2px;}
.msg-bubble .text{padding:8px 12px;border-radius:10px;font-size:.85rem;display:inline-block;word-break:break-word;}
.msg-bubble.them .text{background:#e8f4fd;color:#2c3e50;border-bottom-left-radius:2px;}
.msg-bubble.me .text{background:#2980b9;color:#fff;border-bottom-right-radius:2px;}
.msg-input-row{display:flex;gap:6px;}
.msg-input{flex:1;padding:8px 12px;border:2px solid #e0e0e0;border-radius:10px;font-size:.85rem;outline:none;}
.msg-input:focus{border-color:#2980b9;}
.btn-send{background:linear-gradient(135deg,#2980b9,#3498db);color:#fff;padding:8px 16px;border-radius:10px;border:none;cursor:pointer;font-weight:bold;font-size:.85rem;}
.announcement{background:linear-gradient(135deg,#ffecd2,#fcb69f);border-radius:12px;padding:15px;margin-bottom:10px;cursor:pointer;transition:all .2s;}
.announcement:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1);}
.announcement.read{background:linear-gradient(135deg,#e8f5e9,#c8e6c9);opacity:.7;}
.ann-header{display:flex;justify-content:space-between;margin-bottom:5px;}
.ann-from{font-weight:bold;color:#c0392b;font-size:.85rem;}
.ann-date{font-size:.7rem;color:#999;}
.ann-title{font-weight:bold;color:#333;font-size:.9rem;margin-bottom:4px;}
.ann-body{font-size:.85rem;color:#555;display:none;line-height:1.5;}
.announcement.read .ann-body{display:block;}
.congrats{display:none;text-align:center;padding:30px 20px;}
.congrats h2{color:#27ae60;font-size:1.6rem;margin-bottom:10px;}
.congrats p{color:#555;font-size:.95rem;}
.congrats .emoji{font-size:3.5rem;margin-bottom:12px;}
.no-chat{color:#999;text-align:center;padding:30px;font-size:.9rem;}
@media(max-width:600px){
.container{padding:15px;}
.msg-layout{flex-direction:column!important;}
.msg-sidebar{width:100%;border-right:none;border-bottom:2px solid #e0e0e0;padding-right:0;padding-bottom:8px;max-height:100px;flex-direction:row;display:flex!important;overflow-x:auto;}
.tasks-row{gap:4px;}
.task-badge{font-size:.65rem;padding:4px 8px;}
}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .tasks-row > * { margin: 4px; }
  .tabs > * + * { margin-left: 4px; }
  .user-card > * + * { margin-left: 12px; }
  .msg-input-row > * + * { margin-left: 6px; }
  .g61f10_0 > * + * { margin-left: 10px; }
  @media(max-width:600px){
    .tasks-row > * { margin: 2px; }
  }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="container" id="appContainer">
<h1>🌐 e-me</h1>
<p class="subtitle">Συνδέσεις, Μηνύματα, Ανακοινώσεις</p>

<div class="progress-bar">
<div class="progress-fill" id="progressFill" style="width:0%"></div>
<span class="progress-text" id="progressText">0/3 εργασίες</span>
</div>

<div class="tasks-row" id="tasksRow">
<span class="task-badge pending" id="tBadge1">👥 0/2 αιτήματα</span>
<span class="task-badge pending" id="tBadge2">💬 0/2 μηνύματα</span>
<span class="task-badge pending" id="tBadge3">📢 0/2 ανακοινώσεις</span>
</div>

<div class="tabs">
<button class="tab active" onclick="switchTab(0)">👥 Συνδέσεις</button>
<button class="tab" onclick="switchTab(1)">💬 Μηνύματα</button>
<button class="tab" onclick="switchTab(2)">📢 Ανακοινώσεις</button>
</div>

<div class="tab-content active" id="tab0">
<input type="text" class="search-bar" id="searchBar" placeholder="Αναζήτησε συμμαθητή..." oninput="renderConnections()">
<div id="connectionsList"></div>
</div>

<div class="tab-content" id="tab1">
<div class="msg-layout g61f10_0" style="display:flex;gap:10px;min-height:350px;">
<div class="msg-sidebar" id="msgContacts"></div>
<div class="msg-main" id="msgMain">
<div class="no-chat">Επίλεξε μια επαφή για να στείλεις μήνυμα!</div>
</div>
</div>
</div>

<div class="tab-content" id="tab2">
<div id="announcementsList"></div>
</div>

<div class="congrats" id="congrats">
<div class="emoji">🎉</div>
<h2>Μπράβο!</h2>
<p>Έμαθες να χρησιμοποιείς το e-me!<br>Στέλνεις αιτήματα, μηνύματα και διαβάζεις ανακοινώσεις!</p>
</div>
</div>

<script>
(function(){
var kids=[
{name:'Γιάννης',avatar:'👦',connected:false},
{name:'Μαρία',avatar:'👧',connected:false},
{name:'Ελένη',avatar:'👧',connected:false},
{name:'Νίκος',avatar:'👦',connected:false},
{name:'Σοφία',avatar:'👧',connected:false},
{name:'Κώστας',avatar:'👦',connected:false}
];
var autoReplies=[
'Γεια σου! Τι κάνεις; 😊',
'Εντάξει, το καταλαβαίνω!',
'Ευχαριστώ για το μήνυμα!',
'Μελέτησες για tomorrow; 📚',
'Θα τα πούμε στο σχολείο!',
'Ωραία! 👍'
];
var announcements=[
{from:'κυρία Μαρία',date:'25/04/2026',title:'📝 Εργασία Πληροφορικής',body:'Η εργασία πρέπει να παραδοθεί μέχρι την Παρασκευή. Μην ξεχάσετε να στείλετε το αρχείο στο e-me!',read:false},
{from:'κυρία Μαρία',date:'24/04/2026',title:'📚 Νέο κεφάλαιο',body:'Αύριο θα ξεκινήσουμε το κεφάλαιο 5. Φέρτε τα βιβλία σας!',read:false}
];
var messages={};
var tasks={requests:0,msgs:0,anns:0};
var openChat=null;

function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML;}

function updateProgress(){
var done=0;
if(tasks.requests>=2)done++;
if(tasks.msgs>=2)done++;
if(tasks.anns>=2)done++;
var pct=Math.round(done/3*100);
document.getElementById('progressFill').style.width=pct+'%';
document.getElementById('progressText').textContent=done+'/3 εργασίες';

var b1=document.getElementById('tBadge1');
b1.textContent='👥 '+Math.min(tasks.requests,2)+'/2 αιτήματα';
b1.className='task-badge '+(tasks.requests>=2?'done':'pending');
var b2=document.getElementById('tBadge2');
b2.textContent='💬 '+Math.min(tasks.msgs,2)+'/2 μηνύματα';
b2.className='task-badge '+(tasks.msgs>=2?'done':'pending');
var b3=document.getElementById('tBadge3');
b3.textContent='📢 '+Math.min(tasks.anns,2)+'/2 ανακοινώσεις';
b3.className='task-badge '+(tasks.anns>=2?'done':'pending');

if(done===3){
document.getElementById('appContainer').querySelectorAll('.tabs,.tab-content,.progress-bar,.tasks-row').forEach(function(el){el.style.display='none';});
document.getElementById('congrats').style.display='block';
}
}

window.renderConnections=function(){
var list=document.getElementById('connectionsList');
var q=document.getElementById('searchBar').value.trim().toLowerCase();
list.innerHTML='';
kids.forEach(function(k,i){
if(q&&k.name.toLowerCase().indexOf(q)===-1)return;
var card=document.createElement('div');
card.className='user-card';
var statusText=k.connected?'Συνδεδεμένος/η':'Αποστολή αιτήματος';
card.innerHTML='<div class="user-avatar">'+k.avatar+'</div><div class="user-info"><div class="user-name">'+esc(k.name)+'</div><div class="user-status">'+statusText+'</div></div>';
if(!k.connected){
var btn=document.createElement('button');
btn.className='btn btn-connect';
btn.textContent='🤝 Αίτημα σύνδεσης';
btn.onclick=(function(idx){return function(){
kids[idx].connected=true;
tasks.requests++;
messages[kids[idx].name]=[];
updateProgress();
renderConnections();
showNotice('✅ Αίτημα στάλθηκε σε '+kids[idx].name+'!');
renderMsgContacts();
}})(i);
card.appendChild(btn);
}else{
var badge=document.createElement('span');
badge.className='btn btn-connected';
badge.textContent='Συνδεδεμένοι ✓';
card.appendChild(badge);
}
list.appendChild(card);
});
};

function renderMsgContacts(){
var cont=document.getElementById('msgContacts');
cont.innerHTML='';
var connectedKids=kids.filter(function(k){return k.connected;});
if(connectedKids.length===0){
cont.innerHTML='<div style="color:#999;font-size:.8rem;text-align:center;padding:10px;">Κανένας ακόμα!</div>';
return;
}
connectedKids.forEach(function(k){
var div=document.createElement('div');
div.className='msg-contact'+(openChat===k.name?' active':'');
div.textContent=k.avatar+' '+k.name;
div.onclick=function(){openChat=k.name;renderMsgView();renderMsgContacts();};
cont.appendChild(div);
});
}

function renderMsgView(){
var main=document.getElementById('msgMain');
if(!openChat){
main.innerHTML='<div class="no-chat">Επίλεξε μια επαφή για να στείλεις μήνυμα!</div>';
return;
}
main.innerHTML='';
var chatDiv=document.createElement('div');
chatDiv.className='msg-chat';
chatDiv.id='chatArea';
var msgs=messages[openChat]||[];
msgs.forEach(function(m){
var bubble=document.createElement('div');
bubble.className='msg-bubble '+(m.me?'me':'them');
bubble.innerHTML='<div class="sender">'+esc(m.from)+'</div><div class="text">'+esc(m.text)+'</div>';
chatDiv.appendChild(bubble);
});
main.appendChild(chatDiv);

var inputRow=document.createElement('div');
inputRow.className='msg-input-row';
var input=document.createElement('input');
input.className='msg-input';
input.id='msgInput';
input.placeholder='Γράψε μήνυμα...';
input.maxLength=200;
inputRow.appendChild(input);

var sendBtn=document.createElement('button');
sendBtn.className='btn-send';
sendBtn.textContent='📤';
sendBtn.onclick=function(){sendMsg();};
inputRow.appendChild(sendBtn);
main.appendChild(inputRow);

input.addEventListener('keydown',function(e){if(e.key==='Enter')sendMsg();});
setTimeout(function(){chatDiv.scrollTop=chatDiv.scrollHeight;},50);
}

function sendMsg(){
var input=document.getElementById('msgInput');
var text=input.value.trim();
if(!text)return;
if(!messages[openChat])messages[openChat]=[];
messages[openChat].push({from:'Εσύ',text:text,me:true});
tasks.msgs++;
input.value='';
updateProgress();
renderMsgView();
setTimeout(function(){
var reply=autoReplies[Math.floor(Math.random()*autoReplies.length)];
messages[openChat].push({from:openChat,text:reply,me:false});
renderMsgView();
},1200);
}

window.switchTab=function(idx){
document.querySelectorAll('.tab').forEach(function(t,i){t.classList.toggle('active',i===idx);});
document.querySelectorAll('.tab-content').forEach(function(c,i){c.classList.toggle('active',i===idx);});
if(idx===1){renderMsgContacts();renderMsgView();}
if(idx===2)renderAnnouncements();
};

function renderAnnouncements(){
var list=document.getElementById('announcementsList');
list.innerHTML='';
announcements.forEach(function(a,i){
var div=document.createElement('div');
div.className='announcement'+(a.read?' read':'');
div.innerHTML='<div class="ann-header"><span class="ann-from">'+esc(a.from)+'</span><span class="ann-date">'+esc(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-body">'+esc(a.body)+'</div>';
div.onclick=(function(idx){return function(){
if(!announcements[idx].read){
announcements[idx].read=true;
tasks.anns++;
updateProgress();
}
renderAnnouncements();
}})(i);
list.appendChild(div);
});
}

function showNotice(msg){
var n=document.createElement('div');
n.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#27ae60;color:#fff;padding:12px 24px;border-radius:12px;font-weight:bold;z-index:200;box-shadow:0 4px 15px rgba(0,0,0,.2);';
n.textContent=msg;
document.body.appendChild(n);
setTimeout(function(){n.remove();},2500);
}

renderConnections();
renderAnnouncements();
})();
</script>
</body>
</html>
