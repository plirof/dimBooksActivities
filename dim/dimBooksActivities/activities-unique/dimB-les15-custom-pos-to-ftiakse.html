<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Πώς το έφτιαξα; 🖼️</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #ffd700, #ffaa00);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(255,170,0,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; text-shadow: 1px 1px 2px rgba(0,0,0,.2); }
  .header p { font-size: .9rem; opacity: .95; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #ffaa00; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fff9db; border: 2px dashed #f0c040; border-radius: 16px;
    padding: 14px; margin-bottom: 14px; text-align: center;
    font-size: 1rem; color: #6b5900;
  }
  .file-card {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 28px 20px; margin-bottom: 18px; text-align: center;
  }
  .file-icon { font-size: 5rem; margin-bottom: 8px; }
  .file-name { font-size: 1.3rem; font-weight: 700; color: #2d3436; margin-bottom: 4px; }
  .file-desc { font-size: 1rem; color: #888; margin-bottom: 14px; background: #f8f9ff; border-radius: 12px; padding: 10px; line-height: 1.4; }
  .choices-grid { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 12px; margin-bottom: 14px; }
  .choice-card {
    background: #fff; border: 3px solid #e0e0e0; border-radius: 18px;
    padding: 18px 10px; text-align: center; cursor: pointer;
    transition: all .2s ease; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .choice-card:active { transform: scale(.95); }
  .choice-card .c-emoji { font-size: 2.8rem; margin-bottom: 4px; }
  .choice-card .c-name { font-size: .95rem; font-weight: 700; color: #2d3436; }
  .choice-card.correct { border-color: #28a745; background: #d4edda; animation: pop .4s ease; }
  .choice-card.wrong { border-color: #dc3545; background: #f8d7da; animation: shake .4s ease; }
  .choice-card.disabled { pointer-events: none; opacity: .7; }
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .feedback{text-align:center;padding:14px;border-radius:16px;font-size:1.1rem;font-weight:700;margin-bottom:12px;display:none}
  .feedback.show{display:block}
  .feedback.yay{background:#d4edda;color:#155724}
  .feedback.nay{background:#f8d7da;color:#721c24}
  .result-screen{background:#fff;border-radius:24px;box-shadow:0 8px 28px rgba(0,0,0,.1);padding:40px 24px;text-align:center;display:none}
  .result-screen .big-emoji{font-size:5rem;margin-bottom:12px}
  .result-screen h2{font-size:1.6rem;color:#2d3436;margin-bottom:8px}
  .result-screen p{font-size:1.1rem;color:#666;margin-bottom:20px}
  .btn-restart{background:linear-gradient(135deg,#ffd700,#ffaa00);color:#fff;border:none;border-radius:16px;padding:14px 36px;font-size:1.2rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(255,170,0,.35)}
  .btn-restart:active{transform:scale(.95)}
  @media(max-width:480px){body{padding:8px}.header h1{font-size:1.2rem}.file-icon{font-size:4rem}}
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🖼️ Πώς το έφτιαξα;</h1>
    <p>Με ποια συσκευή δημιούργησα το αρχείο;</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/8</span>
  </div>
  <div class="instructions">
    Ο Ήρωνας έφτιαξε αρχεία για το κατοικίδιό του!<br>
    Βρες με ποια συσκευή δημιούργησε το κάθε αρχείο.
  </div>
  <div id="gameArea">
    <div class="file-card">
      <div class="file-icon" id="fileIcon">🖼️</div>
      <div class="file-name" id="fileName">Η ζωγραφιά μου</div>
      <div class="file-desc" id="fileDesc">Ο Ήρωνας ζωγράφισε σε χαρτί και μετά το πέρασε στον υπολογιστή</div>
    </div>
    <div class="choices-grid" id="choicesGrid"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg"></p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var qs = [
    { icon:'🖼️', name:'Η ζωγραφιά μου', desc:'Ο Ήρωνας ζωγράφισε σε χαρτί και μετά το πέρασε στον υπολογιστή', ans:2,
      choices:[{emoji:'📷',name:'Κάμερα'},{emoji:'🎤',name:'Μικρόφωνο'},{emoji:'📄',name:'Σαρωτής'},{emoji:'⌨️',name:'Πληκτρολόγιο'}] },
    { icon:'📷', name:'Η φωτογραφία του σκύλου', desc:'Ο Ήρωνας τράβηξε φωτογραφία τον σκύλο του', ans:0,
      choices:[{emoji:'📷',name:'Κάμερα'},{emoji:'📄',name:'Σαρωτής'},{emoji:'🎤',name:'Μικρόφωνο'},{emoji:'⌨️',name:'Πληκτρολόγιο'}] },
    { icon:'🎵', name:'Το γάβγισμα του σκύλου', desc:'Ο Ήρωνας ηχογράφησε τον σκύλο του που γαβγίζει', ans:2,
      choices:[{emoji:'📷',name:'Κάμερα'},{emoji:'📄',name:'Σαρωτής'},{emoji:'🎤',name:'Μικρόφωνο'},{emoji:'🖨️',name:'Εκτυπωτής'}] },
    { icon:'📝', name:'Η παρουσίαση για το σκύλο', desc:'Ο Ήρωνας έγραψε ένα κείμενο για τον σκύλο του', ans:3,
      choices:[{emoji:'📷',name:'Κάμερα'},{emoji:'🎤',name:'Μικρόφωνο'},{emoji:'📄',name:'Σαρωτής'},{emoji:'⌨️',name:'Πληκτρολόγιο'}] },
    { icon:'🎨', name:'Η ζωγραφιά στον υπολογιστή', desc:'Ο Ήρωνας ζωγράφισε κατευθείαν στην εφαρμογή ζωγραφικής', ans:1,
      choices:[{emoji:'📷',name:'Κάμερα'},{emoji:'🖱️',name:'Ποντίκι'},{emoji:'📄',name:'Σαρωτής'},{emoji:'🎤',name:'Μικρόφωνο'}] },
    { icon:'📹', name:'Το βίντεο με τον σκύλο', desc:'Ο Ήρωνας τράβηξε βίντεο τον σκύλο να παίζει', ans:0,
      choices:[{emoji:'📷',name:'Κάμερα'},{emoji:'🎤',name:'Μικρόφωνο'},{emoji:'⌨️',name:'Πληκτρολόγιο'},{emoji:'📄',name:'Σαρωτής'}] },
    { icon:'💾', name:'Το αποθηκευμένο αρχείο', desc:'Ο Ήρωνας αποθήκευσε την εργασία του "Ο σκύλος μου"', ans:3,
      choices:[{emoji:'📷',name:'Κάμερα'},{emoji:'🎤',name:'Μικρόφωνο'},{emoji:'📄',name:'Σαρωτής'},{emoji:'💾',name:'Δίσκος Αποθήκευσης'}] },
    { icon:'🔊', name:'Η ηχογράφηση φωνής', desc:'Ο Ήρωνας είπε το όνομα του κατοικίδιου και το ηχογράφησε', ans:2,
      choices:[{emoji:'📷',name:'Κάμερα'},{emoji:'📄',name:'Σαρωτής'},{emoji:'🎤',name:'Μικρόφωνο'},{emoji:'🖱️',name:'Ποντίκι'}] }
  ];
  var cur=0,score=0;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function startGame(){
    shuffle(qs);cur=0;score=0;
    document.getElementById('scoreDisplay').textContent='⭐ 0';
    document.getElementById('gameArea').style.display='block';
    document.getElementById('resultScreen').style.display='none';
    showQ();
  }
  function showQ(){
    if(cur>=qs.length){showResult();return;}
    var q=qs[cur];
    document.getElementById('fileIcon').textContent=q.icon;
    document.getElementById('fileName').textContent=q.name;
    document.getElementById('fileDesc').textContent=q.desc;
    document.getElementById('roundDisplay').textContent=(cur+1)+'/'+qs.length;
    document.getElementById('feedback').className='feedback';document.getElementById('feedback').style.display='none';
    var g=document.getElementById('choicesGrid');g.innerHTML='';
    for(var i=0;i<q.choices.length;i++){
      (function(idx){
        var c=document.createElement('div');c.className='choice-card';
        c.setAttribute('data-idx',idx);
        c.innerHTML='<div class="c-emoji">'+q.choices[idx].emoji+'</div><div class="c-name">'+q.choices[idx].name+'</div>';
        c.addEventListener('click',function(){choose(this,q);});
        g.appendChild(c);
      })(i);
    }
  }
  function choose(el,q){
    var cards=document.querySelectorAll('.choice-card');
    for(var i=0;i<cards.length;i++)cards[i].classList.add('disabled');
    var chosen=parseInt(el.getAttribute('data-idx'));
    var correct=(chosen===q.ans);
    var fb=document.getElementById('feedback');
    if(correct){score++;document.getElementById('scoreDisplay').textContent='⭐ '+score;el.classList.add('correct');fb.className='feedback show yay';fb.textContent='✅ Μπράβο! Σωστά!';}
    else{el.classList.add('wrong');cards[q.ans].classList.add('correct');fb.className='feedback show nay';fb.textContent='❌ Ωχ! Η σωστή απάντηση είναι: '+q.choices[q.ans].name+'!';}
    setTimeout(function(){cur++;showQ();},1600);
  }
  function showResult(){
    document.getElementById('gameArea').style.display='none';
    document.getElementById('resultScreen').style.display='block';
    var total=qs.length,pct=score/total;
    var e,t,m;
    if(pct===1){e='🏆';t='Τέλεια!';m='Γνωρίζεις πώς δημιουργούνται τα αρχεία! Είσαι σούπερ!';}
    else if(pct>=0.75){e='🎉';t='Μπράβο!';m='Τα πήγες πολύ καλά!';}
    else if(pct>=0.5){e='👍';t='Ωραία!';m='Καλή προσπάθεια!';}
    else{e='💪';t='Καλή αρχή!';m='Προσπάθησε ξανά!';}
    document.getElementById('resultEmoji').textContent=e;
    document.getElementById('resultTitle').textContent=t;
    document.getElementById('resultMsg').textContent='Βρήκες '+score+' από '+total+' σωστά! '+m;
  }
  startGame();
</script>
</body>
</html>
