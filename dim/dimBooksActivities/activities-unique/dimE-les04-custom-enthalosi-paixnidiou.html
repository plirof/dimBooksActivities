<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Μπλοκ Scratch | Μάθημα 4</title>
<style>
@font-face{font-family:'EmojiFont';src:local('Noto Color Emoji'),local('Segoe UI Emoji'),local('Apple Color Emoji'),local('Twemoji Mozilla'),url('../fonts/NotoColorEmoji.ttf') format('truetype');unicode-range:U+200D,U+2190-21FF,U+2300-23FF,U+25A0-25FF,U+2600-27BF,U+2900-297F,U+2B00-2BFF,U+FE0F,U+1F000-1FFFF;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;min-height:100vh;background:linear-gradient(135deg,#fff7ed,#fed7aa);padding:10px;display:flex;flex-direction:column;align-items:center}
h1{color:#7c2d12;font-size:1.05rem;text-align:center;margin:4px 0 2px}
.subtitle{color:#ea580c;font-size:.7rem;text-align:center;margin-bottom:6px}
.score-bar{display:flex;gap:8px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.sc{background:#fff;border-radius:8px;padding:4px 10px;color:#7c2d12;font-size:.75rem;font-weight:700;border:1px solid #fdba74;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.sc .sl{color:#64748b}
.card{background:#fff;border-radius:18px;box-shadow:0 4px 16px rgba(0,0,0,.08);padding:14px;margin-bottom:8px;max-width:600px;width:100%}
.match-row{display:flex;gap:8px;align-items:center;margin:6px 0;padding:8px;border-radius:10px;background:#fff7ed;border:2px solid #fed7aa}
.match-left{flex:1;font-size:.72rem;font-weight:700;color:#7c2d12}
.match-arrow{font-size:.8rem;color:#ea580c}
.match-right{flex:1;min-height:36px;border:2px dashed #fdba74;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#94a3b8;cursor:pointer;transition:all .2s;padding:4px}
.match-right:hover{background:#fff7ed;border-color:#ea580c}
.match-right.filled{border-style:solid;border-color:#ea580c;background:#fff7ed;color:#7c2d12;font-weight:700}
.match-right.correct{border-color:#22c55e;background:#dcfce7;color:#14532d}
.match-right.wrong{border-color:#ef4444;background:#fef2f2;color:#dc2626}
.block-pool{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.block-chip{padding:6px 12px;border:2px solid #e2e8f0;border-radius:20px;font-size:.68rem;font-weight:700;cursor:pointer;background:#fff;color:#334155;transition:all .2s}
.block-chip:hover{border-color:#ea580c;background:#fff7ed}
.block-chip.used{opacity:.3;cursor:default}
.info-text{font-size:.7rem;color:#475569;text-align:center;margin:4px 0}
.result-msg{text-align:center;padding:10px;border-radius:10px;font-size:.78rem;font-weight:700;margin:6px 0}
.result-msg.ok{background:#dcfce7;color:#14532d}
.result-msg.bad{background:#fef2f2;color:#dc2626}
.check-btn{display:block;margin:8px auto;padding:10px 24px;border:none;border-radius:10px;background:#ea580c;color:#fff;font-size:.8rem;font-weight:700;cursor:pointer}
.check-btn:hover{background:#c2410c}
.next-btn{display:block;margin:6px auto;padding:8px 20px;border:2px solid #ea580c;border-radius:10px;background:transparent;color:#ea580c;font-size:.75rem;font-weight:700;cursor:pointer}
.next-btn:hover{background:#fff7ed}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .score-bar > * { margin: 4px; }
  .match-row > * + * { margin-left: 8px; }
  .block-pool > * { margin: 3px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<h1>🧱 Μπλοκ Scratch</h1>
<p class="subtitle">Αντίστοιξε τις εντολές Scratch με τη συμπεριφορά στο παιχνίδι!</p>
<div class="score-bar">
<span class="sc"><span class="sl">Πόντοι:</span> <span id="pts">0</span></span>
<span class="sc"><span class="sl">Μέρος:</span> <span id="qNum">1</span>/<span id="qTotal">2</span></span>
</div>
<div class="card" id="main"></div>
<script>
var parts=[
{
title:'Χαρακτήρες και Φόντο',
matches:[
{left:'👩 Έλλη (δύτης)',answer:'Ακολουθεί το ποντίκι στο βυθό'},
{left:'⭐ Αστερίας',answer:'Εμφανίζεται σε τυχαία θέση'},
{left:'🌊 Φόντο βυθός',answer:'Ορίζει το περιβάλλον παιχνιδιού'},
{left:'🔤 Όνομα "Έλλη"',answer:'Μετονομασία χαρακτήρα (sprite)'},
{left:'📏 Μέγεθος 50',answer:'Μικραίνει τον αστερία'}
]
},
{
title:'Εντολές και Λογική',
matches:[
{left:'🔁 Επανάλαβε (10 φορές)',answer:'Ο αστερίας εμφανίζεται 10 φορές'},
{left:'👁️ Δείξε / Κρύψε',answer:'Ο αστερίας φαίνεται και εξαφανίζεται'},
{left:'🔊 Παίξε ήχο',answer:'Ήχος όταν η Έλλη πιάνει αστερία'},
{left:'❓ Αν... τότε',answer:'Έλεγχος αν αγγίζει την Έλλη'},
{left:'🚫 ΟΧΙ (όχι αγγίζει ποντίκι)',answer:'Διορθώνει το τρεμούλιασμα του χαρακτήρα'}
]
}
];
var curQ=0,pts=0,answers={},checked=false,selectedBlock=null;

function initQ(){answers={};checked=false;selectedBlock=null;}

function render(){
document.getElementById('qNum').textContent=curQ+1;
document.getElementById('pts').textContent=pts;
var p=parts[curQ];
var main=document.getElementById('main');
var h='';
h+='<div style="font-size:.78rem;font-weight:700;color:#7c2d12;text-align:center;margin:4px 0">'+p.title+'</div>';
h+='<div class="info-text">Κάνε κλικ σε ένα μπλοκ και μετά στη σωστή θέση</div>';
var allAnswers=[];
for(var i=0;i<p.matches.length;i++)allAnswers.push(p.matches[i].answer);
var shuffled=allAnswers.slice().sort(function(){return Math.random()-.5;});
h+='<div class="block-pool">';
for(var i=0;i<shuffled.length;i++){
var used=false;
for(var j in answers){if(answers[j]===shuffled[i])used=true;}
var cls='block-chip'+(used?' used':'');
if(!used)h+='<div class="'+cls+'" onclick="pickBlock(\''+escHtml(shuffled[i])+'\')">'+shuffled[i]+'</div>';
else h+='<div class="'+cls+'">'+shuffled[i]+'</div>';
}
h+='</div>';
for(var i=0;i<p.matches.length;i++){
var filled=answers[i]!==undefined;
var cls='match-right'+(filled?' filled':'');
if(checked){
cls+=answers[i]===p.matches[i].answer?' correct':' wrong';
}
h+='<div class="match-row">';
h+='<span class="match-left">'+p.matches[i].left+'</span>';
h+='<span class="match-arrow">→</span>';
h+='<span class="'+cls+'" onclick="placeIn('+i+')">'+(filled?answers[i]:'Επίλεξε μπλοκ...')+'</span>';
h+='</div>';
}
var allFilled=Object.keys(answers).length===p.matches.length;
if(allFilled&&!checked){
h+='<button class="check-btn" onclick="checkAnswer()">✓ Έλεγχος Αντιστοίχισης</button>';
}
if(checked){
var correct=0;
for(var i=0;i<p.matches.length;i++){
if(answers[i]===p.matches[i].answer)correct++;
}
var pct=Math.round(correct/p.matches.length*100);
if(pct>=80)pts+=10;
document.getElementById('pts').textContent=pts;
h+='<div class="result-msg '+(pct>=80?'ok':'bad')+'">'+(pct>=80?'✅ '+correct+'/'+p.matches.length+' σωστά!':'❌ '+correct+'/'+p.matches.length+' σωστά.')+'</div>';
if(curQ<parts.length-1){
h+='<button class="next-btn" onclick="nextQ()">Επόμενο Μέρος ▶</button>';
}
}
main.innerHTML=h;
}

function escHtml(s){return s.replace(/'/g,'\\\'');}

function pickBlock(block){selectedBlock=block;render();}

function placeIn(idx){
if(checked)return;
if(selectedBlock!==null){
answers[idx]=selectedBlock;
selectedBlock=null;
render();
}
}

function checkAnswer(){checked=true;render();}

function nextQ(){
if(curQ<parts.length-1){curQ++;initQ();render();}
}

initQ();render();
</script>
</body>
</html>
