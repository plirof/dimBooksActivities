<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ταχυδρομείο ή E-mail; 📨</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
    padding: 12px; color: #333;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 14px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(102,126,234,.4); margin-bottom: 16px;
  }
  .header h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .header p { font-size: 1rem; opacity: .9; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #764ba2; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fff9db; border: 2px dashed #f0c040;
    border-radius: 16px; padding: 14px 16px; margin-bottom: 16px;
    font-size: 1.1rem; text-align: center; color: #6b5900;
  }
  .q-card {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 28px 20px; margin-bottom: 16px; text-align: center;
  }
  .q-scenario {
    font-size: 1.3rem; margin-bottom: 16px; line-height: 1.6;
    font-weight: 700; color: #2d3436;
  }
  .q-compare {
    display: flex; gap: 16px; justify-content: center;
    align-items: stretch; margin-bottom: 16px;
  }
  .q-option {
    flex: 1; background: #f8f9fa; border: 3px solid #e0e0e0;
    border-radius: 18px; padding: 20px 12px; text-align: center;
    cursor: pointer; transition: all .2s ease;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .q-option:hover:not(.disabled) {
    border-color: #667eea; transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(102,126,234,.15);
  }
  .q-option:active:not(.disabled) { transform: scale(.96); }
  .q-option .qo-emoji { font-size: 3.5rem; margin-bottom: 8px; }
  .q-option .qo-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
  .q-option .qo-desc { font-size: .9rem; color: #666; }
  .q-option.correct { border-color: #28a745; background: #d4edda; animation: pop .3s ease; }
  .q-option.wrong { border-color: #dc3545; background: #f8d7da; animation: shake .35s ease; }
  .q-option.disabled { pointer-events: none; opacity: .6; }
  .q-option.reveal { border-color: #28a745; background: #d4edda; opacity: 1; }
  @keyframes pop { 0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}60%{transform:translateX(5px)} }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.05rem; font-weight: 700; display: none;
  }
  .feedback.show { display: block; margin-bottom: 12px; }
  .feedback.true { background: #d4edda; color: #155724; }
  .feedback.false { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 36px; font-size: 1.2rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(102,126,234,.35);
    transition: transform .15s;
  }
  .btn-restart:hover { transform: scale(1.05); }
  @media (max-width:480px) {
    .header h1 { font-size: 1.2rem; }
    .q-scenario { font-size: 1.1rem; }
    .q-compare { flex-direction: column; }
    .q-option .qo-emoji { font-size: 3rem; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .q-compare > * + * { margin-left: 16px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>📨 Ταχυδρομείο ή E-mail;</h1>
    <p>Ποιο είναι πιο γρήγορο;</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">Ερώτηση 1/6</span>
  </div>
  <div class="instructions">📬 Ο Ήρωνας θέλει να στείλει ένα μήνυμα. Ποιος τρόπος είναι <strong>πιο γρήγορος</strong>;</div>
  <div id="gameArea">
    <div class="q-card" id="qCard">
      <div class="q-scenario" id="qScenario">Ο Ήρωνας θέλει να στείλει μια ζωγραφιά στη γιαγιά του!</div>
      <div class="q-compare" id="qCompare"></div>
      <div class="feedback" id="feedback"></div>
    </div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var questions = [
    { scenario: '📮 Ο Ήρωνας θέλει να στείλει μια ζωγραφιά στη γιαγιά του! Ποιο είναι πιο γρήγορο;',
      options: [
        { emoji: '📬', title: 'Ταχυδρομείο', desc: 'Γράφω, βάζω φάκελο, ταχυδρομείο, μεταφορά...', answer: false },
        { emoji: '📧', title: 'E-mail', desc: 'Γράφω, πατάω αποστολή, έφτασε! Αμέσως!', answer: true }
      ],
      explain: '📧 Το e-mail φτάνει σε δευτερόλεπτα! Το ταχυδρομείο θέλει μέρες.' },
    { scenario: '📸 Η Υπατία θέλει να στείλει μια φωτογραφία από το πάρτι!' ,
      options: [
        { emoji: '📧', title: 'E-mail', desc: 'Επισυνάπτω και στέλνω!', answer: true },
        { emoji: '📬', title: 'Ταχυδρομείο', desc: 'Τυπώνω, βάζω φάκελο, στέλνω...', answer: false }
      ],
      explain: '📧 Το e-mail είναι πιο γρήγορο! Δεν χρειάζεται να τυπώσεις.' },
    { scenario: '🌍 Ο μπαμπάς είναι σε άλλη χώρα. Πώς θα του μιλήσουμε γρήγορα;',
      options: [
        { emoji: '📬', title: 'Ταχυδρομείο', desc: 'Γράμμα που ταξιδεύει εβδομάδες', answer: false },
        { emoji: '📧', title: 'E-mail', desc: 'Μήνυμα που φτάνει αμέσως!', answer: true }
      ],
      explain: '📧 Με το e-mail επικοινωνούμε αμέσως με όλο τον κόσμο!' },
    { scenario: '📝 Η δασκάλα θέλει να στείλει ανακοίνωση σε όλους τους γονείς!',
      options: [
        { emoji: '📧', title: 'E-mail', desc: 'Γράφω μια φορά, στέλνω σε όλους!', answer: true },
        { emoji: '📬', title: 'Ταχυδρομείο', desc: 'Γράφω ξεχωριστά γράμματα...', answer: false }
      ],
      explain: '📧 Το e-mail στέλνεται σε πολλούς ταυτόχρονα!' },
    { scenario: '🎂 Θέλεις να στείλεις μια ευχή γενεθλίων στον φίλο σου!',
      options: [
        { emoji: '📬', title: 'Ταχυδρομείο', desc: 'Θα αργήσει να φτάσει...', answer: false },
        { emoji: '📧', title: 'E-mail', desc: 'Φτάνει αμέσως! Χρόνια πολλά! 🎉', answer: true }
      ],
      explain: '📧 Το e-mail είναι στιγμιαίο! Τέλειο για ευχές!' },
    { scenario: '🏛️ Θέλεις να στείλεις ένα σχέδιο στον φίλο σου στην άλλη γειτονιά!',
      options: [
        { emoji: '📧', title: 'E-mail', desc: 'Σκαναρω, στέλνω, έτοιμο!', answer: true },
        { emoji: '📬', title: 'Ταχυδρομείο', desc: 'Περπατάω μέχρι το ταχυδρομείο...', answer: false }
      ],
      explain: '📧 Ακόμα και στη διπλανή γειτονιά, το e-mail είναι πιο γρήγορο!' }
  ];
  var current = 0; var score = 0;
  function startGame() {
    current = 0; score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    showQ();
  }
  function showQ() {
    if (current >= questions.length) { showResult(); return; }
    var q = questions[current];
    document.getElementById('qScenario').textContent = q.scenario;
    document.getElementById('roundDisplay').textContent = 'Ερώτηση ' + (current+1) + '/' + questions.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
    var cmp = document.getElementById('qCompare');
    cmp.innerHTML = '';
    for (var i = 0; i < q.options.length; i++) {
      var o = q.options[i];
      var div = document.createElement('div');
      div.className = 'q-option';
      div.setAttribute('data-idx', i);
      div.innerHTML = '<div class="qo-emoji">' + o.emoji + '</div><div class="qo-title">' + o.title + '</div><div class="qo-desc">' + o.desc + '</div>';
      div.addEventListener('click', pick);
      cmp.appendChild(div);
    }
  }
  function pick(el) {
    var q = questions[current];
    var idx = parseInt(el.getAttribute('data-idx'));
    var correct = q.options[idx].answer;
    var opts = document.querySelectorAll('.q-option');
    for (var i = 0; i < opts.length; i++) opts[i].classList.add('disabled');
    var fb = document.getElementById('feedback');
    if (correct) {
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      el.classList.add('correct');
      fb.className = 'feedback show true';
      fb.innerHTML = '✅ Μπράβο! ' + q.explain;
      setTimeout(function() { current++; showQ(); }, 1800);
    } else {
      el.classList.add('wrong');
      for (var i = 0; i < opts.length; i++) {
        if (q.options[i].answer) opts[i].classList.add('reveal');
      }
      fb.className = 'feedback show false';
      fb.innerHTML = '❌ ' + q.explain;
      setTimeout(function() { current++; showQ(); }, 2200);
    }
  }
  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var t = questions.length;
    var e,ti,m;
    if (score===t){e='🏆';ti='Τέλεια!';m='Ξέρεις πόσο γρήγορο είναι το e-mail!'}
    else if(score>=4){e='🎉';ti='Μπράβο!';m='Καταλαβαίνεις τα ψηφιακά δίκτυα!'}
    else if(score>=3){e='👍';ti='Ωραία!';m='Δοκίμασε ξανά!'}
    else {e='💪';ti='Καλή αρχή!';m='Μην σταματάς!'}
    document.getElementById('resultEmoji').textContent = e;
    document.getElementById('resultTitle').textContent = ti;
    document.getElementById('resultMsg').textContent = 'Βρήκες '+score+' από '+t+' σωστά! '+m;
  }
  startGame();
</script>
</body>
</html>
