<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Μάθημα 9.1 - Πέτρα-Ψαλίδι-Χαρτί! ✊✌️📄</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #ffd6e3 100%);
    padding: 12px;
    color: #333;
  }

  .container {
    max-width: 700px;
    margin: 0 auto;
    padding: 20px;
  }

  .header {
    text-align: center;
    padding: 22px 18px 16px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 20px;
    color: #fff;
    box-shadow: 0 8px 24px rgba(102, 126, 234, 0.45);
    margin-bottom: 16px;
  }
  .header h1 { font-size: 1.6rem; margin-bottom: 6px; }
  .header p { font-size: 1.05rem; opacity: .92; }

  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.15);
    padding: 20px;
    margin-bottom: 16px;
  }

  .round-info {
    text-align: center;
    font-size: 1.1rem;
    font-weight: 700;
    color: #764ba2;
    margin-bottom: 14px;
  }

  .arena {
    display: flex;
    justify-content: space-around;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    min-height: 140px;
  }

  .arena-player {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    flex: 1;
  }
  .arena-label {
    font-weight: 700;
    font-size: 1rem;
    color: #666;
  }
  .arena-emoji {
    font-size: 4rem;
    line-height: 1;
    transition: transform .3s ease;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,.15));
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .arena-emoji.shake {
    animation: shakeAnim .5s ease;
  }
  @keyframes shakeAnim {
    0%, 100% { transform: translateY(0); }
    20% { transform: translateY(-12px); }
    40% { transform: translateY(6px); }
    60% { transform: translateY(-8px); }
    80% { transform: translateY(4px); }
  }
  .arena-emoji.pop {
    animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
  }
  .vs-text {
    font-size: 1.6rem;
    font-weight: 900;
    color: #f5576c;
    text-shadow: 0 2px 8px rgba(245,87,108,.3);
  }

  .result-banner {
    text-align: center;
    padding: 14px;
    border-radius: 16px;
    font-size: 1.35rem;
    font-weight: 800;
    margin-bottom: 16px;
    transition: all .3s;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .result-banner.win {
    background: linear-gradient(135deg, #43e97b, #38f9d7);
    color: #fff;
    box-shadow: 0 4px 16px rgba(67,233,123,.4);
  }
  .result-banner.lose {
    background: linear-gradient(135deg, #f5576c, #ff6b6b);
    color: #fff;
    box-shadow: 0 4px 16px rgba(245,87,108,.4);
  }
  .result-banner.draw {
    background: linear-gradient(135deg, #f5af19, #f12711);
    color: #fff;
    box-shadow: 0 4px 16px rgba(245,175,25,.4);
  }
  .result-banner.hidden {
    background: #f5f5f5;
    color: #aaa;
  }

  .choices-title {
    text-align: center;
    font-weight: 700;
    font-size: 1.1rem;
    color: #555;
    margin-bottom: 14px;
  }

  .choices {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .choice-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 16px 22px;
    border: 3px solid #e0e0e0;
    border-radius: 18px;
    background: #fff;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    color: #555;
    box-shadow: 0 4px 14px rgba(0,0,0,.08);
    transition: all .2s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    min-width: 100px;
  }
  .choice-btn .choice-emoji { font-size: 2.6rem; }
  .choice-btn:hover {
    border-color: #764ba2;
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(102,126,234,.25);
  }
  .choice-btn:active { transform: translateY(0); }
  .choice-btn:disabled {
    opacity: .45;
    cursor: not-allowed;
    transform: none;
  }
  .choice-btn.selected {
    border-color: #667eea;
    background: linear-gradient(135deg, #eef2ff, #e8eaff);
    box-shadow: 0 4px 16px rgba(102,126,234,.3);
  }

  .scoreboard {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .score-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 10px 20px;
    border-radius: 14px;
    min-width: 80px;
  }
  .score-item.wins {
    background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
  }
  .score-item.losses {
    background: linear-gradient(135deg, #ffebee, #ffcdd2);
  }
  .score-item.draws {
    background: linear-gradient(135deg, #fff8e1, #ffecb3);
  }
  .score-num {
    font-size: 1.8rem;
    font-weight: 800;
  }
  .score-item.wins .score-num { color: #2e7d32; }
  .score-item.losses .score-num { color: #c62828; }
  .score-item.draws .score-num { color: #e65100; }
  .score-label {
    font-size: .85rem;
    font-weight: 700;
    color: #666;
  }

  .restart-btn {
    display: block;
    margin: 16px auto 0;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    border-radius: 16px;
    padding: 14px 32px;
    font-size: 1.15rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(102,126,234,.4);
    transition: transform .15s, box-shadow .2s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .restart-btn:hover { transform: scale(1.05); box-shadow: 0 8px 28px rgba(102,126,234,.5); }
  .restart-btn:active { transform: scale(.96); }

  .toast-overlay {
    position: fixed;
    top:0;right:0;bottom:0;left:0;
    background: rgba(0,0,0,.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
  }
  .toast-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .toast-box {
    background: #fff;
    border-radius: 24px;
    padding: 32px 28px;
    text-align: center;
    max-width: 400px;
    width: 90%;
    box-shadow: 0 16px 48px rgba(0,0,0,.25);
    transform: scale(.8);
    transition: transform .35s cubic-bezier(.34,1.56,.64,1);
  }
  .toast-overlay.show .toast-box { transform: scale(1); }
  .toast-emoji { font-size: 3.5rem; margin-bottom: 10px; }
  .toast-box h3 { font-size: 1.4rem; color: #2d3436; margin-bottom: 8px; }
  .toast-box p { font-size: 1.1rem; color: #666; margin-bottom: 16px; line-height: 1.5; }
  .toast-close {
    background: linear-gradient(135deg, #43e97b, #38f9d7);
    border: none;
    border-radius: 14px;
    padding: 12px 32px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    box-shadow: 0 4px 14px rgba(67,233,123,.3);
    transition: transform .15s;
  }
  .toast-close:hover { transform: scale(1.05); }
  .toast-close:active { transform: scale(.96); }

  @media (max-width: 480px) {
    body { padding: 8px; }
    .header h1 { font-size: 1.25rem; }
    .header p { font-size: .92rem; }
    .arena-emoji { font-size: 3rem; }
    .vs-text { font-size: 1.2rem; }
    .choice-btn { padding: 12px 14px; min-width: 80px; }
    .choice-btn .choice-emoji { font-size: 2rem; }
    .choice-btn span:last-child { font-size: .85rem; }
    .scoreboard { gap: 10px; }
    .score-item { padding: 8px 14px; min-width: 70px; }
    .score-num { font-size: 1.4rem; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .arena > * + * { margin-left: 12px; }
  .arena-player > * + * { margin-top: 8px; }
  .choices > * { margin: 7px; }
  .choice-btn > * + * { margin-top: 6px; }
  .scoreboard > * { margin: 8px; }
  .score-item > * + * { margin-top: 4px; }
  @media (max-width: 480px){
    .scoreboard > * { margin: 5px; }
  }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>✊✌️📄 Πέτρα-Ψαλίδι-Χαρτί!</h1>
    <p>Διάλεξε και παίξε ενάντια στον υπολογιστή!</p>
  </div>

  <div class="card" id="gameCard">
    <div class="round-info" id="roundInfo">Γύρος 1 από 5</div>

    <div class="arena">
      <div class="arena-player">
        <div class="arena-label">🧒 Εσύ</div>
        <div class="arena-emoji" id="playerEmoji">❓</div>
      </div>
      <div class="vs-text">VS</div>
      <div class="arena-player">
        <div class="arena-label">🤖 Υπολογιστής</div>
        <div class="arena-emoji" id="computerEmoji">❓</div>
      </div>
    </div>

    <div class="result-banner hidden" id="resultBanner">Επίλεξε ✊, ✌️ ή 📄!</div>

    <div class="choices-title" id="choicesTitle">👇 Τι διαλέγεις;</div>
    <div class="choices" id="choices">
      <button class="choice-btn" onclick="play('rock')" id="btnRock">
        <span class="choice-emoji">✊</span>
        <span>Πέτρα</span>
      </button>
      <button class="choice-btn" onclick="play('scissors')" id="btnScissors">
        <span class="choice-emoji">✌️</span>
        <span>Ψαλίδι</span>
      </button>
      <button class="choice-btn" onclick="play('paper')" id="btnPaper">
        <span class="choice-emoji">📄</span>
        <span>Χαρτί</span>
      </button>
    </div>

    <div class="scoreboard">
      <div class="score-item wins">
        <div class="score-num" id="scoreWins">0</div>
        <div class="score-label">🏆 Νίκες</div>
      </div>
      <div class="score-item losses">
        <div class="score-num" id="scoreLosses">0</div>
        <div class="score-label">😢 Ήττες</div>
      </div>
      <div class="score-item draws">
        <div class="score-num" id="scoreDraws">0</div>
        <div class="score-label">🤝 Ισοπαλίες</div>
      </div>
    </div>

    <button class="restart-btn" onclick="restartGame()">🔄 Ξαναπαίξαμε!</button>
  </div>

</div>

<div class="toast-overlay" id="toastOverlay" onclick="closeToast(event)">
  <div class="toast-box">
    <div class="toast-emoji" id="toastEmoji">🎉</div>
    <h3 id="toastTitle">Τέλος παιχνιδιού!</h3>
    <p id="toastMsg"></p>
    <button class="toast-close" onclick="closeToast(event)">Συνέχεια ⭐</button>
  </div>
</div>

<script>
  var CHOICES = ['rock', 'scissors', 'paper'];
  var EMOJIS = { rock: '✊', scissors: '✌️', paper: '📄' };
  var NAMES = { rock: 'Πέτρα', scissors: 'Ψαλίδι', paper: 'Χαρτί' };
  var MAX_ROUNDS = 5;

  var wins = 0;
  var losses = 0;
  var draws = 0;
  var round = 1;
  var busy = false;

  function getResult(player, computer) {
    if (player === computer) return 'draw';
    if (
      (player === 'rock' && computer === 'scissors') ||
      (player === 'scissors' && computer === 'paper') ||
      (player === 'paper' && computer === 'rock')
    ) return 'win';
    return 'lose';
  }

  function setButtonsDisabled(disabled) {
    document.getElementById('btnRock').disabled = disabled;
    document.getElementById('btnScissors').disabled = disabled;
    document.getElementById('btnPaper').disabled = disabled;
  }

  function play(playerChoice) {
    if (busy) return;
    busy = true;
    setButtonsDisabled(true);

    var playerEmoji = document.getElementById('playerEmoji');
    var computerEmoji = document.getElementById('computerEmoji');
    var resultBanner = document.getElementById('resultBanner');

    document.getElementById('btnRock').classList.remove('selected');
    document.getElementById('btnScissors').classList.remove('selected');
    document.getElementById('btnPaper').classList.remove('selected');

    if (playerChoice === 'rock') document.getElementById('btnRock').classList.add('selected');
    if (playerChoice === 'scissors') document.getElementById('btnScissors').classList.add('selected');
    if (playerChoice === 'paper') document.getElementById('btnPaper').classList.add('selected');

    resultBanner.className = 'result-banner hidden';
    resultBanner.textContent = '';

    playerEmoji.textContent = EMOJIS[playerChoice];
    playerEmoji.className = 'arena-emoji shake';

    computerEmoji.textContent = '❓';
    computerEmoji.className = 'arena-emoji shake';

    setTimeout(function() {
      var computerChoice = CHOICES[Math.floor(Math.random() * 3)];
      var result = getResult(playerChoice, computerChoice);

      computerEmoji.textContent = EMOJIS[computerChoice];
      computerEmoji.className = 'arena-emoji pop';
      playerEmoji.className = 'arena-emoji pop';

      if (result === 'win') {
        wins++;
        resultBanner.className = 'result-banner win';
        resultBanner.textContent = '🎉 Νίκησες! ' + NAMES[playerChoice] + ' νικάει ' + NAMES[computerChoice] + '!';
      } else if (result === 'lose') {
        losses++;
        resultBanner.className = 'result-banner lose';
        resultBanner.textContent = '😢 Έχασες! ' + NAMES[computerChoice] + ' νικάει ' + NAMES[playerChoice] + '!';
      } else {
        draws++;
        resultBanner.className = 'result-banner draw';
        resultBanner.textContent = '🤝 Ισοπαλία! Και οι δυο ' + NAMES[playerChoice] + '!';
      }

      updateScoreboard();

      if (round >= MAX_ROUNDS) {
        setTimeout(function() {
          showFinalScore();
        }, 1200);
      } else {
        round++;
        document.getElementById('roundInfo').textContent = 'Γύρος ' + round + ' από ' + MAX_ROUNDS;
        busy = false;
        setButtonsDisabled(false);
        document.getElementById('btnRock').classList.remove('selected');
        document.getElementById('btnScissors').classList.remove('selected');
        document.getElementById('btnPaper').classList.remove('selected');
      }
    }, 700);
  }

  function updateScoreboard() {
    document.getElementById('scoreWins').textContent = wins;
    document.getElementById('scoreLosses').textContent = losses;
    document.getElementById('scoreDraws').textContent = draws;
  }

  function showFinalScore() {
    var emoji, title, msg;
    if (wins > losses) {
      emoji = '🏆';
      title = 'Μπράβο! Νίκησες!';
      msg = 'Κέρδισες ' + wins + ' φορές, έχασες ' + losses + ' και έπαιξες ισοπαλία ' + draws + '!';
    } else if (losses > wins) {
      emoji = '😊';
      title = 'Καλή προσπάθεια!';
      msg = 'Κέρδισες ' + wins + ', έχασες ' + losses + ' και έπαιξες ισοπαλία ' + draws + '. Ξαναδοκίμασε!';
    } else {
      emoji = '🤝';
      title = 'Ισοπαλία!';
      msg = 'Κέρδισες ' + wins + ', έχασες ' + losses + ' και έπαιξες ισοπαλία ' + draws + '! Ξαναπαίξαμε!';
    }
    document.getElementById('toastEmoji').textContent = emoji;
    document.getElementById('toastTitle').textContent = title;
    document.getElementById('toastMsg').textContent = msg;
    document.getElementById('toastOverlay').classList.add('show');
  }

  function closeToast(e) {
    if (e.target === document.getElementById('toastOverlay') || e.target.classList.contains('toast-close')) {
      document.getElementById('toastOverlay').classList.remove('show');
    }
  }

  function restartGame() {
    wins = 0;
    losses = 0;
    draws = 0;
    round = 1;
    busy = false;
    updateScoreboard();
    document.getElementById('roundInfo').textContent = 'Γύρος 1 από ' + MAX_ROUNDS;
    document.getElementById('playerEmoji').textContent = '❓';
    document.getElementById('computerEmoji').textContent = '❓';
    document.getElementById('playerEmoji').className = 'arena-emoji';
    document.getElementById('computerEmoji').className = 'arena-emoji';
    document.getElementById('resultBanner').className = 'result-banner hidden';
    document.getElementById('resultBanner').textContent = 'Επίλεξε ✊, ✌️ ή 📄!';
    setButtonsDisabled(false);
    document.getElementById('btnRock').classList.remove('selected');
    document.getElementById('btnScissors').classList.remove('selected');
    document.getElementById('btnPaper').classList.remove('selected');
  }
</script>

</body>
</html>
