<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ψηφιακή ή όχι; 📟</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    padding: 12px;
    color: #333;
    touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(17,153,142,.4);
    margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; }
  .header p { font-size: .95rem; opacity: .9; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #11998e; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fff9db; border: 2px dashed #f0c040;
    border-radius: 16px; padding: 14px 16px;
    margin-bottom: 14px; text-align: center;
    font-size: 1.05rem; line-height: 1.5; color: #6b5900;
  }
  .item-display {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 32px 20px; margin-bottom: 18px;
    text-align: center; min-height: 180px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .item-emoji { font-size: 5rem; margin-bottom: 10px; }
  .item-name { font-size: 1.3rem; font-weight: 700; color: #2d3436; }
  .btn-group { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .btn-choice {
    border: none; border-radius: 20px; padding: 16px 28px;
    font-size: 1.2rem; font-weight: 700; cursor: pointer;
    transition: transform .15s, box-shadow .2s;
    font-family: inherit;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,.12);
    user-select: none; -webkit-tap-highlight-color: transparent;
    flex: 1; justify-content: center; max-width: 220px;
  }
  .btn-yes { background: linear-gradient(135deg, #11998e, #38ef7d); color: #fff; }
  .btn-yes:active { transform: scale(.95); }
  .btn-no { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
  .btn-no:active { transform: scale(.95); }
  .btn-choice:disabled { opacity: .5; pointer-events: none; }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; margin-bottom: 14px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.yay { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
  .feedback.nay { background: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
  .toast-overlay {
    position: fixed; top:0;right:0;bottom:0;left:0; background: rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; opacity: 0; pointer-events: none;
    transition: opacity .3s;
  }
  .toast-overlay.show { opacity: 1; pointer-events: auto; }
  .toast-box {
    background: #fff; border-radius: 24px; padding: 32px 28px;
    text-align: center; max-width: 320px; width: 90%;
    box-shadow: 0 16px 48px rgba(0,0,0,.2);
    transform: scale(.8); transition: transform .35s cubic-bezier(.34,1.56,.64,1);
  }
  .toast-overlay.show .toast-box { transform: scale(1); }
  .toast-box .toast-emoji { font-size: 3.5rem; margin-bottom: 10px; }
  .toast-box h3 { font-size: 1.3rem; color: #2d3436; margin-bottom: 6px; }
  .toast-box p { font-size: 1rem; color: #666; margin-bottom: 16px; }
  .toast-close {
    background: linear-gradient(135deg, #11998e, #38ef7d); border: none;
    border-radius: 14px; padding: 10px 28px; font-size: 1.05rem;
    font-weight: 700; cursor: pointer; color: #fff; font-family: inherit;
  }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #11998e, #38ef7d); color: #fff;
    border: none; border-radius: 16px; padding: 14px 36px;
    font-size: 1.2rem; font-weight: 700; cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(17,153,142,.35);
    transition: transform .15s;
  }
  .btn-restart:active { transform: scale(.95); }
  @media (max-width: 480px) {
    body { padding: 8px; }
    .header h1 { font-size: 1.2rem; }
    .item-emoji { font-size: 4rem; }
    .item-name { font-size: 1.1rem; }
    .btn-choice { padding: 14px 20px; font-size: 1rem; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .btn-group > * { margin: 7px; }
  .btn-choice > * + * { margin-left: 8px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>📟 Ψηφιακή ή όχι;</h1>
    <p>Ποια συσκευή έχει υπολογιστή μέσα;</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/10</span>
  </div>

  <div class="instructions">
    🔍 Κάθε ψηφιακή συσκευή έχει έναν υπολογιστή μέσα της!<br>
    Πάτησε <strong>✅ Ναι</strong> αν έχει υπολογιστή ή <strong>❌ Όχι</strong> αν δεν έχει.
  </div>

  <div id="gameArea">
    <div class="item-display">
      <div class="item-emoji" id="itemEmoji">⌚</div>
      <div class="item-name" id="itemName">Έξυπνο Ρολόι</div>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="btn-group">
      <button class="btn-choice btn-yes" id="btnYes" onclick="answer(true)">✅ Ναι</button>
      <button class="btn-choice btn-no" id="btnNo" onclick="answer(false)">❌ Όχι</button>
    </div>
  </div>

  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>

<div class="toast-overlay" id="toastOverlay">
  <div class="toast-box">
    <div class="toast-emoji" id="toastEmoji">🎉</div>
    <h3 id="toastTitle">Υπέροχα!</h3>
    <p id="toastMsg">Συνέχισε έτσι!</p>
    <button class="toast-close" onclick="closeToast()">Συνέχεια ⭐</button>
  </div>
</div>

<script>
  var items = [
    { emoji: '⌚', name: 'Έξυπνο Ρολόι', isDigital: true,
      tip: 'Το έξυπνο ρολόι έχει υπολογιστή μέσα! Μετράει την υγεία μας.' },
    { emoji: '🔔', name: 'Συναγερμός', isDigital: true,
      tip: 'Ο συναγερμός έχει υπολογιστή! Ανιχνεύει κίνηση με αισθητήρες.' },
    { emoji: '💳', name: 'Μηχάνημα Πληρωμής', isDigital: true,
      tip: 'Το μηχάνημα πληρωμής είναι ψηφιακό! Συνδέεται με την τράπεζα.' },
    { emoji: '🗺️', name: 'Πλοηγός GPS', isDigital: true,
      tip: 'Ο πλοηγός έχει υπολογιστή! Δείχνει τον χάρτη και βρίσκει διαδρομές.' },
    { emoji: '🧾', name: 'Ταμειακή Μηχανή', isDigital: true,
      tip: 'Η ταμειακή μηχανή έχει υπολογιστή! Υπολογίζει τις τιμές.' },
    { emoji: '🤖', name: 'Σκούπα Ρομπότ', isDigital: true,
      tip: 'Η σκούπα ρομπότ έχει υπολογιστή! Έχει αισθητήρες για να αποφεύγει εμπόδια.' },
    { emoji: '📖', name: 'Βιβλίο', isDigital: false,
      tip: 'Το βιβλίο δεν είναι ψηφιακό. Είναι από χαρτί!' },
    { emoji: '🥄', name: 'Κουτάλι', isDigital: false,
      tip: 'Το κουτάλι δεν είναι ψηφιακή συσκευή. Το χρησιμοποιούμε για να φάμε!' },
    { emoji: '🧸', name: 'Λούτρινο Αρκουδάκι', isDigital: false,
      tip: 'Το αρκουδάκι δεν είναι ψηφιακό. Είναι παιχνίδι!' },
    { emoji: '🚲', name: 'Ποδήλατο', isDigital: false,
      tip: 'Το ποδήλατο δεν είναι ψηφιακό. Το κινούμε με τα πόδια!' }
  ];

  var shuffled = [];
  var currentIndex = 0;
  var score = 0;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function startGame() {
    shuffled = shuffle(items.slice());
    currentIndex = 0;
    score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
    showItem();
  }

  function showItem() {
    if (currentIndex >= shuffled.length) {
      showResult();
      return;
    }
    var item = shuffled[currentIndex];
    document.getElementById('itemEmoji').textContent = item.emoji;
    document.getElementById('itemName').textContent = item.name;
    document.getElementById('roundDisplay').textContent = (currentIndex + 1) + '/' + shuffled.length;
    document.getElementById('btnYes').disabled = false;
    document.getElementById('btnNo').disabled = false;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
  }

  function answer(isYes) {
    var item = shuffled[currentIndex];
    var correct = (isYes === item.isDigital);

    document.getElementById('btnYes').disabled = true;
    document.getElementById('btnNo').disabled = true;

    var fb = document.getElementById('feedback');
    if (correct) {
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      fb.className = 'feedback show yay';
      fb.textContent = '✅ Μπράβο! ' + item.tip;
      setTimeout(function() {
        currentIndex++;
        showItem();
      }, 1800);
    } else {
      fb.className = 'feedback show nay';
      fb.textContent = '❌ Ωχ! ' + item.tip;
      setTimeout(function() {
        currentIndex++;
        showItem();
      }, 2200);
    }
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var total = shuffled.length;
    var pct = score / total;
    var emoji, title, msg;
    if (pct === 1) {
      emoji = '🏆'; title = 'Τέλεια!';
      msg = 'Βρήκες όλες τις ψηφιακές συσκευές! Είσαι σούπερ!';
    } else if (pct >= 0.75) {
      emoji = '🎉'; title = 'Μπράβο!';
      msg = 'Τα πήγες πολύ καλά!';
    } else if (pct >= 0.5) {
      emoji = '👍'; title = 'Ωραία!';
      msg = 'Καλή προσπάθεια! Δοκίμασε ξανά!';
    } else {
      emoji = '💪'; title = 'Καλή αρχή!';
      msg = 'Προσπάθησε ξανά! Θα τα πας καλύτερα!';
    }
    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultMsg').textContent = 'Βρήκες ' + score + ' από ' + total + ' σωστά! ' + msg;
  }

  function closeToast() {
    document.getElementById('toastOverlay').classList.remove('show');
  }

  startGame();
</script>
</body>
</html>
