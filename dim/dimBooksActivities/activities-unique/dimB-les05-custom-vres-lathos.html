<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Βρες το Λάθος 🔍</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(102,126,234,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; }
  .header p { font-size: .9rem; opacity: .85; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #667eea; }
  .level { font-size: 1rem; color: #888; }
  .instruction {
    background: #fff; border-radius: 20px; padding: 16px 18px;
    margin-bottom: 14px; text-align: center; font-size: 1rem;
    font-weight: 700; color: #2d3436;
    box-shadow: 0 4px 14px rgba(0,0,0,.08); line-height: 1.5;
  }
  .path-area {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 20px; margin-bottom: 14px; text-align: center;
  }
  .path-visual {
    display: flex; gap: 4px; justify-content: center; flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .path-step {
    background: #fff3e0; border: 2px solid #ffcc80;
    border-radius: 10px; padding: 8px 12px; font-size: 1.2rem;
  }
  .path-arrow { font-size: 1.2rem; color: #aaa; }
  .program-compare {
    display: grid; grid-template-columns: 1fr 1fr; grid-gap: 12px; margin-bottom: 14px;
  }
  .program-box {
    background: #fff; border-radius: 16px;
    border: 3px solid #e8e8e8; padding: 14px 10px; text-align: center;
  }
  .program-box .pb-label { font-size: .85rem; color: #888; font-weight: 600; margin-bottom: 6px; }
  .program-box .pb-code {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .program-box .pb-repeat {
    background: #fce4ec; border: 2px solid #f48fb1;
    border-radius: 10px; padding: 4px 12px;
    font-size: .95rem; font-weight: 700; color: #c2185b;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .program-box .pb-repeat .pn {
    background: #f5576c; color: #fff; border-radius: 50%;
    width: 24px; height: 24px; display: inline-flex;
    align-items: center; justify-content: center; font-size: .8rem;
  }
  .program-box .pb-cmds { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
  .program-box .pb-cmd {
    background: #e8f5e9; border: 1px solid #a5d6a7;
    border-radius: 8px; padding: 4px 8px; font-size: .85rem; font-weight: 600; color: #2e7d32;
  }
  .program-box.selected { border-color: #667eea; background: #e8eaf6; }
  .program-box.correct { border-color: #28a745; background: #d4edda; }
  .program-box.wrong { border-color: #dc3545; background: #f8d7da; }
  .tap-area {
    text-align: center; margin-bottom: 14px;
  }
  .btn-tap {
    background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
    border: none; border-radius: 20px; padding: 14px 36px;
    font-size: 1.2rem; font-weight: 700; cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(102,126,234,.35); transition: transform .15s;
  }
  .btn-tap:active { transform: scale(.95); }
  .btn-tap:disabled { opacity: .5; pointer-events: none; }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; display: none;
  }
  .feedback.show { display: block; }
  .feedback.yay { background: #d4edda; color: #155724; }
  .feedback.nay { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
    border: none; border-radius: 16px; padding: 14px 36px;
    font-size: 1.2rem; font-weight: 700; cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(102,126,234,.35); transition: transform .15s;
  }
  .btn-restart:active { transform: scale(.95); }
  @media (max-width:480px) {
    body { padding: 8px; }
    .header h1 { font-size: 1.2rem; }
    .program-compare { grid-template-columns: 1fr; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .path-visual > * { margin: 2px; }
  .program-box .pb-code > * + * { margin-top: 4px; }
  .program-box .pb-repeat > * + * { margin-left: 4px; }
  .program-box .pb-cmds > * { margin: 2px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🔍 Βρες το Λάθος</h1>
    <p>Ποιο πρόγραμμα ταιριάζει στη διαδρομή;</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="level" id="levelDisplay">1/8</span>
  </div>
  <div id="gameArea">
    <div class="instruction">👣 Κοίτα τη διαδρομή και διάλεξε το σωστό πρόγραμμα!</div>
    <div class="path-area">
      <div class="path-visual" id="pathVisual"></div>
    </div>
    <div class="program-compare" id="progCompare"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var levels = [
    { path: ['➡️','➡️','➡️'], progs: [
      { repeat: 3, cmds: ['➡️'] }, { repeat: 2, cmds: ['➡️','➡️'] }, { repeat: 4, cmds: ['➡️'] }, { repeat: 3, cmds: ['➡️','➡️'] }
    ], answer: 0 },
    { path: ['➡️','⬅️','➡️','⬅️','➡️','⬅️','➡️','⬅️'], progs: [
      { repeat: 4, cmds: ['➡️','⬅️'] }, { repeat: 4, cmds: ['➡️'] }, { repeat: 3, cmds: ['➡️','⬅️'] }, { repeat: 2, cmds: ['➡️','⬅️'] }
    ], answer: 0 },
    { path: ['⬆️','⬆️','⬆️','⬆️','⬆️','⬆️'], progs: [
      { repeat: 6, cmds: ['⬆️'] }, { repeat: 3, cmds: ['⬆️'] }, { repeat: 2, cmds: ['⬆️'] }, { repeat: 5, cmds: ['⬆️'] }
    ], answer: 0 },
    { path: ['➡️','➡️','⬅️','➡️','➡️','⬅️'], progs: [
      { repeat: 2, cmds: ['➡️','➡️','⬅️'] }, { repeat: 3, cmds: ['➡️','⬅️'] }, { repeat: 2, cmds: ['➡️','⬅️','➡️'] }, { repeat: 3, cmds: ['➡️','➡️','⬅️'] }
    ], answer: 0 },
    { path: ['➡️','⬆️','➡️','⬆️','➡️','⬆️','➡️','⬆️'], progs: [
      { repeat: 4, cmds: ['➡️','⬆️'] }, { repeat: 2, cmds: ['➡️','⬆️'] }, { repeat: 3, cmds: ['➡️','⬆️'] }, { repeat: 8, cmds: ['➡️','⬆️'] }
    ], answer: 0 },
    { path: ['➡️','➡️','➡️','➡️','➡️'], progs: [
      { repeat: 5, cmds: ['➡️'] }, { repeat: 3, cmds: ['➡️','➡️'] }, { repeat: 4, cmds: ['➡️'] }, { repeat: 5, cmds: ['➡️','➡️'] }
    ], answer: 0 },
    { path: ['⬅️','➡️','⬅️','➡️','⬅️','➡️'], progs: [
      { repeat: 3, cmds: ['⬅️','➡️'] }, { repeat: 6, cmds: ['⬅️','➡️'] }, { repeat: 2, cmds: ['⬅️','➡️','⬅️','➡️'] }, { repeat: 3, cmds: ['➡️','⬅️'] }
    ], answer: 0 },
    { path: ['⬆️','⬆️','⬆️','⬆️'], progs: [
      { repeat: 4, cmds: ['⬆️'] }, { repeat: 2, cmds: ['⬆️'] }, { repeat: 3, cmds: ['⬆️'] }, { repeat: 4, cmds: ['⬆️','⬆️'] }
    ], answer: 0 }
  ];
  var cur = 0, score = 0;
  function shuffle(a) { for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a; }
  function startGame() { shuffle(levels); cur=0; score=0;
    document.getElementById('scoreDisplay').textContent='⭐ 0';
    document.getElementById('gameArea').style.display='block';
    document.getElementById('resultScreen').style.display='none';
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none'; loadLevel(); }
  function loadLevel() {
    if(cur>=levels.length){showResult();return;}
    var lv=levels[cur];
    document.getElementById('levelDisplay').textContent=(cur+1)+'/'+levels.length;
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    var pv=document.getElementById('pathVisual'); pv.innerHTML='';
    for(var i=0;i<lv.path.length;i++){if(i>0)pv.innerHTML+='<span class="path-arrow">→</span>';pv.innerHTML+='<span class="path-step">'+lv.path[i]+'</span>';}
    var pc=document.getElementById('progCompare'); pc.innerHTML='';
    for(var j=0;j<lv.progs.length;j++){
      (function(idx){
        var box=document.createElement('div'); box.className='program-box';
        var cmdhtml='';
        for(var k=0;k<lv.progs[idx].cmds.length;k++) cmdhtml+='<span class="pb-cmd">'+lv.progs[idx].cmds[k]+'</span>';
        box.innerHTML='<div class="pb-label">Πρόγραμμα '+(idx+1)+'</div><div class="pb-code"><div class="pb-repeat">🔁 <span class="pn">'+lv.progs[idx].repeat+'</span></div><div class="pb-cmds">'+cmdhtml+'</div></div>';
        box.addEventListener('click',function(){choose(idx);});
        pc.appendChild(box);
      })(j);
    }
  }
  function choose(idx){
    var lv=levels[cur]; var fb=document.getElementById('feedback');
    var boxes=document.querySelectorAll('.program-box');
    for(var i=0;i<boxes.length;i++) boxes[i].style.pointerEvents='none';
    if(idx===lv.answer){score++;
      document.getElementById('scoreDisplay').textContent='⭐ '+score;
      boxes[idx].classList.add('correct');
      fb.className='feedback show yay';
      fb.textContent='✅ Μπράβο! Αυτό είναι το σωστό πρόγραμμα!';
    }else{
      boxes[idx].classList.add('wrong'); boxes[lv.answer].classList.add('correct');
      fb.className='feedback show nay';
      fb.textContent='❌ Λάθος! Το σωστό είναι το '+(lv.answer+1)+'!';
    }
    setTimeout(function(){cur++;loadLevel();},1800);
  }
  function showResult(){
    document.getElementById('gameArea').style.display='none';
    document.getElementById('resultScreen').style.display='block';
    var total=levels.length; var pct=score/total;
    var emoji,title,msg;
    if(pct===1){emoji='🏆';title='Τέλεια!';msg='Βρήκες όλα τα λάθη! Είσαι σούπερ!';}
    else if(pct>=0.75){emoji='🎉';title='Μπράβο!';msg='Σχεδόν όλα σωστά!';}
    else if(pct>=0.5){emoji='👍';title='Ωραία!';msg='Καλή προσπάθεια! Δοκίμασε ξανά!';}
    else{emoji='💪';title='Καλή αρχή!';msg='Προσπάθησε ξανά! Θα τα πας καλύτερα!';}
    document.getElementById('resultEmoji').textContent=emoji;
    document.getElementById('resultTitle').textContent=title;
    document.getElementById('resultMsg').textContent='Βρήκες '+score+' από '+total+' σωστά! '+msg;
  }
  startGame();
</script>
</body>
</html>
