<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Κρυπτογράφηση Λέξης | Μάθημα 2</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;min-height:100vh;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:12px;display:flex;flex-direction:column;align-items:center;}
h1{color:#fff;font-size:1.5rem;text-align:center;text-shadow:2px 2px 6px rgba(0,0,0,.3);margin:8px 0 4px;}
.subtitle{color:#fffde7;font-size:.9rem;text-align:center;margin-bottom:12px;}
.container{background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.22);max-width:750px;width:100%;padding:20px;}
.section{background:#f8f9ff;border-radius:14px;padding:16px;margin-bottom:14px;border:2px solid #e8eaf6;}
.section-title{font-size:1rem;font-weight:700;color:#4527a0;margin-bottom:10px;text-align:center;}
.block-area{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0;min-height:60px;padding:10px;background:#fff;border-radius:10px;border:2px dashed #c4b5fd;}
.scratch-block{padding:8px 14px;border-radius:8px;font-size:.85rem;font-weight:700;color:#fff;cursor:pointer;transition:all .15s;white-space:nowrap;}
.scratch-block:hover{transform:scale(1.05);box-shadow:0 3px 8px rgba(0,0,0,.2);}
.scratch-block.hat{background:linear-gradient(135deg,#f9a825,#ff6f00);border-radius:14px 14px 8px 8px;}
.scratch-block.motion{background:linear-gradient(135deg,#42a5f5,#1565c0);}
.scratch-block.variable{background:linear-gradient(135deg,#ff8a65,#d84315);}
.scratch-block.control{background:linear-gradient(135deg,#66bb6a,#2e7d32);}
.scratch-block.operator{background:linear-gradient(135deg,#ab47bc,#6a1b9a);}
.scratch-block.looks{background:linear-gradient(135deg,#ec407a,#ad1457);}
.word-input{width:100%;padding:10px;border:2px solid #e0e0e0;border-radius:12px;font-size:1.1rem;text-align:center;outline:none;text-transform:uppercase;letter-spacing:3px;}
.word-input:focus{border-color:#667eea;}
.key-row{display:flex;gap:8px;align-items:center;justify-content:center;margin:10px 0;}
.key-btn{width:40px;height:40px;border-radius:50%;border:2px solid #667eea;background:#fff;font-size:1rem;font-weight:700;cursor:pointer;color:#5b3ea8;transition:all .2s;}
.key-btn:hover{background:#ede9fe;transform:scale(1.1);}
.key-val{font-size:1.2rem;font-weight:800;color:#5b3ea8;min-width:80px;text-align:center;}
.result-box{border-radius:12px;padding:12px;text-align:center;font-size:1.1rem;font-weight:700;margin-top:8px;word-break:break-all;}
.result-box.success{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:2px solid #86efac;color:#166534;}
.result-box.error{background:linear-gradient(135deg,#fef2f2,#fecaca);border:2px solid #f87171;color:#991b1b;}
.btn{padding:10px 20px;border:none;border-radius:12px;cursor:pointer;font-size:.9rem;font-weight:700;transition:all .2s;}
.btn:hover{transform:translateY(-2px);}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}
.btn-success{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#333;}
.btn-warning{background:linear-gradient(135deg,#f7971e,#ffd200);color:#333;}
.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
.letter-chain{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
.letter-step{background:#fff;border:2px solid #e0e0e0;border-radius:10px;padding:8px 12px;text-align:center;min-width:40px;}
.letter-step .lbl{font-size:.65rem;color:#999;font-weight:600;}
.letter-step .val{font-size:1.2rem;font-weight:800;color:#4527a0;}
.arrow-s{font-size:1.2rem;color:#764ba2;font-weight:700;align-self:center;}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .block-area > * { margin: 3px; }
  .key-row > * + * { margin-left: 8px; }
  .btn-row > * { margin: 4px; }
  .letter-chain > * { margin: 3px; }
  .g61f6_0 > * { margin: 3px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<h1>🔒 Κρυπτογράφηση Λέξης</h1>
<p class="subtitle">Χρησιμοποίησε «Scratch blocks» για να κρυπτογραφήσεις μια λέξη!</p>
<div class="container">
<div class="section">
<div class="section-title">📝 Επέλεξε λέξη ή γράψε δική σου</div>
<div class="g61f6_0" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px;">
<button class="btn btn-primary" style="font-size:.8rem;padding:8px 14px;" onclick="setWord('ΓΕΙΑ')">ΓΕΙΑ</button>
<button class="btn btn-primary" style="font-size:.8rem;padding:8px 14px;" onclick="setWord('ΣΧΟΛΕΙΟ')">ΣΧΟΛΕΙΟ</button>
<button class="btn btn-primary" style="font-size:.8rem;padding:8px 14px;" onclick="setWord('ΜΑΘΗΜΑ')">ΜΑΘΗΜΑ</button>
<button class="btn btn-primary" style="font-size:.8rem;padding:8px 14px;" onclick="setWord('ΥΠΟΛΟΓΙΣΤΗΣ')">ΥΠΟΛΟΓΙΣΤΗΣ</button>
</div>
<input type="text" class="word-input" id="wordInput" placeholder="Γράψε λέξη (κεφαλαία)..." maxlength="15">
</div>
<div class="section">
<div class="section-title">🔑 Διάλεξε Κλειδί</div>
<div class="key-row">
<button class="key-btn" onclick="changeKey(-1)">-</button>
<span class="key-val" id="keyVal">Κλειδί: 3</span>
<button class="key-btn" onclick="changeKey(1)">+</button>
</div>
</div>
<div class="section">
<div class="section-title">🧩 Φτιάξε το Πρόγραμμα — Σύρε τα blocks!</div>
<p style="text-align:center;font-size:.85rem;color:#888;margin-bottom:8px;">Κάνε κλικ στα blocks με τη σωστή σειρά:</p>
<div class="block-area" id="programArea"></div>
<div class="g61f6_0" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;" id="availableBlocks"></div>
</div>
<div class="section">
<div class="section-title">📊 Αποτέλεσμα</div>
<div class="letter-chain" id="letterChain"></div>
<div class="result-box" id="result" style="background:#f3e5f5;border:2px solid #ce93d8;color:#4527a0;">
Περιμένουμε το πρόγραμμά σου...
</div>
</div>
<div class="btn-row">
<button class="btn btn-success" onclick="runProgram()">▶ Εκτέλεση</button>
<button class="btn btn-warning" onclick="resetProgram()">🔄 Καθαρισμός</button>
</div>
</div>
<script>
var GREEK='ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ';
var N=GREEK.length;
var key=3;
var word='';
var programSteps=[];
var allSteps=['hat','read','set_key','repeat','letter','shift','next','say'];
var stepLabels={'hat':'Όταν πράσινη σημαία','read':'ρώτησε «Ποια λέξη;»','set_key':'Όρισε κλειδί = '+key,'repeat':'Επανάλαβε για κάθε γράμμα','letter':'διάβασε γράμμα','shift':'αντικατάσταση +'+key,'next':'επόμενο γράμμα','say':'πες κρυπτογραφημένο'};
var stepClasses={'hat':'hat','read':'looks','set_key':'variable','repeat':'control','letter':'motion','shift':'operator','next':'control','say':'looks'};
function setWord(w){word=w;document.getElementById('wordInput').value=w;updateChain();}
document.getElementById('wordInput').addEventListener('input',function(){word=this.value.toUpperCase().replace(/[^Α-Ω]/g,'');this.value=word;updateChain();});
function changeKey(d){key=((key+d-1+N)%N)+1;if(key<1)key=N;document.getElementById('keyVal').textContent='Κλειδί: '+key;stepLabels['set_key']='Όρισε κλειδί = '+key;stepLabels['shift']='αντικατάσταση +'+key;renderBlocks();updateChain();}
function encrypt(text,k){var r='';for(var i=0;i<text.length;i++){var idx=GREEK.indexOf(text[i]);if(idx>=0)r+=GREEK[(idx+k)%N];else r+=text[i];}return r;}
function renderBlocks(){
var avail=document.getElementById('availableBlocks');avail.innerHTML='';
allSteps.forEach(function(step){
var b=document.createElement('div');b.className='scratch-block '+stepClasses[step];b.textContent=stepLabels[step];b.dataset.step=step;
b.onclick=function(){addToProgram(step);};
avail.appendChild(b);
});
}
function addToProgram(step){
programSteps.push(step);
var area=document.getElementById('programArea');
var b=document.createElement('div');b.className='scratch-block '+stepClasses[step];b.textContent=stepLabels[step];
b.style.cursor='default';b.onclick=function(){this.remove();programSteps=programSteps.filter(function(s,i){return i!==programSteps.indexOf(step);});};
area.appendChild(b);
}
function updateChain(){
var chain=document.getElementById('letterChain');chain.innerHTML='';
if(!word)return;
for(var i=0;i<word.length;i++){
var ch=word[i];var idx=GREEK.indexOf(ch);
if(i>0){var arr=document.createElement('span');arr.className='arrow-s';arr.textContent='→';chain.appendChild(arr);}
var step=document.createElement('div');step.className='letter-step';
var lbl=document.createElement('div');lbl.className='lbl';lbl.textContent='Γράμμα';
var val=document.createElement('div');val.className='val';val.textContent=ch;
step.appendChild(lbl);step.appendChild(val);chain.appendChild(step);
if(idx>=0){
var arr2=document.createElement('span');arr2.className='arrow-s';arr2.textContent='→';chain.appendChild(arr2);
var step2=document.createElement('div');step2.className='letter-step';step2.style.borderColor='#86efac';
var lbl2=document.createElement('div');lbl2.className='lbl';lbl2.textContent='+'+key;
var val2=document.createElement('div');val2.className='val';val2.textContent=GREEK[(idx+key)%N];val2.style.color='#16a34a';
step2.appendChild(lbl2);step2.appendChild(val2);chain.appendChild(step2);
}
}
}
window.runProgram=function(){
var res=document.getElementById('result');
if(!word){res.textContent='Γράψε πρώτα μια λέξη!';return;}
var correctOrder=['hat','read','set_key','repeat','letter','shift','next','say'];
var isOk=programSteps.length===correctOrder.length;
if(isOk){for(var i=0;i<correctOrder.length;i++){if(programSteps[i]!==correctOrder[i]){isOk=false;break;}}}
var encrypted=encrypt(word,key);
if(isOk){
res.className='result-box success';
res.textContent='✅ Σωστό πρόγραμμα! «'+word+'» → «'+encrypted+'»';
}else if(programSteps.length>0){
res.className='result-box';
res.style.background='#fff3e0';res.style.border='2px solid #fdba74';res.style.color='#92400e';
res.textContent='⚠️ Το πρόγραμμα δεν είναι σωστό. Δοκίμασε άλλη σειρά!';
}else{
res.className='result-box';
res.style.background='#f3e5f5';res.style.border='2px solid #ce93d8';res.style.color='#4527a0';
res.textContent='Πρόσθεσε blocks στο πρόγραμμα!';
}
updateChain();
};
window.resetProgram=function(){programSteps=[];document.getElementById('programArea').innerHTML='';};
renderBlocks();
</script>
</body>
</html>
