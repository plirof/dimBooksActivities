<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Το Κόκκινο Χ ❌</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
    padding: 12px; color: #333;
  }
  .app-container { max-width: 520px; margin: 0 auto; }
  .header {
    text-align: center; padding: 16px 14px 10px;
    background: linear-gradient(135deg, #eb3349, #f45c43);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(235,51,73,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.3rem; margin-bottom: 2px; }
  .header p { font-size: .95rem; opacity: .95; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 8px 16px;
    margin-bottom: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.1rem; font-weight: 700; color: #eb3349; }
  .round { font-size: .9rem; color: #888; }
  .director {
    background: #fff; border-radius: 16px;
    padding: 12px; margin-bottom: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
    text-align: center;
  }
  .director .d-msg { display: block; font-size: 1.02rem; font-weight: 700; color: #444; margin-bottom: 8px; }
  .chips {
    display: flex; justify-content: center; flex-wrap: wrap;
  }
  .chip {
    display: inline-flex; align-items: center;
    background: #fff3e0; border: 2px solid #ff9800;
    border-radius: 20px; padding: 4px 14px;
    font-size: 1.25rem; font-weight: 700;
    margin: 3px;
  }
  .hint {
    text-align: center; font-size: .9rem; font-weight: 700; color: #b71c1c;
    background: #fff; border-radius: 14px; padding: 8px 12px;
    margin-bottom: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .stage {
    display: flex; justify-content: center; flex-wrap: wrap;
    background: linear-gradient(180deg, #e3f2fd 0%, #f1f8e9 100%);
    border: 3px solid #b0bec5;
    border-radius: 18px;
    padding: 18px 10px;
    margin-bottom: 14px;
    min-height: 120px;
  }
  .char {
    position: relative;
    width: 84px; height: 84px;
    background: #fff; border: 3px solid #cfd8dc;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .15s;
    margin: 6px;
    font-size: 2.6rem;
  }
  .char:active { transform: scale(.92); }
  .char.marked { border-color: #eb3349; }
  .char .xmark {
    display: none;
    position: absolute; top: -10px; right: -10px;
    width: 30px; height: 30px;
    background: #eb3349; color: #fff;
    border-radius: 50%;
    font-size: 1.1rem; font-weight: 700; line-height: 30px; text-align: center;
    box-shadow: 0 2px 8px rgba(235,51,73,.5);
  }
  .char.marked .xmark { display: block; }
  .char.gone { animation: vanish .4s forwards; pointer-events: none; }
  @keyframes vanish {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(0); opacity: 0; }
  }
  .char.shake { animation: shake .4s; }
  .char.dance { animation: dance .5s infinite; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  @keyframes dance {
    0%, 100% { transform: rotate(-10deg); }
    50% { transform: rotate(10deg); }
  }
  .next-row {
    display: flex; justify-content: center; margin-bottom: 10px;
  }
  .btn-next {
    border: none; border-radius: 14px; padding: 13px 32px;
    font-size: 1.05rem; font-weight: 700; cursor: pointer;
    font-family: inherit;
    background: linear-gradient(135deg, #43a047, #8bc34a);
    color: #fff;
    box-shadow: 0 4px 12px rgba(67,160,71,.4);
    transition: transform .15s;
  }
  .btn-next:active { transform: scale(.95); }
  .skip-row {
    display: flex; justify-content: center; margin-bottom: 12px;
  }
  .btn-skip {
    border: none; border-radius: 12px; padding: 8px 18px;
    font-size: .85rem; font-weight: 700; cursor: pointer;
    font-family: inherit;
    background: #eceff1; color: #607d8b;
    margin: 0 5px;
    transition: transform .15s;
  }
  .btn-skip:active { transform: scale(.95); }
  .feedback {
    text-align: center; padding: 12px; border-radius: 14px;
    font-size: 1rem; font-weight: 700; margin-bottom: 10px; display: none;
  }
  .feedback.correct { display: block; background: #d4edda; color: #155724; }
  .feedback.wrong { display: block; background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1); padding: 40px 24px;
    text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #eb3349, #f45c43);
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 36px; font-size: 1.2rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(235,51,73,.35);
    transition: transform .15s;
  }
  .btn-restart:hover { transform: scale(1.05); }
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>❌ Το Κόκκινο Χ</h1>
    <p>Σβήσε με το Χ τους χαρακτήρες που ΔΕΝ θέλουμε στην ιστορία!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/3</span>
  </div>
  <div id="gameArea">
    <div class="director">
      <span class="d-msg">🎬 Ο σκηνοθέτης λέει: «Στην ιστορία μου θέλω ΜΟΝΟ:»</span>
      <div class="chips" id="chips"></div>
    </div>
    <div class="hint">👉 Πάτα ένα χαρακτήρα που δεν χρειάζεται → εμφανίζεται κόκκινο Χ → ξαναπάτα για να σβήσει!</div>
    <div class="stage" id="stage"></div>
    <div class="next-row">
      <button class="btn-next" id="btnNext" onclick="advanceRound()" style="display:none;">➡️ Επόμενη σκηνή!</button>
    </div>
    <div class="skip-row">
      <button class="btn-skip" onclick="advanceRound()">⏭️ Παράλειψη σκηνής</button>
      <button class="btn-skip" onclick="startGame()">🔄 Από την αρχή</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var rounds = [
    {
      need: ['👨‍🚀', '🚀'],
      stage: ['👨‍🚀', '🍌', '🚀', '🐸', '🌸']
    },
    {
      need: ['🐱', '🐶'],
      stage: ['🐱', '🍎', '🐶', '🚗', '⭐', '🎈']
    },
    {
      need: ['🚀', '🌍'],
      stage: ['🚀', '🍕', '🌍', '🐘', '🎸', '🌙']
    }
  ];

  var currentRound = 0, score = 0, resolved = false;
  var needSet = {};
  var winTimer = null;

  function startGame() {
    currentRound = 0; score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    loadRound();
  }

  function loadRound() {
    if (currentRound >= rounds.length) { showResult(); return; }
    resolved = false;
    if (winTimer) { clearTimeout(winTimer); winTimer = null; }
    document.getElementById('btnNext').style.display = 'none';
    var rd = rounds[currentRound];
    needSet = {};
    for (var i = 0; i < rd.need.length; i++) needSet[rd.need[i]] = true;

    document.getElementById('roundDisplay').textContent = (currentRound + 1) + '/' + rounds.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';

    var chips = document.getElementById('chips');
    chips.innerHTML = '';
    for (var n = 0; n < rd.need.length; n++) {
      var chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = rd.need[n];
      chips.appendChild(chip);
    }

    var order = [];
    for (var s = 0; s < rd.stage.length; s++) order.push(rd.stage[s]);
    for (var k = order.length - 1; k > 0; k--) {
      var j = Math.floor(Math.random() * (k + 1));
      var tmp = order[k]; order[k] = order[j]; order[j] = tmp;
    }

    var stage = document.getElementById('stage');
    stage.innerHTML = '';
    for (var p = 0; p < order.length; p++) {
      (function(emoji) {
        var card = document.createElement('div');
        card.className = 'char';
        card.innerHTML = '<span class="c-face">' + emoji + '</span>' +
                         '<span class="xmark">✕</span>';
        card.onclick = function() { onTap(card, emoji); };
        stage.appendChild(card);
      })(order[p]);
    }
  }

  function setFeedback(type, text) {
    var fb = document.getElementById('feedback');
    fb.className = 'feedback ' + type;
    fb.style.display = '';
    fb.textContent = text;
  }

  function onTap(card, emoji) {
    if (resolved) return;
    if (needSet[emoji]) {
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
      setFeedback('wrong', '«' + emoji + '» τον θέλουμε στην ιστορία! Μην τον σβήσεις!');
      return;
    }
    if (!card.classList.contains('marked')) {
      card.classList.add('marked');
      setFeedback('wrong', 'Δες το κόκκινο Χ! Πάτα ξανά για να σβήσεις τον «' + emoji + '».');
      return;
    }
    card.classList.add('gone');
    setTimeout(function() {
      if (card.parentNode) card.parentNode.removeChild(card);
    }, 420);
    var stage = document.getElementById('stage');
    var remaining = 0;
    var cards = stage.querySelectorAll('.char');
    for (var i = 0; i < cards.length; i++) {
      if (!cards[i].classList.contains('gone')) remaining++;
    }
    if (remaining === rounds[currentRound].need.length) {
      resolved = true;
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      var kept = stage.querySelectorAll('.char:not(.gone)');
      for (var d = 0; d < kept.length; d++) kept[d].classList.add('dance');
      setFeedback('correct', '🎬 Μπράβο! Η σκηνή ολοκληρώθηκε! Πάτα «Επόμενη σκηνή» για να συνεχίσεις!');
      document.getElementById('btnNext').style.display = 'inline-block';
      winTimer = setTimeout(function() { advanceRound(); }, 5000);
    }
  }

  function advanceRound() {
    if (winTimer) { clearTimeout(winTimer); winTimer = null; }
    currentRound++;
    loadRound();
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var total = rounds.length;
    var emoji, title, msg;
    if (score === total) { emoji = '🏆'; title = 'Τέλεια!'; msg = 'Τώρα ξέρεις το κολάο του κόκκινου Χ!'; }
    else if (score >= 2) { emoji = '🎉'; title = 'Μπράβο!'; msg = 'Ετοιμάζεις σκηνικά σαν αληθινός σκηνοθέτης!'; }
    else if (score >= 1) { emoji = '👍'; title = 'Ωραία!'; msg = 'Καλή προσπάθεια! Δοκίμασε ξανά!'; }
    else { emoji = '💪'; title = 'Καλή αρχή!'; msg = 'Κοίτα προσεκτικά τι θέλει ο σκηνοθέτης!'; }
    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultMsg').textContent = 'Βρήκες ' + score + ' από ' + total + ' σωστά! ' + msg;
  }

  startGame();
</script>
</body>
</html>
