<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Σύρε και ταίριαξε! ✋</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #e0f2f1, #b2dfdb, #80cbc4);
    padding: 12px; color: #333;
  }
  .app-container { max-width: 520px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 14px;
    background: linear-gradient(135deg, #00897b, #00695c);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(0,105,92,.35); margin-bottom: 16px;
  }
  .header h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .header p { font-size: 1rem; opacity: .9; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #00695c; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fff9db; border: 2px dashed #f0c040;
    border-radius: 16px; padding: 14px 16px; margin-bottom: 16px;
    font-size: 1.1rem; text-align: center; color: #6b5900; line-height: 1.5;
  }
  .drag-board {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 20px; margin-bottom: 16px;
    position: relative;
  }
  .drag-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr; grid-gap: 12px;
    margin-bottom: 12px;
  }
  .drag-item {
    background: #fff; border: 3px solid #b2dfdb;
    border-radius: 16px; padding: 16px 10px;
    text-align: center; font-size: 1rem; font-weight: 600;
    cursor: pointer; transition: all .2s;
    user-select: none; -webkit-tap-highlight-color: transparent;
    touch-action: none;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .drag-item .di-emoji { font-size: 2.2rem; }
  .drag-item.selected { border-color: #ff6f00; box-shadow: 0 0 0 3px rgba(255,111,0,.25); transform: scale(1.03); }
  .drag-item.placed { opacity: .4; border-color: #ccc; pointer-events: none; }
  .drop-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr; grid-gap: 12px;
  }
  .drop-zone {
    background: #e0f2f1; border: 3px dashed #80cbc4;
    border-radius: 16px; padding: 16px 10px;
    text-align: center; min-height: 80px;
    transition: all .2s;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  .drop-zone .dz-emoji { font-size: 2rem; }
  .drop-zone .dz-label { font-size: .85rem; font-weight: 600; color: #666; }
  .drop-zone.highlight { border-color: #43a047; background: #e8f5e9; }
  .drop-zone.filled { border-style: solid; border-color: #43a047; background: #e8f5e9; }
  .drop-zone.wrong { border-color: #e53935; background: #ffebee; animation: shake .35s ease; }
  @keyframes shake { 0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}60%{transform:translateX(5px)} }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.05rem; font-weight: 700; display: none; margin-top: 12px;
  }
  .feedback.show { display: block; }
  .feedback.true { background: #d4edda; color: #155724; }
  .feedback.false { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #00897b, #00695c);
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 36px; font-size: 1.2rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(0,105,92,.35);
    transition: transform .15s;
  }
  .btn-restart:active { transform: scale(.95); }
  @media (max-width:480px) {
    .header h1 { font-size: 1.2rem; }
    .drag-item .di-emoji { font-size: 1.8rem; }
    .drag-grid { grid-template-columns: 1fr 1fr; }
    .drop-grid { grid-template-columns: 1fr 1fr; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .drag-item > * + * { margin-top: 6px; }
  .drop-zone > * + * { margin-top: 4px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>✋ Σύρε και ταίριαξε!</h1>
    <p>Πάτησε ένα αντικείμενο και μετά τον στόχο του</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">Σετ 1/3</span>
  </div>
  <div class="instructions">
    👆 Πάτησε ένα αντικείμενο και μετά πάτησε το σημείο που ταιριάζει!
  </div>
  <div id="gameArea">
    <div class="drag-board">
      <div class="drag-grid" id="dragGrid"></div>
      <div class="drop-grid" id="dropGrid"></div>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🏆</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Ταίριαξες όλα τα ζευγάρια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var levels = [
    {
      items: [
        { emoji: '🐶', label: 'Σκύλος', target: 0 },
        { emoji: '🥛', label: 'Γάλα', target: 1 },
        { emoji: '🦴', label: 'Κόκκαλο', target: 0 }
      ],
      targets: [
        { emoji: '🐱', label: 'Γάτα' },
        { emoji: '🐶', label: 'Σκύλος' }
      ]
    },
    {
      items: [
        { emoji: '✏️', label: 'Μολύβι', target: 0 },
        { emoji: '📖', label: 'Βιβλίο', target: 1 },
        { emoji: '🎨', label: 'Χρώμα', target: 0 }
      ],
      targets: [
        { emoji: '📓', label: 'Τετράδιο' },
        { emoji: '🖍️', label: 'Ζωγραφιά' }
      ]
    },
    {
      items: [
        { emoji: '🧦', label: 'Κάλτσα', target: 0 },
        { emoji: '🍎', label: 'Μήλο', target: 1 },
        { emoji: '👟', label: 'Παπούτσι', target: 0 }
      ],
      targets: [
        { emoji: '👕', label: 'Ντουλάπα' },
        { emoji: '🧺', label: 'Καλάθι' }
      ]
    }
  ];

  var currentLevel = 0;
  var score = 0;
  var placed = 0;
  var totalItems = 0;
  var selectedItem = null;
  var dragItems = [];

  function shuffle(a) {
    for (var i = a.length-1; i > 0; i--) {
      var j = Math.floor(Math.random()*(i+1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function startGame() {
    currentLevel = 0; score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    loadLevel();
  }

  function loadLevel() {
    if (currentLevel >= levels.length) { showResult(); return; }
    var lv = levels[currentLevel];
    placed = 0;
    totalItems = lv.items.length;
    selectedItem = null;
    dragItems = [];
    document.getElementById('roundDisplay').textContent = 'Σετ ' + (currentLevel+1) + '/' + levels.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';

    var dg = document.getElementById('dragGrid');
    dg.innerHTML = '';
    var items = lv.items.slice();
    shuffle(items);
    for (var i = 0; i < items.length; i++) {
      var item = document.createElement('div');
      item.className = 'drag-item';
      item.setAttribute('data-idx', i);
      item.innerHTML = '<span class="di-emoji">' + items[i].emoji + '</span>' + items[i].label;
      item.addEventListener('click', function() { selectDrag(this); });
      dg.appendChild(item);
      dragItems.push(items[i]);
    }

    var dg2 = document.getElementById('dropGrid');
    dg2.innerHTML = '';
    var targets = lv.targets.slice();
    shuffle(targets);
    for (var i = 0; i < targets.length; i++) {
      var zone = document.createElement('div');
      zone.className = 'drop-zone';
      zone.setAttribute('data-tar', i);
      zone.innerHTML = '<span class="dz-emoji">' + targets[i].emoji + '</span><span class="dz-label">' + targets[i].label + '</span>';
      zone.addEventListener('click', function() { dropOn(this); });
      dg2.appendChild(zone);
    }
  }

  function selectDrag(el) {
    if (el.classList.contains('placed')) return;
    if (selectedItem) selectedItem.classList.remove('selected');
    selectedItem = el;
    el.classList.add('selected');
  }

  function dropOn(el) {
    if (!selectedItem) {
      var fb = document.getElementById('feedback');
      fb.className = 'feedback show false';
      fb.textContent = '👆 Πάτησε πρώτα ένα αντικείμενο!';
      setTimeout(function() { fb.style.display = 'none'; }, 800);
      return;
    }
    if (el.classList.contains('filled')) return;
    var lv = levels[currentLevel];
    var idx = parseInt(selectedItem.getAttribute('data-idx'));
    var item = dragItems[idx];
    var tarIdx = parseInt(el.getAttribute('data-tar'));
    if (item.target === tarIdx) {
      selectedItem.classList.add('placed');
      selectedItem.classList.remove('selected');
      el.classList.add('filled');
      var matchedItem = lv.items[idx];
      el.innerHTML = '<span style="font-size:1.6rem">' + matchedItem.emoji + '</span><span style="font-size:.85rem;font-weight:600">' + matchedItem.label + '</span>';
      el.style.fontSize = '0';
      placed++;
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      var fb = document.getElementById('feedback');
      fb.className = 'feedback show true';
      fb.textContent = '✅ Μπράβο! Το ' + item.label + ' σύρθηκε σωστά!';
      setTimeout(function() { fb.style.display = 'none'; }, 600);
      selectedItem = null;
      if (placed >= totalItems) {
        setTimeout(function() { currentLevel++; loadLevel(); }, 1000);
      }
    } else {
      el.classList.add('wrong');
      setTimeout(function() { el.classList.remove('wrong'); }, 400);
      var fb = document.getElementById('feedback');
      fb.className = 'feedback show false';
      fb.textContent = '❌ Το ' + item.label + ' δεν ταιριάζει εδώ! Δοκίμασε άλλο!';
      setTimeout(function() { fb.style.display = 'none'; }, 800);
    }
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var t = levels.length * 3;
    var e, ti, m;
    if (score === t) { e = '🏆'; ti = 'Τέλεια!'; m = 'Είσαι μάστορας στο σύρε και άφησε!' }
    else if (score >= t-2) { e = '🎉'; ti = 'Μπράβο!'; m = 'Τα πήγες πολύ καλά!' }
    else if (score >= t/2) { e = '👍'; ti = 'Ωραία!'; m = 'Δοκίμασε ξανά!' }
    else { e = '💪'; ti = 'Καλή αρχή!'; m = 'Πάτησε, κράτα και σύρε στον προορισμό!' }
    document.getElementById('resultEmoji').textContent = e;
    document.getElementById('resultTitle').textContent = ti;
    document.getElementById('resultMsg').textContent = 'Ταίριαξες ' + score + ' από ' + t + ' ζευγάρια! ' + m;
  }

  startGame();
</script>
</body>
</html>
