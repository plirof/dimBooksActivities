<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Είσοδος ή Έξοδος; 🖱️</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(17,153,142,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; }
  .header p { font-size: .95rem; opacity: .9; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #11998e; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fff9db; border: 2px dashed #f0c040; border-radius: 16px;
    padding: 14px 16px; margin-bottom: 14px; text-align: center;
    font-size: 1.05rem; line-height: 1.5; color: #6b5900;
  }
  .device-card {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 32px 20px; margin-bottom: 18px; text-align: center;
    min-height: 160px; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .device-emoji { font-size: 5rem; margin-bottom: 10px; }
  .device-name { font-size: 1.3rem; font-weight: 700; color: #2d3436; }
  .btn-group { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .btn-choice {
    border: none; border-radius: 20px; padding: 16px 24px;
    font-size: 1.1rem; font-weight: 700; cursor: pointer;
    transition: transform .15s; font-family: inherit;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,.12);
    user-select: none; -webkit-tap-highlight-color: transparent;
    flex: 1; justify-content: center; max-width: 200px;
  }
  .btn-input { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
  .btn-output { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
  .btn-choice:active { transform: scale(.95); }
  .btn-choice:disabled { opacity: .5; pointer-events: none; }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; margin: 14px 0; display: none;
  }
  .feedback.show { display: block; }
  .feedback.yay { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
  .feedback.nay { background: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #11998e, #38ef7d); color: #fff;
    border: none; border-radius: 16px; padding: 14px 36px;
    font-size: 1.2rem; font-weight: 700; cursor: pointer;
    font-family: inherit; box-shadow: 0 4px 14px rgba(17,153,142,.35);
  }
  .btn-restart:active { transform: scale(.95); }
  @media (max-width: 480px) {
    body { padding: 8px; }
    .header h1 { font-size: 1.2rem; }
    .device-emoji { font-size: 4rem; }
    .btn-choice { padding: 14px 18px; font-size: 1rem; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .btn-group > * { margin: 7px; }
  .btn-choice > * + * { margin-left: 8px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🖱️ Είσοδος ή Έξοδος;</h1>
    <p>Πού ανήκει η συσκευή;</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/8</span>
  </div>
  <div class="instructions">
    📥 <strong>Είσοδος</strong> = βάζω δεδομένα στον υπολογιστή<br>
    📤 <strong>Έξοδος</strong> = ο υπολογιστής βγάζει αποτέλεσμα
  </div>
  <div id="gameArea">
    <div class="device-card">
      <div class="device-emoji" id="deviceEmoji">⌨️</div>
      <div class="device-name" id="deviceName">Πληκτρολόγιο</div>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="btn-group">
      <button class="btn-choice btn-input" id="btnIn" onclick="answer('in')">📥 Είσοδος</button>
      <button class="btn-choice btn-output" id="btnOut" onclick="answer('out')">📤 Έξοδος</button>
    </div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg"></p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var items = [
    { emoji: '⌨️', name: 'Πληκτρολόγιο', type: 'in', tip: 'Γράφουμε γράμματα και αριθμούς!' },
    { emoji: '🖱️', name: 'Ποντίκι', type: 'in', tip: 'Κινούμε τον δείκτη στην οθόνη!' },
    { emoji: '🎤', name: 'Μικρόφωνο', type: 'in', tip: 'Βάζουμε ήχους και φωνή!' },
    { emoji: '📷', name: 'Κάμερα', type: 'in', tip: 'Βάζουμε εικόνες και βίντεο!' },
    { emoji: '🖨️', name: 'Εκτυπωτής', type: 'out', tip: 'Τυπώνει κείμενο και εικόνες στο χαρτί!' },
    { emoji: '🖥️', name: 'Οθόνη', type: 'out', tip: 'Βλέπουμε κείμενο και εικόνες!' },
    { emoji: '🔊', name: 'Ηχεία', type: 'out', tip: 'Ακούμε ήχους από τον υπολογιστή!' },
    { emoji: '🎧', name: 'Ακουστικά', type: 'out', tip: 'Ακούμε ήχους χωρίς να ενοχλούμε!' }
  ];
  var shuffled = [], cur = 0, score = 0;
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function startGame() {
    shuffled = shuffle(items.slice()); cur = 0; score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
    showItem();
  }
  function showItem() {
    if (cur >= shuffled.length) { showResult(); return; }
    var it = shuffled[cur];
    document.getElementById('deviceEmoji').textContent = it.emoji;
    document.getElementById('deviceName').textContent = it.name;
    document.getElementById('roundDisplay').textContent = (cur + 1) + '/' + shuffled.length;
    document.getElementById('btnIn').disabled = false; document.getElementById('btnOut').disabled = false;
    document.getElementById('feedback').className = 'feedback'; document.getElementById('feedback').style.display = 'none';
  }
  function answer(choice) {
    var it = shuffled[cur];
    var correct = (choice === it.type);
    document.getElementById('btnIn').disabled = true; document.getElementById('btnOut').disabled = true;
    var fb = document.getElementById('feedback');
    if (correct) {
      score++; document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      fb.className = 'feedback show yay';
      fb.textContent = '✅ Μπράβο! ' + it.tip;
    } else {
      fb.className = 'feedback show nay';
      var correctLabel = (it.type === 'in') ? 'Είσοδος' : 'Έξοδος';
      fb.textContent = '❌ Ωχ! Είναι συσκευή για ' + correctLabel + '! ' + it.tip;
    }
    setTimeout(function() { cur++; showItem(); }, 1800);
  }
  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var total = shuffled.length, pct = score / total;
    var emoji, title, msg;
    if (pct === 1) { emoji = '🏆'; title = 'Τέλεια!'; msg = 'Γνωρίζεις όλες τις συσκευές! Είσαι σούπερ!'; }
    else if (pct >= 0.75) { emoji = '🎉'; title = 'Μπράβο!'; msg = 'Τα πήγες πολύ καλά!'; }
    else if (pct >= 0.5) { emoji = '👍'; title = 'Ωραία!'; msg = 'Καλή προσπάθεια! Δοκίμασε ξανά!'; }
    else { emoji = '💪'; title = 'Καλή αρχή!'; msg = 'Προσπάθησε ξανά! Θα τα πας καλύτερα!'; }
    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultMsg').textContent = 'Βρήκες ' + score + ' από ' + total + ' σωστά! ' + msg;
  }
  startGame();
</script>
</body>
</html>
