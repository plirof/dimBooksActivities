<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Τι κάνει ο Φυλλομετρητής; 🔍</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(79,172,254,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; text-shadow: 1px 1px 2px rgba(0,0,0,.2); }
  .header p { font-size: .9rem; opacity: .95; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #4facfe; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fff9db; border: 2px dashed #f0c040; border-radius: 16px;
    padding: 14px; margin-bottom: 14px; text-align: center;
    font-size: 1rem; color: #6b5900;
  }
  .browser-layout {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 18px; margin-bottom: 18px;
  }
  .browser-bar {
    display: flex; align-items: center; gap: 6px;
    background: #f0f4ff; border-radius: 12px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .browser-dot { width: 10px; height: 10px; border-radius: 50%; }
  .browser-dot.red { background: #ff5f57; }
  .browser-dot.yellow { background: #ffbd2e; }
  .browser-dot.green { background: #28c840; }
  .browser-url {
    flex: 1; background: #fff; border-radius: 8px;
    padding: 6px 10px; font-size: .8rem; color: #636e72;
    text-align: center;
  }
  .browser-body {
    border: 3px solid #e0e0e0; border-radius: 12px;
    padding: 18px 14px; min-height: 100px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .highlight-area {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: #ffeaa7; border: 3px dashed #fdcb6e; border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px; width: 100%;
  }
  .hl-emoji { font-size: 2.5rem; }
  .hl-text { font-size: 1.1rem; font-weight: 700; color: #6b5900; }
  .task-text {
    font-size: 1.05rem; font-weight: 600; color: #2d3436;
    text-align: center; margin-bottom: 14px;
  }
  .choices-grid { display: grid; grid-template-columns: 1fr; grid-gap: 10px; margin-bottom: 14px; }
  .choice-card {
    background: #fff; border: 3px solid #e0e0e0; border-radius: 16px;
    padding: 14px 16px; text-align: left; cursor: pointer;
    transition: all .2s ease; user-select: none; -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; gap: 12px;
  }
  .choice-card:active { transform: scale(.98); }
  .choice-card .ch-emoji { font-size: 1.8rem; flex-shrink: 0; }
  .choice-card .ch-text { font-size: .95rem; font-weight: 600; color: #2d3436; }
  .choice-card.correct { border-color: #28a745; background: #d4edda; animation: pop .4s ease; }
  .choice-card.wrong { border-color: #dc3545; background: #f8d7da; animation: shake .4s ease; }
  .choice-card.disabled { pointer-events: none; opacity: .7; }
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .feedback{text-align:center;padding:14px;border-radius:16px;font-size:1.1rem;font-weight:700;margin-bottom:12px;display:none}
  .feedback.show{display:block}
  .feedback.yay{background:#d4edda;color:#155724}
  .feedback.nay{background:#f8d7da;color:#721c24}
  .result-screen{background:#fff;border-radius:24px;box-shadow:0 8px 28px rgba(0,0,0,.1);padding:40px 24px;text-align:center;display:none}
  .result-screen .big-emoji{font-size:5rem;margin-bottom:12px}
  .result-screen h2{font-size:1.6rem;color:#2d3436;margin-bottom:8px}
  .result-screen p{font-size:1.1rem;color:#666;margin-bottom:20px}
  .btn-restart{background:linear-gradient(135deg,#4facfe,#00f2fe);color:#fff;border:none;border-radius:16px;padding:14px 36px;font-size:1.2rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(79,172,254,.35)}
  .btn-restart:active{transform:scale(.95)}
  @media(max-width:480px){body{padding:8px}.header h1{font-size:1.2rem}.hl-emoji{font-size:2rem}}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .browser-bar > * + * { margin-left: 6px; }
  .highlight-area > * + * { margin-left: 6px; }
  .choice-card > * + * { margin-left: 12px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🔍 Τι κάνει ο Φυλλομετρητής;</h1>
    <p>Βρες ποιο μέρος ταιριάζει!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/6</span>
  </div>
  <div class="instructions">
    📖 Κοίτα την εικόνα του φυλλομετρητή!<br>
    Ποιο μέρος κάνει αυτή τη δουλειά;
  </div>
  <div id="gameArea">
    <div class="browser-layout">
      <div class="browser-bar">
        <span class="browser-dot red"></span>
        <span class="browser-dot yellow"></span>
        <span class="browser-dot green"></span>
        <span class="browser-url" id="browserUrl">ιστοσελίδα</span>
      </div>
      <div class="browser-body">
        <div class="highlight-area" id="highlightArea">
          <span class="hl-emoji" id="hlEmoji">🔗</span>
          <span class="hl-text" id="hlText">Γράφω τη διεύθυνση της σελίδας</span>
        </div>
        <div class="task-text">Ποιο μέρος του φυλλομετρητή κάνει αυτή τη δουλειά;</div>
      </div>
    </div>
    <div class="choices-grid" id="choicesGrid"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg"></p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var qs = [
    {desc:'Γράφω τη διεύθυνση της σελίδας', descEmoji:'🔗', ans:0,
      choices:[{emoji:'🔗',text:'Γραμμή Διεύθυνσης'},{emoji:'📑',text:'Καρτέλα'},{emoji:'🔄',text:'Ανανέωση'}]},
    {desc:'Δείχνει το όνομα της σελίδας', descEmoji:'📑', ans:1,
      choices:[{emoji:'🔙',text:'Κουμπί Πίσω'},{emoji:'📑',text:'Καρτέλα'},{emoji:'⭐',text:'Σελιδοδείκτης'}]},
    {desc:'Πάει στην προηγούμενη σελίδα', descEmoji:'🔙', ans:0,
      choices:[{emoji:'🔙',text:'Κουμπί Πίσω'},{emoji:'❌',text:'Κλείσιμο'},{emoji:'📑',text:'Καρτέλα'}]},
    {desc:'Φορτώνει ξανά τη σελίδα', descEmoji:'🔄', ans:2,
      choices:[{emoji:'⭐',text:'Σελιδοδείκτης'},{emoji:'🔗',text:'Γραμμή Διεύθυνσης'},{emoji:'🔄',text:'Ανανέωση'}]},
    {desc:'Αποθηκεύει αγαπημένες σελίδες', descEmoji:'⭐', ans:1,
      choices:[{emoji:'📑',text:'Καρτέλα'},{emoji:'⭐',text:'Σελιδοδείκτης'},{emoji:'🔙',text:'Κουμπί Πίσω'}]},
    {desc:'Κλείνει τον φυλλομετρητή', descEmoji:'❌', ans:0,
      choices:[{emoji:'❌',text:'Κλείσιμο'},{emoji:'🔄',text:'Ανανέωση'},{emoji:'🔗',text:'Γραμμή Διεύθυνσης'}]}
  ];
  var cur=0,score=0;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function startGame(){
    shuffle(qs);cur=0;score=0;
    document.getElementById('scoreDisplay').textContent='⭐ 0';
    document.getElementById('gameArea').style.display='block';
    document.getElementById('resultScreen').style.display='none';
    showQ();
  }
  function showQ(){
    if(cur>=qs.length){showResult();return;}
    var q=qs[cur];
    document.getElementById('hlEmoji').textContent=q.descEmoji;
    document.getElementById('hlText').textContent=q.desc;
    document.getElementById('roundDisplay').textContent=(cur+1)+'/'+qs.length;
    document.getElementById('feedback').className='feedback';document.getElementById('feedback').style.display='none';
    var g=document.getElementById('choicesGrid');g.innerHTML='';
    for(var i=0;i<q.choices.length;i++){
      (function(idx){
        var c=document.createElement('div');c.className='choice-card';
        c.innerHTML='<span class="ch-emoji">'+q.choices[idx].emoji+'</span><span class="ch-text">'+q.choices[idx].text+'</span>';
        c.addEventListener('click',function(){choose(this,q);});
        g.appendChild(c);
      })(i);
    }
  }
  function choose(el,q){
    var cards=document.querySelectorAll('.choice-card');
    for(var i=0;i<cards.length;i++)cards[i].classList.add('disabled');
    var chosen=Array.from(cards).indexOf(el);
    var correct=(chosen===q.ans);
    var fb=document.getElementById('feedback');
    if(correct){score++;document.getElementById('scoreDisplay').textContent='⭐ '+score;el.classList.add('correct');fb.className='feedback show yay';fb.textContent='✅ Μπράβο! Σωστό μέρος!';}
    else{el.classList.add('wrong');cards[q.ans].classList.add('correct');fb.className='feedback show nay';fb.textContent='❌ Αυτή τη δουλειά την κάνει: '+q.choices[q.ans].text;}
    setTimeout(function(){cur++;showQ();},1800);
  }
  function showResult(){
    document.getElementById('gameArea').style.display='none';
    document.getElementById('resultScreen').style.display='block';
    var total=qs.length,pct=score/total;
    var e,t,m;
    if(pct===1){e='🏆';t='Τέλεια!';m='Γνωρίζεις όλες τις λειτουργίες του φυλλομετρητή! Είσαι σούπερ!';}
    else if(pct>=0.75){e='🎉';t='Μπράβο!';m='Τα πήγες πολύ καλά!';}
    else if(pct>=0.5){e='👍';t='Ωραία!';m='Καλή προσπάθεια!';}
    else{e='💪';t='Καλή αρχή!';m='Προσπάθησε ξανά!';}
    document.getElementById('resultEmoji').textContent=e;
    document.getElementById('resultTitle').textContent=t;
    document.getElementById('resultMsg').textContent='Βρήκες '+score+' από '+total+' σωστά! '+m;
  }
  startGame();
</script>
</body>
</html>
