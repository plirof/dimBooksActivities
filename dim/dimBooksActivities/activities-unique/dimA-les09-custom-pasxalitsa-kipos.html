<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Προγραμμάτισε την Πασχαλίτσα 🐞</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #fddb92 0%, #d1fdff 100%);
    padding: 12px; color: #333;
  }
  .app-container { max-width: 520px; margin: 0 auto; }
  .header {
    text-align: center; padding: 16px 14px 10px;
    background: linear-gradient(135deg, #f5576c, #ff6f91);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(245,87,108,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.25rem; margin-bottom: 2px; }
  .header p { font-size: .95rem; opacity: .95; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 8px 16px;
    margin-bottom: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.1rem; font-weight: 700; color: #f5576c; }
  .round { font-size: .9rem; color: #888; }
  .hint {
    text-align: center; font-size: .9rem; font-weight: 700; color: #b71c1c;
    background: #fff; border-radius: 14px; padding: 8px 12px;
    margin-bottom: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .grid-wrap { display: flex; justify-content: center; margin-bottom: 12px; }
  .grid {
    display: inline-grid;
    grid-gap: 4px;
    background: #2e7d32;
    padding: 5px;
    border-radius: 10px;
  }
  .cell {
    width: 52px; height: 52px;
    background: #e8f5e9;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    position: relative;
    user-select: none; -webkit-user-select: none;
    transition: background .2s;
  }
  .cell.flowercell { background: #f8bbd0; }
  .cell.startcell { background: #fff9c4; }
  .bugwrap {
    position: relative;
    display: inline-block;
    transition: transform .4s;
  }
  .bugwrap .nose {
    position: absolute; top: -9px; left: 50%;
    margin-left: -6px;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 10px solid #d63031;
  }
  @media (max-width: 440px) {
    .cell { width: 42px; height: 42px; font-size: 1.2rem; }
  }
  .program-area {
    background: #fff; border-radius: 16px;
    padding: 10px; margin-bottom: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
  }
  .program-area h3 {
    font-size: .95rem; color: #666; margin-bottom: 6px; text-align: center;
  }
  .command-slots {
    display: flex; flex-wrap: wrap; justify-content: center;
    background: #f5f5f5; border-radius: 10px; padding: 6px 4px;
  }
  .slot {
    width: 42px; height: 42px;
    border: 2px dashed #bbb; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; cursor: pointer;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: all .2s;
    margin: 3px;
    background: #fff;
  }
  .slot.filled { border-style: solid; border-color: #f5576c; background: #ffe3e3; }
  .slot.active-slot { border-color: #ff9800; background: #fff3e0; transform: scale(1.12); }
  .palette-label {
    text-align: center; font-size: .85rem; font-weight: 700; color: #666;
    margin-bottom: 4px;
  }
  .palette {
    display: flex; justify-content: center; flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .pal-btn {
    width: 72px; padding: 6px 2px;
    border: 3px solid #f5576c; border-radius: 12px;
    background: #fff; cursor: pointer;
    text-align: center;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .15s;
    margin: 4px;
  }
  .pal-btn:active { transform: scale(.9); }
  .pal-btn .p-icon { font-size: 1.5rem; display: block; }
  .pal-btn .p-label { font-size: .68rem; font-weight: 700; color: #444; display: block; }
  .action-buttons {
    display: flex; justify-content: center; margin-bottom: 12px;
  }
  .btn-action {
    border: none; border-radius: 14px; padding: 10px 24px;
    font-size: 1rem; font-weight: 700; cursor: pointer;
    font-family: inherit; transition: transform .15s;
    box-shadow: 0 4px 10px rgba(0,0,0,.1);
    margin: 0 6px;
  }
  .btn-action:active { transform: scale(.95); }
  .btn-action:disabled { opacity: .4; cursor: default; transform: none; }
  .btn-clear { background: #ffcdd2; color: #c62828; }
  .btn-go { background: linear-gradient(135deg, #43e97b, #38f9d7); color: #fff; }
  .feedback {
    text-align: center; padding: 12px; border-radius: 14px;
    font-size: 1rem; font-weight: 700; margin-bottom: 10px; display: none;
  }
  .feedback.correct { display: block; background: #d4edda; color: #155724; }
  .feedback.wrong { display: block; background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1); padding: 40px 24px;
    text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #f5576c, #ff6f91);
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 36px; font-size: 1.2rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(245,87,108,.35);
    transition: transform .15s;
  }
  .btn-restart:hover { transform: scale(1.05); }
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🐞 Προγραμμάτισε την Πασχαλίτσα</h1>
    <p>Δώσε της εντολές για να φτάσει στο λουλούδι!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/4</span>
  </div>
  <div id="gameArea">
    <div class="hint">⚠️ Στρίψε = η πασχαλίτσα γυρνάει στη θέση της, ΔΕΝ κάνει βήμα!</div>
    <div class="grid-wrap"><div class="grid" id="grid"></div></div>
    <div class="program-area">
      <h3>📋 Το πρόγραμμα της πασχαλίτσας</h3>
      <div class="command-slots" id="commandSlots"></div>
    </div>
    <div class="palette-label">Οι εντολές που καταλαβαίνει το ρομπότ:</div>
    <div class="palette">
      <button class="pal-btn" onclick="addCommand('f')"><span class="p-icon">⬆️</span><span class="p-label">Μπροστά</span></button>
      <button class="pal-btn" onclick="addCommand('b')"><span class="p-icon">⬇️</span><span class="p-label">Πίσω</span></button>
      <button class="pal-btn" onclick="addCommand('tl')"><span class="p-icon">↩️</span><span class="p-label">Αριστερά</span></button>
      <button class="pal-btn" onclick="addCommand('tr')"><span class="p-icon">↪️</span><span class="p-label">Δεξιά</span></button>
    </div>
    <div class="action-buttons">
      <button class="btn-action btn-clear" onclick="clearCommands()">🗑️ Καθαρισμός</button>
      <button class="btn-action btn-go" id="btnGo" onclick="runProgram()">▶️ Τρέξε!</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var CMD_ICON = { f: '⬆️', b: '⬇️', tl: '↩️', tr: '↪️' };
  var VEC = [
    [-1, 0],
    [0, 1],
    [1, 0],
    [0, -1]
  ];
  var DEG = [0, 90, 180, 270];
  var levels = [
    { start: [3, 0], ori: 0, flower: [0, 0] },
    { start: [3, 0], ori: 0, flower: [3, 2] },
    { start: [0, 0], ori: 1, flower: [2, 2] },
    { start: [3, 3], ori: 3, flower: [0, 0] }
  ];
  var ROWS = 4, COLS = 4;
  var MAX_SLOTS = 7;
  var STEP_MS = 550;

  var currentLevel = 0, score = 0, running = false;
  var commands = [];

  function startGame() {
    currentLevel = 0; score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    loadLevel();
  }

  function loadLevel() {
    if (currentLevel >= levels.length) { showResult(); return; }
    running = false;
    commands = [];
    document.getElementById('roundDisplay').textContent = (currentLevel + 1) + '/' + levels.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
    renderGrid();
    renderSlots();
    setButtons(true);
  }

  function renderGrid() {
    var lv = levels[currentLevel];
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = 'repeat(' + COLS + ', 52px)';
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var cell = document.createElement('div');
        cell.className = 'cell';
        cell.setAttribute('data-r', r);
        cell.setAttribute('data-c', c);
        if (r === lv.flower[0] && c === lv.flower[1]) {
          cell.classList.add('flowercell');
          cell.textContent = '🌸';
        } else if (r === lv.start[0] && c === lv.start[1]) {
          cell.classList.add('startcell');
        }
        grid.appendChild(cell);
      }
    }
    placeBug(lv.start[0], lv.start[1], lv.ori);
  }

  function cellAt(r, c) {
    var cells = document.querySelectorAll('.cell');
    for (var i = 0; i < cells.length; i++) {
      if (parseInt(cells[i].getAttribute('data-r')) === r &&
          parseInt(cells[i].getAttribute('data-c')) === c) return cells[i];
    }
    return null;
  }

  function placeBug(r, c, ori) {
    var cell = cellAt(r, c);
    var wrap = document.createElement('span');
    wrap.className = 'bugwrap';
    wrap.id = 'theBug';
    wrap.innerHTML = '<span class="nose"></span>🐞';
    wrap.style.transform = 'rotate(' + DEG[ori] + 'deg)';
    cell.appendChild(wrap);
  }

  function getBug() {
    return document.getElementById('theBug');
  }

  function moveBug(nr, nc, ori) {
    var bug = getBug();
    var parent = bug.parentNode;
    parent.removeChild(bug);
    bug.style.transform = 'rotate(' + DEG[ori] + 'deg)';
    cellAt(nr, nc).appendChild(bug);
  }

  function rotateBug(ori) {
    var bug = getBug();
    bug.style.transform = 'rotate(' + DEG[ori] + 'deg)';
  }

  function renderSlots() {
    var area = document.getElementById('commandSlots');
    area.innerHTML = '';
    for (var i = 0; i < MAX_SLOTS; i++) {
      (function(idx) {
        var slot = document.createElement('div');
        slot.className = 'slot';
        if (i < commands.length) {
          slot.textContent = CMD_ICON[commands[idx]];
          slot.classList.add('filled');
          slot.onclick = function() {
            if (running) return;
            commands.splice(idx, 1);
            renderSlots();
          };
        }
        area.appendChild(slot);
      })(i);
    }
  }

  function addCommand(cmd) {
    if (running) return;
    if (commands.length >= MAX_SLOTS) {
      setFeedback('wrong', 'Το πρόγραμμα είναι γεμάτο! Πάτα ένα βέλος για να το βγάλεις.');
      return;
    }
    commands.push(cmd);
    renderSlots();
  }

  function clearCommands() {
    if (running) return;
    commands = [];
    renderSlots();
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
  }

  function setButtons(enabled) {
    var btns = document.querySelectorAll('.pal-btn, #btnGo, .btn-clear');
    for (var i = 0; i < btns.length; i++) btns[i].disabled = !enabled;
  }

  function setFeedback(type, text) {
    var fb = document.getElementById('feedback');
    fb.className = 'feedback ' + type;
    fb.style.display = '';
    fb.textContent = text;
  }

  function resetBug() {
    var lv = levels[currentLevel];
    var bug = getBug();
    if (bug) bug.parentNode.removeChild(bug);
    placeBug(lv.start[0], lv.start[1], lv.ori);
  }

  function runProgram() {
    if (running) return;
    if (commands.length === 0) {
      setFeedback('wrong', 'Δώσε πρώτα μερικές εντολές στην πασχαλίτσα!');
      return;
    }
    running = true;
    setButtons(false);
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';

    var lv = levels[currentLevel];
    resetBug();
    var pos = { r: lv.start[0], c: lv.start[1] };
    var ori = lv.ori;
    var i = 0;
    var bumped = false;

    var timer = setInterval(function() {
      if (i > 0) {
        var prevSlots = document.querySelectorAll('.slot');
        if (prevSlots[i-1]) prevSlots[i-1].classList.remove('active-slot');
      }
      if (i >= commands.length) {
        clearInterval(timer);
        setTimeout(function() { finish(pos); }, 350);
        return;
      }
      var slotEl = document.querySelectorAll('.slot')[i];
      if (slotEl) slotEl.classList.add('active-slot');

      var cmd = commands[i];
      if (cmd === 'tl') {
        ori = (ori + 3) % 4;
        rotateBug(ori);
      } else if (cmd === 'tr') {
        ori = (ori + 1) % 4;
        rotateBug(ori);
      } else {
        var v = VEC[ori];
        var dr = v[0], dc = v[1];
        if (cmd === 'b') { dr = -dr; dc = -dc; }
        var nr = pos.r + dr, nc = pos.c + dc;
        if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) {
          bumped = true;
          clearInterval(timer);
          var slots2 = document.querySelectorAll('.slot');
          for (var s = 0; s < slots2.length; s++) slots2[s].classList.remove('active-slot');
          setFeedback('wrong', '💥 Ωχ! Χτύπησε τον φράχτη του κήπου! Σκέψου ξανά τις εντολές.');
          endRun();
          return;
        }
        pos = { r: nr, c: nc };
        moveBug(nr, nc, ori);
      }
      i++;
    }, STEP_MS);

    function finish(finalPos) {
      var slots3 = document.querySelectorAll('.slot');
      for (var s2 = 0; s2 < slots3.length; s2++) slots3[s2].classList.remove('active-slot');
      if (finalPos.r === lv.flower[0] && finalPos.c === lv.flower[1]) {
        var fc = cellAt(lv.flower[0], lv.flower[1]);
        fc.textContent = '🐞🌸';
        score++;
        document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
        setFeedback('correct', '✅ Μπράβο! Η πασχαλίτσα έφτασε στο λουλούδι!');
        setTimeout(function() {
          currentLevel++;
          loadLevel();
        }, 2000);
      } else {
        setFeedback('wrong', '❌ Δεν έφτασε στο 🌸! Βάλε κι άλλες εντολές ή άλλη σειρά.');
        endRun();
      }
    }

    function endRun() {
      setTimeout(function() {
        running = false;
        setButtons(true);
        resetBug();
      }, 1300);
    }
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var total = levels.length;
    var emoji, title, msg;
    if (score === total) { emoji = '🏆'; title = 'Τέλεια!'; msg = 'Προγραμματίζεις ρομπότ σαν επαγγελματίας!'; }
    else if (score >= 3) { emoji = '🎉'; title = 'Μπράβο!'; msg = 'Ξέρεις τις εντολές του ρομπότ!'; }
    else if (score >= 2) { emoji = '👍'; title = 'Ωραία!'; msg = 'Καλή προσπάθεια! Δοκίμασε ξανά!'; }
    else { emoji = '💪'; title = 'Καλή αρχή!'; msg = 'Η στροφή γυρνάει τη πασχαλίτσα, δεν την προχωράει!'; }
    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultMsg').textContent = 'Βρήκες ' + score + ' από ' + total + ' σωστά! ' + msg;
  }

  startGame();
</script>
</body>
</html>
