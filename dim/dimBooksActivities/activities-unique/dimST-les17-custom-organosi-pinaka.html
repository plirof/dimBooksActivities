<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Οργάνωση Πίνακα | Μάθημα 17</title>
<style>
@font-face{font-family:'EmojiFont';src:local('Noto Color Emoji'),local('Segoe UI Emoji'),local('Apple Color Emoji'),local('Twemoji Mozilla'),url('../fonts/NotoColorEmoji.ttf') format('truetype');unicode-range:U+200D,U+2190-21FF,U+2300-23FF,U+25A0-25FF,U+2600-27BF,U+2900-297F,U+2B00-2BFF,U+FE0F,U+1F000-1FFFF;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e293b);padding:10px;display:flex;flex-direction:column;align-items:center}
h1{color:#e0e7ff;font-size:1.1rem;text-align:center;margin:4px 0 2px}
.subtitle{color:#94a3b8;font-size:.72rem;text-align:center;margin-bottom:8px}
.main{max-width:750px;width:100%}
.score-bar{display:flex;gap:8px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.sc{background:#1e293b;border-radius:8px;padding:4px 10px;color:#fbbf24;font-size:.75rem;font-weight:700;border:1px solid #334155}
.sc .sl{color:#64748b}
.card{background:#0f172a;border-radius:16px;border:2px solid #334155;padding:14px;margin-bottom:10px}
.card-title{color:#fbbf24;font-size:.8rem;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.task-desc{background:#1e293b;border-radius:10px;padding:10px;margin-bottom:10px;border-left:3px solid #6366f1;font-size:.7rem;color:#e2e8f0;line-height:1.4}
.spreadsheet{border-radius:10px;border:2px solid #334155;overflow:hidden;margin-bottom:8px;overflow-x:auto}
.spreadsheet table{width:100%;border-collapse:collapse;font-size:.68rem;min-width:400px}
.spreadsheet th{background:#1e293b;padding:6px 8px;border:1px solid #334155;font-weight:700;color:#fbbf24;text-align:center;cursor:pointer;transition:background .2s}
.spreadsheet th:hover{background:#334155}
.spreadsheet td{padding:5px 8px;border:1px solid #1e293b;color:#e2e8f0;text-align:center}
.spreadsheet td.editable{background:#0f172a;cursor:pointer;transition:all .2s}
.spreadsheet td.editable:hover{background:#1e1b4b}
.spreadsheet td.editing{background:#1e1b4b;border-color:#6366f1}
.spreadsheet td.correct{background:#22c55e11;color:#4ade80}
.spreadsheet td.wrong{background:#ef444422;color:#f87171}
.spreadsheet td.highlight{background:#6366f111;border-color:#6366f1}
.sheet-controls{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;padding:6px;background:#0f172a;border-top:1px solid #334155}
.sheet-btn{padding:4px 10px;border:none;border-radius:6px;font-size:.6rem;font-weight:600;cursor:pointer;background:#334155;color:#94a3b8;transition:all .2s}
.sheet-btn:hover{background:#475569;color:#e2e8f0}
.sheet-btn.active{background:#6366f1;color:#fff}
.chart-mini{display:flex;align-items:flex-end;justify-content:space-around;height:60px;padding:4px 0;gap:2px;background:#0f172a;border-radius:8px;margin-top:6px}
.chart-mini .cm-bar{width:100%;border-radius:2px 2px 0 0;min-height:4px;transition:height .5s}
.nav-btns{display:flex;gap:6px;justify-content:center;margin-top:6px}
.nav-btn{padding:6px 14px;border:none;border-radius:8px;font-size:.72rem;font-weight:700;cursor:pointer;transition:all .2s}
.nav-btn:hover{transform:translateY(-1px)}
.nav-prev{background:#334155;color:#e2e8f0}
.nav-next{background:#6366f1;color:#fff}
.btn-check{padding:8px 20px;border:none;border-radius:10px;background:linear-gradient(135deg,#22c55e,#4ade80);color:#064e3b;font-size:.75rem;font-weight:700;cursor:pointer;margin-top:4px}
.btn-check:disabled{opacity:.4;cursor:default}
.feedback{text-align:center;font-size:.8rem;font-weight:700;min-height:20px;margin-top:4px}
.feedback.ok{color:#4ade80}
.feedback.fail{color:#f87171}
.hint-box{font-size:.65rem;color:#64748b;background:#0f172a;border-radius:8px;padding:8px;line-height:1.4;margin-top:6px}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .score-bar > * { margin: 4px; }
  .card-title > * + * { margin-left: 6px; }
  .sheet-controls > * { margin: 2px; }
  .chart-mini > * + * { margin-left: 2px; }
  .nav-btns > * + * { margin-left: 6px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<h1>📋 Οργάνωση Δεδομένων σε Πίνακα</h1>
<p class="subtitle">Τοποθέτησε σωστά τα δεδομένα στον πίνακα και δημιούργησε διάγραμμα!</p>
<div class="score-bar">
<span class="sc"><span class="sl">Πόντοι:</span> <span id="pts">0</span></span>
<span class="sc"><span class="sl">Άσκηση:</span> <span id="exNum">1</span>/6</span>
</div>
<div class="main" id="main"></div>
<div class="feedback" id="feedback"></div>
<script>
var exercises=[
{
title:'⚽ Αγαπημένο Άθλημα',
desc:'Τοποθέτησε τα δεδομένα της έρευνας στον πίνακα. Μετά πάτα "Δημιουργία Διαγράμματος".',
headers:['Άθλημα','Πλήθος'],
rows:[['Ποδόσφαιρο','8'],['Μπάσκετ','5'],['Βόλεϊ','3'],['Κολύμβηση','4']],
dataRow:1,
color:'#22c55e',
hint:'Ο τίτλος της στήλης Α είναι η ερώτηση (π.χ. "Άθλημα") και της στήλης Β το "Πλήθος".'
},
{
title:'🎵 Αγαπημένη Μουσική',
desc:'Οργάνωσε τα δεδομένα προτίμησης μουσικής σε πίνακα δύο στηλών.',
headers:['Είδος','Πλήθος'],
rows:[['Pop','7'],['Rock','4'],['Κλασική','2'],['Ελληνική','6']],
dataRow:1,
color:'#ec4899',
hint:'Κάθε γραμμή έχει το είδος μουσικής και πόσα παιδιά το προτιμούν.'
},
{
title:'📚 Χρόνος Διαβάσματος',
desc:'Βάλε τα δεδομένα χρόνου διαβάσματος σε σωστή σειρά (από λίγο προς πολύ).',
headers:['Χρόνος','Πλήθος'],
rows:[['Καθόλου','2'],['30 λεπτά','6'],['1 ώρα','8'],['2+ ώρες','4']],
dataRow:1,
color:'#f59e0b',
hint:'Ο πίνακας οργανώνεται με σειρά από τη μικρότερη προς τη μεγαλύτερη τιμή.'
},
{
title:'🍕 Φαγητό για Πάρτι',
desc:'Κατέγραψε στον πίνακα τα δεδομένα προτίμησης φαγητού.',
headers:['Φαγητό','Πλήθος'],
rows:[['Πίτσα','9'],['Σουβλάκι','6'],['Μακαρόνια','3'],['Αλλεπάλληλες','2']],
dataRow:1,
color:'#ef4444',
hint:'Ο πίνακας έχει δύο στήλες: μία για την κατηγορία και μία για το πλήθος.'
},
{
title:'🎮 Χρόνος σε Παιχνίδια',
desc:'Τοποθέτησε σωστά τα δεδομένα χρόνου σε παιχνίδια.',
headers:['Χρόνος','Πλήθος'],
rows:[['Καθόλου','1'],['Έως 1 ώρα','5'],['1-3 ώρες','9'],['3+ ώρες','5']],
dataRow:1,
color:'#3b82f6',
hint:'Πρόσεξε τη σειρά: από τον λιγότερο προς τον περισσότερο χρόνο.'
},
{
title:'🐾 Κατοικίδια',
desc:'Οργάνωσε τα δεδομένα κατοικίδιων σε πίνακα.',
headers:['Κατοικίδιο','Πλήθος'],
rows:[['Σκύλο','7'],['Γάτα','4'],['Άλλο','3'],['Δεν έχω','6']],
dataRow:1,
color:'#8b5cf6',
hint:'Συμπλήρωσε όλα τα κελιά του πίνακα για να δεις το διάγραμμα.'
}
];
var current=0;
var pts=0;
var cellValues={};
var editingCell=null;
var checked=false;
function render(){
var ex=exercises[current];
checked=false;
cellValues={};
editingCell=null;
document.getElementById('exNum').textContent=current+1;
var main=document.getElementById('main');
var h='';
h+='<div class="card">';
h+='<div class="card-title">'+ex.title+'</div>';
h+='<div class="task-desc">📋 '+ex.desc+'</div>';
h+='<div class="spreadsheet">';
h+='<table><thead><tr>';
for(var hd=0;hd<ex.headers.length;hd++){
h+='<th>'+ex.headers[hd]+'</th>';
}
h+='</tr></thead><tbody>';
for(var r=0;r<ex.rows.length;r++){
h+='<tr>';
for(var c=0;c<ex.rows[r].length;c++){
var cellId=r+'_'+c;
var val=cellValues[cellId]!==undefined?cellValues[cellId]:'';
var cls='editable';
h+='<td class="'+cls+'" id="cell_'+cellId+'">'+val+'</td>';
}
h+='</tr>';
}
h+='</tbody></table>';
h+='<div class="sheet-controls">';
h+='<button class="sheet-btn" onclick="pasteValue(\''+ex.rows[0][0]+'\',0,0)">📋 Επικόλληση: '+ex.rows[0][0]+'</button>';
h+='<button class="sheet-btn" onclick="pasteValue(\''+ex.rows[0][1]+'\',0,1)">📋 Επικόλληση: '+ex.rows[0][1]+'</button>';
h+='<button class="sheet-btn" onclick="pasteValue(\''+ex.rows[1][0]+'\',1,0)">📋 Επικόλληση: '+ex.rows[1][0]+'</button>';
h+='<button class="sheet-btn" onclick="pasteValue(\''+ex.rows[1][1]+'\',1,1)">📋 Επικόλληση: '+ex.rows[1][1]+'</button>';
h+='<button class="sheet-btn" onclick="pasteValue(\''+ex.rows[2][0]+'\',2,0)">📋 Επικόλληση: '+ex.rows[2][0]+'</button>';
h+='<button class="sheet-btn" onclick="pasteValue(\''+ex.rows[2][1]+'\',2,1)">📋 Επικόλληση: '+ex.rows[2][1]+'</button>';
h+='<button class="sheet-btn" onclick="pasteValue(\''+ex.rows[3][0]+'\',3,0)">📋 Επικόλληση: '+ex.rows[3][0]+'</button>';
h+='<button class="sheet-btn" onclick="pasteValue(\''+ex.rows[3][1]+'\',3,1)">📋 Επικόλληση: '+ex.rows[3][1]+'</button>';
h+='</div>';
h+='</div>';
h+='<div class="chart-mini" id="miniChart"></div>';
h+='<div style="text-align:center;margin-top:6px"><button class="btn-check" id="checkBtn" onclick="checkTable()">✅ Έλεγχος Πίνακα</button></div>';
h+='<div class="hint-box">💡 '+ex.hint+'</div>';
h+='</div>';
h+=navButtons();
main.innerHTML=h;
updateMiniChart();
}
function navButtons(){
var h='<div class="nav-btns">';
h+='<button class="nav-btn nav-prev" onclick="prevEx()"'+(current===0?' disabled':'')+'>◀ Προηγούμενο</button>';
h+='<button class="nav-btn nav-next" onclick="nextEx()"'+(current===exercises.length-1?' disabled':'')+'>Επόμενο ▶</button>';
h+='</div>';
return h;
}
function pasteValue(val,r,c){
if(checked)return;
var cellId=r+'_'+c;
cellValues[cellId]=val;
var el=document.getElementById('cell_'+cellId);
if(el){
el.textContent=val;
el.classList.add('editing');
}
updateMiniChart();
var fb=document.getElementById('feedback');
if(fb){fb.textContent='';fb.className='feedback';}
}
function updateMiniChart(){
var ex=exercises[current];
var allFilled=true;
var vals=[];
for(var r=0;r<ex.rows.length;r++){
var v=cellValues[r+'_'+1];
if(v===undefined||v===''){allFilled=false;vals.push(0);}
else{vals.push(parseInt(v)||0);}
}
var chart=document.getElementById('miniChart');
if(!chart)return;
if(!allFilled){
chart.innerHTML='<span style="color:#475569;font-size:.6rem;width:100%;text-align:center">📊 Συμπλήρωσε τον πίνακα για να δεις το διάγραμμα</span>';
return;
}
var maxVal=Math.max.apply(null,vals);
var h='';
for(var i=0;i<vals.length;i++){
var pct=Math.max(4,(vals[i]/maxVal)*100);
h+='<div class="cm-bar" style="height:'+pct+'px;background:'+ex.color+'"></div>';
}
chart.innerHTML=h;
}
function checkTable(){
var ex=exercises[current];
var allFilled=true;
for(var r=0;r<ex.rows.length;r++){
for(var c=0;c<ex.rows[r].length;c++){
var v=cellValues[r+'_'+c];
if(v===undefined||v===''){allFilled=false;break;}
}
if(!allFilled)break;
}
if(!allFilled){
var fb=document.getElementById('feedback');
fb.textContent='⚠️ Συμπλήρωσε όλα τα κελιά του πίνακα!';
fb.className='feedback fail';
return;
}
var allCorrect=true;
for(var r2=0;r2<ex.rows.length;r2++){
for(var c2=0;c2<ex.rows[r2].length;c2++){
var val=cellValues[r2+'_'+c2];
var el=document.getElementById('cell_'+r2+'_'+c2);
if(el)el.classList.remove('editing');
if(val===ex.rows[r2][c2]){
if(el)el.classList.add('correct');
}else{
allCorrect=false;
if(el)el.classList.add('wrong');
}
}
}
checked=true;
document.getElementById('checkBtn').disabled=true;
var fb2=document.getElementById('feedback');
if(allCorrect){
pts+=10;
document.getElementById('pts').textContent=pts;
fb2.textContent='🎉 Μπράβο! Ο πίνακας οργανώθηκε σωστά!';
fb2.className='feedback ok';
}else{
fb2.textContent='⚠️ Κάποια κελιά έχουν λάθος τιμές (κόκκινα). Δοκίμασε ξανά!';
fb2.className='feedback fail';
}
}
function prevEx(){if(current>0){current--;render();}}
function nextEx(){if(current<exercises.length-1){current++;render();}}
render();
</script>
</body>
</html>
