<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Δικαιώματα &amp; Υποχρεώσεις ⚖️</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #6a1b9a, #ab47bc);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(106,27,154,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; text-shadow: 1px 1px 2px rgba(0,0,0,.2); }
  .header p { font-size: .9rem; opacity: .95; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #6a1b9a; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #f3e5f5; border: 2px dashed #ab47bc; border-radius: 16px;
    padding: 14px; margin-bottom: 14px; text-align: center;
    font-size: 1rem; color: #4a148c;
  }
  .scale-visual {
    background: #fff; border-radius: 24px; padding: 16px;
    margin-bottom: 14px; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.08);
  }
  .scale-row { display: flex; justify-content: center; align-items: center; gap: 20px; }
  .scale-side { text-align: center; flex: 1; }
  .scale-side .ss-icon { font-size: 3rem; }
  .scale-side .ss-label { font-size: .9rem; font-weight: 700; }
  .scale-side.rights .ss-label { color: #2e7d32; }
  .scale-side.duties .ss-label { color: #c62828; }
  .scale-vs { font-size: 1.5rem; font-weight: 700; color: #888; }
  .statement {
    background: #fff; border-radius: 20px; padding: 20px;
    margin-bottom: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.08);
    text-align: center;
  }
  .st-emoji { font-size: 3.5rem; margin-bottom: 8px; }
  .st-text { font-size: 1.1rem; font-weight: 700; color: #2d3436; }
  .btn-row {
    display: flex; gap: 14px; justify-content: center; margin-bottom: 14px;
  }
  .btn-action {
    flex: 1; max-width: 180px; padding: 16px; border: none; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all .15s;
    font-family: inherit; box-shadow: 0 4px 12px rgba(0,0,0,.12);
  }
  .btn-action:active { transform: scale(.92); }
  .btn-right { background: #c8e6c9; color: #2e7d32; }
  .btn-duty { background: #ffcdd2; color: #c62828; }
  .btn-action.disabled { pointer-events: none; opacity: .5; }
  .btn-right.selected { background: #4caf50; color: #fff; animation: pop .3s ease; }
  .btn-duty.selected { background: #f44336; color: #fff; animation: pop .3s ease; }
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
  .feedback { text-align:center; padding:14px; border-radius:16px; font-size:1.1rem; font-weight:700; margin-bottom:12px; display:none; }
  .feedback.show { display:block; }
  .feedback.yay { background:#d4edda; color:#155724; }
  .feedback.nay { background:#f8d7da; color:#721c24; }
  .result-screen { background:#fff; border-radius:24px; box-shadow:0 8px 28px rgba(0,0,0,.1); padding:40px 24px; text-align:center; display:none; }
  .result-screen .big-emoji{font-size:5rem;margin-bottom:12px}
  .result-screen h2{font-size:1.6rem;color:#2d3436;margin-bottom:8px}
  .result-screen p{font-size:1.1rem;color:#666;margin-bottom:20px}
  .btn-restart{background:linear-gradient(135deg,#6a1b9a,#ab47bc);color:#fff;border:none;border-radius:16px;padding:14px 36px;font-size:1.2rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(106,27,154,.35)}
  .btn-restart:active{transform:scale(.95)}
  @media(max-width:480px){body{padding:8px}.header h1{font-size:1.2rem}.scale-side .ss-icon{font-size:2.5rem}.st-emoji{font-size:2.5rem}}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .scale-row > * + * { margin-left: 20px; }
  .btn-row > * + * { margin-left: 14px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>⚖️ Δικαιώματα &amp; Υποχρεώσεις</h1>
    <p>Τι είναι δικαίωμα και τι υποχρέωση στο διαδίκτυο;</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/10</span>
  </div>
  <div class="instructions">🤔 Διάβασε κάθε πρόταση. Είναι δικαίωμα ✅ ή υποχρέωση 🔴;</div>
  <div id="gameArea">
    <div class="scale-visual">
      <div class="scale-row">
        <div class="scale-side rights">
          <div class="ss-icon">✅</div>
          <div class="ss-label">ΔΙΚΑΙΩΜΑ</div>
        </div>
        <div class="scale-vs">vs</div>
        <div class="scale-side duties">
          <div class="ss-icon">🔴</div>
          <div class="ss-label">ΥΠΟΧΡΕΩΣΗ</div>
        </div>
      </div>
    </div>
    <div class="statement">
      <div class="st-emoji" id="stEmoji">🌐</div>
      <div class="st-text" id="stText">Να έχω πρόσβαση στο διαδίκτυο</div>
    </div>
    <div class="btn-row">
      <button class="btn-action btn-right" id="btnRight">✅ Δικαίωμα</button>
      <button class="btn-action btn-duty" id="btnDuty">🔴 Υποχρέωση</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg"></p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var items = [
    {e:'🌐', t:'Να έχω πρόσβαση στο διαδίκτυο', isRight:true},
    {e:'🔒', t:'Να προστατεύω τα προσωπικά μου δεδομένα', isRight:true},
    {e:'📚', t:'Να μαθαίνω μέσα από το διαδίκτυο', isRight:true},
    {e:'🗣️', t:'Να εκφράζω τη γνώμη μου στο διαδίκτυο', isRight:true},
    {e:'🤝', t:'Να σέβομαι τους άλλους στο διαδίκτυο', isRight:false},
    {e:'⏰', t:'Να ελέγχω τον χρόνο που είμαι στο διαδίκτυο', isRight:false},
    {e:'😊', t:'Να μην προσβάλλω τους άλλους με τα σχόλιά μου', isRight:false},
    {e:'📖', t:'Να χρησιμοποιώ σωστά τις ψηφιακές συσκευές', isRight:false},
    {e:'👥', t:'Να συμμετέχω ισότιμα στην ψηφιακή κοινότητα', isRight:true},
    {e:'🛡️', t:'Να προστατεύω τα δικαιώματα των άλλων', isRight:false}
  ];
  var cur=0,score=0;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function startGame(){
    shuffle(items);cur=0;score=0;
    document.getElementById('scoreDisplay').textContent='⭐ 0';
    document.getElementById('gameArea').style.display='block';
    document.getElementById('resultScreen').style.display='none';
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    loadItem();
  }
  function loadItem(){
    if(cur>=items.length){showResult();return;}
    var i=items[cur];
    document.getElementById('roundDisplay').textContent=(cur+1)+'/'+items.length;
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    document.getElementById('stEmoji').textContent=i.e;
    document.getElementById('stText').textContent=i.t;
    var br=document.getElementById('btnRight');br.className='btn-action btn-right';br.disabled=false;
    var bd=document.getElementById('btnDuty');bd.className='btn-action btn-duty';bd.disabled=false;
  }
  function choose(isRight){
    var i=items[cur];var fb=document.getElementById('feedback');
    var br=document.getElementById('btnRight');var bd=document.getElementById('btnDuty');
    br.disabled=true;bd.disabled=true;
    if(isRight===i.isRight){
      score++;document.getElementById('scoreDisplay').textContent='⭐ '+score;
      if(isRight){br.className='btn-action btn-right selected';}else{bd.className='btn-action btn-duty selected';}
      fb.className='feedback show yay';fb.textContent='✅ Μπράβο! Σωστά!';
    }else{
      if(isRight){br.className='btn-action btn-right wrong';}else{bd.className='btn-action btn-duty wrong';}
      if(i.isRight){br.className='btn-action btn-right selected';}else{bd.className='btn-action btn-duty selected';}
      fb.className='feedback show nay';fb.textContent='❌ '+(i.isRight?'Αυτό είναι ΔΙΚΑΙΩΜΑ ✅':'Αυτό είναι ΥΠΟΧΡΕΩΣΗ 🔴')+'!';
    }
    setTimeout(function(){cur++;loadItem();},1500);
  }
  function showResult(){
    document.getElementById('gameArea').style.display='none';
    document.getElementById('resultScreen').style.display='block';
    var total=items.length,pct=score/total;
    var e,t,m;
    if(pct===1){e='🏆';t='Τέλεια!';m='Γνωρίζεις όλα τα δικαιώματα και τις υποχρεώσεις σου στο διαδίκτυο!';}
    else if(pct>=0.75){e='🎉';t='Μπράβο!';m='Τα πήγες πολύ καλά!';}
    else if(pct>=0.5){e='👍';t='Ωραία!';m='Καλή προσπάθεια!';}
    else{e='💪';t='Καλή αρχή!';m='Προσπάθησε ξανά!';}
    document.getElementById('resultEmoji').textContent=e;
    document.getElementById('resultTitle').textContent=t;
    document.getElementById('resultMsg').textContent='Βρήκες '+score+' από '+total+' σωστά! '+m;
  }
  startGame();
</script>
</body>
</html>
