<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Μέτρα τα Βήματα 🔢</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
    padding: 12px; color: #333;
  }
  .app-container { max-width: 520px; margin: 0 auto; }
  .header {
    text-align: center; padding: 16px 14px 10px;
    background: linear-gradient(135deg, #66a6ff, #3d5afe);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(61,90,254,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.3rem; margin-bottom: 2px; }
  .header p { font-size: .95rem; opacity: .95; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 8px 16px;
    margin-bottom: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.1rem; font-weight: 700; color: #3d5afe; }
  .round { font-size: .9rem; color: #888; }
  .hint {
    text-align: center; font-size: .95rem; font-weight: 700; color: #283593;
    background: #fff; border-radius: 14px; padding: 8px 12px;
    margin-bottom: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .grid-wrap { display: flex; justify-content: center; margin-bottom: 12px; }
  .grid {
    display: inline-grid;
    grid-gap: 3px;
    background: #283593;
    padding: 4px;
    border-radius: 10px;
  }
  .cell {
    width: 46px; height: 46px;
    background: #e8eaf6;
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.45rem;
    user-select: none; -webkit-user-select: none;
    transition: background .2s;
  }
  .cell.startcell { background: #fff9c4; }
  .cell.hop { animation: hop .3s; }
  @keyframes hop {
    0% { transform: scale(1); }
    50% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }
  @media (max-width: 460px) {
    .cell { width: 37px; height: 37px; font-size: 1.15rem; }
  }
  .program-strip {
    display: flex; justify-content: center; align-items: center;
    background: #fff; border-radius: 16px;
    padding: 10px; margin-bottom: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
  }
  .fixed-block {
    display: flex; flex-direction: column; align-items: center;
    background: #fff9c4; border: 3px solid #fbc02d;
    border-radius: 12px; padding: 4px 10px;
    margin-right: 12px;
  }
  .fixed-block .fb-icon { font-size: 1.5rem; }
  .fixed-block .fb-label { font-size: .6rem; font-weight: 700; color: #8d6e63; }
  .plus { font-size: 1.3rem; font-weight: 700; color: #999; margin-right: 12px; }
  .myblock {
    display: flex; flex-direction: column; align-items: center;
    background: #ffe0b2; border: 3px solid #ff9800;
    border-radius: 12px; padding: 4px 12px;
  }
  .myblock .b-arrow { font-size: 1.6rem; }
  .myblock .b-num {
    background: #1976d2; color: #fff; border-radius: 8px;
    font-size: .95rem; font-weight: 700; padding: 1px 10px; margin-top: 2px;
    min-width: 22px; text-align: center;
  }
  .palette-label {
    text-align: center; font-size: .9rem; font-weight: 700; color: #555;
    margin-bottom: 6px;
  }
  .palette {
    display: flex; justify-content: center; flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .pal-btn {
    width: 50px; height: 50px; border-radius: 10px;
    background: #fff; border: 2px solid #ff9800;
    font-size: 1.5rem; cursor: pointer;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .15s;
    margin: 4px;
  }
  .pal-btn.selected { background: #fff3e0; border-width: 3px; transform: scale(1.1); }
  .pal-btn:active { transform: scale(.9); }
  .keypad {
    display: flex; justify-content: center; flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .key {
    width: 46px; height: 46px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #42a5f5, #1976d2);
    color: #fff; font-size: 1.3rem; font-weight: 700; cursor: pointer;
    font-family: inherit;
    box-shadow: 0 3px 8px rgba(25,118,210,.3);
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .15s;
    margin: 4px;
  }
  .key.selected { transform: scale(1.15); box-shadow: 0 0 0 3px #ffb74d; }
  .key:active { transform: scale(.9); }
  .action-buttons {
    display: flex; justify-content: center; margin-bottom: 12px;
  }
  .btn-go {
    border: none; border-radius: 14px; padding: 12px 34px;
    font-size: 1.05rem; font-weight: 700; cursor: pointer;
    font-family: inherit;
    background: linear-gradient(135deg, #43e97b, #38f9d7);
    color: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,.1);
    transition: transform .15s;
  }
  .btn-go:active { transform: scale(.95); }
  .btn-go:disabled { opacity: .4; cursor: default; transform: none; }
  .feedback {
    text-align: center; padding: 12px; border-radius: 14px;
    font-size: 1rem; font-weight: 700; margin-bottom: 10px; display: none;
  }
  .feedback.correct { display: block; background: #d4edda; color: #155724; }
  .feedback.wrong { display: block; background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1); padding: 40px 24px;
    text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #66a6ff, #3d5afe);
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 36px; font-size: 1.2rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(61,90,254,.35);
    transition: transform .15s;
  }
  .btn-restart:hover { transform: scale(1.05); }
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🔢 Μέτρα τα Βήματα</h1>
    <p>Διάλεξε κατεύθυνση και νούμερο για να φτάσει στο φαγητό του!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/5</span>
  </div>
  <div id="gameArea">
    <div class="hint">🟡 Το ΠΗΓΑΙΝΕ ΣΤΗΝ ΑΡΧΗ μπαίνει πάντα πρώτο. Μετά η δική σου εντολή!</div>
    <div class="grid-wrap"><div class="grid" id="grid"></div></div>
    <div class="program-strip">
      <div class="fixed-block">
        <span class="fb-icon">🔄</span>
        <span class="fb-label">ΠΗΓΑΙΝΕ ΣΤΗΝ ΑΡΧΗ</span>
      </div>
      <span class="plus">➕</span>
      <div class="myblock">
        <span class="b-arrow" id="myArrow">❔</span>
        <span class="b-num" id="myNum">?</span>
      </div>
    </div>
    <div class="palette-label">Διάλεξε κατεύθυνση:</div>
    <div class="palette" id="palette"></div>
    <div class="palette-label">Πόσα βήματα;</div>
    <div class="keypad" id="keypad"></div>
    <div class="action-buttons">
      <button class="btn-go" id="btnGo" onclick="runProgram()">▶️ Τρέξε!</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var ROWS = 5, COLS = 7;
  var rounds = [
    { pet: '🐱', food: '🐟', start: [2,2], dir: 'right', n: 3 },
    { pet: '🐶', food: '🍖', start: [1,1], dir: 'right', n: 5 },
    { pet: '🐭', food: '🧀', start: [4,3], dir: 'up', n: 3 },
    { pet: '🐰', food: '🥕', start: [2,6], dir: 'left', n: 6 },
    { pet: '🐻', food: '🍯', start: [0,2], dir: 'down', n: 4 }
  ];
  var VEC = { up: [-1,0], down: [1,0], left: [0,-1], right: [0,1] };
  var ARROW = { up: '⬆️', down: '⬇️', left: '⬅️', right: '➡️' };
  var STEP_MS = 320;

  var currentRound = 0, score = 0, running = false;
  var chosenArrow = null, chosenNum = 0;
  var startPos = null;

  function startGame() {
    currentRound = 0; score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    loadRound();
  }

  function loadRound() {
    if (currentRound >= rounds.length) { showResult(); return; }
    running = false;
    chosenArrow = null; chosenNum = 0;
    var rd = rounds[currentRound];
    startPos = { r: rd.start[0], c: rd.start[1] };
    document.getElementById('roundDisplay').textContent = (currentRound + 1) + '/' + rounds.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('myArrow').textContent = '❔';
    document.getElementById('myNum').textContent = '?';
    renderGrid();
    renderPet();
    buildPalette();
    buildKeypad();
    document.getElementById('btnGo').disabled = false;
  }

  function renderGrid() {
    var rd = rounds[currentRound];
    var v = VEC[rd.dir];
    var fr = rd.start[0] + v[0] * rd.n;
    var fc = rd.start[1] + v[1] * rd.n;
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = 'repeat(' + COLS + ', 46px)';
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var cell = document.createElement('div');
        cell.className = 'cell';
        cell.setAttribute('data-r', r);
        cell.setAttribute('data-c', c);
        if (r === rd.start[0] && c === rd.start[1]) cell.classList.add('startcell');
        else if (r === fr && c === fc) cell.textContent = rd.food;
        grid.appendChild(cell);
      }
    }
  }

  function foodPos() {
    var rd = rounds[currentRound];
    var v = VEC[rd.dir];
    return { r: rd.start[0] + v[0] * rd.n, c: rd.start[1] + v[1] * rd.n };
  }

  function cellAt(r, c) {
    var cells = document.querySelectorAll('.cell');
    for (var i = 0; i < cells.length; i++) {
      if (parseInt(cells[i].getAttribute('data-r')) === r &&
          parseInt(cells[i].getAttribute('data-c')) === c) return cells[i];
    }
    return null;
  }

  function renderPet() {
    var rd = rounds[currentRound];
    var s = cellAt(rd.start[0], rd.start[1]);
    s.textContent = rd.pet;
  }

  function buildPalette() {
    var pal = document.getElementById('palette');
    pal.innerHTML = '';
    var dirs = ['right', 'left', 'up', 'down'];
    for (var i = 0; i < dirs.length; i++) {
      (function(d) {
        var b = document.createElement('button');
        b.className = 'pal-btn';
        b.textContent = ARROW[d];
        b.onclick = function() {
          if (running) return;
          chosenArrow = d;
          document.getElementById('myArrow').textContent = ARROW[d];
          var btns = pal.querySelectorAll('.pal-btn');
          for (var j = 0; j < btns.length; j++) btns[j].classList.remove('selected');
          this.classList.add('selected');
        };
        pal.appendChild(b);
      })(dirs[i]);
    }
  }

  function buildKeypad() {
    var pad = document.getElementById('keypad');
    pad.innerHTML = '';
    for (var n = 1; n <= 6; n++) {
      (function(num) {
        var k = document.createElement('button');
        k.className = 'key';
        k.textContent = num;
        k.onclick = function() {
          if (running) return;
          chosenNum = num;
          document.getElementById('myNum').textContent = num;
          var keys = pad.querySelectorAll('.key');
          for (var j = 0; j < keys.length; j++) keys[j].classList.remove('selected');
          this.classList.add('selected');
        };
        pad.appendChild(k);
      })(n);
    }
  }

  function setFeedback(type, text) {
    var fb = document.getElementById('feedback');
    fb.className = 'feedback ' + type;
    fb.style.display = '';
    fb.textContent = text;
  }

  function runProgram() {
    if (running) return;
    if (!chosenArrow || chosenNum === 0) {
      setFeedback('wrong', 'Διάλεξε πρώτα κατεύθυνση ➡️⬅️⬆️⬇️ και πόσα βήματα!');
      return;
    }
    running = true;
    document.getElementById('btnGo').disabled = true;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';

    var rd = rounds[currentRound];
    var pos = { r: rd.start[0], c: rd.start[1] };

    function snapToStart() {
      var sc = cellAt(rd.start[0], rd.start[1]);
      sc.classList.remove('hop');
      void sc.offsetWidth;
      sc.classList.add('hop');
    }

    var i = 0;
    var timer = setInterval(function() {
      if (i === 0) { snapToStart(); i++; return; }
      if (i <= chosenNum) {
        var v = VEC[chosenArrow];
        var nr = pos.r + v[0], nc = pos.c + v[1];
        if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) {
          clearInterval(timer);
          setFeedback('wrong', '💥 Ωχ! Χτύπησε τον φράχτη του πάρκου!');
          endRun();
          return;
        }
        var oldCell = cellAt(pos.r, pos.c);
        oldCell.textContent = '';
        pos = { r: nr, c: nc };
        var newCell = cellAt(nr, nc);
        newCell.textContent = rd.pet;
        newCell.classList.remove('hop');
        void newCell.offsetWidth;
        newCell.classList.add('hop');
        i++;
        return;
      }
      clearInterval(timer);
      finishRun(pos);
    }, STEP_MS);

    function finishRun(finalPos) {
      var f = foodPos();
      if (finalPos.r === f.r && finalPos.c === f.c) {
        var foodCell = cellAt(f.r, f.c);
        foodCell.textContent = rd.pet + rd.food;
        score++;
        document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
        setFeedback('correct', '✅ Μπράβο! ' + rd.n + ' βήματα ' + ARROW[rd.dir] + ' ήταν ακριβώς σωστά!');
        setTimeout(function() {
          currentRound++;
          loadRound();
        }, 2000);
      } else {
        var fp = foodPos();
        var rightDir = (chosenArrow === rd.dir);
        var msg;
        if (!rightDir) {
          msg = 'Λάθος κατεύθυνση! Κοίτα πού είναι το ' + rd.food + ' ' + ARROW[rd.dir] + '!';
        } else if (chosenNum < rd.n) {
          msg = 'Λίγα βήματα! Δεν έφτασε ακόμα. Βάλε μεγαλύτερο νούμερο!';
        } else {
          msg = 'Πολλά βήματα! Πέρασε από πάνω. Βάλε μικρότερο νούμερο!';
        }
        setFeedback('wrong', '❌ ' + msg);
        endRun();
      }
    }

    function endRun() {
      setTimeout(function() {
        running = false;
        document.getElementById('btnGo').disabled = false;
        renderGrid();
        renderPet();
      }, 1300);
    }
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var total = rounds.length;
    var emoji, title, msg;
    if (score === total) { emoji = '🏆'; title = 'Τέλεια!'; msg = 'Μετράς τα βήματα σαν προγραμματιστής!'; }
    else if (score >= 4) { emoji = '🎉'; title = 'Μπράβο!'; msg = 'Ξέρεις τα νούμερα στις εντολές!'; }
    else if (score >= 2) { emoji = '👍'; title = 'Ωραία!'; msg = 'Καλή προσπάθεια! Δοκίμασε ξανά!'; }
    else { emoji = '💪'; title = 'Καλή αρχή!'; msg = 'Μέτρα προσεκτικά τα τετραγωνάκια!'; }
    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultMsg').textContent = 'Βρήκες ' + score + ' από ' + total + ' σωστά! ' + msg;
  }

  startGame();
</script>
</body>
</html>
