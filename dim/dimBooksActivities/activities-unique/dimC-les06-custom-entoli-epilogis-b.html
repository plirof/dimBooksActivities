<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Λύνω το Πρόβλημα!</title>
<style>
@font-face {
font-family: 'NotoColorEmoji';
src: url('../fonts/NotoColorEmoji.ttf') format('truetype');
font-weight: normal;
font-style: normal;
unicode-range: U+1F300-1F9FF;
}
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
body {
background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
min-height: 100vh;
padding: 15px;
display: flex;
flex-direction: column;
align-items: center;
}
h1 {
color: white;
text-align: center;
margin-bottom: 5px;
font-size: 1.8rem;
text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
font-family: 'NotoColorEmoji', 'Segoe UI Emoji', sans-serif;
}
.subtitle {
color: #e8daff;
text-align: center;
margin-bottom: 15px;
font-size: 1rem;
max-width: 700px;
}
.container {
background: white;
border-radius: 20px;
padding: 25px;
width: 100%;
max-width: 700px;
box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}
.progress-bar {
background: #eee;
border-radius: 10px;
height: 24px;
margin-bottom: 20px;
overflow: hidden;
position: relative;
}
.progress-fill {
background: linear-gradient(90deg, #4CAF50, #8BC34A);
height: 100%;
border-radius: 10px;
transition: width 0.5s ease;
}
.progress-text {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
font-size: 0.75rem;
font-weight: bold;
color: #333;
}
.challenge-title {
font-size: 1.2rem;
color: #333;
margin-bottom: 8px;
text-align: center;
font-weight: bold;
}
.challenge-desc {
font-size: 0.95rem;
color: #555;
margin-bottom: 12px;
text-align: center;
line-height: 1.5;
}
.challenge-problem {
background: linear-gradient(135deg, #fff3e0, #ffe0b2);
border: 2px solid #ffb74d;
border-radius: 12px;
padding: 12px 16px;
margin-bottom: 18px;
text-align: center;
font-size: 0.95rem;
color: #e65100;
font-weight: bold;
line-height: 1.5;
}
.sprites-row {
display: flex;
justify-content: center;
gap: 20px;
margin-bottom: 12px;
}
.sprite-box {
display: flex;
flex-direction: column;
align-items: center;
gap: 4px;
}
.sprite-label {
font-size: 0.8rem;
color: #666;
font-weight: bold;
}
.emoji-icon {
font-size: 2.5rem;
font-family: 'NotoColorEmoji', 'Segoe UI Emoji', sans-serif;
}
.stage-preview {
background: white;
border: 3px solid #e0e0e0;
border-radius: 10px;
width: 100%;
max-width: 360px;
height: 140px;
margin: 0 auto 16px;
position: relative;
overflow: hidden;
background: linear-gradient(180deg, #e3f2fd 0%, #bbdefb 60%, #81c784 60%, #66bb6a 100%);
}
.stage-cat {
position: absolute;
font-size: 1.8rem;
font-family: 'NotoColorEmoji', 'Segoe UI Emoji', sans-serif;
transition: left 0.5s ease;
}
.stage-house {
position: absolute;
font-size: 1.8rem;
font-family: 'NotoColorEmoji', 'Segoe UI Emoji', sans-serif;
}
.stage-edge-label {
position: absolute;
font-size: 0.65rem;
color: #d32f2f;
font-weight: bold;
background: rgba(255,255,255,0.8);
padding: 2px 6px;
border-radius: 4px;
}
.script-area {
background: #f5f5f5;
border-radius: 15px;
padding: 20px;
margin-bottom: 20px;
min-height: 180px;
position: relative;
border: 3px dashed #ccc;
display: flex;
flex-direction: column;
align-items: center;
}
.script-label {
position: absolute;
top: 8px;
right: 12px;
font-size: 0.75rem;
color: #aaa;
font-weight: bold;
}
.script-slot {
background: rgba(0,0,0,0.05);
border-radius: 8px;
border: 2px dashed #bbb;
margin: 4px 0;
min-height: 48px;
width: 92%;
display: flex;
align-items: center;
justify-content: center;
position: relative;
transition: all 0.2s ease;
}
.script-slot.drag-over {
border-color: #4CAF50;
background: rgba(76, 175, 80, 0.1);
}
.script-slot.filled {
border-style: solid;
background: transparent;
}
.slot-label {
font-size: 0.8rem;
color: #aaa;
pointer-events: none;
}
.placed-block {
width: 100%;
border-radius: 8px;
padding: 10px 14px;
color: white;
font-weight: bold;
font-size: 0.88rem;
cursor: grab;
display: flex;
align-items: center;
gap: 8px;
user-select: none;
position: relative;
}
.placed-block::after {
content: '';
position: absolute;
bottom: -4px;
left: 15px;
right: 15px;
height: 4px;
background: rgba(0,0,0,0.15);
border-radius: 0 0 4px 4px;
}
.block-palette {
display: flex;
flex-wrap: wrap;
gap: 10px;
justify-content: center;
margin-bottom: 20px;
}
.scratch-block {
border-radius: 8px;
padding: 10px 16px;
color: white;
font-weight: bold;
font-size: 0.88rem;
cursor: grab;
display: flex;
align-items: center;
gap: 8px;
user-select: none;
box-shadow: 0 3px 8px rgba(0,0,0,0.2);
transition: transform 0.15s ease, box-shadow 0.15s ease;
touch-action: none;
position: relative;
}
.scratch-block::after {
content: '';
position: absolute;
bottom: -4px;
left: 10px;
right: 10px;
height: 4px;
background: rgba(0,0,0,0.15);
border-radius: 0 0 4px 4px;
}
.scratch-block:hover {
transform: translateY(-2px);
box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
.scratch-block.dragging {
opacity: 0.5;
}
.scratch-block.used {
opacity: 0.35;
cursor: default;
transform: none;
box-shadow: none;
}
.block-events { background: linear-gradient(135deg, #FFBF00, #FFD700); color: #333; }
.block-control { background: linear-gradient(135deg, #FFAB19, #FF8C1A); }
.block-sensing { background: linear-gradient(135deg, #5CB1D6, #40A4C4); }
.block-motion { background: linear-gradient(135deg, #4C97FF, #3373CC); }
.block-distractor { background: linear-gradient(135deg, #FF6680, #FF4D6A); }
.drag-clone {
position: fixed;
pointer-events: none;
z-index: 9999;
transform: rotate(2deg) scale(1.05);
box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}
.btn {
padding: 14px 30px;
border: none;
border-radius: 12px;
font-size: 1.1rem;
font-weight: bold;
cursor: pointer;
transition: all 0.2s ease;
display: block;
margin: 0 auto;
}
.btn-check {
background: linear-gradient(135deg, #4CAF50, #45a049);
color: white;
}
.btn-check:hover {
transform: translateY(-2px);
box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}
.btn-next {
background: linear-gradient(135deg, #2196F3, #1976D2);
color: white;
}
.btn-retry {
background: linear-gradient(135deg, #FF9800, #F57C00);
color: white;
margin-top: 10px;
}
.feedback {
text-align: center;
padding: 15px;
border-radius: 12px;
margin-top: 15px;
font-size: 1.05rem;
font-weight: bold;
display: none;
}
.feedback.correct {
background: #E8F5E9;
color: #2E7D32;
border: 2px solid #4CAF50;
display: block;
}
.feedback.wrong {
background: #FFEBEE;
color: #C62828;
border: 2px solid #EF5350;
display: block;
}
.completion-screen {
display: none;
text-align: center;
padding: 30px 20px;
}
.completion-screen h2 {
font-size: 1.8rem;
color: #333;
margin-bottom: 10px;
font-family: 'NotoColorEmoji', 'Segoe UI Emoji', sans-serif;
}
.stars {
font-size: 3rem;
margin: 15px 0;
font-family: 'NotoColorEmoji', 'Segoe UI Emoji', sans-serif;
}
.score-text {
font-size: 1.3rem;
color: #555;
margin-bottom: 20px;
}
.step-num {
background: #FF6B6B;
color: white;
width: 26px;
height: 26px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 0.8rem;
font-weight: bold;
flex-shrink: 0;
}
.reset-btn {
background: #eee;
border: none;
border-radius: 8px;
padding: 6px 14px;
font-size: 0.8rem;
cursor: pointer;
color: #666;
margin-bottom: 12px;
display: block;
margin-left: auto;
}
.reset-btn:hover {
background: #ddd;
}
.hint-text {
font-size: 0.82rem;
color: #999;
text-align: center;
margin-bottom: 10px;
font-style: italic;
}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .sprites-row > * + * { margin-left: 20px; }
  .sprite-box > * + * { margin-top: 4px; }
  .placed-block > * + * { margin-left: 8px; }
  .block-palette > * { margin: 5px; }
  .scratch-block > * + * { margin-left: 8px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<h1>🧩 Λύνω το Πρόβλημα!</h1>
<p class="subtitle">Διάλεξε και βάλε τα σωστά μπλοκ για να λύσεις κάθε πρόβλημα!</p>
<div class="container">
<div id="gameArea">
<div class="progress-bar">
<div class="progress-fill" id="progressFill" style="width:0%"></div>
<span class="progress-text" id="progressText">0 / 2</span>
</div>
<div id="challengeArea"></div>
<div class="feedback" id="feedback"></div>
</div>
<div class="completion-screen" id="completionScreen">
<h2>🎉 Μπράβο! Τα κατάφερες!</h2>
<div class="stars" id="stars"></div>
<div class="score-text" id="scoreText"></div>
<button class="btn btn-retry" onclick="restartGame()">Παίξε ξανά! 🔄</button>
</div>
</div>
<script>
var challenges = [
{
title: "Πρόβλημα 1",
problem: "Η γάτα φτάνει στο όριο της σκηνής. Πώς θα γυρίσει πίσω στο σπιτάκι;",
desc: "Φτιάξε το πρόγραμμα: όταν πατηθεί η πράσινη σημαία, αν η γάτα αγγίζει το όριο σκηνής, τότε να πάει στο Σπιτάκι!",
catPos: "right",
sprites: ["🐱", "🏠"],
slots: 3,
correctOrder: ["event-flag", "control-if-edge", "motion-goto-house"],
blocks: [
{ id: "event-flag", text: "🚩 όταν πατηθεί πράσινη σημαία", cls: "block-events" },
{ id: "control-if-edge", text: "⬥ αν αγγίζει όριο σκηνής τότε", cls: "block-control" },
{ id: "motion-goto-house", text: "📍 πήγαινε σε Σπιτάκι", cls: "block-motion" },
{ id: "sensing-touch-edge", text: "🔵 αγγίζει όριο σκηνής;", cls: "block-sensing" },
{ id: "motion-move10", text: "➡️ κινήσου 10 βήματα", cls: "block-motion" },
{ id: "control-if-mouse", text: "⬥ αν αγγίζει ποντίκι τότε", cls: "block-control" }
]
},
{
title: "Πρόβλημα 2",
problem: "Θέλουμε η γάτα να ξεκινάει από το σπιτάκι όταν πατάμε την πράσινη σημαία.",
desc: "Φτιάξε ένα απλό πρόγραμμα: όταν πατηθεί η πράσινη σημαία, η γάτα να πάει στο Σπιτάκι!",
catPos: "center",
sprites: ["🐱", "🏠"],
slots: 2,
correctOrder: ["event-flag2", "motion-goto-house2"],
blocks: [
{ id: "event-flag2", text: "🚩 όταν πατηθεί πράσινη σημαία", cls: "block-events" },
{ id: "motion-goto-house2", text: "📍 πήγαινε σε Σπιτάκι", cls: "block-motion" },
{ id: "motion-goto-xy", text: "📍 πήγαινε σε x:0 y:0", cls: "block-motion" },
{ id: "control-if-edge2", text: "⬥ αν αγγίζει όριο σκηνής τότε", cls: "block-control" },
{ id: "event-key", text: "⌨️ όταν πατηθεί πλήκτρο", cls: "block-events" },
{ id: "sensing-edge2", text: "🔵 αγγίζει όριο σκηνής;", cls: "block-sensing" }
]
}
];

var currentChallenge = 0;
var score = 0;
var attempts = 0;
var placedBlocks = [];
var draggedBlock = null;
var dragClone = null;
var dragOffsetX = 0;
var dragOffsetY = 0;

function shuffleArray(arr) {
var shuffled = arr.slice();
for (var i = shuffled.length - 1; i > 0; i--) {
var j = Math.floor(Math.random() * (i + 1));
var tmp = shuffled[i];
shuffled[i] = shuffled[j];
shuffled[j] = tmp;
}
return shuffled;
}

function loadChallenge() {
var ch = challenges[currentChallenge];
var area = document.getElementById("challengeArea");
placedBlocks = new Array(ch.slots).fill(null);
attempts = 0;

var html = '<div class="challenge-title">' + ch.title + "</div>";
html += '<div class="challenge-problem">' + ch.problem + "</div>";
html += '<div class="challenge-desc">' + ch.desc + "</div>";

html += '<div class="stage-preview">';
html += '<span class="stage-edge-label" style="right:4px;top:50%;transform:translateY(-50%)">Όριο</span>';
html += '<span class="stage-edge-label" style="left:4px;top:50%;transform:translateY(-50%)">Όριο</span>';
html += '<span class="stage-house" style="left:20px;bottom:45px">🏠</span>';
if (ch.catPos === "right") {
html += '<span class="stage-cat" style="right:15px;bottom:45px">🐱</span>';
} else {
html += '<span class="stage-cat" style="left:50%;bottom:45px;transform:translateX(-50%)">🐱</span>';
}
html += "</div>";

html += '<div class="sprites-row">';
for (var s = 0; s < ch.sprites.length; s++) {
html += '<div class="sprite-box"><span class="emoji-icon">' + ch.sprites[s] + '</span></div>';
}
html += "</div>";

html += '<button class="reset-btn" onclick="resetSlots()">🔄 Ξαναβάλ τα μπλοκ</button>';

html += '<div class="script-area" id="scriptArea">';
html += '<span class="script-label">Περιοχή σεναρίου</span>';
for (var i = 0; i < ch.slots; i++) {
html += '<div class="script-slot" data-slot="' + i + '"><span class="slot-label">' + (i + 1) + "ο μπλοκ</span></div>";
}
html += "</div>";

html += '<p class="hint-text">Σύρε τα σωστά μπλοκ στα κουτάκια παραπάνω!</p>';

var shuffled = shuffleArray(ch.blocks);
html += '<div class="block-palette" id="palette">';
for (var b = 0; b < shuffled.length; b++) {
html +=
'<div class="scratch-block ' +
shuffled[b].cls +
'" data-id="' +
shuffled[b].id +
'" data-text="' +
shuffled[b].text.replace(/"/g, "&quot;") +
'">' +
shuffled[b].text +
"</div>";
}
html += "</div>";

html += '<button class="btn btn-check" id="checkBtn" onclick="checkAnswer()">✔ Έλεγξε!</button>';

area.innerHTML = html;
document.getElementById("feedback").className = "feedback";
document.getElementById("feedback").style.display = "none";

setupDragAndDrop();
}

function setupDragAndDrop() {
var blocks = document.querySelectorAll(".scratch-block");
for (var i = 0; i < blocks.length; i++) {
(function (block) {
block.addEventListener("mousedown", function (e) {
startDrag(block, e.clientX, e.clientY);
});
block.addEventListener("touchstart", function (e) {
e.preventDefault();
startDrag(block, e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
})(blocks[i]);
}
}

function startDrag(block, cx, cy) {
if (block.classList.contains("used")) return;

var rect = block.getBoundingClientRect();
dragOffsetX = cx - rect.left;
dragOffsetY = cy - rect.top;
draggedBlock = block;

dragClone = block.cloneNode(true);
dragClone.classList.add("drag-clone");
dragClone.style.width = rect.width + "px";
dragClone.style.position = "fixed";
dragClone.style.left = cx - dragOffsetX + "px";
dragClone.style.top = cy - dragOffsetY + "px";
document.body.appendChild(dragClone);

block.classList.add("dragging");

document.addEventListener("mousemove", onDragMove);
document.addEventListener("mouseup", onDragEnd);
document.addEventListener("touchmove", onDragMoveTouch, { passive: false });
document.addEventListener("touchend", onDragEndTouch);
}

function onDragMove(e) {
moveDrag(e.clientX, e.clientY);
}

function onDragMoveTouch(e) {
e.preventDefault();
moveDrag(e.touches[0].clientX, e.touches[0].clientY);
}

function moveDrag(cx, cy) {
if (!dragClone) return;
dragClone.style.left = cx - dragOffsetX + "px";
dragClone.style.top = cy - dragOffsetY + "px";

var slots = document.querySelectorAll(".script-slot");
for (var i = 0; i < slots.length; i++) {
var r = slots[i].getBoundingClientRect();
if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) {
slots[i].classList.add("drag-over");
} else {
slots[i].classList.remove("drag-over");
}
}
}

function onDragEnd(e) {
endDrag(e.clientX, e.clientY);
}

function onDragEndTouch(e) {
var touch = e.changedTouches[0];
endDrag(touch.clientX, touch.clientY);
}

function endDrag(cx, cy) {
if (!dragClone || !draggedBlock) return;

document.removeEventListener("mousemove", onDragMove);
document.removeEventListener("mouseup", onDragEnd);
document.removeEventListener("touchmove", onDragMoveTouch);
document.removeEventListener("touchend", onDragEndTouch);

var dropped = false;
var slots = document.querySelectorAll(".script-slot");
for (var i = 0; i < slots.length; i++) {
slots[i].classList.remove("drag-over");
var r = slots[i].getBoundingClientRect();
if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) {
if (placedBlocks[i]) {
returnToPalette(placedBlocks[i].id);
}
placedBlocks[i] = {
id: draggedBlock.getAttribute("data-id"),
text: draggedBlock.getAttribute("data-text"),
};
renderSlot(i);
draggedBlock.classList.add("used");
draggedBlock.classList.remove("dragging");
dropped = true;
break;
}
}

if (!dropped) {
draggedBlock.classList.remove("dragging");
}

document.body.removeChild(dragClone);
dragClone = null;
draggedBlock = null;
}

function returnToPalette(id) {
var blocks = document.querySelectorAll(".scratch-block");
for (var i = 0; i < blocks.length; i++) {
if (blocks[i].getAttribute("data-id") === id) {
blocks[i].classList.remove("used");
}
}
for (var j = 0; j < placedBlocks.length; j++) {
if (placedBlocks[j] && placedBlocks[j].id === id) {
placedBlocks[j] = null;
var slot = document.querySelector('[data-slot="' + j + '"]');
if (slot) {
slot.innerHTML =
'<span class="slot-label">' + (j + 1) + "ο μπλοκ</span>";
slot.classList.remove("filled");
}
}
}
}

function renderSlot(index) {
var slot = document.querySelector('[data-slot="' + index + '"]');
if (!slot) return;
if (placedBlocks[index]) {
var ch = challenges[currentChallenge];
var blockData = null;
for (var b = 0; b < ch.blocks.length; b++) {
if (ch.blocks[b].id === placedBlocks[index].id) {
blockData = ch.blocks[b];
break;
}
}
if (blockData) {
slot.innerHTML =
'<div class="placed-block ' +
blockData.cls +
'"><span class="step-num">' +
(index + 1) +
"</span>" +
blockData.text +
"</div>";
slot.classList.add("filled");
}
} else {
slot.innerHTML =
'<span class="slot-label">' + (index + 1) + "ο μπλοκ</span>";
slot.classList.remove("filled");
}
}

function resetSlots() {
var ch = challenges[currentChallenge];
placedBlocks = new Array(ch.slots).fill(null);
var blocks = document.querySelectorAll(".scratch-block");
for (var i = 0; i < blocks.length; i++) {
blocks[i].classList.remove("used");
}
for (var j = 0; j < ch.slots; j++) {
renderSlot(j);
}
}

function checkAnswer() {
var ch = challenges[currentChallenge];
var allFilled = true;
for (var i = 0; i < ch.slots; i++) {
if (!placedBlocks[i]) {
allFilled = false;
break;
}
}

var fb = document.getElementById("feedback");

if (!allFilled) {
fb.className = "feedback wrong";
fb.style.display = "block";
fb.textContent = "⚠️ Βάλε όλα τα μπλοκ στα κουτάκια πρώτα!";
return;
}

var correct = true;
for (var j = 0; j < ch.slots; j++) {
if (placedBlocks[j].id !== ch.correctOrder[j]) {
correct = false;
break;
}
}

if (correct) {
score++;
fb.className = "feedback correct";
fb.style.display = "block";
fb.textContent = "🎉 Σωστό! Μπράβο σου!";
disableInteraction();
setTimeout(function () {
currentChallenge++;
updateProgress();
if (currentChallenge < challenges.length) {
loadChallenge();
} else {
showCompletion();
}
}, 1500);
} else {
attempts++;
if (attempts >= 3) {
fb.className = "feedback wrong";
fb.style.display = "block";
fb.textContent = "💡 Η σωστή σειρά είναι: " + getCorrectHint();
} else {
fb.className = "feedback wrong";
fb.style.display = "block";
fb.textContent = "❌ Δεν είναι σωστό. Ξαναδοκίμασε!";
}
}
}

function getCorrectHint() {
var ch = challenges[currentChallenge];
var hint = "";
for (var i = 0; i < ch.correctOrder.length; i++) {
for (var j = 0; j < ch.blocks.length; j++) {
if (ch.blocks[j].id === ch.correctOrder[i]) {
if (hint) hint += " → ";
hint += ch.blocks[j].text;
break;
}
}
}
return hint;
}

function disableInteraction() {
var blocks = document.querySelectorAll(".scratch-block");
for (var i = 0; i < blocks.length; i++) {
blocks[i].style.pointerEvents = "none";
}
document.getElementById("checkBtn").style.pointerEvents = "none";
document.getElementById("checkBtn").style.opacity = "0.5";
}

function updateProgress() {
var pct = Math.round((currentChallenge / challenges.length) * 100);
document.getElementById("progressFill").style.width = pct + "%";
document.getElementById("progressText").textContent =
currentChallenge + " / " + challenges.length;
}

function showCompletion() {
document.getElementById("gameArea").style.display = "none";
document.getElementById("completionScreen").style.display = "block";

var starCount = score >= 2 ? 3 : score >= 1 ? 2 : 1;
var starsHtml = "";
for (var i = 0; i < 3; i++) {
starsHtml += i < starCount ? "⭐" : "☆";
}
document.getElementById("stars").textContent = starsHtml;
document.getElementById("scoreText").textContent =
"Βαθμολογία: " + score + " / " + challenges.length;
}

function restartGame() {
currentChallenge = 0;
score = 0;
updateProgress();
document.getElementById("gameArea").style.display = "block";
document.getElementById("completionScreen").style.display = "none";
loadChallenge();
}

updateProgress();
loadChallenge();
</script>
</body>
</html>
