<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Αρχείο ή Φάκελος; 📁</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
    padding: 12px; color: #333;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 14px;
    background: linear-gradient(135deg, #f093fb, #f5576c);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(245,87,108,.4); margin-bottom: 16px;
  }
  .header h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .header p { font-size: 1rem; opacity: .9; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #f5576c; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fff9db; border: 2px dashed #f0c040;
    border-radius: 16px; padding: 14px 16px; margin-bottom: 16px;
    font-size: 1.1rem; text-align: center; color: #6b5900;
  }
  .showcase {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 32px 20px; text-align: center; margin-bottom: 16px;
  }
  .showcase .big-icon { font-size: 5rem; margin-bottom: 10px; }
  .showcase .big-name { font-size: 1.5rem; font-weight: 700; color: #2d3436; }
  .showcase .big-desc { font-size: 1rem; color: #888; margin-top: 4px; }
  .btn-group {
    display: flex; gap: 16px; justify-content: center;
  }
  .btn-type {
    flex: 1; border: 3px solid #e0e0e0; border-radius: 18px;
    padding: 18px 16px; text-align: center; cursor: pointer;
    transition: all .2s ease; background: #fff;
    user-select: none; -webkit-tap-highlight-color: transparent;
    max-width: 160px;
  }
  .btn-type:hover:not(.disabled) {
    border-color: #f5576c; transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(245,87,108,.15);
  }
  .btn-type:active:not(.disabled) { transform: scale(.95); }
  .btn-type .bt-emoji { font-size: 3rem; margin-bottom: 6px; }
  .btn-type .bt-title { font-size: 1.1rem; font-weight: 700; color: #333; }
  .btn-type.correct { border-color: #28a745; background: #d4edda; animation: pop .3s ease; }
  .btn-type.wrong { border-color: #dc3545; background: #f8d7da; animation: shake .35s ease; }
  .btn-type.disabled { pointer-events: none; opacity: .5; }
  .btn-type.reveal { border-color: #28a745; background: #d4edda; opacity: 1; }
  @keyframes pop { 0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}60%{transform:translateX(5px)} }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.05rem; font-weight: 700; display: none;
  }
  .feedback.show { display: block; margin-bottom: 12px; }
  .feedback.true { background: #d4edda; color: #155724; }
  .feedback.false { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #f093fb, #f5576c);
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 36px; font-size: 1.2rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(245,87,108,.35);
    transition: transform .15s;
  }
  .btn-restart:hover { transform: scale(1.05); }
  @media (max-width:480px) {
    .header h1 { font-size: 1.2rem; }
    .showcase .big-icon { font-size: 4rem; }
    .showcase .big-name { font-size: 1.2rem; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .btn-group > * + * { margin-left: 16px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>📁 Αρχείο ή Φάκελος;</h1>
    <p>Βοήθησε τον Ήρωνα να ξεχωρίσει!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">Ερώτηση 1/8</span>
  </div>
  <div class="instructions">👀 Κοίτα το εικονίδιο. Είναι <strong>αρχείο</strong> (περιέχει ζωγραφιά/κείμενο/ήχο) ή <strong>φάκελος</strong> (βάζουμε αρχεία μέσα);</div>
  <div id="gameArea">
    <div class="showcase" id="showcase">
      <div class="big-icon" id="bigIcon">📄</div>
      <div class="big-name" id="bigName">Θάλασσα</div>
      <div class="big-desc" id="bigDesc">Ζωγραφιά</div>
    </div>
    <div class="btn-group">
      <div class="btn-type" id="btnFile" onclick="answer('file')">
        <div class="bt-emoji">📄</div>
        <div class="bt-title">Αρχείο</div>
      </div>
      <div class="btn-type" id="btnFolder" onclick="answer('folder')">
        <div class="bt-emoji">📁</div>
        <div class="bt-title">Φάκελος</div>
      </div>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var items = [
    { icon: '📄', name: 'Θάλασσα', desc: '🖼️ Ζωγραφιά', type: 'file' },
    { icon: '📁', name: 'Έγγραφα', desc: '📂 Βάζουμε εργασίες', type: 'folder' },
    { icon: '📄', name: 'Σκύλος', desc: '🖼️ Ζωγραφιά', type: 'file' },
    { icon: '📁', name: 'Μουσική', desc: '🎵 Βάζουμε τραγούδια', type: 'folder' },
    { icon: '📄', name: 'Παραμύθι', desc: '📝 Κείμενο', type: 'file' },
    { icon: '📁', name: 'Ζωγραφιές', desc: '🖼️ Βάζουμε ζωγραφιές', type: 'folder' },
    { icon: '📄', name: 'Γενέθλια', desc: '📹 Βίντεο', type: 'file' },
    { icon: '📁', name: 'Βίντεο', desc: '🎬 Βάζουμε βίντεο', type: 'folder' }
  ];
  var shuffled = [];
  var current = 0; var score = 0;
  function shuffle(a) {
    for (var i = a.length-1; i > 0; i--) {
      var j = Math.floor(Math.random()*(i+1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function startGame() {
    shuffled = shuffle(items.slice());
    current = 0; score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    showItem();
  }
  function showItem() {
    if (current >= shuffled.length) { showResult(); return; }
    var it = shuffled[current];
    document.getElementById('bigIcon').textContent = it.icon;
    document.getElementById('bigName').textContent = it.name;
    document.getElementById('bigDesc').textContent = it.desc;
    document.getElementById('roundDisplay').textContent = 'Ερώτηση ' + (current+1) + '/' + shuffled.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('btnFile').classList.remove('disabled','correct','wrong');
    document.getElementById('btnFolder').classList.remove('disabled','correct','wrong');
  }
  function answer(ans) {
    var it = shuffled[current];
    var correct = (ans === it.type);
    document.getElementById('btnFile').classList.add('disabled');
    document.getElementById('btnFolder').classList.add('disabled');
    var fb = document.getElementById('feedback');
    if (correct) {
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      if (ans === 'file') document.getElementById('btnFile').classList.add('correct');
      else document.getElementById('btnFolder').classList.add('correct');
      fb.className = 'feedback show true';
      fb.textContent = '✅ Μπράβο! Το "' + it.name + '" είναι ' + (it.type === 'file' ? 'αρχείο' : 'φάκελος') + '!';
      setTimeout(function() { current++; showItem(); }, 1000);
    } else {
      if (ans === 'file') document.getElementById('btnFile').classList.add('wrong');
      else document.getElementById('btnFolder').classList.add('wrong');
      if (it.type === 'file') document.getElementById('btnFile').classList.add('reveal');
      else document.getElementById('btnFolder').classList.add('reveal');
      fb.className = 'feedback show false';
      fb.textContent = '❌ Το "' + it.name + '" είναι ' + (it.type === 'file' ? 'αρχείο' : 'φάκελος') + '!';
      setTimeout(function() { current++; showItem(); }, 1500);
    }
  }
  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var t = shuffled.length;
    var e,ti,m;
    if (score===t){e='🏆';ti='Τέλεια!';m='Ξεχωρίζεις αρχεία και φακέλους!'}
    else if(score>=6){e='🎉';ti='Μπράβο!';m='Τα πήγες πολύ καλά!'}
    else if(score>=4){e='👍';ti='Ωραία!';m='Δοκίμασε ξανά!'}
    else {e='💪';ti='Καλή αρχή!';m='Μην σταματάς!'}
    document.getElementById('resultEmoji').textContent = e;
    document.getElementById('resultTitle').textContent = ti;
    document.getElementById('resultMsg').textContent = 'Βρήκες '+score+' από '+t+' σωστά! '+m;
  }
  startGame();
</script>
</body>
</html>
