<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Στείλε το Μήνυμα 📨</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #7b1fa2, #ab47bc);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(123,31,162,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; text-shadow: 1px 1px 2px rgba(0,0,0,.2); }
  .header p { font-size: .9rem; opacity: .95; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #7b1fa2; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #f3e5f5; border: 2px dashed #ab47bc; border-radius: 16px;
    padding: 14px; margin-bottom: 14px; text-align: center;
    font-size: 1rem; color: #4a148c;
  }
  .mailbox {
    background: #fff; border-radius: 24px; padding: 16px;
    margin-bottom: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.08);
    text-align: center;
  }
  .mailbox-header { font-size: 1rem; font-weight: 700; color: #7b1fa2; margin-bottom: 8px; }
  .mail-mock {
    background: #f5f5f5; border-radius: 12px; padding: 14px; text-align: left;
    border: 1px solid #e0e0e0;
  }
  .mail-field { padding: 4px 0; font-size: .85rem; }
  .mail-field .mf-label { font-weight: 700; color: #7b1fa2; }
  .mail-field .mf-value { color: #333; }
  .mail-field .mf-input {
    display: inline-block; background: #fff; border: 2px dashed #bbb;
    border-radius: 8px; padding: 4px 12px; min-width: 120px; color: #999;
  }
  .action-area {
    background: #fff; border-radius: 20px; padding: 20px;
    margin-bottom: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.08);
    text-align: center;
  }
  .action-q { font-size: 1.1rem; font-weight: 700; color: #2d3436; margin-bottom: 14px; }
  .q-options { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 10px; }
  .q-opt {
    background: #fff; border: 3px solid #e0e0e0; border-radius: 14px;
    padding: 14px 10px; text-align: center; cursor: pointer;
    transition: all .2s; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .q-opt:active { transform: scale(.95); }
  .q-opt .qo-emoji { font-size: 2rem; }
  .q-opt .qo-text { font-size: .85rem; font-weight: 600; color: #555; margin-top: 4px; }
  .q-opt.correct { border-color: #28a745; background: #d4edda; animation: pop .4s ease; }
  .q-opt.wrong { border-color: #dc3545; background: #f8d7da; animation: shake .4s ease; }
  .q-opt.disabled { pointer-events: none; }
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .feedback { text-align:center; padding:14px; border-radius:16px; font-size:1.1rem; font-weight:700; margin-bottom:12px; display:none; }
  .feedback.show { display:block; }
  .feedback.yay { background:#d4edda; color:#155724; }
  .feedback.nay { background:#f8d7da; color:#721c24; }
  .result-screen { background:#fff; border-radius:24px; box-shadow:0 8px 28px rgba(0,0,0,.1); padding:40px 24px; text-align:center; display:none; }
  .result-screen .big-emoji{font-size:5rem;margin-bottom:12px}
  .result-screen h2{font-size:1.6rem;color:#2d3436;margin-bottom:8px}
  .result-screen p{font-size:1.1rem;color:#666;margin-bottom:20px}
  .btn-restart{background:linear-gradient(135deg,#7b1fa2,#ab47bc);color:#fff;border:none;border-radius:16px;padding:14px 36px;font-size:1.2rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(123,31,162,.35)}
  .btn-restart:active{transform:scale(.95)}
  @media(max-width:480px){body{padding:8px}.header h1{font-size:1.2rem}.q-options{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>📨 Στείλε το Μήνυμα</h1>
    <p>Βοήθησε την Υπατία να στείλει ένα μήνυμα στην e-me!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/6</span>
  </div>
  <div class="instructions">📩 Ακολούθησε τα βήματα για να σταλεί το μήνυμα!</div>
  <div id="gameArea">
    <div class="mailbox">
      <div class="mailbox-header">📬 Νέο Μήνυμα στην e-me</div>
      <div class="mail-mock">
        <div class="mail-field"><span class="mf-label">Προς:</span> <span class="mf-input" id="mailTo">???</span></div>
        <div class="mail-field"><span class="mf-label">Μήνυμα:</span> <span class="mf-input" id="mailMsg">???</span></div>
        <div class="mail-field" style="text-align:center;margin-top:8px;">
          <span style="background:#7b1fa2;color:#fff;border-radius:12px;padding:6px 20px;font-size:.9rem;font-weight:700;">Αποστολή</span>
        </div>
      </div>
    </div>
    <div class="action-area">
      <div class="action-q" id="actionQ">🔹 Τι γράφεις πρώτα;</div>
      <div class="q-options" id="qOptions"></div>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg"></p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var steps = [
    {q:'🔹 Τι γράφεις ΠΡΩΤΑ για να στείλεις μήνυμα;',
     opts:[{e:'👤',t:'Το όνομα του παραλήπτη',ans:true},{e:'📝',t:'Το μήνυμά σου',ans:false},{e:'📎',t:'Συνημμένο αρχείο',ans:false},{e:'🔙',t:'Πίσω',ans:false}],
     update: function(){document.getElementById('mailTo').textContent='Ήρωνας';}},
    {q:'🔹 Τι γράφεις ΜΕΤΑ;',
     opts:[{e:'👤',t:'Το όνομά σου',ans:false},{e:'📝',t:'Το μήνυμά σου',ans:true},{e:'📎',t:'Εικόνα',ans:false},{e:'📅',t:'Ημερομηνία',ans:false}],
     update: function(){document.getElementById('mailMsg').textContent='Γεια σου Ήρωνα! Τι κάνεις;';}},
    {q:'🔹 Τι πατάς στο ΤΕΛΟΣ για να φύγει το μήνυμα;',
     opts:[{e:'💾',t:'Αποθήκευση',ans:false},{e:'📨',t:'Αποστολή',ans:true},{e:'❌',t:'Διαγραφή',ans:false},{e:'🔙',t:'Πίσω',ans:false}],
     update: function(){document.querySelector('.mail-field:last-child span').style.background='#4caf50';}},
    {q:'🔹 Πού βλέπεις ότι έχεις νέο μήνυμα;',
     opts:[{e:'✉️',t:'Στο φακελάκι μηνυμάτων',ans:true},{e:'🔔',t:'Στο καμπανάκι',ans:false},{e:'👤',t:'Στο προφίλ',ans:false},{e:'🐝',t:'Στην κυψέλη',ans:false}],
     update: function(){}},
    {q:'🔹 Σε ποιους ΜΠΟΡΕΙΣ να στείλεις μήνυμα;',
     opts:[{e:'🌍',t:'Σε οποιονδήποτε στον κόσμο',ans:false},{e:'👥',t:'Μόνο σε όσους είναι στις επαφές μου',ans:true},{e:'📋',t:'Σε όλους όσους έχουν email',ans:false},{e:'🏫',t:'Σε όλο το σχολείο',ans:false}],
     update: function(){}},
    {q:'🔹 Αν λάβεις μήνυμα, τι κάνεις ΑΦΟΥ το διαβάσεις;',
     opts:[{e:'🗑️',t:'Το σβήνω αμέσως',ans:false},{e:'💬',t:'Απαντώ στο μήνυμα',ans:true},{e:'🔁',t:'Το προωθώ σε όλους',ans:false},{e:'📁',t:'Το αποθηκεύω μόνο',ans:false}],
     update: function(){}}
  ];
  var cur=0,score=0;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function startGame(){
    shuffle(steps);cur=0;score=0;
    document.getElementById('scoreDisplay').textContent='⭐ 0';
    document.getElementById('gameArea').style.display='block';
    document.getElementById('resultScreen').style.display='none';
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    document.getElementById('mailTo').textContent='???';
    document.getElementById('mailMsg').textContent='???';
    loadStep();
  }
  function loadStep(){
    if(cur>=steps.length){showResult();return;}
    var s=steps[cur];
    document.getElementById('roundDisplay').textContent=(cur+1)+'/'+steps.length;
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    document.getElementById('actionQ').textContent=s.q;
    var g=document.getElementById('qOptions');g.innerHTML='';
    for(var i=0;i<s.opts.length;i++){
      (function(idx){
        var o=document.createElement('div');o.className='q-opt';
        o.innerHTML='<div class="qo-emoji">'+s.opts[idx].e+'</div><div class="qo-text">'+s.opts[idx].t+'</div>';
        o.addEventListener('click',function(){choose(idx);});
        g.appendChild(o);
      })(i);
    }
  }
  function choose(idx){
    var s=steps[cur];var fb=document.getElementById('feedback');
    var opts=document.querySelectorAll('#qOptions .q-opt');
    for(var i=0;i<opts.length;i++)opts[i].classList.add('disabled');
    if(s.opts[idx].ans){score++;
      document.getElementById('scoreDisplay').textContent='⭐ '+score;
      opts[idx].classList.add('correct');
      if(s.update) s.update();
      fb.className='feedback show yay';fb.textContent='✅ Μπράβο! Συνέχισε!';
    }else{
      opts[idx].classList.add('wrong');
      for(var i=0;i<s.opts.length;i++){if(s.opts[i].ans){opts[i].classList.add('correct');break;}}
      fb.className='feedback show nay';fb.textContent='❌ Δεν είναι σωστό! Προσπάθησε ξανά!';
    }
    setTimeout(function(){cur++;loadStep();},1800);
  }
  function showResult(){
    document.getElementById('gameArea').style.display='none';
    document.getElementById('resultScreen').style.display='block';
    var total=steps.length,pct=score/total;
    var e,t,m;
    if(pct===1){e='🏆';t='Τέλεια!';m='Μπράβο! Μπορείς να στείλεις μήνυμα στην e-me μόνος σου!';}
    else if(pct>=0.75){e='🎉';t='Μπράβο!';m='Τα πήγες πολύ καλά!';}
    else if(pct>=0.5){e='👍';t='Ωραία!';m='Καλή προσπάθεια! Συνέχισε!';}
    else{e='💪';t='Καλή αρχή!';m='Προσπάθησε ξανά!';}
    document.getElementById('resultEmoji').textContent=e;
    document.getElementById('resultTitle').textContent=t;
    document.getElementById('resultMsg').textContent='Βρήκες '+score+' από '+total+' σωστά! '+m;
  }
  startGame();
</script>
</body>
</html>
