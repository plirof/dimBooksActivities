<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Μονό ή Διπλό; 👆👆</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #fff3e0, #ffe0b2, #ffcc80);
    padding: 12px; color: #333;
  }
  .app-container { max-width: 520px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 14px;
    background: linear-gradient(135deg, #ff9800, #f57c00);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(245,124,0,.35); margin-bottom: 16px;
  }
  .header h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .header p { font-size: 1rem; opacity: .9; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #e65100; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fff9db; border: 2px dashed #f0c040;
    border-radius: 16px; padding: 14px 16px; margin-bottom: 16px;
    font-size: 1.1rem; text-align: center; color: #6b5900; line-height: 1.5;
  }
  .action-show {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 32px 20px; text-align: center; margin-bottom: 16px;
  }
  .action-show .as-emoji { font-size: 4rem; display: block; margin-bottom: 10px; }
  .action-show .as-text { font-size: 1.3rem; font-weight: 700; color: #333; }
  .action-show .as-hint { font-size: 1rem; color: #888; margin-top: 6px; }
  .btn-pair {
    display: flex; gap: 16px; justify-content: center;
  }
  .click-btn {
    border: none; border-radius: 20px; padding: 20px 28px;
    font-size: 1.3rem; font-weight: 700; cursor: pointer; font-family: inherit;
    transition: all .15s; flex: 1; max-width: 180px;
    user-select: none; -webkit-tap-highlight-color: transparent;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,.1);
  }
  .click-btn:active { transform: scale(.95); }
  .click-btn:disabled { opacity: .4; transform: none !important; cursor: default; }
  .click-btn.single { background: linear-gradient(135deg, #66bb6a, #43a047); color: #fff; }
  .click-btn.single:active { box-shadow: 0 2px 8px rgba(67,160,71,.4); }
  .click-btn.double { background: linear-gradient(135deg, #42a5f5, #1e88e5); color: #fff; }
  .click-btn.double:active { box-shadow: 0 2px 8px rgba(30,136,229,.4); }
  .click-btn.correct-hit { animation: pop .35s ease; }
  .click-btn.wrong-hit { animation: shake .35s ease; }
  @keyframes pop { 0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)}30%{transform:translateX(-6px)}60%{transform:translateX(6px)} }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.05rem; font-weight: 700; display: none; margin-top: 16px;
  }
  .feedback.show { display: block; }
  .feedback.true { background: #d4edda; color: #155724; }
  .feedback.false { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #ff9800, #f57c00);
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 36px; font-size: 1.2rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(245,124,0,.35);
    transition: transform .15s;
  }
  .btn-restart:active { transform: scale(.95); }
  @media (max-width:480px) {
    .header h1 { font-size: 1.2rem; }
    .action-show .as-emoji { font-size: 3rem; }
    .click-btn { padding: 16px 20px; font-size: 1.1rem; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .btn-pair > * + * { margin-left: 16px; }
  .click-btn > * + * { margin-top: 8px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>👆👆 Μονό ή Διπλό;</h1>
    <p>Πάτα τη σωστή κίνηση!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">Ερώτηση 1/8</span>
  </div>
  <div class="instructions">
    👀 Κοίτα τι θέλεις να κάνεις. Πάτησε <strong>Μονό κλικ</strong> ή <strong>Διπλό κλικ</strong>!
  </div>
  <div id="gameArea">
    <div class="action-show">
      <span class="as-emoji" id="asEmoji">🔘</span>
      <span class="as-text" id="asText">Θέλω να επιλέξω ένα κουμπί</span>
      <span class="as-hint" id="asHint">Τι κλικ θα κάνω;</span>
    </div>
    <div class="btn-pair">
      <button class="click-btn single" id="btnSingle" onclick="pick(false)">
        <span>👆</span> Μονό κλικ
      </button>
      <button class="click-btn double" id="btnDouble" onclick="pick(true)">
        <span>👆👆</span> Διπλό κλικ
      </button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🏆</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Ξέρεις πότε να κάνεις μονό και πότε διπλό κλικ!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var questions = [
    { emoji: '🔘', text: 'Θέλω να επιλέξω ένα κουμπί', answer: false },
    { emoji: '🖥️', text: 'Θέλω να ανοίξω μια εφαρμογή', answer: true },
    { emoji: '📁', text: 'Θέλω να επιλέξω έναν φάκελο', answer: false },
    { emoji: '🎮', text: 'Θέλω να ανοίξω ένα παιχνίδι', answer: true },
    { emoji: '✏️', text: 'Θέλω να επιλέξω ένα εργαλείο', answer: false },
    { emoji: '📄', text: 'Θέλω να ανοίξω ένα έγγραφο', answer: true },
    { emoji: '🖼️', text: 'Θέλω να επιλέξω μια εικόνα', answer: false },
    { emoji: '🌐', text: 'Θέλω να ανοίξω τον φυλλομετρητή', answer: true }
  ];

  var shuffled = [];
  var current = 0, score = 0;

  function shuffle(a) {
    for (var i = a.length-1; i > 0; i--) {
      var j = Math.floor(Math.random()*(i+1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function startGame() {
    shuffled = shuffle(questions.slice());
    current = 0; score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    showQ();
  }

  function showQ() {
    if (current >= shuffled.length) { showResult(); return; }
    var q = shuffled[current];
    document.getElementById('asEmoji').textContent = q.emoji;
    document.getElementById('asText').textContent = q.text;
    document.getElementById('asHint').textContent = 'Τι κλικ θα κάνω;';
    document.getElementById('roundDisplay').textContent = 'Ερώτηση ' + (current+1) + '/' + shuffled.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('btnSingle').disabled = false;
    document.getElementById('btnDouble').disabled = false;
    document.getElementById('btnSingle').className = 'click-btn single';
    document.getElementById('btnDouble').className = 'click-btn double';
  }

  function pick(isDouble) {
    var q = shuffled[current];
    var correct = (isDouble === q.answer);
    document.getElementById('btnSingle').disabled = true;
    document.getElementById('btnDouble').disabled = true;
    var fb = document.getElementById('feedback');
    if (correct) {
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      var btn = isDouble ? document.getElementById('btnDouble') : document.getElementById('btnSingle');
      btn.classList.add('correct-hit');
      fb.className = 'feedback show true';
      fb.textContent = '✅ Μπράβο! ' + (isDouble ? 'Διπλό' : 'Μονό') + ' κλικ — σωστά!';
      setTimeout(function() { current++; showQ(); }, 1000);
    } else {
      var btn = isDouble ? document.getElementById('btnDouble') : document.getElementById('btnSingle');
      btn.classList.add('wrong-hit');
      var correctBtn = q.answer ? document.getElementById('btnDouble') : document.getElementById('btnSingle');
      correctBtn.style.boxShadow = '0 0 0 3px #43a047, 0 4px 14px rgba(0,0,0,.1)';
      fb.className = 'feedback show false';
      fb.textContent = '❌ Εδώ θέλει ' + (q.answer ? 'Διπλό' : 'Μονό') + ' κλικ!';
      setTimeout(function() { current++; showQ(); }, 1400);
    }
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var t = shuffled.length;
    var e, ti, m;
    if (score === t) { e = '🏆'; ti = 'Τέλεια!'; m = 'Ξέρεις ακριβώς πότε να κάνεις μονό και πότε διπλό κλικ!' }
    else if (score >= 6) { e = '🎉'; ti = 'Μπράβο!'; m = 'Τα πήγες πολύ καλά!' }
    else if (score >= 4) { e = '👍'; ti = 'Ωραία!'; m = 'Δοκίμασε ξανά!' }
    else { e = '💪'; ti = 'Καλή αρχή!'; m = 'Μονό για επιλογή, διπλό για άνοιγμα!' }
    document.getElementById('resultEmoji').textContent = e;
    document.getElementById('resultTitle').textContent = ti;
    document.getElementById('resultMsg').textContent = 'Βρήκες ' + score + ' από ' + t + ' σωστά! ' + m;
  }

  startGame();
</script>
</body>
</html>
