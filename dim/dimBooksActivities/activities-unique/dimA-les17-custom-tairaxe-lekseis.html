<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ταίριαξε τις λέξεις! 🧩</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #e8f5e9, #c8e6c9, #a5d6a7);
    padding: 12px; color: #333;
  }
  .app-container { max-width: 520px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 14px;
    background: linear-gradient(135deg, #43a047, #2e7d32);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(46,125,50,.35); margin-bottom: 16px;
  }
  .header h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .header p { font-size: 1rem; opacity: .9; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #2e7d32; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fff9db; border: 2px dashed #f0c040;
    border-radius: 16px; padding: 14px 16px; margin-bottom: 16px;
    font-size: 1.1rem; text-align: center; color: #6b5900; line-height: 1.5;
  }
  .category-grid {
    display: grid; grid-template-columns: 1fr 1fr; grid-gap: 14px;
    margin-bottom: 16px;
  }
  .category-card {
    background: #fff; border: 3px solid #e0e0e0;
    border-radius: 20px; padding: 16px; text-align: center;
    min-height: 160px;
    box-shadow: 0 4px 16px rgba(0,0,0,.06);
    transition: border-color .2s;
  }
  .category-card .cc-emoji { font-size: 2.5rem; display: block; margin-bottom: 6px; }
  .category-card .cc-name { font-size: 1.1rem; font-weight: 700; color: #333; }
  .category-card .cc-items {
    display: flex; flex-wrap: wrap; gap: 6px;
    justify-content: center; margin-top: 10px; min-height: 40px;
  }
  .category-card .cc-item {
    background: #e8f5e9; border-radius: 10px;
    padding: 6px 12px; font-size: .9rem; font-weight: 600;
    border: 2px solid #a5d6a7;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .word-tray {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; padding: 16px;
    background: #fff; border-radius: 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
    margin-bottom: 16px; min-height: 60px;
  }
  .tray-word {
    background: #fff; border: 2px solid #66bb6a;
    border-radius: 14px; padding: 10px 18px;
    font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: all .2s;
    user-select: none; -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; gap: 6px;
  }
  .tray-word:active { transform: scale(.95); }
  .tray-word.placed { opacity: .35; pointer-events: none; }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; display: none; margin-top: 12px;
  }
  .feedback.show { display: block; }
  .feedback.true { background: #d4edda; color: #155724; }
  .feedback.false { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #43a047, #2e7d32);
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 36px; font-size: 1.2rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(46,125,50,.35);
    transition: transform .15s;
  }
  .btn-restart:hover { transform: scale(1.05); }
  @media (max-width:480px) {
    .header h1 { font-size: 1.2rem; }
    .category-card { padding: 12px; }
    .tray-word { padding: 8px 12px; font-size: .9rem; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .category-card .cc-items > * { margin: 3px; }
  .category-card .cc-item > * + * { margin-left: 4px; }
  .word-tray > * { margin: 5px; }
  .tray-word > * + * { margin-left: 6px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🧩 Ταίριαξε τις λέξεις!</h1>
    <p>Βάλε κάθε λέξη στη σωστή κατηγορία</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">Κατηγορίες 1/3</span>
  </div>
  <div class="instructions">
    👆 Πάτησε μια λέξη και μετά πάτησε την κατηγορία που ταιριάζει!
  </div>
  <div id="gameArea">
    <div class="category-grid" id="categoryGrid"></div>
    <div class="word-tray" id="wordTray"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🏆</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Ταίριαξες όλες τις λέξεις!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var levels = [
    {
      categories: [
        { emoji: '🐾', name: 'Ζώα' },
        { emoji: '🍎', name: 'Φρούτα' }
      ],
      words: [
        { text: 'Σκύλος', emoji: '🐶', cat: 0 },
        { text: 'Μήλο', emoji: '🍎', cat: 1 },
        { text: 'Γάτα', emoji: '🐱', cat: 0 },
        { text: 'Μπανάνα', emoji: '🍌', cat: 1 },
        { text: 'Ελέφαντας', emoji: '🐘', cat: 0 },
        { text: 'Πορτοκάλι', emoji: '🍊', cat: 1 }
      ]
    },
    {
      categories: [
        { emoji: '🏠', name: 'Σπίτι' },
        { emoji: '🏫', name: 'Σχολείο' }
      ],
      words: [
        { text: 'Κρεβάτι', emoji: '🛏️', cat: 0 },
        { text: 'Θρανίο', emoji: '🪑', cat: 1 },
        { text: 'Κουζίνα', emoji: '🍳', cat: 0 },
        { text: 'Πίνακας', emoji: '🖊️', cat: 1 },
        { text: 'Καναπές', emoji: '🛋️', cat: 0 },
        { text: 'Βιβλιοθήκη', emoji: '📚', cat: 1 }
      ]
    },
    {
      categories: [
        { emoji: '☀️', name: 'Καλοκαίρι' },
        { emoji: '❄️', name: 'Χειμώνας' }
      ],
      words: [
        { text: 'Παγωτό', emoji: '🍦', cat: 0 },
        { text: 'Χιόνι', emoji: '⛄', cat: 1 },
        { text: 'Θάλασσα', emoji: '🌊', cat: 0 },
        { text: 'Ζεστή σούπα', emoji: '🍜', cat: 1 },
        { text: 'Ηλιος', emoji: '☀️', cat: 0 },
        { text: 'Κασκόλ', emoji: '🧣', cat: 1 }
      ]
    }
  ];

  var currentLevel = 0;
  var placed = 0;
  var total = 0;
  var score = 0;
  var selectedWord = null;

  function startGame() {
    currentLevel = 0; score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    loadLevel();
  }

  function shuffle(a) {
    for (var i = a.length-1; i > 0; i--) {
      var j = Math.floor(Math.random()*(i+1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function loadLevel() {
    if (currentLevel >= levels.length) { showResult(); return; }
    var lv = levels[currentLevel];
    placed = 0;
    total = lv.words.length;
    selectedWord = null;
    document.getElementById('roundDisplay').textContent = 'Κατηγορίες ' + (currentLevel+1) + '/' + levels.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';

    var cg = document.getElementById('categoryGrid');
    cg.innerHTML = '';
    for (var i = 0; i < lv.categories.length; i++) {
      var c = lv.categories[i];
      var card = document.createElement('div');
      card.className = 'category-card';
      card.setAttribute('data-cat', i);
      card.innerHTML = '<span class="cc-emoji">' + c.emoji + '</span><span class="cc-name">' + c.name + '</span><div class="cc-items" id="catItems' + i + '"></div>';
      card.addEventListener('click', function() { placeWord(this.getAttribute('data-cat')); });
      cg.appendChild(card);
    }

    var words = lv.words.slice();
    shuffle(words);
    var wt = document.getElementById('wordTray');
    wt.innerHTML = '';
    for (var i = 0; i < words.length; i++) {
      var w = words[i];
      var chip = document.createElement('div');
      chip.className = 'tray-word';
      chip.setAttribute('data-idx', i);
      chip.innerHTML = w.emoji + ' ' + w.text;
      chip.addEventListener('click', function() {
        if (this.classList.contains('placed')) return;
        if (selectedWord) selectedWord.style.borderColor = '#66bb6a';
        selectedWord = this;
        this.style.borderColor = '#2e7d32';
      });
      wt.appendChild(chip);
    }
  }

  function placeWord(catIdx) {
    if (!selectedWord) {
      var fb = document.getElementById('feedback');
      fb.className = 'feedback show false';
      fb.textContent = '👆 Πάτησε πρώτα μια λέξη από κάτω!';
      setTimeout(function() { fb.style.display = 'none'; }, 1000);
      return;
    }
    var lv = levels[currentLevel];
    var idx = parseInt(selectedWord.getAttribute('data-idx'));
    var wordData = lv.words[idx];
    if (parseInt(catIdx) === wordData.cat) {
      selectedWord.classList.add('placed');
      var items = document.getElementById('catItems' + catIdx);
      var item = document.createElement('span');
      item.className = 'cc-item';
      item.textContent = wordData.emoji + ' ' + wordData.text;
      items.appendChild(item);
      placed++;
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      var fb = document.getElementById('feedback');
      fb.className = 'feedback show true';
      fb.textContent = '✅ Μπράβο! Το ' + wordData.text + ' ανήκει στα ' + lv.categories[catIdx].name + '!';
      setTimeout(function() { fb.style.display = 'none'; }, 800);
      selectedWord = null;
      if (placed >= total) {
        setTimeout(function() { currentLevel++; loadLevel(); }, 1000);
      }
    } else {
      var fb = document.getElementById('feedback');
      fb.className = 'feedback show false';
      fb.textContent = '❌ Το ' + wordData.text + ' δεν ανήκει εδώ!';
      setTimeout(function() { fb.style.display = 'none'; }, 1000);
    }
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var t = levels.length * 6;
    var e, ti, m;
    if (score === t) { e = '🏆'; ti = 'Τέλεια!'; m = 'Ταίριαξες όλες τις λέξεις σωστά!' }
    else if (score >= t-3) { e = '🎉'; ti = 'Μπράβο!'; m = 'Σχεδόν όλες σωστά!' }
    else if (score >= t/2) { e = '👍'; ti = 'Ωραία!'; m = 'Δοκίμασε ξανά!' }
    else { e = '💪'; ti = 'Καλή προσπάθεια!'; m = 'Κάθε λέξη έχει τη δική της κατηγορία!' }
    document.getElementById('resultEmoji').textContent = e;
    document.getElementById('resultTitle').textContent = ti;
    document.getElementById('resultMsg').textContent = 'Ταίριαξες ' + score + ' από ' + t + ' λέξεις! ' + m;
  }

  startGame();
</script>
</body>
</html>
