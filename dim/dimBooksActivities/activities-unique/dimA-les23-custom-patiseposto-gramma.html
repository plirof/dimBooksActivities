<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Πάτησε το σωστό γράμμα! 🔤</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #fff8e1, #ffecb3, #ffe082);
    padding: 12px; color: #333;
  }
  .app-container { max-width: 520px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 14px;
    background: linear-gradient(135deg, #fdd835, #f9a825);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(249,168,37,.35); margin-bottom: 16px;
  }
  .header h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .header p { font-size: 1rem; opacity: .9; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #f57f17; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fff9db; border: 2px dashed #f0c040;
    border-radius: 16px; padding: 14px 16px; margin-bottom: 16px;
    font-size: 1.1rem; text-align: center; color: #6b5900; line-height: 1.5;
  }
  .word-show {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 28px 20px; text-align: center; margin-bottom: 16px;
  }
  .word-show .ws-emoji { font-size: 4rem; display: block; margin-bottom: 8px; }
  .word-show .ws-word {
    font-size: 2rem; font-weight: 700; color: #333;
    letter-spacing: 8px; margin-bottom: 8px;
  }
  .word-show .ws-hint { font-size: 1rem; color: #888; }
  .missing-box {
    display: inline-block; min-width: 40px; height: 50px;
    border-bottom: 4px solid #f57f17;
    margin: 0 2px; vertical-align: middle;
    line-height: 50px; font-size: 1.8rem; font-weight: 700;
    color: #f57f17;
  }
  .letter-grid {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; padding: 16px;
    background: #fff; border-radius: 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
    min-height: 80px;
  }
  .letter-btn {
    background: #fff; border: 3px solid #ffe082;
    border-radius: 14px; width: 52px; height: 52px;
    font-size: 1.4rem; font-weight: 700; cursor: pointer;
    transition: all .15s; font-family: inherit;
    user-select: none; -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; justify-content: center;
  }
  .letter-btn:active { transform: scale(.9); }
  .letter-btn:disabled { opacity: .3; transform: none !important; cursor: default; }
  .letter-btn.correct { background: #c8e6c9; border-color: #43a047; }
  .letter-btn.wrong { background: #ffcdd2; border-color: #e53935; animation: shake .3s ease; }
  @keyframes shake { 0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}60%{transform:translateX(5px)} }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.05rem; font-weight: 700; display: none; margin-top: 12px;
  }
  .feedback.show { display: block; }
  .feedback.true { background: #d4edda; color: #155724; }
  .feedback.false { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #fdd835, #f9a825);
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 36px; font-size: 1.2rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(249,168,37,.35);
    transition: transform .15s;
  }
  .btn-restart:active { transform: scale(.95); }
  @media (max-width:480px) {
    .header h1 { font-size: 1.2rem; }
    .word-show .ws-word { font-size: 1.6rem; letter-spacing: 6px; }
    .letter-btn { width: 46px; height: 46px; font-size: 1.2rem; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .letter-grid > * { margin: 5px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🔤 Πάτησε το σωστό γράμμα!</h1>
    <p>Συμπλήρωσε τη λέξη!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">Λέξη 1/8</span>
  </div>
  <div class="instructions">
    👀 Κοίτα την εικόνα και βρες ποιο γράμμα λείπει από τη λέξη!
  </div>
  <div id="gameArea">
    <div class="word-show">
      <span class="ws-emoji" id="wsEmoji">🐶</span>
      <div class="ws-word" id="wsWord">Σ Κ Υ Λ Ο _</div>
      <span class="ws-hint" id="wsHint">Ποιο γράμμα λείπει;</span>
    </div>
    <div class="letter-grid" id="letterGrid"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🏆</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Συμπλήρωσες όλες τις λέξεις!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var words = [
    { emoji: '🐶', word: 'ΣΚΥΛΟΣ', missing: 'Σ', display: 'Σ Κ Υ Λ Ο _', hint: 'Το τελευταίο γράμμα' },
    { emoji: '🐱', word: 'ΓΑΤΑ', missing: 'Τ', display: 'Γ Α _ Α', hint: 'Το τρίτο γράμμα' },
    { emoji: '🌸', word: 'ΛΟΥΛΟΥΔΙ', missing: 'Υ', display: 'Λ Ο _ Λ Ο Υ Δ Ι', hint: 'Το τρίτο γράμμα' },
    { emoji: '🌊', word: 'ΘΑΛΑΣΣΑ', missing: 'Λ', display: 'Θ Α _ Α Σ Σ Α', hint: 'Το τρίτο γράμμα' },
    { emoji: '🍎', word: 'ΜΗΛΟ', missing: 'Λ', display: 'Μ Η _ Ο', hint: 'Το τρίτο γράμμα' },
    { emoji: '🌟', word: 'ΑΣΤΕΡΙ', missing: 'Τ', display: 'Α Σ _ Ε Ρ Ι', hint: 'Το τρίτο γράμμα' },
    { emoji: '🐘', word: 'ΕΛΕΦΑΝΤΑΣ', missing: 'Φ', display: 'Ε Λ Ε _ Α Ν Τ Α Σ', hint: 'Το τέταρτο γράμμα' },
    { emoji: '🚗', word: 'ΑΥΤΟΚΙΝΗΤΟ', missing: 'Κ', display: 'Α Υ Τ Ο _ Ι Ν Η Τ Ο', hint: 'Το πέμπτο γράμμα' }
  ];

  var allLetters = ['Α','Β','Γ','Δ','Ε','Ζ','Η','Θ','Ι','Κ','Λ','Μ','Ν','Ξ','Ο','Π','Ρ','Σ','Τ','Υ','Φ','Χ','Ψ','Ω'];

  var shuffled = [];
  var current = 0, score = 0;

  function shuffle(a) {
    for (var i = a.length-1; i > 0; i--) {
      var j = Math.floor(Math.random()*(i+1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function startGame() {
    shuffled = shuffle(words.slice());
    current = 0; score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    showWord();
  }

  function showWord() {
    if (current >= shuffled.length) { showResult(); return; }
    var w = shuffled[current];
    document.getElementById('wsEmoji').textContent = w.emoji;
    document.getElementById('wsWord').textContent = w.display;
    document.getElementById('wsHint').textContent = w.hint;
    document.getElementById('roundDisplay').textContent = 'Λέξη ' + (current+1) + '/' + shuffled.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';

    var grid = document.getElementById('letterGrid');
    grid.innerHTML = '';
    var options = [w.missing];
    var pool = allLetters.filter(function(l) { return l !== w.missing; });
    shuffle(pool);
    for (var i = 0; i < 3; i++) options.push(pool[i]);
    shuffle(options);
    for (var i = 0; i < options.length; i++) {
      var btn = document.createElement('button');
      btn.className = 'letter-btn';
      btn.textContent = options[i];
      btn.setAttribute('data-letter', options[i]);
      btn.addEventListener('click', function() { pickLetter(this); });
      grid.appendChild(btn);
    }
  }

  function pickLetter(el) {
    var w = shuffled[current];
    var letter = el.getAttribute('data-letter');
    var correct = (letter === w.missing);
    var all = document.querySelectorAll('.letter-btn');
    for (var i = 0; i < all.length; i++) all[i].disabled = true;
    var fb = document.getElementById('feedback');
    if (correct) {
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      el.classList.add('correct');
      document.getElementById('wsWord').textContent = w.word.split('').join(' ');
      fb.className = 'feedback show true';
      fb.textContent = '✅ Μπράβο! ' + w.word + '!';
      setTimeout(function() { current++; showWord(); }, 1200);
    } else {
      el.classList.add('wrong');
      for (var i = 0; i < all.length; i++) {
        if (all[i].getAttribute('data-letter') === w.missing) all[i].classList.add('correct');
      }
      fb.className = 'feedback show false';
      fb.textContent = '❌ Το σωστό γράμμα είναι το ' + w.missing + '!';
      setTimeout(function() { current++; showWord(); }, 1400);
    }
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var t = shuffled.length;
    var e, ti, m;
    if (score === t) { e = '🏆'; ti = 'Τέλεια!'; m = 'Ξέρεις όλα τα γράμματα στο πληκτρολόγιο!' }
    else if (score >= 6) { e = '🎉'; ti = 'Μπράβο!'; m = 'Τα πήγες πολύ καλά!' }
    else if (score >= 4) { e = '👍'; ti = 'Ωραία!'; m = 'Δοκίμασε ξανά!' }
    else { e = '💪'; ti = 'Καλή αρχή!'; m = 'Κάθε γράμμα έχει τη θέση του!' }
    document.getElementById('resultEmoji').textContent = e;
    document.getElementById('resultTitle').textContent = ti;
    document.getElementById('resultMsg').textContent = 'Βρήκες ' + score + ' από ' + t + ' γράμματα! ' + m;
  }

  startGame();
</script>
</body>
</html>
