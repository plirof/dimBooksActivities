<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Τι κάνει αυτή η συσκευή; 🎯</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
    padding: 12px;
    color: #333;
  }
  .app-container {
    max-width: 560px;
    margin: 0 auto;
  }
  .header {
    text-align: center;
    padding: 20px 16px 14px;
    background: linear-gradient(135deg, #f093fb, #f5576c);
    border-radius: 20px;
    color: #fff;
    box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
    margin-bottom: 16px;
  }
  .header h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .header p { font-size: 1rem; opacity: .9; }
  .info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    border-radius: 16px;
    padding: 10px 18px;
    margin-bottom: 16px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #f5576c; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fff9db;
    border: 2px dashed #f0c040;
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 16px;
    font-size: 1.1rem;
    text-align: center;
    line-height: 1.5;
    color: #6b5900;
  }
  .device-card {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 32px 20px;
    text-align: center;
    margin-bottom: 20px;
  }
  .device-card .main-emoji {
    font-size: 6rem;
    display: block;
    margin-bottom: 8px;
  }
  .device-card .main-name {
    font-size: 1.6rem;
    font-weight: 700;
    color: #2d3436;
  }
  .device-card.pop .main-emoji {
    animation: popIn .4s ease;
  }
  @keyframes popIn {
    0% { transform: scale(.5); opacity: 0; }
    70% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
  }
  .question-box {
    background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
    border-radius: 18px;
    padding: 14px 18px;
    margin-bottom: 16px;
    text-align: center;
    font-size: 1.15rem;
    font-weight: 700;
    color: #1b5e20;
  }
  .actions-grid {
    display: grid;
    grid-gap: 10px;
    margin-bottom: 16px;
  }
  .action-card {
    background: #fff;
    border: 3px solid #e0e0e0;
    border-radius: 16px;
    padding: 18px 16px;
    text-align: center;
    cursor: pointer;
    transition: all .2s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-size: 1.1rem;
    font-weight: 600;
    color: #333;
    font-family: inherit;
  }
  .action-card:hover:not(.disabled) {
    border-color: #f5576c;
    background: #fff0f3;
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(245,87,108,.15);
  }
  .action-card:active:not(.disabled) { transform: scale(.96); }
  .action-card.correct {
    border-color: #28a745;
    background: #d4edda;
    animation: pulseGreen .4s ease;
  }
  .action-card.wrong {
    border-color: #dc3545;
    background: #f8d7da;
    animation: shake .35s ease;
  }
  .action-card.disabled { pointer-events: none; opacity: .6; }
  .action-card.reveal { border-color: #28a745; background: #d4edda; opacity: 1; }
  @keyframes pulseGreen {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    30% { transform: translateX(-5px); }
    60% { transform: translateX(5px); }
  }
  .feedback {
    text-align: center;
    padding: 14px;
    border-radius: 16px;
    font-size: 1.1rem;
    font-weight: 700;
    display: none;
  }
  .feedback.show { display: block; margin-bottom: 12px; }
  .feedback.true { background: #d4edda; color: #155724; }
  .feedback.false { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px;
    text-align: center;
    display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #f093fb, #f5576c);
    color: #fff;
    border: none;
    border-radius: 16px;
    padding: 14px 36px;
    font-size: 1.2rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(245,87,108,.35);
    transition: transform .15s;
  }
  .btn-restart:hover { transform: scale(1.05); }
  @media (max-width: 480px) {
    body { padding: 8px; }
    .header h1 { font-size: 1.2rem; }
    .device-card .main-emoji { font-size: 4.5rem; }
    .device-card .main-name { font-size: 1.3rem; }
    .action-card { padding: 14px 12px; font-size: 1rem; }
  }
</style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>🎯 Τι Κάνει Αυτή η Συσκευή;</h1>
    <p>Διάλεξε τη σωστή απάντηση!</p>
  </div>

  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">Γύρος 1/6</span>
  </div>

  <div class="instructions">
    👀 Κοίτα τη συσκευή και βρες τι κάνει!
  </div>

  <div id="gameArea">
    <div class="device-card" id="deviceCard">
      <span class="main-emoji" id="mainEmoji">🖱️</span>
      <div class="main-name" id="mainName">Ποντίκι</div>
    </div>

    <div class="question-box">🤔 Τι κάνει το <span id="questionDevice">ποντίκι</span>;</div>

    <div class="actions-grid" id="actionsGrid"></div>

    <div class="feedback" id="feedback"></div>
  </div>

  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>

<script>
  var rounds = [
    {
      emoji: '🖱️',
      name: 'Ποντίκι',
      actions: [
        'Δείχνω και πατάω στην οθόνη 🖱️',
        'Γράφω γράμματα ✏️',
        'Ακούω μουσική 🎵'
      ],
      answer: 0
    },
    {
      emoji: '⌨️',
      name: 'Πληκτρολόγιο',
      actions: [
        'Χτυπάω παλαμάκια 👏',
        'Γράφω γράμματα και αριθμούς ⌨️',
        'Βλέπω ταινία 🎬'
      ],
      answer: 1
    },
    {
      emoji: '🖥️',
      name: 'Οθόνη',
      actions: [
        'Ακούω ήχους 👂',
        'Μιλάω στο τηλέφωνο 📞',
        'Βλέπω χρώματα και σχήματα 🖥️'
      ],
      answer: 2
    },
    {
      emoji: '📷',
      name: 'Κάμερα',
      actions: [
        'Βάζω φωτογραφίες στον υπολογιστή 📷',
        'Κουνάω το ποντίκι 🖱️',
        'Γράφω γράμματα ✏️'
      ],
      answer: 0
    },
    {
      emoji: '🎤',
      name: 'Μικρόφωνο',
      actions: [
        'Βλέπω εικόνες 🖼️',
        'Βάζω ήχους και φωνή στον υπολογιστή 🎤',
        'Πατάω πλήκτρα ⌨️'
      ],
      answer: 1
    },
    {
      emoji: '🔊',
      name: 'Ηχεία',
      actions: [
        'Γράφω γράμματα ✏️',
        'Βγάζω φωτογραφίες 📸',
        'Ακούω ήχους και μουσική 🔊'
      ],
      answer: 2
    }
  ];

  var currentIndex = 0;
  var score = 0;

  function startGame() {
    currentIndex = 0;
    score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    showRound();
  }

  function showRound() {
    if (currentIndex >= rounds.length) {
      showResult();
      return;
    }
    var r = rounds[currentIndex];
    document.getElementById('mainEmoji').textContent = r.emoji;
    document.getElementById('mainName').textContent = r.name;
    document.getElementById('questionDevice').textContent = r.name;
    document.getElementById('roundDisplay').textContent = 'Γύρος ' + (currentIndex + 1) + '/' + rounds.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';

    var card = document.getElementById('deviceCard');
    card.classList.remove('pop');
    void card.offsetWidth;
    card.classList.add('pop');

    var grid = document.getElementById('actionsGrid');
    grid.innerHTML = '';
    for (var i = 0; i < r.actions.length; i++) {
      var ac = document.createElement('div');
      ac.className = 'action-card';
      ac.setAttribute('data-index', i);
      ac.textContent = r.actions[i];
      ac.addEventListener('click', function(e) { pickAction(this); });
      grid.appendChild(ac);
    }
  }

  function pickAction(el) {
    var r = rounds[currentIndex];
    var chosen = parseInt(el.getAttribute('data-index'));
    var correct = (chosen === r.answer);

    var cards = document.querySelectorAll('.action-card');
    for (var i = 0; i < cards.length; i++) {
      cards[i].classList.add('disabled');
    }

    var fb = document.getElementById('feedback');

    if (correct) {
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      el.classList.add('correct');
      fb.className = 'feedback show true';
      fb.textContent = '✅ Ναι! Το ' + r.name + ' ' + r.actions[r.answer].toLowerCase() + '!';
      setTimeout(function() {
        currentIndex++;
        showRound();
      }, 1200);
    } else {
      el.classList.add('wrong');
      cards[r.answer].classList.add('reveal');
      fb.className = 'feedback show false';
      fb.textContent = '❌ Το ' + r.name + ' ' + r.actions[r.answer].toLowerCase() + '!';
      setTimeout(function() {
        currentIndex++;
        showRound();
      }, 1800);
    }
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var total = rounds.length;
    var emoji, title, msg;
    if (score === total) {
      emoji = '🏆'; title = 'Τέλεια!'; msg = 'Ξέρεις όλες τις συσκευές του υπολογιστή! Μπράβο σου!';
    } else if (score >= 4) {
      emoji = '🎉'; title = 'Μπράβο!'; msg = 'Τα πήγες πολύ καλά! Συνέχισε έτσι!';
    } else if (score >= 3) {
      emoji = '👍'; title = 'Ωραία!'; msg = 'Καλή προσπάθεια! Δοκίμασε ξανά!';
    } else {
      emoji = '💪'; title = 'Καλή αρχή!'; msg = 'Μην σταματάς! Δοκίμασε ξανά!';
    }
    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultMsg').textContent = 'Βρήκες ' + score + ' από ' + total + ' σωστά! ' + msg;
  }

  startGame();
</script>
</body>
</html>
