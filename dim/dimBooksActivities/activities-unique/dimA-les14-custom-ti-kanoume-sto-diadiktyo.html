<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Τι κάνουμε στο Διαδίκτυο; 🌍</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    padding: 12px; color: #333;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 14px;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(79,172,254,.4); margin-bottom: 16px;
  }
  .header h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .header p { font-size: 1rem; opacity: .9; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #4facfe; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #e8f4fd; border: 2px dashed #4facfe;
    border-radius: 16px; padding: 14px 16px; margin-bottom: 16px;
    font-size: 1.1rem; text-align: center; color: #0c5460;
  }
  .card-area {
    display: grid; grid-template-columns: 1fr 1fr; grid-gap: 12px;
    margin-bottom: 12px;
  }
  .activity-card {
    background: #fff; border: 3px solid #e0e0e0; border-radius: 18px;
    padding: 20px 12px; text-align: center; cursor: pointer;
    transition: all .2s ease;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .activity-card:hover:not(.disabled) {
    border-color: #4facfe; transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(79,172,254,.15);
  }
  .activity-card:active:not(.disabled) { transform: scale(.95); }
  .activity-card .ac-emoji { font-size: 3rem; margin-bottom: 6px; }
  .activity-card .ac-title { font-size: 1rem; font-weight: 700; color: #333; }
  .activity-card.selected { border-color: #4facfe; background: #e8f4fd; }
  .activity-card.correct { border-color: #28a745; background: #d4edda; animation: pop .3s ease; }
  .activity-card.wrong { border-color: #dc3545; background: #f8d7da; animation: shake .35s ease; }
  .activity-card.disabled { pointer-events: none; opacity: .5; }
  .activity-card.reveal-correct { border-color: #28a745; background: #d4edda; opacity: 1; }
  .activity-card.reveal-wrong { border-color: #dc3545; background: #f8d7da; opacity: 1; }
  @keyframes pop { 0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}60%{transform:translateX(5px)} }
  .q-text {
    text-align: center; font-size: 1.2rem; font-weight: 700;
    color: #2d3436; margin-bottom: 16px; line-height: 1.5;
  }
  .btn-check {
    background: linear-gradient(135deg, #43e97b, #38f9d7);
    border: none; border-radius: 16px; padding: 14px 32px;
    font-size: 1.2rem; font-weight: 700; cursor: pointer;
    font-family: inherit; color: #fff; display: block;
    margin: 0 auto 12px; box-shadow: 0 4px 14px rgba(67,233,123,.3);
    transition: transform .15s;
  }
  .btn-check:hover { transform: scale(1.05); }
  .btn-check:disabled { opacity: .4; cursor: default; transform: none !important; }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.05rem; font-weight: 700; display: none;
  }
  .feedback.show { display: block; margin-bottom: 12px; }
  .feedback.true { background: #d4edda; color: #155724; }
  .feedback.false { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 36px; font-size: 1.2rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(79,172,254,.35);
    transition: transform .15s;
  }
  .btn-restart:hover { transform: scale(1.05); }
  @media (max-width:480px) {
    .header h1 { font-size: 1.2rem; }
    .activity-card .ac-emoji { font-size: 2.5rem; }
    .card-area { grid-gap: 8px; }
  }
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🌍 Τι κάνουμε στο Διαδίκτυο;</h1>
    <p>Διάλεξε ό,τι μπορείς να κάνεις!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">Γύρος 1/5</span>
  </div>
  <div class="instructions">👇 Διάλεξε όλες τις δραστηριότητες που μπορείς να κάνεις <strong>με το διαδίκτυο</strong>!</div>
  <div id="gameArea">
    <div class="q-text" id="qText">Τι μπορείς να κάνεις με το διαδίκτυο;</div>
    <div class="card-area" id="cardArea"></div>
    <button class="btn-check" id="btnCheck" onclick="checkAnswers()">✅ Έλεγχος!</button>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var rounds = [
    { q: '📧 Τι μπορείς να κάνεις με το διαδίκτυο;',
      cards: [
        { emoji: '📧', title: 'Στέλνω e-mail', internet: true },
        { emoji: '📺', title: 'Βλέπω βίντεο', internet: true },
        { emoji: '📚', title: 'Διαβάζω βιβλίο', internet: false },
        { emoji: '📞', title: 'Βιντεοκλήση', internet: true }
      ] },
    { q: '🌐 Ποιες δουλειές γίνονται με το διαδίκτυο;',
      cards: [
        { emoji: '🎮', title: 'Παίζω online', internet: true },
        { emoji: '🏀', title: 'Παίζω μπάλα', internet: false },
        { emoji: '🎵', title: 'Ακούω μουσική', internet: true },
        { emoji: '✉️', title: 'Στέλνω γράμμα', internet: false }
      ] },
    { q: '💻 Τι κάνουμε όταν είμαστε συνδεδεμένοι;',
      cards: [
        { emoji: '🗺️', title: 'Βλέπω χάρτη', internet: true },
        { emoji: '🧸', title: 'Παίζω με αρκουδάκι', internet: false },
        { emoji: '🌤️', title: 'Βλέπω καιρό', internet: true },
        { emoji: '🎨', title: 'Ζωγραφίζω σε χαρτί', internet: false }
      ] },
    { q: '🔍 Ποια από αυτά θέλουν διαδίκτυο;',
      cards: [
        { emoji: '📖', title: 'Διαβάζω βιβλίο', internet: false },
        { emoji: '📸', title: 'Μοιράζομαι φωτογραφίες', internet: true },
        { emoji: '🎬', title: 'Βλέπω ταινία online', internet: true },
        { emoji: '🖍️', title: 'Χρωματίζω', internet: false }
      ] },
    { q: '📡 Ποια δραστηριότητα χρειάζεται ίντερνετ;',
      cards: [
        { emoji: '📱', title: 'Μηνύματα με φίλους', internet: true },
        { emoji: '🏃', title: 'Τρέχω στην αυλή', internet: false },
        { emoji: '🎓', title: 'Μαθαίνω online', internet: true },
        { emoji: '🍪', title: 'Φτιάχνω μπισκότα', internet: false }
      ] }
  ];
  var current = 0; var score = 0;
  function startGame() {
    current = 0; score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    loadRound();
  }
  function loadRound() {
    if (current >= rounds.length) { showResult(); return; }
    var r = rounds[current];
    document.getElementById('qText').textContent = r.q;
    document.getElementById('roundDisplay').textContent = 'Γύρος ' + (current+1) + '/' + rounds.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('btnCheck').disabled = false;
    document.getElementById('btnCheck').textContent = '✅ Έλεγχος!';
    var area = document.getElementById('cardArea');
    area.innerHTML = '';
    for (var i = 0; i < r.cards.length; i++) {
      var card = document.createElement('div');
      card.className = 'activity-card';
      card.setAttribute('data-idx', i);
      card.innerHTML = '<div class="ac-emoji">' + r.cards[i].emoji + '</div><div class="ac-title">' + r.cards[i].title + '</div>';
      card.addEventListener('click', function(e) { toggleCard(this); });
      area.appendChild(card);
    }
  }
  function toggleCard(el) {
    if (el.classList.contains('disabled')) return;
    el.classList.toggle('selected');
  }
  function checkAnswers() {
    var r = rounds[current];
    var cards = document.querySelectorAll('.activity-card');
    for (var i = 0; i < cards.length; i++) {
      cards[i].classList.add('disabled');
    }
    document.getElementById('btnCheck').disabled = true;
    var correctCount = 0;
    var totalInternet = 0;
    for (var i = 0; i < r.cards.length; i++) {
      if (r.cards[i].internet) totalInternet++;
    }
    for (var i = 0; i < cards.length; i++) {
      var selected = cards[i].classList.contains('selected');
      var shouldBe = r.cards[i].internet;
      if (selected && shouldBe) {
        cards[i].classList.add('correct');
        correctCount++;
      } else if (selected && !shouldBe) {
        cards[i].classList.add('wrong');
      } else if (!selected && shouldBe) {
        cards[i].classList.add('reveal-correct');
      }
    }
    var fb = document.getElementById('feedback');
    if (correctCount === totalInternet) {
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      fb.className = 'feedback show true';
      fb.textContent = '✅ Μπράβο! Τα βρήκες όλα σωστά!';
      setTimeout(function() { current++; loadRound(); }, 1200);
    } else {
      fb.className = 'feedback show false';
      fb.textContent = '❌ Βρήκες ' + correctCount + ' από ' + totalInternet + ' σωστά! Δοκίμασε ξανά!';
      setTimeout(function() {
        // re-enable for retry
        for (var i = 0; i < cards.length; i++) {
          cards[i].classList.remove('disabled', 'correct', 'wrong', 'reveal-correct');
          cards[i].classList.remove('selected');
        }
        document.getElementById('btnCheck').disabled = false;
        document.getElementById('btnCheck').textContent = '✅ Έλεγχος!';
        fb.className = 'feedback';
        fb.style.display = 'none';
      }, 1500);
    }
  }
  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var t = rounds.length;
    var e,ti,m;
    if (score===t){e='🏆';ti='Τέλεια!';m='Ξέρεις τι κάνουμε στο διαδίκτυο!'}
    else if(score>=3){e='🎉';ti='Μπράβο!';m='Καταλαβαίνεις το διαδίκτυο!'}
    else {e='💪';ti='Καλή προσπάθεια!';m='Δοκίμασε ξανά!'}
    document.getElementById('resultEmoji').textContent = e;
    document.getElementById('resultTitle').textContent = ti;
    document.getElementById('resultMsg').textContent = 'Σωστοί γύροι: '+score+' από '+t+'. '+m;
  }
  startGame();
</script>
</body>
</html>
