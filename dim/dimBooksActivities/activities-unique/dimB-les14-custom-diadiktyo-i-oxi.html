<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Διαδίκτυο ή όχι; 🌍</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(102,126,234,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; }
  .header p { font-size: .9rem; opacity: .9; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #764ba2; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fff9db; border: 2px dashed #f0c040; border-radius: 16px;
    padding: 14px; margin-bottom: 14px; text-align: center;
    font-size: 1rem; color: #6b5900;
  }
  .activity-card {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 32px 20px; margin-bottom: 18px; text-align: center;
    min-height: 160px; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .act-emoji { font-size: 5rem; margin-bottom: 10px; }
  .act-text { font-size: 1.2rem; font-weight: 700; color: #2d3436; }
  .btn-group { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .btn-choice {
    border: none; border-radius: 20px; padding: 16px 24px;
    font-size: 1.1rem; font-weight: 700; cursor: pointer;
    transition: transform .15s; font-family: inherit;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,.12);
    user-select: none; -webkit-tap-highlight-color: transparent;
    flex: 1; justify-content: center; max-width: 200px;
  }
  .btn-yes { background: linear-gradient(135deg, #11998e, #38ef7d); color: #fff; }
  .btn-no { background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; }
  .btn-choice:active { transform: scale(.95); }
  .btn-choice:disabled { opacity: .5; pointer-events: none; }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; margin: 14px 0; display: none;
  }
  .feedback.show { display: block; }
  .feedback.yay { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
  .feedback.nay { background: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 16px; padding: 14px 36px; font-size: 1.2rem; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: 0 4px 14px rgba(102,126,234,.35); }
  .btn-restart:active { transform: scale(.95); }
  @media(max-width:480px){ body{padding:8px} .header h1{font-size:1.2rem} .act-emoji{font-size:4rem} }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .btn-group > * { margin: 7px; }
  .btn-choice > * + * { margin-left: 8px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🌍 Διαδίκτυο ή όχι;</h1>
    <p>Χρειάζεται διαδίκτυο για να το κάνω;</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/8</span>
  </div>
  <div class="instructions">
    🤔 Κάποιες δουλειές χρειάζονται διαδίκτυο, άλλες όχι.<br>
    Πάτησε <strong>✅ Ναι</strong> αν χρειάζεται ή <strong>❌ Όχι</strong> αν δεν χρειάζεται.
  </div>
  <div id="gameArea">
    <div class="activity-card">
      <div class="act-emoji" id="actEmoji">📧</div>
      <div class="act-text" id="actText">Στέλνω email στη γιαγιά μου</div>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="btn-group">
      <button class="btn-choice btn-yes" id="btnYes" onclick="answer(true)">✅ Ναι</button>
      <button class="btn-choice btn-no" id="btnNo" onclick="answer(false)">❌ Όχι</button>
    </div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg"></p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var items = [
    { emoji:'📧', text:'Στέλνω email στη γιαγιά μου', net:true, tip:'Το email είναι υπηρεσία του διαδικτύου!' },
    { emoji:'📹', text:'Κάνω βιντεοκλήση με τον μπαμπά', net:true, tip:'Η βιντεοκλήση χρειάζεται διαδίκτυο!' },
    { emoji:'🌐', text:'Ψάχνω πληροφορίες στο Web', net:true, tip:'Ο Παγκόσμιος Ιστός είναι μέσα στο διαδίκτυο!' },
    { emoji:'💬', text:'Συνομιλώ (chat) με την παρέα μου', net:true, tip:'Η συνομιλία χρειάζεται διαδίκτυο!' },
    { emoji:'✏️', text:'Γράφω στο τετράδιό μου', net:false, tip:'Το τετράδιο δεν χρειάζεται διαδίκτυο!' },
    { emoji:'📖', text:'Διαβάζω ένα βιβλίο', net:false, tip:'Το βιβλίο δεν χρειάζεται διαδίκτυο!' },
    { emoji:'🎨', text:'Ζωγραφίζω σε χαρτί', net:false, tip:'Η ζωγραφική σε χαρτί δεν χρειάζεται διαδίκτυο!' },
    { emoji:'🏀', text:'Παίζω μπάλα στην αυλή', net:false, tip:'Το παιχνίδι στην αυλή δεν χρειάζεται διαδίκτυο!' }
  ];
  var shuffled=[],cur=0,score=0;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function startGame(){
    shuffled=shuffle(items.slice());cur=0;score=0;
    document.getElementById('scoreDisplay').textContent='⭐ 0';
    document.getElementById('gameArea').style.display='block';
    document.getElementById('resultScreen').style.display='none';
    showItem();
  }
  function showItem(){
    if(cur>=shuffled.length){showResult();return;}
    var it=shuffled[cur];
    document.getElementById('actEmoji').textContent=it.emoji;
    document.getElementById('actText').textContent=it.text;
    document.getElementById('roundDisplay').textContent=(cur+1)+'/'+shuffled.length;
    document.getElementById('btnYes').disabled=false;document.getElementById('btnNo').disabled=false;
    document.getElementById('feedback').className='feedback';document.getElementById('feedback').style.display='none';
  }
  function answer(isYes){
    var it=shuffled[cur];var correct=(isYes===it.net);
    document.getElementById('btnYes').disabled=true;document.getElementById('btnNo').disabled=true;
    var fb=document.getElementById('feedback');
    if(correct){score++;document.getElementById('scoreDisplay').textContent='⭐ '+score;fb.className='feedback show yay';fb.textContent='✅ Μπράβο! '+it.tip;}
    else{fb.className='feedback show nay';fb.textContent='❌ Ωχ! '+it.tip;}
    setTimeout(function(){cur++;showItem();},1800);
  }
  function showResult(){
    document.getElementById('gameArea').style.display='none';
    document.getElementById('resultScreen').style.display='block';
    var total=shuffled.length,pct=score/total;
    var e,t,m;
    if(pct===1){e='🏆';t='Τέλεια!';m='Γνωρίζεις τι χρειάζεται διαδίκτυο! Είσαι σούπερ!';}
    else if(pct>=0.75){e='🎉';t='Μπράβο!';m='Τα πήγες πολύ καλά!';}
    else if(pct>=0.5){e='👍';t='Ωραία!';m='Καλή προσπάθεια!';}
    else{e='💪';t='Καλή αρχή!';m='Προσπάθησε ξανά!';}
    document.getElementById('resultEmoji').textContent=e;
    document.getElementById('resultTitle').textContent=t;
    document.getElementById('resultMsg').textContent='Βρήκες '+score+' από '+total+' σωστά! '+m;
  }
  startGame();
</script>
</body>
</html>
