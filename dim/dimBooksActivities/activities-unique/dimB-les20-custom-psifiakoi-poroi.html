<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ψηφιακοί Πόροι 🌐</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #2193b0, #6dd5ed);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(33,147,176,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.4rem; text-shadow: 1px 1px 2px rgba(0,0,0,.2); }
  .header p { font-size: .9rem; opacity: .95; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #2193b0; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fff9db; border: 2px dashed #f0c040; border-radius: 16px;
    padding: 14px; margin-bottom: 14px; text-align: center;
    font-size: 1rem; color: #6b5900;
  }
  .resource-card {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 28px 20px; margin-bottom: 18px; text-align: center;
  }
  .res-icon { font-size: 4.5rem; margin-bottom: 8px; }
  .res-desc { font-size: 1.1rem; font-weight: 600; color: #2d3436; line-height: 1.4; }
  .categories-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-gap: 10px; margin-bottom: 14px; }
  .cat-card {
    background: #fff; border: 4px solid #e0e0e0; border-radius: 20px;
    padding: 18px 6px; text-align: center; cursor: pointer;
    transition: all .2s ease; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .cat-card:active { transform: scale(.95); }
  .cat-card .c-emoji { font-size: 2.5rem; margin-bottom: 4px; }
  .cat-card .c-name { font-size: .85rem; font-weight: 700; color: #2d3436; }
  .cat-card.correct { border-color: #28a745; background: #d4edda; animation: pop .4s ease; }
  .cat-card.wrong { border-color: #dc3545; background: #f8d7da; animation: shake .4s ease; }
  .cat-card.disabled { pointer-events: none; opacity: .7; }
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .feedback{text-align:center;padding:14px;border-radius:16px;font-size:1.1rem;font-weight:700;margin-bottom:12px;display:none}
  .feedback.show{display:block}
  .feedback.yay{background:#d4edda;color:#155724}
  .feedback.nay{background:#f8d7da;color:#721c24}
  .result-screen{background:#fff;border-radius:24px;box-shadow:0 8px 28px rgba(0,0,0,.1);padding:40px 24px;text-align:center;display:none}
  .result-screen .big-emoji{font-size:5rem;margin-bottom:12px}
  .result-screen h2{font-size:1.6rem;color:#2d3436;margin-bottom:8px}
  .result-screen p{font-size:1.1rem;color:#666;margin-bottom:20px}
  .btn-restart{background:linear-gradient(135deg,#2193b0,#6dd5ed);color:#fff;border:none;border-radius:16px;padding:14px 36px;font-size:1.2rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(33,147,176,.35)}
  .btn-restart:active{transform:scale(.95)}
  @media(max-width:480px){body{padding:8px}.header h1{font-size:1.2rem}.categories-grid{grid-gap:6px}.cat-card{padding:14px 4px}.res-icon{font-size:3.5rem}}
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🌐 Ψηφιακοί Πόροι</h1>
    <p>Τι είναι: Βίντεο, Ήχος ή Εικόνα;</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/8</span>
  </div>
  <div class="instructions">
    📖 Μια ιστοσελίδα έχει βίντεο, ήχους και εικόνες!<br>
    Μπορείς να αναγνωρίσεις τον κάθε πόρο;
  </div>
  <div id="gameArea">
    <div class="resource-card">
      <div class="res-icon" id="resIcon">🎬</div>
      <div class="res-desc" id="resDesc">Έχει εικόνα που κουνιέται και κουμπί play</div>
    </div>
    <div class="categories-grid" id="categoriesGrid"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg"></p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var qs = [
    {icon:'🎬', desc:'Έχει εικόνα που κουνιέται και κουμπί play', ans:0},
    {icon:'🎵', desc:'Ακούγεται ήχος, δεν έχει εικόνα', ans:1},
    {icon:'🖼️', desc:'Μια φωτογραφία ή ζωγραφιά που τη βλέπουμε', ans:2},
    {icon:'🎥', desc:'Δείχνει ένα κινούμενο σχέδιο', ans:0},
    {icon:'🎶', desc:'Μουσική που παίζει από τα ηχεία', ans:1},
    {icon:'📸', desc:'Φωτογραφία από το προαύλιο του σχολείου', ans:2},
    {icon:'📺', desc:'Μια ταινία με ήχο και εικόνα', ans:0},
    {icon:'📷', desc:'Μια ζωγραφιά ζώου', ans:2},
  ];
  var categories = [
    {emoji:'🎬', name:'Βίντεο'},
    {emoji:'🎵', name:'Ήχος'},
    {emoji:'🖼️', name:'Εικόνα'}
  ];
  var cur=0,score=0;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function startGame(){
    shuffle(qs);cur=0;score=0;
    document.getElementById('scoreDisplay').textContent='⭐ 0';
    document.getElementById('gameArea').style.display='block';
    document.getElementById('resultScreen').style.display='none';
    showQ();
  }
  function showQ(){
    if(cur>=qs.length){showResult();return;}
    var q=qs[cur];
    document.getElementById('resIcon').textContent=q.icon;
    document.getElementById('resDesc').textContent=q.desc;
    document.getElementById('roundDisplay').textContent=(cur+1)+'/'+qs.length;
    document.getElementById('feedback').className='feedback';document.getElementById('feedback').style.display='none';
    var g=document.getElementById('categoriesGrid');g.innerHTML='';
    for(var i=0;i<categories.length;i++){
      (function(idx){
        var c=document.createElement('div');c.className='cat-card';
        c.innerHTML='<div class="c-emoji">'+categories[idx].emoji+'</div><div class="c-name">'+categories[idx].name+'</div>';
        c.addEventListener('click',function(){choose(this,q);});
        g.appendChild(c);
      })(i);
    }
  }
  function choose(el,q){
    var cards=document.querySelectorAll('.cat-card');
    for(var i=0;i<cards.length;i++)cards[i].classList.add('disabled');
    var chosen=Array.from(cards).indexOf(el);
    var correct=(chosen===q.ans);
    var fb=document.getElementById('feedback');
    if(correct){score++;document.getElementById('scoreDisplay').textContent='⭐ '+score;el.classList.add('correct');fb.className='feedback show yay';fb.textContent='✅ Μπράβο! Σωστά!';}
    else{el.classList.add('wrong');cards[q.ans].classList.add('correct');fb.className='feedback show nay';fb.textContent='❌ Αυτό είναι: '+categories[q.ans].name+'!';}
    setTimeout(function(){cur++;showQ();},1500);
  }
  function showResult(){
    document.getElementById('gameArea').style.display='none';
    document.getElementById('resultScreen').style.display='block';
    var total=qs.length,pct=score/total;
    var e,t,m;
    if(pct===1){e='🏆';t='Τέλεια!';m='Αναγνωρίζεις όλους τους ψηφιακούς πόρους! Είσαι σούπερ!';}
    else if(pct>=0.75){e='🎉';t='Μπράβο!';m='Τα πήγες πολύ καλά!';}
    else if(pct>=0.5){e='👍';t='Ωραία!';m='Καλή προσπάθεια!';}
    else{e='💪';t='Καλή αρχή!';m='Προσπάθησε ξανά!';}
    document.getElementById('resultEmoji').textContent=e;
    document.getElementById('resultTitle').textContent=t;
    document.getElementById('resultMsg').textContent='Βρήκες '+score+' από '+total+' σωστά! '+m;
  }
  startGame();
</script>
</body>
</html>
