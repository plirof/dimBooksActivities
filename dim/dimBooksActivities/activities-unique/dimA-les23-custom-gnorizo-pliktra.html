<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Γνωρίζω τα πλήκτρα ⌨️</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #eceff1, #cfd8dc, #b0bec5);
    padding: 12px; color: #333;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 14px;
    background: linear-gradient(135deg, #546e7a, #37474f);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(55,71,79,.35); margin-bottom: 16px;
  }
  .header h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .header p { font-size: 1rem; opacity: .9; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #37474f; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fff9db; border: 2px dashed #f0c040;
    border-radius: 16px; padding: 14px 16px; margin-bottom: 16px;
    font-size: 1.1rem; text-align: center; color: #6b5900; line-height: 1.5;
  }
  .question-area {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 24px; margin-bottom: 16px;
    text-align: center;
  }
  .question-area .qa-emoji { font-size: 3.5rem; display: block; margin-bottom: 8px; }
  .question-area .qa-text { font-size: 1.2rem; font-weight: 700; color: #333; }
  .question-area .qa-hint { font-size: 1rem; color: #888; margin-top: 6px; }
  .keyboard-area {
    background: #fff; border-radius: 20px;
    padding: 16px; margin-bottom: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
  }
  .kb-row {
    display: flex; gap: 6px; justify-content: center; margin-bottom: 6px;
  }
  .kb-row:last-child { margin-bottom: 0; }
  .kb-key {
    background: #f5f5f5; border: 2px solid #e0e0e0;
    border-radius: 10px; padding: 10px 8px;
    min-width: 40px; text-align: center;
    font-size: .85rem; font-weight: 700; cursor: pointer;
    transition: all .12s; font-family: inherit;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .kb-key:active { transform: scale(.92); background: #e0e0e0; }
  .kb-key:disabled { opacity: .3; transform: none !important; cursor: default; }
  .kb-key.hit { background: #c8e6c9; border-color: #43a047; animation: keyPop .25s ease; }
  .kb-key.miss { background: #ffcdd2; border-color: #e53935; animation: keyShake .3s ease; }
  .kb-key.reveal { background: #c8e6c9; border-color: #43a047; }
  .kb-key.space { min-width: 140px; }
  .kb-key.enter { min-width: 80px; }
  .kb-key.shift { min-width: 70px; }
  @keyframes keyPop { 0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)} }
  @keyframes keyShake { 0%,100%{transform:translateX(0)}30%{transform:translateX(-4px)}60%{transform:translateX(4px)} }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.05rem; font-weight: 700; display: none; margin-top: 12px;
  }
  .feedback.show { display: block; }
  .feedback.true { background: #d4edda; color: #155724; }
  .feedback.false { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #546e7a, #37474f);
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 36px; font-size: 1.2rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(55,71,79,.35);
    transition: transform .15s;
  }
  .btn-restart:active { transform: scale(.95); }
  @media (max-width:480px) {
    .header h1 { font-size: 1.2rem; }
    .kb-key { font-size: .75rem; padding: 8px 5px; min-width: 32px; }
    .kb-key.space { min-width: 100px; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .kb-row > * + * { margin-left: 6px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>⌨️ Γνωρίζω τα πλήκτρα</h1>
    <p>Βρες το σωστό πλήκτρο!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">Ερώτηση 1/8</span>
  </div>
  <div class="instructions">
    👀 Κοίτα το γράμμα ή το σύμβολο. Πάτησε το σωστό πλήκτρο!
  </div>
  <div id="gameArea">
    <div class="question-area">
      <span class="qa-emoji" id="qaEmoji">🅰️</span>
      <span class="qa-text" id="qaText">Βρες το γράμμα Α</span>
      <span class="qa-hint" id="qaHint">Πάτησέ το στο πληκτρολόγιο!</span>
    </div>
    <div class="keyboard-area" id="keyboardArea"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🏆</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Βρήκες όλα τα πλήκτρα!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var keys = [
    ['Α', 'Β', 'Γ', 'Δ', 'Ε', 'Ζ', 'Η', 'Θ'],
    ['Ι', 'Κ', 'Λ', 'Μ', 'Ν', 'Ξ', 'Ο'],
    ['Π', 'Ρ', 'Σ', 'Τ', 'Υ', 'Φ', 'Χ'],
    ['Ψ', 'Ω', 'Space', 'Enter']
  ];

  var questions = [
    { emoji: '🅰️', text: 'Βρες το γράμμα Α', answer: 'Α' },
    { emoji: '🅱️', text: 'Βρες το γράμμα Β', answer: 'Β' },
    { emoji: '🅼', text: 'Βρες το γράμμα Μ', answer: 'Μ' },
    { emoji: '🅿️', text: 'Βρες το γράμμα Π', answer: 'Π' },
    { emoji: '🆂', text: 'Βρες το γράμμα Σ', answer: 'Σ' },
    { emoji: '🆃', text: 'Βρες το γράμμα Τ', answer: 'Τ' },
    { emoji: '🅾️', text: 'Βρες το γράμμα Ο', answer: 'Ο' },
    { emoji: '🆆', text: 'Βρες το γράμμα Ω', answer: 'Ω' }
  ];

  var shuffled = [];
  var current = 0, score = 0;

  function shuffle(a) {
    for (var i = a.length-1; i > 0; i--) {
      var j = Math.floor(Math.random()*(i+1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function buildKeyboard() {
    var ka = document.getElementById('keyboardArea');
    ka.innerHTML = '';
    for (var r = 0; r < keys.length; r++) {
      var row = document.createElement('div');
      row.className = 'kb-row';
      for (var c = 0; c < keys[r].length; c++) {
        var k = keys[r][c];
        var key = document.createElement('div');
        key.className = 'kb-key';
        if (k === 'Space') { key.classList.add('space'); key.textContent = '␣ Space'; }
        else if (k === 'Enter') { key.classList.add('enter'); key.textContent = '↵ Enter'; }
        else { key.textContent = k; }
        key.setAttribute('data-key', k);
        key.addEventListener('click', function() { pressKey(this); });
        row.appendChild(key);
      }
      ka.appendChild(row);
    }
  }

  function startGame() {
    shuffled = shuffle(questions.slice());
    current = 0; score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    buildKeyboard();
    showQ();
  }

  function showQ() {
    if (current >= shuffled.length) { showResult(); return; }
    var q = shuffled[current];
    document.getElementById('qaEmoji').textContent = q.emoji;
    document.getElementById('qaText').textContent = q.text;
    document.getElementById('qaHint').textContent = 'Πάτησέ το στο πληκτρολόγιο!';
    document.getElementById('roundDisplay').textContent = 'Ερώτηση ' + (current+1) + '/' + shuffled.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
    var allKeys = document.querySelectorAll('.kb-key');
    for (var i = 0; i < allKeys.length; i++) {
      allKeys[i].disabled = false;
      allKeys[i].className = 'kb-key';
      if (allKeys[i].getAttribute('data-key') === 'Space') allKeys[i].classList.add('space');
      if (allKeys[i].getAttribute('data-key') === 'Enter') allKeys[i].classList.add('enter');
    }
  }

  function pressKey(el) {
    var q = shuffled[current];
    var key = el.getAttribute('data-key');
    var correct = (key === q.answer);
    var allKeys = document.querySelectorAll('.kb-key');
    for (var i = 0; i < allKeys.length; i++) allKeys[i].disabled = true;
    var fb = document.getElementById('feedback');
    if (correct) {
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      el.classList.add('hit');
      fb.className = 'feedback show true';
      fb.textContent = '✅ Μπράβο! Το γράμμα ' + q.answer + '!';
      setTimeout(function() { current++; showQ(); }, 1000);
    } else {
      el.classList.add('miss');
      for (var i = 0; i < allKeys.length; i++) {
        if (allKeys[i].getAttribute('data-key') === q.answer) allKeys[i].classList.add('reveal');
      }
      fb.className = 'feedback show false';
      fb.textContent = '❌ Το σωστό είναι το ' + q.answer + '!';
      setTimeout(function() { current++; showQ(); }, 1400);
    }
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var t = shuffled.length;
    var e, ti, m;
    if (score === t) { e = '🏆'; ti = 'Τέλεια!'; m = 'Γνωρίζεις όλα τα γράμματα στο πληκτρολόγιο!' }
    else if (score >= 6) { e = '🎉'; ti = 'Μπράβο!'; m = 'Τα πήγες πολύ καλά!' }
    else if (score >= 4) { e = '👍'; ti = 'Ωραία!'; m = 'Δοκίμασε ξανά!' }
    else { e = '💪'; ti = 'Καλή αρχή!'; m = 'Κάθε πλήκτρο έχει ένα γράμμα!' }
    document.getElementById('resultEmoji').textContent = e;
    document.getElementById('resultTitle').textContent = ti;
    document.getElementById('resultMsg').textContent = 'Βρήκες ' + score + ' από ' + t + ' γράμματα! ' + m;
  }

  startGame();
</script>
</body>
</html>
