<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ταίριαξε τις Έννοιες 🔗</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #00796b, #26a69a);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(0,121,107,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; text-shadow: 1px 1px 2px rgba(0,0,0,.2); }
  .header p { font-size: .9rem; opacity: .95; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #00796b; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #e0f2f1; border: 2px dashed #26a69a; border-radius: 16px;
    padding: 14px; margin-bottom: 14px; text-align: center;
    font-size: 1rem; color: #004d40;
  }
  .match-pair {
    background: #fff; border-radius: 24px; padding: 20px;
    margin-bottom: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.08);
  }
  .pair-row {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    margin-bottom: 16px;
  }
  .pair-item {
    flex: 1; text-align: center; background: #f5f5f5;
    border-radius: 16px; padding: 16px 10px;
  }
  .pair-item .pi-emoji { font-size: 3rem; }
  .pair-item .pi-text { font-size: 1rem; font-weight: 700; color: #2d3436; margin-top: 6px; }
  .pair-arrow { font-size: 2rem; color: #00796b; }
  .pair-q { text-align: center; font-size: 1.1rem; font-weight: 700; color: #2d3436; margin-bottom: 14px; }
  .opts-grid { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 10px; }
  .opt-card {
    background: #fff; border: 3px solid #e0e0e0; border-radius: 16px;
    padding: 16px 10px; text-align: center; cursor: pointer;
    transition: all .2s; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .opt-card:active { transform: scale(.95); }
  .opt-card .oc-emoji { font-size: 2.5rem; }
  .opt-card .oc-text { font-size: .9rem; font-weight: 600; color: #555; margin-top: 4px; }
  .opt-card.correct { border-color: #28a745; background: #d4edda; animation: pop .4s ease; }
  .opt-card.wrong { border-color: #dc3545; background: #f8d7da; animation: shake .4s ease; }
  .opt-card.disabled { pointer-events: none; }
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .feedback { text-align:center; padding:14px; border-radius:16px; font-size:1.1rem; font-weight:700; margin-bottom:12px; display:none; }
  .feedback.show { display:block; }
  .feedback.yay { background:#d4edda; color:#155724; }
  .feedback.nay { background:#f8d7da; color:#721c24; }
  .result-screen { background:#fff; border-radius:24px; box-shadow:0 8px 28px rgba(0,0,0,.1); padding:40px 24px; text-align:center; display:none; }
  .result-screen .big-emoji{font-size:5rem;margin-bottom:12px}
  .result-screen h2{font-size:1.6rem;color:#2d3436;margin-bottom:8px}
  .result-screen p{font-size:1.1rem;color:#666;margin-bottom:20px}
  .btn-restart{background:linear-gradient(135deg,#00796b,#26a69a);color:#fff;border:none;border-radius:16px;padding:14px 36px;font-size:1.2rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(0,121,107,.35)}
  .btn-restart:active{transform:scale(.95)}
  @media(max-width:480px){body{padding:8px}.header h1{font-size:1.2rem}.pair-item .pi-emoji{font-size:2rem}.opts-grid{grid-template-columns:1fr}}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .pair-row > * + * { margin-left: 14px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🔗 Ταίριαξε τις Έννοιες</h1>
    <p>Φυσική τάξη → Ψηφιακή τάξη e-me</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/6</span>
  </div>
  <div class="instructions">🔍 Τι αντιστοιχεί στην e-me για κάθε έννοια της τάξης;</div>
  <div id="gameArea">
    <div class="match-pair">
      <div class="pair-q" id="pairQ">🏫 Η Αίθουσα της τάξης →</div>
      <div class="pair-row">
        <div class="pair-item">
          <div class="pi-emoji" id="physicalEmoji">🏫</div>
          <div class="pi-text" id="physicalText">Αίθουσα τάξης</div>
        </div>
        <div class="pair-arrow">→</div>
        <div class="pair-item" style="background:#e8f5e9;border:2px dashed #66bb6a;">
          <div class="pi-emoji">❓</div>
          <div class="pi-text">???</div>
        </div>
      </div>
      <div class="opts-grid" id="optsGrid"></div>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg"></p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var pairs = [
    {physEm:'🏫', physT:'Αίθουσα τάξης',
     opts:[{e:'🐝',t:'Κυψέλη',ans:true},{e:'👥',t:'Μέλη',ans:false},{e:'🧱',t:'Τοίχος',ans:false},{e:'👨‍🏫',t:'Υπεύθυνος',ans:false}]},
    {physEm:'👨‍🏫', physT:'Εκπαιδευτικός',
     opts:[{e:'🐝',t:'Κυψέλη',ans:false},{e:'👥',t:'Μέλη',ans:false},{e:'🧱',t:'Τοίχος',ans:false},{e:'👨‍🏫',t:'Υπεύθυνος κυψέλης',ans:true}]},
    {physEm:'👥', physT:'Συμμαθητές',
     opts:[{e:'🐝',t:'Κυψέλη',ans:false},{e:'👥',t:'Μέλη',ans:true},{e:'🧱',t:'Τοίχος',ans:false},{e:'👨‍🏫',t:'Υπεύθυνος',ans:false}]},
    {physEm:'📚', physT:'Μάθημα',
     opts:[{e:'🐝',t:'Κυψέλη',ans:true},{e:'👥',t:'Μέλη',ans:false},{e:'🧱',t:'Τοίχος',ans:false},{e:'👨‍🏫',t:'Υπεύθυνος',ans:false}]},
    {physEm:'📋', physT:'Πίνακας ανακοινώσεων',
     opts:[{e:'🐝',t:'Κυψέλη',ans:false},{e:'👥',t:'Μέλη',ans:false},{e:'🧱',t:'Τοίχος',ans:true},{e:'👨‍🏫',t:'Υπεύθυνος',ans:false}]},
    {physEm:'🗣️', physT:'Συζήτηση στην τάξη',
     opts:[{e:'🐝',t:'Κυψέλη',ans:false},{e:'👥',t:'Μέλη',ans:false},{e:'🧱',t:'Τοίχος (σχόλια)',ans:true},{e:'👨‍🏫',t:'Υπεύθυνος',ans:false}]}
  ];
  var cur=0,score=0;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function startGame(){
    shuffle(pairs);cur=0;score=0;
    document.getElementById('scoreDisplay').textContent='⭐ 0';
    document.getElementById('gameArea').style.display='block';
    document.getElementById('resultScreen').style.display='none';
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    loadPair();
  }
  function loadPair(){
    if(cur>=pairs.length){showResult();return;}
    var p=pairs[cur];
    document.getElementById('roundDisplay').textContent=(cur+1)+'/'+pairs.length;
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    document.getElementById('physicalEmoji').textContent=p.physEm;
    document.getElementById('physicalText').textContent=p.physT;
    document.getElementById('pairQ').textContent=p.physEm+' '+p.physT+' → Τι είναι στην e-me;';
    var g=document.getElementById('optsGrid');g.innerHTML='';
    for(var i=0;i<p.opts.length;i++){
      (function(idx){
        var o=document.createElement('div');o.className='opt-card';
        o.innerHTML='<div class="oc-emoji">'+p.opts[idx].e+'</div><div class="oc-text">'+p.opts[idx].t+'</div>';
        o.addEventListener('click',function(){choose(idx);});
        g.appendChild(o);
      })(i);
    }
  }
  function choose(idx){
    var p=pairs[cur];var fb=document.getElementById('feedback');
    var opts=document.querySelectorAll('#optsGrid .opt-card');
    for(var i=0;i<opts.length;i++)opts[i].classList.add('disabled');
    if(p.opts[idx].ans){score++;
      document.getElementById('scoreDisplay').textContent='⭐ '+score;
      opts[idx].classList.add('correct');
      fb.className='feedback show yay';fb.textContent='✅ Μπράβο! Σωστή αντιστοιχία!';
    }else{
      opts[idx].classList.add('wrong');
      for(var i=0;i<p.opts.length;i++){if(p.opts[i].ans){opts[i].classList.add('correct');break;}}
      fb.className='feedback show nay';fb.textContent='❌ Δεν είναι αυτό! Προσπάθησε ξανά!';
    }
    setTimeout(function(){cur++;loadPair();},1800);
  }
  function showResult(){
    document.getElementById('gameArea').style.display='none';
    document.getElementById('resultScreen').style.display='block';
    var total=pairs.length,pct=score/total;
    var e,t,m;
    if(pct===1){e='🏆';t='Τέλεια!';m='Έμαθες όλες τις έννοιες της e-me! Μπράβο!';}
    else if(pct>=0.75){e='🎉';t='Μπράβο!';m='Τα πήγες πολύ καλά!';}
    else if(pct>=0.5){e='👍';t='Ωραία!';m='Καλή προσπάθεια!';}
    else{e='💪';t='Καλή αρχή!';m='Προσπάθησε ξανά!';}
    document.getElementById('resultEmoji').textContent=e;
    document.getElementById('resultTitle').textContent=t;
    document.getElementById('resultMsg').textContent='Βρήκες '+score+' από '+total+' σωστά! '+m;
  }
  startGame();
</script>
</body>
</html>
