* {

.progress-bar-fill {

    display: flex;
    align-items: center;
    justify-content: center;

.round-label {

.clue-card {

    padding: 16px;
    margin-bottom: 14px;
    border: 3px solid #fbc02d;

}

.clue-card .clue-title {
    font-size: 1rem;
    color: #e67e22;
    font-weight: bold;
    margin-bottom: 8px;
}

.clue-card .clue-text {

    font-weight: 700;

}

.clue-card .clue-text .highlight-and {

    font-weight: 800;
}

.clue-card .clue-text .highlight-not {
    color: #c0392b;
    font-weight: 800;
}

.characters-grid {

    grid-template-columns: 1fr 1fr;
    grid-gap: 12px;
    margin-bottom: 14px;
}

.char-option {

    border-radius: 16px;
    padding: 14px 10px;
    text-align: center;
    border: 3px solid #c8d6e5;
    cursor: pointer;
    transition: all 0.2s ease;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
}

.char-option:hover {
    border-color: #74b9ff;
    background: #e8f0ff;
}

.char-option:active {
    transform: scale(0.96);
}

.char-option .char-svg {

.char-option .char-traits {

.char-option.selected-correct {
    border-color: #00b894;
    background: #e6fff9;
}

.char-option.selected-wrong {
    border-color: #e17055;
    background: #fff0ec;
}

.char-option.reveal-correct {
    border-color: #00b894;
    background: #e6fff9;

.char-option.disabled-opt {

.completion-screen .score-detail {

.hidden {

        p += '<rect x="' + (footL - 6.5) + '" y="' + (legEnd - 9) + '" width="13" height="11" fill="' + shoeC + '"/>';
        p += '<rect x="' + (footR - 6.5) + '" y="' + (legEnd - 9) + '" width="13" height="11" fill="' + shoeC + '"/>';
        p += '<ellipse cx="' + footL + '" cy="' + (legEnd + 1) + '" rx="8.5" ry="5" fill="' + shoeC + '"/>';
        p += '<ellipse cx="' + footR + '" cy="' + (legEnd + 1) + '" rx="8.5" ry="5" fill="' + shoeC + '"/>';
    } else if (shoes.type === 'sneakers') {
        p += '<ellipse cx="' + footL + '" cy="' + (legEnd + 1) + '" rx="8.5" ry="5" fill="' + shoeC + '"/>';
        p += '<ellipse cx="' + footR + '" cy="' + (legEnd + 1) + '" rx="8.5" ry="5" fill="' + shoeC + '"/>';
        p += '<rect x="' + (footL - 8.5) + '" y="' + (legEnd + 3) + '" width="17" height="3" rx="1.5" fill="#ecf0f1"/>';
        p += '<rect x="' + (footR - 8.5) + '" y="' + (legEnd + 3) + '" width="17" height="3" rx="1.5" fill="#ecf0f1"/>';
    } else {
        p += '<ellipse cx="' + footL + '" cy="' + (legEnd + 1) + '" rx="8.5" ry="5" fill="' + shoeC + '"/>';
        p += '<ellipse cx="' + footR + '" cy="' + (legEnd + 1) + '" rx="8.5" ry="5" fill="' + shoeC + '"/>';
    }

    p += '<line x1="40" y1="66" x2="34" y2="88" stroke="' + SKIN + '" stroke-width="6" stroke-linecap="round"/>';
    p += '<line x1="80" y1="66" x2="86" y2="88" stroke="' + SKIN + '" stroke-width="6" stroke-linecap="round"/>';

    if (ttype === 'dress') {
        p += '<path d="M42,84 L78,84 L88,120 L32,120 Z" fill="' + topC + '"/>';
        p += '<rect x="38" y="62" width="44" height="26" rx="9" fill="' + topC + '"/>';
    } else if (topC) {
        p += '<rect x="38" y="62" width="44" height="34" rx="9" fill="' + topC + '"/>';
        if (ttype === 'jacket') {
            p += '<line x1="60" y1="68" x2="60" y2="96" stroke="rgba(0,0,0,0.25)" stroke-width="2"/>';
            p += '<circle cx="55" cy="78" r="1.6" fill="#ffffff" opacity="0.9"/>';
            p += '<circle cx="55" cy="88" r="1.6" fill="#ffffff" opacity="0.9"/>';
            p += '<path d="M54,62 L60,70 L66,62 Z" fill="rgba(255,255,255,0.4)"/>';
        }
    }

    if (ttype === 'shirt' || ttype === 'jacket') {
        p += '<line x1="40" y1="66" x2="35" y2="84" stroke="' + topC + '" stroke-width="9" stroke-linecap="round"/>';
        p += '<line x1="80" y1="66" x2="85" y2="84" stroke="' + topC + '" stroke-width="9" stroke-linecap="round"/>';
    } else if (ttype === 'tshirt') {
        p += '<line x1="40" y1="66" x2="36" y2="74" stroke="' + topC + '" stroke-width="9" stroke-linecap="round"/>';
        p += '<line x1="80" y1="66" x2="84" y2="74" stroke="' + topC + '" stroke-width="9" stroke-linecap="round"/>';
    }

    p += '<rect x="56" y="54" width="8" height="10" fill="' + SKIN + '"/>';
    p += '<circle cx="41" cy="44" r="3.5" fill="' + SKIN + '"/>';
    p += '<circle cx="79" cy="44" r="3.5" fill="' + SKIN + '"/>';
    p += '<circle cx="60" cy="42" r="19" fill="' + SKIN + '"/>';

    p += '<circle cx="53" cy="43" r="3" fill="#ffffff"/>';
    p += '<circle cx="67" cy="43" r="3" fill="#ffffff"/>';
    p += '<circle cx="53" cy="43" r="1.8" fill="' + eyeC + '"/>';
    p += '<circle cx="67" cy="43" r="1.8" fill="' + eyeC + '"/>';
    p += '<circle cx="53.5" cy="42.5" r="0.7" fill="#2d3436"/>';
    p += '<circle cx="67.5" cy="42.5" r="0.7" fill="#2d3436"/>';

    p += '<path d="M59,45 Q61,48 59,49" stroke="' + SKIN_DARK + '" stroke-width="1.5" fill="none" stroke-linecap="round"/>';
    p += '<path d="M54,51 Q60,56 66,51" stroke="#c0623b" stroke-width="1.8" fill="none" stroke-linecap="round"/>';

    if (l.beard) {
        p += '<path d="M44,44 Q45,60 60,61 Q75,60 76,44 L76,49 Q73,57 60,58 Q47,57 44,49 Z" fill="#5d4037"/>';
        p += '<ellipse cx="56" cy="49.5" rx="3.2" ry="1.6" fill="#5d4037"/>';
        p += '<ellipse cx="64" cy="49.5" rx="3.2" ry="1.6" fill="#5d4037"/>';
    }

    if (l.glasses) {
        p += '<circle cx="53" cy="43" r="6.5" fill="rgba(255,255,255,0.2)" stroke="#2d3436" stroke-width="1.8"/>';
        p += '<circle cx="67" cy="43" r="6.5" fill="rgba(255,255,255,0.2)" stroke="#2d3436" stroke-width="1.8"/>';
        p += '<path d="M59.5,42 Q60,41 60.5,42" stroke="#2d3436" stroke-width="1.8" fill="none"/>';
        p += '<line x1="46.5" y1="42" x2="41.5" y2="40" stroke="#2d3436" stroke-width="1.6"/>';
        p += '<line x1="73.5" y1="42" x2="78.5" y2="40" stroke="#2d3436" stroke-width="1.6"/>';
    }

    p += '<path d="M41.4,38 A19,19 0 0 1 78.6,38 Z" fill="' + hairC + '"/>';
    if (girl) {
        p += '<path d="M41.4,38 Q37.5,54 42,66 L50,62 Q46,50 47.5,38 Z" fill="' + hairC + '"/>';
        p += '<path d="M78.6,38 Q82.5,54 78,66 L70,62 Q74,50 72.5,38 Z" fill="' + hairC + '"/>';
    }

    if (hatC) {
        p += '<path d="M48,29 L48,15 Q48,10 53,10 L67,10 Q72,10 72,15 L72,29 Z" fill="' + hatC + '"/>';
        p += '<ellipse cx="60" cy="29" rx="23" ry="4.5" fill="' + hatC + '"/>';
    }

    if (l.item) {
        p += '<text class="item-emoji" x="101" y="88" font-size="27" text-anchor="middle">' + l.item + '</text>';
    }

    p += '</svg>';
    return p;
}

function init() {
    currentRound = 0;
    score = 0;
    answered = false;
    document.getElementById('completion-screen').classList.add('hidden');
    document.getElementById('game-area').classList.remove('hidden');
    renderRound();
}

function renderRound() {
    answered = false;
    var round = rounds[currentRound];

    document.getElementById('round-label').textContent = 'Γύρος ' + (currentRound + 1) + ' από ' + totalRounds;
    updateProgress();

    var clueHtml = '<div class="clue-title">🔍 Υπόδειξη:</div>';
    clueHtml += '<div class="clue-text">' + round.clue.text + '</div>';
    document.getElementById('clue-card').innerHTML = clueHtml;

    var gridHtml = '';
    for (var i = 0; i < round.characters.length; i++) {
        var ch = round.characters[i];
        gridHtml += '<div class="char-option" data-index="' + i + '" onclick="handleSelect(' + i + ')">';
        gridHtml += charSVG(ch.look);
        gridHtml += '<div class="char-name">' + ch.name + '</div>';
        gridHtml += '<div class="char-traits">' + ch.traits + '</div>';
        gridHtml += '</div>';
    }
    document.getElementById('characters-grid').innerHTML = gridHtml;

    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('btn-next').classList.add('hidden');
}

function handleSelect(index) {
    if (answered) return;
    answered = true;

    var round = rounds[currentRound];
    var correct = index === round.clue.answerIndex;
    if (correct) score++;

    var options = document.querySelectorAll('.char-option');
    for (var i = 0; i < options.length; i++) {
        options[i].classList.add('disabled-opt');
    }

    var fb = document.getElementById('feedback');
    if (correct) {
        options[index].classList.add('selected-correct');
        fb.textContent = '🎉 Σωστό! Βρήκες τον κωδικό!';
        fb.className = 'feedback correct-fb';
    } else {
        options[index].classList.add('selected-wrong');
        options[round.clue.answerIndex].classList.add('reveal-correct');
        fb.textContent = '😢 Λάθος! Η σωστή απάντηση είναι ο/η ' + round.characters[round.clue.answerIndex].name;
        fb.className = 'feedback wrong-fb';
    }

    if (currentRound < totalRounds - 1) {
        document.getElementById('btn-next').classList.remove('hidden');
    } else {
        var btnNext = document.getElementById('btn-next');
        btnNext.textContent = 'Δες το σκορ σου! 🏆';
        btnNext.classList.remove('hidden');
    }
}

function nextRound() {
    currentRound++;
    if (currentRound < totalRounds) {
        renderRound();
    } else {
        showCompletion();
    }
}

function updateProgress() {
    var done = currentRound;
    var pct = (done / totalRounds) * 100;
    var bar = document.getElementById('progress-fill');
    bar.style.width = pct + '%';
    bar.textContent = done + ' / ' + totalRounds;
}

function showCompletion() {
    document.getElementById('game-area').classList.add('hidden');
    var cs = document.getElementById('completion-screen');
    cs.classList.remove('hidden');

    var pct = score / totalRounds;
    var starCount = pct >= 0.9 ? 3 : (pct >= 0.6 ? 2 : 1);
    var starsHtml = '';
    for (var i = 0; i < 3; i++) {
        starsHtml += (i < starCount) ? '⭐' : '☆';
    }
    document.getElementById('stars').textContent = starsHtml;
    document.getElementById('score-text').textContent = 'Σκορ: ' + score + ' / ' + totalRounds;

    var msg = '';
    if (pct === 1) msg = 'Τέλειο! Είσαι ντετέκτιβ! 🕵️';
    else if (pct >= 0.8) msg = 'Πολύ καλό! Μπράβο! 🌟';
    else if (pct >= 0.6) msg = 'Καλό! Συνέχισε έτσι! 💪';
    else msg = 'Προσπάθησε ξανά! Μπορείς! 🤗';
    document.getElementById('score-detail').textContent = msg;
}

document.getElementById('btn-next').addEventListener('click', nextRound);
document.getElementById('btn-restart').addEventListener('click', init);

init();
</script>
