<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Μεγάλωσε τον χάρτη! 🌱</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #fce4ec, #f8bbd0, #f48fb1);
    padding: 12px; color: #333;
  }
  .app-container { max-width: 520px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 14px;
    background: linear-gradient(135deg, #e91e63, #c2185b);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(194,24,91,.35); margin-bottom: 16px;
  }
  .header h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .header p { font-size: 1rem; opacity: .9; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #c2185b; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fff9db; border: 2px dashed #f0c040;
    border-radius: 16px; padding: 14px 16px; margin-bottom: 16px;
    font-size: 1.1rem; text-align: center; color: #6b5900; line-height: 1.5;
  }
  .map-display {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 24px; margin-bottom: 16px;
    position: relative;
  }
  .map-tree {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .tree-main {
    background: #e3f2fd; border: 3px solid #42a5f5;
    border-radius: 20px; padding: 14px 28px;
    font-size: 1.3rem; font-weight: 700; text-align: center;
    box-shadow: 0 4px 12px rgba(66,165,245,.2);
  }
  .tree-main .tm-emoji { font-size: 2rem; display: block; margin-bottom: 4px; }
  .tree-level {
    display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
  }
  .tree-node {
    background: #fff; border: 2px solid #e0e0e0;
    border-radius: 14px; padding: 10px 16px;
    font-size: .95rem; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
    min-width: 80px; justify-content: center;
    transition: all .3s;
    position: relative;
  }
  .tree-node.added {
    border-color: #e91e63; background: #fce4ec;
    animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn { 0%{transform:scale(0)}80%{transform:scale(1.1)}100%{transform:scale(1)} }
  .tree-node .tn-emoji { font-size: 1.3rem; }
  .tree-node .dot-area {
    position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
    width: 16px; height: 16px; background: #e91e63;
    border-radius: 50%; cursor: pointer; display: none;
    transition: transform .15s;
  }
  .tree-node .dot-area:active { transform: translateX(-50%) scale(1.3); }
  .tree-node.has-dot .dot-area { display: block; }
  .branch-line {
    width: 2px; height: 20px; background: #b0bec5;
  }
  .add-panel {
    background: #fff; border-radius: 20px;
    padding: 16px; margin-bottom: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,.08);
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
  }
  .add-option {
    background: #fce4ec; border: 2px solid #f48fb1;
    border-radius: 14px; padding: 10px 18px;
    font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: all .2s;
    user-select: none; -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; gap: 6px;
  }
  .add-option:active { transform: scale(.95); }
  .add-option.used { opacity: .35; pointer-events: none; }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; display: none; margin-top: 12px;
  }
  .feedback.show { display: block; }
  .feedback.true { background: #d4edda; color: #155724; }
  .feedback.false { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #e91e63, #c2185b);
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 36px; font-size: 1.2rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(194,24,91,.35);
    transition: transform .15s;
  }
  .btn-restart:hover { transform: scale(1.05); }
  @media (max-width:480px) {
    .header h1 { font-size: 1.2rem; }
    .tree-main { font-size: 1.1rem; padding: 10px 20px; }
    .tree-node { font-size: .85rem; padding: 8px 12px; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .map-tree > * + * { margin-top: 16px; }
  .tree-level > * { margin: 6px; }
  .tree-node > * + * { margin-left: 6px; }
  .add-panel > * { margin: 5px; }
  .add-option > * + * { margin-left: 6px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🌱 Μεγάλωσε τον χάρτη!</h1>
    <p>Πρόσθεσε νέες λέξεις στον χάρτη</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">Χάρτης 1/3</span>
  </div>
  <div class="instructions">
    👆 Πάτησε μια λέξη από κάτω και μετά πάτησε την τελεία ● πάνω σε μια λέξη του χάρτη για να τη συνδέσεις!
  </div>
  <div id="gameArea">
    <div class="map-display">
      <div class="map-tree" id="mapTree"></div>
    </div>
    <div class="add-panel" id="addPanel"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🏆</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Μεγάλωσες όλους τους χάρτες!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var levels = [
    {
      main: '🌳 Δέντρο',
      existing: ['🍃 Φύλλο', '🌿 Κλαδί', '🌱 Ρίζα'],
      additions: [
        { label: '🍎 Καρπός', parentIdx: 0 },
        { label: '🌼 Λουλούδι', parentIdx: 1 },
        { label: '🪵 Κορμός', parentIdx: 2 }
      ]
    },
    {
      main: '🏠 Σπίτι',
      existing: ['🚪 Πόρτα', '🪟 Παράθυρο', '🏠 Δωμάτιο'],
      additions: [
        { label: '🛏️ Υπνοδωμάτιο', parentIdx: 2 },
        { label: '🍳 Κουζίνα', parentIdx: 2 },
        { label: '🛋️ Σαλόνι', parentIdx: 2 }
      ]
    },
    {
      main: '📚 Σχολείο',
      existing: ['👩‍🏫 Δάσκαλος', '🧑‍🎓 Μαθητής', '📖 Βιβλίο'],
      additions: [
        { label: '✏️ Μολύβι', parentIdx: 2 },
        { label: '📓 Τετράδιο', parentIdx: 2 },
        { label: '🖊️ Πίνακας', parentIdx: 0 }
      ]
    }
  ];

  var currentLevel = 0;
  var added = 0;
  var score = 0;
  var selectedAdd = null;

  function startGame() {
    currentLevel = 0; score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    loadLevel();
  }

  function shuffle(a) {
    for (var i = a.length-1; i > 0; i--) {
      var j = Math.floor(Math.random()*(i+1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function loadLevel() {
    if (currentLevel >= levels.length) { showResult(); return; }
    var lv = levels[currentLevel];
    added = 0;
    selectedAdd = null;
    document.getElementById('roundDisplay').textContent = 'Χάρτης ' + (currentLevel+1) + '/' + levels.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';

    var mt = document.getElementById('mapTree');
    mt.innerHTML = '';

    var mainDiv = document.createElement('div');
    mainDiv.className = 'tree-main';
    mainDiv.innerHTML = '<span class="tm-emoji">' + lv.main.match(/^\S+/)[0] + '</span>' + lv.main;
    mt.appendChild(mainDiv);

    var levelDiv = document.createElement('div');
    levelDiv.className = 'tree-level';
    for (var i = 0; i < lv.existing.length; i++) {
      var node = document.createElement('div');
      node.className = 'tree-node has-dot';
      node.innerHTML = lv.existing[i];
      var dot = document.createElement('div');
      dot.className = 'dot-area';
      dot.setAttribute('data-parent', i);
      dot.addEventListener('click', function(e) {
        e.stopPropagation();
        addToNode(this.getAttribute('data-parent'));
      });
      node.appendChild(dot);
      levelDiv.appendChild(node);
    }
    mt.appendChild(levelDiv);

    var ap = document.getElementById('addPanel');
    ap.innerHTML = '';
    var adds = lv.additions.slice();
    shuffle(adds);
    for (var i = 0; i < adds.length; i++) {
      var opt = document.createElement('div');
      opt.className = 'add-option';
      opt.textContent = adds[i].label;
      opt.setAttribute('data-idx', i);
      opt.addEventListener('click', function() { selectAddition(this); });
      ap.appendChild(opt);
    }
  }

  function selectAddition(el) {
    if (el.classList.contains('used')) return;
    if (selectedAdd) selectedAdd.style.borderColor = '#f48fb1';
    selectedAdd = el;
    el.style.borderColor = '#c2185b';
  }

  function addToNode(parentIdx) {
    if (!selectedAdd) {
      var fb = document.getElementById('feedback');
      fb.className = 'feedback show false';
      fb.textContent = '👆 Πάτησε πρώτα μια λέξη από κάτω για να την προσθέσεις!';
      setTimeout(function() { fb.style.display = 'none'; }, 1000);
      return;
    }
    var lv = levels[currentLevel];
    var idx = parseInt(selectedAdd.getAttribute('data-idx'));
    var addData = lv.additions[idx];
    if (parseInt(parentIdx) === addData.parentIdx) {
      selectedAdd.classList.add('used');
      var levelDiv = document.querySelector('.tree-level');
      var newNode = document.createElement('div');
      newNode.className = 'tree-node added';
      newNode.textContent = addData.label;
      levelDiv.appendChild(newNode);
      added++;
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      var fb = document.getElementById('feedback');
      fb.className = 'feedback show true';
      fb.textContent = '✅ Μπράβο! Πρόσθεσες το ' + addData.label + ' στον χάρτη!';
      setTimeout(function() { fb.style.display = 'none'; }, 800);
      selectedAdd = null;
      if (added >= lv.additions.length) {
        setTimeout(function() { currentLevel++; loadLevel(); }, 1200);
      }
    } else {
      var fb = document.getElementById('feedback');
      fb.className = 'feedback show false';
      fb.textContent = '❌ Το ' + addData.label + ' δεν συνδέεται εδώ! Δοκίμασε άλλο σημείο!';
      setTimeout(function() { fb.style.display = 'none'; }, 1000);
    }
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var t = levels.length * 3;
    var e, ti, m;
    if (score === t) { e = '🏆'; ti = 'Τέλεια!'; m = 'Μεγάλωσες όλους τους χάρτες σωστά!' }
    else if (score >= t-2) { e = '🎉'; ti = 'Μπράβο!'; m = 'Σχεδόν όλες οι προσθήκες σωστές!' }
    else if (score >= t/2) { e = '👍'; ti = 'Ωραία!'; m = 'Δοκίμασε ξανά!' }
    else { e = '💪'; ti = 'Καλή αρχή!'; m = 'Κάθε λέξη έχει τη θέση της στον χάρτη!' }
    document.getElementById('resultEmoji').textContent = e;
    document.getElementById('resultTitle').textContent = ti;
    document.getElementById('resultMsg').textContent = 'Πρόσθεσες ' + score + ' από ' + t + ' λέξεις! ' + m;
  }

  startGame();
</script>
</body>
</html>
