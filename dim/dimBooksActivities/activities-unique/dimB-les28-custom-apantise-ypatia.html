<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Απάντησε στην Υπατία 💬</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #e65100, #ff8f00);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(230,81,0,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; text-shadow: 1px 1px 2px rgba(0,0,0,.2); }
  .header p { font-size: .9rem; opacity: .95; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #e65100; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fff8e1; border: 2px dashed #ff8f00; border-radius: 16px;
    padding: 14px; margin-bottom: 14px; text-align: center;
    font-size: 1rem; color: #6b5900;
  }
  .chat-view {
    background: #fff; border-radius: 24px; padding: 16px;
    margin-bottom: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.08);
  }
  .chat-bubble {
    display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px;
  }
  .chat-bubble .cb-avatar { font-size: 2.5rem; flex-shrink: 0; }
  .chat-bubble .cb-content {
    background: #e3f2fd; border-radius: 16px 16px 16px 4px;
    padding: 12px 16px; max-width: 80%;
  }
  .chat-bubble.mine { flex-direction: row-reverse; }
  .chat-bubble.mine .cb-content { background: #f3e5f5; border-radius: 16px 16px 4px 16px; }
  .cb-name { font-size: .75rem; font-weight: 700; color: #1565c0; margin-bottom: 4px; }
  .chat-bubble.mine .cb-name { color: #7b1fa2; text-align: right; }
  .cb-text { font-size: .9rem; color: #333; }
  .action-area {
    background: #fff; border-radius: 20px; padding: 20px;
    margin-bottom: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.08);
    text-align: center;
  }
  .action-q { font-size: 1.1rem; font-weight: 700; color: #2d3436; margin-bottom: 14px; }
  .q-options { display: grid; grid-template-columns: 1fr; grid-gap: 10px; }
  .q-opt {
    background: #fff; border: 3px solid #e0e0e0; border-radius: 14px;
    padding: 14px 16px; cursor: pointer; transition: all .2s;
    user-select: none; -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; gap: 12px;
  }
  .q-opt:active { transform: scale(.98); }
  .q-opt .qo-emoji { font-size: 1.8rem; flex-shrink: 0; }
  .q-opt .qo-text { font-size: .95rem; font-weight: 600; color: #2d3436; text-align: left; }
  .q-opt.correct { border-color: #28a745; background: #d4edda; animation: pop .4s ease; }
  .q-opt.wrong { border-color: #dc3545; background: #f8d7da; animation: shake .4s ease; }
  .q-opt.disabled { pointer-events: none; }
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .feedback { text-align:center; padding:14px; border-radius:16px; font-size:1.1rem; font-weight:700; margin-bottom:12px; display:none; }
  .feedback.show { display:block; }
  .feedback.yay { background:#d4edda; color:#155724; }
  .feedback.nay { background:#f8d7da; color:#721c24; }
  .result-screen { background:#fff; border-radius:24px; box-shadow:0 8px 28px rgba(0,0,0,.1); padding:40px 24px; text-align:center; display:none; }
  .result-screen .big-emoji{font-size:5rem;margin-bottom:12px}
  .result-screen h2{font-size:1.6rem;color:#2d3436;margin-bottom:8px}
  .result-screen p{font-size:1.1rem;color:#666;margin-bottom:20px}
  .btn-restart{background:linear-gradient(135deg,#e65100,#ff8f00);color:#fff;border:none;border-radius:16px;padding:14px 36px;font-size:1.2rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(230,81,0,.35)}
  .btn-restart:active{transform:scale(.95)}
  @media(max-width:480px){body{padding:8px}.header h1{font-size:1.2rem}.chat-bubble .cb-avatar{font-size:2rem}}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .chat-bubble > * + * { margin-left: 10px; }
  .q-opt > * + * { margin-left: 12px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>💬 Απάντησε στην Υπατία</h1>
    <p>Διάβασε και απάντησε στα μηνύματα!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/6</span>
  </div>
  <div class="instructions">📱 Η Υπατία σού έστειλε μήνυμα στην e-me! Τι απαντάς;</div>
  <div id="gameArea">
    <div class="chat-view">
      <div class="chat-bubble">
        <div class="cb-avatar">👩</div>
        <div class="cb-content">
          <div class="cb-name">Υπατία</div>
          <div class="cb-text" id="chatMsg">Γεια σου! Πώς είσαι σήμερα;</div>
        </div>
      </div>
      <div class="chat-bubble mine" id="myReply" style="display:none;">
        <div class="cb-avatar">👦</div>
        <div class="cb-content">
          <div class="cb-name">Εγώ</div>
          <div class="cb-text" id="myReplyText"></div>
        </div>
      </div>
    </div>
    <div class="action-area">
      <div class="action-q" id="actionQ">💬 Τι απαντάς στην Υπατία;</div>
      <div class="q-options" id="qOptions"></div>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg"></p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var conversations = [
    {msg:'Γεια σου! Πώς είσαι σήμερα;',
     opts:[{e:'👋',t:'Γεια! Είμαι πολύ καλά! Εσύ;',ans:true},{e:'🤫',t:'Δεν απαντάω',ans:false},{e:'❓',t:'Ποια είσαι;',ans:false},{e:'📋',t:'Σου στέλνω την άσκηση',ans:false}],
     reply:'Γεια! Είμαι πολύ καλά! Εσύ;'},
    {msg:'Θες να κάνουμε παρέα την άσκηση;',
     opts:[{e:'🙅',t:'Όχι, δεν θέλω',ans:false},{e:'✅',t:'Ναι, ας κάνουμε παρέα!',ans:true},{e:'📝',t:'Στείλε μου την άσκηση',ans:false},{e:'👋',t:'Αντίο',ans:false}],
     reply:'Ναι, ας κάνουμε παρέα!'},
    {msg:'Βρήκα μια ωραία εικόνα για ζώα!',
     opts:[{e:'😐',t:'Δεν με νοιάζει',ans:false},{e:'😍',t:'Τέλεια! Δείξε μου!',ans:true},{e:'📚',t:'Εγώ διαβάζω',ans:false},{e:'❌',t:'Σβήστο',ans:false}],
     reply:'Τέλεια! Δείξε μου!'},
    {msg:'Έχεις δει τα διαδραστικά βιβλία;',
     opts:[{e:'✅',t:'Ναι! Έχουν βίντεο και κουίζ!',ans:true},{e:'❌',t:'Δεν υπάρχουν',ans:false},{e:'📖',t:'Μόνο τα κανονικά',ans:false},{e:'🤷',t:'Δεν ξέρω',ans:false}],
     reply:'Ναι! Έχουν βίντεο και κουίζ!'},
    {msg:'Σου αρέσει η Πληροφορική;',
     opts:[{e:'😊',t:'Ναι, μου αρέσει πολύ!',ans:true},{e:'😴',t:'Βαριέμαι',ans:false},{e:'📱',t:'Προτιμώ παιχνίδια',ans:false},{e:'🤔',t:'Δεν ξέρω ακόμα',ans:false}],
     reply:'Ναι, μου αρέσει πολύ!'},
    {msg:'Θα ήθελες να μάθεις προγραμματισμό;',
     opts:[{e:'🎮',t:'Ναι! Να φτιάξω παιχνίδια!',ans:true},{e:'😰',t:'Φοβάμαι ότι είναι δύσκολο',ans:false},{e:'📝',t:'Μόνο θεωρία',ans:false},{e:'🤷',t:'Δεν με ενδιαφέρει',ans:false}],
     reply:'Ναι! Να φτιάξω παιχνίδια!'}
  ];
  var cur=0,score=0;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function startGame(){
    shuffle(conversations);cur=0;score=0;
    document.getElementById('scoreDisplay').textContent='⭐ 0';
    document.getElementById('gameArea').style.display='block';
    document.getElementById('resultScreen').style.display='none';
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    document.getElementById('myReply').style.display='none';
    loadConv();
  }
  function loadConv(){
    if(cur>=conversations.length){showResult();return;}
    var c=conversations[cur];
    document.getElementById('roundDisplay').textContent=(cur+1)+'/'+conversations.length;
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    document.getElementById('chatMsg').textContent=c.msg;
    document.getElementById('myReply').style.display='none';
    var g=document.getElementById('qOptions');g.innerHTML='';
    for(var i=0;i<c.opts.length;i++){
      (function(idx){
        var o=document.createElement('div');o.className='q-opt';
        o.innerHTML='<span class="qo-emoji">'+c.opts[idx].e+'</span><span class="qo-text">'+c.opts[idx].t+'</span>';
        o.addEventListener('click',function(){choose(idx);});
        g.appendChild(o);
      })(i);
    }
  }
  function choose(idx){
    var c=conversations[cur];var fb=document.getElementById('feedback');
    var opts=document.querySelectorAll('#qOptions .q-opt');
    for(var i=0;i<opts.length;i++)opts[i].classList.add('disabled');
    if(c.opts[idx].ans){score++;
      document.getElementById('scoreDisplay').textContent='⭐ '+score;
      opts[idx].classList.add('correct');
      document.getElementById('myReplyText').textContent=c.reply;
      document.getElementById('myReply').style.display='flex';
      fb.className='feedback show yay';fb.textContent='✅ Μπράβο! Ωραία απάντηση!';
    }else{
      opts[idx].classList.add('wrong');
      for(var i=0;i<c.opts.length;i++){if(c.opts[i].ans){opts[i].classList.add('correct');break;}}
      fb.className='feedback show nay';fb.textContent='❌ Δεν είναι η κατάλληλη απάντηση!';
    }
    setTimeout(function(){cur++;loadConv();},1800);
  }
  function showResult(){
    document.getElementById('gameArea').style.display='none';
    document.getElementById('resultScreen').style.display='block';
    var total=conversations.length,pct=score/total;
    var e,t,m;
    if(pct===1){e='🏆';t='Τέλεια!';m='Επικοινωνείς υπέροχα στην e-me! Είσαι ψηφιακός πολίτης!';}
    else if(pct>=0.75){e='🎉';t='Μπράβο!';m='Τα πήγες πολύ καλά!';}
    else if(pct>=0.5){e='👍';t='Ωραία!';m='Καλή προσπάθεια!';}
    else{e='💪';t='Καλή αρχή!';m='Προσπάθησε ξανά!';}
    document.getElementById('resultEmoji').textContent=e;
    document.getElementById('resultTitle').textContent=t;
    document.getElementById('resultMsg').textContent='Βρήκες '+score+' από '+total+' σωστά! '+m;
  }
  startGame();
</script>
</body>
</html>
