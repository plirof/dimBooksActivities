<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ποιος το κάνει; 🏥</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
    padding: 12px;
    color: #333;
    touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center;
    padding: 18px 16px 12px;
    background: linear-gradient(135deg, #f093fb, #f5576c);
    border-radius: 20px;
    color: #fff;
    box-shadow: 0 6px 20px rgba(245,87,108,.4);
    margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; }
  .header p { font-size: .95rem; opacity: .9; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #f5576c; }
  .round { font-size: 1rem; color: #888; }
  .task-card {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 24px 20px; margin-bottom: 18px;
    text-align: center;
  }
  .task-emoji { font-size: 4rem; margin-bottom: 8px; }
  .task-text {
    font-size: 1.2rem; font-weight: 700; color: #2d3436;
    line-height: 1.5;
  }
  .professions-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-gap: 12px;
    margin-bottom: 14px;
  }
  .prof-card {
    background: #fff; border: 3px solid #e8e8e8;
    border-radius: 18px; padding: 18px 10px;
    text-align: center; cursor: pointer;
    transition: all .2s ease; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .prof-card:active { transform: scale(.95); }
  .prof-card .p-emoji { font-size: 3rem; margin-bottom: 4px; }
  .prof-card .p-name { font-size: 1.1rem; font-weight: 700; color: #2d3436; }
  .prof-card.correct {
    border-color: #28a745; background: #d4edda;
    animation: pop .4s ease;
  }
  .prof-card.wrong {
    border-color: #dc3545; background: #f8d7da;
    animation: shake .4s ease;
  }
  .prof-card.disabled { pointer-events: none; opacity: .7; }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; margin-bottom: 12px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.yay { background: #d4edda; color: #155724; }
  .feedback.nay { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
    border: none; border-radius: 16px; padding: 14px 36px;
    font-size: 1.2rem; font-weight: 700; cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(102,126,234,.35);
    transition: transform .15s;
  }
  .btn-restart:active { transform: scale(.95); }
  @media (max-width: 480px) {
    body { padding: 8px; }
    .header h1 { font-size: 1.2rem; }
    .task-text { font-size: 1.05rem; }
    .prof-card .p-emoji { font-size: 2.5rem; }
  }
</style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>🏥 Ποιος το κάνει;</h1>
    <p>Ταίριαξε τη δουλειά με το επάγγελμα!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/8</span>
  </div>

  <div id="gameArea">
    <div class="task-card" id="taskCard">
      <div class="task-emoji" id="taskEmoji">💊</div>
      <div class="task-text" id="taskText">Γράφει το όνομα του ασθενή και τα φάρμακα</div>
    </div>

    <div class="professions-grid" id="profGrid"></div>

    <div class="feedback" id="feedback"></div>
  </div>

  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>

<script>
  var questions = [
    {
      emoji: '💊',
      text: 'Γράφει το όνομα του ασθενή και τα φάρμακα που παίρνει',
      answer: 0,
      profs: [
        { emoji: '👨‍⚕️', name: 'Γιατρός' },
        { emoji: '👩‍🏫', name: 'Δασκάλα' },
        { emoji: '👨‍🔧', name: 'Μηχανικός' },
        { emoji: '🧑‍💼', name: 'Υπάλληλος' }
      ]
    },
    {
      emoji: '❤️',
      text: 'Συνδέει αισθητήρα για να μετρήσει την καρδιά του ασθενή',
      answer: 0,
      profs: [
        { emoji: '👨‍⚕️', name: 'Γιατρός' },
        { emoji: '👩‍🏫', name: 'Δασκάλα' },
        { emoji: '👨‍🔧', name: 'Μηχανικός' },
        { emoji: '🧑‍💼', name: 'Υπάλληλος' }
      ]
    },
    {
      emoji: '📝',
      text: 'Ετοιμάζει το μάθημα και ασκήσεις για τα παιδιά',
      answer: 1,
      profs: [
        { emoji: '👨‍⚕️', name: 'Γιατρός' },
        { emoji: '👩‍🏫', name: 'Δασκάλα' },
        { emoji: '👨‍🔧', name: 'Μηχανικός' },
        { emoji: '🧑‍💼', name: 'Υπάλληλος' }
      ]
    },
    {
      emoji: '🎵',
      text: 'Ψάχνει μουσική για τη σχολική γιορτή',
      answer: 1,
      profs: [
        { emoji: '👨‍⚕️', name: 'Γιατρός' },
        { emoji: '👩‍🏫', name: 'Δασκάλα' },
        { emoji: '👨‍🔧', name: 'Μηχανικός' },
        { emoji: '🧑‍💼', name: 'Υπάλληλος' }
      ]
    },
    {
      emoji: '🏭',
      text: 'Ελέγχει τα μηχανήματα στο εργοστάσιο',
      answer: 2,
      profs: [
        { emoji: '👨‍⚕️', name: 'Γιατρός' },
        { emoji: '👩‍🏫', name: 'Δασκάλα' },
        { emoji: '👨‍🔧', name: 'Μηχανικός' },
        { emoji: '🧑‍💼', name: 'Υπάλληλος' }
      ]
    },
    {
      emoji: '📦',
      text: 'Ελέγχει την παραγωγή και μεταφορά προϊόντων',
      answer: 2,
      profs: [
        { emoji: '👨‍⚕️', name: 'Γιατρός' },
        { emoji: '👩‍🏫', name: 'Δασκάλα' },
        { emoji: '👨‍🔧', name: 'Μηχανικός' },
        { emoji: '🧑‍💼', name: 'Υπάλληλος' }
      ]
    },
    {
      emoji: '📨',
      text: 'Γράφει επιστολές και επικοινωνεί με πελάτες',
      answer: 3,
      profs: [
        { emoji: '👨‍⚕️', name: 'Γιατρός' },
        { emoji: '👩‍🏫', name: 'Δασκάλα' },
        { emoji: '👨‍🔧', name: 'Μηχανικός' },
        { emoji: '🧑‍💼', name: 'Υπάλληλος' }
      ]
    },
    {
      emoji: '🛒',
      text: 'Υπολογίζει τις τιμές και κάνει πωλήσεις από το διαδίκτυο',
      answer: 3,
      profs: [
        { emoji: '👨‍⚕️', name: 'Γιατρός' },
        { emoji: '👩‍🏫', name: 'Δασκάλα' },
        { emoji: '👨‍🔧', name: 'Μηχανικός' },
        { emoji: '🧑‍💼', name: 'Υπάλληλος' }
      ]
    }
  ];

  var qIndex = 0;
  var score = 0;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function startGame() {
    shuffle(questions);
    qIndex = 0;
    score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    showQuestion();
  }

  function showQuestion() {
    if (qIndex >= questions.length) {
      showResult();
      return;
    }
    var q = questions[qIndex];
    document.getElementById('taskEmoji').textContent = q.emoji;
    document.getElementById('taskText').textContent = q.text;
    document.getElementById('roundDisplay').textContent = (qIndex + 1) + '/' + questions.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';

    var profs = q.profs.slice();
    var grid = document.getElementById('profGrid');
    grid.innerHTML = '';
    for (var i = 0; i < profs.length; i++) {
      (function(idx) {
        var card = document.createElement('div');
        card.className = 'prof-card';
        card.setAttribute('data-idx', idx);
        card.innerHTML = '<div class="p-emoji">' + profs[idx].emoji + '</div><div class="p-name">' + profs[idx].name + '</div>';
        card.addEventListener('click', function() { choose(this, q); });
        grid.appendChild(card);
      })(i);
    }
  }

  function choose(el, q) {
    var cards = document.querySelectorAll('.prof-card');
    for (var i = 0; i < cards.length; i++) cards[i].classList.add('disabled');

    var chosen = parseInt(el.getAttribute('data-idx'));
    var correct = (chosen === q.answer);
    var fb = document.getElementById('feedback');

    if (correct) {
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      el.classList.add('correct');
      fb.className = 'feedback show yay';
      fb.textContent = '✅ Μπράβο! Σωστά!';
    } else {
      el.classList.add('wrong');
      cards[q.answer].classList.add('correct');
      fb.className = 'feedback show nay';
      fb.textContent = '❌ Ωχ! Αυτό το κάνει ο/η ' + q.profs[q.answer].name + '!';
    }

    setTimeout(function() {
      qIndex++;
      showQuestion();
    }, 1600);
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var total = questions.length;
    var pct = score / total;
    var emoji, title, msg;
    if (pct === 1) {
      emoji = '🏆'; title = 'Τέλεια!';
      msg = 'Βρήκες όλα τα επαγγέλματα! Είσαι σούπερ!';
    } else if (pct >= 0.75) {
      emoji = '🎉'; title = 'Μπράβο!';
      msg = 'Τα πήγες πολύ καλά!';
    } else if (pct >= 0.5) {
      emoji = '👍'; title = 'Ωραία!';
      msg = 'Καλή προσπάθεια! Δοκίμασε ξανά!';
    } else {
      emoji = '💪'; title = 'Καλή αρχή!';
      msg = 'Προσπάθησε ξανά! Θα τα πας καλύτερα!';
    }
    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultMsg').textContent = 'Βρήκες ' + score + ' από ' + total + ' σωστά! ' + msg;
  }

  startGame();
</script>
</body>
</html>
