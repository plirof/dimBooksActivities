<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Πάρτι Χορού 🎉</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #f093fb, #f5576c);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(245,87,108,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; }
  .header p { font-size: .9rem; opacity: .85; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #f5576c; }
  .level { font-size: 1rem; color: #888; }
  .instruction {
    background: #fff; border-radius: 20px; padding: 16px 18px;
    margin-bottom: 14px; text-align: center; font-size: 1rem;
    font-weight: 700; color: #2d3436;
    box-shadow: 0 4px 14px rgba(0,0,0,.08); line-height: 1.5;
  }
  .stage {
    background: #2d1b69; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.3);
    padding: 20px; margin-bottom: 14px;
    text-align: center; position: relative;
    min-height: 160px;
  }
  .stage-characters {
    display: flex; justify-content: space-around; align-items: center;
    gap: 12px;
  }
  .stage-char {
    font-size: 3.5rem; transition: all .3s;
  }
  .stage-char.dancing {
    animation: char-dance .5s ease-in-out infinite alternate;
  }
  @keyframes char-dance {
    0%{transform:translateY(0) rotate(-5deg)}100%{transform:translateY(-15px) rotate(5deg)}
  }
  .stage-char:nth-child(2).dancing { animation-delay: .15s; }
  .stage-char:nth-child(3).dancing { animation-delay: .3s; }
  .stage-lights {
    display: flex; gap: 8px; justify-content: center; margin-top: 12px;
  }
  .stage-lights .light {
    width: 12px; height: 12px; border-radius: 50%;
    background: #fbc2eb; animation: blink 1s infinite;
  }
  .stage-lights .light:nth-child(2) { animation-delay: .2s; }
  .stage-lights .light:nth-child(3) { animation-delay: .4s; }
  .stage-lights .light:nth-child(4) { animation-delay: .6s; }
  .stage-lights .light:nth-child(5) { animation-delay: .8s; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  .stage-title {
    color: #fbc2eb; font-size: .8rem; margin-top: 8px;
  }
  .blocks-area {
    background: #fff; border-radius: 20px;
    box-shadow: 0 4px 14px rgba(0,0,0,.08);
    padding: 16px; margin-bottom: 14px;
  }
  .blocks-area h3 { font-size: .9rem; color: #888; margin-bottom: 8px; text-align: center; }
  .code-display {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
  }
  .cd-block {
    background: #e3f2fd; border: 2px solid #90caf9;
    border-radius: 10px; padding: 6px 12px;
    font-size: .95rem; font-weight: 600; color: #1565c0;
  }
  .cd-block.green-flag {
    background: #e8f5e9; border-color: #81c784; color: #2e7d32;
  }
  .cd-block.repeat-forever {
    background: #fce4ec; border-color: #f48fb1; color: #c2185b;
  }
  .cd-block.blue-move {
    background: #e3f2fd; border-color: #90caf9;
  }
  .cd-block.orange-cmd {
    background: #fff3e0; border-color: #ffcc80; color: #e65100;
  }
  .question-area {
    background: #fff; border-radius: 20px;
    box-shadow: 0 4px 14px rgba(0,0,0,.08);
    padding: 16px; margin-bottom: 14px; text-align: center;
  }
  .question-area .q-text {
    font-size: 1.05rem; font-weight: 700; color: #2d3436; margin-bottom: 10px;
  }
  .q-options {
    display: grid; grid-template-columns: 1fr 1fr; grid-gap: 10px;
  }
  .q-opt {
    background: #fff; border: 3px solid #e8e8e8;
    border-radius: 16px; padding: 14px 8px; text-align: center;
    cursor: pointer; transition: all .2s; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .q-opt:active { transform: scale(.95); }
  .q-opt .qo-emoji { font-size: 2.5rem; }
  .q-opt .qo-text { font-size: .9rem; font-weight: 600; color: #555; }
  .q-opt.correct { border-color: #28a745; background: #d4edda; animation: pop .4s ease; }
  .q-opt.wrong { border-color: #dc3545; background: #f8d7da; animation: shake .4s ease; }
  .q-opt.disabled { pointer-events: none; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; display: none;
  }
  .feedback.show { display: block; }
  .feedback.yay { background: #d4edda; color: #155724; }
  .feedback.nay { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff;
    border: none; border-radius: 16px; padding: 14px 36px;
    font-size: 1.2rem; font-weight: 700; cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(245,87,108,.35); transition: transform .15s;
  }
  .btn-restart:active { transform: scale(.95); }
  @media (max-width:480px) {
    body { padding: 8px; }
    .header h1 { font-size: 1.2rem; }
    .stage-char { font-size: 2.8rem; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .stage-characters > * + * { margin-left: 12px; }
  .stage-lights > * + * { margin-left: 8px; }
  .code-display > * { margin: 3px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🎉 Πάρτι Χορού</h1>
    <p>Προγραμμάτισε το πάρτι χορού στο ScratchJr!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="level" id="levelDisplay">1/8</span>
  </div>
  <div id="gameArea">
    <div class="instruction">🎵 Απάντησε στις ερωτήσεις για το πάρτι χορού στο ScratchJr!</div>
    <div class="stage">
      <div class="stage-characters" id="stageChars">
        <div class="stage-char">🧒</div>
        <div class="stage-char">👧</div>
        <div class="stage-char">🐱</div>
      </div>
      <div class="stage-lights"><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span><span class="light"></span></div>
      <div class="stage-title">🎶 Πάρτι Χορού!</div>
    </div>
    <div class="question-area" id="questionArea"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var questions = [
    { emoji: '🟢', text: 'Ποια εντολή βάζουμε στην αρχή όλων των προγραμμάτων για να ξεκινήσουν ταυτόχρονα;', options: [
      {emoji:'🟢',text:'Ξεκίνα με πράσινη σημαία'},{emoji:'🔁',text:'Επανάλαβε'},
      {emoji:'⏹️',text:'Κόκκινο stop'},{emoji:'🏃',text:'Πήγαινε στην αρχή'}
    ], answer: 0 },
    { emoji: '♾️', text: 'Ποια εντολή κάνει τον ήρωα να χορεύει συνεχόμενα χωρίς σταματημό;', options: [
      {emoji:'🔄',text:'Επανάλαβε'},{emoji:'♾️',text:'Επανάλαβε για πάντα'},
      {emoji:'🟢',text:'Πράσινη σημαία'},{emoji:'⏹️',text:'Σταμάτα'}
    ], answer: 1 },
    { emoji: '💃', text: 'Τι κάνει η εντολή ΣΤΡΙΨΕ ΔΕΞΙΑ στον χαρακτήρα;', options: [
      {emoji:'⬆️',text:'Πηδάει επάνω'},{emoji:'🔄',text:'Γυρίζει δεξιά'},
      {emoji:'➡️',text:'Πάει δεξιά'},{emoji:'👋',text:'Χαιρετάει'}
    ], answer: 1 },
    { emoji: '🔄', text: 'Τι κάνει η εντολή ΕΠΑΝΑΛΑΒΕ ΓΙΑ ΠΑΝΤΑ;', options: [
      {emoji:'🔁',text:'Επαναλαμβάνει για πάντα'},{emoji:'1️⃣',text:'Επαναλαμβάνει 1 φορά'},
      {emoji:'⏹️',text:'Σταματάει'},{emoji:'🏃',text:'Πάει στην αρχή'}
    ], answer: 0 },
    { emoji: '⏹️', text: 'Πώς σταματάς όλους τους χαρακτήρες να χορεύουν;', options: [
      {emoji:'🟢',text:'Πατάω πράσινη σημαία'},{emoji:'⏹️',text:'Πατάω κόκκινο stop'},
      {emoji:'📋',text:'Σβήνω το πρόγραμμα'},{emoji:'🚪',text:'Βγαίνω από το ScratchJr'}
    ], answer: 1 },
    { emoji: '📝', text: 'Πώς βάζεις τίτλο στην ιστορία σου στο ScratchJr;', options: [
      {emoji:'📝',text:'Πατάω το γαλάζιο ΑΒC'},{emoji:'🖼️',text:'Αλλάζω σκηνικό'},
      {emoji:'👤',text:'Αλλάζω χαρακτήρα'},{emoji:'🎨',text:'Βάφω το φόντο'}
    ], answer: 0 },
    { emoji: '🐢', text: 'Ποια εντολή κάνει τον χαρακτήρα να κινείται πιο γρήγορα;', options: [
      {emoji:'🐢',text:'Όρισε ταχύτητα'},{emoji:'➡️',text:'Κινήσου δεξιά'},
      {emoji:'⬆️',text:'Πήδα'},{emoji:'🔄',text:'Επανάλαβε'}
    ], answer: 0 },
    { emoji: '🎭', text: 'Με ποια εντολή μπορείς να κάνεις κάθε χαρακτήρα να έχει διαφορετικό χορό;', options: [
      {emoji:'📋',text:'Γράφω διαφορετικό πρόγραμμα για τον καθένα'},{emoji:'🔁',text:'Βάζω την ίδια επανάληψη σε όλους'},
      {emoji:'🟢',text:'Πατάω πράσινη σημαία'},{emoji:'⏹️',text:'Τους σταματάω'}
    ], answer: 0 }
  ];
  var cur=0, score=0;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function startGame(){shuffle(questions);cur=0;score=0;
    document.getElementById('scoreDisplay').textContent='⭐ 0';
    document.getElementById('gameArea').style.display='block';
    document.getElementById('resultScreen').style.display='none';
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    document.getElementById('stageChars').innerHTML='<div class="stage-char">🧒</div><div class="stage-char">👧</div><div class="stage-char">🐱</div>';
    loadLevel();}
  function loadLevel(){
    if(cur>=questions.length){showResult();return;}
    var q=questions[cur];
    document.getElementById('levelDisplay').textContent=(cur+1)+'/'+questions.length;
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    var chars=document.querySelectorAll('.stage-char');
    for(var i=0;i<chars.length;i++)chars[i].classList.add('dancing');
    document.getElementById('questionArea').innerHTML=
      '<div class="q-text">'+q.emoji+' '+q.text+'</div><div class="q-options" id="qOpts"></div>';
    var opts=document.getElementById('qOpts');
    for(var j=0;j<q.options.length;j++){
      (function(idx){
        var opt=document.createElement('div'); opt.className='q-opt';
        opt.innerHTML='<div class="qo-emoji">'+q.options[idx].emoji+'</div><div class="qo-text">'+q.options[idx].text+'</div>';
        opt.addEventListener('click',function(){choose(idx);});
        opts.appendChild(opt);
      })(j);
    }
  }
  function choose(idx){
    var q=questions[cur]; var fb=document.getElementById('feedback');
    var opts=document.querySelectorAll('.q-opt');
    for(var i=0;i<opts.length;i++)opts[i].classList.add('disabled');
    if(idx===q.answer){score++;
      document.getElementById('scoreDisplay').textContent='⭐ '+score;
      opts[idx].classList.add('correct');
      fb.className='feedback show yay';
      fb.textContent='✅ Μπράβο! Σωστά! Το πάρτι συνεχίζεται!';
    }else{
      opts[idx].classList.add('wrong'); opts[q.answer].classList.add('correct');
      fb.className='feedback show nay';
      fb.textContent='❌ Δεν είναι αυτό! Η σωστή απάντηση είναι η άλλη!';
    }
    setTimeout(function(){cur++;loadLevel();},1800);
  }
  function showResult(){
    document.getElementById('gameArea').style.display='none';
    document.getElementById('resultScreen').style.display='block';
    var total=questions.length; var pct=score/total;
    var emoji,title,msg;
    if(pct===1){emoji='🏆';title='Τέλεια!';msg='Ξέρεις τα πάντα για το πάρτι χορού! Είσαι σούπερ!';}
    else if(pct>=0.75){emoji='🎉';title='Μπράβο!';msg='Το πάρτι ήταν υπέροχο! Σχεδόν όλα σωστά!';}
    else if(pct>=0.5){emoji='👍';title='Ωραία!';msg='Καλή προσπάθεια! Το πάρτι συνεχίζεται!';}
    else{emoji='💪';title='Καλή αρχή!';msg='Προσπάθησε ξανά! Το πάρτι σε περιμένει!';}
    document.getElementById('resultEmoji').textContent=emoji;
    document.getElementById('resultTitle').textContent=title;
    document.getElementById('resultMsg').textContent='Βρήκες '+score+' από '+total+' σωστά! '+msg;
  }
  startGame();
</script>
</body>
</html>
