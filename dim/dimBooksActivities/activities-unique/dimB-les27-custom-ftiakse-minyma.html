<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Φτιάξε ένα Ηλεκτρονικό Μήνυμα ✉️</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #1565c0, #42a5f5);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(21,101,192,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; text-shadow: 1px 1px 2px rgba(0,0,0,.2); }
  .header p { font-size: .9rem; opacity: .95; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #1565c0; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #e3f2fd; border: 2px dashed #42a5f5; border-radius: 16px;
    padding: 14px; margin-bottom: 14px; text-align: center;
    font-size: 1rem; color: #0d47a1;
  }
  .message-visual {
    background: #fff; border-radius: 24px; padding: 16px;
    margin-bottom: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.08);
    text-align: center;
  }
  .msg-envelope { font-size: 4rem; margin-bottom: 6px; }
  .msg-label { font-size: .9rem; color: #888; font-weight: 600; }
  .item-area {
    background: #fff; border-radius: 20px; padding: 20px;
    margin-bottom: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.08);
    text-align: center;
  }
  .item-big { font-size: 4rem; margin-bottom: 8px; }
  .item-name { font-size: 1.2rem; font-weight: 700; color: #2d3436; }
  .btn-row {
    display: flex; gap: 14px; justify-content: center; margin-bottom: 14px;
  }
  .btn-action {
    flex: 1; max-width: 180px; padding: 16px; border: none; border-radius: 16px;
    font-size: 1.3rem; font-weight: 700; cursor: pointer; transition: all .15s;
    font-family: inherit; box-shadow: 0 4px 12px rgba(0,0,0,.12);
  }
  .btn-action:active { transform: scale(.92); }
  .btn-send { background: #c8e6c9; color: #2e7d32; }
  .btn-no { background: #ffcdd2; color: #c62828; }
  .btn-action.disabled { pointer-events: none; opacity: .5; }
  .btn-send.selected { background: #4caf50; color: #fff; animation: pop .3s ease; }
  .btn-no.selected { background: #f44336; color: #fff; animation: pop .3s ease; }
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
  .feedback { text-align:center; padding:14px; border-radius:16px; font-size:1.1rem; font-weight:700; margin-bottom:12px; display:none; }
  .feedback.show { display:block; }
  .feedback.yay { background:#d4edda; color:#155724; }
  .feedback.nay { background:#f8d7da; color:#721c24; }
  .result-screen { background:#fff; border-radius:24px; box-shadow:0 8px 28px rgba(0,0,0,.1); padding:40px 24px; text-align:center; display:none; }
  .result-screen .big-emoji{font-size:5rem;margin-bottom:12px}
  .result-screen h2{font-size:1.6rem;color:#2d3436;margin-bottom:8px}
  .result-screen p{font-size:1.1rem;color:#666;margin-bottom:20px}
  .btn-restart{background:linear-gradient(135deg,#1565c0,#42a5f5);color:#fff;border:none;border-radius:16px;padding:14px 36px;font-size:1.2rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(21,101,192,.35)}
  .btn-restart:active{transform:scale(.95)}
  @media(max-width:480px){body{padding:8px}.header h1{font-size:1.2rem}.msg-envelope{font-size:3rem}.item-big{font-size:3rem}}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .btn-row > * + * { margin-left: 14px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>✉️ Φτιάξε ένα Ηλεκτρονικό Μήνυμα</h1>
    <p>Τι μπορείς να στείλεις σε ένα μήνυμα;</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/10</span>
  </div>
  <div class="instructions">📨 Μπορείς να το στείλεις με ένα ηλεκτρονικό μήνυμα; Πάτα ✅ ή ❌!</div>
  <div id="gameArea">
    <div class="message-visual">
      <div class="msg-envelope">✉️</div>
      <div class="msg-label">Ηλεκτρονικό μήνυμα</div>
    </div>
    <div class="item-area">
      <div class="item-big" id="itemBig">📝</div>
      <div class="item-name" id="itemName">Κείμενο</div>
    </div>
    <div class="btn-row">
      <button class="btn-action btn-send" id="btnSend">✅ Ναι</button>
      <button class="btn-action btn-no" id="btnNo">❌ Όχι</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg"></p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var items = [
    {e:'📝', t:'Κείμενο', ans:true},
    {e:'📷', t:'Φωτογραφία', ans:true},
    {e:'🎬', t:'Βίντεο', ans:true},
    {e:'🎵', t:'Ήχος / Μουσική', ans:true},
    {e:'😊', t:'Emoticons (φατσούλες)', ans:true},
    {e:'🍕', t:'Πίτσα (αληθινή)', ans:false},
    {e:'🧸', t:'Λούτρινο αρκουδάκι', ans:false},
    {e:'📦', t:'Δέμα με ρούχα', ans:false},
    {e:'💐', t:'Λουλούδια (αληθινά)', ans:false},
    {e:'🎂', t:'Γενέθλια τούρτα', ans:false}
  ];
  var cur=0,score=0;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function startGame(){
    shuffle(items);cur=0;score=0;
    document.getElementById('scoreDisplay').textContent='⭐ 0';
    document.getElementById('gameArea').style.display='block';
    document.getElementById('resultScreen').style.display='none';
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    loadItem();
  }
  function loadItem(){
    if(cur>=items.length){showResult();return;}
    var i=items[cur];
    document.getElementById('roundDisplay').textContent=(cur+1)+'/'+items.length;
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    document.getElementById('itemBig').textContent=i.e;
    document.getElementById('itemName').textContent=i.t;
    var bs=document.getElementById('btnSend');bs.className='btn-action btn-send';bs.disabled=false;
    var bn=document.getElementById('btnNo');bn.className='btn-action btn-no';bn.disabled=false;
  }
  function choose(ans){
    var i=items[cur];var fb=document.getElementById('feedback');
    var bs=document.getElementById('btnSend');var bn=document.getElementById('btnNo');
    bs.disabled=true;bn.disabled=true;
    if(ans===i.ans){
      score++;document.getElementById('scoreDisplay').textContent='⭐ '+score;
      if(ans){bs.className='btn-action btn-send selected';}else{bn.className='btn-action btn-no selected';}
      fb.className='feedback show yay';fb.textContent='✅ Μπράβο! Σωστά!';
    }else{
      if(ans){bs.className='btn-action btn-send wrong';}else{bn.className='btn-action btn-no wrong';}
      if(i.ans){bs.className='btn-action btn-send selected';}else{bn.className='btn-action btn-no selected';}
      fb.className='feedback show nay';fb.textContent='❌ Το '+i.t+' '+(i.ans?'μπορεί':'δεν μπορεί')+' να σταλεί σε ηλεκτρονικό μήνυμα!';
    }
    setTimeout(function(){cur++;loadItem();},1500);
  }
  function showResult(){
    document.getElementById('gameArea').style.display='none';
    document.getElementById('resultScreen').style.display='block';
    var total=items.length,pct=score/total;
    var e,t,m;
    if(pct===1){e='🏆';t='Τέλεια!';m='Ξέρεις τι μπορείς να στείλεις σε ένα ηλεκτρονικό μήνυμα!';}
    else if(pct>=0.75){e='🎉';t='Μπράβο!';m='Τα πήγες πολύ καλά!';}
    else if(pct>=0.5){e='👍';t='Ωραία!';m='Καλή προσπάθεια!';}
    else{e='💪';t='Καλή αρχή!';m='Προσπάθησε ξανά!';}
    document.getElementById('resultEmoji').textContent=e;
    document.getElementById('resultTitle').textContent=t;
    document.getElementById('resultMsg').textContent='Βρήκες '+score+' από '+total+' σωστά! '+m;
  }
  startGame();
</script>
</body>
</html>
