<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Συνέχισε το Μοτίβο 📿</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
    padding: 12px;
    color: #333;
    touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #a18cd1, #fbc2eb);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(161,140,209,.4);
    margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; }
  .header p { font-size: .9rem; opacity: .85; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #a18cd1; }
  .level { font-size: 1rem; color: #888; }
  .instruction {
    background: #fff; border-radius: 20px; padding: 16px 18px;
    margin-bottom: 14px; text-align: center; font-size: 1rem;
    font-weight: 700; color: #2d3436;
    box-shadow: 0 4px 14px rgba(0,0,0,.08);
    line-height: 1.5;
  }
  .bracelet-area {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 20px; margin-bottom: 14px;
    text-align: center;
    overflow-x: auto;
    white-space: nowrap;
  }
  .bead-row {
    display: inline-flex; gap: 6px; align-items: center;
    padding: 8px 4px;
  }
  .bead {
    width: 48px; height: 48px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 1.6rem; border: 3px solid #ddd;
    transition: all .2s;
    flex-shrink: 0;
  }
  .bead.empty {
    border: 3px dashed #ccc; background: #f9f9f9;
    cursor: pointer;
  }
  .bead.empty:active { transform: scale(.9); }
  .bead.empty.selected { border-color: #a18cd1; background: #ede7f6; }
  .choices {
    display: grid; grid-template-columns: repeat(4, 1fr);
    grid-gap: 10px; margin-bottom: 14px;
  }
  .choice-bead {
    width: 100%; aspect-ratio: 1;
    border-radius: 50%; border: 3px solid #e8e8e8;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.2rem; cursor: pointer;
    transition: all .2s;
    -webkit-tap-highlight-color: transparent;
    background: #fff;
  }
  .choice-bead:active { transform: scale(.92); }
  .choice-bead:hover { border-color: #a18cd1; }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; margin-bottom: 12px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.yay { background: #d4edda; color: #155724; }
  .feedback.nay { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #a18cd1, #fbc2eb); color: #fff;
    border: none; border-radius: 16px; padding: 14px 36px;
    font-size: 1.2rem; font-weight: 700; cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(161,140,209,.35);
    transition: transform .15s;
  }
  .btn-restart:active { transform: scale(.95); }
  @media (max-width: 480px) {
    body { padding: 8px; }
    .header h1 { font-size: 1.2rem; }
    .bead { width: 40px; height: 40px; font-size: 1.3rem; }
    .choice-bead { font-size: 1.8rem; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .bead-row > * + * { margin-left: 6px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>📿 Συνέχισε το Μοτίβο</h1>
    <p>Βρες ποια χάντρα έρχεται μετά!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="level" id="levelDisplay">1/8</span>
  </div>

  <div id="gameArea">
    <div class="instruction" id="instruction">👆 Πάτα την <strong>τελεία</strong> και διάλεξε τη σωστή χάντρα!</div>

    <div class="bracelet-area" id="braceletArea">
      <div class="bead-row" id="beadRow"></div>
    </div>

    <div class="choices" id="choicesGrid"></div>

    <div class="feedback" id="feedback"></div>
  </div>

  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>

<script>
  var levels = [
    { pattern: ['🔴', '🔵', '🔴', '🔵', '🔴'], choices: ['🔵', '🔴', '🟡', '🟢'], answer: 0 },
    { pattern: ['🟡', '🟡', '🔴', '🟡', '🟡'], choices: ['🔴', '🟡', '🔵', '🟢'], answer: 1 },
    { pattern: ['🔴', '🔵', '🟢', '🔴', '🔵'], choices: ['🟢', '🔴', '🟡', '🔵'], answer: 0 },
    { pattern: ['🟣', '🟣', '🔴', '🟣', '🟣'], choices: ['🔴', '🟣', '🟡', '🔵'], answer: 1 },
    { pattern: ['🔴', '🔵', '🔵', '🔴', '🔵'], choices: ['🔵', '🔴', '🟡', '🟣'], answer: 0 },
    { pattern: ['🟢', '🔴', '🟢', '🔴', '🟢'], choices: ['🔴', '🟢', '🟡', '🔵'], answer: 1 },
    { pattern: ['🟡', '🔵', '🔴', '🟡', '🔵'], choices: ['🔴', '🟡', '🟢', '🔵'], answer: 0 },
    { pattern: ['🔴', '🔴', '🟡', '🔴', '🔴'], choices: ['🟡', '🔴', '🟣', '🟢'], answer: 0 }
  ];

  var currentLevel = 0;
  var score = 0;
  var selectedSlot = -1;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function startGame() {
    shuffle(levels);
    currentLevel = 0;
    score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
    loadLevel();
  }

  function loadLevel() {
    if (currentLevel >= levels.length) {
      showResult();
      return;
    }
    var lv = levels[currentLevel];
    document.getElementById('levelDisplay').textContent = (currentLevel + 1) + '/' + levels.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
    selectedSlot = -1;

    var row = document.getElementById('beadRow');
    row.innerHTML = '';
    for (var i = 0; i < lv.pattern.length; i++) {
      var bead = document.createElement('span');
      bead.className = 'bead';
      if (lv.pattern[i] === '?') {
        bead.classList.add('empty');
        bead.textContent = '?';
        bead.setAttribute('data-slot', i);
      } else {
        bead.textContent = lv.pattern[i];
      }
      row.appendChild(bead);
    }

    var emptySlot = document.createElement('span');
    emptySlot.className = 'bead empty selected';
    emptySlot.textContent = '❓';
    row.appendChild(emptySlot);

    var choices = document.getElementById('choicesGrid');
    choices.innerHTML = '';
    for (var j = 0; j < lv.choices.length; j++) {
      (function(idx) {
        var cb = document.createElement('div');
        cb.className = 'choice-bead';
        cb.textContent = lv.choices[idx];
        cb.addEventListener('click', function() { checkAnswer(idx); });
        choices.appendChild(cb);
      })(j);
    }
  }

  function checkAnswer(idx) {
    if (selectedSlot !== -1) return;
    var lv = levels[currentLevel];
    var fb = document.getElementById('feedback');
    selectedSlot = idx;

    var correct = (idx === lv.answer);

    if (correct) {
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      fb.className = 'feedback show yay';
      fb.textContent = '✅ Μπράβο! Συνέχισες σωστά το μοτίβο!';

      var beads = document.querySelectorAll('#beadRow .bead');
      var lastBead = beads[beads.length - 1];
      lastBead.classList.remove('empty', 'selected');
      lastBead.textContent = lv.choices[lv.answer];
    } else {
      fb.className = 'feedback show nay';
      fb.textContent = '❌ Δεν είναι αυτή! Παρατήρησε ξανά το μοτίβο!';
      setTimeout(function() {
        fb.className = 'feedback';
        fb.style.display = 'none';
        selectedSlot = -1;
      }, 1200);
      return;
    }

    setTimeout(function() {
      currentLevel++;
      loadLevel();
    }, 1500);
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var total = levels.length;
    var pct = score / total;
    var emoji, title, msg;
    if (pct === 1) {
      emoji = '🏆'; title = 'Τέλεια!';
      msg = 'Βρήκες όλα τα μοτίβα! Είσαι σούπερ!';
    } else if (pct >= 0.75) {
      emoji = '🎉'; title = 'Μπράβο!';
      msg = 'Ανακάλυψες σχεδόν όλα τα μοτίβα!';
    } else if (pct >= 0.5) {
      emoji = '👍'; title = 'Ωραία!';
      msg = 'Καλή προσπάθεια! Δοκίμασε ξανά!';
    } else {
      emoji = '💪'; title = 'Καλή αρχή!';
      msg = 'Προσπάθησε ξανά! Θα τα πας καλύτερα!';
    }
    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultMsg').textContent = 'Βρήκες ' + score + ' από ' + total + ' σωστά! ' + msg;
  }

  startGame();
/* iron61-aspect-fallback */
(function(){
  if (window.CSS && CSS.supports && CSS.supports('aspect-ratio', '1')) return;
  var F = [['.choice-bead', 1]];
  function sz() {
    for (var j = 0; j < F.length; j++) {
      var els = document.querySelectorAll(F[j][0]), r = F[j][1], mx = F[j][2];
      for (var i = 0; i < els.length; i++) {
        var w = els[i].getBoundingClientRect().width;
        if (w > 1) {
          var h = w / r;
          if (mx && h > mx) h = mx;
          els[i].style.height = Math.round(h) + 'px';
        }
      }
    }
  }
  sz();
  window.addEventListener('resize', sz);
  window.addEventListener('load', sz);
  document.addEventListener('click', function() { setTimeout(sz, 60); });
})();
</script>
</body>
</html>
