<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Εντολές Μεταβλητών | Μάθημα 5</title>
<style>
@font-face{font-family:'EmojiFont';src:local('Noto Color Emoji'),local('Segoe UI Emoji'),local('Apple Color Emoji'),local('Twemoji Mozilla'),url('../fonts/NotoColorEmoji.ttf') format('truetype');unicode-range:U+200D,U+2190-21FF,U+2300-23FF,U+25A0-25FF,U+2600-27BF,U+2900-297F,U+2B00-2BFF,U+FE0F,U+1F000-1FFFF;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;min-height:100vh;background:linear-gradient(135deg,#fce7f3,#f9a8d4);padding:10px;display:flex;flex-direction:column;align-items:center}
h1{color:#831843;font-size:1.05rem;text-align:center;margin:4px 0 2px}
.subtitle{color:#db2777;font-size:.7rem;text-align:center;margin-bottom:6px}
.score-bar{display:flex;gap:8px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.sc{background:#fff;border-radius:8px;padding:4px 10px;color:#831843;font-size:.75rem;font-weight:700;border:1px solid #f9a8d4;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.sc .sl{color:#64748b}
.card{background:#fff;border-radius:18px;box-shadow:0 4px 16px rgba(0,0,0,.08);padding:14px;margin-bottom:8px;max-width:600px;width:100%}
.cmd-card{display:flex;align-items:center;gap:10px;padding:10px;border:2px solid #fce7f3;border-radius:12px;margin:6px 0;background:#fff;transition:all .2s}
.cmd-scratch{flex:1;padding:8px 12px;border-radius:8px;font-size:.72rem;font-weight:700;font-family:monospace;min-height:36px;display:flex;align-items:center}
.cmd-scratch.var-cat{background:#ff8c1a;color:#fff;border:1px solid #e67600}
.cmd-scratch.data-cat{background:#ff6d00;color:#fff;border:1px solid #cc5600}
.cmd-arrow{font-size:.9rem;color:#db2777}
.cmd-effect{flex:1;min-height:36px;border:2px dashed #f9a8d4;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#94a3b8;cursor:pointer;transition:all .2s;padding:4px 8px}
.cmd-effect:hover{background:#fce7f3;border-color:#db2777}
.cmd-effect.filled{border-style:solid;border-color:#db2777;background:#fce7f3;color:#831843;font-weight:700}
.cmd-effect.correct{border-color:#22c55e;background:#dcfce7;color:#14532d}
.cmd-effect.wrong{border-color:#ef4444;background:#fef2f2;color:#dc2626}
.effect-pool{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.effect-chip{padding:6px 12px;border:2px solid #e2e8f0;border-radius:20px;font-size:.65rem;font-weight:700;cursor:pointer;background:#fff;color:#334155;transition:all .2s}
.effect-chip:hover{border-color:#db2777;background:#fce7f3}
.effect-chip.used{opacity:.3;cursor:default}
.info-text{font-size:.7rem;color:#475569;text-align:center;margin:4px 0}
.result-msg{text-align:center;padding:10px;border-radius:10px;font-size:.78rem;font-weight:700;margin:6px 0}
.result-msg.ok{background:#dcfce7;color:#14532d}
.result-msg.bad{background:#fef2f2;color:#dc2626}
.check-btn{display:block;margin:8px auto;padding:10px 24px;border:none;border-radius:10px;background:#db2777;color:#fff;font-size:.8rem;font-weight:700;cursor:pointer}
.check-btn:hover{background:#be185d}
.next-btn{display:block;margin:6px auto;padding:8px 20px;border:2px solid #db2777;border-radius:10px;background:transparent;color:#db2777;font-size:.75rem;font-weight:700;cursor:pointer}
.next-btn:hover{background:#fce7f3}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .score-bar > * { margin: 4px; }
  .cmd-card > * + * { margin-left: 10px; }
  .effect-pool > * { margin: 3px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<h1>📝 Εντολές Μεταβλητών</h1>
<p class="subtitle">Αντίστοιχε τις εντολές Scratch με την αλλαγή που προκαλούν!</p>
<div class="score-bar">
<span class="sc"><span class="sl">Πόντοι:</span> <span id="pts">0</span></span>
<span class="sc"><span class="sl">Μέρος:</span> <span id="qNum">1</span>/<span id="qTotal">2</span></span>
</div>
<div class="card" id="main"></div>
<script>
var parts=[
{
title:'Δημιουργία & Αρχικοποίηση',
commands:[
{scratch:'Νέα μεταβλητή "πόντοι"',cat:'var-cat',answer:'Δημιουργεί μεταβλητή με όνομα "πόντοι"'},
{scratch:'Όρισε πόντους σε 0',cat:'data-cat',answer:'Αρχικοποιεί πόντους = 0 στην αρχή'},
{scratch:'Νέα μεταβλητή "ζωές"',cat:'var-cat',answer:'Δημιουργεί μεταβλητή με όνομα "ζωές"'},
{scratch:'Όρισε ζωές σε 3',cat:'data-cat',answer:'Αρχικοποιεί ζωές = 3 στην αρχή'},
{scratch:'☑️ Εμφάνιση στη σκηνή',cat:'var-cat',answer:'Δείχνει τη μεταβλητή πάνω στη σκηνή'}
]
},
{
title:'Αλλαγή Τιμών',
commands:[
{scratch:'Άλλαξε πόντους κατά 1',cat:'data-cat',answer:'+1 πόντος κάθε φορά που πιάνει αστερία'},
{scratch:'Άλλαξε ζωές κατά -1',cat:'data-cat',answer:'-1 ζωή όταν αγγίζει φουσκωτό'},
{scratch:'Αν αγγίζει "Έλλη" τότε...',cat:'var-cat',answer:'Ελέγχει σύγκρουση αστερίου-Έλλης'},
{scratch:'Όρισε μέγεθος σε 50',cat:'data-cat',answer:'Μικραίνει το sprite στο μισό'},
{scratch:'Γλίστρησε 2 δευτερόλεπτα προς την Έλλη',cat:'var-cat',answer:'Φουσκωτό ακολουθεί αργά την Έλλη'}
]
}
];
var curQ=0,pts=0,answers={},checked=false,selectedEffect=null;

function initQ(){answers={};checked=false;selectedEffect=null;}

function render(){
document.getElementById('qNum').textContent=curQ+1;
document.getElementById('pts').textContent=pts;
var p=parts[curQ];
var main=document.getElementById('main');
var h='';
h+='<div style="font-size:.78rem;font-weight:700;color:#831843;text-align:center">'+p.title+'</div>';
h+='<div class="info-text">Κάνε κλικ σε ένα εφέ και μετά στη σωστή εντολή</div>';
var allEffects=[];
for(var i=0;i<p.commands.length;i++)allEffects.push(p.commands[i].answer);
var shuffled=allEffects.slice().sort(function(){return Math.random()-.5;});
h+='<div class="effect-pool">';
for(var i=0;i<shuffled.length;i++){
var used=false;
for(var j in answers){if(answers[j]===shuffled[i])used=true;}
var cls='effect-chip'+(used?' used':'');
if(!used)h+='<div class="'+cls+'" onclick="pickEffect(\''+escIt(shuffled[i])+'\')">'+shuffled[i]+'</div>';
else h+='<div class="'+cls+'">'+shuffled[i]+'</div>';
}
h+='</div>';
for(var i=0;i<p.commands.length;i++){
var filled=answers[i]!==undefined;
var cls='cmd-effect'+(filled?' filled':'');
if(checked){
cls+=answers[i]===p.commands[i].answer?' correct':' wrong';
}
h+='<div class="cmd-card">';
h+='<div class="cmd-scratch '+p.commands[i].cat+'">'+p.commands[i].scratch+'</div>';
h+='<span class="cmd-arrow">→</span>';
h+='<div class="'+cls+'" onclick="placeIn('+i+')">'+(filled?answers[i]:'Επίλεξε εφέ...')+'</div>';
h+='</div>';
}
var allFilled=Object.keys(answers).length===p.commands.length;
if(allFilled&&!checked){
h+='<button class="check-btn" onclick="checkAnswer()">✓ Έλεγχος Αντιστοίχισης</button>';
}
if(checked){
var correct=0;
for(var i=0;i<p.commands.length;i++){
if(answers[i]===p.commands[i].answer)correct++;
}
var pct=Math.round(correct/p.commands.length*100);
if(pct>=80)pts+=10;
document.getElementById('pts').textContent=pts;
h+='<div class="result-msg '+(pct>=80?'ok':'bad')+'">'+(pct>=80?'✅ '+correct+'/'+p.commands.length+' σωστά!':'❌ '+correct+'/'+p.commands.length+' σωστά.')+'</div>';
if(curQ<parts.length-1){
h+='<button class="next-btn" onclick="nextQ()">Επόμενο Μέρος ▶</button>';
}
}
main.innerHTML=h;
}

function escIt(s){return s.replace(/'/g,'\\\'');}

function pickEffect(eff){selectedEffect=eff;render();}

function placeIn(idx){
if(checked)return;
if(selectedEffect!==null){
answers[idx]=selectedEffect;
selectedEffect=null;
render();
}
}

function checkAnswer(){checked=true;render();}

function nextQ(){
if(curQ<parts.length-1){curQ++;initQ();render();}
}

initQ();render();
</script>
</body>
</html>
