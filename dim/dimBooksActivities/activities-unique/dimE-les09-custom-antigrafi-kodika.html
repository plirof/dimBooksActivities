<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Αντιγραφή Κώδικα | Μάθημα 9</title>
<style>
@font-face{font-family:'EmojiFont';src:local('Noto Color Emoji'),local('Segoe UI Emoji'),local('Apple Color Emoji'),local('Twemoji Mozilla'),url('../fonts/NotoColorEmoji.ttf') format('truetype');unicode-range:U+200D,U+2190-21FF,U+2300-23FF,U+25A0-25FF,U+2600-27BF,U+2900-297F,U+2B00-2BFF,U+FE0F,U+1F000-1FFFF;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;min-height:100vh;background:linear-gradient(135deg,#ecfeff,#67e8f9);padding:10px;display:flex;flex-direction:column;align-items:center}
h1{color:#164e63;font-size:1.05rem;text-align:center;margin:4px 0 2px}
.subtitle{color:#0891b2;font-size:.7rem;text-align:center;margin-bottom:6px}
.score-bar{display:flex;gap:8px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.sc{background:#fff;border-radius:8px;padding:4px 10px;color:#164e63;font-size:.75rem;font-weight:700;border:1px solid #67e8f9;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.sc .sl{color:#64748b}
.card{background:#fff;border-radius:18px;box-shadow:0 4px 16px rgba(0,0,0,.08);padding:14px;margin-bottom:8px;max-width:600px;width:100%}
.scene{background:#ecfeff;border:2px solid #a5f3fc;border-radius:12px;padding:10px;margin:8px 0}
.scene-title{font-size:.75rem;font-weight:700;color:#164e63;text-align:center;margin-bottom:6px}
.sprites-row{display:flex;gap:10px;justify-content:center;margin:8px 0;flex-wrap:wrap}
.sprite-card{width:110px;border:2px solid #e2e8f0;border-radius:10px;padding:8px;text-align:center;background:#fff;cursor:pointer;transition:all .2s}
.sprite-card:hover{border-color:#0891b2;background:#ecfeff}
.sprite-card .sp-icon{font-size:1.6rem}
.sprite-card .sp-name{font-size:.68rem;font-weight:700;color:#164e63;margin-top:2px}
.sprite-card.selected{border-color:#0891b2;background:#cffafe;box-shadow:0 2px 8px rgba(8,145,178,.2)}
.action-area{margin:8px 0}
.action-q{font-size:.72rem;font-weight:700;color:#164e63;text-align:center;margin:4px 0}
.action-opts{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.action-opt{padding:8px 12px;border:2px solid #e2e8f0;border-radius:10px;font-size:.7rem;color:#334155;background:#fff;cursor:pointer;transition:all .2s}
.action-opt:hover{border-color:#0891b2;background:#ecfeff}
.action-opt.selected{border-color:#0891b2;background:#cffafe;color:#164e63;font-weight:700}
.action-opt.correct{border-color:#22c55e;background:#dcfce7;color:#14532d}
.action-opt.wrong{border-color:#ef4444;background:#fef2f2;color:#dc2626}
.info-text{font-size:.7rem;color:#475569;text-align:center;margin:4px 0}
.result-msg{text-align:center;padding:10px;border-radius:10px;font-size:.78rem;font-weight:700;margin:6px 0}
.result-msg.ok{background:#dcfce7;color:#14532d}
.result-msg.bad{background:#fef2f2;color:#dc2626}
.check-btn{display:block;margin:8px auto;padding:10px 24px;border:none;border-radius:10px;background:#0891b2;color:#fff;font-size:.8rem;font-weight:700;cursor:pointer}
.check-btn:hover{background:#0e7490}
.next-btn{display:block;margin:6px auto;padding:8px 20px;border:2px solid #0891b2;border-radius:10px;background:transparent;color:#0891b2;font-size:.75rem;font-weight:700;cursor:pointer}
.next-btn:hover{background:#ecfeff}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .score-bar > * { margin: 4px; }
  .sprites-row > * { margin: 5px; }
  .action-opts > * + * { margin-top: 6px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<h1>👯 Αντιγραφή Κώδικα</h1>
<p class="subtitle">Τι συμβαίνει όταν διπλασιάζουμε χαρακτήρες;</p>
<div class="score-bar">
<span class="sc"><span class="sl">Πόντοι:</span> <span id="pts">0</span></span>
<span class="sc"><span class="sl">Ερώτηση:</span> <span id="qNum">1</span>/<span id="qTotal">5</span></span>
</div>
<div class="card" id="main"></div>
<script>
var questions=[
{
q:'Διπλασιάζεις την Αλεξία → δημιουργείται "Αλεξία2". Τι περιέχει η Αλεξία2;',
opts:['Μόνο τις ενδυμασίες της Αλεξίας','Αντίγραφα όλων των σεναρίων (κώδικα) της Αλεξίας','Κενό πρόγραμμα χωρίς κώδικα','Μόνο την αρχική ενδυμασία'],
correct:1,
explain:'Το αντίγραφο περιέχει αντίγραφα ΟΛΩΝ των σεναρίων του αρχικού!'
},
{
q:'Θέλεις η Αλεξία2 να κάνει ανάποδη ρόδα όταν η Αλεξία κάνει ρόδα. Τι αλλάζεις;',
opts:['Αλλάζεις το υποπρόγραμμα "ρόδα" σε "ανάποδη ρόδα" στην Αλεξία2','Βάζεις την Αλεξία2 να στρίψει αριστερά αντί δεξιά','Διαγράφεις τον κώδικα της Αλεξία2','Αλλάζεις το συμβάν σε άλλο πλήκτρο'],
correct:1,
explain:'Αλλάζουμε "στρίψε δεξιά" σε "στρίψε αριστερά" στην Αλεξία2 — αντίστροφη κίνηση!'
},
{
q:'Πώς αντιγράφεις μπλοκ εντολών από την Αλεξία σε νέο χαρακτήρα;',
opts:['Σύρεις τα μπλοκ πάνω στη νέα μορφή στον χώρο αντικειμένων','Ctrl+C και Ctrl+V στο πληκτρολόγιο','Από το μενού Αρχείο → Αντιγραφή','Δεν γίνεται αντιγραφή μεταξύ μορφών'],
correct:0,
explain:'Σέρνεις τα μπλοκ με το ποντίκι πάνω στη νέα μορφή στα αντικείμενα!'
},
{
q:'Έχεις 2 σενάρια πράσινης σημαίας: χορός + μουσική. Τι συμβαίνει;',
opts:['Εκτελούνται ένα κάθε φορά','Εκτελούνται ταυτόχρονα (παράλληλα)','Εκτελείται μόνο το πρώτο','Παίρνει σφάλμα'],
correct:1,
explain:'Δύο σενάρια ίδιου συμβάντος εκτελούνται Παράλληλα (ταυτόχρονα)!'
},
{
q:'Γιατί βγάλαμε την εντολή "παίξε ήχο" από το σενάριο χορού;',
opts:['Γιατί δεν χρειαζόμαστε ήχο','Γιατί ο ήχος θα έπαιζε ΜΕΤΑ τον χορό (σειριακά)','Γιατί θέλουμε ήχο σε ξεχωριστό παράλληλο σενάριο','Και οι δύο τελευταίες επιλογές'],
correct:3,
explain:'Αν ο ήχος ήταν μέσα στο "για πάντα" του χορού, θα έπαιζε σειριακά. Φτιάχνουμε ξεχωριστό σενάριο για παράλληλη εκτέλεση.'
}
];
var curQ=0,pts=0,selected=-1,checked=false;

function initQ(){selected=-1;checked=false;}

function render(){
document.getElementById('qNum').textContent=curQ+1;
document.getElementById('pts').textContent=pts;
var q=questions[curQ];
var main=document.getElementById('main');
var h='';
h+='<div class="scene"><div class="scene-title">🤔 '+q.q+'</div></div>';
h+='<div class="action-opts">';
for(var i=0;i<q.opts.length;i++){
var cls='action-opt';
if(!checked&&selected===i)cls+=' selected';
if(checked){
if(i===q.correct)cls+=' correct';
else if(selected===i)cls+=' wrong';
}
h+='<div class="'+cls+'" onclick="selectOpt('+i+')">'+q.opts[i]+'</div>';
}
h+='</div>';
if(!checked&&selected>=0){
h+='<button class="check-btn" onclick="checkAnswer()">✓ Έλεγχος</button>';
}
if(checked){
var correct=selected===q.correct;
if(correct)pts+=10;
document.getElementById('pts').textContent=pts;
h+='<div class="result-msg '+(correct?'ok':'bad')+'">'+(correct?'✅ '+q.explain:'❌ '+q.explain)+'</div>';
if(curQ<questions.length-1){
h+='<button class="next-btn" onclick="nextQ()">Επόμενη Ερώτηση ▶</button>';
}
}
main.innerHTML=h;
}

function selectOpt(idx){if(!checked){selected=idx;render();}}
function checkAnswer(){if(selected>=0){checked=true;render();}}
function nextQ(){if(curQ<questions.length-1){curQ++;initQ();render();}}

initQ();render();
</script>
</body>
</html>
