<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Μεταδίδω Μήνυμα | Μάθημα 10</title>
<style>
@font-face{font-family:'EmojiFont';src:local('Noto Color Emoji'),local('Segoe UI Emoji'),local('Apple Color Emoji'),local('Twemoji Mozilla'),url('../fonts/NotoColorEmoji.ttf') format('truetype');unicode-range:U+200D,U+2190-21FF,U+2300-23FF,U+25A0-25FF,U+2600-27BF,U+2900-297F,U+2B00-2BFF,U+FE0F,U+1F000-1FFFF;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#fef3c7,#fde68a);min-height:100vh;padding:12px;display:flex;justify-content:center;align-items:center}
.card{background:#fff;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.12);max-width:700px;width:100%;overflow:hidden}
.header{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;padding:16px 20px;text-align:center}
.header h1{font-size:1.2em}
.header p{font-size:.85em;opacity:.9;margin-top:4px}
.body{padding:16px;display:flex;flex-direction:column;gap:14px}
.info{background:#f5f3ff;border-radius:12px;border-left:4px solid #7c3aed;padding:10px 14px;font-size:.85em;color:#4c1d95;line-height:1.5}
.stage{background:#fffbeb;border-radius:16px;border:3px solid #fde68a;padding:16px;min-height:200px;display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:center;position:relative}
.char-box{text-align:center;padding:12px;background:#fff;border-radius:16px;border:2px solid #e2e8f0;min-width:130px;flex:1;max-width:180px;transition:all .3s}
.char-box .emoji{font-size:3em;display:block}
.char-box .name{font-size:.85em;font-weight:700;color:#1e293b;margin-top:4px}
.char-box .role{font-size:.7em;color:#7c3aed;font-weight:600}
.char-box .speech{font-size:.8em;color:#64748b;margin-top:6px;padding:6px 10px;background:#f8fafc;border-radius:8px;min-height:28px;transition:all .3s}
.char-box .speech.active{background:#ede9fe;color:#4c1d95;font-weight:600}
.arrow-row{display:flex;justify-content:center;gap:8px;align-items:center;font-size:1.5em;color:#a78bfa;width:100%}
.msg-picker{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.msg-btn{padding:10px 18px;border:3px solid #e2e8f0;border-radius:14px;font-size:.9em;font-weight:700;cursor:pointer;transition:all .2s;background:#fff;color:#1e293b;min-width:80px}
.msg-btn:hover{border-color:#a78bfa;background:#f5f3ff;transform:translateY(-2px)}
.msg-btn.selected{border-color:#7c3aed;background:#ede9fe}
.msg-btn.sent{opacity:.5;cursor:default}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{padding:10px 28px;border:none;border-radius:50px;font-size:.9em;font-weight:700;cursor:pointer;transition:all .2s}
.btn:hover{transform:scale(1.05)}
.btn-send{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff}
.btn-send:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.btn-next{background:linear-gradient(135deg,#22c55e,#4ade80);color:#064e3b}
.btn-reset{background:#f0f0f0;color:#555}
.feedback{text-align:center;font-size:.95em;font-weight:700;min-height:28px;padding:6px;border-radius:10px}
.feedback.ok{background:#f0fdf4;color:#16a34a}
.feedback.fail{background:#fef2f2;color:#dc2626}
.progress{display:flex;gap:8px;justify-content:center;margin-bottom:6px}
.dot{width:36px;height:36px;border-radius:50%;border:3px solid #e2e8f0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8em;color:#94a3b8;background:#fff}
.dot.active{border-color:#7c3aed;color:#7c3aed;background:#ede9fe}
.dot.done{border-color:#22c55e;color:#fff;background:#22c55e}
@media(max-width:500px){.char-box{min-width:100px}.char-box .emoji{font-size:2.2em}}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .body > * + * { margin-top: 14px; }
  .stage > * { margin: 10px; }
  .arrow-row > * + * { margin-left: 8px; }
  .msg-picker > * { margin: 4px; }
  .controls > * { margin: 5px; }
  .progress > * + * { margin-left: 8px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="card">
<div class="header">
<h1>📡 Μεταδίδω Μήνυμα</h1>
<p>Πάτα το μήνυμα και μετά «Αποστολή» για να δεις τι γίνεται!</p>
</div>
<div class="body">
<div class="info" id="info">💡 <b>Πώς λειτουργεί:</b> Ένας χαρακτήρας στέλνει ένα <b>μήνυμα</b> (📡) και ένας άλλος το <b>λαμβάνει</b> (📥) και κάνει κάτι!</div>
<div class="progress" id="progress"></div>
<div class="stage" id="stage"></div>
<div class="msg-picker" id="msgPicker"></div>
<div class="feedback" id="feedback"></div>
<div class="controls">
<button class="btn btn-send" id="sendBtn" onclick="sendMessage()" disabled>📡 Αποστολή</button>
<button class="btn btn-next" id="nextBtn" onclick="nextLevel()" style="display:none">➡ Επόμενο</button>
<button class="btn btn-reset" onclick="resetGame()">🔄 Αρχή</button>
</div>
</div>
</div>
<script>
var levels=[
{
sender:{emoji:'🐱',name:'Γατούλα'},
receiver:{emoji:'🐕',name:'Σκυλάκι'},
messages:['φαγητό','παιχνίδι','ύπνο'],
correct:'παιχνίδι',
	senderSays:{
	'φαγητό':'Θέλω φαγητό! 🍝',
	'παιχνίδι':'Πάμε να παίξουμε! 🎾',
	'ύπνο':'Νυστάζω... 😴'
},
receiverReacts:{
	'φαγητό':'Τρέχει για φαγητό! 🍖',
	'παιχνίδι':'Κουνάει την ουρά και τρέχει! 🐕‍🦺',
	'ύπνο':'Ξαπλώνει για ύπνο... 💤'
},
info:'Η Γατούλα θέλει να παίξει. Ποιο μήνυμα πρέπει να στείλει για να παίξει και ο Σκυλάκος;'
},
{
sender:{emoji:'👩‍🏫',name:'Δασκάλα'},
receiver:{emoji:'🧑‍🎓',name:'Μαθητής'},
messages:['διάλειμμα','μάθημα','σιωπή'],
correct:'διάλειμμα',
	senderSays:{
	'διάλειμμα':'Πάμε διάλειμμα! 🏃‍♂️',
	'μάθημα':'Ανοίξτε τα βιβλία σας! 📚',
	'σιωπή':'Ησυχία παρακαλώ! 🤫'
},
receiverReacts:{
	'διάλειμμα':'Πετάγεται από τη θέση του! 🎉',
	'μάθημα':'Ανοίγει το τετράδιο... 📝',
	'σιωπή':'Βάζει το δάχτυλο στα χείλη 🤐'
},
info:'Είναι ώρα για διάλειμμα! Τι μήνυμα πρέπει να στείλει η Δασκάλα;'
},
{
sender:{emoji:'☀️',name:'Ήλιος'},
receiver:{emoji:'🌻',name:'Ηλιοτρόπιο'},
messages:['νύχτα','βροχή','μέρα'],
correct:'μέρα',
	senderSays:{
	'νύχτα':'Νύχτωσε... 🌙',
	'βροχή':'Θα βρέξει! ☔',
	'μέρα':'Ήρθε η μέρα! ☀️'
},
receiverReacts:{
	'νύχτα':'Κλείνει τα πέταλά του 😴',
	'βροχή':'Σκύβει το κεφάλι 😔',
	'μέρα':'Γυρίζει προς τον ήλιο! 🌻'
},
info:'Ο Ήλιος βγήκε! Τι μήνυμα να στείλει για να γυρίσει το Ηλιοτρόπιο προς το μέρος του;'
}
];
var current=0;
var selectedMsg=null;
var sent=false;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function init(){renderProgress();renderLevel();}
function renderProgress(){
var p=document.getElementById('progress');
p.innerHTML='';
for(var i=0;i<levels.length;i++){
var d=document.createElement('div');
d.className='dot';
d.textContent=i+1;
if(i===current)d.classList.add('active');
if(i<current||(i===current&&sent))d.classList.add('done');
p.appendChild(d);
}
}
function renderLevel(){
var lv=levels[current];
sent=false;
selectedMsg=null;
document.getElementById('sendBtn').disabled=true;
document.getElementById('nextBtn').style.display='none';
document.getElementById('feedback').textContent='';
document.getElementById('feedback').className='feedback';
var stage=document.getElementById('stage');
var snd=lv.sender,rcv=lv.receiver;
stage.innerHTML=
'<div class="char-box" id="senderBox"><span class="emoji">'+snd.emoji+'</span><span class="name">'+snd.name+'</span><span class="role">📡 Αποστολέας</span><div class="speech" id="senderSpeech"></div></div>'+
'<div class="arrow-row">➡️</div>'+
'<div class="char-box" id="receiverBox"><span class="emoji">'+rcv.emoji+'</span><span class="name">'+rcv.name+'</span><span class="role">📥 Παραλήπτης</span><div class="speech" id="receiverSpeech"></div></div>';
var picker=document.getElementById('msgPicker');
picker.innerHTML='<div style="width:100%;text-align:center;font-size:.8em;color:#64748b;font-weight:600">Διάλεξε μήνυμα να στείλει ο/η '+snd.name+':</div>';
var msgs=shuffle(lv.messages.slice());
for(var i=0;i<msgs.length;i++){
var b=document.createElement('button');
b.className='msg-btn';
b.textContent='📡 '+msgs[i];
b.dataset.msg=msgs[i];
b.onclick=function(){pickMsg(this.dataset.msg,this);};
picker.appendChild(b);
}
document.getElementById('info').textContent=lv.info;
renderProgress();
}
function pickMsg(msg,btn){
if(sent)return;
document.querySelectorAll('.msg-btn').forEach(function(e){e.classList.remove('selected');});
btn.classList.add('selected');
selectedMsg=msg;
document.getElementById('sendBtn').disabled=false;
document.getElementById('feedback').textContent='';
document.getElementById('feedback').className='feedback';
}
function sendMessage(){
if(!selectedMsg||sent)return;
sent=true;
var lv=levels[current];
document.querySelectorAll('.msg-btn').forEach(function(e){e.classList.add('sent');});
document.getElementById('sendBtn').disabled=true;
var senderSpeech=document.getElementById('senderSpeech');
var receiverSpeech=document.getElementById('receiverSpeech');
senderSpeech.textContent=lv.senderSays[selectedMsg];
senderSpeech.classList.add('active');
setTimeout(function(){
receiverSpeech.textContent=lv.receiverReacts[selectedMsg];
receiverSpeech.classList.add('active');
},600);
var isCorrect=selectedMsg===lv.correct;
setTimeout(function(){
if(isCorrect){
document.getElementById('feedback').className='feedback ok';
document.getElementById('feedback').textContent='🎉 Μπράβο! Το '+lv.receiver.name+' '+lv.receiverReacts[lv.correct].toLowerCase();
document.getElementById('nextBtn').style.display='inline-block';
if(current===levels.length-1)document.getElementById('nextBtn').textContent='🏆 Τέλος!';
renderProgress();
}else{
document.getElementById('feedback').className='feedback fail';
document.getElementById('feedback').textContent='❌ Λάθος μήνυμα! Ο/η '+lv.receiver.name+' δεν κατάλαβε σωστά. Δοκίμασε ξανά!';
setTimeout(function(){
sent=false;
selectedMsg=null;
document.querySelectorAll('.msg-btn').forEach(function(e){
e.classList.remove('sent','selected');
});
document.getElementById('sendBtn').disabled=true;
senderSpeech.textContent='';
senderSpeech.classList.remove('active');
receiverSpeech.textContent='';
receiverSpeech.classList.remove('active');
},2000);
}
},1200);
}
function nextLevel(){
if(current<levels.length-1){current++;renderLevel();}
else{document.querySelector('.body').innerHTML='<div style="text-align:center;padding:30px;font-size:1.3em;color:#16a34a;font-weight:700">🏆 Συγχαρητήρια! Ολοκλήρωσες όλες τις αποστολές!</div>';}
}
function resetGame(){current=0;renderLevel();}
init();
</script>
</body>
</html>
