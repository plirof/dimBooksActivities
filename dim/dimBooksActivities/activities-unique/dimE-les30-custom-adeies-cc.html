<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Commons | Μάθημα 30</title>
<style>
@font-face{font-family:'EmojiFont';src:local('Noto Color Emoji'),local('Segoe UI Emoji'),local('Apple Color Emoji'),local('Twemoji Mozilla'),url('../fonts/NotoColorEmoji.ttf') format('truetype');unicode-range:U+200D,U+2190-21FF,U+2300-23FF,U+25A0-25FF,U+2600-27BF,U+2900-297F,U+2B00-2BFF,U+FE0F,U+1F000-1FFFF;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;min-height:100vh;background:linear-gradient(135deg,#ecfdf5,#6ee7b7);padding:10px;display:flex;flex-direction:column;align-items:center}
h1{color:#064e3b;font-size:1.05rem;text-align:center;margin:4px 0 2px}
.subtitle{color:#059669;font-size:.7rem;text-align:center;margin-bottom:6px}
.score-bar{display:flex;gap:8px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.sc{background:#fff;border-radius:8px;padding:4px 10px;color:#064e3b;font-size:.75rem;font-weight:700;border:1px solid #6ee7b7;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.sc .sl{color:#64748b}
.card{background:#fff;border-radius:18px;box-shadow:0 4px 16px rgba(0,0,0,.08);padding:14px;margin-bottom:8px;max-width:600px;width:100%}
.scene-card{background:#ecfdf5;border:2px solid #a7f3d0;border-radius:12px;padding:10px;margin:6px 0}
.scene-title{font-size:.78rem;font-weight:700;color:#064e3b;text-align:center;margin-bottom:4px}
.scene-desc{font-size:.7rem;color:#065f46;text-align:center}
.cc-opts{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.cc-opt{padding:10px 12px;border:2px solid #e2e8f0;border-radius:10px;font-size:.7rem;color:#334155;background:#fff;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:8px}
.cc-opt:hover{border-color:#059669;background:#ecfdf5}
.cc-opt .cc-icon{font-size:1rem;min-width:24px;text-align:center}
.cc-opt .cc-body{flex:1}
.cc-opt .cc-body .cc-name{font-weight:700}
.cc-opt .cc-body .cc-hint{font-size:.6rem;color:#6b7280}
.cc-opt.selected{border-color:#059669;background:#d1fae5;color:#064e3b}
.cc-opt.correct{border-color:#22c55e;background:#dcfce7;color:#14532d}
.cc-opt.wrong{border-color:#ef4444;background:#fef2f2;color:#dc2626}
.cc-opt.disabled{pointer-events:none;opacity:.7}
.result-msg{text-align:center;padding:10px;border-radius:10px;font-size:.78rem;font-weight:700;margin:6px 0}
.result-msg.ok{background:#dcfce7;color:#14532d}
.result-msg.bad{background:#fef2f2;color:#dc2626}
.check-btn{display:block;margin:8px auto;padding:10px 24px;border:none;border-radius:10px;background:#059669;color:#fff;font-size:.8rem;font-weight:700;cursor:pointer}
.check-btn:hover{background:#047857}
.next-btn{display:block;margin:6px auto;padding:8px 20px;border:2px solid #059669;border-radius:10px;background:transparent;color:#059669;font-size:.75rem;font-weight:700;cursor:pointer}
.next-btn:hover{background:#ecfdf5}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .score-bar > * { margin: 4px; }
  .cc-opts > * + * { margin-top: 6px; }
  .cc-opt > * + * { margin-left: 8px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<h1>© Creative Commons</h1>
<p class="subtitle">Ταίριαξε κάθε σενάριο με τον σωστό όρο CC!</p>
<div class="score-bar">
<span class="sc"><span class="sl">Πόντοι:</span> <span id="pts">0</span></span>
<span class="sc"><span class="sl">Σενάριο:</span> <span id="qNum">1</span>/<span id="qTotal">6</span></span>
</div>
<div class="card" id="main"></div>
<script>
var terms=[
{icon:'👤',name:'BY (Αναφορά Δημιουργού)',hint:'Πρέπει να αναφερθεί ο δημιουργός'},
{icon:'🚫💰',name:'NC (Μη Εμπορική Χρήση)',hint:'Απαγορεύεται η εμπορική χρήση'},
{icon:'🔄',name:'SA (Παρόμοια Διανομή)',hint:'Τροποποιημένα έργα με τους ΙΔΙΟΥΣ όρους'},
{icon:'🔒',name:'ND (Όχι Παράγωγα Έργα)',hint:'Απαγορεύεται η τροποποίηση'}
];
var scenarios=[
{
title:'📸 Χρησιμοποιείς μια φωτογραφία στο project σου',
desc:'Πρέπει να γράψεις το όνομα του φωτογράφου που τράβηξε τη φωτογραφία.',
correct:0,
explain:'BY: Πρέπει πάντα να αναφέρεται ο αρχικός δημιουργός.'
},
{
title:'🎵 Βρίσκεις ένα τραγούδι στο ίντερνετ',
desc:'Θέλεις να το βάλεις σε διαφήμιση. Η άδεια λέει "μη εμπορική χρήση".',
correct:1,
explain:'NC: Δεν μπορείς να το χρησιμοποιήσεις για διαφήμιση (εμπορική χρήση).'
},
{
title:'🖼️ Τροποποιείς ένα σχέδιο',
desc:'Θέλεις να μοιραστείς τη νέα εκδοχή. Η άδεια λέει "με τους ίδιους όρους".',
correct:2,
explain:'SA: Το παράγωγο έργο πρέπει να διανέμεται με τους ΙΔΙΟΥΣ όρους CC.'
},
{
title:'📖 Βρίσκεις ένα e-book με άδεια ND',
desc:'Θέλεις να το μεταφράσεις και να το δημοσιεύσεις.',
correct:3,
explain:'ND: Απαγορεύεται κάθε τροποποίηση (μετάφραση, διασκευή κ.λπ.).'
},
{
title:'🎶 Χρησιμοποιείς ένα κομμάτι μουσικής σε βίντεο',
desc:'Στο βίντεο αναφέρεις το όνομα του συνθέτη.',
correct:0,
explain:'BY: Αναφορά στον δημιουργό — ο βασικός κανόνας κάθε CC άδειας.'
},
{
title:'🖼️ Κατεβάζεις μια εικόνα CC και την τυπώνεις σε μπλούζες για πώληση',
desc:'Η άδεια λέει "μη εμπορική χρήση". Μπορείς να πουλήσεις τις μπλούζες;',
correct:1,
explain:'NC: Η πώληση είναι εμπορική χρήση — ΑΠΑΓΟΡΕΥΕΤΑΙ!'
}
];
var curQ=0,pts=0,selected=-1,checked=false;
function initQ(){selected=-1;checked=false;}
function render(){
document.getElementById('qNum').textContent=curQ+1;
document.getElementById('pts').textContent=pts;
var s=scenarios[curQ];
var main=document.getElementById('main');
var h='';
h+='<div class="scene-card">';
h+='<div class="scene-title">'+s.title+'</div>';
h+='<div class="scene-desc">'+s.desc+'</div>';
h+='</div>';
h+='<p style="font-size:.72rem;font-weight:700;color:#064e3b;text-align:center;margin:4px 0">Ποιος όρος CC εφαρμόζεται;</p>';
h+='<div class="cc-opts">';
for(var i=0;i<terms.length;i++){
var cls='cc-opt';
if(!checked&&selected===i)cls+=' selected';
if(checked){
if(i===s.correct)cls+=' correct';
else if(selected===i)cls+=' wrong';
cls+=' disabled';
}
h+='<div class="'+cls+'" onclick="selectOpt('+i+')">';
h+='<span class="cc-icon">'+terms[i].icon+'</span>';
h+='<span class="cc-body"><span class="cc-name">'+terms[i].name+'</span><br><span class="cc-hint">'+terms[i].hint+'</span></span>';
h+='</div>';
}
h+='</div>';
if(!checked&&selected>=0){
h+='<button class="check-btn" onclick="checkAnswer()">✓ Έλεγχος</button>';
}
if(checked){
var correct=selected===s.correct;
if(correct)pts+=10;
document.getElementById('pts').textContent=pts;
h+='<div class="result-msg '+(correct?'ok':'bad')+'">'+(correct?'✅ '+s.explain:'❌ '+s.explain)+'</div>';
if(curQ<scenarios.length-1){
h+='<button class="next-btn" onclick="nextQ()">Επόμενο Σενάριο ▶</button>';
}
}
main.innerHTML=h;
}
function selectOpt(idx){if(!checked){selected=idx;render();}}
function checkAnswer(){if(selected>=0){checked=true;render();}}
function nextQ(){if(curQ<scenarios.length-1){curQ++;initQ();render();}}
initQ();render();
</script>
</body>
</html>
