<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Σωστή Σειρά 📋</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(102,126,234,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; text-shadow: 1px 1px 2px rgba(0,0,0,.2); }
  .header p { font-size: .9rem; opacity: .95; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #667eea; }
  .round { font-size: 1rem; color: #888; }
  .story-box {
    background: #fff9db; border: 2px dashed #f0c040; border-radius: 16px;
    padding: 16px; margin-bottom: 14px; text-align: center;
    font-size: 1rem; line-height: 1.5; color: #6b5900;
  }
  .positions-area {
    display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px;
  }
  .pos-row {
    display: flex; align-items: center; gap: 10px;
    background: #f0f4ff; border: 3px dashed #bbb; border-radius: 14px;
    padding: 10px 14px; min-height: 52px;
    transition: background .3s;
  }
  .pos-row .pos-label {
    font-size: .8rem; font-weight: 700; min-width: 28px;
    background: #667eea; color: #fff; border-radius: 50%;
    width: 30px; height: 30px; line-height: 30px;
    text-align: center; flex-shrink: 0;
  }
  .pos-row .pos-content {
    font-size: .95rem; color: #bbb; font-weight: 600;
  }
  .pos-row.filled { border-style: solid; border-color: #667eea; background: #e8f0ff; }
  .pos-row.filled .pos-content { color: #2d3436; }
  .pos-row.highlight { border-color: #ffaa00; background: #fff9db; }
  .steps-container {
    display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px;
  }
  .step-row {
    display: flex; align-items: center; gap: 10px;
    background: #fff; border: 3px solid #e0e0e0; border-radius: 14px;
    padding: 10px 14px; cursor: pointer; transition: all .2s ease;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .step-row:active { transform: scale(.97); }
  .step-row .step-num {
    background: #667eea; color: #fff; border-radius: 50%;
    width: 30px; height: 30px; line-height: 30px;
    text-align: center; font-weight: 700; font-size: .85rem; flex-shrink: 0;
  }
  .step-row .step-emoji { font-size: 1.6rem; }
  .step-row .step-text { font-size: .95rem; font-weight: 600; color: #2d3436; }
  .step-row.correct-pos { border-color: #28a745; background: #d4edda; cursor: default; }
  .step-row.wrong-pos { border-color: #dc3545; background: #f8d7da; animation: shake .4s ease; }
  .step-row.disabled { pointer-events: none; }
  .feedback{text-align:center;padding:14px;border-radius:16px;font-size:1.1rem;font-weight:700;margin-bottom:14px;display:none}
  .feedback.show{display:block}
  .feedback.yay{background:#d4edda;color:#155724;border:2px solid #c3e6cb}
  .feedback.nay{background:#f8d7da;color:#721c24;border:2px solid #f5c6cb}
  .result-screen{background:#fff;border-radius:24px;box-shadow:0 8px 28px rgba(0,0,0,.1);padding:40px 24px;text-align:center;display:none}
  .result-screen .big-emoji{font-size:5rem;margin-bottom:12px}
  .result-screen h2{font-size:1.6rem;color:#2d3436;margin-bottom:8px}
  .result-screen p{font-size:1.1rem;color:#666;margin-bottom:20px}
  .btn-restart{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:16px;padding:14px 36px;font-size:1.2rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(102,126,234,.35)}
  .btn-restart:active{transform:scale(.95)}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  @media(max-width:480px){body{padding:8px}.header h1{font-size:1.2rem}}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .positions-area > * + * { margin-top: 6px; }
  .pos-row > * + * { margin-left: 10px; }
  .steps-container > * + * { margin-top: 6px; }
  .step-row > * + * { margin-left: 10px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>📋 Σωστή Σειρά</h1>
    <p>Βάλε στη σειρά τα βήματα!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/4</span>
  </div>
  <div class="story-box" id="storyBox">
    📖 Θέλεις να γράψεις μια πρόσκληση για πάρτι γενεθλίων!<br>
    Βάλε τα βήματα στη σωστή σειρά!
  </div>
  <div id="gameArea">
    <div class="positions-area" id="positionsArea"></div>
    <div class="steps-container" id="stepsContainer"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg"></p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var puzzles = [
    {
      story:'📖 Θέλεις να γράψεις μια πρόσκληση για πάρτι γενεθλίων!',
      steps:[
        {emoji:'💻',text:'Ανοίγω τον υπολογιστή'},
        {emoji:'📝',text:'Ανοίγω τον Επεξεργαστή Κειμένου'},
        {emoji:'✏️',text:'Γράφω την πρόσκληση'},
        {emoji:'◌́',text:'Βάζω τόνους και τελείες'},
        {emoji:'🖨️',text:'Εκτυπώνω την πρόσκληση'}
      ]
    },
    {
      story:'📖 Θέλεις να γράψεις μια λίστα για τα ψώνια!',
      steps:[
        {emoji:'📝',text:'Ανοίγω τον Επεξεργαστή Κειμένου'},
        {emoji:'✏️',text:'Γράφω: γάλα, ψωμί, φρούτα'},
        {emoji:'↵',text:'Πατάω Enter για κάθε νέο πράγμα'},
        {emoji:'💾',text:'Αποθηκεύω τη λίστα'},
        {emoji:'🖨️',text:'Το εκτυπώνω για το σπίτι'}
      ]
    },
    {
      story:'📖 Θέλεις να γράψεις τα λόγια σου για τη γιορτή της μητέρας!',
      steps:[
        {emoji:'💻',text:'Ανοίγω τον υπολογιστή'},
        {emoji:'📝',text:'Ανοίγω τον Επεξεργαστή Κειμένου'},
        {emoji:'❤️',text:'Γράφω: "Σ\' αγαπώ μαμά!"'},
        {emoji:'◌́',text:'Βάζω τόνους και σημεία στίξης'},
        {emoji:'💾',text:'Το αποθηκεύω με το όνομα "Μαμά"'}
      ]
    },
    {
      story:'📖 Θέλεις να γράψεις ένα γράμμα στον φίλο σου!',
      steps:[
        {emoji:'📝',text:'Ανοίγω τον Επεξεργαστή Κειμένου'},
        {emoji:'✏️',text:'Γράφω: "Αγαπημένε μου φίλε"'},
        {emoji:'↵',text:'Αλλάζω παράγραφο'},
        {emoji:'✏️',text:'Γράφω τα νέα μου'},
        {emoji:'💾',text:'Αποθηκεύω το γράμμα'}
      ]
    }
  ];
  var cur=0,score=0;
  var placed=[];
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function startGame(){
    shuffle(puzzles);cur=0;score=0;
    document.getElementById('scoreDisplay').textContent='⭐ 0';
    document.getElementById('gameArea').style.display='block';
    document.getElementById('resultScreen').style.display='none';
    showPuzzle();
  }
  function showPuzzle(){
    if(cur>=puzzles.length){showResult();return;}
    var p=puzzles[cur];
    document.getElementById('storyBox').textContent=p.story;
    document.getElementById('roundDisplay').textContent=(cur+1)+'/'+puzzles.length;
    document.getElementById('feedback').className='feedback';document.getElementById('feedback').style.display='none';
    placed=[];
    for(var i=0;i<p.steps.length;i++)placed.push(null);
    var puzSteps=p.steps.slice();
    shuffle(puzSteps);
    p._shuffled=puzSteps;
    render(p);
  }
  function render(p){
    var posArea=document.getElementById('positionsArea');posArea.innerHTML='';
    for(var i=0;i<placed.length;i++){
      var row=document.createElement('div');row.className='pos-row'+(placed[i]?' filled':'');
      row.setAttribute('data-pos',i);
      var label=document.createElement('span');label.className='pos-label';label.textContent=(i+1);
      var content=document.createElement('span');content.className='pos-content';
      if(placed[i]){content.textContent=placed[i].emoji+' '+placed[i].text;}
      else{content.textContent='⬅️ Βάλε εδώ';}
      row.appendChild(label);row.appendChild(content);
      row.addEventListener('click',function(){placeStep(this);});
      posArea.appendChild(row);
    }
    var stepArea=document.getElementById('stepsContainer');stepArea.innerHTML='';
    for(var i=0;i<p._shuffled.length;i++){
      (function(idx){
        var s=p._shuffled[idx];
        for(var j=0;j<placed.length;j++){if(placed[j]&&placed[j]===s)return;}
        var row=document.createElement('div');row.className='step-row';
        row.setAttribute('data-psidx',idx);
        var num=document.createElement('span');num.className='step-num';num.textContent='?';
        var emoji=document.createElement('span');emoji.className='step-emoji';emoji.textContent=s.emoji;
        var text=document.createElement('span');text.className='step-text';text.textContent=s.text;
        row.appendChild(num);row.appendChild(emoji);row.appendChild(text);
        row.addEventListener('click',function(){selectStep(this,p);});
        stepArea.appendChild(row);
      })(i);
    }
  }
  function selectStep(el,p){
    var idx=parseInt(el.getAttribute('data-psidx'));
    for(var i=0;i<placed.length;i++){if(!placed[i]){placed[i]=p._shuffled[idx];break;}}
    var allPlaced=true;
    for(var i=0;i<placed.length;i++){if(!placed[i]){allPlaced=false;break;}}
    if(allPlaced)checkOrder(p);
    else render(p);
  }
  function checkOrder(p){
    var correct=true;
    for(var i=0;i<placed.length;i++){if(placed[i]!==p.steps[i]){correct=false;break;}}
    var fb=document.getElementById('feedback');
    if(correct){
      score++;document.getElementById('scoreDisplay').textContent='⭐ '+score;
      fb.className='feedback show yay';
      fb.textContent='✅ Μπράβο! Σωστή σειρά!';
      setTimeout(function(){cur++;showPuzzle();},1500);
    } else {
      fb.className='feedback show nay';
      fb.textContent='❌ Ωχ! Λάθος σειρά! Δοκίμασε ξανά!';
      setTimeout(function(){
        placed=[];for(var i=0;i<p.steps.length;i++)placed.push(null);
        render(p);
        fb.className='feedback';fb.style.display='none';
      },1800);
    }
  }
  function showResult(){
    document.getElementById('gameArea').style.display='none';
    document.getElementById('resultScreen').style.display='block';
    var total=puzzles.length,pct=score/total;
    var e,t,m;
    if(pct===1){e='🏆';t='Τέλεια!';m='Ξέρεις να γράφεις κείμενα βήμα-βήμα! Είσαι σούπερ!';}
    else if(pct>=0.75){e='🎉';t='Μπράβο!';m='Τα πήγες πολύ καλά!';}
    else if(pct>=0.5){e='👍';t='Ωραία!';m='Καλή προσπάθεια!';}
    else{e='💪';t='Καλή αρχή!';m='Προσπάθησε ξανά!';}
    document.getElementById('resultEmoji').textContent=e;
    document.getElementById('resultTitle').textContent=t;
    document.getElementById('resultMsg').textContent='Βρήκες '+score+' από '+total+' σωστά! '+m;
  }
  startGame();
</script>
</body>
</html>
