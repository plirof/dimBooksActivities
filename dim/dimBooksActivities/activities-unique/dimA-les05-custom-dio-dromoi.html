<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Δύο Δρόμοι, Ένας Στόχος 🛤️</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
    padding: 12px; color: #333;
  }
  .app-container { max-width: 480px; margin: 0 auto; }
  .header {
    text-align: center; padding: 16px 14px 10px;
    background: linear-gradient(135deg, #f857a6, #ff5858);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(248,87,166,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.3rem; margin-bottom: 2px; }
  .header p { font-size: .95rem; opacity: .95; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 8px 16px;
    margin-bottom: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.1rem; font-weight: 700; color: #f857a6; }
  .round { font-size: .9rem; color: #888; }
  .phase-bar {
    display: flex; justify-content: center; margin-bottom: 12px;
  }
  .phase-chip {
    padding: 8px 18px; border-radius: 20px; font-weight: 700; font-size: .95rem;
    margin: 0 6px; background: #fff; color: #bbb;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .phase-chip.active1 { background: #ff9f43; color: #fff; box-shadow: 0 4px 12px rgba(255,159,67,.4); }
  .phase-chip.active2 { background: #2ecc71; color: #fff; box-shadow: 0 4px 12px rgba(46,204,113,.4); }
  .grid-wrap { display: flex; justify-content: center; margin-bottom: 12px; }
  .grid {
    display: inline-grid;
    grid-gap: 4px;
    background: #8d6e63;
    padding: 5px;
    border-radius: 10px;
  }
  .cell {
    width: 56px; height: 56px;
    background: #fffde7;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.7rem; cursor: pointer;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background .2s, transform .1s;
  }
  .cell:active { transform: scale(.92); }
  .cell.startcell { background: #ffe0b2; }
  .cell.goalcell { background: #fff3cd; }
  .cell.painted1 { background: #ffcc80; }
  .cell.painted2 { background: #a5d6a7; }
  .cell.shake { animation: shake .4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  @media (max-width: 420px) {
    .cell { width: 46px; height: 46px; font-size: 1.3rem; }
  }
  .buttons-row {
    display: flex; justify-content: center; margin-bottom: 12px;
  }
  .btn-action {
    border: none; border-radius: 14px; padding: 10px 22px;
    font-size: 1rem; font-weight: 700; cursor: pointer;
    font-family: inherit; transition: transform .15s;
    box-shadow: 0 4px 10px rgba(0,0,0,.1);
    margin: 0 6px;
    background: #fff3cd; color: #b8860b;
  }
  .btn-action:active { transform: scale(.95); }
  .btn-action:disabled { opacity: .4; cursor: default; transform: none; }
  .feedback {
    text-align: center; padding: 12px; border-radius: 14px;
    font-size: 1rem; font-weight: 700; margin-bottom: 10px; display: none;
  }
  .feedback.correct { display: block; background: #d4edda; color: #155724; }
  .feedback.wrong { display: block; background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1); padding: 40px 24px;
    text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #f857a6, #ff5858);
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 36px; font-size: 1.2rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(248,87,166,.35);
    transition: transform .15s;
  }
  .btn-restart:hover { transform: scale(1.05); }
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🛤️ Δύο Δρόμοι, Ένας Στόχος</h1>
    <p>Η 🐔 θέλει το 🌽 από ΔΥΟ διαφορετικούς δρόμους!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/3</span>
  </div>
  <div id="gameArea">
    <div class="phase-bar">
      <span class="phase-chip" id="chip1">🟠 Μονοπάτι 1</span>
      <span class="phase-chip" id="chip2">🟢 Μονοπάτι 2</span>
    </div>
    <div class="grid-wrap"><div class="grid" id="grid"></div></div>
    <div class="buttons-row">
      <button class="btn-action" id="btnUndo" onclick="undoLast()">↩️ Ξανακόκα</button>
      <button class="btn-action" id="btnClear" onclick="clearCurrent()">🗑️ Σβήσε το τρέχον</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var levels = [
    { grid: [
      ['', '', '', '🌽'],
      ['', '', '', ''],
      ['', '', '', ''],
      ['🐔', '', '', '']
    ]},
    { grid: [
      ['🐔', '', '', ''],
      ['', '', '', ''],
      ['', '', '', ''],
      ['', '', '', '🌽']
    ]},
    { grid: [
      ['', '', '', ''],
      ['🐔', '', '', '🌽'],
      ['', '', '', ''],
      ['', '', '', '']
    ]}
  ];

  var currentLevel = 0, score = 0, busy = false;
  var phase = 1;
  var path1 = [], path2 = [];

  function startGame() {
    currentLevel = 0; score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    loadLevel();
  }

  function findChar(ch) {
    var g = levels[currentLevel].grid;
    for (var r = 0; r < g.length; r++) {
      for (var c = 0; c < g[r].length; c++) {
        if (g[r][c] === ch) return { r: r, c: c };
      }
    }
    return null;
  }

  function currentPath() { return phase === 1 ? path1 : path2; }

  function lastPos() {
    var p = currentPath();
    if (p.length > 0) return p[p.length - 1];
    return findChar('🐔');
  }

  function inPath(arr, r, c) {
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].r === r && arr[i].c === c) return true;
    }
    return false;
  }

  function isAdjacent(r, c, pos) {
    if (!pos) return false;
    var dr = Math.abs(r - pos.r), dc = Math.abs(c - pos.c);
    return (dr + dc) === 1;
  }

  function loadLevel() {
    if (currentLevel >= levels.length) { showResult(); return; }
    busy = false;
    phase = 1;
    path1 = []; path2 = [];
    document.getElementById('roundDisplay').textContent = (currentLevel + 1) + '/' + levels.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
    renderGrid();
    updateChips();
    setButtons(true);
  }

  function updateChips() {
    var c1 = document.getElementById('chip1');
    var c2 = document.getElementById('chip2');
    c1.className = 'phase-chip' + (phase === 1 ? ' active1' : '');
    c2.className = 'phase-chip' + (phase === 2 ? ' active2' : '');
  }

  function renderGrid() {
    var g = levels[currentLevel].grid;
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = 'repeat(' + g[0].length + ', 56px)';
    for (var r = 0; r < g.length; r++) {
      for (var c = 0; c < g[r].length; c++) {
        var cell = document.createElement('div');
        cell.className = 'cell';
        cell.setAttribute('data-r', r);
        cell.setAttribute('data-c', c);
        var v = g[r][c];
        if (v === '🐔') cell.classList.add('startcell');
        else if (v === '🌽') cell.classList.add('goalcell');
        cell.textContent = v;
        cell.onclick = (function(rr, cc) {
          return function() { onCell(rr, cc); };
        })(r, c);
        grid.appendChild(cell);
      }
    }
  }

  function cellEl(r, c) {
    var cells = document.querySelectorAll('.cell');
    for (var i = 0; i < cells.length; i++) {
      if (parseInt(cells[i].getAttribute('data-r')) === r &&
          parseInt(cells[i].getAttribute('data-c')) === c) return cells[i];
    }
    return null;
  }

  function setFeedback(type, text) {
    var fb = document.getElementById('feedback');
    fb.className = 'feedback ' + type;
    fb.style.display = '';
    fb.textContent = text;
  }

  function hideFeedback() {
    var fb = document.getElementById('feedback');
    fb.className = 'feedback';
    fb.style.display = 'none';
  }

  function paintCell(r, c) {
    var el = cellEl(r, c);
    if (phase === 1) el.classList.add('painted1');
    else el.classList.add('painted2');
  }

  function onCell(r, c) {
    if (busy) return;
    var g = levels[currentLevel].grid;
    var v = g[r][c];
    hideFeedback();

    if (v === '🐔') return;

    var p = currentPath();

    if (v === '🌽') {
      if (!isAdjacent(r, c, lastPos())) {
        setFeedback('wrong', 'Πρώτα βάψε τετράγωνα πιο κοντά στο 🌽!');
        return;
      }
      p.push({ r: r, c: c });
      paintCell(r, c);
      if (phase === 1) {
        phase = 2;
        updateChips();
        setFeedback('correct', '🟠 Ωραίο μονοπάτι 1! Τώρα φτιάξε ΑΛΛΟ δρόμο με το πράσινο!');
      } else {
        checkPath2();
      }
      return;
    }

    if (inPath(path1, r, c) && phase === 1) {
      var lp1 = lastPos();
      if (lp1.r === r && lp1.c === c) { undoLast(); }
      else { setFeedback('wrong', 'Βάφεις με τη σειρά! Πάτα το τελευταίο βαμμένο.'); }
      return;
    }
    if (inPath(path2, r, c) && phase === 2) {
      var lp2 = lastPos();
      if (lp2.r === r && lp2.c === c) { undoLast(); }
      else { setFeedback('wrong', 'Βάφεις με τη σειρά! Πάτα το τελευταίο βαμμένο.'); }
      return;
    }

    if (isAdjacent(r, c, lastPos())) {
      p.push({ r: r, c: c });
      paintCell(r, c);
    } else {
      setFeedback('wrong', 'Πάτα τετράγωνο ΔΙΠΛΑ στο τελευταίο σου βήμα! 👉');
    }
  }

  function pathsEqual() {
    if (path1.length !== path2.length) return false;
    for (var i = 0; i < path1.length; i++) {
      if (path1[i].r !== path2[i].r || path1[i].c !== path2[i].c) return false;
    }
    return true;
  }

  function checkPath2() {
    if (pathsEqual()) {
      for (var i = 0; i < path2.length; i++) {
        cellEl(path2[i].r, path2[i].c).classList.remove('painted2');
      }
      path2 = [];
      phase = 2;
      updateChips();
      var el = cellEl(findChar('🌽').r, findChar('🌽').c);
      el.classList.remove('shake');
      void el.offsetWidth;
      el.classList.add('shake');
      setFeedback('wrong', 'Χαχα! Αυτό είναι το ΊΔΙΟ μονοπάτι! Βρες άλλο δρόμο! 🤔');
      return;
    }
    busy = true;
    setButtons(false);
    score++;
    document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
    setFeedback('correct', '🎉 Μπράβο! Δύο διαφορετικά μονοπάτια, ίδιος στόχος! Πολλές λύσεις υπάρχουν!');
    setTimeout(function() {
      currentLevel++;
      loadLevel();
    }, 2400);
  }

  function undoLast() {
    if (busy) return;
    var p = currentPath();
    if (p.length === 0) return;
    var last = p.pop();
    cellEl(last.r, last.c).classList.remove(phase === 1 ? 'painted1' : 'painted2');
    hideFeedback();
  }

  function clearCurrent() {
    if (busy) return;
    var p = currentPath();
    for (var i = 0; i < p.length; i++) {
      cellEl(p[i].r, p[i].c).classList.remove(phase === 1 ? 'painted1' : 'painted2');
    }
    if (phase === 1) { path1 = []; } else { path2 = []; }
    hideFeedback();
  }

  function setButtons(enabled) {
    document.getElementById('btnUndo').disabled = !enabled;
    document.getElementById('btnClear').disabled = !enabled;
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var total = levels.length;
    var emoji, title, msg;
    if (score === total) { emoji = '🏆'; title = 'Τέλεια!'; msg = 'Ξέρεις ότι ένα πρόβλημα έχει πολλές λύσεις!'; }
    else if (score >= 2) { emoji = '🎉'; title = 'Μπράβο!'; msg = 'Βρήκες πολλούς δρόμους!'; }
    else if (score >= 1) { emoji = '👍'; title = 'Ωραία!'; msg = 'Καλή προσπάθεια! Δοκίμασε ξανά!'; }
    else { emoji = '💪'; title = 'Καλή αρχή!'; msg = 'Μην σταματάς! Θα τα καταφέρεις!'; }
    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultMsg').textContent = 'Βρήκες ' + score + ' από ' + total + ' σωστά! ' + msg;
  }

  startGame();
</script>
</body>
</html>
