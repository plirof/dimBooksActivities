<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Βρες το Μοτίβο 🔍</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
    padding: 12px;
    color: #333;
    touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(102,126,234,.4);
    margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; }
  .header p { font-size: .9rem; opacity: .85; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #667eea; }
  .level { font-size: 1rem; color: #888; }
  .instruction {
    background: #fff; border-radius: 20px; padding: 16px 18px;
    margin-bottom: 14px; text-align: center; font-size: 1rem;
    font-weight: 700; color: #2d3436;
    box-shadow: 0 4px 14px rgba(0,0,0,.08);
    line-height: 1.5;
  }
  .bracelet-display {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 24px 16px; margin-bottom: 14px;
    text-align: center;
    overflow-x: auto;
  }
  .bead-row {
    display: inline-flex; gap: 5px; align-items: center;
    flex-wrap: wrap; justify-content: center;
  }
  .bead {
    width: 42px; height: 42px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 1.4rem; border: 3px solid #ddd;
    background: #fff;
  }
  .question-mark {
    font-size: 1.8rem; margin: 0 4px; color: #764ba2;
  }
  .bracelet-label {
    font-size: .9rem; color: #888; margin-bottom: 10px;
  }
  .options {
    display: grid; grid-template-columns: 1fr 1fr;
    grid-gap: 12px; margin-bottom: 14px;
  }
  .opt-card {
    background: #fff; border: 3px solid #e8e8e8;
    border-radius: 18px; padding: 16px 10px;
    text-align: center; cursor: pointer;
    transition: all .2s; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .opt-card:active { transform: scale(.95); }
  .opt-card .opt-beads {
    display: flex; gap: 4px; justify-content: center; flex-wrap: wrap;
  }
  .opt-card .opt-bead {
    width: 36px; height: 36px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 1.2rem; border: 2px solid #ddd;
  }
  .opt-card .opt-label {
    font-size: .95rem; font-weight: 700; color: #555;
    margin-top: 6px;
  }
  .opt-card.correct {
    border-color: #28a745; background: #d4edda;
    animation: pop .4s ease;
  }
  .opt-card.wrong {
    border-color: #dc3545; background: #f8d7da;
    animation: shake .4s ease;
  }
  .opt-card.disabled { pointer-events: none; }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; margin-bottom: 12px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.yay { background: #d4edda; color: #155724; }
  .feedback.nay { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
    border: none; border-radius: 16px; padding: 14px 36px;
    font-size: 1.2rem; font-weight: 700; cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(102,126,234,.35);
    transition: transform .15s;
  }
  .btn-restart:active { transform: scale(.95); }
  @media (max-width: 480px) {
    body { padding: 8px; }
    .header h1 { font-size: 1.2rem; }
    .bead { width: 34px; height: 34px; font-size: 1.1rem; }
    .opt-card .opt-bead { width: 30px; height: 30px; font-size: 1rem; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .bead-row > * { margin: 2.5px; }
  .opt-card .opt-beads > * { margin: 2px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>🔍 Βρες το Μοτίβο</h1>
    <p>Ποια χάντρα επαναλαμβάνεται;</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="level" id="levelDisplay">1/8</span>
  </div>

  <div id="gameArea">
    <div class="instruction">👀 Κοίταξε το βραχιόλι και βρες ποια <strong>ομάδα από χάντρες</strong> επαναλαμβάνεται!</div>

    <div class="bracelet-display">
      <div class="bracelet-label">📿 Το βραχιόλι:</div>
      <div class="bead-row" id="beadRow"></div>
    </div>

    <div class="options" id="optionsGrid"></div>

    <div class="feedback" id="feedback"></div>
  </div>

  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>

<script>
  var levels = [
    { beads: ['🔴','🔵','🔴','🔵','🔴','🔵','🔴','🔵'], patternLen: 2, options: [['🔴','🔵'], ['🔴','🔴'], ['🔵','🔴'], ['🔵','🔵']], answer: 0 },
    { beads: ['🟡','🟡','🔴','🟡','🟡','🔴','🟡','🟡','🔴'], patternLen: 3, options: [['🟡','🟡','🔴'], ['🟡','🔴','🟡'], ['🔴','🟡','🟡'], ['🟡','🟡','🟡']], answer: 0 },
    { beads: ['🔴','🔵','🟢','🔴','🔵','🟢','🔴','🔵','🟢'], patternLen: 3, options: [['🔴','🔵','🟢'], ['🔵','🟢','🔴'], ['🟢','🔴','🔵'], ['🔴','🔵','🔵']], answer: 0 },
    { beads: ['🟣','🟣','🔴','🟣','🟣','🔴','🟣','🟣'], patternLen: 3, options: [['🟣','🟣','🔴'], ['🟣','🔴','🟣'], ['🔴','🟣','🟣'], ['🟣','🟣','🟣']], answer: 0 },
    { beads: ['🔵','🔴','🟡','🔵','🔴','🟡','🔵','🔴','🟡'], patternLen: 3, options: [['🔵','🔴','🟡'], ['🔴','🟡','🔵'], ['🟡','🔵','🔴'], ['🔵','🔵','🔴']], answer: 0 },
    { beads: ['🟢','🔴','🟢','🔴','🟢','🔴','🟢','🔴','🟢'], patternLen: 2, options: [['🟢','🔴'], ['🔴','🟢'], ['🟢','🟢'], ['🔴','🔴']], answer: 0 },
    { beads: ['🔴','🔴','🟡','🟡','🔴','🔴','🟡','🟡'], patternLen: 4, options: [['🔴','🔴','🟡','🟡'], ['🔴','🟡','🔴','🟡'], ['🟡','🟡','🔴','🔴'], ['🔴','🔴','🔴','🟡']], answer: 0 },
    { beads: ['🟣','🟡','🔵','🟣','🟡','🔵','🟣','🟡','🔵'], patternLen: 3, options: [['🟣','🟡','🔵'], ['🟡','🔵','🟣'], ['🔵','🟣','🟡'], ['🟣','🟣','🟡']], answer: 0 }
  ];

  var currentLevel = 0;
  var score = 0;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function startGame() {
    shuffle(levels);
    currentLevel = 0;
    score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
    loadLevel();
  }

  function loadLevel() {
    if (currentLevel >= levels.length) {
      showResult();
      return;
    }
    var lv = levels[currentLevel];
    document.getElementById('levelDisplay').textContent = (currentLevel + 1) + '/' + levels.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';

    var row = document.getElementById('beadRow');
    row.innerHTML = '';
    for (var i = 0; i < lv.beads.length; i++) {
      var bead = document.createElement('span');
      bead.className = 'bead';
      bead.textContent = lv.beads[i];
      row.appendChild(bead);
    }

    var opts = document.getElementById('optionsGrid');
    opts.innerHTML = '';
    for (var j = 0; j < lv.options.length; j++) {
      (function(idx) {
        var card = document.createElement('div');
        card.className = 'opt-card';
        var beadsHtml = '';
        for (var k = 0; k < lv.options[idx].length; k++) {
          beadsHtml += '<span class="opt-bead">' + lv.options[idx][k] + '</span>';
        }
        card.innerHTML = '<div class="opt-beads">' + beadsHtml + '</div><div class="opt-label">Μοτίβο ' + (idx + 1) + '</div>';
        card.addEventListener('click', function() { choose(idx, lv); });
        opts.appendChild(card);
      })(j);
    }
  }

  function choose(idx, lv) {
    var cards = document.querySelectorAll('.opt-card');
    for (var i = 0; i < cards.length; i++) cards[i].classList.add('disabled');
    var fb = document.getElementById('feedback');

    var correct = (idx === lv.answer);

    if (correct) {
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      cards[idx].classList.add('correct');
      fb.className = 'feedback show yay';
      fb.textContent = '✅ Μπράβο! Αυτό είναι το μοτίβο που επαναλαμβάνεται!';
    } else {
      cards[idx].classList.add('wrong');
      cards[lv.answer].classList.add('correct');
      fb.className = 'feedback show nay';
      fb.textContent = '❌ Δεν είναι αυτό! Το μοτίβο είναι η ομάδα ' + (lv.answer + 1) + '!';
    }

    setTimeout(function() {
      currentLevel++;
      loadLevel();
    }, 1800);
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var total = levels.length;
    var pct = score / total;
    var emoji, title, msg;
    if (pct === 1) {
      emoji = '🏆'; title = 'Τέλεια!';
      msg = 'Βρήκες όλα τα μοτίβα! Είσαι ντετέκτιβ!';
    } else if (pct >= 0.75) {
      emoji = '🎉'; title = 'Μπράβο!';
      msg = 'Ανακάλυψες σχεδόν όλα τα μοτίβα!';
    } else if (pct >= 0.5) {
      emoji = '👍'; title = 'Ωραία!';
      msg = 'Καλή προσπάθεια! Δοκίμασε ξανά!';
    } else {
      emoji = '💪'; title = 'Καλή αρχή!';
      msg = 'Προσπάθησε ξανά! Θα γίνεις σούπερ!';
    }
    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultMsg').textContent = 'Βρήκες ' + score + ' από ' + total + ' σωστά! ' + msg;
  }

  startGame();
</script>
</body>
</html>
