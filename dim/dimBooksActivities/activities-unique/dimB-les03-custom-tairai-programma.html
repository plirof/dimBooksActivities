<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ταίριαξε το Πρόγραμμα 🧩</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
    padding: 12px;
    color: #333;
    touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #f093fb, #f5576c);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(245,87,108,.4);
    margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; }
  .header p { font-size: .9rem; opacity: .85; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #f5576c; }
  .level { font-size: 1rem; color: #888; }
  .instruction {
    background: #fff; border-radius: 20px; padding: 16px 18px;
    margin-bottom: 14px; text-align: center; font-size: 1rem;
    font-weight: 700; color: #2d3436;
    box-shadow: 0 4px 14px rgba(0,0,0,.08);
    line-height: 1.5;
  }
  .match-area {
    display: grid; grid-template-columns: 1fr;
    grid-gap: 14px; margin-bottom: 14px;
  }
  .match-item {
    background: #fff; border-radius: 20px;
    box-shadow: 0 4px 14px rgba(0,0,0,.08);
    padding: 16px; text-align: center;
    border: 3px solid #e8e8e8;
    transition: all .2s;
  }
  .match-item .item-label {
    font-size: .85rem; color: #888; font-weight: 600;
    margin-bottom: 6px;
  }
  .match-item .path-visual {
    display: flex; gap: 4px; justify-content: center;
    flex-wrap: wrap; margin-bottom: 8px;
  }
  .match-item .path-step {
    background: #e8f5e9; border: 2px solid #a5d6a7;
    border-radius: 10px; padding: 6px 10px;
    font-size: 1.2rem;
  }
  .match-item .path-arrow {
    font-size: 1.2rem; color: #888;
  }
  .match-choices {
    display: grid; grid-template-columns: 1fr 1fr;
    grid-gap: 10px;
  }
  .match-choice {
    background: #f3e5f5; border: 3px solid #ce93d8;
    border-radius: 16px; padding: 14px 8px;
    text-align: center; cursor: pointer;
    transition: all .2s; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .match-choice:active { transform: scale(.95); }
  .match-choice .mc-num {
    font-size: 2rem; font-weight: 700; color: #8e24aa;
  }
  .match-choice .mc-label {
    font-size: .9rem; color: #666; margin-top: 4px;
  }
  .match-choice.correct {
    border-color: #28a745; background: #d4edda;
    animation: pop .4s ease;
  }
  .match-choice.wrong {
    border-color: #dc3545; background: #f8d7da;
    animation: shake .4s ease;
  }
  .match-choice.disabled { pointer-events: none; }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; margin-bottom: 12px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.yay { background: #d4edda; color: #155724; }
  .feedback.nay { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff;
    border: none; border-radius: 16px; padding: 14px 36px;
    font-size: 1.2rem; font-weight: 700; cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(245,87,108,.35);
    transition: transform .15s;
  }
  .btn-restart:active { transform: scale(.95); }
  @media (max-width: 480px) {
    body { padding: 8px; }
    .header h1 { font-size: 1.2rem; }
    .match-choices { grid-template-columns: 1fr 1fr; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .match-item .path-visual > * { margin: 2px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>🧩 Ταίριαξε το Πρόγραμμα</h1>
    <p>Πόσες επαναλήψεις χρειάζεται το βατραχάκι;</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="level" id="levelDisplay">1/8</span>
  </div>

  <div id="gameArea">
    <div class="instruction">👀 Κοίταξε τη διαδρομή. Πόσες φορές πρέπει να πει «➡️ Πήδα μπροστά»;</div>

    <div class="match-area" id="matchArea"></div>

    <div class="feedback" id="feedback"></div>
  </div>

  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>

<script>
  var levels = [
    { path: ['➡️','➡️','➡️'], correct: 3, choices: [2, 3, 4, 1] },
    { path: ['➡️','➡️'], correct: 2, choices: [1, 2, 3, 5] },
    { path: ['➡️','➡️','➡️','➡️'], correct: 4, choices: [2, 4, 6, 3] },
    { path: ['➡️'], correct: 1, choices: [1, 3, 2, 4] },
    { path: ['➡️','➡️','➡️','➡️','➡️'], correct: 5, choices: [3, 4, 5, 2] },
    { path: ['➡️','➡️','➡️','➡️','➡️','➡️'], correct: 6, choices: [4, 6, 8, 5] },
    { path: ['➡️','➡️','➡️','➡️','➡️','➡️','➡️'], correct: 7, choices: [5, 7, 9, 6] },
    { path: ['➡️','➡️','➡️','➡️','➡️','➡️','➡️','➡️'], correct: 8, choices: [6, 9, 8, 7] }
  ];

  var currentLevel = 0;
  var score = 0;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function startGame() {
    shuffle(levels);
    currentLevel = 0;
    score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
    loadLevel();
  }

  function loadLevel() {
    if (currentLevel >= levels.length) {
      showResult();
      return;
    }
    var lv = levels[currentLevel];
    document.getElementById('levelDisplay').textContent = (currentLevel + 1) + '/' + levels.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';

    var area = document.getElementById('matchArea');
    area.innerHTML = '';

    var item = document.createElement('div');
    item.className = 'match-item';
    var pathHtml = '';
    for (var i = 0; i < lv.path.length; i++) {
      if (i > 0) pathHtml += '<span class="path-arrow">→</span>';
      pathHtml += '<span class="path-step">' + lv.path[i] + '</span>';
    }
    item.innerHTML = '<div class="item-label">🐸 Το βατραχάκι θέλει να πάει:</div><div class="path-visual">' + pathHtml + '</div>';

    var choicesHtml = '<div class="match-choices">';
    for (var j = 0; j < lv.choices.length; j++) {
      choicesHtml += '<div class="match-choice" data-val="' + lv.choices[j] + '"><div class="mc-num">' + lv.choices[j] + '</div><div class="mc-label">φορές</div></div>';
    }
    choicesHtml += '</div>';
    item.innerHTML += choicesHtml;
    area.appendChild(item);

    var choiceEls = area.querySelectorAll('.match-choice');
    for (var k = 0; k < choiceEls.length; k++) {
      (function(el) {
        el.addEventListener('click', function() {
          var val = parseInt(el.getAttribute('data-val'));
          checkAnswer(val);
        });
      })(choiceEls[k]);
    }
  }

  function checkAnswer(val) {
    var lv = levels[currentLevel];
    var fb = document.getElementById('feedback');
    var choices = document.querySelectorAll('.match-choice');
    for (var i = 0; i < choices.length; i++) choices[i].classList.add('disabled');

    var correct = (val === lv.correct);

    if (correct) {
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      fb.className = 'feedback show yay';
      fb.textContent = '✅ Μπράβο! ' + val + ' φορές «Πήδα μπροστά»!';
      // highlight correct
      for (var i = 0; i < choices.length; i++) {
        if (parseInt(choices[i].getAttribute('data-val')) === val) {
          choices[i].classList.add('correct');
        }
      }
    } else {
      fb.className = 'feedback show nay';
      fb.textContent = '❌ Θέλει ' + lv.correct + ' φορές, όχι ' + val + '!';
      for (var i = 0; i < choices.length; i++) {
        var cv = parseInt(choices[i].getAttribute('data-val'));
        if (cv === lv.correct) choices[i].classList.add('correct');
        if (cv === val) choices[i].classList.add('wrong');
      }
    }

    setTimeout(function() {
      currentLevel++;
      loadLevel();
    }, 1800);
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var total = levels.length;
    var pct = score / total;
    var emoji, title, msg;
    if (pct === 1) {
      emoji = '🏆'; title = 'Τέλεια!';
      msg = 'Ταίριαξες όλα τα προγράμματα! Είσαι σούπερ!';
    } else if (pct >= 0.75) {
      emoji = '🎉'; title = 'Μπράβο!';
      msg = 'Τα πήγες πολύ καλά!';
    } else if (pct >= 0.5) {
      emoji = '👍'; title = 'Ωραία!';
      msg = 'Καλή προσπάθεια! Δοκίμασε ξανά!';
    } else {
      emoji = '💪'; title = 'Καλή αρχή!';
      msg = 'Προσπάθησε ξανά! Θα τα πας καλύτερα!';
    }
    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultMsg').textContent = 'Βρήκες ' + score + ' από ' + total + ' σωστά! ' + msg;
  }

  startGame();
</script>
</body>
</html>
