<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Κυψέλη ή όχι; 🐝</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #fff9c4 0%, #ffe082 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #f57c00, #ffb300);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(245,124,0,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; text-shadow: 1px 1px 2px rgba(0,0,0,.2); }
  .header p { font-size: .9rem; opacity: .95; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #f57c00; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fff3e0; border: 2px dashed #ff9800; border-radius: 16px;
    padding: 14px; margin-bottom: 14px; text-align: center;
    font-size: 1rem; color: #6b5900;
  }
  .hive-visual {
    background: #fff; border-radius: 24px; padding: 20px;
    margin-bottom: 14px; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.08);
  }
  .hive-icon { font-size: 5rem; margin-bottom: 6px; }
  .hive-label { font-size: .9rem; color: #888; font-weight: 600; }
  .item-card {
    background: #fff; border-radius: 20px; padding: 20px;
    margin-bottom: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.08);
    text-align: center;
  }
  .item-emoji { font-size: 4rem; margin-bottom: 8px; }
  .item-text { font-size: 1.2rem; font-weight: 700; color: #2d3436; }
  .btn-row {
    display: flex; gap: 14px; justify-content: center; margin-bottom: 14px;
  }
  .btn-action {
    flex: 1; max-width: 180px; padding: 16px; border: none; border-radius: 16px;
    font-size: 1.3rem; font-weight: 700; cursor: pointer; transition: all .15s;
    font-family: inherit; box-shadow: 0 4px 12px rgba(0,0,0,.12);
  }
  .btn-action:active { transform: scale(.92); }
  .btn-yes { background: #c8e6c9; color: #2e7d32; }
  .btn-no { background: #ffcdd2; color: #c62828; }
  .btn-action.disabled { pointer-events: none; opacity: .5; }
  .btn-yes.selected { background: #4caf50; color: #fff; animation: pop .3s ease; }
  .btn-no.selected { background: #f44336; color: #fff; animation: pop .3s ease; }
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
  .feedback { text-align:center; padding:14px; border-radius:16px; font-size:1.1rem; font-weight:700; margin-bottom:12px; display:none; }
  .feedback.show { display:block; }
  .feedback.yay { background:#d4edda; color:#155724; }
  .feedback.nay { background:#f8d7da; color:#721c24; }
  .result-screen { background:#fff; border-radius:24px; box-shadow:0 8px 28px rgba(0,0,0,.1); padding:40px 24px; text-align:center; display:none; }
  .result-screen .big-emoji{font-size:5rem;margin-bottom:12px}
  .result-screen h2{font-size:1.6rem;color:#2d3436;margin-bottom:8px}
  .result-screen p{font-size:1.1rem;color:#666;margin-bottom:20px}
  .btn-restart{background:linear-gradient(135deg,#f57c00,#ffb300);color:#fff;border:none;border-radius:16px;padding:14px 36px;font-size:1.2rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(245,124,0,.35)}
  .btn-restart:active{transform:scale(.95)}
  @media(max-width:480px){body{padding:8px}.header h1{font-size:1.2rem}.hive-icon{font-size:3.5rem}.item-emoji{font-size:3rem}.btn-action{font-size:1.1rem}}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .btn-row > * + * { margin-left: 14px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🐝 Κυψέλη ή όχι;</h1>
    <p>Τι ανήκει στην e-me κυψέλη;</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/10</span>
  </div>
  <div class="instructions">🤔 Δες κάθε έννοια. Αν ανήκει στην κυψέλη πάτα ✅, αν όχι πάτα ❌!</div>
  <div id="gameArea">
    <div class="hive-visual">
      <div class="hive-icon">🐝</div>
      <div class="hive-label">Η Κυψέλη μου στην e-me</div>
    </div>
    <div class="item-card">
      <div class="item-emoji" id="itemEmoji">👥</div>
      <div class="item-text" id="itemText">Μέλη</div>
    </div>
    <div class="btn-row">
      <button class="btn-action btn-yes" id="btnYes">✅ Ναι</button>
      <button class="btn-action btn-no" id="btnNo">❌ Όχι</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg"></p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var items = [
    {e:'👥', t:'Μέλη (συμμαθητές)', ans:true},
    {e:'👨‍🏫', t:'Υπεύθυνος (εκπαιδευτικός)', ans:true},
    {e:'🧱', t:'Τοίχος (ανακοινώσεις)', ans:true},
    {e:'📝', t:'Αναρτήσεις και σχόλια', ans:true},
    {e:'🐝', t:'Κυψέλη (το μάθημα)', ans:true},
    {e:'📚', t:'Βιβλιοθήκη της γειτονιάς', ans:false},
    {e:'🏪', t:'Κατάστημα παιχνιδιών', ans:false},
    {e:'🎮', t:'Κονσόλα βιντεοπαιχνιδιών', ans:false},
    {e:'📺', t:'Τηλεόραση', ans:false},
    {e:'🍕', t:'Πιτσαρία', ans:false}
  ];
  var cur=0,score=0;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function startGame(){
    shuffle(items);cur=0;score=0;
    document.getElementById('scoreDisplay').textContent='⭐ 0';
    document.getElementById('gameArea').style.display='block';
    document.getElementById('resultScreen').style.display='none';
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    document.getElementById('btnYes').className='btn-action btn-yes';
    document.getElementById('btnNo').className='btn-action btn-no';
    loadItem();
  }
  function loadItem(){
    if(cur>=items.length){showResult();return;}
    var i=items[cur];
    document.getElementById('roundDisplay').textContent=(cur+1)+'/'+items.length;
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    document.getElementById('itemEmoji').textContent=i.e;
    document.getElementById('itemText').textContent=i.t;
    var by=document.getElementById('btnYes');by.className='btn-action btn-yes';by.disabled=false;
    var bn=document.getElementById('btnNo');bn.className='btn-action btn-no';bn.disabled=false;
  }
  function choose(ans){
    var i=items[cur];var fb=document.getElementById('feedback');
    var by=document.getElementById('btnYes');var bn=document.getElementById('btnNo');
    by.disabled=true;bn.disabled=true;
    if(ans===i.ans){
      score++;document.getElementById('scoreDisplay').textContent='⭐ '+score;
      if(ans){by.className='btn-action btn-yes selected';}else{bn.className='btn-action btn-no selected';}
      fb.className='feedback show yay';fb.textContent='✅ Μπράβο! Σωστά!';
    }else{
      if(ans){by.className='btn-action btn-yes wrong';}else{bn.className='btn-action btn-no wrong';}
      if(i.ans){by.className='btn-action btn-yes selected';}else{bn.className='btn-action btn-no selected';}
      fb.className='feedback show nay';fb.textContent='❌ Δεν είναι σωστό! Η σωστή απάντηση: '+(i.ans?'✅ Ναι':'❌ Όχι');
    }
    setTimeout(function(){cur++;loadItem();},1500);
  }
  function showResult(){
    document.getElementById('gameArea').style.display='none';
    document.getElementById('resultScreen').style.display='block';
    var total=items.length,pct=score/total;
    var e,t,m;
    if(pct===1){e='🏆';t='Τέλεια!';m='Γνωρίζεις τα πάντα για την κυψέλη της e-me!';}
    else if(pct>=0.75){e='🎉';t='Μπράβο!';m='Τα πήγες πολύ καλά!';}
    else if(pct>=0.5){e='👍';t='Ωραία!';m='Καλή προσπάθεια!';}
    else{e='💪';t='Καλή αρχή!';m='Προσπάθησε ξανά!';}
    document.getElementById('resultEmoji').textContent=e;
    document.getElementById('resultTitle').textContent=t;
    document.getElementById('resultMsg').textContent='Βρήκες '+score+' από '+total+' σωστά! '+m;
  }
  startGame();
</script>
</body>
</html>
