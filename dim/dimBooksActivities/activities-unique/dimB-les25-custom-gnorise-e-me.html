<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Γνώρισε την e-me 🐝</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #fff9c4 0%, #fff176 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #fdd835, #f9a825);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(253,216,53,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; text-shadow: 1px 1px 2px rgba(0,0,0,.2); }
  .header p { font-size: .9rem; opacity: .95; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #f9a825; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fffde7; border: 2px dashed #fdd835; border-radius: 16px;
    padding: 14px; margin-bottom: 14px; text-align: center;
    font-size: 1rem; color: #6b5900;
  }
  .eme-interface {
    background: #fff; border-radius: 24px; padding: 16px;
    margin-bottom: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.08);
    text-align: center;
  }
  .eme-screen {
    display: inline-block; background: linear-gradient(135deg, #1565c0, #1976d2);
    border-radius: 16px; padding: 18px; width: 100%; max-width: 420px;
  }
  .eme-topbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; background: rgba(255,255,255,.15);
    border-radius: 12px; padding: 8px 12px;
  }
  .eme-item {
    display: flex; align-items: center; gap: 6px; color: #fff;
    font-size: .8rem; font-weight: 600;
  }
  .eme-item .ei-badge {
    background: #f44336; color: #fff; border-radius: 50%;
    width: 20px; height: 20px; font-size: .7rem;
    display: flex; align-items: center; justify-content: center;
  }
  .eme-body {
    text-align: left;
  }
  .eme-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,.1);
  }
  .eme-label {
    color: #fff; font-size: .85rem; font-weight: 500; flex: 1;
  }
  .eme-label .el-num { font-weight: 700; color: #ffeb3b; }
  .question-box {
    background: #fff; border-radius: 20px; padding: 16px;
    margin-bottom: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.08);
    text-align: center;
  }
  .q-text { font-size: 1.1rem; font-weight: 700; color: #2d3436; margin-bottom: 12px; }
  .q-emoji { font-size: 2.5rem; margin-bottom: 6px; }
  .q-options { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 10px; }
  .q-opt {
    background: #fff; border: 3px solid #e0e0e0; border-radius: 14px;
    padding: 12px 8px; cursor: pointer; transition: all .2s;
    user-select: none; -webkit-tap-highlight-color: transparent;
    text-align: center;
  }
  .q-opt:active { transform: scale(.95); }
  .q-opt .qo-emoji { font-size: 2rem; }
  .q-opt .qo-text { font-size: .85rem; font-weight: 600; color: #555; margin-top: 4px; }
  .q-opt.correct { border-color: #28a745; background: #d4edda; animation: pop .4s ease; }
  .q-opt.wrong { border-color: #dc3545; background: #f8d7da; animation: shake .4s ease; }
  .q-opt.disabled { pointer-events: none; }
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .feedback { text-align:center; padding:14px; border-radius:16px; font-size:1.1rem; font-weight:700; margin-bottom:12px; display:none; }
  .feedback.show { display:block; }
  .feedback.yay { background:#d4edda; color:#155724; }
  .feedback.nay { background:#f8d7da; color:#721c24; }
  .result-screen { background:#fff; border-radius:24px; box-shadow:0 8px 28px rgba(0,0,0,.1); padding:40px 24px; text-align:center; display:none; }
  .result-screen .big-emoji{font-size:5rem;margin-bottom:12px}
  .result-screen h2{font-size:1.6rem;color:#2d3436;margin-bottom:8px}
  .result-screen p{font-size:1.1rem;color:#666;margin-bottom:20px}
  .btn-restart{background:linear-gradient(135deg,#fdd835,#f9a825);color:#fff;border:none;border-radius:16px;padding:14px 36px;font-size:1.2rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(249,168,37,.35)}
  .btn-restart:active{transform:scale(.95)}
  @media(max-width:480px){body{padding:8px}.header h1{font-size:1.2rem}.q-options{grid-template-columns:1fr}}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .eme-item > * + * { margin-left: 6px; }
  .eme-row > * + * { margin-left: 10px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🐝 Γνώρισε την e-me</h1>
    <p>Η ψηφιακή εκπαιδευτική πλατφόρμα!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/8</span>
  </div>
  <div class="instructions">🔍 Δες την οθόνη της e-me και βρες τι είναι κάθε τι!</div>
  <div id="gameArea">
    <div class="eme-interface">
      <div class="eme-screen">
        <div class="eme-topbar">
          <div class="eme-item">👤 <span style="font-size:.75rem;">Μαθητής</span></div>
          <div class="eme-item">✉️ <span class="ei-badge">3</span></div>
          <div class="eme-item">🔔 <span class="ei-badge">1</span></div>
        </div>
        <div class="eme-body">
          <div class="eme-row"><span class="eme-label"><span class="el-num">⓵</span> Οι Κυψέλες μου</span></div>
          <div class="eme-row"><span class="eme-label"><span class="el-num">⓶</span> Οι Επαφές μου</span></div>
          <div class="eme-row"><span class="eme-label"><span class="el-num">⓷</span> Οι Εφαρμογές</span></div>
        </div>
      </div>
    </div>
    <div class="question-box">
      <div class="q-emoji" id="qEmoji">👤</div>
      <div class="q-text" id="qText">Τι βλέπεις πάνω αριστερά στην οθόνη;</div>
      <div class="q-options" id="qOptions"></div>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg"></p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var questions = [
    {emoji:'👤', text:'Τι βλέπεις πάνω αριστερά στην οθόνη της e-me;',
     opts:[{e:'👤',t:'Το όνομα και η εικόνα προφίλ μου'},{e:'✉️',t:'Τα μηνύματά μου'},{e:'🔔',t:'Οι ειδοποιήσεις μου'},{e:'🐝',t:'Η κυψέλη μου'}], ans:0},
    {emoji:'✉️', text:'Τι δείχνει ο αριθμός 3 δίπλα στο φακελάκι;',
     opts:[{e:'✉️',t:'3 νέα μηνύματα'},{e:'🔔',t:'3 ειδοποιήσεις'},{e:'👤',t:'3 επαφές'},{e:'🐝',t:'3 κυψέλες'}], ans:0},
    {emoji:'🔔', text:'Τι δείχνει ο αριθμός 1 δίπλα στο καμπανάκι;',
     opts:[{e:'✉️',t:'1 νέο μήνυμα'},{e:'🔔',t:'1 νέα ειδοποίηση'},{e:'👤',t:'1 επαφή'},{e:'🐝',t:'1 κυψέλη'}], ans:1},
    {emoji:'🐝', text:'Πώς λέγονται οι ομάδες στην e-me;',
     opts:[{e:'🐝',t:'Κυψέλες'},{e:'👥',t:'Παρέες'},{e:'🏫',t:'Τάξεις'},{e:'📁',t:'Φάκελοι'}], ans:0},
    {emoji:'👥', text:'Πού βλέπεις τα άτομα με τα οποία συνεργάζεσαι;',
     opts:[{e:'🐝',t:'Στις Κυψέλες'},{e:'👥',t:'Στις Επαφές'},{e:'✉️',t:'Στα Μηνύματα'},{e:'🔔',t:'Στις Ειδοποιήσεις'}], ans:1},
    {emoji:'🌐', text:'Πώς συνδέεσαι στην e-me;',
     opts:[{e:'📧',t:'Με email'},{e:'🔑',t:'Με όνομα χρήστη και κωδικό ΠΣΔ'},{e:'📱',t:'Με αριθμό κινητού'},{e:'👤',t:'Με το όνομά μου'}], ans:1},
    {emoji:'🔗', text:'Ποια είναι η διεύθυνση της e-me;',
     opts:[{e:'📧',t:'e-me@gmail.com'},{e:'🌐',t:'e-me.edu.gr'},{e:'🏫',t:'e-me.school.gr'},{e:'🐝',t:'e-me.cypseli.gr'}], ans:1},
    {emoji:'💻', text:'Από ποιες συσκευές μπορείς να μπεις στην e-me;',
     opts:[{e:'💻',t:'Από υπολογιστή, ταμπλέτα και κινητό'},{e:'💻',t:'Μόνο από υπολογιστή'},{e:'📱',t:'Μόνο από κινητό'},{e:'📺',t:'Μόνο από τηλεόραση'}], ans:0}
  ];
  var cur=0,score=0;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function startGame(){
    shuffle(questions);cur=0;score=0;
    document.getElementById('scoreDisplay').textContent='⭐ 0';
    document.getElementById('gameArea').style.display='block';
    document.getElementById('resultScreen').style.display='none';
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    loadQ();
  }
  function loadQ(){
    if(cur>=questions.length){showResult();return;}
    var q=questions[cur];
    document.getElementById('roundDisplay').textContent=(cur+1)+'/'+questions.length;
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    document.getElementById('qEmoji').textContent=q.emoji;
    document.getElementById('qText').textContent=q.text;
    var g=document.getElementById('qOptions');g.innerHTML='';
    for(var i=0;i<q.opts.length;i++){
      (function(idx){
        var o=document.createElement('div');o.className='q-opt';
        o.innerHTML='<div class="qo-emoji">'+q.opts[idx].e+'</div><div class="qo-text">'+q.opts[idx].t+'</div>';
        o.addEventListener('click',function(){choose(idx);});
        g.appendChild(o);
      })(i);
    }
  }
  function choose(idx){
    var q=questions[cur];var fb=document.getElementById('feedback');
    var opts=document.querySelectorAll('#qOptions .q-opt');
    for(var i=0;i<opts.length;i++)opts[i].classList.add('disabled');
    if(idx===q.ans){score++;
      document.getElementById('scoreDisplay').textContent='⭐ '+score;
      opts[idx].classList.add('correct');
      fb.className='feedback show yay';fb.textContent='✅ Μπράβο! Γνωρίζεις την e-me!';
    }else{
      opts[idx].classList.add('wrong');opts[q.ans].classList.add('correct');
      fb.className='feedback show nay';fb.textContent='❌ Το σωστό είναι: '+q.opts[q.ans].t;
    }
    setTimeout(function(){cur++;loadQ();},1800);
  }
  function showResult(){
    document.getElementById('gameArea').style.display='none';
    document.getElementById('resultScreen').style.display='block';
    var total=questions.length,pct=score/total;
    var e,t,m;
    if(pct===1){e='🏆';t='Τέλεια!';m='Γνωρίζεις τα πάντα για την e-me! Είσαι έτοιμος να τη χρησιμοποιήσεις!';}
    else if(pct>=0.75){e='🎉';t='Μπράβο!';m='Τα πήγες πολύ καλά!';}
    else if(pct>=0.5){e='👍';t='Ωραία!';m='Καλή προσπάθεια!';}
    else{e='💪';t='Καλή αρχή!';m='Προσπάθησε ξανά! Θα μάθεις την e-me!';}
    document.getElementById('resultEmoji').textContent=e;
    document.getElementById('resultTitle').textContent=t;
    document.getElementById('resultMsg').textContent='Βρήκες '+score+' από '+total+' σωστά! '+m;
  }
  startGame();
</script>
</body>
</html>
