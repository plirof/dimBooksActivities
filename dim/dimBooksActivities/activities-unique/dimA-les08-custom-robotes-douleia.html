<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Τα Ρομπότ στη Δουλειά 🧰</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
    padding: 12px; color: #333;
  }
  .app-container { max-width: 520px; margin: 0 auto; }
  .header {
    text-align: center; padding: 16px 14px 10px;
    background: linear-gradient(135deg, #f7971e, #ffd200);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(247,151,30,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.3rem; margin-bottom: 2px; }
  .header p { font-size: .95rem; opacity: .95; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 8px 16px;
    margin-bottom: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.1rem; font-weight: 700; color: #f7971e; }
  .round { font-size: .9rem; color: #888; }
  .hint {
    text-align: center; font-size: .95rem; font-weight: 700; color: #a05a00;
    background: #fff; border-radius: 14px; padding: 8px 12px;
    margin-bottom: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .section-label {
    text-align: center; font-size: .9rem; font-weight: 700; color: #666;
    margin-bottom: 6px;
  }
  .robots-row {
    display: flex; justify-content: center; flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .robot-card {
    width: 30%;
    background: #fff; border: 3px solid #e0e0e0;
    border-radius: 14px; padding: 8px 4px;
    text-align: center; cursor: pointer;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: all .2s;
    margin: 4px;
  }
  .robot-card:active { transform: scale(.94); }
  .robot-card.selected { border-color: #f7971e; background: #fff8e1; transform: scale(1.05); }
  .robot-card.matched { border-color: #43a047; background: #e8f5e9; pointer-events: none; }
  .robot-card .r-emoji { font-size: 2.1rem; display: block; }
  .robot-card .r-name { font-size: .74rem; font-weight: 700; color: #444; display: block; }
  .robot-card .r-pair {
    display: none; margin-top: 4px; font-size: .72rem; font-weight: 700;
    color: #2e7d32;
  }
  .robot-card.matched .r-pair { display: block; }
  .jobs-row {
    display: flex; justify-content: center; flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .job-card {
    width: 46%;
    background: #fff; border: 3px solid #e0e0e0;
    border-radius: 14px; padding: 8px 4px;
    text-align: center; cursor: pointer;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: all .2s;
    margin: 4px;
  }
  .job-card:active { transform: scale(.94); }
  .job-card.wrong-card { border-color: #e53935; background: #ffebee; animation: shake .4s; }
  .job-card.matched { border-color: #43a047; background: #e8f5e9; pointer-events: none; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  .job-card .j-emoji { font-size: 1.8rem; display: block; }
  .job-card .j-label { font-size: .78rem; font-weight: 700; color: #444; display: block; }
  .feedback {
    text-align: center; padding: 12px; border-radius: 14px;
    font-size: 1rem; font-weight: 700; margin-bottom: 10px; display: none;
  }
  .feedback.correct { display: block; background: #d4edda; color: #155724; }
  .feedback.wrong { display: block; background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1); padding: 40px 24px;
    text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #f7971e, #ffd200);
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 36px; font-size: 1.2rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(247,151,30,.35);
    transition: transform .15s;
  }
  .btn-restart:hover { transform: scale(1.05); }
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🧰 Τα Ρομπότ στη Δουλειά</h1>
    <p>Κάθε ρομπότ κάνει τη δική του δουλειά. Βρες ποιο κάνει τι!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/3</span>
  </div>
  <div id="gameArea">
    <div class="hint">👉 Πάτα πρώτα ένα ρομπότ, μετά τη δουλειά του!</div>
    <div class="section-label">🤖 Τα ρομπότ:</div>
    <div class="robots-row" id="robotsRow"></div>
    <div class="section-label">🛠️ Οι δουλειές:</div>
    <div class="jobs-row" id="jobsRow"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var rounds = [
    {
      robots: [
        { e: '📦', name: 'ρομπότ-ταχυδρόμος', job: 'Παραδίδει δέματα' },
        { e: '🚗', name: 'ρομπότ-μηχανικός', job: 'Συναρμολογεί αμάξια' },
        { e: '💨', name: 'ρομπότ-σκούπα', job: 'Καθαρίζει το σπίτι' }
      ],
      jobs: [
        { l: 'Παραδίδει δέματα', e: '📬' },
        { l: 'Καθαρίζει το σπίτι', e: '✨' },
        { l: 'Συναρμολογεί αμάξια', e: '🔧' }
      ]
    },
    {
      robots: [
        { e: '🌊', name: 'ρομπότ-βυθού', job: 'Εξερευνά τον βυθό' },
        { e: '🚁', name: 'drone', job: 'Τραβάει φωτογραφίες από ψηλά' },
        { e: '🚀', name: 'ρομπότ-διαστήματος', job: 'Ταξιδεύει στα αστέρια' }
      ],
      jobs: [
        { l: 'Ταξιδεύει στα αστέρια', e: '🌌' },
        { l: 'Εξερευνά τον βυθό', e: '🐠' },
        { l: 'Τραβάει φωτογραφίες από ψηλά', e: '📸' }
      ]
    },
    {
      robots: [
        { e: '🌾', name: 'ρομπότ-αγρότης', job: 'Μαζεύει φρούτα' },
        { e: '🏥', name: 'ρομπότ-νοσοκόμος', job: 'Μεταφέρει φάρμακα' },
        { e: '❄️', name: 'ρομπότ-χιονιού', job: 'Καθαρίζει το χιόνι' }
      ],
      jobs: [
        { l: 'Καθαρίζει το χιόνι', e: '⛄' },
        { l: 'Μαζεύει φρούτα', e: '🍎' },
        { l: 'Μεταφέρει φάρμακα', e: '💊' }
      ]
    }
  ];

  var currentRound = 0, score = 0, matched = 0, resolved = false;
  var selectedRobot = -1;
  var jobIndexMap = [];

  function startGame() {
    currentRound = 0; score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    loadRound();
  }

  function loadRound() {
    if (currentRound >= rounds.length) { showResult(); return; }
    resolved = false;
    matched = 0;
    selectedRobot = -1;
    var rd = rounds[currentRound];
    document.getElementById('roundDisplay').textContent = (currentRound + 1) + '/' + rounds.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';

    jobIndexMap = [];
    for (var i = 0; i < rd.jobs.length; i++) jobIndexMap.push(i);
    for (var k = jobIndexMap.length - 1; k > 0; k--) {
      var j = Math.floor(Math.random() * (k + 1));
      var tmp = jobIndexMap[k]; jobIndexMap[k] = jobIndexMap[j]; jobIndexMap[j] = tmp;
    }

    var rr = document.getElementById('robotsRow');
    rr.innerHTML = '';
    for (var ri = 0; ri < rd.robots.length; ri++) {
      (function(ridx) {
        var rob = rd.robots[ridx];
        var card = document.createElement('div');
        card.className = 'robot-card';
        card.setAttribute('data-ridx', ridx);
        card.innerHTML = '<span class="r-emoji">' + rob.e + '</span>' +
                         '<span class="r-name">' + rob.name + '</span>' +
                         '<span class="r-pair"></span>';
        card.onclick = function() { onRobot(ridx); };
        rr.appendChild(card);
      })(ri);
    }

    var jr = document.getElementById('jobsRow');
    jr.innerHTML = '';
    for (var p = 0; p < jobIndexMap.length; p++) {
      (function(p2) {
        var jobIdx = jobIndexMap[p2];
        var job = rd.jobs[jobIdx];
        var card = document.createElement('div');
        card.className = 'job-card';
        card.setAttribute('data-jidx', jobIdx);
        card.innerHTML = '<span class="j-emoji">' + job.e + '</span>' +
                         '<span class="j-label">' + job.l + '</span>';
        card.onclick = function() { onJob(jobIdx, card); };
        jr.appendChild(card);
      })(p);
    }
  }

  function setFeedback(type, text) {
    var fb = document.getElementById('feedback');
    fb.className = 'feedback ' + type;
    fb.style.display = '';
    fb.textContent = text;
  }

  function onRobot(ridx) {
    if (resolved) return;
    var cards = document.querySelectorAll('.robot-card');
    for (var i = 0; i < cards.length; i++) {
      if (parseInt(cards[i].getAttribute('data-ridx')) === ridx) {
        if (cards[i].classList.contains('matched')) return;
      }
    }
    selectedRobot = ridx;
    for (var c = 0; c < cards.length; c++) {
      if (parseInt(cards[c].getAttribute('data-ridx')) === ridx) cards[c].classList.add('selected');
      else cards[c].classList.remove('selected');
    }
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
  }

  function onJob(jobIdx, jobCard) {
    if (resolved) return;
    if (selectedRobot === -1) {
      setFeedback('wrong', 'Πάτα πρώτα ένα ρομπότ! 🤖');
      return;
    }
    var rd = rounds[currentRound];
    var robot = rd.robots[selectedRobot];
    var job = rd.jobs[jobIdx];

    if (robot.job === job.l) {
      resolved = false;
      matched++;
      var robotCards = document.querySelectorAll('.robot-card');
      for (var i = 0; i < robotCards.length; i++) {
        if (parseInt(robotCards[i].getAttribute('data-ridx')) === selectedRobot) {
          robotCards[i].classList.remove('selected');
          robotCards[i].classList.add('matched');
          robotCards[i].querySelector('.r-pair').textContent = '✔️ ' + job.l;
        }
      }
      jobCard.classList.add('matched');
      setFeedback('correct', '✅ Ναι! Ο ' + robot.name + ' ' + job.l.toLowerCase() + '!');
      selectedRobot = -1;
      if (matched === rd.robots.length) {
        resolved = true;
        score++;
        document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
        setTimeout(function() {
          currentRound++;
          loadRound();
        }, 2000);
      }
    } else {
      jobCard.classList.remove('wrong-card');
      void jobCard.offsetWidth;
      jobCard.classList.add('wrong-card');
      setFeedback('wrong', '❌ Χμμ… ο ' + robot.name + ' δεν το κάνει αυτό! Δοκίμασε άλλη δουλειά.');
    }
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var total = rounds.length;
    var emoji, title, msg;
    if (score === total) { emoji = '🏆'; title = 'Τέλεια!'; msg = 'Ξέρεις τι δουλειά κάνει κάθε ρομπότ!'; }
    else if (score >= 2) { emoji = '🎉'; title = 'Μπράβο!'; msg = 'Τα ρομπότ σε εμπιστεύονται!'; }
    else if (score >= 1) { emoji = '👍'; title = 'Ωραία!'; msg = 'Καλή προσπάθεια! Δοκίμασε ξανά!'; }
    else { emoji = '💪'; title = 'Καλή αρχή!'; msg = 'Τα ρομπότ δεν είναι όλα ίδια — το καθένα έχει τη δουλειά του!'; }
    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultMsg').textContent = 'Βρήκες ' + score + ' από ' + total + ' σωστά! ' + msg;
  }

  startGame();
</script>
</body>
</html>
