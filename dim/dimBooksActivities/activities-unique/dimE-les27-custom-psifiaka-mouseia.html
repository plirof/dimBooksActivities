<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ψηφιακά Μουσεία | Μάθημα 27</title>
<style>
@font-face{font-family:'EmojiFont';src:local('Noto Color Emoji'),local('Segoe UI Emoji'),local('Apple Color Emoji'),local('Twemoji Mozilla'),url('../fonts/NotoColorEmoji.ttf') format('truetype');unicode-range:U+200D,U+2190-21FF,U+2300-23FF,U+25A0-25FF,U+2600-27BF,U+2900-297F,U+2B00-2BFF,U+FE0F,U+1F000-1FFFF;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;min-height:100vh;background:linear-gradient(135deg,#fefce8,#facc15);padding:10px;display:flex;flex-direction:column;align-items:center}
h1{color:#713f12;font-size:1.05rem;text-align:center;margin:4px 0 2px}
.subtitle{color:#a16207;font-size:.7rem;text-align:center;margin-bottom:6px}
.score-bar{display:flex;gap:8px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.sc{background:#fff;border-radius:8px;padding:4px 10px;color:#713f12;font-size:.75rem;font-weight:700;border:1px solid #facc15;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.sc .sl{color:#64748b}
.card{background:#fff;border-radius:18px;box-shadow:0 4px 16px rgba(0,0,0,.08);padding:14px;margin-bottom:8px;max-width:600px;width:100%}
.museum-card{background:#fefce8;border:2px solid #fde68a;border-radius:12px;padding:10px;margin:6px 0}
.museum-name{font-size:.78rem;font-weight:700;color:#713f12;margin-bottom:6px;text-align:center}
.museum-icon{font-size:1.3rem;text-align:center;margin-bottom:4px}
.city-opts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.city-opt{padding:8px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:.7rem;color:#334155;background:#fff;cursor:pointer;transition:all .2s}
.city-opt:hover{border-color:#a16207;background:#fefce8}
.city-opt.selected{border-color:#a16207;background:#fef9c3;color:#713f12;font-weight:700}
.city-opt.correct{border-color:#22c55e;background:#dcfce7;color:#14532d}
.city-opt.wrong{border-color:#ef4444;background:#fef2f2;color:#dc2626}
.city-opt.disabled{pointer-events:none;opacity:.7}
.url-hint{font-size:.62rem;color:#64748b;text-align:center;margin:2px 0;font-style:italic}
.result-msg{text-align:center;padding:10px;border-radius:10px;font-size:.78rem;font-weight:700;margin:6px 0}
.result-msg.ok{background:#dcfce7;color:#14532d}
.result-msg.bad{background:#fef2f2;color:#dc2626}
.check-btn{display:block;margin:8px auto;padding:10px 24px;border:none;border-radius:10px;background:#a16207;color:#fff;font-size:.8rem;font-weight:700;cursor:pointer}
.check-btn:hover{background:#854d0e}
.next-btn{display:block;margin:6px auto;padding:8px 20px;border:2px solid #a16207;border-radius:10px;background:transparent;color:#a16207;font-size:.75rem;font-weight:700;cursor:pointer}
.next-btn:hover{background:#fefce8}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .score-bar > * { margin: 4px; }
  .city-opts > * { margin: 3px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<h1>🏛️ Ψηφιακά Μουσεία</h1>
<p class="subtitle">Βρες σε ποια πόλη βρίσκεται κάθε μουσείο!</p>
<div class="score-bar">
<span class="sc"><span class="sl">Πόντοι:</span> <span id="pts">0</span></span>
<span class="sc"><span class="sl">Μουσείο:</span> <span id="qNum">1</span>/<span id="qTotal">6</span></span>
</div>
<div class="card" id="main"></div>
<script>
var museums=[
{
name:'Εθνικό Αρχαιολογικό Μουσείο',
icon:'🏛️',
hint:'namuseum.gr',
cities:['Αθήνα','Θεσσαλονίκη','Ηράκλειο','Ολυμπία'],
correct:0,
explain:'Το Εθνικό Αρχαιολογικό Μουσείο βρίσκεται στην Αθήνα (namuseum.gr).'
},
{
name:'Αρχαιολογικό Μουσείο Ηρακλείου',
icon:'🏺',
hint:'heraklionmuseum.gr',
cities:['Αθήνα','Θεσσαλονίκη','Ηράκλειο','Ολυμπία'],
correct:2,
explain:'Βρίσκεται στο Ηράκλειο Κρήτης (heraklionmuseum.gr).'
},
{
name:'Αρχαιολογικό Μουσείο Θεσσαλονίκης',
icon:'🗿',
hint:'amth.gr',
cities:['Αθήνα','Θεσσαλονίκη','Ηράκλειο','Ολυμπία'],
correct:1,
explain:'Βρίσκεται στη Θεσσαλονίκη (amth.gr).'
},
{
name:'Μουσείο Ακρόπολης',
icon:'🦉',
hint:'theacropolismuseum.gr',
cities:['Αθήνα','Θεσσαλονίκη','Ηράκλειο','Ολυμπία'],
correct:0,
explain:'Το Μουσείο Ακρόπολης βρίσκεται στην Αθήνα (theacropolismuseum.gr).'
},
{
name:'Αρχαιολογικό Μουσείο Ολυμπίας',
icon:'🏆',
hint:'Ολυμπία — ο τόπος των Ολυμπιακών Αγώνων',
cities:['Αθήνα','Θεσσαλονίκη','Ηράκλειο','Ολυμπία'],
correct:3,
explain:'Βρίσκεται στην Ολυμπία, όπου ξεκίνησαν οι Ολυμπιακοί Αγώνες!'
},
{
name:'Μουσείο Κρητικής Εθνολογίας',
icon:'🐑',
hint:'Βρίσκεται στο Νοτό Κρήτης',
cities:['Αθήνα','Θεσσαλονίκη','Ηράκλειο','Ολυμπία'],
correct:2,
explain:'Βρίσκεται στην Κρήτη, κοντά στο Ηράκλειο.'
}
];
var curQ=0,pts=0,selected=-1,checked=false;
function initQ(){selected=-1;checked=false;}
function render(){
document.getElementById('qNum').textContent=curQ+1;
document.getElementById('pts').textContent=pts;
var m=museums[curQ];
var main=document.getElementById('main');
var h='';
h+='<div class="museum-card">';
h+='<div class="museum-icon">'+m.icon+'</div>';
h+='<div class="museum-name">'+m.name+'</div>';
h+='<div class="url-hint">'+m.hint+'</div>';
h+='</div>';
h+='<p style="font-size:.72rem;font-weight:700;color:#713f12;text-align:center;margin:4px 0">Σε ποια πόλη βρίσκεται;</p>';
h+='<div class="city-opts">';
for(var i=0;i<m.cities.length;i++){
var cls='city-opt';
if(!checked&&selected===i)cls+=' selected';
if(checked){
if(i===m.correct)cls+=' correct';
else if(selected===i)cls+=' wrong';
cls+=' disabled';
}
h+='<div class="'+cls+'" onclick="selectOpt('+i+')">'+m.cities[i]+'</div>';
}
h+='</div>';
if(!checked&&selected>=0){
h+='<button class="check-btn" onclick="checkAnswer()">✓ Έλεγχος</button>';
}
if(checked){
var correct=selected===m.correct;
if(correct)pts+=10;
document.getElementById('pts').textContent=pts;
h+='<div class="result-msg '+(correct?'ok':'bad')+'">'+(correct?'✅ '+m.explain:'❌ '+m.explain)+'</div>';
if(curQ<museums.length-1){
h+='<button class="next-btn" onclick="nextQ()">Επόμενο Μουσείο ▶</button>';
}
}
main.innerHTML=h;
}
function selectOpt(idx){if(!checked){selected=idx;render();}}
function checkAnswer(){if(selected>=0){checked=true;render();}}
function nextQ(){if(curQ<museums.length-1){curQ++;initQ();render();}}
initQ();render();
</script>
</body>
</html>
