<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Φτιάξε το Ρομπότ 🤖</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #f6d365, #fda085);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(253,160,133,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; text-shadow: 1px 1px 2px rgba(0,0,0,.2); }
  .header p { font-size: .9rem; opacity: .95; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #fda085; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fff9db; border: 2px dashed #f0c040; border-radius: 16px;
    padding: 14px; margin-bottom: 14px; text-align: center;
    font-size: 1rem; color: #6b5900;
  }
  .scene-card {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 20px; margin-bottom: 18px; text-align: center;
  }
  .robot-preview {
    display: flex; justify-content: center; gap: 8px; margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .robot-part {
    width: 64px; height: 64px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.5rem; font-weight: 700;
  }
  .robot-part.head { background: #ffeaa7; border: 3px solid #fdcb6e; border-radius: 50%; }
  .robot-part.body { background: #dfe6e9; border: 3px solid #b2bec3; }
  .robot-part.arm { background: #fab1a0; border: 3px solid #e17055; border-radius: 8px; }
  .robot-part.leg { background: #81ecec; border: 3px solid #00cec9; border-radius: 8px; }
  .robot-part.antenna { background: #a29bfe; border: 3px solid #6c5ce7; border-radius: 50%; }
  .robot-part.eye { background: #fff; border: 3px solid #636e72; border-radius: 50%; }
  .problem-icon { font-size: 3rem; margin-bottom: 6px; }
  .problem-text { font-size: 1.15rem; font-weight: 700; color: #2d3436; margin-bottom: 14px; }
  .choices-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-gap: 10px; margin-bottom: 14px; }
  .choice-card {
    background: #fff; border: 4px solid #e0e0e0; border-radius: 18px;
    padding: 18px 8px; text-align: center; cursor: pointer;
    transition: all .2s ease; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .choice-card:active { transform: scale(.95); }
  .choice-card .a-emoji { font-size: 2.2rem; margin-bottom: 4px; }
  .choice-card .a-name { font-size: .85rem; font-weight: 700; color: #2d3436; }
  .choice-card.correct { border-color: #28a745; background: #d4edda; animation: pop .4s ease; }
  .choice-card.wrong { border-color: #dc3545; background: #f8d7da; animation: shake .4s ease; }
  .choice-card.disabled { pointer-events: none; opacity: .7; }
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .feedback{text-align:center;padding:14px;border-radius:16px;font-size:1.1rem;font-weight:700;margin-bottom:12px;display:none}
  .feedback.show{display:block}
  .feedback.yay{background:#d4edda;color:#155724}
  .feedback.nay{background:#f8d7da;color:#721c24}
  .result-screen{background:#fff;border-radius:24px;box-shadow:0 8px 28px rgba(0,0,0,.1);padding:40px 24px;text-align:center;display:none}
  .result-screen .big-emoji{font-size:5rem;margin-bottom:12px}
  .result-screen h2{font-size:1.6rem;color:#2d3436;margin-bottom:8px}
  .result-screen p{font-size:1.1rem;color:#666;margin-bottom:20px}
  .btn-restart{background:linear-gradient(135deg,#f6d365,#fda085);color:#fff;border:none;border-radius:16px;padding:14px 36px;font-size:1.2rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(253,160,133,.35)}
  .btn-restart:active{transform:scale(.95)}
  @media(max-width:480px){body{padding:8px}.header h1{font-size:1.2rem}.robot-part{width:50px;height:50px;font-size:2rem}}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .robot-preview > * { margin: 4px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🤖 Φτιάξε το Ρομπότ</h1>
    <p>Διόρθωσε τα μέρη του ρομπότ!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/8</span>
  </div>
  <div class="instructions">
    📖 Φτιάξε το δικό σου ρομπότ! Κάθε μέρος έχει μια ζημιά.<br>
    Διάλεξε τι θα κάνεις για να το διορθώσεις!
  </div>
  <div id="gameArea">
    <div class="scene-card">
      <div class="robot-preview" id="robotPreview">
        <div class="robot-part antenna">📡</div>
      </div>
      <div class="problem-icon" id="probIcon">🔲</div>
      <div class="problem-text" id="probText">Το κεφάλι του ρομπότ είναι πολύ μικρό!</div>
    </div>
    <div class="choices-grid" id="choicesGrid"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg"></p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var qs = [
    {parts:['🤖'], prob:'🔲', text:'Το κεφάλι του ρομπότ είναι πολύ μικρό! Τι κάνεις;', ans:1,
      choices:[{e:'🖱️',t:'Μετακίνηση'},{e:'🔲',t:'Μεγάλωμα'},{e:'🔄',t:'Περιστροφή'}]},
    {parts:['💪','🤖'], prob:'🔄', text:'Το χέρι του ρομπότ είναι στραβά! Τι κάνεις;', ans:2,
      choices:[{e:'🖱️',t:'Μετακίνηση'},{e:'🔲',t:'Μεγάλωμα'},{e:'🔄',t:'Περιστροφή'}]},
    {parts:['👢','🤖'], prob:'🖱️', text:'Το πόδι του ρομπότ είναι στη λάθος θέση! Τι κάνεις;', ans:0,
      choices:[{e:'🖱️',t:'Μετακίνηση'},{e:'🔲',t:'Μεγάλωμα'},{e:'🔄',t:'Περιστροφή'}]},
    {parts:['🤖','💪'], prob:'↔', text:'Το σώμα του ρομπότ είναι πολύ φαρδύ! Τι κάνεις;', ans:1,
      choices:[{e:'🖱️',t:'Μετακίνηση'},{e:'🔲',t:'Αλλαγή πλάτους'},{e:'🔄',t:'Περιστροφή'}]},
    {parts:['🤖','👁️'], prob:'🔄', text:'Το μάτι του ρομπότ είναι ανάποδα! Τι κάνεις;', ans:2,
      choices:[{e:'🖱️',t:'Μετακίνηση'},{e:'🔲',t:'Μεγάλωμα'},{e:'🔄',t:'Περιστροφή'}]},
    {parts:['📡','🤖'], prob:'↕', text:'Η κεραία του ρομπότ είναι πολύ κοντή! Τι κάνεις;', ans:1,
      choices:[{e:'🖱️',t:'Μετακίνηση'},{e:'🔲',t:'Αλλαγή ύψους'},{e:'🔄',t:'Περιστροφή'}]},
    {parts:['🤖','👆'], prob:'🖱️', text:'Το χέρι του ρομπότ είναι πολύ ψηλά! Τι κάνεις;', ans:0,
      choices:[{e:'🖱️',t:'Μετακίνηση κάτω'},{e:'🔲',t:'Μεγάλωμα'},{e:'🔄',t:'Περιστροφή'}]},
    {parts:['🤖','🔘'], prob:'🔲', text:'Η ρόδα του ρομπότ είναι πολύ μικρή! Τι κάνεις;', ans:1,
      choices:[{e:'🖱️',t:'Μετακίνηση'},{e:'🔲',t:'Μεγάλωμα'},{e:'🔄',t:'Περιστροφή'}]},
  ];
  var cur=0,score=0;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function startGame(){
    shuffle(qs);cur=0;score=0;
    document.getElementById('scoreDisplay').textContent='⭐ 0';
    document.getElementById('gameArea').style.display='block';
    document.getElementById('resultScreen').style.display='none';
    showQ();
  }
  function showQ(){
    if(cur>=qs.length){showResult();return;}
    var q=qs[cur];
    var preview=document.getElementById('robotPreview');preview.innerHTML='';
    for(var i=0;i<q.parts.length;i++){
      var p=document.createElement('div');p.className='robot-part';
      p.textContent=q.parts[i];
      preview.appendChild(p);
    }
    document.getElementById('probIcon').textContent=q.prob;
    document.getElementById('probText').textContent=q.text;
    document.getElementById('roundDisplay').textContent=(cur+1)+'/'+qs.length;
    document.getElementById('feedback').className='feedback';document.getElementById('feedback').style.display='none';
    var g=document.getElementById('choicesGrid');g.innerHTML='';
    for(var i=0;i<q.choices.length;i++){
      (function(idx){
        var c=document.createElement('div');c.className='choice-card';
        c.innerHTML='<div class="a-emoji">'+q.choices[idx].e+'</div><div class="a-name">'+q.choices[idx].t+'</div>';
        c.addEventListener('click',function(){choose(this,q);});
        g.appendChild(c);
      })(i);
    }
  }
  function choose(el,q){
    var cards=document.querySelectorAll('.choice-card');
    for(var i=0;i<cards.length;i++)cards[i].classList.add('disabled');
    var chosen=Array.from(cards).indexOf(el);
    var correct=(chosen===q.ans);
    var fb=document.getElementById('feedback');
    if(correct){score++;document.getElementById('scoreDisplay').textContent='⭐ '+score;el.classList.add('correct');fb.className='feedback show yay';fb.textContent='✅ Μπράβο! Το ρομπότ διορθώθηκε!';}
    else{el.classList.add('wrong');cards[q.ans].classList.add('correct');fb.className='feedback show nay';fb.textContent='❌ Έπρεπε να κάνεις: '+q.choices[q.ans].t;}
    setTimeout(function(){cur++;showQ();},1800);
  }
  function showResult(){
    document.getElementById('gameArea').style.display='none';
    document.getElementById('resultScreen').style.display='block';
    var total=qs.length,pct=score/total;
    var e,t,m;
    if(pct===1){e='🏆';t='Τέλεια!';m='Το ρομπότ σου είναι ολοκληρωμένο! Είσαι σούπερ μηχανικός!';}
    else if(pct>=0.75){e='🎉';t='Μπράβο!';m='Το ρομπότ σχεδόν ετοιμάστηκε!';}
    else if(pct>=0.5){e='👍';t='Ωραία!';m='Καλή προσπάθεια! Συνέχισε!';}
    else{e='💪';t='Καλή αρχή!';m='Προσπάθησε ξανά να φτιάξεις το ρομπότ!';}
    document.getElementById('resultEmoji').textContent=e;
    document.getElementById('resultTitle').textContent=t;
    document.getElementById('resultMsg').textContent='Διόρθωσες '+score+' από '+total+' μέρη! '+m;
  }
  startGame();
</script>
</body>
</html>
