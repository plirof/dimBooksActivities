<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Εργαλεία Ψηφιακού Περιεχομένου</title>
<style>
@font-face {
    font-family: 'EmojiFont';
    src: local('Noto Color Emoji'),local('Segoe UI Emoji'),local('Apple Color Emoji'),local('Twemoji Mozilla'),url('../fonts/NotoColorEmoji.ttf') format('truetype');
    unicode-range: U+200D, U+2190-21FF, U+2300-23FF, U+25A0-25FF, U+2600-27BF, U+2900-297F, U+2B00-2BFF, U+FE0F, U+1F000-1FFFF;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#d1fae5,#a7f3d0);min-height:100vh;padding:15px;display:flex;justify-content:center;align-items:flex-start}
.container{background:#fff;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.15);max-width:820px;width:100%;overflow:hidden}
.header{background:linear-gradient(135deg,#065f46,#10b981);color:#fff;padding:18px 24px;text-align:center}
.header h1{font-size:1.4em}
.header p{font-size:.9em;opacity:.9;margin-top:4px}
.area{padding:20px}
.info-box{background:#ecfdf5;border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:.88em;color:#065f46;text-align:center;line-height:1.5}
.progress{text-align:center;font-size:.95em;font-weight:700;color:#065f46;margin-bottom:12px}
.scenario-card{background:#f0fdf4;border:2px solid #a7f3d0;border-radius:16px;padding:18px;margin-bottom:14px;text-align:center}
.scenario-card .sc-emoji{font-size:2.2em;margin-bottom:8px}
.scenario-card .sc-text{font-size:1.05em;font-weight:600;color:#065f46;line-height:1.5}
.options-grid{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px;margin-bottom:10px}
.opt-card{padding:14px;border:2px solid #d1d5db;border-radius:14px;text-align:center;cursor:pointer;transition:all .2s;background:#fff;user-select:none}
.opt-card:hover{border-color:#10b981;background:#ecfdf5;transform:translateY(-2px)}
.opt-card.selected{border-color:#10b981;background:#d1fae5;box-shadow:0 0 0 3px rgba(16,185,129,.3)}
.opt-card .opt-emoji{font-size:1.6em;margin-bottom:4px}
.opt-card .opt-label{font-size:.9em;font-weight:600;color:#334155}
.opt-card .opt-detail{font-size:.8em;color:#6b7280;margin-top:2px}
.controls{display:flex;justify-content:center;gap:15px;margin-top:14px}
.btn{padding:12px 30px;border:none;border-radius:50px;font-size:1em;font-weight:700;cursor:pointer;transition:all .2s}
.btn-next{background:linear-gradient(135deg,#065f46,#10b981);color:#fff}
.btn-next:hover{transform:scale(1.05);box-shadow:0 4px 15px rgba(6,95,70,.4)}
.btn-next:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-reset{background:#f0f0f0;color:#555}
.btn-reset:hover{background:#e0e0e0}
.feedback{text-align:center;font-size:1.05em;font-weight:700;margin-top:12px;min-height:36px;padding:0 10px}
.feedback.ok{color:#16a34a}
.feedback.fail{color:#dc2626}
.result-summary{background:#f0fdf4;border-radius:14px;padding:16px;margin-top:10px;text-align:center}
.result-summary .big-emoji{font-size:2.5em;margin-bottom:6px}
.result-summary .result-text{font-size:1.1em;font-weight:700;color:#065f46}
.score-stars{text-align:center;font-size:1.4em;margin:6px 0}
.progress-bar{height:8px;background:#e5e7eb;border-radius:4px;margin-bottom:12px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,#10b981,#34d399);border-radius:4px;transition:width .4s}
@media(max-width:500px){.options-grid{grid-template-columns:1fr}.scenario-card .sc-text{font-size:.95em}}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .controls > * + * { margin-left: 15px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🛠️ Εργαλεία Ψηφιακού Περιεχομένου</h1>
<p>Για κάθε σενάριο, διάλεξε το σωστό εργαλείο και είδος αρχείου!</p>
</div>
<div class="area">
<div class="info-box">💡 <b>Ψηφιακό περιεχόμενο</b> = κείμενο, εικόνα, ήχος, βίντεο. Για κάθε είδος υπάρχει το κατάλληλο εργαλείο και μορφή αρχείου!</div>
<div class="progress">Ερώτηση: <span id="qNum">1</span> / <span id="qTotal">8</span></div>
<div class="progress-bar"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
<div id="gameArea">
<div class="scenario-card" id="scenarioCard">
<div class="sc-emoji" id="scEmoji">📷</div>
<div class="sc-text" id="scText">Φόρτωση...</div>
</div>
<div class="options-grid" id="optionsGrid"></div>
</div>
<div class="feedback" id="feedback"></div>
<div id="resultArea" style="display:none"></div>
<div class="controls">
<button class="btn btn-next" id="btnNext" onclick="nextQuestion()" disabled>➡️ Επόμενο</button>
<button class="btn btn-reset" onclick="resetGame()">🔄 Αρχή</button>
</div>
</div>
</div>
<script>
var scenarios=[
{emoji:'📷',text:'Θέλεις να βγάλεις μια φωτογραφία με τον υπολογιστή σου. Ποιο εργαλείο χρησιμοποιείς;',options:[
{emoji:'🖥️',label:'Εφαρμογή Κάμερας',detail:'Αρχείο .jpg',correct:true},
{emoji:'🎤',label:'Ηχογράφηση',detail:'Αρχείο .wav',correct:false},
{emoji:'📝',label:'Επεξεργαστής κειμένου',detail:'Αρχείο .odt',correct:false},
{emoji:'🎬',label:'Παρουσίαση',detail:'Αρχείο .pptx',correct:false}
]},
{emoji:'🎤',text:'Θέλεις να ηχογραφήσεις τη φωνή σου. Ποιο εργαλείο χρησιμοποιείς;',options:[
{emoji:'📷',label:'Εφαρμογή Κάμερας',detail:'Αρχείο .jpg',correct:false},
{emoji:'🖥️',label:'Εφαρμογή Ηχογράφησης',detail:'Αρχείο .wav',correct:true},
{emoji:'🎨',label:'Πρόγραμμα ζωγραφικής',detail:'Αρχείο .png',correct:false},
{emoji:'📊',label:'Υπολογιστικό φύλλο',detail:'Αρχείο .xlsx',correct:false}
]},
{emoji:'🎬',text:'Θέλεις να τραβήξεις ένα βίντεο με τους φίλους σου. Τι αρχείο θα δημιουργηθεί;',options:[
{emoji:'🎵',label:'Αρχείο ήχου',detail:'Μορφή .mp3',correct:false},
{emoji:'🖼️',label:'Αρχείο εικόνας',detail:'Μορφή .png',correct:false},
{emoji:'📹',label:'Αρχείο βίντεο',detail:'Μορφή .mp4',correct:true},
{emoji:'📄',label:'Αρχείο κειμένου',detail:'Μορφή .txt',correct:false}
]},
{emoji:'📸',text:'Έβγαλες μια φωτογραφία και θέλεις να την αποθηκεύσεις. Ποια μορφή αρχείου θα έχει;',options:[
{emoji:'🎵',label:'.mp3',detail:'Αρχείο ήχου',correct:false},
{emoji:'🖼️',label:'.jpg',detail:'Αρχείο εικόνας',correct:true},
{emoji:'📹',label:'.mp4',detail:'Αρχείο βίντεο',correct:false},
{emoji:'📄',label:'.odt',detail:'Αρχείο κειμένου',correct:false}
]},
{emoji:'📝',text:'Θέλεις να γράψεις μια έκθεση. Ποιο εργαλείο χρησιμοποιείς και τι αρχείο δημιουργεί;',options:[
{emoji:'📹',label:'Κάμερα',detail:'Αρχείο .mp4',correct:false},
{emoji:'🎨',label:'Zωγραφική',detail:'Αρχείο .png',correct:false},
{emoji:'📝',label:'Επεξεργαστής κειμένου (Writer)',detail:'Αρχείο .odt',correct:true},
{emoji:'📊',label:'Υπολογιστικό φύλλο (Calc)',detail:'Αρχείο .xlsx',correct:false}
]},
{emoji:'☁️',text:'Θέλεις να αποθηκεύσεις τη δουλειά σου στο διαδίκτυο, ώστε να την έχεις από παντού. Πού την αποθηκεύεις;',options:[
{emoji:'💾',label:'Σκληρό δίσκο',detail:'Μόνο στον υπολογιστή',correct:false},
{emoji:'☁️',label:'Νέφος (Cloud)',detail:'π.χ. +γραφίς ΠΣΔ',correct:true},
{emoji:'🖱️',label:'USB (Φλας)',detail:'Μόνο στη συσκευή',correct:false},
{emoji:'💿',label:'CD/DVD',detail:'Παλιά τεχνολογία',correct:false}
]},
{emoji:'🎨',text:'Θέλεις να φτιάξεις μια ζωγραφιά στον υπολογιστή. Ποιο εργαλείο και τι αρχείο;',options:[
{emoji:'📝',label:'Επεξεργαστής κειμένου',detail:'Αρχείο .odt',correct:false},
{emoji:'🎨',label:'Πρόγραμμα ζωγραφικής (TuxPaint)',detail:'Αρχείο .png',correct:true},
{emoji:'🎤',label:'Ηχογράφηση',detail:'Αρχείο .wav',correct:false},
{emoji:'📊',label:'Παρουσίαση (Impress)',detail:'Αρχείο .pptx',correct:false}
]},
{emoji:'🔄',text:'Έχεις μια εικόνα σε μορφή .png και θέλεις να την κάνεις .jpg. Τι κάνεις;',options:[
{emoji:'🗑️',label:'Τη διαγράφεις',detail:'Και τη φτιάχνεις ξανά',correct:false},
{emoji:'🔄',label:'Μετατροπή μορφής',detail:'Άνοιγμα → Αποθήκευση ως .jpg',correct:true},
{emoji:'📧',label:'Τη στέλνεις με email',detail:'Δεν αλλάζει τίποτα',correct:false},
{emoji:'📁',label:'Τη μετακινώ σε φάκελο',detail:'Δεν αλλάζει μορφή',correct:false}
]}
];

var currentQ=0;
var score=0;
var selectedOpt=null;
var answered=false;

function showQuestion(){
if(currentQ>=scenarios.length){showResults();return;}
answered=false;
selectedOpt=null;
document.getElementById('btnNext').disabled=true;
var sc=scenarios[currentQ];
document.getElementById('scEmoji').textContent=sc.emoji;
document.getElementById('scText').textContent=sc.text;
document.getElementById('qNum').textContent=currentQ+1;
document.getElementById('progressFill').style.width=((currentQ)/scenarios.length*100)+'%';
var grid=document.getElementById('optionsGrid');
grid.innerHTML='';
var order=[];
for(var i=0;i<sc.options.length;i++)order.push(i);
for(var i=0;i<order.length;i++){
var opt=sc.options[order[i]];
var card=document.createElement('div');
card.className='opt-card';
card.dataset.idx=order[i];
card.innerHTML='<div class="opt-emoji">'+opt.emoji+'</div><div class="opt-label">'+opt.label+'</div><div class="opt-detail">'+opt.detail+'</div>';
card.onclick=function(){selectOption(this);};
grid.appendChild(card);
}
}

function selectOption(el){
if(answered)return;
var cards=document.querySelectorAll('.opt-card');
for(var i=0;i<cards.length;i++)cards[i].classList.remove('selected');
el.classList.add('selected');
selectedOpt=parseInt(el.dataset.idx);
answered=true;
var sc=scenarios[currentQ];
var opt=sc.options[selectedOpt];
if(opt.correct){
score++;
showFeedback('✅ Σωστό! '+opt.emoji+' '+opt.label+' είναι η σωστή επιλογή!',true);
el.style.borderColor='#16a34a';
el.style.background='#dcfce7';
}else{
showFeedback('❌ Λάθος! Η σωστή απάντηση ήταν: '+findCorrect(sc).emoji+' '+findCorrect(sc).label,false);
el.style.borderColor='#dc2626';
el.style.background='#fef2f2';
var correctCard=document.querySelector('.opt-card[data-idx="'+findCorrectIdx(sc)+'"]');
if(correctCard){correctCard.style.borderColor='#16a34a';correctCard.style.background='#dcfce7';}
}
document.getElementById('btnNext').disabled=false;
}

function findCorrect(sc){
for(var i=0;i<sc.options.length;i++){if(sc.options[i].correct)return sc.options[i];}
return null;
}

function findCorrectIdx(sc){
for(var i=0;i<sc.options.length;i++){if(sc.options[i].correct)return i;}
return -1;
}

function nextQuestion(){
currentQ++;
showQuestion();
}

function showResults(){
document.getElementById('gameArea').style.display='none';
document.getElementById('btnNext').style.display='none';
document.getElementById('progressFill').style.width='100%';
document.getElementById('qNum').textContent=scenarios.length;
var stars='';
var starCount=score>=7?5:score>=5?4:score>=3?3:score>=1?2:1;
for(var i=0;i<5;i++){stars+=i<starCount?'⭐':'☆';}
var emoji=score===scenarios.length?'🏆':score>=6?'🎉':score>=4?'👍':'💪';
var msg=score===scenarios.length?'Τέλεια! Ξέρεις τα πάντα για τα ψηφιακά εργαλεία!':
score>=6?'Μπράβο! Πολύ καλή γνώση των ψηφιακών εργαλείων!':
score>=4?'Καλά! Συνέχισε να μαθαίνεις για τα εργαλεία!':
'Δεν πειράζει! Δοκίμασε ξανά για να μάθεις!';
var area=document.getElementById('resultArea');
area.style.display='block';
area.innerHTML='<div class="result-summary"><div class="big-emoji">'+emoji+'</div><div class="score-stars">'+stars+'</div><div class="result-text">'+score+' / '+scenarios.length+' σωστά</div><p style="margin-top:8px;color:#065f46">'+msg+'</p></div>';
}

function showFeedback(msg,isOk){
var el=document.getElementById('feedback');
el.textContent=msg;
el.className='feedback '+(isOk?'ok':'fail');
}

function resetGame(){
currentQ=0;
score=0;
selectedOpt=null;
answered=false;
document.getElementById('feedback').className='feedback';
document.getElementById('feedback').textContent='';
document.getElementById('gameArea').style.display='block';
document.getElementById('btnNext').style.display='inline-block';
document.getElementById('btnNext').disabled=true;
document.getElementById('resultArea').style.display='none';
showQuestion();
}

document.getElementById('qTotal').textContent=scenarios.length;
showQuestion();
</script>
</body>
</html>
