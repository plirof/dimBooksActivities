<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Επαναλήψεις στη Φύση 🌍</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    padding: 12px;
    color: #333;
    touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #43e97b, #38f9d7);
    border-radius: 20px; color: #1a4a2e;
    box-shadow: 0 6px 20px rgba(67,233,123,.35);
    margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; }
  .header p { font-size: .9rem; opacity: .85; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #0a8f5c; }
  .instruction {
    background: #fff; border-radius: 20px; padding: 16px 18px;
    margin-bottom: 14px; text-align: center; font-size: 1.1rem;
    font-weight: 700; color: #2d3436;
    box-shadow: 0 4px 14px rgba(0,0,0,.08);
    line-height: 1.5;
  }
  .instruction .emo { font-size: 1.6rem; }
  .items-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    grid-gap: 10px; margin-bottom: 14px;
  }
  .item-card {
    background: #fff; border-radius: 18px; padding: 14px 8px;
    text-align: center; cursor: pointer;
    transition: all .2s ease; user-select: none;
    -webkit-tap-highlight-color: transparent;
    border: 3px solid #e8e8e8;
  }
  .item-card:active { transform: scale(.93); }
  .item-card .i-emoji { font-size: 2.8rem; margin-bottom: 4px; }
  .item-card .i-text { font-size: .85rem; font-weight: 600; color: #555; }
  .item-card.sorted { opacity: .4; pointer-events: none; border-color: #ccc; }
  .drop-zones {
    display: grid; grid-template-columns: 1fr 1fr;
    grid-gap: 12px; margin-bottom: 14px;
  }
  .drop-zone {
    background: #fff; border-radius: 20px; padding: 18px 12px;
    min-height: 140px; border: 3px dashed #ccc;
    text-align: center; transition: all .2s;
  }
  .drop-zone .dz-title {
    font-size: 1.1rem; font-weight: 700; margin-bottom: 8px;
  }
  .drop-zone .dz-items {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
  }
  .drop-zone .dz-items .dz-item {
    background: #e8f5e9; border-radius: 14px; padding: 6px 10px;
    font-size: .9rem; font-weight: 600;
  }
  .drop-zone .dz-items .dz-item .dz-e { font-size: 1.4rem; }
  .drop-zone.highlight { border-color: #43e97b; background: #e8fdee; }
  .dz-repeat { border-color: #43e97b; }
  .dz-repeat .dz-title { color: #0a8f5c; }
  .dz-once { border-color: #f093fb; }
  .dz-once .dz-title { color: #b12fcb; }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; margin-bottom: 12px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.yay { background: #d4edda; color: #155724; }
  .feedback.nay { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #43e97b, #38f9d7); color: #1a4a2e;
    border: none; border-radius: 16px; padding: 14px 36px;
    font-size: 1.2rem; font-weight: 700; cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(67,233,123,.35);
    transition: transform .15s;
  }
  .btn-restart:active { transform: scale(.95); }
  @media (max-width: 480px) {
    body { padding: 8px; }
    .header h1 { font-size: 1.2rem; }
    .items-grid { grid-template-columns: 1fr 1fr; grid-gap: 8px; }
    .item-card .i-emoji { font-size: 2.2rem; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .drop-zone .dz-items > * { margin: 3px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>🔄 Επαναλήψεις στη Φύση</h1>
    <p>Ταξινόμησε όσα επαναλαμβάνονται και όσα όχι!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
  </div>

  <div id="gameArea">
    <div class="instruction">
      <span class="emo">👆</span> Πάτα κάθε εικόνα και βάλ' τη στη σωστή θέση!
    </div>

    <div class="items-grid" id="itemsGrid"></div>

    <div class="drop-zones">
      <div class="drop-zone dz-repeat" id="dzRepeat">
        <div class="dz-title">🔄 Επαναλαμβάνεται</div>
        <div class="dz-items" id="repeatItems"></div>
      </div>
      <div class="drop-zone dz-once" id="dzOnce">
        <div class="dz-title">⏳ Γίνεται μία φορά</div>
        <div class="dz-items" id="onceItems"></div>
      </div>
    </div>

    <div class="feedback" id="feedback"></div>
  </div>

  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>

<script>
  var items = [
    { id: 'imeranifta', emoji: '☀️🌙', text: 'Μέρα και Νύχτα', repeat: true },
    { id: 'epoxes', emoji: '🌸☀️🍂❄️', text: 'Εποχές του χρόνου', repeat: true },
    { id: 'fengari', emoji: '🌑🌓🌕', text: 'Όψεις φεγγαριού', repeat: true },
    { id: 'genethlia', emoji: '🎂', text: 'Γενέθλια', repeat: false },
    { id: 'kardia', emoji: '💓', text: 'Χτύπος καρδιάς', repeat: true },
    { id: 'ododovroutsa', emoji: '🪥', text: 'Βούρτσισμα δοντιών', repeat: true },
    { id: 'ekdromi', emoji: '🚌', text: 'Σχολική εκδρομή', repeat: false },
    { id: 'diakopes', emoji: '🏖️', text: 'Καλοκαιρινές διακοπές', repeat: true },
    { id: 'vaptisia', emoji: '🎪', text: 'Πάρτι έκπληξη', repeat: false }
  ];

  var score = 0;
  var placed = 0;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function startGame() {
    shuffle(items);
    score = 0;
    placed = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('repeatItems').innerHTML = '';
    document.getElementById('onceItems').innerHTML = '';
    renderItems();
  }

  function renderItems() {
    var grid = document.getElementById('itemsGrid');
    grid.innerHTML = '';
    for (var i = 0; i < items.length; i++) {
      (function(idx) {
        var card = document.createElement('div');
        card.className = 'item-card';
        card.id = 'card-' + items[idx].id;
        card.innerHTML = '<div class="i-emoji">' + items[idx].emoji + '</div><div class="i-text">' + items[idx].text + '</div>';
        card.addEventListener('click', function() { placeItem(idx); });
        grid.appendChild(card);
      })(i);
    }
  }

  function placeItem(idx) {
    var item = items[idx];
    var card = document.getElementById('card-' + item.id);
    if (card.classList.contains('sorted')) return;
    var fb = document.getElementById('feedback');

    card.classList.add('sorted');
    placed++;

    if (item.repeat) {
      document.getElementById('repeatItems').innerHTML += '<span class="dz-item"><span class="dz-e">' + item.emoji + '</span> ' + item.text + '</span>';
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      fb.className = 'feedback show yay';
      fb.textContent = '✅ Σωστά! Το ' + item.text + ' επαναλαμβάνεται!';
    } else {
      document.getElementById('onceItems').innerHTML += '<span class="dz-item"><span class="dz-e">' + item.emoji + '</span> ' + item.text + '</span>';
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      fb.className = 'feedback show yay';
      fb.textContent = '✅ Σωστά! Το ' + item.text + ' γίνεται μία φορά!';
    }

    if (placed >= items.length) {
      setTimeout(showResult, 1000);
    } else {
      setTimeout(function() {
        fb.className = 'feedback';
        fb.style.display = 'none';
      }, 1200);
    }
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var total = items.length;
    var pct = score / total;
    var emoji, title, msg;
    if (pct === 1) {
      emoji = '🏆'; title = 'Τέλεια!';
      msg = 'Βρήκες όλες τις επαναλήψεις! Είσαι σούπερ!';
    } else if (pct >= 0.75) {
      emoji = '🎉'; title = 'Μπράβο!';
      msg = 'Τα πήγες πολύ καλά!';
    } else if (pct >= 0.5) {
      emoji = '👍'; title = 'Ωραία!';
      msg = 'Καλή προσπάθεια! Δοκίμασε ξανά!';
    } else {
      emoji = '💪'; title = 'Καλή αρχή!';
      msg = 'Προσπάθησε ξανά! Θα τα πας καλύτερα!';
    }
    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultMsg').textContent = 'Βρήκες ' + score + ' από ' + total + ' σωστά! ' + msg;
  }

  startGame();
</script>
</body>
</html>
