<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Εφέ Διαφανειών | Μάθημα 24</title>
<style>
@font-face{font-family:'EmojiFont';src:local('Noto Color Emoji'),local('Segoe UI Emoji'),local('Apple Color Emoji'),local('Twemoji Mozilla'),url('../fonts/NotoColorEmoji.ttf') format('truetype');unicode-range:U+200D,U+2190-21FF,U+2300-23FF,U+25A0-25FF,U+2600-27BF,U+2900-297F,U+2B00-2BFF,U+FE0F,U+1F000-1FFFF;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;min-height:100vh;background:linear-gradient(135deg,#fef3c7,#fbbf24);padding:10px;display:flex;flex-direction:column;align-items:center}
h1{color:#78350f;font-size:1.05rem;text-align:center;margin:4px 0 2px}
.subtitle{color:#b45309;font-size:.7rem;text-align:center;margin-bottom:6px}
.score-bar{display:flex;gap:8px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.sc{background:#fff;border-radius:8px;padding:4px 10px;color:#78350f;font-size:.75rem;font-weight:700;border:1px solid #fbbf24;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.sc .sl{color:#64748b}
.card{background:#fff;border-radius:18px;box-shadow:0 4px 16px rgba(0,0,0,.08);padding:14px;margin-bottom:8px;max-width:600px;width:100%}
.slide-box{background:#fef3c7;border:2px solid #fde68a;border-radius:12px;padding:10px;margin:8px 0;position:relative;min-height:100px}
.slide-label{position:absolute;top:6px;left:10px;font-size:.6rem;color:#92400e;font-weight:700;background:#fff;padding:2px 8px;border-radius:6px}
.slide-content{text-align:center;padding-top:20px}
.slide-title{font-size:.85rem;font-weight:700;color:#78350f;margin-bottom:4px}
.slide-body{font-size:.7rem;color:#92400e}
.fx-preview{font-size:1.2rem;margin:6px 0;text-align:center}
.sort-row{display:flex;gap:6px;justify-content:center;margin:8px 0;flex-wrap:wrap}
.fx-type{padding:8px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:.7rem;color:#334155;background:#fff;cursor:pointer;transition:all .2s;font-weight:600}
.fx-type:hover{border-color:#b45309;background:#fef3c7}
.fx-type.selected{border-color:#b45309;background:#fef9e7;color:#78350f}
.fx-type.correct{border-color:#22c55e;background:#dcfce7;color:#14532d}
.fx-type.wrong{border-color:#ef4444;background:#fef2f2;color:#dc2626}
.fx-type.disabled{pointer-events:none;opacity:.7}
.desc-text{font-size:.72rem;color:#475569;text-align:center;margin:6px 0}
.result-msg{text-align:center;padding:10px;border-radius:10px;font-size:.78rem;font-weight:700;margin:6px 0}
.result-msg.ok{background:#dcfce7;color:#14532d}
.result-msg.bad{background:#fef2f2;color:#dc2626}
.check-btn{display:block;margin:8px auto;padding:10px 24px;border:none;border-radius:10px;background:#b45309;color:#fff;font-size:.8rem;font-weight:700;cursor:pointer}
.check-btn:hover{background:#92400e}
.next-btn{display:block;margin:6px auto;padding:8px 20px;border:2px solid #b45309;border-radius:10px;background:transparent;color:#b45309;font-size:.75rem;font-weight:700;cursor:pointer}
.next-btn:hover{background:#fef3c7}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .score-bar > * { margin: 4px; }
  .sort-row > * { margin: 3px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<h1>✨ Εφέ Διαφανειών</h1>
<p class="subtitle">Εναλλαγή ή Κίνηση; Βρες τι χρειαζεται κάθε περίπτωση!</p>
<div class="score-bar">
<span class="sc"><span class="sl">Πόντοι:</span> <span id="pts">0</span></span>
<span class="sc"><span class="sl">Σενάριο:</span> <span id="qNum">1</span>/<span id="qTotal">6</span></span>
</div>
<div class="card" id="main"></div>
<script>
var scenarios=[
{
slide:'Τίτλος: "Η Γη"',
body:'Μια φωτογραφία της Γης από το διάστημα',
fx:'🌍➡️🌏',
desc:'Θέλουμε η εικόνα της Γης να εμφανιστεί σιγά-σιγά (fade in) όταν φορτώσει η διαφάνεια.',
q:'Αυτό είναι εφέ εναλλαγής ή εφέ κίνησης;',
opts:['Εφέ εναλλαγής (transition)','Εφέ κίνησης (animation)'],
correct:1,
explain:'Η εμφάνιση ενός στοιχείου ΜΕΣΑ στη διαφάνεια είναι εφέ κίνησης (animation).'
},
{
slide:'Διαφάνεια 3 → 4',
body:'Μετάβαση από "Τι είναι η ηλιακή ενέργεια" σε "Πλεονεκτήματα"',
fx:'🌞➡️⚡',
desc:'Θέλουμε μια ομαλή μετάβαση από τη μία διαφάνεια στην επόμενη.',
q:'Αυτό είναι εφέ εναλλαγής ή εφέ κίνησης;',
opts:['Εφέ εναλλαγής (transition)','Εφέ κίνησης (animation)'],
correct:0,
explain:'Η μετάβαση μεταξύ ΔΙΑΦΟΡΕΤΙΚΩΝ διαφανειών είναι εφέ εναλλαγής (transition).'
},
{
slide:'Τίτλος: "Στατιστικά"',
body:'Ένα γράφημα με στοιχεία',
fx:'📊',
desc:'Θέλουμε οι μπάρες του γραφήματος να εμφανίζονται μία-μία από αριστερά προς τα δεξιά.',
q:'Αυτό είναι εφέ εναλλαγής ή εφέ κίνησης;',
opts:['Εφέ εναλλαγής (transition)','Εφέ κίνησης (animation)'],
correct:1,
explain:'Η κίνηση στοιχείων ΜΕΣΑ στη διαφάνεια (όπως μπάρες γραφήματος) είναι animation.'
},
{
slide:'Διαφάνεια 1 → 2',
body:'Από τον τίτλο στην πρώτη σελίδα περιεχομένων',
fx:'📋➡️📋',
desc:'Θέλουμε η νέα διαφάνεια να "γλιστρήσει" από τα δεξιά.',
q:'Αυτό είναι εφέ εναλλαγής ή εφέ κίνησης;',
opts:['Εφέ εναλλαγής (transition)','Εφέ κίνησης (animation)'],
correct:0,
explain:'Το "γλίστρημα" μεταξύ διαφανειών είναι εφέ εναλλαγής (transition).'
},
{
slide:'Τίτλος: "Ευχαριστίες"',
body:'Λίστα ονομάτων',
fx:'🙏',
desc:'Θέλουμε κάθε όνομα να εμφανίζεται ένα-ένα μετά από κλικ.',
q:'Αυτό είναι εφέ εναλλαγής ή εφέ κίνησης;',
opts:['Εφέ εναλλαγής (transition)','Εφέ κίνησης (animation)'],
correct:1,
explain:'Η εμφάνιση στοιχείων (ονόματα) ΜΕΣΑ στη διαφάνεια είναι animation.'
},
{
slide:'Τελική διαφάνεια',
body:'"Ερωτήσεις;"',
fx:'❓',
desc:'Θέλουμε η τελευταία διαφάνεια να εμφανίζεται σαν να ανοίγει ένα βιβλίο.',
q:'Αυτό είναι εφέ εναλλαγής ή εφέ κίνησης;',
opts:['Εφέ εναλλαγής (transition)','Εφέ κίνησης (animation)'],
correct:0,
explain:'Η εμφάνιση ΟΛΗΣ της διαφάνειας σαν βιβλίο είναι transition (μεταβαση μεταξύ διαφανειών).'
}
];
var curQ=0,pts=0,selected=-1,checked=false;
function initQ(){selected=-1;checked=false;}
function render(){
document.getElementById('qNum').textContent=curQ+1;
document.getElementById('pts').textContent=pts;
var s=scenarios[curQ];
var main=document.getElementById('main');
var h='';
h+='<div class="slide-box">';
h+='<div class="slide-label">📋 Διαφάνεια</div>';
h+='<div class="slide-content">';
h+='<div class="slide-title">'+s.slide+'</div>';
h+='<div class="slide-body">'+s.body+'</div>';
h+='<div class="fx-preview">'+s.fx+'</div>';
h+='</div></div>';
h+='<p class="desc-text">'+s.desc+'</p>';
h+='<p class="desc-text"><strong>'+s.q+'</strong></p>';
h+='<div class="sort-row">';
for(var i=0;i<s.opts.length;i++){
var cls='fx-type';
if(!checked&&selected===i)cls+=' selected';
if(checked){
if(i===s.correct)cls+=' correct';
else if(selected===i)cls+=' wrong';
cls+=' disabled';
}
h+='<div class="'+cls+'" onclick="selectOpt('+i+')">'+s.opts[i]+'</div>';
}
h+='</div>';
if(!checked&&selected>=0){
h+='<button class="check-btn" onclick="checkAnswer()">✓ Έλεγχος</button>';
}
if(checked){
var correct=selected===s.correct;
if(correct)pts+=10;
document.getElementById('pts').textContent=pts;
h+='<div class="result-msg '+(correct?'ok':'bad')+'">'+(correct?'✅ '+s.explain:'❌ '+s.explain)+'</div>';
if(curQ<scenarios.length-1){
h+='<button class="next-btn" onclick="nextQ()">Επόμενο Σενάριο ▶</button>';
}
}
main.innerHTML=h;
}
function selectOpt(idx){if(!checked){selected=idx;render();}}
function checkAnswer(){if(selected>=0){checked=true;render();}}
function nextQ(){if(curQ<scenarios.length-1){curQ++;initQ();render();}}
initQ();render();
</script>
</body>
</html>
