<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Εξερευνώ την Ιστοσελίδα 🖥️</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #fddb92 0%, #d1fdff 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #f093fb, #f5576c);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(245,87,108,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.4rem; text-shadow: 1px 1px 2px rgba(0,0,0,.2); }
  .header p { font-size: .9rem; opacity: .95; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #f5576c; }
  .round { font-size: 1rem; color: #888; }
  .question-box {
    background: #fff9db; border: 2px dashed #f0c040; border-radius: 16px;
    padding: 16px; margin-bottom: 14px; text-align: center;
    font-size: 1.1rem; font-weight: 600; color: #6b5900;
    min-height: 60px; display: flex; align-items: center; justify-content: center;
  }
  .webpage {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 16px; margin-bottom: 14px;
  }
  .webpage-title {
    text-align: center; padding: 8px; font-size: 1rem; font-weight: 700;
    color: #2d3436; background: #f0f4ff; border-radius: 12px; margin-bottom: 12px;
  }
  .webpage-body {
    display: flex; flex-direction: column; gap: 10px;
  }
  .w-row { display: flex; gap: 10px; }
  .w-row .w-item {
    flex: 1; border-radius: 16px; padding: 20px 10px; text-align: center;
    cursor: pointer; transition: all .2s ease; border: 4px solid #e0e0e0;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .w-row .w-item:active { transform: scale(.97); }
  .w-row .w-item .wi-emoji { font-size: 2.5rem; margin-bottom: 4px; }
  .w-row .w-item .wi-label { font-size: .85rem; font-weight: 700; }
  .w-row .w-item.video { background: #fff0f0; border-color: #ff6b6b; }
  .w-row .w-item.audio { background: #f0fff4; border-color: #51cf66; }
  .w-row .w-item.image { background: #f0f8ff; border-color: #339af0; }
  .w-row .w-item.text { background: #fffbf0; border-color: #fcc419; }
  .w-row .w-item.correct { border-color: #28a745; background: #d4edda !important; animation: pop .4s ease; }
  .w-row .w-item.wrong { border-color: #dc3545; background: #f8d7da !important; animation: shake .4s ease; }
  .w-row .w-item.disabled { pointer-events: none; opacity: .7; }
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .feedback{text-align:center;padding:14px;border-radius:16px;font-size:1.1rem;font-weight:700;margin-bottom:12px;display:none}
  .feedback.show{display:block}
  .feedback.yay{background:#d4edda;color:#155724}
  .feedback.nay{background:#f8d7da;color:#721c24}
  .result-screen{background:#fff;border-radius:24px;box-shadow:0 8px 28px rgba(0,0,0,.1);padding:40px 24px;text-align:center;display:none}
  .result-screen .big-emoji{font-size:5rem;margin-bottom:12px}
  .result-screen h2{font-size:1.6rem;color:#2d3436;margin-bottom:8px}
  .result-screen p{font-size:1.1rem;color:#666;margin-bottom:20px}
  .btn-restart{background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff;border:none;border-radius:16px;padding:14px 36px;font-size:1.2rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(245,87,108,.35)}
  .btn-restart:active{transform:scale(.95)}
  @media(max-width:480px){body{padding:8px}.header h1{font-size:1.2rem}.w-row .w-item{padding:14px 6px}.w-row .w-item .wi-emoji{font-size:2rem}}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .webpage-body > * + * { margin-top: 10px; }
  .w-row > * + * { margin-left: 10px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🖥️ Εξερευνώ την Ιστοσελίδα</h1>
    <p>Βρες τον σωστό πόρο στη σελίδα!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/8</span>
  </div>
  <div class="question-box" id="questionBox">
    🌐 Βρες το <b>Βίντεο</b> στη σελίδα!
  </div>
  <div id="gameArea">
    <div class="webpage">
      <div class="webpage-title">🌍 Η Ιστοσελίδα μας</div>
      <div class="webpage-body">
        <div class="w-row">
          <div class="w-item video" data-ans="0">
            <div class="wi-emoji">🎬</div>
            <div class="wi-label">Βίντεο</div>
          </div>
          <div class="w-item audio" data-ans="1">
            <div class="wi-emoji">🎵</div>
            <div class="wi-label">Μουσική</div>
          </div>
        </div>
        <div class="w-row">
          <div class="w-item image" data-ans="2">
            <div class="wi-emoji">🖼️</div>
            <div class="wi-label">Εικόνα</div>
          </div>
          <div class="w-item text" data-ans="3">
            <div class="wi-emoji">📝</div>
            <div class="wi-label">Κείμενο</div>
          </div>
        </div>
      </div>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg"></p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var qs = [
    {q:'🎬 Βρες το <b>Βίντεο</b> στη σελίδα!', ans:0},
    {q:'🎵 Βρες τη <b>Μουσική</b> στη σελίδα!', ans:1},
    {q:'🖼️ Βρες την <b>Εικόνα</b> στη σελίδα!', ans:2},
    {q:'📝 Βρες το <b>Κείμενο</b> στη σελίδα!', ans:3},
    {q:'📺 Πού θα πατήσεις για να δεις ένα <b>βίντεο</b>;', ans:0},
    {q:'🎶 Πού θα πατήσεις για να <b>ακούσεις</b> μουσική;', ans:1},
    {q:'📸 Πού θα πατήσεις για να δεις μια <b>φωτογραφία</b>;', ans:2},
    {q:'📖 Πού θα πατήσεις για να <b>διαβάσεις</b> ένα κείμενο;', ans:3},
  ];
  var cur=0,score=0;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function startGame(){
    shuffle(qs);cur=0;score=0;
    document.getElementById('scoreDisplay').textContent='⭐ 0';
    document.getElementById('gameArea').style.display='block';
    document.getElementById('resultScreen').style.display='none';
    showQ();
  }
  function showQ(){
    if(cur>=qs.length){showResult();return;}
    var q=qs[cur];
    document.getElementById('questionBox').innerHTML='🌐 '+q.q;
    document.getElementById('roundDisplay').textContent=(cur+1)+'/'+qs.length;
    document.getElementById('feedback').className='feedback';document.getElementById('feedback').style.display='none';
    var items=document.querySelectorAll('.w-item');
    for(var i=0;i<items.length;i++){items[i].classList.remove('correct','wrong','disabled');}
  }
  function initClicks(){
    var items=document.querySelectorAll('.w-item');
    for(var i=0;i<items.length;i++){
      (function(el){
        el.addEventListener('click',function(){clickItem(el);});
      })(items[i]);
    }
  }
  function clickItem(el){
    var q=qs[cur];
    var items=document.querySelectorAll('.w-item');
    for(var i=0;i<items.length;i++)items[i].classList.add('disabled');
    var chosen=parseInt(el.getAttribute('data-ans'));
    var correct=(chosen===q.ans);
    var fb=document.getElementById('feedback');
    if(correct){score++;document.getElementById('scoreDisplay').textContent='⭐ '+score;el.classList.add('correct');fb.className='feedback show yay';fb.textContent='✅ Μπράβο! Σωστά!';}
    else{el.classList.add('wrong');document.querySelector('.w-item[data-ans="'+q.ans+'"]').classList.add('correct');fb.className='feedback show nay';fb.textContent='❌ Ωχ! Δοκίμασε ξανά!';}
    setTimeout(function(){cur++;showQ();},1500);
  }
  document.addEventListener('DOMContentLoaded',initClicks);
  startGame();
</script>
</body>
</html>
