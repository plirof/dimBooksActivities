<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Φτιάχνω το Δίκτυό μου 🌐</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
    padding: 12px; color: #333;
  }
  .app-container { max-width: 580px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 14px;
    background: linear-gradient(135deg, #43e97b, #38f9d7);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(67,233,123,.4); margin-bottom: 16px;
  }
  .header h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .header p { font-size: 1rem; opacity: .9; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #2d8f5a; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #fff9db; border: 2px dashed #f0c040;
    border-radius: 16px; padding: 14px 16px; margin-bottom: 16px;
    font-size: 1.1rem; text-align: center; color: #6b5900;
  }
  .play-area {
    background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
    border: 4px solid #a5d6a7; border-radius: 24px;
    padding: 24px 16px; margin-bottom: 16px;
    position: relative; min-height: 320px;
  }
  .comp-node {
    position: absolute; width: 80px; height: 80px;
    background: #fff; border-radius: 18px;
    box-shadow: 0 4px 14px rgba(0,0,0,.1);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; transition: all .2s ease;
    user-select: none; -webkit-tap-highlight-color: transparent;
    border: 3px solid #e0e0e0; z-index: 2;
  }
  .comp-node:hover { transform: scale(1.05); border-color: #43e97b; }
  .comp-node.selected { border-color: #f5576c; box-shadow: 0 0 0 4px rgba(245,87,108,.3); }
  .comp-node.connected { border-color: #28a745; }
  .comp-node .c-emoji { font-size: 2rem; }
  .comp-node .c-label { font-size: .75rem; font-weight: 700; color: #555; margin-top: 2px; }
  .comp-node .c-name {
    position: absolute; top: -24px; font-size: .8rem;
    font-weight: 700; color: #333; background: #fff;
    padding: 0 6px; border-radius: 6px;
  }
  @keyframes nodePop {
    0% { transform: scale(0); } 60% { transform: scale(1.15); } 100% { transform: scale(1); }
  }
  .comp-node.pop { animation: nodePop .4s ease; }
  canvas#lineCanvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; pointer-events: none;
    z-index: 1; border-radius: 24px;
  }
  .feedback-bar {
    text-align: center; padding: 12px; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; display: none;
  }
  .feedback-bar.show { display: block; margin-bottom: 12px; }
  .feedback-bar.true { background: #d4edda; color: #155724; }
  .feedback-bar.info { background: #d1ecf1; color: #0c5460; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #43e97b, #38f9d7);
    color: #fff; border: none; border-radius: 16px;
    padding: 14px 36px; font-size: 1.2rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(67,233,123,.35);
    transition: transform .15s;
  }
  .btn-restart:hover { transform: scale(1.05); }
  @media (max-width:480px) {
    .header h1 { font-size: 1.2rem; }
    .comp-node { width: 64px; height: 64px; }
    .comp-node .c-emoji { font-size: 1.6rem; }
    .play-area { min-height: 260px; padding: 16px 10px; }
  }
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🌐 Φτιάχνω το Δίκτυό μου</h1>
    <p>Ένωσε τους υπολογιστές με γραμμές!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">Γύρος 1/3</span>
  </div>
  <div class="instructions" id="instructions">👆 Πάτα πρώτα τον έναν υπολογιστή και μετά τον άλλον για να τους ενώσεις!</div>
  <div id="gameArea">
    <div class="play-area" id="playArea">
      <canvas id="lineCanvas"></canvas>
    </div>
    <div class="feedback-bar" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji">🌐</div>
    <h2>Μπράβο!</h2>
    <p>Έφτιαξες ένα υπέροχο δίκτυο υπολογιστών!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var levels = [
    {
      computers: [
        { id: 'A', emoji: '🖥️', label: 'Α', x: 15, y: 30 },
        { id: 'B', emoji: '💻', label: 'Β', x: 70, y: 30 }
      ],
      connections: [[0,1]]
    },
    {
      computers: [
        { id: 'A', emoji: '🖥️', label: 'Α', x: 15, y: 30 },
        { id: 'B', emoji: '💻', label: 'Β', x: 55, y: 15 },
        { id: 'C', emoji: '📱', label: 'Γ', x: 70, y: 30 }
      ],
      connections: [[0,1],[1,2]]
    },
    {
      computers: [
        { id: 'Α', emoji: '🖥️', label: 'Α', x: 10, y: 40 },
        { id: 'Β', emoji: '💻', label: 'Β', x: 35, y: 15 },
        { id: 'Γ', emoji: '📱', label: 'Γ', x: 35, y: 65 },
        { id: 'Δ', emoji: '💻', label: 'Δ', x: 70, y: 40 }
      ],
      connections: [[0,1],[0,2],[1,3],[2,3]]
    }
  ];

  var currentLevel = 0;
  var score = 0;
  var selectedNode = null;
  var nodes = [];
  var connections = [];
  var totalConnections = 0;
  var madeConnections = 0;

  function startGame() {
    currentLevel = 0; score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    loadLevel();
  }

  function loadLevel() {
    if (currentLevel >= levels.length) {
      showResult();
      return;
    }
    var lv = levels[currentLevel];
    document.getElementById('roundDisplay').textContent = 'Γύρος ' + (currentLevel + 1) + '/' + levels.length;
    connections = lv.connections.map(function(c) { return c.slice(); });
    totalConnections = connections.length;
    madeConnections = 0;
    selectedNode = null;
    nodes = [];
    document.getElementById('feedback').className = 'feedback-bar';
    document.getElementById('feedback').style.display = 'none';

    var area = document.getElementById('playArea');
    // clear old nodes
    var oldNodes = area.querySelectorAll('.comp-node');
    for (var i = 0; i < oldNodes.length; i++) oldNodes[i].remove();

    var w = area.offsetWidth || 548;
    var h = area.offsetHeight || 320;

    for (var i = 0; i < lv.computers.length; i++) {
      var c = lv.computers[i];
      var div = document.createElement('div');
      div.className = 'comp-node pop';
      div.setAttribute('data-idx', i);
      div.style.left = (c.x/100 * w - 40) + 'px';
      div.style.top = (c.y/100 * h - 40) + 'px';
      div.innerHTML = '<div class="c-name">' + c.id + '</div><div class="c-emoji">' + c.emoji + '</div><div class="c-label">' + c.label + '</div>';
      div.addEventListener('click', function(e) { clickNode(this); });
      area.appendChild(div);
      nodes.push({ el: div, cx: c.x/100 * w, cy: c.y/100 * h });
    }
    drawLines();
  }

  function getNodeCenter(idx) {
    var area = document.getElementById('playArea');
    var rect = area.getBoundingClientRect();
    var n = nodes[idx];
    var el = n.el;
    var eRect = el.getBoundingClientRect();
    var cx = eRect.left - rect.left + el.offsetWidth/2;
    var cy = eRect.top - rect.top + el.offsetHeight/2;
    // convert to percentage relative to area
    var pw = cx / area.offsetWidth * 100;
    var ph = cy / area.offsetHeight * 100;
    return { x: pw, y: ph, cx: cx, cy: cy };
  }

  function drawLines() {
    var canvas = document.getElementById('lineCanvas');
    var area = document.getElementById('playArea');
    canvas.width = area.offsetWidth;
    canvas.height = area.offsetHeight;
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (connections.length === 0) return;

    for (var i = 0; i < connections.length; i++) {
      var conn = connections[i];
      if (conn.length < 2) continue;
      // conn now stores indices that are connected
      var idx1 = conn[0];
      var idx2 = conn[1];
      // check if already connected (length > 2 means connected)
      if (conn.length < 2) continue;
      // are they connected? if conn.length > 2, mark as connected
      var isConnected = (conn.length > 2);
      var el1 = nodes[idx1].el;
      var el2 = nodes[idx2].el;
      var r1 = el1.getBoundingClientRect();
      var r2 = el2.getBoundingClientRect();
      var aRect = area.getBoundingClientRect();
      var x1 = r1.left - aRect.left + r1.width/2;
      var y1 = r1.top - aRect.top + r1.height/2;
      var x2 = r2.left - aRect.left + r2.width/2;
      var y2 = r2.top - aRect.top + r2.height/2;

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = isConnected ? '#28a745' : '#bbb';
      ctx.lineWidth = isConnected ? 4 : 2;
      ctx.setLineDash(isConnected ? [] : [6,4]);
      ctx.stroke();
    }
  }

  function clickNode(el) {
    var idx = parseInt(el.getAttribute('data-idx'));
    if (selectedNode === null) {
      selectedNode = idx;
      el.classList.add('selected');
      var fb = document.getElementById('feedback');
      fb.className = 'feedback-bar show info';
      fb.textContent = '👆 Τώρα πάτα τον άλλο υπολογιστή για να τους ενώσεις!';
      return;
    }
    if (selectedNode === idx) {
      el.classList.remove('selected');
      selectedNode = null;
      document.getElementById('feedback').className = 'feedback-bar';
      document.getElementById('feedback').style.display = 'none';
      return;
    }

    // check if this connection is needed
    var needed = false;
    var connIdx = -1;
    for (var i = 0; i < connections.length; i++) {
      var c = connections[i];
      if ((c[0] === selectedNode && c[1] === idx) || (c[0] === idx && c[1] === selectedNode)) {
        if (c.length <= 2) {
          needed = true;
          connIdx = i;
        }
        break;
      }
    }

    // unselect
    nodes[selectedNode].el.classList.remove('selected');
    var fb = document.getElementById('feedback');
    if (needed) {
      connections[connIdx].push('connected');
      madeConnections++;
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      fb.className = 'feedback-bar show true';
      fb.textContent = '✅ Μπράβο! Οι υπολογιστές συνδέθηκαν!';
      drawLines();
      // mark both nodes as connected
      nodes[selectedNode].el.classList.add('connected');
      nodes[idx].el.classList.add('connected');

      if (madeConnections >= totalConnections) {
        setTimeout(function() {
          currentLevel++;
          loadLevel();
        }, 1200);
      } else {
        setTimeout(function() {
          fb.className = 'feedback-bar';
          fb.style.display = 'none';
        }, 800);
      }
    } else {
      fb.className = 'feedback-bar show false';
      fb.textContent = '❌ Αυτή η σύνδεση δεν χρειάζεται! Προσπάθησε ξανά!';
      setTimeout(function() {
        fb.className = 'feedback-bar';
        fb.style.display = 'none';
      }, 1000);
    }
    selectedNode = null;
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
  }

  window.addEventListener('resize', function() {
    if (document.getElementById('gameArea').style.display !== 'none') {
      drawLines();
    }
  });

  startGame();
</script>
</body>
</html>
