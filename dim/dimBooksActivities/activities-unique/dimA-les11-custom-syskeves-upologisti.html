<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Οι συσκευές του υπολογιστή 🔌</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    padding: 12px;
    color: #333;
  }
  .app-container {
    max-width: 600px;
    margin: 0 auto;
  }
  .header {
    text-align: center;
    padding: 20px 16px 14px;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    border-radius: 20px;
    color: #fff;
    box-shadow: 0 6px 20px rgba(79, 172, 254, 0.4);
    margin-bottom: 16px;
  }
  .header h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .header p { font-size: 1rem; opacity: .9; }
  .info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    border-radius: 16px;
    padding: 10px 18px;
    margin-bottom: 16px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #4facfe; }
  .round { font-size: 1rem; color: #888; }
  .instructions {
    background: #e8f4fd;
    border: 2px dashed #4facfe;
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 16px;
    font-size: 1.1rem;
    text-align: center;
    line-height: 1.5;
    color: #0c5460;
  }
  .device-showcase {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 24px;
    text-align: center;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .device-emoji {
    font-size: 6rem;
    margin-bottom: 8px;
    display: block;
    transition: transform .3s ease;
  }
  .device-showcase.pop .device-emoji {
    animation: popDevice .4s ease;
  }
  @keyframes popDevice {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }
  .device-name {
    font-size: 1.5rem;
    font-weight: 700;
    color: #2d3436;
    margin-bottom: 4px;
  }
  .device-hint {
    font-size: .95rem;
    color: #888;
    font-style: italic;
  }
  .desc-box {
    background: linear-gradient(135deg, #ffecd2, #fcb69f);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 20px;
    text-align: center;
    font-size: 1.2rem;
    font-weight: 600;
    color: #6b3a00;
    line-height: 1.5;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(252, 182, 159, 0.3);
  }
  .device-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-gap: 10px;
  }
  .dev-card {
    background: #fff;
    border: 3px solid #e0e0e0;
    border-radius: 16px;
    padding: 16px 10px;
    text-align: center;
    cursor: pointer;
    transition: all .2s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .dev-card:hover:not(.disabled) {
    border-color: #4facfe;
    background: #f0f8ff;
    transform: translateY(-2px);
  }
  .dev-card:active:not(.disabled) { transform: scale(.95); }
  .dev-card .d-emoji { font-size: 2.5rem; margin-bottom: 4px; }
  .dev-card .d-name { font-size: 1rem; font-weight: 700; color: #2d3436; }
  .dev-card.correct {
    border-color: #28a745;
    background: #d4edda;
    animation: pulseGreen .4s ease;
  }
  .dev-card.wrong {
    border-color: #dc3545;
    background: #f8d7da;
    animation: shake .35s ease;
  }
  .dev-card.disabled { pointer-events: none; opacity: .6; }
  .dev-card.reveal { border-color: #28a745; background: #d4edda; opacity: 1; }
  @keyframes pulseGreen {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    30% { transform: translateX(-5px); }
    60% { transform: translateX(5px); }
  }
  .result-screen {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px;
    text-align: center;
    display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    color: #fff;
    border: none;
    border-radius: 16px;
    padding: 14px 36px;
    font-size: 1.2rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(79,172,254,.35);
    transition: transform .15s;
  }
  .btn-restart:hover { transform: scale(1.05); }
  @media (max-width: 480px) {
    body { padding: 8px; }
    .header h1 { font-size: 1.2rem; }
    .device-emoji { font-size: 4.5rem; }
    .device-name { font-size: 1.2rem; }
    .desc-box { font-size: 1.05rem; padding: 16px; }
    .dev-card .d-emoji { font-size: 2rem; }
  }
</style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>🔌 Οι Συσκευές του Υπολογιστή</h1>
    <p>Βρες ποια συσκευή ταιριάζει!</p>
  </div>

  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">Γύρος 1/6</span>
  </div>

  <div class="instructions">
    📖 Διάβασε την περιγραφή και βρες ποια συσκευή είναι!
  </div>

  <div id="gameArea">
    <div class="desc-box" id="descBox">
      Με αυτήν βλέπω χρώματα και σχήματα στην οθόνη!
    </div>

    <div class="device-grid" id="deviceGrid"></div>
  </div>

  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>

<script>
  var rounds = [
    {
      desc: 'Με αυτήν βλέπω χρώματα και σχήματα. Δείχνει ό,τι κάνω!',
      answer: 3,
      devices: [
        { emoji: '⌨️', name: 'Πληκτρολόγιο' },
        { emoji: '🖱️', name: 'Ποντίκι' },
        { emoji: '🎤', name: 'Μικρόφωνο' },
        { emoji: '🖥️', name: 'Οθόνη' }
      ]
    },
    {
      desc: 'Με αυτό γράφω γράμματα, αριθμούς και σύμβολα!',
      answer: 0,
      devices: [
        { emoji: '⌨️', name: 'Πληκτρολόγιο' },
        { emoji: '🎧', name: 'Ακουστικά' },
        { emoji: '📷', name: 'Κάμερα' },
        { emoji: '🖱️', name: 'Ποντίκι' }
      ]
    },
    {
      desc: 'Με αυτό δείχνω και επιλέγω πράγματα στην οθόνη!',
      answer: 3,
      devices: [
        { emoji: '🎤', name: 'Μικρόφωνο' },
        { emoji: '🔊', name: 'Ηχεία' },
        { emoji: '⌨️', name: 'Πληκτρολόγιο' },
        { emoji: '🖱️', name: 'Ποντίκι' }
      ]
    },
    {
      desc: 'Με αυτήν βάζω εικόνες και φωτογραφίες στον υπολογιστή!',
      answer: 2,
      devices: [
        { emoji: '🎧', name: 'Ακουστικά' },
        { emoji: '🖥️', name: 'Οθόνη' },
        { emoji: '📷', name: 'Κάμερα' },
        { emoji: '⌨️', name: 'Πληκτρολόγιο' }
      ]
    },
    {
      desc: 'Με αυτό βάζω ήχους και τη φωνή μου στον υπολογιστή!',
      answer: 0,
      devices: [
        { emoji: '🎤', name: 'Μικρόφωνο' },
        { emoji: '🖱️', name: 'Ποντίκι' },
        { emoji: '📷', name: 'Κάμερα' },
        { emoji: '🖥️', name: 'Οθόνη' }
      ]
    },
    {
      desc: 'Με αυτά ακούω ήχους και μουσική από τον υπολογιστή!',
      answer: 2,
      devices: [
        { emoji: '🖱️', name: 'Ποντίκι' },
        { emoji: '📷', name: 'Κάμερα' },
        { emoji: '🔊', name: 'Ηχεία' },
        { emoji: '⌨️', name: 'Πληκτρολόγιο' }
      ]
    }
  ];

  var currentIndex = 0;
  var score = 0;

  function startGame() {
    currentIndex = 0;
    score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    showRound();
  }

  function showRound() {
    if (currentIndex >= rounds.length) {
      showResult();
      return;
    }
    var r = rounds[currentIndex];
    document.getElementById('descBox').textContent = r.desc;
    document.getElementById('roundDisplay').textContent = 'Γύρος ' + (currentIndex + 1) + '/' + rounds.length;

    var grid = document.getElementById('deviceGrid');
    grid.innerHTML = '';
    for (var i = 0; i < r.devices.length; i++) {
      var card = document.createElement('div');
      card.className = 'dev-card';
      card.setAttribute('data-index', i);
      card.innerHTML = '<div class="d-emoji">' + r.devices[i].emoji + '</div><div class="d-name">' + r.devices[i].name + '</div>';
      card.addEventListener('click', function(e) { pickDevice(this); });
      grid.appendChild(card);
    }
  }

  function pickDevice(el) {
    var r = rounds[currentIndex];
    var chosen = parseInt(el.getAttribute('data-index'));
    var correct = (chosen === r.answer);

    var cards = document.querySelectorAll('.dev-card');
    for (var i = 0; i < cards.length; i++) {
      cards[i].classList.add('disabled');
    }

    if (correct) {
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      el.classList.add('correct');
      setTimeout(function() {
        currentIndex++;
        showRound();
      }, 1000);
    } else {
      el.classList.add('wrong');
      cards[r.answer].classList.add('reveal');
      setTimeout(function() {
        currentIndex++;
        showRound();
      }, 1500);
    }
  }

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var total = rounds.length;
    var emoji, title, msg;
    if (score === total) {
      emoji = '🏆'; title = 'Τέλεια!'; msg = 'Γνωρίζεις όλες τις συσκευές του υπολογιστή! Είσαι εξπέρ!';
    } else if (score >= 4) {
      emoji = '🎉'; title = 'Μπράβο!'; msg = 'Τα πήγες πολύ καλά! Συνέχισε έτσι!';
    } else if (score >= 3) {
      emoji = '👍'; title = 'Ωραία!'; msg = 'Καλή προσπάθεια! Δοκίμασε ξανά!';
    } else {
      emoji = '💪'; title = 'Καλή αρχή!'; msg = 'Μην σταματάς! Δοκίμασε ξανά!';
    }
    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultMsg').textContent = 'Βρήκες ' + score + ' από ' + total + ' σωστά! ' + msg;
  }

  startGame();
</script>
</body>
</html>
