<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Νίκη ή Ήττα | Μάθημα 7</title>
<style>
@font-face{font-family:'EmojiFont';src:local('Noto Color Emoji'),local('Segoe UI Emoji'),local('Apple Color Emoji'),local('Twemoji Mozilla'),url('../fonts/NotoColorEmoji.ttf') format('truetype');unicode-range:U+200D,U+2190-21FF,U+2300-23FF,U+25A0-25FF,U+2600-27BF,U+2900-297F,U+2B00-2BFF,U+FE0F,U+1F000-1FFFF;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'EmojiFont','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;min-height:100vh;background:linear-gradient(135deg,#fffbeb,#fcd34d);padding:10px;display:flex;flex-direction:column;align-items:center}
h1{color:#78350f;font-size:1.05rem;text-align:center;margin:4px 0 2px}
.subtitle{color:#d97706;font-size:.7rem;text-align:center;margin-bottom:6px}
.score-bar{display:flex;gap:8px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.sc{background:#fff;border-radius:8px;padding:4px 10px;color:#78350f;font-size:.75rem;font-weight:700;border:1px solid #fcd34d;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.sc .sl{color:#64748b}
.card{background:#fff;border-radius:18px;box-shadow:0 4px 16px rgba(0,0,0,.08);padding:14px;margin-bottom:8px;max-width:600px;width:100%}
.game-scene{border:2px solid #e2e8f0;border-radius:14px;padding:12px;margin:8px 0;background:#f8fafc}
.scene-label{font-size:.7rem;font-weight:700;color:#64748b;text-align:center;margin-bottom:6px}
.var-row{display:flex;gap:12px;justify-content:center;margin:6px 0}
.vbox{padding:8px 16px;border-radius:10px;text-align:center;min-width:80px}
.vbox.v-pts{background:#dcfce7;border:2px solid #86efac}
.vbox.v-lives{background:#fef2f2;border:2px solid #fca5a5}
.vbox .vl{font-size:.6rem;font-weight:700;color:#64748b}
.vbox .vv{font-size:1.1rem;font-weight:700}
.v-pts .vv{color:#14532d}
.v-lives .vv{color:#dc2626}
.bg-preview{display:flex;gap:8px;justify-content:center;margin:8px 0}
.bg-opt{width:120px;padding:10px;border:3px solid #e2e8f0;border-radius:12px;text-align:center;cursor:pointer;transition:all .2s;background:#fff}
.bg-opt:hover{border-color:#d97706;background:#fffbeb}
.bg-opt.selected{border-color:#d97706;background:#fffbeb;box-shadow:0 2px 8px rgba(217,119,6,.2)}
.bg-opt.correct{border-color:#22c55e;background:#dcfce7}
.bg-opt.wrong{border-color:#ef4444;background:#fef2f2}
.bg-opt .bg-icon{font-size:1.8rem}
.bg-opt .bg-name{font-size:.68rem;font-weight:700;color:#78350f;margin-top:4px}
.info-text{font-size:.7rem;color:#475569;text-align:center;margin:4px 0}
.result-msg{text-align:center;padding:10px;border-radius:10px;font-size:.78rem;font-weight:700;margin:6px 0}
.result-msg.ok{background:#dcfce7;color:#14532d}
.result-msg.bad{background:#fef2f2;color:#dc2626}
.check-btn{display:block;margin:8px auto;padding:10px 24px;border:none;border-radius:10px;background:#d97706;color:#fff;font-size:.8rem;font-weight:700;cursor:pointer}
.check-btn:hover{background:#b45309}
.next-btn{display:block;margin:6px auto;padding:8px 20px;border:2px solid #d97706;border-radius:10px;background:transparent;color:#d97706;font-size:.75rem;font-weight:700;cursor:pointer}
.next-btn:hover{background:#fffbeb}
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .score-bar > * { margin: 4px; }
  .var-row > * + * { margin-left: 12px; }
  .bg-preview > * + * { margin-left: 8px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>
<h1>🏆 Νίκη ή Ήττα</h1>
<p class="subtitle">Διάλεξε το σωστό υπόβαθρο ανάλογα με το αποτέλεσμα!</p>
<div class="score-bar">
<span class="sc"><span class="sl">Πόντοι:</span> <span id="pts">0</span></span>
<span class="sc"><span class="sl">Γύρος:</span> <span id="qNum">1</span>/<span id="qTotal">5</span></span>
</div>
<div class="card" id="main"></div>
<script>
var scenarios=[
{pts:10,lives:2,answer:'niki',explain:'Πόντοι=10 → Νίκη! Η Έλλη μάζεψε 10 αστερίες.'},
{pts:3,lives:0,answer:'itta',explain:'Ζωές=0 → Ήττα! Η Έλλη έχασε όλες τις ζωές.'},
{pts:10,lives:0,answer:'niki',explain:'Πόντοι=10 ΚΑΙ ζωές=0 → Πρώτος έλεγχος: πόντοι=10, άρα Νίκη!'},
{pts:7,lives:0,answer:'itta',explain:'Ζωές=0 και πόντοι<10 → Ήττα! Δεν πρόλαβε να μαζέψει 10.'},
{pts:10,lives:1,answer:'niki',explain:'Πόντοι=10 και ζωές>0 → Νίκη! Μάζεψε 10 χωρίς να χάσει όλες τις ζωές.'}
];
var curQ=0,pts=0,selected=null,checked=false;

function initQ(){selected=null;checked=false;}

function render(){
document.getElementById('qNum').textContent=curQ+1;
document.getElementById('pts').textContent=pts;
var s=scenarios[curQ];
var main=document.getElementById('main');
var h='';
h+='<div class="game-scene">';
h+='<div class="scene-label">🎮 Κατάσταση Παιχνιδιού — Τέλος!</div>';
h+='<div class="var-row">';
h+='<div class="vbox v-pts"><div class="vl">Πόντοι</div><div class="vv">'+s.pts+'</div></div>';
h+='<div class="vbox v-lives"><div class="vl">Ζωές</div><div class="vv">'+s.lives+'</div></div>';
h+='</div>';
h+='</div>';
h+='<div class="info-text">Ποιο υπόβαθρο πρέπει να εμφανιστεί;</div>';
h+='<div class="bg-preview">';
var opts=[{id:'niki',icon:'🎉',name:'Νίκη'},{id:'itta',icon:'😢',name:'Ήττα'}];
for(var i=0;i<opts.length;i++){
var cls='bg-opt';
if(!checked&&selected===opts[i].id)cls+=' selected';
if(checked){
if(opts[i].id===s.answer)cls+=' correct';
else if(selected===opts[i].id)cls+=' wrong';
}
h+='<div class="'+cls+'" onclick="pickBg(\''+opts[i].id+'\')">';
h+='<div class="bg-icon">'+opts[i].icon+'</div>';
h+='<div class="bg-name">'+opts[i].name+'</div>';
h+='</div>';
}
h+='</div>';
if(!checked&&selected!==null){
h+='<button class="check-btn" onclick="checkAnswer()">✓ Έλεγχος</button>';
}
if(checked){
var correct=selected===s.answer;
if(correct)pts+=10;
document.getElementById('pts').textContent=pts;
h+='<div class="result-msg '+(correct?'ok':'bad')+'">'+(correct?'✅ '+s.explain:'❌ '+s.explain)+'</div>';
if(curQ<scenarios.length-1){
h+='<button class="next-btn" onclick="nextQ()">Επόμενος Γύρος ▶</button>';
}
}
main.innerHTML=h;
}

function pickBg(id){selected=id;render();}
function checkAnswer(){checked=true;render();}
function nextQ(){if(curQ<scenarios.length-1){curQ++;initQ();render();}}

initQ();render();
</script>
</body>
</html>
