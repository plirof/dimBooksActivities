<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Τι κάνει η συσκευή; 🔍</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(102,126,234,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.4rem; }
  .header p { font-size: .9rem; opacity: .9; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #764ba2; }
  .round { font-size: 1rem; color: #888; }
  .desc-card {
    background: #fff9db; border: 3px solid #f0c040; border-radius: 20px;
    padding: 28px 20px; margin-bottom: 18px; text-align: center;
    box-shadow: 0 4px 16px rgba(240,192,64,.2);
  }
  .desc-emoji { font-size: 2.5rem; margin-bottom: 8px; }
  .desc-text { font-size: 1.15rem; color: #6b5900; line-height: 1.6; font-weight: 600; }
  .choices-grid { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 12px; margin-bottom: 14px; }
  .choice-card {
    background: #fff; border: 3px solid #e0e0e0; border-radius: 18px;
    padding: 18px 10px; text-align: center; cursor: pointer;
    transition: all .2s ease; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .choice-card:active { transform: scale(.95); }
  .choice-card .c-emoji { font-size: 2.8rem; margin-bottom: 4px; }
  .choice-card .c-name { font-size: 1rem; font-weight: 700; color: #2d3436; }
  .choice-card.correct { border-color: #28a745; background: #d4edda; animation: pop .4s ease; }
  .choice-card.wrong { border-color: #dc3545; background: #f8d7da; animation: shake .4s ease; }
  .choice-card.disabled { pointer-events: none; opacity: .7; }
  @keyframes pop { 0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)} }
  .feedback { text-align:center; padding:14px; border-radius:16px; font-size:1.1rem; font-weight:700; margin-bottom:12px; display:none; }
  .feedback.show{display:block}
  .feedback.yay{background:#d4edda;color:#155724}
  .feedback.nay{background:#f8d7da;color:#721c24}
  .result-screen {
    background:#fff; border-radius:24px; box-shadow:0 8px 28px rgba(0,0,0,.1);
    padding:40px 24px; text-align:center; display:none;
  }
  .result-screen .big-emoji{font-size:5rem;margin-bottom:12px}
  .result-screen h2{font-size:1.6rem;color:#2d3436;margin-bottom:8px}
  .result-screen p{font-size:1.1rem;color:#666;margin-bottom:20px}
  .btn-restart {
    background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; border:none;
    border-radius:16px; padding:14px 36px; font-size:1.2rem; font-weight:700;
    cursor:pointer; font-family:inherit; box-shadow:0 4px 14px rgba(102,126,234,.35);
  }
  .btn-restart:active{transform:scale(.95)}
  @media(max-width:480px){
    body{padding:8px}
    .header h1{font-size:1.15rem}
    .desc-text{font-size:1.05rem}
    .choice-card .c-emoji{font-size:2.2rem}
  }
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🔍 Τι κάνει η συσκευή;</h1>
    <p>Ταίριαξε τη δουλειά με τη συσκευή!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="round" id="roundDisplay">1/8</span>
  </div>
  <div id="gameArea">
    <div class="desc-card">
      <div class="desc-emoji" id="descEmoji">✍️</div>
      <div class="desc-text" id="descText">Γράφω γράμματα, σύμβολα και αριθμούς</div>
    </div>
    <div class="choices-grid" id="choicesGrid"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg"></p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var questions = [
    { emoji:'✍️', text:'Γράφω γράμματα, σύμβολα και αριθμούς', answer:0,
      choices:[{emoji:'⌨️',name:'Πληκτρολόγιο'},{emoji:'🖱️',name:'Ποντίκι'},{emoji:'🖥️',name:'Οθόνη'},{emoji:'🎤',name:'Μικρόφωνο'}] },
    { emoji:'👉', text:'Κουνάω τον δείκτη στην οθόνη', answer:1,
      choices:[{emoji:'⌨️',name:'Πληκτρολόγιο'},{emoji:'🖱️',name:'Ποντίκι'},{emoji:'🖨️',name:'Εκτυπωτής'},{emoji:'📷',name:'Κάμερα'}] },
    { emoji:'🖨️', text:'Τυπώνει κείμενο και εικόνες στο χαρτί', answer:2,
      choices:[{emoji:'🎧',name:'Ακουστικά'},{emoji:'🔊',name:'Ηχεία'},{emoji:'🖨️',name:'Εκτυπωτής'},{emoji:'⌨️',name:'Πληκτρολόγιο'}] },
    { emoji:'🖥️', text:'Βλέπω κείμενο και εικόνες', answer:3,
      choices:[{emoji:'🖱️',name:'Ποντίκι'},{emoji:'🎤',name:'Μικρόφωνο'},{emoji:'📷',name:'Κάμερα'},{emoji:'🖥️',name:'Οθόνη'}] },
    { emoji:'🎤', text:'Βάζω φωνή και ήχους στον υπολογιστή', answer:4,
      choices:[{emoji:'🎧',name:'Ακουστικά'},{emoji:'🔊',name:'Ηχεία'},{emoji:'🖥️',name:'Οθόνη'},{emoji:'🎤',name:'Μικρόφωνο'}] },
    { emoji:'🔊', text:'Ακούω μουσική από τον υπολογιστή', answer:5,
      choices:[{emoji:'⌨️',name:'Πληκτρολόγιο'},{emoji:'🖱️',name:'Ποντίκι'},{emoji:'🔊',name:'Ηχεία'},{emoji:'📷',name:'Κάμερα'}] },
    { emoji:'📷', text:'Βάζω φωτογραφίες και βίντεο', answer:6,
      choices:[{emoji:'🎤',name:'Μικρόφωνο'},{emoji:'🖨️',name:'Εκτυπωτής'},{emoji:'🎧',name:'Ακουστικά'},{emoji:'📷',name:'Κάμερα'}] },
    { emoji:'💾', text:'Αποθηκεύει τα δεδομένα μόνιμα', answer:7,
      choices:[{emoji:'🔊',name:'Ηχεία'},{emoji:'💾',name:'Δίσκος Αποθήκευσης'},{emoji:'🖥️',name:'Οθόνη'},{emoji:'⌨️',name:'Πληκτρολόγιο'}] }
  ];
  var qIndex = 0, score = 0;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function startGame(){
    shuffle(questions); qIndex = 0; score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    showQuestion();
  }
  function showQuestion(){
    if(qIndex>=questions.length){showResult();return;}
    var q = questions[qIndex];
    document.getElementById('descEmoji').textContent = q.emoji;
    document.getElementById('descText').textContent = q.text;
    document.getElementById('roundDisplay').textContent = (qIndex+1)+'/'+questions.length;
    document.getElementById('feedback').className = 'feedback'; document.getElementById('feedback').style.display = 'none';
    var grid = document.getElementById('choicesGrid'); grid.innerHTML = '';
    for(var i=0;i<q.choices.length;i++){
      (function(idx){
        var card = document.createElement('div'); card.className = 'choice-card';
        card.setAttribute('data-idx',idx);
        card.innerHTML = '<div class="c-emoji">'+q.choices[idx].emoji+'</div><div class="c-name">'+q.choices[idx].name+'</div>';
        card.addEventListener('click',function(){choose(this,q);});
        grid.appendChild(card);
      })(i);
    }
  }
  function choose(el,q){
    var cards = document.querySelectorAll('.choice-card');
    for(var i=0;i<cards.length;i++)cards[i].classList.add('disabled');
    var chosen = parseInt(el.getAttribute('data-idx'));
    var correct = (chosen === q.answer);
    var fb = document.getElementById('feedback');
    if(correct){
      score++; document.getElementById('scoreDisplay').textContent = '⭐ '+score;
      el.classList.add('correct');
      fb.className = 'feedback show yay';
      fb.textContent = '✅ Μπράβο! Σωστά!';
    } else {
      el.classList.add('wrong');
      cards[q.answer].classList.add('correct');
      fb.className = 'feedback show nay';
      fb.textContent = '❌ Ωχ! Αυτή η δουλειά ταιριάζει με: '+q.choices[q.answer].name+'!';
    }
    setTimeout(function(){qIndex++;showQuestion();},1600);
  }
  function showResult(){
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var total = questions.length, pct = score/total;
    var emoji,title,msg;
    if(pct===1){emoji='🏆';title='Τέλεια!';msg='Γνωρίζεις όλες τις συσκευές! Είσαι σούπερ!';}
    else if(pct>=0.75){emoji='🎉';title='Μπράβο!';msg='Τα πήγες πολύ καλά!';}
    else if(pct>=0.5){emoji='👍';title='Ωραία!';msg='Καλή προσπάθεια! Δοκίμασε ξανά!';}
    else{emoji='💪';title='Καλή αρχή!';msg='Προσπάθησε ξανά! Θα γίνεις ειδικός!';}
    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultMsg').textContent = 'Βρήκες '+score+' από '+total+' σωστά! '+msg;
  }
  startGame();
</script>
</body>
</html>
