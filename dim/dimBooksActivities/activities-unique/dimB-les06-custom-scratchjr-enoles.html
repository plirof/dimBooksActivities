<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ScratchJr Εντολές 🧩</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
    padding: 12px; color: #333; touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #f093fb, #f5576c);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(245,87,108,.4); margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; }
  .header p { font-size: .9rem; opacity: .85; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #f5576c; }
  .level { font-size: 1rem; color: #888; }
  .instruction {
    background: #fff; border-radius: 20px; padding: 16px 18px;
    margin-bottom: 14px; text-align: center; font-size: 1rem;
    font-weight: 700; color: #2d3436;
    box-shadow: 0 4px 14px rgba(0,0,0,.08); line-height: 1.5;
  }
  .match-pair {
    display: grid; grid-template-columns: 1fr 1fr; grid-gap: 12px; margin-bottom: 14px;
  }
  .block-card {
    background: #fff; border-radius: 18px;
    border: 3px solid #e8e8e8; padding: 20px 12px;
    text-align: center; cursor: pointer;
    transition: all .2s; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .block-card:active { transform: scale(.95); }
  .block-card .bc-icon { font-size: 3rem; margin-bottom: 4px; }
  .block-card .bc-label { font-size: .95rem; font-weight: 700; color: #555; }
  .block-card .bc-desc { font-size: .8rem; color: #999; margin-top: 4px; }
  .block-card.selected { border-color: #f5576c; background: #fce4ec; }
  .block-card.matched { border-color: #28a745; background: #d4edda; pointer-events: none; opacity: .7; }
  .block-card.wrong { border-color: #dc3545; background: #f8d7da; animation: shake .4s ease; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
  .task-area {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 20px; margin-bottom: 14px; text-align: center;
  }
  .task-area .ta-emoji { font-size: 3.5rem; margin-bottom: 4px; }
  .task-area .ta-question { font-size: 1.1rem; font-weight: 700; color: #2d3436; line-height: 1.5; }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; display: none;
  }
  .feedback.show { display: block; }
  .feedback.yay { background: #d4edda; color: #155724; }
  .feedback.nay { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff;
    border: none; border-radius: 16px; padding: 14px 36px;
    font-size: 1.2rem; font-weight: 700; cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 14px rgba(245,87,108,.35); transition: transform .15s;
  }
  .btn-restart:active { transform: scale(.95); }
  @media (max-width:480px) {
    body { padding: 8px; }
    .header h1 { font-size: 1.2rem; }
    .match-pair { grid-gap: 8px; }
    .block-card .bc-icon { font-size: 2.5rem; }
  }
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>🧩 ScratchJr Εντολές</h1>
    <p>Ταίριαξε κάθε εντολή με τη δουλειά της!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="level" id="levelDisplay">1/8</span>
  </div>
  <div id="gameArea">
    <div class="instruction">👆 Πάτα την εντολή που κάνει αυτό που λέει η καρτούλα!</div>
    <div class="task-area" id="taskArea"></div>
    <div class="match-pair" id="pairGrid"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>
<script>
  var questions = [
    { emoji: '⚽', text: 'Κάνει την μπάλα να κινηθεί δεξιά', answer: 0, choices: [
      { icon: '➡️', label: 'Κινήσου δεξιά' }, { icon: '⬅️', label: 'Κινήσου αριστερά' },
      { icon: '⬆️', label: 'Πήδα' }, { icon: '🏃', label: 'Πήγαινε στην αρχή' }
    ]},
    { emoji: '🔁', text: 'Επαναλαμβάνει εντολές πολλές φορές', answer: 1, choices: [
      { icon: '🟢', label: 'Ξεκίνα με πράσινη σημαία' }, { icon: '🔄', label: 'Επανάλαβε' },
      { icon: '😊', label: 'Εμφάνισε εικονίδιο' }, { icon: '⏹️', label: 'Σταμάτα' }
    ]},
    { emoji: '🟢', text: 'Ξεκινάει όλους τους χαρακτήρες μαζί', answer: 0, choices: [
      { icon: '🟢', label: 'Ξεκίνα με πράσινη σημαία' }, { icon: '🔁', label: 'Επανάλαβε για πάντα' },
      { icon: '❤️', label: 'Εμφάνισε καρδιά' }, { icon: '⏹️', label: 'Κόκκινο stop' }
    ]},
    { emoji: '🐸', text: 'Κάνει τον ήρωα να πηδήξει', answer: 2, choices: [
      { icon: '➡️', label: 'Κινήσου δεξιά' }, { icon: '⬅️', label: 'Κινήσου αριστερά' },
      { icon: '⬆️', label: 'Πήδα' }, { icon: '🏃', label: 'Πήγαινε στην αρχή' }
    ]},
    { emoji: '🏃', text: 'Γυρίζει τον ήρωα στην αρχική θέση', answer: 3, choices: [
      { icon: '🔄', label: 'Επανάλαβε' }, { icon: '⬅️', label: 'Κινήσου αριστερά' },
      { icon: '⬆️', label: 'Πήδα' }, { icon: '🏃', label: 'Πήγαινε στην αρχή' }
    ]},
    { emoji: '⏺️', text: 'Αλλάζει την ταχύτητα κίνησης', answer: 0, choices: [
      { icon: '🐢', label: 'Όρισε ταχύτητα' }, { icon: '🔁', label: 'Επανάλαβε για πάντα' },
      { icon: '🔄', label: 'Επανάλαβε' }, { icon: '⏹️', label: 'Σταμάτα' }
    ]},
    { emoji: '♾️', text: 'Επαναλαμβάνει εντολές για πάντα', answer: 1, choices: [
      { icon: '🟢', label: 'Ξεκίνα με πράσινη σημαία' }, { icon: '♾️', label: 'Επανάλαβε για πάντα' },
      { icon: '🔄', label: 'Επανάλαβε' }, { icon: '⏹️', label: 'Σταμάτα' }
    ]},
    { emoji: '⏹️', text: 'Σταματάει όλους τους ήρωες', answer: 3, choices: [
      { icon: '🟢', label: 'Πράσινη σημαία' }, { icon: '🔁', label: 'Επανάλαβε' },
      { icon: '❤️', label: 'Εμφάνισε εικονίδιο' }, { icon: '⏹️', label: 'Κόκκινο stop' }
    ]}
  ];
  var cur=0, score=0;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function startGame(){shuffle(questions);cur=0;score=0;
    document.getElementById('scoreDisplay').textContent='⭐ 0';
    document.getElementById('gameArea').style.display='block';
    document.getElementById('resultScreen').style.display='none';
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';loadLevel();}
  function loadLevel(){
    if(cur>=questions.length){showResult();return;}
    var q=questions[cur];
    document.getElementById('levelDisplay').textContent=(cur+1)+'/'+questions.length;
    document.getElementById('feedback').className='feedback';
    document.getElementById('feedback').style.display='none';
    document.getElementById('taskArea').innerHTML='<div class="ta-emoji">'+q.emoji+'</div><div class="ta-question">'+q.text+'</div>';
    var grid=document.getElementById('pairGrid'); grid.innerHTML='';
    for(var i=0;i<q.choices.length;i++){
      (function(idx){
        var card=document.createElement('div'); card.className='block-card';
        card.innerHTML='<div class="bc-icon">'+q.choices[idx].icon+'</div><div class="bc-label">'+q.choices[idx].label+'</div>';
        card.addEventListener('click',function(){choose(idx);});
        grid.appendChild(card);
      })(i);
    }
  }
  function choose(idx){
    var q=questions[cur]; var fb=document.getElementById('feedback');
    var cards=document.querySelectorAll('.block-card');
    for(var i=0;i<cards.length;i++) cards[i].style.pointerEvents='none';
    if(idx===q.answer){score++;
      document.getElementById('scoreDisplay').textContent='⭐ '+score;
      cards[idx].classList.add('matched');
      fb.className='feedback show yay';
      fb.textContent='✅ Μπράβο! Αυτή είναι η σωστή εντολή!';
    }else{
      cards[idx].classList.add('wrong'); cards[q.answer].classList.add('matched');
      fb.className='feedback show nay';
      fb.textContent='❌ Δεν είναι αυτή! Η σωστή εντολή είναι η άλλη!';
    }
    setTimeout(function(){cur++;loadLevel();},1800);
  }
  function showResult(){
    document.getElementById('gameArea').style.display='none';
    document.getElementById('resultScreen').style.display='block';
    var total=questions.length; var pct=score/total;
    var emoji,title,msg;
    if(pct===1){emoji='🏆';title='Τέλεια!';msg='Ξέρεις όλες τις εντολές του ScratchJr! Είσαι προγραμματιστής!';}
    else if(pct>=0.75){emoji='🎉';title='Μπράβο!';msg='Ξέρεις σχεδόν όλες τις εντολές!';}
    else if(pct>=0.5){emoji='👍';title='Ωραία!';msg='Καλή προσπάθεια! Συνέχισε να μαθαίνεις!';}
    else{emoji='💪';title='Καλή αρχή!';msg='Προσπάθησε ξανά! Θα μάθεις όλες τις εντολές!';}
    document.getElementById('resultEmoji').textContent=emoji;
    document.getElementById('resultTitle').textContent=title;
    document.getElementById('resultMsg').textContent='Βρήκες '+score+' από '+total+' σωστά! '+msg;
  }
  startGame();
</script>
</body>
</html>
