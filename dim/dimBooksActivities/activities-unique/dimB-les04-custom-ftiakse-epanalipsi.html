<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Φτιάξε την Επανάληψη 🧱</title>
<link rel="stylesheet" href="../fonts/emoji-font.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'EmojiFont', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
    padding: 12px;
    color: #333;
    touch-action: manipulation;
  }
  .app-container { max-width: 560px; margin: 0 auto; }
  .header {
    text-align: center; padding: 18px 16px 12px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 20px; color: #fff;
    box-shadow: 0 6px 20px rgba(102,126,234,.4);
    margin-bottom: 14px;
  }
  .header h1 { font-size: 1.5rem; }
  .header p { font-size: .9rem; opacity: .85; }
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border-radius: 16px; padding: 10px 18px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .score { font-size: 1.2rem; font-weight: 700; color: #667eea; }
  .level { font-size: 1rem; color: #888; }
  .instruction {
    background: #fff; border-radius: 20px; padding: 16px 18px;
    margin-bottom: 14px; text-align: center; font-size: 1rem;
    font-weight: 700; color: #2d3436;
    box-shadow: 0 4px 14px rgba(0,0,0,.08);
    line-height: 1.5;
  }
  .path-display {
    background: #fff; border-radius: 20px;
    box-shadow: 0 4px 14px rgba(0,0,0,.08);
    padding: 16px; margin-bottom: 14px;
    text-align: center;
  }
  .path-display h3 { font-size: .9rem; color: #888; margin-bottom: 6px; }
  .path-steps {
    display: flex; gap: 4px; justify-content: center; flex-wrap: wrap;
  }
  .path-step {
    background: #e8f5e9; border: 2px solid #a5d6a7;
    border-radius: 10px; padding: 8px 12px;
    font-size: 1.1rem;
  }
  .path-arrow { font-size: 1.2rem; color: #888; }
  .build-area {
    background: #fff; border-radius: 20px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 20px; margin-bottom: 14px;
  }
  .build-area h3 { font-size: .95rem; color: #888; margin-bottom: 10px; text-align: center; }
  .repeat-block-builder {
    background: #f3e5f5; border: 3px solid #ce93d8;
    border-radius: 16px; padding: 16px;
    margin-bottom: 12px;
    text-align: center;
  }
  .repeat-block-builder .rb-title {
    font-size: 1rem; font-weight: 700; color: #8e24aa;
    margin-bottom: 8px;
  }
  .repeat-block-builder .rb-controls {
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  .rb-minus, .rb-plus {
    width: 44px; height: 44px; border-radius: 50%;
    border: 3px solid #ce93d8; background: #fff;
    font-size: 1.4rem; font-weight: 700; color: #8e24aa;
    cursor: pointer; transition: all .15s;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .rb-minus:active, .rb-plus:active { transform: scale(.9); }
  .rb-num {
    font-size: 2.2rem; font-weight: 700; color: #8e24aa;
    min-width: 50px; text-align: center;
  }
  .cmd-pool {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; margin-bottom: 12px;
  }
  .cmd-pool .cmd-btn {
    background: #fff3e0; border: 2px solid #ffcc80;
    border-radius: 12px; padding: 10px 16px;
    font-size: 1rem; font-weight: 600; color: #e65100;
    cursor: pointer; transition: all .15s;
    -webkit-tap-highlight-color: transparent;
    font-family: inherit;
  }
  .cmd-pool .cmd-btn:active { transform: scale(.93); }
  .cmd-pool .cmd-btn.used { opacity: .3; pointer-events: none; }
  .builder-inner {
    background: #fff8e1; border: 2px dashed #ffcc80;
    border-radius: 14px; padding: 12px;
    min-height: 60px; text-align: center;
  }
  .builder-inner .bi-label {
    font-size: .85rem; color: #aaa; font-weight: 600;
  }
  .builder-inner .bi-content {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    margin-top: 6px;
  }
  .builder-inner .bi-cmd {
    background: #fff3e0; border: 2px solid #ffcc80;
    border-radius: 10px; padding: 6px 12px;
    font-size: .95rem; font-weight: 600; color: #e65100;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .builder-inner .bi-cmd .bi-del {
    cursor: pointer; color: #d32f2f; font-size: 1rem;
    margin-left: 4px;
  }
  .btn-check {
    background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
    border: none; border-radius: 16px; padding: 12px 32px;
    font-size: 1.1rem; font-weight: 700; cursor: pointer;
    font-family: inherit; display: block; margin: 0 auto;
    box-shadow: 0 4px 14px rgba(102,126,234,.35);
    transition: transform .15s;
  }
  .btn-check:active { transform: scale(.95); }
  .btn-check:disabled { opacity: .5; pointer-events: none; }
  .feedback {
    text-align: center; padding: 14px; border-radius: 16px;
    font-size: 1.1rem; font-weight: 700; margin-bottom: 12px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.yay { background: #d4edda; color: #155724; }
  .feedback.nay { background: #f8d7da; color: #721c24; }
  .result-screen {
    background: #fff; border-radius: 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.1);
    padding: 40px 24px; text-align: center; display: none;
  }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 12px; }
  .result-screen h2 { font-size: 1.6rem; color: #2d3436; margin-bottom: 8px; }
  .result-screen p { font-size: 1.1rem; color: #666; margin-bottom: 20px; }
  .btn-restart {
    background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
    border: none; border-radius: 16px; padding: 14px 36px;
    font-size: 1.2rem; font-weight: 700; cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(102,126,234,.35);
    transition: transform .15s;
  }
  .btn-restart:active { transform: scale(.95); }
  @media (max-width: 480px) {
    body { padding: 8px; }
    .header h1 { font-size: 1.2rem; }
  }
/* iron61-gap-fallback:start */
@supports not (gap:1px){
  .path-steps > * { margin: 2px; }
  .repeat-block-builder .rb-controls > * + * { margin-left: 12px; }
  .cmd-pool > * { margin: 4px; }
  .builder-inner .bi-content > * { margin: 3px; }
  .builder-inner .bi-cmd > * + * { margin-left: 4px; }
}
/* iron61-gap-fallback:end */
</style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>🧱 Φτιάξε την Επανάληψη</h1>
    <p>Χρησιμοποίησε τις εντολές για να φτιάξεις το πρόγραμμα!</p>
  </div>
  <div class="info-bar">
    <span class="score" id="scoreDisplay">⭐ 0</span>
    <span class="level" id="levelDisplay">1/6</span>
  </div>

  <div id="gameArea">
    <div class="instruction">🛠️ Φτιάξε την εντολή επανάληψης για να ακολουθήσει το βατραχάκι τη διαδρομή!</div>

    <div class="path-display" id="pathDisplay">
      <h3>🐸 Η διαδρομή:</h3>
      <div class="path-steps" id="pathSteps"></div>
    </div>

    <div class="build-area">
      <div class="repeat-block-builder">
        <div class="rb-title">🔁 Επανάλαβε</div>
        <div class="rb-controls">
          <button class="rb-minus" id="rbMinus">−</button>
          <span class="rb-num" id="rbNum">2</span>
          <button class="rb-plus" id="rbPlus">+</button>
          <span style="font-size:1rem;color:#8e24aa;font-weight:600;">φορές</span>
        </div>
      </div>

      <div style="text-align:center;margin-bottom:8px;">
        <span style="font-size:.9rem;color:#888;font-weight:600;">📦 Διάλεξε εντολές:</span>
      </div>
      <div class="cmd-pool" id="cmdPool"></div>

      <div class="builder-inner" id="builderInner">
        <div class="bi-content" id="biContent"></div>
      </div>

      <button class="btn-check" id="btnCheck" onclick="checkBuild()">✅ Έλεγχος</button>
    </div>

    <div class="feedback" id="feedback"></div>
  </div>

  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">Μπράβο!</h2>
    <p id="resultMsg">Τα κατάφερες τέλεια!</p>
    <button class="btn-restart" onclick="startGame()">🔄 Ξανά!</button>
  </div>
</div>

<script>
  // v260924 - διόρθωση: το μήνυμα «Βάλε εδώ...» εμφανιζόταν δύο φορές (αντίγραφο στο HTML + αντίγραφο που
  // προσθαλώνει το renderBuilder όταν είναι άδειο). Έμεινε μόνο το αντίγραφο του renderBuilder.
  var allCommands = ['➡️ Πήδα', '⬅️ Πήδα πίσω', '⬆️ Πήδα πάνω'];
  var levels = [
    { steps: ['➡️','➡️','➡️','➡️'], cmds: ['➡️ Πήδα'], repeat: 4 },
    { steps: ['➡️','⬅️','➡️','⬅️','➡️','⬅️'], cmds: ['➡️ Πήδα', '⬅️ Πήδα πίσω'], repeat: 3 },
    { steps: ['➡️','➡️','⬅️','➡️','➡️','⬅️'], cmds: ['➡️ Πήδα', '➡️ Πήδα', '⬅️ Πήδα πίσω'], repeat: 2 },
    { steps: ['⬆️','⬆️','⬆️','⬆️','⬆️','⬆️'], cmds: ['⬆️ Πήδα πάνω'], repeat: 6 },
    { steps: ['➡️','⬆️','➡️','⬆️','➡️','⬆️','➡️','⬆️'], cmds: ['➡️ Πήδα', '⬆️ Πήδα πάνω'], repeat: 4 },
    { steps: ['➡️','➡️','➡️','⬅️','➡️','➡️','➡️','⬅️','➡️','➡️','➡️','⬅️'], cmds: ['➡️ Πήδα', '➡️ Πήδα', '➡️ Πήδα', '⬅️ Πήδα πίσω'], repeat: 3 }
  ];

  var currentLevel = 0;
  var score = 0;
  var repeatVal = 2;
  var placedCmds = [];

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function startGame() {
    shuffle(levels);
    currentLevel = 0;
    score = 0;
    document.getElementById('scoreDisplay').textContent = '⭐ 0';
    document.getElementById('gameArea').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
    loadLevel();
  }

  function loadLevel() {
    if (currentLevel >= levels.length) {
      showResult();
      return;
    }
    var lv = levels[currentLevel];
    document.getElementById('levelDisplay').textContent = (currentLevel + 1) + '/' + levels.length;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('btnCheck').disabled = false;

    repeatVal = 2;
    document.getElementById('rbNum').textContent = repeatVal;

    var pathEl = document.getElementById('pathSteps');
    pathEl.innerHTML = '';
    for (var i = 0; i < lv.steps.length; i++) {
      if (i > 0) pathEl.innerHTML += '<span class="path-arrow">→</span>';
      pathEl.innerHTML += '<span class="path-step">' + lv.steps[i] + '</span>';
    }

    var pool = document.getElementById('cmdPool');
    pool.innerHTML = '';
    placedCmds = [];
    var usedCount = {};
    for (var j = 0; j < lv.cmds.length; j++) {
      (function(idx) {
        var btn = document.createElement('button');
        btn.className = 'cmd-btn';
        btn.textContent = lv.cmds[idx];
        btn.setAttribute('data-cmd', lv.cmds[idx]);
        btn.addEventListener('click', function() {
          var cmd = btn.getAttribute('data-cmd');
          var count = 0;
          for (var k = 0; k < placedCmds.length; k++) {
            if (placedCmds[k] === cmd) count++;
          }
          var totalNeeded = 0;
          for (var k = 0; k < lv.cmds.length; k++) {
            if (lv.cmds[k] === cmd) totalNeeded++;
          }
          if (count < totalNeeded) {
            btn.classList.add('used');
            placedCmds.push(cmd);
            renderBuilder();
          }
        });
        pool.appendChild(btn);
      })(j);
    }

    renderBuilder();
  }

  function renderBuilder() {
    var content = document.getElementById('biContent');
    content.innerHTML = '';
    for (var i = 0; i < placedCmds.length; i++) {
      (function(idx) {
        var span = document.createElement('span');
        span.className = 'bi-cmd';
        span.innerHTML = placedCmds[idx] + ' <span class="bi-del" data-idx="' + idx + '">✕</span>';
        span.querySelector('.bi-del').addEventListener('click', function(e) {
          var iidx = parseInt(e.target.getAttribute('data-idx'));
          var cmd = placedCmds[iidx];
          placedCmds.splice(iidx, 1);
          var poolBtns = document.querySelectorAll('.cmd-btn');
          for (var b = 0; b < poolBtns.length; b++) {
            if (poolBtns[b].getAttribute('data-cmd') === cmd) {
              var countInPlaced = 0;
              for (var k = 0; k < placedCmds.length; k++) {
                if (placedCmds[k] === cmd) countInPlaced++;
              }
              var totalNeeded = 0;
              var lv = levels[currentLevel];
              for (var k = 0; k < lv.cmds.length; k++) {
                if (lv.cmds[k] === cmd) totalNeeded++;
              }
              if (countInPlaced < totalNeeded) {
                poolBtns[b].classList.remove('used');
              }
            }
          }
          renderBuilder();
        });
        content.appendChild(span);
      })(i);
    }
    if (placedCmds.length === 0) {
      content.innerHTML = '<div class="bi-label">📥 Βάλε εδώ τις εντολές που επαναλαμβάνονται</div>';
    }
  }

  function checkBuild() {
    var lv = levels[currentLevel];
    var fb = document.getElementById('feedback');

    var cmdCorrect = (placedCmds.length === lv.cmds.length);
    if (cmdCorrect) {
      for (var i = 0; i < lv.cmds.length; i++) {
        if (placedCmds[i] !== lv.cmds[i]) {
          cmdCorrect = false;
          break;
        }
      }
    }

    var repeatCorrect = (repeatVal === lv.repeat);

    if (cmdCorrect && repeatCorrect) {
      score++;
      document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
      fb.className = 'feedback show yay';
      fb.textContent = '✅ Μπράβο! Έφτιαξες σωστά την εντολή επανάληψης!';
      document.getElementById('btnCheck').disabled = true;
      setTimeout(function() {
        currentLevel++;
        loadLevel();
      }, 1800);
    } else {
      var msg = '❌ ';
      if (!cmdCorrect) msg += 'Λάθος εντολές! ';
      if (!repeatCorrect) msg += 'Θέλει ' + lv.repeat + ' επαναλήψεις (όχι ' + repeatVal + ')!';
      fb.className = 'feedback show nay';
      fb.textContent = msg;
      setTimeout(function() {
        fb.className = 'feedback';
        fb.style.display = 'none';
      }, 1500);
    }
  }

  document.getElementById('rbMinus').addEventListener('click', function() {
    if (repeatVal > 1) {
      repeatVal--;
      document.getElementById('rbNum').textContent = repeatVal;
    }
  });
  document.getElementById('rbPlus').addEventListener('click', function() {
    if (repeatVal < 12) {
      repeatVal++;
      document.getElementById('rbNum').textContent = repeatVal;
    }
  });

  function showResult() {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';
    var total = levels.length;
    var pct = score / total;
    var emoji, title, msg;
    if (pct === 1) {
      emoji = '🏆'; title = 'Τέλεια!';
      msg = 'Έφτιαξες όλες τις επαναλήψεις σωστά! Είσαι προγραμματιστής!';
    } else if (pct >= 0.75) {
      emoji = '🎉'; title = 'Μπράβο!';
      msg = 'Τα πήγες πολύ καλά!';
    } else if (pct >= 0.5) {
      emoji = '👍'; title = 'Ωραία!';
      msg = 'Καλή προσπάθεια! Δοκίμασε ξανά!';
    } else {
      emoji = '💪'; title = 'Καλή αρχή!';
      msg = 'Προσπάθησε ξανά! Θα γίνεις σούπερ!';
    }
    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultMsg').textContent = 'Βρήκες ' + score + ' από ' + total + ' σωστά! ' + msg;
  }

  startGame();
</script>
</body>
</html>
